<title>Micro-maquettes Boussole</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Une fenêtre à onglets : un onglet par micro-maquette, chacune dans son cadre. Thème unique, sombre (DA du projet). */
:root{
  --bg:#0b0d12; --bande:#10131a; --filet:#232835; --fg:#d8dbe2; --muted:#8a90a0; --gold:#d9b56a; --encre-or:#14110c;
  --ui:"IBM Plex Sans",system-ui,sans-serif; --serif:"Source Serif 4",Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--ui);display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bande)}
.barre{flex:0 0 auto;display:flex;align-items:stretch;gap:2px;background:var(--bande);border-bottom:1px solid var(--filet);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto;scrollbar-width:none}
.barre::-webkit-scrollbar{display:none}
.titre{display:flex;align-items:center;padding-right:16px;margin-right:6px;border-right:1px solid var(--filet);font:600 15px/1 var(--serif);color:#efe9dc;white-space:nowrap}
.onglet{flex:0 0 auto;display:flex;flex-direction:column;gap:3px;justify-content:center;text-align:left;padding:10px 14px 9px;border:0;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;max-width:240px}
.onglet b{font:600 10.5px/1 var(--ui);letter-spacing:.14em;color:inherit}
.onglet span{font:400 12px/1.25 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.onglet:hover{color:var(--fg)}
.onglet[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--gold)}
.onglet[aria-selected="true"] b{color:var(--gold)}
.onglet:focus-visible{outline:1px solid var(--gold);outline-offset:-3px}
.cadres{flex:1 1 auto;position:relative;min-height:0}
.cadres iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
@media (max-width:700px){.titre{display:none}.onglet{padding:9px 10px 8px}.onglet span{display:none}}
</style>
<nav class="barre" role="tablist" id="barre"><span class="titre">Micro-maquettes</span></nav>
<div class="cadres" id="cadres"></div>
<script>
const MICRO = [
  {id: "M01-1", q: "La loi entière, dépliable"},
  {id: "M01-2", q: "Texte · article · alinéa en haut"},
  {id: "M01-3", q: "Barres dépliantes à gauche"},
  {id: "M01-4", q: "Le texte auquel on est exposé"},
  {id: "M01-5", q: "Comparer deux versions"},
];
const barre = document.getElementById("barre"), cadres = document.getElementById("cadres"), charges = {};
MICRO.forEach(m => {
  const b = document.createElement("button");
  b.className = "onglet"; b.id = "onglet-" + m.id; b.setAttribute("role", "tab"); b.dataset.id = m.id;
  b.innerHTML = `<b>${m.id}</b><span>${m.q}</span>`;
  barre.appendChild(b);
});
function montrer(id){
  if (!MICRO.some(m => m.id === id)) id = MICRO[0].id;
  barre.querySelectorAll(".onglet").forEach(b => b.setAttribute("aria-selected", b.dataset.id === id ? "true" : "false"));
  if (!charges[id]){
    const f = document.createElement("iframe"); f.src = id + ".html"; f.title = id; charges[id] = f; cadres.appendChild(f);
  }
  Object.entries(charges).forEach(([k, f]) => f.hidden = k !== id);
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
}
barre.addEventListener("click", e => { const b = e.target.closest(".onglet"); if (b) montrer(b.dataset.id); });
addEventListener("hashchange", () => montrer(location.hash.slice(1)));
montrer(location.hash.slice(1));
</script>

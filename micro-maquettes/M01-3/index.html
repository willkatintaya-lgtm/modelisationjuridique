<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M01-3 · Barres dépliantes à gauche</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../commun/cadre.css">
<style>
.bureau{align-items:flex-start}
.page{--pw:740px}
/* la colonne de gauche : une bande de papier, pas un panneau */
.cote{position:sticky;top:14px;flex:0 0 auto;max-height:calc(100vh - 28px);overflow:auto;scrollbar-width:none;display:flex;gap:6px}
.cote::-webkit-scrollbar{display:none}
.bande{background:linear-gradient(135deg,#efebe1,#e4ded0);color:var(--ink);border:1px solid var(--rule);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.bt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 12px 9px;font:600 9.5px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted-p);border-bottom:1px solid var(--rule)}
.bt .chev{display:inline-block;transition:transform .2s;font-size:9px}
.bt.ouvert .chev{transform:rotate(90deg)}
.bt .val{margin-left:auto;font:400 12px/1.2 var(--serif);letter-spacing:0;text-transform:none;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.bt.ouvert .val{display:none}
.li{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;padding:5px 12px;font:400 13.5px/1.3 var(--serif);color:var(--ink2)}
.li:hover{background:rgba(217,181,106,.16)}
.li.on{color:var(--ink);box-shadow:inset 3px 0 0 var(--gold);background:rgba(217,181,106,.12)}
.li.vu:not(.on){box-shadow:inset 3px 0 0 rgba(140,47,34,.35)}
.li .k{font:500 10.5px var(--ui);color:var(--muted-p);min-width:34px}
.li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.off{opacity:.42;cursor:default;font-style:italic}
.li small{font:400 10.5px var(--ui);color:var(--muted-p);margin-left:auto;white-space:nowrap}
/* A : arbre */
.arbre{width:280px;padding-bottom:6px}
.arbre .n1{padding-left:12px}.arbre .n2{padding-left:26px}.arbre .n3{padding-left:40px}
.arbre .tog{display:inline-block;width:12px;font:400 9px var(--ui);color:var(--muted-p);transition:transform .2s}
.arbre .tog.o{transform:rotate(90deg)}
/* B : barres empilées */
.pile{width:280px;display:flex;flex-direction:column;height:calc(100vh - 28px)}
.pile .sec{border-bottom:1px solid var(--rule);flex:0 0 auto}
.pile .sec.o{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.pile .sec:last-child{border-bottom:0}
.pile .sec .bt{border-bottom:0}
.pile .sec .contenu{padding:2px 0 8px;flex:1 1 auto;min-height:0;overflow:auto;scrollbar-width:none}
.pile .sec.textes .contenu{flex:0 0 auto}
.pile .sec.textes.o{flex:0 0 auto}
/* C : colonnes repliables */
.cols{display:flex;gap:6px}
.col{width:200px;display:flex;flex-direction:column;max-height:calc(100vh - 28px)}
.col .contenu{overflow:auto;scrollbar-width:none;padding:2px 0 8px}
.col.replie{width:38px;cursor:pointer}
.col.replie .bt{writing-mode:vertical-rl;transform:rotate(180deg);border-bottom:0;padding:12px 10px;height:100%;justify-content:flex-end}
.col.replie .bt .val{display:block;max-width:none;font-size:12.5px}
.col.replie .bt .chev{transform:rotate(0)}
.col.replie .contenu{display:none}
/* le texte entier à droite */
.t-art{padding:16px 0 8px;border-top:1px solid var(--rule);scroll-margin-top:16px}
.t-art h3{margin:0 0 8px;display:flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap}
.t-art h3 .nom{font:600 10.5px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.t-art h3 .tit{font:600 16.5px/1.35 var(--serif);flex:1 1 280px}
.t-art.flash{animation:flash 1.4s}
.t-art .al{scroll-margin-top:30vh;padding:1px 6px;margin-left:-6px}
.t-art .al.flash{animation:flashal 1.6s}
@keyframes flash{0%{box-shadow:inset 3px 0 0 var(--gold)}100%{box-shadow:inset 3px 0 0 transparent}}
@keyframes flashal{0%,40%{background:rgba(217,181,106,.35)}100%{background:transparent}}
.sommaire-btn{display:none}
/* comparer : les coches n'apparaissent qu'après « Comparer les articles / les alinéas » */
.coche{flex:0 0 auto;width:13px;height:13px;border:1px solid var(--muted-p);margin-right:2px;align-self:center;position:relative;cursor:pointer;background:rgba(255,255,255,.4)}
.coche:hover{border-color:#8a6a2a}
.coche.on{background:var(--ink);border-color:var(--ink)}
.coche.on::after{content:"";position:absolute;left:3.5px;top:0.5px;width:4px;height:8px;border:solid var(--paper);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.bandeau{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin:10px 0 0;padding:8px 12px;border:1px solid var(--rule);background:rgba(217,181,106,.12);font:400 12.5px var(--ui);color:var(--ink2)}
.bandeau button{color:var(--ink);text-decoration:underline dotted var(--rule);text-decoration-thickness:1.5px;text-underline-offset:3px}
.cmp-btn{display:flex;align-items:center;gap:8px;width:calc(100% - 24px);margin:6px 12px 6px;padding:6px 10px;font:500 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);border:1px dashed var(--muted-p);background:rgba(255,255,255,.3)}
.cmp-btn:hover{border-color:#8a6a2a;color:var(--ink)}
.cmp-btn.on{border-style:solid;border-color:var(--ink);background:var(--ink);color:var(--paper)}
#droite{flex-direction:column;align-items:center}
#cmp{width:100%}
#cmp>.bandeau{margin:0 0 16px;background:rgba(217,181,106,.08);border-color:#3a3f4c;color:var(--fg)}
#cmp>.bandeau button{color:var(--gold);text-decoration-color:var(--gold)}
.fenetres{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;align-items:start}
.page.fen{width:100%;padding:28px 30px 30px;outline-width:8px;outline-offset:-8px}
.page.fen .runhead{margin-bottom:12px;align-items:baseline}
.page.fen .x{font:400 18px/1 var(--ui);color:var(--muted-p);margin-left:auto;padding:0 2px}
.page.fen .x:hover{color:var(--ink)}
.fen-tit{font:600 16px/1.35 var(--serif);margin:0 0 10px}
.fen-corps{max-height:calc(100vh - 230px);overflow:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent);mask-image:linear-gradient(#000 calc(100% - 28px),transparent);padding-bottom:20px}
.fen-corps::-webkit-scrollbar{display:none}
.fen-corps .al{font-size:15px}
/* les petits modules sous l'article courant */
.modules{margin:2px 0 14px;padding:10px 12px 8px;border:1px solid var(--rule);background:rgba(255,255,255,.3)}
.modules .tt{font:600 9.5px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted-p);margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pastilles{display:flex;flex-wrap:wrap;gap:5px}
.pastilles button,.pastilles span.p{display:inline-flex;align-items:center;gap:6px;font:400 12.5px/1 var(--ui);color:var(--ink2);padding:6px 8px;border:1px solid var(--rule);background:rgba(255,255,255,.45)}
.pastilles button:hover{border-color:var(--gold)}
.pastilles button.on{border-color:var(--ink);box-shadow:inset 0 -2px 0 var(--gold);color:var(--ink)}
.pastilles i{width:8px;height:8px;display:inline-block}
.pastilles b{font-weight:600;color:var(--ink)}
.liste-am{margin:10px 0 2px;border-top:1px solid var(--rule)}
.liste-am .am{display:grid;grid-template-columns:64px 1fr auto;gap:4px 10px;padding:6px 0;border-bottom:1px solid rgba(201,191,166,.5);font:400 13.5px/1.4 var(--serif)}
.liste-am .am .num{font:500 11px var(--ui);color:var(--muted-p);padding-top:2px}
.liste-am .am .sort{font:500 9.5px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted-p);padding-top:3px;white-space:nowrap}
.liste-am .am .sort.adopte{color:var(--stamp)}
@media (max-width:980px){
  .bureau{flex-direction:column;align-items:stretch}
  .cote{position:sticky;top:0;z-index:5;max-height:none;overflow:visible;flex-direction:column}
  .sommaire-btn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 14px;font:600 10px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:linear-gradient(135deg,#efebe1,#e4ded0);border:1px solid var(--rule)}
  .sommaire-btn .val{font:400 13px var(--serif);letter-spacing:0;text-transform:none;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
  .cote .tiroir{display:none;max-height:60vh;overflow:auto;scrollbar-width:none}
  .cote.ouvert .tiroir{display:block}
  .arbre,.pile{width:100%}.pile{height:auto}.pile .sec.o{flex:0 0 auto;display:block}.pile .sec .contenu{max-height:30vh}
  .cols{flex-direction:column}.col{width:100%;max-height:none}.col .contenu{max-height:34vh}
  .col.replie{width:100%}.col.replie .bt{writing-mode:horizontal-tb;transform:none;height:auto;justify-content:flex-start;border-bottom:1px solid var(--rule)}
  .col.replie .bt .val{display:block;margin-left:auto}
  .page{width:100%}
}
</style>
<script>window.MAQ = "micro-M01-3";</script>
<script src="../../maquettes/commun/data.js"></script>
<script src="../../maquettes/commun/base.js"></script>
<script src="../../maquettes/commun/modele.js"></script>
<script src="../../maquettes/commun/noyau.js"></script>
<script src="../commun/cadre.js"></script>
<script src="../commun/lecture.js"></script>
</head><body>
<p class="consigne" id="consigne"></p>
<main class="bureau"><aside class="cote" id="cote"></aside><div id="droite" style="flex:1 1 auto;display:flex;justify-content:center;min-width:0"></div></main>
<script>
"use strict";
const CONSIGNES = [
  "<b>L'arbre.</b> Deux barres : « type de texte », fermée sur le texte choisi ; « articles et alinéas », les alinéas dépliés sous leur article. Choisir un texte referme sa barre ; la barre des articles reste ouverte pour en parcourir plusieurs. Le texte entier reste à droite.",
  "<b>Les barres empilées.</b> Trois barres fixes, toujours dans le même ordre : type de texte, articles, alinéas. Choisir un texte referme sa barre et l'on revient au menu ; les barres des articles et des alinéas restent ouvertes pour cliquer successivement. Le texte entier reste à droite.",
  "<b>Les colonnes repliables.</b> Trois colonnes : type de texte, articles, alinéas. Choisir un texte replie sa colonne en un dos qui porte sa valeur ; articles et alinéas restent ouverts. Le texte entier reste à droite.",
];
let st = {texte: "transmis", art: "4", al: 12}, V = 0, vu = {art: "4", al: null};
const ouv = {textes: false, articles: true, alineas: false, arbreArt: null};   // la barre des textes se referme après un choix ; articles et alinéas restent ouverts
let droiteTexte = null;
const COCHES = new Set(), COCHES_AL = new Set(), COMP = {mode: null}, GROUPE_OUVERT = {g: null};   // COMP.mode : null | "articles" | "alineas"
function fenetreArt(num){
  const p = LEC.art(st.texte, num), A = MM.art4(st.texte);
  const corps = p.presence === "supprime" ? `<p class="al" style="font-style:italic">(Supprimé)</p>` : p.texte ? A.map((t, i) => MM.alHTML(t, i + 1)).join("") : `<p class="nontexte">Texte non chargé dans le prototype.</p>`;
  return `<article class="page fen"><div class="runhead"><span>Article ${LEC.nomArt(num)}</span><span>${esc(ET[st.texte].court)}</span><button class="x" data-retire="${esc(num)}" title="retirer de la comparaison">×</button></div><p class="fen-tit">${esc(p.titre)}</p><div class="fen-corps">${corps}</div></article>`;
}
function fenetreAl(k){
  const t = MM.art4(st.texte)[k - 1];
  return `<article class="page fen"><div class="runhead"><span>Article 4 · alinéa ${k}</span><span>${esc(ET[st.texte].court)}</span><button class="x" data-retire-al="${k}" title="retirer de la comparaison">×</button></div><div class="fen-corps">${MM.alHTML(t, k)}</div></article>`;
}
function majComparaison(){
  const lect = document.getElementById("lecture"), cmp = document.getElementById("cmp"); if (!lect || !cmp) return;
  const sel = COMP.mode === "articles" ? [...COCHES].filter(n => LEC.art(st.texte, n) && LEC.art(st.texte, n).presence !== "absent") : COMP.mode === "alineas" ? [...COCHES_AL].filter(k => k <= (MM.art4(st.texte) || []).length).sort((x, y) => x - y) : [];
  if (!COMP.mode || !sel.length){ cmp.hidden = true; lect.hidden = false;
    const b = document.getElementById("bandeau"); if (b) b.innerHTML = COMP.mode ? `<div class="bandeau"><span>Comparer ${COMP.mode === "articles" ? "les articles" : "les alinéas"} : cochez-en deux ou plus dans la barre de gauche.</span><button data-fin>annuler</button></div>` : "";
    return; }
  lect.hidden = true; cmp.hidden = false; const bd = document.getElementById("bandeau"); if (bd) bd.innerHTML = "";
  cmp.innerHTML = `<div class="bandeau"><span>Comparaison · ${sel.length} ${COMP.mode === "articles" ? plural(sel.length, "article") : plural(sel.length, "alinéa")} · ${esc(ET[st.texte].court)} · chacun dans sa fenêtre</span><button data-fin>fin de la comparaison</button></div>
    <div class="fenetres">${sel.map(x => COMP.mode === "articles" ? fenetreArt(x) : fenetreAl(x)).join("")}</div>`;
}
const cleQui = a => a.inst ? "i:" + a.inst : "g:" + (a.groupe || "?");
const nomQui = k => k.startsWith("i:") ? INS[k.slice(2)].name : NX.groupName(k.slice(2));
const couleurQui = k => k.startsWith("i:") ? INS[k.slice(2)].color : NX.groupColor(k.slice(2));
function modulesHTML(p){
  if (p.presence !== "present") return "";
  if (!p.texte){
    const ent = Object.entries(p.amendements || {}).sort((x, y) => y[1] - x[1]);
    return `<div class="modules"><div class="tt"><span>Amendements en commission (Assemblée) · ${p.n}</span><span>par sort ; le détail par groupe n'est chargé que pour l'article 4</span></div><div class="pastilles">${ent.map(([k, n]) => `<span class="p">${esc(k)} <b>${n}</b></span>`).join("") || `<span class="p">aucun</span>`}</div></div>`;
  }
  const ams = ALL.filter(a => !isEcarte(a) && a.mode !== "hors-texte"), m = new Map();
  for (const a of ams){ const k = cleQui(a); if (!m.has(k)) m.set(k, []); m.get(k).push(a); }
  const ent = [...m.entries()].sort((x, y) => y[1].length - x[1].length), g = GROUPE_OUVERT.g;
  const liste = g && m.has(g) ? `<div class="liste-am">${m.get(g).map(a => `<div class="am"><span class="num">${esc(a.num)}</span><span>${esc(short(objetOf(a), 130))}</span><span class="sort${a.sort === "Adopté" ? " adopte" : ""}">${esc(sortWord(a))}</span></div>`).join("")}</div>` : "";
  return `<div class="modules"><div class="tt"><span>Propositions d'amendement en commission (Assemblée) · ${ams.length} examinées sur ${p.n} déposées (hors irrecevables et retirés)</span><span>par auteur ; cliquer un groupe pour ses amendements</span></div>
    <div class="pastilles">${ent.map(([k, l]) => { const ad = l.filter(a => a.sort === "Adopté").length; return `<button class="${k === g ? "on" : ""}" data-groupe="${esc(k)}"><i style="background:${couleurQui(k)}"></i>${esc(nomQui(k))} <b>${l.length}</b>${ad ? ` <span style="color:var(--stamp)">· ${ad} ${plural(ad, "adopté")}</span>` : ""}</button>`; }).join("")}</div>${liste}</div>`;
}
function majModules(){
  document.querySelectorAll(".t-art .modules").forEach(x => x.remove());
  const sct = document.getElementById("art-" + st.art); if (!sct) return;
  const p = LEC.art(st.texte, st.art); if (!p) return;
  sct.querySelector("h3").insertAdjacentHTML("afterend", modulesHTML(p));
}
function rendreDroite(){
  if (droiteTexte === st.texte) return; droiteTexte = st.texte;
  const plan = LEC.planDe(st.texte), A = MM.art4(st.texte);
  const corps = plan.filter(p => p.presence !== "absent").map(p => `<section class="t-art" id="art-${esc(p.num)}" data-art="${esc(p.num)}">
    <h3><span class="nom">Article <span class="num">${LEC.nomArt(p.num)}</span></span><span class="tit">${esc(p.titre)}</span>${p.n ? `<span class="compte">${p.n} am.</span>` : ""}</h3>
    ${p.presence === "supprime" ? `<p class="al" style="font-style:italic">(Supprimé)</p>` : p.texte ? A.map((t, i) => `<p class="al" id="al-${i + 1}" data-al="${i + 1}"><span class="n">${i + 1}</span>${esc(t)}</p>`).join("") : `<p class="nontexte">Texte non chargé dans le prototype.</p>`}</section>`).join("");
  document.getElementById("droite").innerHTML = `<div id="lecture" style="width:100%;display:flex;justify-content:center">` + MM.page(`${esc(D.dossier.uid)} · ${esc(ET[st.texte].label)}`, "le texte entier", MM.entete() + `<p class="sous">${plan.filter(p => p.presence !== "absent").length} articles · ${esc(MM.ST[st.texte].titre)}</p><div id="bandeau"></div>` + corps) + `</div><div id="cmp" hidden></div>`;
  observer();
}
const liTexte = s => `<button class="li${s.id === st.texte ? " on" : ""}" data-texte="${s.id}"><span class="t">${esc(s.titre)}</span>${s.examine ? "<small>examiné</small>" : ""}</button>`;
const liArt = p => `<button class="li${p.num === st.art ? " on" : ""}${p.num === vu.art && p.num !== st.art ? " vu" : ""}${p.presence === "absent" ? " off" : ""}" data-art="${esc(p.num)}">${p.presence === "absent" || COMP.mode !== "articles" ? "" : `<span class="coche${COCHES.has(p.num) ? " on" : ""}" data-coche="${esc(p.num)}" title="comparer cet article"></span>`}<span class="k">${LEC.nomArt(p.num)}</span><span class="t">${esc(p.titre)}</span></button>`;
const liAl = (t, i) => `<button class="li${i + 1 === st.al ? " on" : ""}${i + 1 === vu.al && i + 1 !== st.al ? " vu" : ""}" data-al="${i + 1}">${COMP.mode === "alineas" ? `<span class="coche${COCHES_AL.has(i + 1) ? " on" : ""}" data-coche-al="${i + 1}" title="comparer cet alinéa"></span>` : ""}<span class="k">${i + 1}</span><span class="t">${esc(t)}</span></button>`;
const bt = (cle, titre, val) => `<button class="bt${ouv[cle] ? " ouvert" : ""}" data-tog="${cle}"><span class="chev">▸</span>${titre}<span class="val">${val}</span></button>`;
const valTexte = () => esc(ET[st.texte].court), valArt = () => "Art. " + LEC.nomArt(st.art), valAl = () => st.art === "4" ? "al. " + st.al : "—";
function gaucheA(){
  const plan = LEC.planDe(st.texte), A = MM.art4(st.texte);
  const textes = ouv.textes ? LEC.TEXTES.map(s => `<button class="li n1${s.id === st.texte ? " on" : ""}" data-texte="${s.id}"><span class="t">${esc(s.titre)}</span>${s.examine ? "<small>examiné</small>" : ""}</button>`).join("") : "";
  const arts = plan.map(p => `<button class="li n1${p.num === st.art ? " on" : ""}${p.num === vu.art && p.num !== st.art ? " vu" : ""}${p.presence === "absent" ? " off" : ""}" data-art="${esc(p.num)}">${p.presence === "absent" || COMP.mode !== "articles" ? "" : `<span class="coche${COCHES.has(p.num) ? " on" : ""}" data-coche="${esc(p.num)}" title="comparer cet article"></span>`}${p.texte ? `<span class="tog${ouv.arbreArt === p.num ? " o" : ""}" data-tog-art="${esc(p.num)}">▸</span>` : `<span class="tog"></span>`}<span class="k">${LEC.nomArt(p.num)}</span><span class="t">${esc(p.titre)}</span></button>` +
    (p.texte && ouv.arbreArt === p.num && p.presence === "present" ? A.map((t, i) => liAl(t, i).replace('class="li', 'class="li n2')).join("") : "")).join("");
  return `<div class="bande arbre">${bt("textes", "Type de texte", valTexte())}${textes}${bt("articles", "Articles et alinéas", valArt() + (st.art === "4" ? " · " + valAl() : ""))}${ouv.articles ? btnCmp("articles") + (st.art === "4" ? btnCmp("alineas") : "") + arts : ""}</div>`;
}
function gaucheB(){
  const plan = LEC.planDe(st.texte), A = MM.art4(st.texte);
  const sec = (cle, titre, val, contenu) => `<div class="sec ${cle}${ouv[cle] ? " o" : ""}">${bt(cle, titre, val)}${ouv[cle] ? `<div class="contenu">${contenu}</div>` : ""}</div>`;
  return `<div class="bande pile">${sec("textes", "Type de texte", valTexte(), LEC.TEXTES.map(liTexte).join(""))}${sec("articles", "Articles", valArt(), btnCmp("articles") + plan.map(liArt).join(""))}${sec("alineas", "Alinéas", valAl(), st.art === "4" ? btnCmp("alineas") + A.map(liAl).join("") : `<p class="nontexte" style="padding:6px 12px">Texte de l'article non chargé.</p>`)}</div>`;
}
function gaucheC(){
  const plan = LEC.planDe(st.texte), A = MM.art4(st.texte);
  const col = (cle, titre, val, contenu) => `<div class="bande col${ouv[cle] ? "" : " replie"}" data-col="${cle}">${bt(cle, titre, val)}<div class="contenu">${contenu}</div></div>`;
  return `<div class="cols">${col("textes", "Type de texte", valTexte(), LEC.TEXTES.map(liTexte).join(""))}${col("articles", "Articles", valArt(), btnCmp("articles") + plan.map(liArt).join(""))}${col("alineas", "Alinéas", valAl(), st.art === "4" ? btnCmp("alineas") + A.map(liAl).join("") : `<p class="nontexte" style="padding:6px 12px">Texte non chargé.</p>`)}</div>`;
}
const btnCmp = mode => `<button class="cmp-btn${COMP.mode === mode ? " on" : ""}" data-cmp="${mode}">${COMP.mode === mode ? "✓ Comparaison en cours · terminer" : mode === "articles" ? "⧉ Comparer les articles" : "⧉ Comparer les alinéas"}</button>`;
const GAUCHES = [gaucheA, gaucheB, gaucheC];
function rendreGauche(){
  const c = document.getElementById("cote"), ouvert = c.classList.contains("ouvert");
  c.innerHTML = `<button class="sommaire-btn" data-tiroir>Sommaire <span class="val">${valTexte()} · ${valArt()}${st.art === "4" ? " · " + valAl() : ""}</span></button><div class="tiroir">${GAUCHES[V]()}</div>`;
  c.classList.toggle("ouvert", ouvert);
  majComparaison(); majModules();
}
function aller(sel, cls){
  const el = document.querySelector(sel); if (!el) return;
  el.scrollIntoView({behavior: "smooth", block: cls === "al" ? "center" : "start"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}
let io;
function observer(){
  if (io) io.disconnect();
  io = new IntersectionObserver(es => {
    for (const x of es) if (x.isIntersecting){
      if (x.target.dataset.al) vu.al = +x.target.dataset.al; else if (x.target.dataset.art){ vu.art = x.target.dataset.art; if (vu.art !== "4") vu.al = null; }
    }
    document.querySelectorAll("#cote [data-art]").forEach(b => b.classList.toggle("vu", b.dataset.art === vu.art && b.dataset.art !== st.art));
    document.querySelectorAll("#cote [data-al]").forEach(b => b.classList.toggle("vu", +b.dataset.al === vu.al && +b.dataset.al !== st.al));
  }, {rootMargin: "-35% 0px -60% 0px"});
  document.querySelectorAll(".t-art, .t-art .al").forEach(e => io.observe(e));
}
document.getElementById("cote").addEventListener("click", e => {
  if (e.target.closest("[data-tiroir]")){ document.getElementById("cote").classList.toggle("ouvert"); return; }
  const ta = e.target.closest("[data-tog-art]"); if (ta){ e.stopPropagation(); ouv.arbreArt = ouv.arbreArt === ta.dataset.togArt ? null : ta.dataset.togArt; rendreGauche(); return; }
  const tg = e.target.closest("[data-tog]"); if (tg){ ouv[tg.dataset.tog] = !ouv[tg.dataset.tog]; rendreGauche(); return; }
  const rc = e.target.closest(".col.replie"); if (rc){ ouv[rc.dataset.col] = true; rendreGauche(); return; }
  const tx = e.target.closest("[data-texte]");
  if (tx){ const msg = LEC.changerTexte(st, tx.dataset.texte); ouv.textes = false; rendreDroite(); rendreGauche(); if (msg) MM.trace(msg); requestAnimationFrame(() => aller(st.art === "4" ? "#al-" + st.al : "#art-" + CSS.escape(st.art), st.art === "4" ? "al" : "art")); return; }
  const cb = e.target.closest("[data-cmp]");
  if (cb){ const m = cb.dataset.cmp; COMP.mode = COMP.mode === m ? null : m; if (m === "alineas" && COMP.mode){ ouv.alineas = true; if (V === 0) ouv.arbreArt = "4"; } rendreGauche(); return; }
  const ca = e.target.closest("[data-coche-al]");
  if (ca || (COMP.mode === "alineas" && e.target.closest("[data-al]"))){ const k = +(ca || e.target.closest("[data-al]")).dataset.al || +ca.dataset.cocheAl; COCHES_AL.has(k) ? COCHES_AL.delete(k) : COCHES_AL.add(k); rendreGauche(); return; }
  if (COMP.mode === "articles" && !e.target.closest("[data-tog-art]")){ const r = e.target.closest("[data-art]"); if (r && !r.classList.contains("off")){ const n = r.dataset.art; COCHES.has(n) ? COCHES.delete(n) : COCHES.add(n); rendreGauche(); return; } }
  const co = e.target.closest("[data-coche]");
  if (co){ const n = co.dataset.coche; COCHES.has(n) ? COCHES.delete(n) : COCHES.add(n); rendreGauche(); return; }
  const ar = e.target.closest("[data-art]");
  if (ar && !ar.classList.contains("off")){ st.art = ar.dataset.art; rendreGauche(); aller("#art-" + CSS.escape(st.art), "art"); return; }
  const al = e.target.closest("[data-al]");
  if (al){ st.art = "4"; st.al = +al.dataset.al; rendreGauche(); aller("#al-" + st.al, "al"); }
});
document.getElementById("droite").addEventListener("click", e => {
  if (e.target.closest("[data-fin]")){ COMP.mode = null; rendreGauche(); return; }
  const rt = e.target.closest("[data-retire]"); if (rt){ COCHES.delete(rt.dataset.retire); rendreGauche(); return; }
  const ra = e.target.closest("[data-retire-al]"); if (ra){ COCHES_AL.delete(+ra.dataset.retireAl); rendreGauche(); return; }
  if (e.target.closest("#cmp")) return;
  const gp = e.target.closest("[data-groupe]"); if (gp){ GROUPE_OUVERT.g = GROUPE_OUVERT.g === gp.dataset.groupe ? null : gp.dataset.groupe; majModules(); return; }
  if (e.target.closest(".modules")) return;
  const al = e.target.closest(".al[data-al]"); if (al){ st.art = "4"; st.al = +al.dataset.al; rendreGauche(); return; }
  const ar = e.target.closest(".t-art"); if (ar){ st.art = ar.dataset.art; rendreGauche(); }
});
const cart = MM.cartouche({id: "M01-3", question: "Variante : des <b>barres dépliantes à gauche</b> (textes → articles → alinéas) ; le texte entier reste à droite quand on clique un article", fondement: "T2 (C)",
  variantes: ["L'arbre", "Les barres empilées", "Les colonnes repliables"], onChange: v => { V = v; Object.assign(ouv, {textes: false, articles: true, alineas: false}); rendreGauche(); document.getElementById("consigne").innerHTML = CONSIGNES[v]; }});
V = (() => { try{ return localStorage.getItem("mm:M01-3:v") == null ? 1 : cart.get(); }catch(_){ return 1; } })(); if (V !== cart.get()) cart.set(V); if (V === 2) ouv.textes = false;
rendreDroite(); rendreGauche(); document.getElementById("consigne").innerHTML = CONSIGNES[V];
window.MMaller = (art, al) => { const b = document.querySelector(al ? `#cote [data-al="${al}"]` : `#cote [data-art="${art}"]`); if (b) b.click(); };
</script>

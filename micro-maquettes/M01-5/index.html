<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M01-5 · Comparer deux versions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../commun/cadre.css">
<style>
.page.large{--pw:1180px}
.choix{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:4px 0 6px}
.choix .mention{margin-right:4px}
.choix button.t{font:400 13.5px/1 var(--serif);color:var(--ink2);padding:8px 10px 7px;border:1px solid var(--rule);background:rgba(255,255,255,.35)}
.choix button.t:hover{border-color:var(--gold)}
.choix button.t.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0 16px;font:400 12.5px var(--ui);color:var(--muted-p)}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.opts input{accent-color:#8a6a2a}
.decompte{font:400 12.5px var(--ui);color:var(--muted-p);margin:0 0 14px}
/* A : tableau synoptique */
.syn{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));border-top:1.5px solid var(--ink2)}
.syn .th{padding:10px 12px 9px;border-bottom:1px solid var(--ink2);border-left:1px solid var(--rule);position:sticky;top:0;background:linear-gradient(#f2efe6,#eeeadf);z-index:2}
.syn .th:first-child{border-left:0}
.syn .th .mention{display:block;margin-bottom:4px}
.syn .th .nm{font:600 14px/1.3 var(--serif)}
.syn .th .ref{display:inline-block;margin-top:6px;font:500 9.5px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted-p);text-decoration:underline dotted var(--rule);text-underline-offset:3px}
.syn .th.estref .ref{color:#8a6a2a;text-decoration:none}
.syn .th.estref{box-shadow:inset 0 3px 0 var(--gold)}
.syn .td{padding:9px 12px;border-bottom:1px solid rgba(201,191,166,.55);border-left:1px solid var(--rule);font:400 14.5px/1.58 var(--serif);min-width:0;overflow-wrap:anywhere}
.syn .td:nth-child(var(--n)n+1){border-left:0}
.syn .td .n{display:inline-block;min-width:1.9em;font:500 10px/1 var(--ui);color:var(--muted-p);vertical-align:1px}
.syn .td.vide{background:repeating-linear-gradient(-45deg,transparent 0 6px,rgba(201,191,166,.22) 6px 7px)}
.syn .td.same{color:#5e574b}
.syn .td.ref{background:rgba(255,255,255,.18)}
/* B : une feuille, de … à … */
.dea{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;font:400 18px/1.5 var(--serif);margin:2px 0 6px}
.dea .val{text-decoration:underline dotted #b9ab88;text-decoration-thickness:2px;text-underline-offset:5px}
.dea .val:hover{text-decoration-color:var(--gold);text-decoration-style:solid}
.dea .inv{font:400 15px/1 var(--ui);border:1px solid var(--rule);width:30px;height:28px;color:var(--ink2);align-self:center}
.dea .inv:hover{border-color:var(--gold)}
.feuille .al.vide{color:var(--muted-p)}
.feuille .al.same{color:#5e574b}
.feuille .al .n{min-width:3.4em}
.feuille .al .n s{opacity:.6}
/* C : un alinéa d'étape en étape */
.als{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0 16px}
.als button{font:500 11px/1 var(--ui);min-width:28px;padding:6px 4px;border:1px solid var(--rule);color:var(--ink2);background:rgba(255,255,255,.35);position:relative}
.als button.mod::after{content:"";position:absolute;right:2px;top:2px;width:4px;height:4px;background:var(--ins)}
.als button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.etapes{border-left:1.5px solid var(--ink2);margin-left:6px}
.etape{position:relative;padding:2px 0 14px 22px}
.etape::before{content:"";position:absolute;left:-6.5px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink2)}
.etape.mod::before{background:var(--ins);border-color:var(--ins)}
.etape .h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.etape .h b{font:600 13.5px var(--serif)}
.etape .h .mention{color:var(--muted-p)}
.etape .h .mention.m{color:var(--ins)}
.etape .al{margin:0}
@media (max-width:700px){
  .syn .td{padding:8px 7px;font-size:13.5px}.syn .th{padding:8px 7px}.syn .th .nm{font-size:12.5px}
  .dea{font-size:16px}
}
</style>
<script>window.MAQ = "micro-M01-5";</script>
<script src="../../maquettes/commun/data.js"></script>
<script src="../../maquettes/commun/base.js"></script>
<script src="../../maquettes/commun/modele.js"></script>
<script src="../../maquettes/commun/noyau.js"></script>
<script src="../commun/cadre.js"></script>
</head><body>
<p class="consigne" id="consigne"></p>
<main class="bureau" id="bureau"></main>
<script>
"use strict";
const CONSIGNES = [
  "<b>Le tableau synoptique.</b> La forme des rapports parlementaires : une colonne par texte, les alinéas alignés d'un texte à l'autre. On coche les textes à mettre côte à côte ; la colonne de référence reste vierge, les corrections apparentes sont portées sur les autres.",
  "<b>Une feuille, de … à ….</b> Un seul texte, avec les corrections apparentes par rapport à un autre. « Du texte X au texte Y » se change d'un clic ; ⇄ inverse le sens.",
  "<b>Un alinéa d'étape en étape.</b> On choisit un alinéa ; ses rédactions successives se suivent de haut en bas, chacune face à la précédente.",
];
const T = ETAPES;   // les quatre textes qui existent
const nomT = id => ET[id].label;
const court = id => ET[id].court;
let V = 0;
const st = Object.assign({sel: ["transmis", "AN-com"], ref: "transmis", seulMod: false, de: "S-com", a: "transmis", al: 12}, (() => { try{ return JSON.parse(localStorage.getItem("mm:M01-5:st")) || {}; }catch(_){ return {}; } })());
const garder = () => { try{ localStorage.setItem("mm:M01-5:st", JSON.stringify(st)); }catch(_){} };
const etroit = () => innerWidth < 700;
// une ligne : textes d'un alinéa suivi d'étape en étape
const txt = (ln, id) => ln[id] == null ? null : ET[id].alineas[ln[id]];
const num = (ln, id) => ln[id] == null ? null : ln[id] + 1;
function cellule(ln, id, ref){
  const t = txt(ln, id), r = txt(ln, ref);
  if (id === ref) return t == null ? {cls: "vide ref", html: ""} : {cls: "ref", html: `<span class="n">${num(ln, id)}</span>${esc(t)}`};
  if (t == null && r == null) return {cls: "vide", html: ""};
  if (t == null) return {cls: "vide", html: `<del>${esc(r)}</del>`, mod: true};
  if (r == null) return {cls: "", html: `<span class="n">${num(ln, id)}</span><ins>${esc(t)}</ins>`, mod: true};
  if (sameText(r, t)) return {cls: "same", html: `<span class="n">${num(ln, id)}</span>${esc(t)}`};
  return {cls: "", html: `<span class="n">${num(ln, id)}</span>${inlineDiff(r, t)}`, mod: true};
}
function varA(){
  const sel = T.filter(id => st.sel.includes(id)); if (!sel.includes(st.ref)) st.ref = sel[0];
  const rows = LINES.map(ln => {
    if (sel.every(id => ln[id] == null)) return "";
    const cells = sel.map(id => cellule(ln, id, st.ref));
    if (st.seulMod && !cells.some(c => c.mod)) return "";
    return cells.map(c => `<div class="td ${c.cls}">${c.html}</div>`).join("");
  }).join("");
  const nMod = LINES.filter(ln => sel.some(id => id !== st.ref && cellule(ln, id, st.ref).mod)).length;
  return `<div class="choix"><span class="mention">Textes côte à côte</span>${T.map(id => `<button class="t${sel.includes(id) ? " on" : ""}" data-sel="${id}">${esc(court(id))}</button>`).join("")}</div>
    <div class="opts"><label><input type="checkbox" data-seulmod${st.seulMod ? " checked" : ""}> seulement les alinéas qui diffèrent de la référence</label><span>${nMod} ${plural(nMod, "alinéa")} ${plural(nMod, "diffère", "diffèrent")} de la référence</span></div>
    <div class="syn" style="--n:${sel.length}">${sel.map(id => `<div class="th${id === st.ref ? " estref" : ""}"><span class="mention">${esc(ET[id].chambre)}</span><span class="nm">${esc(nomT(id))}</span><br><button class="ref" data-ref="${id}">${id === st.ref ? "référence" : "prendre pour référence"}</button></div>`).join("")}${rows}</div>`;
}
function varB(){
  let nm = 0, na = 0, ns = 0;
  const lignes = LINES.map(ln => {
    const r = txt(ln, st.de), t = txt(ln, st.a);
    if (r == null && t == null) return "";
    const nn = `<span class="n">${t != null ? num(ln, st.a) : `<s>${num(ln, st.de)}</s>`}</span>`;
    if (t == null){ ns++; return `<p class="al vide">${nn}<del>${esc(r)}</del></p>`; }
    if (r == null){ na++; return `<p class="al">${nn}<ins>${esc(t)}</ins></p>`; }
    if (sameText(r, t)) return st.seulMod ? "" : `<p class="al same">${nn}${esc(t)}</p>`;
    nm++; return `<p class="al">${nn}${inlineDiff(r, t)}</p>`;
  }).join("");
  return `<div class="dea"><span class="mention" style="align-self:center">Comparer</span><span>du</span><button class="val" data-menu="de">${esc(nomT(st.de).replace(/^Texte /, "texte ").replace(/^Projet /, "projet "))}</button><button class="inv" data-inv title="inverser">⇄</button><span>au</span><button class="val" data-menu="a">${esc(nomT(st.a).replace(/^Texte /, "texte ").replace(/^Projet /, "projet "))}</button></div>
    <div class="opts"><label><input type="checkbox" data-seulmod${st.seulMod ? " checked" : ""}> masquer les alinéas inchangés</label></div>
    <p class="decompte">${nm} ${plural(nm, "alinéa modifié", "alinéas modifiés")} · ${na} ${plural(na, "alinéa ajouté", "alinéas ajoutés")} · ${ns} ${plural(ns, "alinéa supprimé", "alinéas supprimés")}. Les corrections sont portées sur le ${esc(nomT(st.a).toLowerCase())} ; le numéro est celui de ce texte (barré : celui de l'alinéa supprimé dans le texte de départ).</p>
    <div class="feuille">${lignes}</div>`;
}
function varC(){
  const o = st.al, h = NX.hist(o);
  const mods = new Set(); for (let k = 1; k <= NAL; k++) if (NX.hist(k).some((x, i) => i > 0 && !x.same && !(x.absent && h[i - 1] && h[i - 1].absent))) mods.add(k);
  return `<p class="small" style="margin:0 0 6px">Alinéa du texte transmis (le texte examiné) ; le carré bleu marque ceux qui ont changé au moins une fois.</p>
    <div class="als">${Array.from({length: NAL}, (_, i) => `<button class="${i + 1 === o ? "on" : ""}${mods.has(i + 1) ? " mod" : ""}" data-al="${i + 1}">${i + 1}</button>`).join("")}</div>
    <div class="etapes">${h.map((x, i) => {
      const prev = h.slice(0, i).reverse().find(y => !y.absent);
      const etat = i === 0 ? (x.absent ? "absent" : "origine") : x.absent ? (prev ? "supprimé" : "absent") : !prev ? "inséré" : x.same ? "inchangé" : "modifié";
      return `<div class="etape${etat === "modifié" || etat === "inséré" || etat === "supprimé" ? " mod" : ""}"><div class="h"><b>${esc(x.label)}</b><span class="mention${etat === "modifié" || etat === "inséré" ? " m" : ""}">${etat}${prev && i ? " · face à : " + esc(prev.label) : ""}</span></div>${x.diff == null ? `<p class="nontexte">L'alinéa n'existe pas dans ce texte.</p>` : `<p class="al">${x.diff}</p>`}</div>`;
    }).join("")}</div>`;
}
const VARS = [varA, varB, varC];
function rendre(){
  document.getElementById("bureau").innerHTML = MM.page(`${esc(D.dossier.uid)} · article 4`, V === 0 ? "tableau synoptique" : V === 1 ? "corrections apparentes" : "alinéa " + st.al,
    MM.entete() + `<p class="sous">Article 4 · ${esc(D.plan.find(p => p.num === "4").intitule)}</p>` + VARS[V](), V === 0 ? "large" : "");
  document.getElementById("consigne").innerHTML = CONSIGNES[V]; garder();
}
document.getElementById("bureau").addEventListener("click", e => {
  const s = e.target.closest("[data-sel]");
  if (s){ const id = s.dataset.sel; if (st.sel.includes(id)){ if (st.sel.length > 2) st.sel = st.sel.filter(x => x !== id); else return MM.trace("Il faut au moins deux textes pour comparer."); }
    else { st.sel.push(id); if (etroit() && st.sel.length > 2){ const out = st.sel.find(x => x !== st.ref && x !== id); st.sel = st.sel.filter(x => x !== out); MM.trace("Sur écran étroit : deux textes à la fois."); } }
    rendre(); return; }
  const r = e.target.closest("[data-ref]"); if (r){ st.ref = r.dataset.ref; rendre(); return; }
  const m = e.target.closest("[data-menu]");
  if (m){ e.stopPropagation(); const k = m.dataset.menu; MM.feuillet(m, T.map(id => ({label: nomT(id), on: st[k] === id, off: (k === "de" ? st.a : st.de) === id, id})), it => { st[k] = it.id; rendre(); }, k === "de" ? "Texte de départ" : "Texte comparé"); return; }
  if (e.target.closest("[data-inv]")){ [st.de, st.a] = [st.a, st.de]; rendre(); return; }
  const a = e.target.closest("[data-al]"); if (a){ st.al = +a.dataset.al; rendre(); }
});
document.getElementById("bureau").addEventListener("change", e => { if (e.target.matches("[data-seulmod]")){ st.seulMod = e.target.checked; rendre(); } });
if (etroit() && st.sel.length > 2) st.sel = st.sel.slice(0, 2);
const cart = MM.cartouche({id: "M01-5", question: "<b>Comparer deux versions</b> aussi facilement que dans avant-figma, sans canevas à calques", fondement: "T2 (D)",
  variantes: ["Le tableau synoptique", "Une feuille, de … à …", "Un alinéa d'étape en étape"], onChange: v => { V = v; rendre(); }});
V = cart.get(); rendre();
window.MMetat = s => { Object.assign(st, s); rendre(); };
</script>
</body></html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frise des articles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Frise horizontale de l'histoire d'un article, dans le design de Linear.
   Le temps va de gauche à droite : une carte par étape, posée sur un fil horizontal ;
   entre deux cartes, un interstice qui porte les deux plis (adoptés, rejetés ou retirés).
   Déplier un pli élargit l'interstice et pousse les étapes suivantes vers la droite (le repli de Linear, tourné de 90°).
   Haut / bas (flèches, molette, glisser vertical) : article précédent / suivant. Gauche / droite : parcourir la frise. */
:root{
  --bg:#08090a; --card:#121315; --card-2:#17181b; --border:#1f2023; --border-2:#2a2b2f;
  --fg:#f7f8f8; --text:#d0d6e0; --muted:#8a8f98; --dim:#62666d;
  --ins:#8ab4ff; --del:#e5484d; --accent:#5e6ad2; --now:#c9a8ff;
  --f:"Inter",system-ui,-apple-system,sans-serif; --ease:cubic-bezier(.25,.8,.25,1);
  --bar:92px; --rail:30px; --cardw:280px; --gap:232px; --gapw:392px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.5 var(--f);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* --- barre du haut --- */
.bar{position:fixed;top:0;left:0;right:0;z-index:5;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));height:calc(var(--bar) + env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:center}
.bar-in{display:flex;align-items:center;gap:14px;width:100%;max-width:760px}
.nav{flex:none;width:30px;height:30px;border-radius:7px;border:1px solid var(--border-2);background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:color .2s,background .2s,opacity .2s}
.nav:hover:not(:disabled){color:var(--fg);background:#1f2023}
.nav:disabled{opacity:.3;cursor:default}
.ttl{flex:1;min-width:0;text-align:center}
.ttl .k{font-size:12px;color:var(--dim)}
.ttl h1{margin:2px 0 0;font:500 16px/1.35 var(--f);color:var(--fg);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;justify-content:center;gap:5px;margin-top:7px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--border-2);transition:background .2s}
.dots i.on{background:var(--muted)}

/* --- articles empilés verticalement ; chacun est une frise horizontale --- */
#stage{position:fixed;inset:calc(var(--bar) + env(safe-area-inset-top,0px)) 0 0 0;overflow:hidden;touch-action:pan-x}
#track{position:absolute;inset:0;transition:transform .5s var(--ease)}
.page{position:absolute;left:0;right:0;height:100%}
.frise{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-behavior:smooth;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 28px,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 28px,#000 calc(100% - 48px),transparent)}
.frise::-webkit-scrollbar{display:none}
.row{position:relative;display:flex;align-items:flex-start;width:max-content;min-height:100%;padding:8px max(48px,calc(50vw - 380px)) 24px}


/* --- cartes d'étape --- */
.sheet{position:relative;z-index:1;flex:none;width:var(--cardw);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px 44px;
  transition:width .42s var(--ease),border-color .2s,background .2s}
.sheet:hover{border-color:var(--border-2)}
.sheet.open{width:min(480px,calc(100vw - 72px));background:var(--card-2)}
.sheet.pulse{border-color:var(--accent)}
.sheet .hd{display:flex;align-items:flex-start;gap:10px}
.sheet .av{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#2a2c31;color:var(--muted);margin-top:-1px}
.sheet.now .av{background:#2a2540;color:var(--now)}
.sheet .who{color:var(--fg);font-weight:500}
/* toutes les cartes ont la taille de « Dépôt au Sénat » : titre en haut (deux lignes au plus), date en bas, près de l'arête */
.sheet:not(.open){height:var(--ch,96px)}
.sheet .meta{position:absolute;left:44px;bottom:10px;line-height:26px;color:var(--dim)}
.sheet.now .who{color:var(--now)}
.sheet.now .meta{color:var(--now);font-weight:600}
.sheet.future:hover{border-color:var(--border)}
.sheet .hd{padding-right:30px}
.cmpbtn{position:absolute;right:10px;top:8px;width:26px;height:26px;border-radius:6px;border:1px solid var(--border-2);background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:color .2s,background .2s}
.cmpbtn:hover{color:var(--fg);background:#1f2023}
.gap.empty{padding:0}
.toggle{position:absolute;right:10px;bottom:10px;width:26px;height:26px;border-radius:6px;border:1px solid var(--border-2);background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:color .2s,background .2s}
.toggle:hover{color:var(--fg);background:#1f2023}
.toggle svg{transition:transform .35s var(--ease)}
.sheet.open .toggle svg{transform:rotate(180deg)}
.txt{position:relative;overflow:hidden;max-height:var(--h,0px);transition:max-height .42s var(--ease);margin:0 0 0 30px;scrollbar-width:none;font-size:13.5px;line-height:1.65}
.txt::-webkit-scrollbar{display:none}
.sheet.open .txt{margin-top:10px;-webkit-mask-image:linear-gradient(transparent 0,#000 12px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(transparent 0,#000 12px,#000 calc(100% - 22px),transparent)}
.sheet.open.fits .txt{-webkit-mask-image:none;mask-image:none}
.sheet.scrolling .txt{overflow-y:auto}
.al{display:grid;grid-template-columns:18px 1fr;gap:0 6px;margin:0 0 .6em;padding:2px 6px 2px 0;border-radius:4px;transition:background .3s}
.al:first-child{padding-top:6px}
.al .n{font-size:11px;line-height:2.1;color:var(--dim);text-align:right}
.al.lit{background:rgba(94,106,210,.16)}
.al.same{color:var(--dim)}
.sheet:not(.open) .al.same{display:none}
ins{color:var(--ins);text-decoration:underline 1px;text-underline-offset:3px;font-weight:500;background:none}
del{color:var(--dim);text-decoration:line-through 1px var(--del);background:none}
/* --- interstice entre deux cartes : le fil et les deux plis --- */
.gap{position:relative;min-width:0;flex:0 0 var(--gap);padding:calc(var(--rail) + 14px) 18px 0;transition:flex-basis .38s var(--ease)}
.gap.wide{flex-basis:var(--gapw)}
/* le fil : un segment par interstice, qui s'arrête à 8 px de chaque carte */
.gap::before{content:"";position:absolute;left:8px;right:8px;top:var(--rail);height:1px;background:var(--border-2)}
.fold{position:relative}
.fold + .fold{margin-top:2px}
.fold-head,.fold-none{display:flex;align-items:center;gap:22px;width:100%;background:none;border:0;padding:5px 0;color:var(--muted);font:400 12.5px var(--f);text-align:left;cursor:pointer;white-space:nowrap}
.fold-none{cursor:default;color:var(--dim)}
.fold-head .pin,.fold-none .pin{flex:none;width:16px;height:16px;display:grid;place-items:center;color:var(--dim)}
.fold-head .pin svg{transition:transform .3s var(--ease)}
.fold.open > .fold-head .pin svg{transform:rotate(90deg)}
.fold-head:hover,.fold.open > .fold-head{color:var(--text)}
.fold-head:hover .pin{color:var(--text)}
.slide{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)}
.slide > .inner{min-height:0;overflow:hidden;opacity:0;transition:opacity .12s}
.open > .slide{grid-template-rows:1fr}
.open > .slide > .inner{opacity:1;transition:opacity .22s .16s}
.list{max-height:var(--lh,50vh);overflow-y:auto;scrollbar-width:none;padding:2px 0 6px;margin-left:7px;border-left:1px solid var(--border)}
.list::-webkit-scrollbar{display:none}
.ev-row{display:flex;align-items:flex-start;gap:8px;width:100%;background:none;border:0;padding:5px 0;cursor:pointer;text-align:left;color:var(--muted);font:400 12.5px/1.5 var(--f)}
.ev-row .ico{flex:none;width:16px;height:16px;margin-left:6px;margin-top:1px;display:grid;place-items:center;background:var(--bg);color:var(--dim);transition:transform .3s var(--ease),color .2s}
.ev-row .lg{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:4px;background:var(--g);color:#fff;font-size:8.5px;font-weight:700;margin-right:5px;vertical-align:-2px}
.ev-row b{color:var(--fg);font-weight:500}
.ev-row .t{display:block;color:var(--dim)}
.ev-row:hover{color:var(--text)}
.ev-row:hover .ico{color:var(--text)}
.ev.open > .ev-row .ico{color:var(--fg);transform:rotate(45deg)}
.fiche{margin:2px 0 10px 8px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.fiche .head{display:flex;align-items:center;gap:8px;color:var(--dim);flex-wrap:wrap}
.fiche .head b{color:var(--fg);font-weight:500}
.fiche .head .lg{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;background:var(--g);color:#fff;font-size:9px;font-weight:700}
.fiche .amd{font-size:13px;line-height:1.6;margin:8px 0 6px;color:var(--text)}
.fiche .expo{margin:0 0 8px;color:var(--muted)}
.fiche dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:12px;color:var(--dim)}
.fiche dd{margin:0;color:var(--muted)}
.hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11.5px;color:var(--dim);pointer-events:none}
/* --- mode comparer : la frise s'efface, un ou deux textes ouverts, et la liste des étapes à comparer --- */
.frise{transition:opacity .3s,transform .4s var(--ease)}
.page.cmping .frise{opacity:0;transform:scale(.97);pointer-events:none}
.cmp{position:absolute;inset:0;overflow:auto;scrollbar-width:none;padding:8px 16px 48px;opacity:0;pointer-events:none;transition:opacity .25s}
.cmp::-webkit-scrollbar{display:none}
.page.cmping .cmp{opacity:1;pointer-events:auto}
.cmp-in{display:flex;align-items:center;justify-content:center;gap:14px;min-height:100%;width:max-content;min-width:100%;margin:0 auto}
.cg{--cw:min(460px,calc((100vw - 120px)/var(--n)));display:grid;grid-template-columns:repeat(var(--n),var(--cw));column-gap:18px;align-self:center}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.c{background:var(--card-2);border-left:1px solid var(--border);border-right:1px solid var(--border);padding:0 16px;min-width:0}
.c.h{position:relative;border-top:1px solid var(--border);border-radius:8px 8px 0 0;padding-top:12px;padding-bottom:12px;display:flex;align-items:flex-start;gap:10px;padding-right:46px}
.c.h .av{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#2a2c31;color:var(--muted);margin-top:-1px}
.c.h.now .av{background:#2a2540;color:var(--now)}
.c.h .who{color:var(--fg);font-weight:500}
.c.h .meta{display:block;color:var(--dim)}
.c.h.now .who{color:var(--now)}
.c.h.now .meta{color:var(--now);font-weight:600}
.c .n.add{color:var(--ins);font-weight:700}
.c .n.rem{text-decoration:line-through 1px var(--del)}
.al .n.add{color:var(--ins);font-weight:700}
.al .n.rem{text-decoration:line-through 1px var(--del)}
.c.f{border-bottom:1px solid var(--border);border-radius:0 0 8px 8px;height:14px}
.c.a{display:grid;grid-template-columns:18px 1fr;gap:0 6px;padding-top:3px;padding-bottom:5px;font-size:13.5px;line-height:1.65}
.c.a .n{font-size:11px;line-height:2.1;color:var(--dim);text-align:right}
.c.a.same p{color:var(--dim)}
.c.a .none{color:var(--dim);font-style:italic}
.x{position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:6px;border:1px solid var(--border-2);background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.x:hover{color:var(--fg);background:#1f2023}
.pickl{flex:none;width:250px;align-self:center}
.pk.now b{color:var(--now)}
.pk.now .t{color:var(--now);font-weight:600}
.pickl .list{max-height:none;margin-left:7px}
.pk .t{display:block;color:var(--dim)}
@media (max-width:520px){ .cg{--cw:calc(100vw - 56px)} .cmp-in{flex-direction:column;align-items:flex-start;justify-content:flex-start;padding-top:8px} .pickl{align-self:flex-start} }
/* numéro d'un alinéa ajouté : comme un ajout (bleu, gras, souligné) ; d'un alinéa supprimé : barré */
.al .n.add,.c.a .n.add{color:var(--ins);font-weight:700;text-decoration:underline 1px;text-underline-offset:3px}
.al .n.rem,.c.a .n.rem{text-decoration:line-through 1px var(--del)}
@media (max-width:520px){ :root{--ch:116px} .hint{display:none} :root{--cardw:min(270px,calc(100vw - 110px));--gap:178px;--gapw:min(340px,calc(100vw - 40px))} .row{padding-left:24px;padding-right:48px} }
@media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms!important;scroll-behavior:auto!important} }
</style>
</head>

</div></header>
<div id="stage"><div id="track"></div></div>
<div class="hint" id="hint">← → parcourir les étapes · ↑ ↓ changer d'article</div>
<script>

  UT:{name:"Union des territoires",color:"#3b82d6"}, LL:{name:"Libertés locales",color:"#e0671d"}, RC:{name:"Rassemblement des communes",color:"#7c5cd6"},

};
const R=(g,num,who,al,text,sort,expo,avis,vote,mode)=>({g,num,who,al,text,sort,expo,avis,vote,mode});
const STEPS=[
  {short:"le dépôt au Sénat",stage:"Dépôt au Sénat",date:"4 mars 2026",h:"Texte du Gouvernement",chip:"texte initial"},
  {short:"la commission du Sénat",stage:"Commission des affaires économiques du Sénat",date:"25 mars 2026",h:"Texte adopté par la commission"},
  {short:"la séance du Sénat",stage:"Séance publique du Sénat",date:"8 avril 2026",h:"Texte adopté par le Sénat"},
  {stage:"Commission des affaires économiques de l'Assemblée",date:"depuis le 13 mai 2026",h:"Examen en commission",now:true}
];
const DEF="Commission : défavorable · Gouvernement : défavorable";

// ---------- Article 3 (fictif) ----------
const A3v0={1:"L'article 17 de la loi n° 89-462 du 6 juillet 1989 est ainsi modifié :",
 2:"Dans les zones d'urbanisation continue de plus de 50 000 habitants, le loyer de référence est fixé chaque année par arrêté préfectoral.",
 3:"Le loyer de base des logements mis en location ne peut excéder le loyer de référence majoré de 20 %.",
 4:"Le dispositif est applicable pour une durée de cinq ans."};

const CHAPEAU="Le chapitre II du titre préliminaire du livre III du code de la construction et de l'habitation est ainsi modifié :";

const V1={...V0,

const V2={...V1, 5:V1[5].replace("après avis du","après avis conforme du"), 6:V1[6].replace("10 %","15 %")};

// ---------- Article 5 (fictif) ----------
const A5v0={1:"Le fonds national des aides à la pierre publie chaque année un rapport sur l'emploi de ses ressources.",
 2:"Ce rapport est transmis au Parlement avant le 1er octobre."};
const A5v1={...A5v0, 2:A5v0[2].replace("1er octobre","1er juillet"), 3:"Il détaille la répartition des aides par région et par type de logement."};
const A5v2={...A5v1, 3:A5v1[3].replace("par région et","par région, par commune et")};
const A5v3={...A5v2};

const ARTICLES=[
 {n:3, t:"Encadrement des loyers", v:[A3v0,A3v1,A3v2,A3v3], chips:[null,"adopté modifié","adopté conforme",null], amds:[null,
  [R("RAP","COM-60","M. Delorme",2,A3v1[2],"adopté","Associer l'observatoire local à la fixation du loyer de référence.","Gouvernement : favorable","Adopté à main levée"),
   R("UT","COM-71","Mme Garnier",4,A3v1[4],"adopté","Laisser au dispositif le temps de produire ses effets.","Rapporteur : favorable · Gouvernement : sagesse","Adopté par 20 voix contre 18"),
   R("LL","COM-62","M. Perrin",3,null,"rejeté","Supprimer le plafonnement des loyers.",DEF,"Rejeté","supprimer"),
   R("SOL","COM-65","M. Ferrand",3,A3v0[3].replace("20 %","10 %"),"rejeté","Resserrer la majoration autorisée.",DEF,"Rejeté"),
   R("ECO","COM-66","Mme Laurent",2,A3v0[2].replace("50 000","20 000"),"retiré","Étendre le dispositif aux agglomérations moyennes.","Rapporteur : demande de retrait","Retiré")],
  [R("SOL","n° 140","M. Ferrand",3,A3v1[3].replace("20 %","10 %"),"rejeté","Resserrer la majoration autorisée.",DEF,"Rejeté par 101 voix contre 230"),
   R("LL","n° 141","M. Perrin",3,null,"rejeté","Supprimer le plafonnement des loyers.",DEF,"Rejeté","supprimer"),
   R("RC","n° 150","Mme Aubert",4,A3v1[4].replace("huit ans","trois ans"),"rejeté","Limiter l'expérimentation à trois ans.",DEF,"Rejeté"),
   R("ECO","n° 152","Mme Laurent",2,A3v1[2].replace("50 000","20 000"),"retiré","Étendre le dispositif aux agglomérations moyennes.","Commission : demande de retrait","Retiré")],
  [R("SOL","CE-30","Mme Diallo",3,A3v3[3],"adopté","Réduire l'écart toléré au-dessus du loyer de référence.","Rapporteure : sagesse · Gouvernement : défavorable","Adopté par 36 voix contre 33"),
   R("LL","CE-31","M. Caron",3,null,"rejeté","Supprimer le plafonnement des loyers.",DEF,"Rejeté","supprimer")]]},
 {n:4, t:"Obligation de logements sociaux", v:[V0,V1,V2,V3], chips:[null,"adopté modifié","adopté modifié",null], amds:[null,
  [R("RAP","COM-14","M. Delorme",2,V0[2].replace("20 %","25 %"),"adopté","Aligner le taux sur l'objectif national déjà applicable aux communes les plus tendues.","Gouvernement : sagesse","Adopté à main levée"),
   R("ECO","COM-31","Mme Laurent",2,V0[2].replace("2032","2030"),"adopté","Avancer l'échéance pour la faire coïncider avec la fin du prochain programme local de l'habitat.","Rapporteur : favorable · Gouvernement : défavorable","Adopté par 21 voix contre 17"),
   R("SOL","COM-7","M. Ferrand",3,V1[3],"adopté","Flécher le produit du prélèvement vers la construction.","Rapporteur : favorable · Gouvernement : favorable","Adopté à l'unanimité","completer"),

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function diff(a,b){
  if(a==null&&b==null) return "";
  if(a==null) return `<ins>${esc(b)}</ins>`;
  if(b==null) return `<del>${esc(a)}</del>`;
  const sp=x=>x.split(/(\s+|[.,;:])/).filter(Boolean);
  const A=sp(a),B=sp(b),n=A.length,m=B.length,L=Array.from({length:n+1},()=>new Int32Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0;const push=(t,s)=>{const l=out[out.length-1];if(l&&l.t===t)l.s+=s;else out.push({t,s});};
  while(i<n&&j<m){if(A[i]===B[j]){push("=",A[i]);i++;j++;}else if(L[i+1][j]>=L[i][j+1])push("-",A[i++]);else push("+",B[j++]);}
  while(i<n)push("-",A[i++]);while(j<m)push("+",B[j++]);
  // regroupe les changements voisins (séparés par un simple blanc) : « à l'alinéa précédent » → « au deuxième alinéa » en un seul bloc
  const res=[];let k=0;
  while(k<out.length){
    if(out[k].t==="="){res.push(esc(out[k].s));k++;continue;}
    let d="",ins="",e=k;
    while(e<out.length&&(out[e].t!=="="||(/^\s+$/.test(out[e].s)&&e+1<out.length&&out[e+1].t!=="="))){
      if(out[e].t==="-")d+=out[e].s;else if(out[e].t==="+")ins+=out[e].s;else{d+=out[e].s;ins+=out[e].s;}e++;}
    res.push((d.trim()?`<del>${esc(d)}</del>`:"")+(ins.trim()?`<ins>${esc(ins)}</ins>`:(d.trim()?"":esc(d))));k=e;
  }
  return res.join("");
}

    const [l,r]=items, L=art.v[l], Rv=art.v[r];
    keys.forEach(n=>{ const a=L[n], b=Rv[n], same=a===b;
      cells+=`<div class="c a${same?" same":""}" data-col="${l}"><span class="n">${a!=null?n:""}</span><p style="margin:0">${a!=null?esc(a):""}</p></div>`;
      cells+=`<div class="c a${same?" same":""}" data-col="${r}"><span class="n${numCls(a,b,true)}">${n}</span><p style="margin:0">${diff(a??null,b??null)}</p></div>`; });
  }
  cells+=items.map(i=>`<div class="c f" data-col="${i}"></div>`).join("");
  let html=`<div class="cmp-in"><div class="cg" style="--n:${items.length}">${cells}</div>`;
  if(items.length===1){
    const i=items[0], others=STEPS.map((s,j)=>j).filter(j=>j<DONE&&j!==i);
    html+=`<div class="pickl"><div class="list">${others.map(j=>`<div class="ev"><button class="ev-row pk${STEPS[j].now?" now":""}" type="button" data-pick="${j}" aria-label="Comparer avec ${STEPS[j].stage}"><span class="ico">${CMPS}</span><span><b>${STEPS[j].stage}</b>${metaOf(STEPS[j],"t")}</span></button></div>`).join("")}</div></div>`;
  }
  box.innerHTML=html+`</div>`; box.scrollTop=0;
  animateCmp(box,before,listBefore,src);
}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function animateCmp(box,before,listBefore,src){
  if(reduce) return;
  const E="cubic-bezier(.25,.8,.25,1)";
  const cols=[...new Set([...box.querySelectorAll("[data-col]")].map(c=>c.dataset.col))];
  cols.forEach((c,ci)=>{
    const head=box.querySelector(`.c.h[data-col="${c}"]`), now=head.getBoundingClientRect();
    const from=before[c]||(src&&String(src.i)===c?src.r:null)||(listBefore?{left:listBefore.left,top:now.top}:null);
    const cells=box.querySelectorAll(`[data-col="${c}"]`);
    if(from){
      const dx=from.left-now.left, dy=from.top-now.top, fresh=!before[c];
      cells.forEach((el,k)=>el.animate([{transform:`translate(${dx}px,${dy}px)`,opacity:fresh?(k?0:.6):1},{transform:"none",opacity:1}],{duration:fresh?420:380,easing:E,delay:fresh&&k?Math.min(k*18,140):0,fill:"backwards"}));
    } else cells.forEach(el=>el.animate([{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}],{duration:320,easing:E}));
  });
  const pl=box.querySelector(".pickl");
  if(pl) pl.animate([{opacity:0,transform:"translateX(-12px)"},{opacity:1,transform:"none"}],{duration:360,delay:listBefore?60:200,easing:E,fill:"backwards"});
}
document.addEventListener("click",e=>{
  if(moved){ moved=false; e.stopPropagation(); e.preventDefault(); return; }
  const cb=e.target.closest(".cmpbtn");
  if(cb){ const s=cb.closest(".sheet"); CMP[cur]=[+s.dataset.i]; renderCmp(cur,{i:+s.dataset.i,r:s.getBoundingClientRect()}); return; }
  const pk=e.target.closest("[data-pick]");
  if(pk){ CMP[cur]=[...CMP[cur],+pk.dataset.pick].sort((a,b)=>a-b); renderCmp(cur); return; }
  const x=e.target.closest("[data-close]");
  if(x){ CMP[cur]=CMP[cur].filter(i=>i!==+x.dataset.close); renderCmp(cur); return; }
  const tg=e.target.closest(".toggle");
  if(tg){ const s=tg.closest(".sheet"); s.classList.contains("open")?closeSheet(s):openSheet(s); hint(); return; }
  const fh=e.target.closest(".fold-head");
  if(fh){
    const f=fh.parentElement, gap=f.closest(".gap");
    const was=f.classList.contains("open");
    // accordéon : un seul pli ouvert par interstice
    gap.querySelectorAll(".fold.open").forEach(o=>{ o.classList.remove("open"); o.querySelectorAll(".ev.open").forEach(x=>x.classList.remove("open")); });
    if(!was) f.classList.add("open");
    clearLit(); syncGap(gap); hint();
    if(f.classList.contains("open")) setTimeout(()=>reveal(gap),390);
    return;
  }
  const row=e.target.closest(".ev-row");
  if(row){
    const ev=row.parentElement, was=ev.classList.contains("open");
    ev.classList.toggle("open",!was); relight(ev.closest(".gap"));
    if(!was) setTimeout(()=>ev.scrollIntoView({block:"nearest",behavior:"smooth"}),340);
  }
},true);
function clearLit(){ document.querySelectorAll(".al.lit").forEach(x=>x.classList.remove("lit")); document.querySelectorAll(".sheet.pulse").forEach(x=>x.classList.remove("pulse")); }
// tous les amendements adoptés ouverts allument leur alinéa dans la carte suivante
function relight(gap){
  clearLit(); const next=gap&&gap.nextElementSibling; if(!next) return;
  const evs=[...gap.querySelectorAll(".ev.open")].filter(x=>x.dataset.sort==="adopté"); if(!evs.length) return;
  evs.forEach(x=>{ const p=next.querySelector(`.al[data-al="${x.dataset.al}"]`); if(p) p.classList.add("lit"); });
  next.classList.add("pulse"); setTimeout(()=>next.classList.remove("pulse"),900);
}
function light(ev){
  if(ev.dataset.sort!=="adopté") return;
  const next=ev.closest(".gap").nextElementSibling; if(!next) return;
  const p=next.querySelector(`.al[data-al="${ev.dataset.al}"]`); if(p) p.classList.add("lit");
  next.classList.add("pulse"); setTimeout(()=>next.classList.remove("pulse"),900);
}
document.addEventListener("keydown",e=>{
  const fr=pages[cur].querySelector(".frise");
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ if(atRest()){ e.preventDefault(); go(cur+(e.key==="ArrowDown"?1:-1)); } return; }
  if(!inCmp()&&e.key==="ArrowRight"){ e.preventDefault(); fr.scrollBy({left:320,behavior:"smooth"}); return; }
  if(!inCmp()&&e.key==="ArrowLeft"){ e.preventDefault(); fr.scrollBy({left:-320,behavior:"smooth"}); return; }
  if(e.key!=="Escape") return;
  if(inCmp()){ CMP[cur]=[]; renderCmp(cur); return; }
  const ev=document.querySelector(".ev.open"); if(ev){ ev.classList.remove("open"); clearLit(); return; }
  const s=document.querySelector(".sheet.open"); if(s){ closeSheet(s); hint(); return; }
  const f=document.querySelector(".fold.open"); if(f){ f.classList.remove("open"); syncGap(f.closest(".gap")); hint(); }
});
</script>

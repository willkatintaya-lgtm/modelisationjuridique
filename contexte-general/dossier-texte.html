<title>Boussole législative · Texte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Frise horizontale de l'histoire d'un article, dans le design de Linear.
   Le temps va de gauche à droite : une carte par étape, posée sur un fil horizontal ;
   entre deux cartes, un interstice qui porte les deux plis (adoptés, rejetés ou retirés).
   Déplier un pli élargit l'interstice et pousse les étapes suivantes vers la droite (le repli de Linear, tourné de 90°).
   Haut / bas (flèches, molette, glisser vertical) : article précédent / suivant. Gauche / droite : parcourir la frise. */
:root{
  /* thème clair (par défaut) : blanc lumineux, cartes blanches sur fond à peine gris, mêmes rôles qu'en sombre */
  --bg:#f6f6f7; --card:#ffffff; --card-2:#ffffff; --border:#e3e4e8; --border-2:#d3d5db;
  --fg:#16171a; --text:#2c2e33; --muted:#5f636b; --dim:#8b8f97;
  --ins:#2453c7; --del:#d1343b; --accent:#5e6ad2; --now:#7a45d1;
  --hover:#eef0f3; --chrome:#ececef; --side:#f1f1f3; --wall:linear-gradient(135deg,#d9dde4 0%,#e6e1d8 55%,#d6dbe2 100%); --av:#eceef2; --av-now:#efe6fc; --lit:rgba(94,106,210,.13); --shadow:0 1px 2px rgba(16,18,24,.05);
  --f:"Inter",system-ui,-apple-system,sans-serif; --ease:cubic-bezier(.25,.8,.25,1);
  --bar:0px; --rail:30px; --cardw:280px; --gap:232px; --gapw:392px;
  color-scheme:light;
}
/* thème sombre, au choix (bouton en haut à droite) */
:root.dark{
  --bg:#08090a; --card:#121315; --card-2:#17181b; --border:#1f2023; --border-2:#2a2b2f;
  --fg:#f7f8f8; --text:#d0d6e0; --muted:#8a8f98; --dim:#62666d;
  --ins:#8ab4ff; --del:#e5484d; --accent:#5e6ad2; --now:#c9a8ff;
  --hover:#1f2023; --chrome:#0e0f11; --side:#0c0d0f; --wall:linear-gradient(135deg,#1b1d22 0%,#16171b 55%,#1d1f25 100%); --av:#2a2c31; --av-now:#2a2540; --lit:rgba(94,106,210,.16); --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--wall);color:var(--text);font:13px/1.5 var(--f);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* --- barre du haut --- */


/* changement de thème instantané : aucune transition pendant la bascule */
:root.swap *,:root.swap *::before,:root.swap *::after{transition:none!important}
/* --- la fenêtre du logiciel : barre de titre, rail d'icônes, panneau latéral, zone principale --- */
.win{position:fixed;inset:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));
  display:grid;grid-template-rows:42px minmax(0,1fr);background:var(--bg);border:1px solid var(--border-2);border-radius:12px;overflow:hidden;
  box-shadow:0 30px 80px rgba(20,22,30,.28),0 4px 14px rgba(20,22,30,.12)}
.tb{display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;background:var(--chrome);border-bottom:1px solid var(--border);min-width:0}
.lights{display:flex;gap:8px;margin-right:6px}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57}
.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.ib{flex:none;width:28px;height:28px;border:0;border-radius:6px;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.ib:hover:not(:disabled){background:var(--hover);color:var(--fg)}
.ib:disabled{opacity:.35;cursor:default}
.tab{display:flex;align-items:center;gap:7px;min-width:0;max-width:300px;height:28px;padding:0 12px;border-radius:7px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:12.5px}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb .sp{flex:1}
.wb{display:grid;grid-template-columns:52px var(--sidew,244px) minmax(0,1fr);min-height:0;transition:grid-template-columns .32s var(--ease)}
.win.noside{--sidew:0px}
.win.noside .side{border-right-color:transparent;padding-left:0;padding-right:0}
.side{transition:padding .32s var(--ease),border-color .32s}
.wb{--sidec:224px}
.side>*{min-width:var(--sidec)}
.side{overflow-x:hidden}
.side>.favnote{min-width:calc(var(--sidec) - 16px)}
#sideopen{display:none}
.win.noside #sideopen{display:grid}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;background:var(--chrome);border-right:1px solid var(--border)}
.rail .ib{width:34px;height:34px}
.rail .ib.on{background:var(--hover);color:var(--fg)}
.rail .sp{flex:1}
.side{display:flex;flex-direction:column;gap:2px;padding:12px 10px;background:var(--side);border-right:1px solid var(--border);overflow-y:auto;scrollbar-width:none;min-height:0}
.side::-webkit-scrollbar{display:none}
.sh{display:flex;align-items:center;gap:4px;padding:0 4px 8px}
.sh b{flex:1;color:var(--fg);font-weight:600;font-size:13.5px}
.newb{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;margin:0 0 12px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--text);font:400 12.5px var(--f);cursor:pointer}
.newb:hover{background:var(--hover)}
.sec{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 4px;color:var(--dim);font-size:12px}
.it{display:flex;align-items:center;gap:8px;width:100%;min-height:30px;padding:4px 8px;border:0;border-radius:6px;background:none;color:var(--text);font:400 12.5px/1.35 var(--f);text-align:left;cursor:pointer}
.it:hover{background:var(--hover)}
.it.on{background:var(--hover);color:var(--fg);font-weight:500}
.it .ic{flex:none;color:var(--dim);display:grid;place-items:center;width:16px}
.it span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it.sub{padding-left:32px;min-height:28px;color:var(--muted)}
.it.sub.on{color:var(--fg)}
.it.off{color:var(--dim);cursor:default}
.it.off:hover{background:none}
.favnote{margin:4px 8px;padding:10px;border-radius:7px;border:1px dashed var(--border-2);color:var(--dim);font-size:12px}
.main{display:grid;grid-template-rows:46px minmax(0,1fr);min-width:0;min-height:0}
.mh{display:flex;align-items:center;gap:14px;padding:0 12px 0 18px;border-bottom:1px solid var(--border);min-width:0}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;color:var(--muted);font-size:13px}
.crumb b{color:var(--fg);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .c1{white-space:nowrap}
.crumb svg{flex:none;color:var(--dim)}
.tabs{display:flex;gap:2px;margin-left:6px}
.tabs button{height:28px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--muted);font:400 12.5px var(--f);cursor:default;white-space:nowrap}
.tabs button.on{background:var(--hover);color:var(--fg);font-weight:500}
.mh .sp{flex:1}
.content{position:relative;min-height:0}
/* changer d'article : deux boutons en bas, au centre de la zone principale */
.artnav{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;z-index:3}
.nav{flex:none;width:28px;height:28px;border-radius:6px;border:1px solid var(--border-2);background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.nav:hover:not(:disabled){color:var(--fg);background:var(--hover)}
.nav:disabled{opacity:.3;cursor:default}
@media (max-width:1100px){ .wb{--sidew:210px;--sidec:190px} .win.noside .wb{--sidew:0px} .tabs{display:none} }
@media (max-width:820px){ .win{inset:0;border-radius:0;border:0} .wb{grid-template-columns:minmax(0,1fr)} .rail,.side{display:none} .lights{display:none} .crumb .c1,.crumb .c1+svg{display:none} .tabs{display:none} }

/* --- articles empilés verticalement ; chacun est une frise horizontale --- */
#stage{position:absolute;inset:0;overflow:hidden;touch-action:pan-x;container-type:size}
#track{position:absolute;inset:0;transition:transform .5s var(--ease)}
.page{position:absolute;left:0;right:0;height:100%}
.frise{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-behavior:smooth}
/* fondu seulement du côté où il reste quelque chose à voir : au bout, la première carte n'est pas estompée */
.frise.fl{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 40px);mask-image:linear-gradient(90deg,transparent 0,#000 40px)}
.frise.fr{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
.frise.fl.fr{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 40px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 40px,#000 calc(100% - 40px),transparent)}
.frise::-webkit-scrollbar{display:none}
.row{position:relative;display:flex;align-items:flex-start;width:max-content;min-height:100%;padding:24px var(--edge,18px) 24px} /* butées : la première carte s'arrête sur l'aplomb du « A » du fil d'Ariane, la dernière à la même distance du bord droit */


/* --- cartes d'étape --- */
.sheet{position:relative;z-index:1;flex:none;width:var(--cardw);background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:12px 14px 44px;
  transition:width .42s var(--ease),border-color .2s,background .2s}
.sheet:hover{border-color:var(--border-2)}
.sheet.open{width:min(480px,calc(100cqw - 72px));background:var(--card-2)}
.sheet.pulse{border-color:var(--accent)}
.sheet .hd{display:flex;align-items:flex-start;gap:10px}
.sheet .av{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--av);color:var(--muted);margin-top:-1px}
.sheet.now .av{background:var(--av-now);color:var(--now)}
.sheet .who{color:var(--fg);font-weight:500}
/* toutes les cartes ont la taille de « Dépôt au Sénat » : titre en haut (deux lignes au plus), date en bas, près de l'arête */
.sheet:not(.open){height:var(--ch,106px)}
.sheet .meta{position:absolute;left:44px;bottom:10px;line-height:26px;color:var(--dim)}
.sheet.now .who{color:var(--now)}
.sheet .meta.live,.c.h .meta.live,.pk .t.live{color:var(--now);font-weight:400;opacity:.5}
.sheet .meta.live{right:44px;line-height:16px;bottom:15px}
.sheet.future:hover{border-color:var(--border)}
.sheet .hd{padding-right:30px}
.cmpbtn{position:absolute;right:10px;top:8px;width:26px;height:26px;border-radius:6px;border:1px solid var(--border-2);background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:color .2s,background .2s}
.cmpbtn:hover{color:var(--fg);background:var(--hover)}
.gap.empty{padding:0}
.toggle{position:absolute;right:10px;bottom:10px;width:26px;height:26px;border-radius:6px;border:1px solid var(--border-2);background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:color .2s,background .2s}
.toggle:hover{color:var(--fg);background:var(--hover)}
.toggle svg{transition:transform .35s var(--ease)}
.sheet.open .toggle svg{transform:rotate(180deg)}
.txt{position:relative;overflow:hidden;max-height:var(--h,0px);transition:max-height .42s var(--ease);margin:0 0 0 30px;scrollbar-width:none;font-size:13.5px;line-height:1.65}
.txt::-webkit-scrollbar{display:none}
.sheet.open .txt{margin-top:10px;margin-left:0;padding-left:30px}
/* texte plus long que la carte : bords nets, sans filet (l'espace est gardé), défilement à l'intérieur */
.sheet.open:not(.fits) .txt{border-top:1px solid transparent;border-bottom:1px solid transparent}
/* carte ouverte : la date passe entre parenthèses à droite du titre, estompée ; plus de date en bas */
.sheet .mt2{display:none;white-space:nowrap;margin-left:8px;color:var(--dim);opacity:.6;font-weight:400}
.sheet .mt2.live{color:var(--now);opacity:.5}
.sheet.open .mt2{display:inline}
.sheet.open .meta{display:none}
.sheet.open.fits .txt{-webkit-mask-image:none;mask-image:none}
.sheet.scrolling .txt{overflow-y:auto}
.al{display:grid;grid-template-columns:18px 1fr;gap:0 6px;margin:0 0 .6em;padding:2px 6px 2px 0;border-radius:4px;transition:background .3s}
.al:first-child{padding-top:6px}
.al .n{font-size:11px;line-height:2.1;color:var(--dim);text-align:right}
.al.lit{background:var(--lit)}
.al.same{color:var(--dim)}
.sheet:not(.open) .al.same{display:none}
ins{color:var(--ins);text-decoration:underline 1px;text-underline-offset:3px;font-weight:500;background:none}
del{color:var(--dim);text-decoration:line-through 1px var(--del);background:none}
/* --- interstice entre deux cartes : le fil et les deux plis --- */
.gap{position:relative;min-width:0;flex:0 0 var(--gap);padding:calc(var(--rail) + 14px) 18px 0;transition:flex-basis .38s var(--ease)}
.gap.wide{flex-basis:var(--gapw)}
/* le fil : un segment par interstice, qui s'arrête à 8 px de chaque carte */
.gap::before{content:"";position:absolute;left:8px;right:8px;top:var(--rail);height:1px;background:var(--border-2)}
.fold{position:relative}
.fold + .fold{margin-top:2px}
.fold-head,.fold-none{display:flex;align-items:center;gap:22px;width:100%;background:none;border:0;padding:5px 0;color:var(--muted);font:400 12.5px var(--f);text-align:left;cursor:pointer;white-space:nowrap}
.fold-none{cursor:default;color:var(--dim)}
.fold-head .pin,.fold-none .pin{flex:none;width:16px;height:16px;display:grid;place-items:center;color:var(--dim)}
.fold-head .pin svg{transition:transform .3s var(--ease)}
.fold.open > .fold-head .pin svg{transform:rotate(90deg)}
.fold-head:hover,.fold.open > .fold-head{color:var(--text)}
.fold-head:hover .pin{color:var(--text)}
.slide{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)}
.slide > .inner{min-height:0;overflow:hidden;opacity:0;transition:opacity .12s}
.open > .slide{grid-template-rows:1fr}
.open > .slide > .inner{opacity:1;transition:opacity .22s .16s}
.list{max-height:var(--lh,50vh);overflow-y:auto;scrollbar-width:none;padding:9px 0 12px;margin-left:7px;border-left:1px solid var(--border)}
.list::-webkit-scrollbar{display:none}
.ev-row{display:flex;align-items:flex-start;gap:8px;width:100%;background:none;border:0;padding:5px 0;cursor:pointer;text-align:left;color:var(--muted);font:400 12.5px/1.5 var(--f)}
.ev-row .ico{flex:none;width:16px;height:16px;margin-left:6px;margin-top:1px;display:grid;place-items:center;background:var(--bg);color:var(--dim);transition:transform .3s var(--ease),color .2s}
.ev-row .lg{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:4px;background:var(--g);color:#fff;font-size:8.5px;font-weight:700;margin-right:5px;vertical-align:2px} /* centre du logo = centre du nom du groupe */
.ev-row b{color:var(--fg);font-weight:500}
/* titre d'amendement sur deux lignes : la suite (« l'alinéa 2 ») repart sous la première lettre du groupe, comme le numéro en dessous */
.ev-row:not(.pk) > span:not(.ico){padding-left:19px;text-indent:-19px}
.ev-row:not(.pk) > span:not(.ico) .t,.ev-row:not(.pk) .lg{text-indent:0}
.ev-row:not(.pk) > span:not(.ico) .t{padding-left:0}
.ev-row .t{display:block;color:var(--dim);padding-left:19px;margin-top:.6px} /* sous la première lettre du groupe, pas sous le logo (14 px + 5 px) */
.ev-row:hover{color:var(--text)}
.ev-row:hover .ico{color:var(--text)}
/* amendement ouvert : sa ligne (logo, groupe, numéro, auteur) entre dans la carte avec son texte — un seul module */
.ev{border:1px solid transparent;border-radius:8px;transition:background .2s,border-color .2s}
.ev.open{background:var(--card);border-color:var(--border);margin:4px 0 10px 8px;box-shadow:var(--shadow)}
.ev.open > .ev-row{color:var(--text);padding:9px 12px 2px 0}
.ev.open > .ev-row .ico{margin-left:9px;background:transparent}
.ev.open .fiche{margin:0;border:0;background:none;box-shadow:none;padding:6px 14px 12px 33px}
.fiche>:first-child{margin-top:0}
.ev.open > .ev-row .ico{color:var(--fg);transform:rotate(45deg)}
.fiche{margin:2px 0 10px 8px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.fiche .head{display:flex;align-items:center;gap:8px;color:var(--dim);flex-wrap:wrap}
.fiche .head b{color:var(--fg);font-weight:500}
.fiche .head .lg{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;background:var(--g);color:#fff;font-size:9px;font-weight:700}
.fiche .amd{font-size:13px;line-height:1.6;margin:8px 0 6px;color:var(--text)}
.fiche .expo{margin:0 0 8px;color:var(--muted)}
.fiche dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:12px;color:var(--dim)}
.fell{margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.fell .fk{font-size:12px;color:var(--dim);margin:0 0 4px}
.fell .list{max-height:none}
.fell .fiche{background:var(--bg)}
.fiche dd{margin:0;color:var(--muted)}
.hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:11.5px;color:var(--dim);pointer-events:none}
/* --- mode comparer : la frise s'efface, un ou deux textes ouverts, et la liste des étapes à comparer --- */
.frise{transition:opacity .3s,transform .4s var(--ease)}
.page.cmping .frise{opacity:0;transform:scale(.97);pointer-events:none}
.cmp{position:absolute;inset:0;overflow:auto;scrollbar-width:none;padding:8px 16px 48px;opacity:0;pointer-events:none;transition:opacity .25s}
.cmp::-webkit-scrollbar{display:none}
.page.cmping .cmp{opacity:1;pointer-events:auto}
.cmp-in{display:flex;align-items:center;justify-content:center;gap:14px;min-height:100%;width:max-content;min-width:100%;margin:0 auto}
.cg{--cw:min(460px,calc((100cqw - 120px)/var(--n)));display:flex;gap:18px;align-self:center;align-items:flex-start}
.colc{flex:none;width:var(--cw);display:flex;flex-direction:column;max-height:calc(100cqh - 96px);min-height:0}
.colc .cbody{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
.colc .cbody::-webkit-scrollbar{display:none}
/* en-têtes et pieds collés : les cartes restent fermées pendant que le texte défile entre eux */
/* pas de filet sous l'en-tête ni au-dessus du pied : l'espace reste, la ligne disparaît */
.colc .c.h{border-bottom:1px solid transparent}
.colc .c.f{border-top:1px solid transparent}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.c{background:var(--card-2);border-left:1px solid var(--border);border-right:1px solid var(--border);padding:0 16px;min-width:0}
.c.h{position:relative;border-top:1px solid var(--border);border-radius:8px 8px 0 0;padding-top:12px;padding-bottom:12px;display:flex;align-items:flex-start;gap:10px;padding-right:46px}
.c.h .av{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--av);color:var(--muted);margin-top:-1px}
.c.h.now .av{background:var(--av-now);color:var(--now)}
.c.h .who{color:var(--fg);font-weight:500}
/* la date en bas de l'en-tête, à la même hauteur dans les deux colonnes, comme sur les cartes de la frise */
.c.h .meta{position:absolute;left:46px;right:46px;bottom:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colc .c.h{padding-bottom:36px}
/* date des en-têtes comparés : plus petite et estompée, pour laisser l'œil au texte */
.c.h .meta{font-size:12px;opacity:.5}
.c.h.now .who{color:var(--now)}

.c .n.add{color:var(--ins);font-weight:700}
.c .n.rem{text-decoration:line-through 1px var(--del)}
.al .n.add{color:var(--ins);font-weight:700}
.al .n.rem{text-decoration:line-through 1px var(--del)}
.c.f{border-bottom:1px solid var(--border);border-radius:0 0 8px 8px;height:14px}
.c.a{display:grid;grid-template-columns:18px 1fr;gap:0 6px;padding-top:3px;padding-bottom:5px;font-size:13.5px;line-height:1.65}
.c.a .n{font-size:11px;line-height:2.1;color:var(--dim);text-align:right}
.c.a.same p{color:var(--dim)}
.c.a .none{color:var(--dim);font-style:italic}
.x{position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:6px;border:1px solid var(--border-2);background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.x:hover{color:var(--fg);background:var(--hover)}
.pickl{flex:none;width:250px;align-self:center}
.pk.now b{color:var(--now)}

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function diff(a,b){
  if(a==null&&b==null) return "";
  if(a==null) return `<ins>${esc(b)}</ins>`;
  if(b==null) return `<del>${esc(a)}</del>`;
  const sp=x=>x.split(/(\s+|[.,;:])/).filter(Boolean);
  const A=sp(a),B=sp(b),n=A.length,m=B.length,L=Array.from({length:n+1},()=>new Int32Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0;const push=(t,s)=>{const l=out[out.length-1];if(l&&l.t===t)l.s+=s;else out.push({t,s});};
  while(i<n&&j<m){if(A[i]===B[j]){push("=",A[i]);i++;j++;}else if(L[i+1][j]>=L[i][j+1])push("-",A[i++]);else push("+",B[j++]);}
  while(i<n)push("-",A[i++]);while(j<m)push("+",B[j++]);
  // regroupe les changements voisins (séparés par un simple blanc) : « à l'alinéa précédent » → « au deuxième alinéa » en un seul bloc
  const res=[];let k=0;
  while(k<out.length){
    if(out[k].t==="="){res.push(esc(out[k].s));k++;continue;}
    let d="",ins="",e=k;
    while(e<out.length&&(out[e].t!=="="||(/^\s+$/.test(out[e].s)&&e+1<out.length&&out[e+1].t!=="="))){
      if(out[e].t==="-")d+=out[e].s;else if(out[e].t==="+")ins+=out[e].s;else{d+=out[e].s;ins+=out[e].s;}e++;}
    res.push((d.trim()?`<del>${esc(d)}</del>`:"")+(ins.trim()?`<ins>${esc(ins)}</ins>`:(d.trim()?"":esc(d))));k=e;
  }
  return res.join("");
}

const canScroll=(el,dy)=>{ for(let n=el;n&&n!==stage;n=n.parentElement){ if(n.matches&&n.matches(".list,.sheet.scrolling .txt,.cmp,.cbody")&&n.scrollHeight>n.clientHeight+1){ if(dy>0?n.scrollTop+n.clientHeight<n.scrollHeight-1:n.scrollTop>0) return true; } } return false; };
let wy=0,wt=0,wlock=0;
stage.addEventListener("wheel",e=>{
  if(e.ctrlKey) return;
  const fr=pages[cur].querySelector(".frise");
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY)) return;
  const now=Date.now();
  if(canScroll(e.target,e.deltaY)){ zoneAt=now; return; }
  e.preventDefault();
  if(e.shiftKey&&!inCmp()){ fr.scrollLeft+=e.deltaY; return; }
  if(!atRest()||inZone(e.target)){ zoneAt=now; wy=0; return; }
  if(now-zoneAt<500){ wy=0; return; }
  if(now<wlock) return; if(now-wt>250) wy=0; wt=now; wy+=e.deltaY;
  if(Math.abs(wy)>90){ go(cur+(wy>0?1:-1)); wy=0; wlock=now+650; }
},{passive:false});
let t0=null;
stage.addEventListener("touchstart",e=>{ const t=e.touches[0]; t0={x:t.clientX,y:t.clientY,el:e.target}; },{passive:true});
stage.addEventListener("touchend",e=>{
  if(!t0) return; const t=e.changedTouches[0], dx=t.clientX-t0.x, dy=t.clientY-t0.y, el=t0.el; t0=null;
  if(atRest()&&!inZone(el)&&Math.abs(dy)>70&&Math.abs(dy)>Math.abs(dx)*1.4&&!canScroll(el,-dy)) go(cur+(dy<0?1:-1));
},{passive:true});
let grab=null, moved=false;
stage.addEventListener("pointerdown",e=>{ if(e.pointerType!=="mouse"||e.button!==0||inCmp()||e.target.closest("button,select,.txt,.list")) return; grab={x:e.clientX,l:pages[cur].querySelector(".frise").scrollLeft}; moved=false; });
addEventListener("pointermove",e=>{ if(!grab) return; const dx=e.clientX-grab.x; if(Math.abs(dx)>4){ moved=true; const fr=pages[cur].querySelector(".frise"); fr.style.scrollBehavior="auto"; fr.scrollLeft=grab.l-dx; } });

const PEEK=56;

    const w=Math.min(480,stage.clientWidth-72); fr.scrollTo({left:Math.max(0,Math.min(target,target+w+after-fr.clientWidth+28)),behavior:"smooth"}); } },60);

function fit(sheet){

// --- comparer ---
// Un texte seul : la liste des étapes à comparer se tient à sa droite.
// Deux textes : toujours dans l'ordre chronologique, l'antérieur à gauche (vierge),
// le postérieur à droite avec ses corrections apparentes par rapport à l'antérieur.
// Fermer l'un : l'autre reste, à gauche, et la liste revient à sa droite. Fermer le dernier : retour à la frise.
// Règles du geste vertical (changer d'article) :
// 1. il ne marche que sur les espaces vides, jamais sur une zone qu'on manipule : une carte, ou l'interstice qui porte les plis ;
// 2. en mode comparer, il ne marche pas du tout : on referme d'abord.
function atRest(){ return !inCmp(); }
const inZone=el=>!!(el&&el.closest&&el.closest(".sheet,.gap:not(.empty)"));
var zoneAt=0; // dernier geste dans une zone : son élan ne déborde pas sur l'espace vide
function hint(){
  const r=atRest();
  document.getElementById("hint").textContent=r?"← → parcourir les étapes · ↑ ↓ changer d'article (sur les espaces vides)":"";
  document.getElementById("prev").disabled=!r||cur===0;
  document.getElementById("next").disabled=!r||cur===ARTICLES.length-1;
}
function cmpHead(i){
  const st=STEPS[i];
  return `<div class="c h${st.now?" now":""}" data-col="${i}"><span class="av">${st.now?DOTS:CHECK}</span><span><span class="who">${st.stage}</span>${metaOf(st)}</span>
    <button class="x" type="button" data-close="${i}" aria-label="Fermer ce texte">${X}</button></div>`;
}
function renderCmp(k,src){
  const page=pages[k], box=page.querySelector(".cmp"), items=CMP[k], art=ARTICLES[k];
  const before={}; box.querySelectorAll(".colc[data-col]").forEach(h=>before[h.dataset.col]=h.getBoundingClientRect());
  const lb=box.querySelector(".pickl"); const listBefore=lb?lb.getBoundingClientRect():null;
  page.classList.toggle("cmping",items.length>0); hint();
  if(!items.length){ box.innerHTML=""; return; }
  const keys=[...new Set(items.flatMap(i=>Object.keys(art.v[i])))].map(Number).sort((a,b)=>a-b);
  const rows={}; items.forEach(i=>rows[i]="");
  if(items.length===1){
    const i=items[0], prev=i?art.v[i-1]:null;
    keys.forEach(n=>{ const a=prev?prev[n]:undefined, b=art.v[i][n];
      rows[i]+=`<div class="c a${prev&&a===b?" same":""}"><span class="n${numCls(a,b,!!prev)}">${n}</span><p style="margin:0">${prev?diff(a??null,b??null):esc(b)}</p></div>`; });
  } else {
    const [l,r]=items, L=art.v[l], Rv=art.v[r];
    keys.forEach(n=>{ const a=L[n], b=Rv[n], same=a===b;
      rows[l]+=`<div class="c a${same?" same":""}"><span class="n">${a!=null?n:""}</span><p style="margin:0">${a!=null?esc(a):""}</p></div>`;
      rows[r]+=`<div class="c a${same?" same":""}"><span class="n${numCls(a,b,true)}">${n}</span><p style="margin:0">${diff(a??null,b??null)}</p></div>`; });
  }
  // chaque texte dans sa propre colonne, qui défile seule ; les alinéas restent alignés tant que les deux sont à la même hauteur
  const cols=items.map(i=>`<div class="colc" data-col="${i}">${cmpHead(i)}<div class="cbody">${rows[i]}</div><div class="c f"></div></div>`).join("");
  let html=`<div class="cmp-in"><div class="cg" style="--n:${items.length}">${cols}</div>`;
  if(items.length===1){
    const i=items[0], others=STEPS.map((s,j)=>j).filter(j=>j<DONE&&j!==i);
    html+=`<div class="pickl"><div class="list">${others.map(j=>`<div class="ev"><button class="ev-row pk${STEPS[j].now?" now":""}" type="button" data-pick="${j}" aria-label="Comparer avec ${STEPS[j].stage}"><span class="ico">${CMPS}</span><span><b>${STEPS[j].stage}</b>${metaOf(STEPS[j],"t")}</span></button></div>`).join("")}</div></div>`;
  }
  box.innerHTML=html+`</div>`; box.scrollTop=0;
  alignCmp(box);
  animateCmp(box,before,listBefore,src);
}
// même hauteur pour les alinéas de même rang dans les deux colonnes
function alignCmp(box){
  const bodies=[...box.querySelectorAll(".cbody")]; if(bodies.length<2) return;
  const cols=bodies.map(b=>[...b.children]); cols.flat().forEach(c=>c.style.minHeight="");
  cols.flat().forEach(c=>c.style.display="");
  cols[0].forEach((_,i)=>{ const h=Math.max(...cols.map(c=>c[i]?c[i].offsetHeight:0)); cols.forEach(c=>{ if(c[i]) c[i].style.minHeight=h+"px"; }); });
  // pas de vide en bas : les cases vides qui terminent une colonne (alinéas absents de ce texte) sont retirées
  cols.forEach(c=>{ for(let i=c.length-1;i>=0&&!c[i].textContent.trim();i--) c[i].style.display="none"; });
}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function animateCmp(box,before,listBefore,src){
  if(reduce) return;
  const E="cubic-bezier(.25,.8,.25,1)";
  box.querySelectorAll(".colc[data-col]").forEach(col=>{
    const c=col.dataset.col, now=col.getBoundingClientRect();
    const from=before[c]||(src&&String(src.i)===c?src.r:null)||(listBefore?{left:listBefore.left,top:now.top}:null);
    if(from){ const fresh=!before[c];
      col.animate([{transform:`translate(${from.left-now.left}px,${from.top-now.top}px)`,opacity:fresh?.4:1},{transform:"none",opacity:1}],{duration:fresh?420:380,easing:E,fill:"backwards"}); }
    else col.animate([{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}],{duration:320,easing:E});
  });
  const pl=box.querySelector(".pickl");
  if(pl) pl.animate([{opacity:0,transform:"translateX(-12px)"},{opacity:1,transform:"none"}],{duration:360,delay:listBefore?60:200,easing:E,fill:"backwards"});
}
document.addEventListener("click",e=>{
  if(moved){ moved=false; e.stopPropagation(); e.preventDefault(); return; }
  const cb=e.target.closest(".cmpbtn");
  if(cb){ const s=cb.closest(".sheet"); CMP[cur]=[+s.dataset.i]; renderCmp(cur,{i:+s.dataset.i,r:s.getBoundingClientRect()}); return; }
  const pk=e.target.closest("[data-pick]");
  if(pk){ CMP[cur]=[...CMP[cur],+pk.dataset.pick].sort((a,b)=>a-b); renderCmp(cur); return; }
  const x=e.target.closest("[data-close]");
  if(x){ CMP[cur]=CMP[cur].filter(i=>i!==+x.dataset.close); renderCmp(cur); return; }
  const tg=e.target.closest(".toggle");
  if(tg){ const s=tg.closest(".sheet"); s.classList.contains("open")?closeSheet(s):openSheet(s); hint(); return; }
  const fh=e.target.closest(".fold-head");
  if(fh){
    const f=fh.parentElement, gap=f.closest(".gap");
    const was=f.classList.contains("open");
    // accordéon : un seul pli ouvert par interstice
    gap.querySelectorAll(".fold.open").forEach(o=>{ o.classList.remove("open"); o.querySelectorAll(".ev.open").forEach(x=>x.classList.remove("open")); });
    if(!was){ fitList(f); f.classList.add("open"); }
    clearLit(); syncGap(gap); hint();
    if(f.classList.contains("open")) setTimeout(()=>reveal(gap),390);
    return;
  }
  const row=e.target.closest(".ev-row");
  if(row){
    const ev=row.parentElement, was=ev.classList.contains("open");
    ev.classList.toggle("open",!was); relight(ev.closest(".gap"));
    if(!was) setTimeout(()=>ev.scrollIntoView({block:"nearest",behavior:"smooth"}),340);
  }
},true);
function clearLit(){ document.querySelectorAll(".al.lit").forEach(x=>x.classList.remove("lit")); document.querySelectorAll(".sheet.pulse").forEach(x=>x.classList.remove("pulse")); }
// tous les amendements adoptés ouverts allument leur alinéa dans la carte suivante
function relight(gap){
  clearLit(); const next=gap&&gap.nextElementSibling; if(!next) return;
  const evs=[...gap.querySelectorAll(".ev.open")].filter(x=>x.dataset.sort==="adopté"); if(!evs.length) return;
  evs.forEach(x=>{ const p=next.querySelector(`.al[data-al="${x.dataset.al}"]`); if(p) p.classList.add("lit"); });
  next.classList.add("pulse"); setTimeout(()=>next.classList.remove("pulse"),900);
}
function light(ev){
  if(ev.dataset.sort!=="adopté") return;
  const next=ev.closest(".gap").nextElementSibling; if(!next) return;
  const p=next.querySelector(`.al[data-al="${ev.dataset.al}"]`); if(p) p.classList.add("lit");

}
document.addEventListener("keydown",e=>{
  const fr=pages[cur].querySelector(".frise");
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ if(atRest()){ e.preventDefault(); go(cur+(e.key==="ArrowDown"?1:-1)); } return; }
  if(!inCmp()&&e.key==="ArrowRight"){ e.preventDefault(); fr.scrollBy({left:320,behavior:"smooth"}); return; }
  if(!inCmp()&&e.key==="ArrowLeft"){ e.preventDefault(); fr.scrollBy({left:-320,behavior:"smooth"}); return; }

  const f=document.querySelector(".fold.open"); if(f){ f.classList.remove("open"); syncGap(f.closest(".gap")); hint(); }
});
// ===== le dossier : onglet « Texte » =====

}
function showArt(k,rec=true){
  view="art"; content.classList.remove("docmode"); header(); go(k); header(); sideSync(); sizes(); if(rec) H2.push(cur);
}
const goOrig=go;
go=function(k){ if(view!=="art") return; goOrig(k); if(view==="art"){ header(); sideSync(); H2.push(cur); } };
const nav=e=>e==="d"?showDoc(false):showArt(e,false);
document.getElementById("hback").onclick=()=>{ if(H2.at>0){ H2.at--; nav(H2.list[H2.at]); H2.ui(); } };
document.getElementById("hfwd").onclick=()=>{ if(H2.at<H2.list.length-1){ H2.at++; nav(H2.list[H2.at]); H2.ui(); } };
// panneau latéral : le texte ouvre le dossier, un article ouvre sa frise
document.querySelectorAll(".side > .it:not(.sub):not(.off)")[0].addEventListener("click",()=>showDoc());
document.getElementById("arts").addEventListener("click",e=>{ const b=e.target.closest("[data-art]"); if(b) setTimeout(()=>showArt(+b.dataset.art)); },true);
// clics du dossier et de l'en-tête
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"); if(o){ showArt(+o.dataset.open); return; }
  if(e.target.closest("[data-up]")){ showDoc(); return; }
  const sel=document.querySelector(".mh .stsel");
  const sb=e.target.closest(".stbtn"); if(sb){ sel.classList.toggle("open"); return; }
  const it=e.target.closest("[data-step]"); if(it&&!it.disabled){ step=+it.dataset.step; showDoc(false); docEl.scrollTop=0; return; }
  if(sel&&!e.target.closest(".stsel")) sel.classList.remove("open");
});
// au clavier : dans le dossier, haut/bas font défiler le texte (pas de changement d'article) ; Échap ferme le menu
const atRestOrig=atRest; atRest=()=>view==="art"&&atRestOrig();
document.addEventListener("keydown",e=>{
  if(view==="art") return;
  if(e.key==="Escape"){ document.querySelector(".mh .stsel")?.classList.remove("open"); e.stopImmediatePropagation(); }
  if(e.key==="ArrowLeft"||e.key==="ArrowRight") e.stopImmediatePropagation();
},true);
H2.list=[]; H2.at=-1; showDoc();
// ===== onglet « Historique » du dossier (essai) =====
// Une petite carte par article, en colonne ; un clic ouvre la frise de l'article.
const PLACE=[]; // articles sans données (1 et 2) : retirés pour le moment
const HSTATE={done:["Examiné",""],live:["En cours","live"],todo:["À examiner",""]};
function histHTML(){
  const ph=PLACE.map(a=>`<button class="hc" type="button" disabled title="Exemple non rempli"><div class="hd"><span class="av">${a.n}</span><span class="tx"><span class="who">Article ${a.n}</span><span class="tt">${a.t}</span></span></div><span class="meta">Adopté conforme</span></button>`).join("");
  const real=ARTICLES.map((a,k)=>{ const [lab,cls]=HSTATE[STATE[k]], nb=a.amds.reduce((s,l)=>s+(l?l.length:0),0);
    return `<button class="hc${cls?" live":""}" type="button" data-open="${k}" title="Ouvrir l'historique de l'article"><div class="hd"><span class="av">${a.n}</span><span class="tx"><span class="who">Article ${a.n}</span><span class="tt">${a.t}</span></span></div><span class="go">${ICONS.arrow}</span><span class="meta${cls?" live":""}">${lab} · ${nb} amendements</span></button>`; }).join("");
  return `<div class="hist-in">${ph}${real}</div>`;
}
let artFrom="h"; // onglet d'où l'on a ouvert l'article : "d" (Texte) ou "h" (Historique)
function renderDossier(){
  docEl.style.setProperty("--edge",getComputedStyle(document.getElementById("stage")).getPropertyValue("--edge")||"18px");
  docEl.innerHTML=view==="doc"?docHTML():histHTML();
}
const showDocOrig=showDoc;
showDoc=function(rec=true){ view="doc"; content.classList.add("docmode"); renderDossier(); header(); sideSync(); if(rec) H2.push("d"); };
function showHist(rec=true){ view="hist"; content.classList.add("docmode"); renderDossier(); header(); sideSync(); alignH(); docEl.scrollTop=0; if(rec) H2.push("h"); }
function alignH(){
  const box=docEl.querySelector(".hist-in"), h=crumb.querySelector(".c1"); if(!box) return;
  const ok=view==="hist"&&h&&h.offsetParent; box.classList.toggle("hx",!!ok);
  if(ok) docEl.style.setProperty("--hx",Math.round(h.getBoundingClientRect().left-docEl.getBoundingClientRect().left)+"px");
}
addEventListener("resize",alignH);
document.querySelector(".wb").addEventListener("transitionend",e=>{ if(e.propertyName==="grid-template-columns") alignH(); });
if(document.fonts) document.fonts.ready.then(alignH);
const headerOrig=header;
header=function(){
  document.querySelector(".mh").classList.toggle("dmode",view==="doc");
  // Historique : exactement la barre de l'article, sans son dernier maillon (l'article, « replié »)
  if(view==="hist"){ document.querySelectorAll(".mh .stsel").forEach(x=>x.remove()); crumb.classList.remove("dcr");
    crumb.innerHTML=`<button class="lk" type="button" data-up title="Revenir au texte">Accès au logement</button>${ICONS.sep}<span class="c1">Historique</span>`;
    tabs.innerHTML=ART_TABS; return; }
  if(view==="art"){ headerOrig();
    const from=artFrom==="d"?"Texte":"Historique";
    crumb.querySelector(".c1").outerHTML=`<button class="lk c1" type="button" data-tab="${artFrom}">${from}</button>`;
    return; }
  const v=view; view="doc"; headerOrig(); view=v;
  if(v==="hist") document.querySelectorAll(".mh .stsel").forEach(x=>x.remove());
  tabs.innerHTML=`<button type="button" data-tab="d" class="${v==="doc"?"on":""}">Texte</button><button type="button" data-tab="h" class="${v==="hist"?"on":""}">Historique</button><button type="button" title="À venir">Amendements</button><button type="button" title="À venir">Documents</button>`;
};
const sideOrig=sideSync;
sideSync=function(){ const v=view; if(v==="hist") view="doc"; sideOrig(); view=v; };
const showArtOrig=showArt;
showArt=function(k,rec=true){ if(view==="doc"||view==="hist") artFrom=view==="doc"?"d":"h"; showArtOrig(k,rec); };
const nav2=e=>e==="d"?showDoc(false):e==="h"?showHist(false):showArt(e,false);
document.getElementById("hback").onclick=()=>{ if(H2.at>0){ H2.at--; nav2(H2.list[H2.at]); H2.ui(); } };
document.getElementById("hfwd").onclick=()=>{ if(H2.at<H2.list.length-1){ H2.at++; nav2(H2.list[H2.at]); H2.ui(); } };
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]"); if(!t) return;
  e.stopImmediatePropagation(); t.dataset.tab==="d"?showDoc():showHist();
},true);
// dans le dossier (Texte ou Historique), le clavier ne change pas d'article
const atRest2=atRest; atRest=()=>view==="art"&&atRest2();
H2.list=[]; H2.at=-1; showHist();
</script>

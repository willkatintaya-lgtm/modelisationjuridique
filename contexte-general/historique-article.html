<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Historique d'un article</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Historique d'un article, repris du design de l'historique replié de Linear :
   fond presque noir, cartes sombres, texte sans empattement, une ligne par événement.
   Cartes = versions de l'article (une par étape) ; entre deux cartes, deux plis : adoptés, puis rejetés ou retirés. */
:root{
  --bg:#08090a; --card:#121315; --card-2:#17181b; --border:#1f2023; --border-2:#2a2b2f;
  --fg:#f7f8f8; --text:#d0d6e0; --muted:#8a8f98; --dim:#62666d; --faint:#3e4046;
  --ins:#8ab4ff; --del:#e5484d;
  --f:"Inter",system-ui,-apple-system,sans-serif; --ease:cubic-bezier(.25,.8,.25,1);
  --rail:17px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.5 var(--f);-webkit-font-smoothing:antialiased;overflow:hidden;font-feature-settings:"cv11","ss01"}
#scroller{position:fixed;inset:0;overflow-y:auto;scrollbar-width:none;scroll-behavior:smooth}
#scroller::-webkit-scrollbar{display:none}
.col{position:relative;max-width:640px;margin:0 auto;padding:40px 16px 40vh}
.top{margin:0 0 20px}
.top .k{font-size:12px;color:var(--dim)}
.top h1{margin:4px 0 0;font:500 17px/1.4 var(--f);color:var(--fg);letter-spacing:-.01em}

/* --- cartes : une version de l'article --- */
.sheet{position:relative;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;cursor:pointer;transition:border-color .2s,background .2s}
.sheet:hover{border-color:var(--border-2)}
.sheet.open{cursor:auto;background:var(--card-2)}
.sheet.pulse{border-color:#5e6ad2}
.sheet .row{display:flex;align-items:center;gap:10px}
.sheet .av{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#2a2c31;color:var(--muted)}
.sheet .who{color:var(--fg);font-weight:500}
.sheet .meta{color:var(--dim)}
.sheet .sub{margin:4px 0 0 30px;color:var(--muted)}
.sheet .chip{display:inline-block;margin-left:2px;color:var(--muted)}
.sheet .chip.now{color:#c9a8ff}
.txt{position:relative;overflow:hidden;max-height:var(--h,0px);transition:max-height .4s var(--ease);margin-left:30px;scrollbar-width:none;font-size:13.5px;line-height:1.65}
.txt::-webkit-scrollbar{display:none}
.sheet.open .txt{margin-top:10px;-webkit-mask-image:linear-gradient(transparent 0,#000 12px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(transparent 0,#000 12px,#000 calc(100% - 22px),transparent)}
.sheet.open.fits .txt{-webkit-mask-image:none;mask-image:none}
.sheet.scrolling .txt{overflow-y:auto}
.al{display:grid;grid-template-columns:18px 1fr;gap:0 6px;margin:0 0 .6em;padding:2px 6px 2px 0;border-radius:4px;transition:background .3s}
.al:first-child{padding-top:6px}
.al .n{font-size:11px;line-height:2.1;color:var(--dim);text-align:right}
.al.lit{background:rgba(94,106,210,.16)}
.al.same{color:var(--dim)}
.sheet:not(.open) .al.same{display:none}
.sheet ins,.fiche ins{color:var(--ins);text-decoration:underline 1px;text-underline-offset:3px;font-weight:500;background:none}
.sheet del,.fiche del{color:var(--dim);text-decoration:line-through 1px var(--del);background:none}
.sheet:not(.open) .foot{display:none}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 0 30px;font-size:12px;color:var(--dim)}
.more{font:500 12px var(--f);color:var(--muted);background:none;border:1px solid var(--border-2);border-radius:6px;padding:3px 10px;cursor:pointer}
.more:hover{color:var(--fg);background:#1f2023}
.sheet .hit{position:absolute;inset:0}
.sheet.open .hit{display:none}

/* --- entre deux cartes : le fil et les plis --- */
.between{position:relative;padding:8px 0;display:flex;flex-direction:column}
.between::before{content:"";position:absolute;left:var(--rail);top:0;bottom:0;width:1px;background:var(--border)}
.fold-head{position:relative;display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:6px 0;color:var(--muted);font:400 12.5px var(--f);text-align:left;cursor:pointer}
.fold-head .pin{position:relative;z-index:1;flex:none;width:16px;height:16px;margin-left:calc(var(--rail) - 8px);display:grid;place-items:center;background:var(--bg);color:var(--dim)}
.fold-head:hover{color:var(--text)}
.fold-head:hover .pin{color:var(--text)}
.fold.open > .fold-head{color:var(--text)}
.slide{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.slide > .inner{min-height:0;overflow:hidden;opacity:0;transition:opacity .12s}
.open > .slide{grid-template-rows:1fr}
.open > .slide > .inner{opacity:1;transition:opacity .2s .1s}

.ev-row{display:flex;align-items:flex-start;gap:10px;width:100%;background:none;border:0;padding:5px 0;cursor:pointer;text-align:left;color:var(--muted);font:400 12.5px/1.55 var(--f)}
.ev-row .ico{position:relative;z-index:1;flex:none;width:16px;height:16px;margin-left:calc(var(--rail) - 8px);margin-top:1px;display:grid;place-items:center;background:var(--bg);color:var(--dim)}
.ev-row .lg{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:4px;background:var(--g);color:#fff;font-size:8.5px;font-weight:700;margin-right:5px;vertical-align:-2px}
.ev-row b{color:var(--fg);font-weight:500}
.ev-row .t{color:var(--dim)}
.ev-row:hover{color:var(--text)}
.ev.open > .ev-row .ico{color:var(--text)}
.fiche{margin:4px 0 10px 28px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.fiche .head{display:flex;align-items:center;gap:8px;color:var(--dim)}
.fiche .head b{color:var(--fg);font-weight:500}
.fiche .head .lg{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;background:var(--g);color:#fff;font-size:9px;font-weight:700}
.fiche .amd{font-size:13.5px;line-height:1.65;margin:8px 0 6px;color:var(--text)}
.fiche .expo{margin:0 0 8px;color:var(--muted)}
.fiche dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:12px;color:var(--dim)}
.fiche dd{margin:0;color:var(--muted)}
@media (max-width:520px){ .txt,.foot{margin-left:0} .sheet .sub{margin-left:0} .fiche{margin-left:12px} }
</style>
</head>
<body>
<div id="scroller"><div class="col" id="col"></div></div>
<script>
const GROUPS={
  RAP:{name:"Rapporteur",color:"#b89a5a"}, SOL:{name:"Solidarité et logement",color:"#d13a30"}, ECO:{name:"Écologie urbaine",color:"#2a9d63"},
  UT:{name:"Union des territoires",color:"#3b82d6"}, LL:{name:"Libertés locales",color:"#e0671d"}, RC:{name:"Rassemblement des communes",color:"#7c5cd6"},

const CHAPEAU="Le chapitre II du titre préliminaire du livre III du code de la construction et de l'habitation est ainsi modifié :";
// Versions successives de l'article 4 (données fictives). Clé = numéro d'alinéa.

 3:"Le prélèvement mentionné à l'alinéa précédent est plafonné à 5 % des dépenses réelles de fonctionnement de la commune et affecté au fonds national des aides à la pierre.",

// a = amendement : g groupe, num, who, al alinéa visé, mode (rediger|completer|supprimer|ajouter), texte proposé (null = suppression), sort, expo, avis, vote
const STAGES=[
 {key:"depot", stage:"Dépôt au Sénat", date:"4 mars 2026", h:"Texte du Gouvernement", chip:"texte initial", v:V0},
 {key:"comS", stage:"Commission des affaires économiques du Sénat", date:"25 mars 2026", h:"Texte adopté par la commission", chip:"adopté modifié", v:V1, amds:[
   {g:"RAP",num:"COM-14",who:"M. Delorme",al:2,text:V0[2].replace("20 %","25 %"),sort:"adopté",expo:"Aligner le taux sur l'objectif national déjà applicable aux communes les plus tendues.",avis:"Gouvernement : sagesse",vote:"Adopté à main levée"},
   {g:"ECO",num:"COM-31",who:"Mme Laurent",al:2,text:V0[2].replace("2032","2030"),sort:"adopté",expo:"Avancer l'échéance pour la faire coïncider avec la fin du prochain programme local de l'habitat.",avis:"Rapporteur : favorable · Gouvernement : défavorable",vote:"Adopté par 21 voix contre 17"},

   {g:"UT",num:"COM-52",who:"Mme Garnier",al:4,text:V0[4].replace("deux ans","trois ans"),sort:"adopté",expo:"Deux ans ne suffisent pas pour élaborer et faire approuver un programme local de l'habitat.",avis:"Rapporteur : favorable · Gouvernement : sagesse",vote:"Adopté à main levée"},
   {g:"DC",num:"COM-23",who:"M. Royer",al:5,text:V1[5],sort:"adopté",expo:"Associer les acteurs locaux du logement avant toute exemption.",avis:"Rapporteur : favorable · Gouvernement : favorable",vote:"Adopté à main levée"},
   {g:"CP",num:"COM-40",who:"Mme Vasseur",al:6,mode:"ajouter",text:V1[6],sort:"adopté",expo:"Tenir compte du logement intermédiaire, sans qu'il se substitue au logement social.",avis:"Rapporteur : sagesse · Gouvernement : favorable",vote:"Adopté par 19 voix contre 16"},
   {g:"LL",num:"COM-3",who:"M. Perrin",al:2,mode:"supprimer",text:null,sort:"rejeté",expo:"Laisser aux communes la maîtrise de leur politique de logement.",avis:"Rapporteur : défavorable · Gouvernement : défavorable",vote:"Rejeté"},
   {g:"RC",num:"COM-18",who:"Mme Aubert",al:2,text:V0[2].replace("3 500","10 000"),sort:"rejeté",expo:"Épargner les petites communes, qui manquent de foncier et d'ingénierie.",avis:"Rapporteur : défavorable · Gouvernement : défavorable",vote:"Rejeté"},
   {g:"SOL",num:"COM-8",who:"M. Ferrand",al:2,text:V0[2].replace("20 %","30 %"),sort:"rejeté",expo:"Répondre à l'ampleur de la demande de logement social.",avis:"Rapporteur : défavorable · Gouvernement : défavorable",vote:"Rejeté"},
   {g:"PR",num:"COM-27",who:"M. Lemaire",al:2,text:V0[2].replace(" de la commune."," de la commune, après mise en demeure."),sort:"retiré",expo:"Prévoir une mise en demeure avant tout prélèvement.",avis:"Rapporteur : demande de retrait",vote:"Retiré au profit d'une réécriture en séance"},
   {g:"AR",num:"COM-61",who:"Mme Blanc",al:5,mode:"supprimer",text:null,sort:"rejeté",expo:"L'exemption crée une inégalité entre communes.",avis:"Rapporteur : défavorable · Gouvernement : défavorable",vote:"Rejeté"},
   {g:"ECO",num:"COM-33",who:"Mme Laurent",al:4,text:V0[4].replace("deux ans","dix-huit mois"),sort:"retiré",expo:"Raccourcir le délai d'adoption du programme.",avis:"Rapporteur : demande de retrait",vote:"Retiré"},
   {g:"LL",num:"COM-4",who:"M. Perrin",al:3,mode:"supprimer",text:null,sort:"rejeté",expo:"Supprimer le prélèvement, inefficace et punitif.",avis:"Rapporteur : défavorable · Gouvernement : défavorable",vote:"Rejeté"}
 ]},
 {key:"seanceS", stage:"Séance publique du Sénat", date:"8 avril 2026", h:"Texte adopté par le Sénat", chip:"adopté modifié", v:V2, amds:[
   {g:"AR",num:"n° 203",who:"Mme Blanc",al:5,text:V2[5],sort:"adopté",expo:"Un avis simple ne protège pas assez contre les exemptions de complaisance.",avis:"Commission : favorable · Gouvernement : sagesse",vote:"Adopté par 172 voix contre 160"},
   {g:"RC",num:"n° 118",who:"Mme Aubert",al:6,text:V2[6],sort:"adopté",expo:"Mieux reconnaître l'effort des communes qui développent le logement intermédiaire.",avis:"Commission : sagesse · Gouvernement : défavorable",vote:"Adopté par 168 voix contre 165"},
   {g:"SOL",num:"n° 212",who:"M. Ferrand",al:2,text:V1[2].replace("25 %","30 %").replace("2030","2028"),sort:"rejeté",expo:"Accélérer le rattrapage dans les communes carencées.",avis:"Commission : défavorable · Gouvernement : défavorable",vote:"Rejeté par 98 voix contre 236"},
   {g:"ECO",num:"n° 87",who:"Mme Laurent",al:2,text:V1[2].replace("25 %","30 %"),sort:"rejeté",expo:"Porter le taux à 30 %.",avis:"Commission : défavorable · Gouvernement : défavorable",vote:"Rejeté"},
   {g:"UT",num:"n° 340",who:"Mme Garnier",al:2,text:V1[2].replace("25 %","20 %").replace("2030","2035"),sort:"rejeté",expo:"Tenir compte de la disponibilité foncière.",avis:"Commission : défavorable · Gouvernement : défavorable",vote:"Rejeté"},
   {g:"LL",num:"n° 15",who:"M. Perrin",al:2,mode:"supprimer",text:null,sort:"rejeté",expo:"Supprimer l'obligation.",avis:"Commission : défavorable · Gouvernement : défavorable",vote:"Rejeté"},
   {g:"RC",num:"n° 402",who:"Mme Aubert",al:2,text:V1[2].replace("3 500","10 000"),sort:"rejeté",expo:"Relever le seuil à 10 000 habitants.",avis:"Commission : défavorable · Gouvernement : défavorable",vote:"Rejeté"},
   {g:"PR",num:"n° 198",who:"M. Lemaire",al:2,text:V1[2].replace("2030","2032"),sort:"retiré",expo:"Reporter l'échéance à 2032.",avis:"Commission : demande de retrait",vote:"Retiré"},
   {g:"DC",num:"n° 77",who:"M. Royer",al:3,text:V1[3].replace("5 %","3 %"),sort:"rejeté",expo:"Abaisser le plafond du prélèvement.",avis:"Commission : défavorable · Gouvernement : défavorable",vote:"Rejeté"},
   {g:"CP",num:"n° 260",who:"Mme Vasseur",al:4,text:V1[4].replace("trois ans","quatre ans"),sort:"retiré",expo:"Allonger le délai à quatre ans.",avis:"Commission : demande de retrait",vote:"Retiré"},
   {g:"GOUV",num:"n° 301",who:"Gouvernement",al:6,mode:"supprimer",text:null,sort:"rejeté",expo:"Ne pas affaiblir l'objectif de logement social.",avis:"Commission : défavorable",vote:"Rejeté par 150 voix contre 184"}
 ]},
 {key:"comAN", stage:"Commission des affaires économiques de l'Assemblée", date:"13 mai 2026", h:"Texte adopté par la commission", chip:"en discussion", now:true, v:V3, amds:[

   {g:"RAP",num:"CE-301",who:"Mme Henry",al:3,text:V3[3],sort:"adopté",expo:"Amendement rédactionnel.",avis:"Gouvernement : favorable",vote:"Adopté à main levée"},

   {g:"LL",num:"CE-40",who:"M. Caron",al:5,mode:"supprimer",text:null,sort:"rejeté",expo:"Supprimer l'avis conforme.",avis:"Rapporteure : défavorable",vote:"Rejeté"},
   {g:"AR",num:"CE-55",who:"M. Noël",al:4,text:V2[4].replace("trois ans","cinq ans"),sort:"retiré",expo:"Allonger le délai pour les communes rurales.",avis:"Rapporteure : demande de retrait",vote:"Retiré"},
   {g:"ECO",num:"CE-70",who:"M. Weber",al:6,mode:"supprimer",text:null,sort:"rejeté",expo:"Ne pas décompter le logement intermédiaire.",avis:"Rapporteure : défavorable · Gouvernement : défavorable",vote:"Rejeté"}
 ]}
];

// --- différence mot à mot (portée sur la rédaction la plus récente ; l'ancienne reste vierge) ---
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function diff(a,b){
  if(a==null&&b==null) return "";
  if(a==null) return `<ins>${esc(b)}</ins>`;
  if(b==null) return `<del>${esc(a)}</del>`;
  const A=a.split(/(\s+|[.,;:])/).filter(Boolean),B=b.split(/(\s+|[.,;:])/).filter(Boolean),n=A.length,m=B.length,L=Array.from({length:n+1},()=>new Int32Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0;const push=(t,s)=>{const l=out[out.length-1];if(l&&l.t===t)l.s+=s;else out.push({t,s});};
  while(i<n&&j<m){if(A[i]===B[j]){push("=",A[i]);i++;j++;}else if(L[i+1][j]>=L[i][j+1])push("-",A[i++]);else push("+",B[j++]);}
  while(i<n)push("-",A[i++]);while(j<m)push("+",B[j++]);
  // un blanc isolé entre deux changements rejoint le changement, pour des corrections lisibles
  return out.map(o=>o.t==="="?esc(o.s):o.t==="-"?`<del>${esc(o.s)}</del>`:`<ins>${esc(o.s)}</ins>`).join("");
}
const VERB={rediger:"réécrit",completer:"complète",supprimer:"supprime",ajouter:"ajoute"};
const ICO={
  rediger:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10.5 2.5l3 3L6 13H3v-3z"/></svg>',
  completer:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg>',
  ajouter:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg>',
  supprimer:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10"/></svg>'};
const CHEV='<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3.5 4.5L6 2l2.5 2.5M3.5 7.5L6 10l2.5-2.5"/></svg>';
const STEP='<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8.5l3 3 7-7"/></svg>';
const DOC='<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 2h5l3 3v9H4z"/><path d="M9 2v3h3"/></svg>';
const plural=(n,s,p)=>`${n} ${n>1?p:s}`;

function sheetHTML(st,i){
  const prev=i?STAGES[i-1].v:null, keys=[...new Set([...Object.keys(prev||{}),...Object.keys(st.v)])].map(Number).sort((a,b)=>a-b);
  const als=keys.map(k=>{
    const a=prev?prev[k]:undefined,b=st.v[k], same=prev&&a===b;
    const body=!prev?esc(b):diff(a??null,b??null);
    return `<div class="al${same?" same":""}" data-al="${k}"><span class="n">${k}</span><p style="margin:0">${body}</p></div>`;
  }).join("");
  return `<article class="sheet" data-i="${i}">
    <div class="row"><span class="av">${i?STEP:DOC}</span><span><span class="who">${st.stage}</span> <span class="meta">· ${st.date}</span></span></div>
    <div class="sub">${st.h} · <span class="chip${st.now?" now":""}">${st.chip}</span></div>
    <div class="txt">${als}</div>
    <div class="foot"><span>${i?"Corrections apparentes par rapport à l'étape précédente":"Projet de loi n° 412"}</span><button class="more" type="button">Réduire</button></div>
    <div class="hit"></div>
  </article>`;
}
function evHTML(a,prevV){
  const mode=a.mode||"rediger", g=GROUPS[a.g];
  const what=mode==="ajouter"?`ajoute l'alinéa ${a.al}`:`${VERB[mode]} l'alinéa ${a.al}`;
  const amd=mode==="ajouter"?`<ins>${esc(a.text)}</ins>`:diff(prevV[a.al],a.text);
  return `<div class="ev" data-al="${a.al}" data-sort="${a.sort}">
    <button class="ev-row" type="button"><span class="ico">${ICO[mode]}</span>
      <span><span class="lg" style="--g:${g.color}">${g.name[0]}</span><b>${g.name}</b> ${what} <span class="t">· ${a.num} · ${a.who} · ${a.sort}</span></span></button>
    <div class="slide"><div class="inner"><div class="fiche">
      <div class="head"><span class="lg" style="--g:${g.color}">${g.name[0]}</span><b>${g.name}</b><span>· ${a.num} · ${a.who}</span></div>
      <div class="amd">${amd}</div>
      <p class="expo">${esc(a.expo)}</p>
      <dl><dt>Avis</dt><dd>${a.avis}</dd><dt>Vote</dt><dd>${a.vote}</dd></dl>
    </div></div></div>
  </div>`;
}
function foldHTML(list,label,cls,prevV){
  if(!list.length) return "";
  return `<div class="fold ${cls}"><button class="fold-head" type="button"><span class="pin">${CHEV}</span><span class="lbl">${label}</span></button>
    <div class="slide"><div class="inner">${list.map(a=>evHTML(a,prevV)).join("")}</div></div></div>`;
}
const col=document.getElementById("col");
col.innerHTML=`<header class="top"><div class="k">Projet de loi pour l'accès au logement · Historique</div><h1>Article 4 — Obligation de logements sociaux</h1></header>`+
  STAGES.map((st,i)=>{
    let h=sheetHTML(st,i);
    const nx=STAGES[i+1];
    if(nx){
      const ad=nx.amds.filter(a=>a.sort==="adopté"), rr=nx.amds.filter(a=>a.sort!=="adopté");
      h+=`<div class="between" data-i="${i}">`+
        foldHTML(ad,`${plural(ad.length,"amendement adopté","amendements adoptés")}`,"adp",st.v)+
        foldHTML(rr,`${plural(rr.length,"amendement rejeté ou retiré","amendements rejetés ou retirés")}`,"rej",st.v)+`</div>`;
    }
    return h;
  }).join("");

// --- comportements ---
const scroller=document.getElementById("scroller");
const sheets=[...document.querySelectorAll(".sheet")];
const PEEK=34; // arête de la feuille suivante, toujours visible sous les plis
function closeFoldsAfter(sheet){
  const b=sheet.nextElementSibling; if(!b||!b.classList.contains("between")) return;
  b.querySelectorAll(".open").forEach(o=>o.classList.remove("open"));
}
function openSheet(sheet){
  sheets.forEach(s=>{ if(s!==sheet&&s.classList.contains("open")) closeSheet(s); });
  closeFoldsAfter(sheet);
  const txt=sheet.querySelector(".txt"), b=sheet.nextElementSibling;
  sheet.classList.add("open");
  const chrome=sheet.offsetHeight-txt.offsetHeight;
  let below=0;
  if(b&&b.classList.contains("between")){
    const cs=getComputedStyle(b);
    below=[...b.querySelectorAll(".fold-head")].reduce((s,h)=>s+h.offsetHeight+2,0)+parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom)+PEEK;
  }
  const top=16, avail=scroller.clientHeight-top-chrome-below;
  sheet.classList.add("open");
  const full=txt.scrollHeight, h=Math.max(120,Math.min(full,b?avail:full));
  sheet.classList.toggle("fits",full<=h);
  txt.style.setProperty("--h",h+"px");
    setTimeout(()=>{ if(sheet.classList.contains("open")) sheet.classList.add("scrolling"); },420);
  scroller.scrollTo({top:sheet.offsetTop-top,behavior:"smooth"});
}
function closeSheet(sheet){
  const txt=sheet.querySelector(".txt");
  sheet.classList.remove("open","scrolling","fits"); txt.scrollTop=0; txt.style.removeProperty("--h");
}
document.addEventListener("click",e=>{
  const more=e.target.closest(".more,.sheet .hit");
  if(more){ const s=more.closest(".sheet"); s.classList.contains("open")?closeSheet(s):openSheet(s); return; }
  const fh=e.target.closest(".fold-head");
  if(fh){ const f=fh.parentElement; if(f.classList.contains("open")) f.querySelectorAll(".ev.open").forEach(x=>x.classList.remove("open")); f.classList.toggle("open"); clearLit(); return; }
  const row=e.target.closest(".ev-row");
  if(row){
    const ev=row.parentElement, was=ev.classList.contains("open");
    ev.parentElement.querySelectorAll(".ev.open").forEach(x=>x.classList.remove("open")); clearLit();
    if(!was){ ev.classList.add("open"); light(ev); }
  }
});
// le passage produit par l'amendement s'allume dans la version suivante
function clearLit(){ document.querySelectorAll(".al.lit").forEach(x=>x.classList.remove("lit")); document.querySelectorAll(".sheet.pulse").forEach(x=>x.classList.remove("pulse")); }
function light(ev){
  if(ev.dataset.sort!=="adopté") return;
  const next=ev.closest(".between").nextElementSibling; if(!next) return;
  const p=next.querySelector(`.al[data-al="${ev.dataset.al}"]`); if(!p) return;
  p.classList.add("lit"); next.classList.add("pulse");
  if(!next.classList.contains("open")){ const t=next.querySelector(".txt"); t.scrollTop=0; }
  setTimeout(()=>next.classList.remove("pulse"),900);
}
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  const ev=document.querySelector(".ev.open"); if(ev){ ev.classList.remove("open"); clearLit(); return; }
  const s=document.querySelector(".sheet.open"); if(s){ closeSheet(s); return; }
  const f=document.querySelector(".fold.open"); if(f) f.classList.remove("open");
});
</script>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Historique des articles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Historique d'un article, repris du design de l'historique replié de Linear :
   fond presque noir, cartes sombres, texte sans empattement, une ligne par événement.
   Cartes = versions de l'article (une par étape) ; entre deux cartes, deux plis : adoptés, puis rejetés ou retirés.
   Flèches gauche / droite (ou glisser) : article précédent / suivant. */
:root{
  --bg:#08090a; --card:#121315; --card-2:#17181b; --border:#1f2023; --border-2:#2a2b2f;
  --fg:#f7f8f8; --text:#d0d6e0; --muted:#8a8f98; --dim:#62666d;
  --ins:#8ab4ff; --del:#e5484d; --accent:#5e6ad2;
  --f:"Inter",system-ui,-apple-system,sans-serif; --ease:cubic-bezier(.25,.8,.25,1);
  --rail:17px; --bar:84px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.5 var(--f);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit}

/* --- barre du haut : l'article courant, et les flèches pour changer d'article --- */
.bar{position:fixed;top:0;left:0;right:0;height:var(--bar);z-index:5;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(var(--bg) 70%,transparent)}
.bar-in{display:flex;align-items:center;gap:12px;width:100%;max-width:640px;padding:0 16px}
.nav{flex:none;width:30px;height:30px;border-radius:7px;border:1px solid var(--border-2);background:var(--card);color:var(--muted);
  display:grid;place-items:center;cursor:pointer;transition:color .2s,background .2s,opacity .2s}
.nav:hover:not(:disabled){color:var(--fg);background:#1f2023}
.nav:disabled{opacity:.3;cursor:default}
.ttl{flex:1;min-width:0;text-align:center}
.ttl .k{font-size:12px;color:var(--dim)}
.ttl h1{margin:2px 0 0;font:500 16px/1.35 var(--f);color:var(--fg);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;justify-content:center;gap:5px;margin-top:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--border-2);transition:background .2s}
.dots i.on{background:var(--muted)}

/* --- les articles côte à côte ; chacun défile verticalement --- */
#stage{position:fixed;inset:0;overflow:hidden;touch-action:pan-y}
#track{position:absolute;inset:0;display:flex;transition:transform .45s var(--ease)}
#track.drag{transition:none}
.page{flex:0 0 100%;height:100%;overflow-y:auto;scrollbar-width:none;scroll-behavior:smooth}
.page::-webkit-scrollbar{display:none}
.col{position:relative;max-width:640px;margin:0 auto;padding:calc(var(--bar) + 8px) 16px 40vh}

/* --- cartes : une version de l'article --- */
.sheet{position:relative;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px 12px;transition:border-color .2s,background .2s}
.sheet:hover{border-color:var(--border-2)}
.sheet.open{background:var(--card-2)}
.sheet.pulse{border-color:var(--accent)}
.sheet .row{display:flex;align-items:center;gap:10px;padding-right:34px}
.sheet .av{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#2a2c31;color:var(--muted)}
.sheet.now .av{background:#2a2540;color:#c9a8ff}
.sheet .who{color:var(--fg);font-weight:500}
.sheet .meta{color:var(--dim)}
.sheet .sub{margin:4px 34px 0 30px;color:var(--muted)}
.sheet.now .chip{color:#c9a8ff}
.toggle{position:absolute;right:10px;bottom:10px;width:26px;height:26px;border-radius:6px;border:1px solid var(--border-2);background:transparent;color:var(--muted);
  display:grid;place-items:center;cursor:pointer;transition:color .2s,background .2s}
.toggle:hover{color:var(--fg);background:#1f2023}
.toggle svg{transition:transform .35s var(--ease)}
.sheet.open .toggle svg{transform:rotate(180deg)}
.txt{position:relative;overflow:hidden;max-height:var(--h,0px);transition:max-height .4s var(--ease);margin:0 4px 0 30px;scrollbar-width:none;font-size:13.5px;line-height:1.65}
.txt::-webkit-scrollbar{display:none}
.sheet.open .txt{margin-top:10px;margin-bottom:34px;-webkit-mask-image:linear-gradient(transparent 0,#000 12px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(transparent 0,#000 12px,#000 calc(100% - 22px),transparent)}
.sheet.open.fits .txt{-webkit-mask-image:none;mask-image:none}
.sheet.scrolling .txt{overflow-y:auto}
.al{display:grid;grid-template-columns:18px 1fr;gap:0 6px;margin:0 0 .6em;padding:2px 6px 2px 0;border-radius:4px;transition:background .3s}
.al:first-child{padding-top:6px}
.al .n{font-size:11px;line-height:2.1;color:var(--dim);text-align:right}
.al.lit{background:rgba(94,106,210,.16)}
.al.same{color:var(--dim)}
.sheet:not(.open) .al.same{display:none}
ins{color:var(--ins);text-decoration:underline 1px;text-underline-offset:3px;font-weight:500;background:none}
del{color:var(--dim);text-decoration:line-through 1px var(--del);background:none}
.note{position:absolute;left:44px;bottom:15px;font-size:12px;color:var(--dim);opacity:0;transition:opacity .2s;pointer-events:none}
.sheet.open .note{opacity:1;transition-delay:.15s}

/* --- entre deux cartes : le fil et les plis --- */
.between{position:relative;padding:8px 0;display:flex;flex-direction:column}
.between::before{content:"";position:absolute;left:var(--rail);top:0;bottom:0;width:1px;background:var(--border)}
.fold-head,.fold-none{position:relative;display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:6px 0;color:var(--muted);font:400 12.5px var(--f);text-align:left;cursor:pointer}
.fold-none{cursor:default;color:var(--dim)}
.fold-head .pin,.fold-none .pin{position:relative;z-index:1;flex:none;width:16px;height:16px;margin-left:calc(var(--rail) - 8px);display:grid;place-items:center;background:var(--bg);color:var(--dim)}
.fold-head:hover,.fold.open > .fold-head{color:var(--text)}
.fold-head:hover .pin{color:var(--text)}
.slide{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.slide > .inner{min-height:0;overflow:hidden;opacity:0;transition:opacity .12s}
.open > .slide{grid-template-rows:1fr}
.open > .slide > .inner{opacity:1;transition:opacity .2s .1s}

.ev-row{display:flex;align-items:flex-start;gap:10px;width:100%;background:none;border:0;padding:5px 0;cursor:pointer;text-align:left;color:var(--muted);font:400 12.5px/1.55 var(--f)}
.ev-row .ico{position:relative;z-index:1;flex:none;width:16px;height:16px;margin-left:calc(var(--rail) - 8px);margin-top:1px;display:grid;place-items:center;
  background:var(--bg);color:var(--dim);transition:transform .3s var(--ease),color .2s}
.ev-row .lg{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:4px;background:var(--g);color:#fff;font-size:8.5px;font-weight:700;margin-right:5px;vertical-align:-2px}
.ev-row b{color:var(--fg);font-weight:500}
.ev-row .t{color:var(--dim)}
.ev-row:hover{color:var(--text)}
.ev-row:hover .ico{color:var(--text)}
.ev.open > .ev-row .ico{color:var(--fg);transform:rotate(45deg)}
.fiche{margin:4px 0 10px 28px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.fiche .head{display:flex;align-items:center;gap:8px;color:var(--dim);flex-wrap:wrap}
.fiche .head b{color:var(--fg);font-weight:500}
.fiche .head .lg{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;background:var(--g);color:#fff;font-size:9px;font-weight:700}
.fiche .amd{font-size:13.5px;line-height:1.65;margin:8px 0 6px;color:var(--text)}
.fiche .expo{margin:0 0 8px;color:var(--muted)}
.fiche dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:12px;color:var(--dim)}
.fiche dd{margin:0;color:var(--muted)}
@media (max-width:520px){ .txt{margin-left:0} .sheet .sub{margin-left:0} .fiche{margin-left:12px} .note{left:14px} .ttl h1{font-size:15px} }
</style>
</head>

// --- différence mot à mot (portée sur la rédaction la plus récente) ---
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function diff(a,b){
  if(a==null&&b==null) return "";
  if(a==null) return `<ins>${esc(b)}</ins>`;
  if(b==null) return `<del>${esc(a)}</del>`;
  const sp=x=>x.split(/(\s+|[.,;:])/).filter(Boolean);
  const A=sp(a),B=sp(b),n=A.length,m=B.length,L=Array.from({length:n+1},()=>new Int32Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0;const push=(t,s)=>{const l=out[out.length-1];if(l&&l.t===t)l.s+=s;else out.push({t,s});};
  while(i<n&&j<m){if(A[i]===B[j]){push("=",A[i]);i++;j++;}else if(L[i+1][j]>=L[i][j+1])push("-",A[i++]);else push("+",B[j++]);}
  while(i<n)push("-",A[i++]);while(j<m)push("+",B[j++]);
  return out.map(o=>o.t==="="?esc(o.s):o.t==="-"?`<del>${esc(o.s)}</del>`:`<ins>${esc(o.s)}</ins>`).join("");
}
const VERB={rediger:"réécrit",completer:"complète",supprimer:"supprime",ajouter:"ajoute"};
const PLUS='<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3v10M3 8h10"/></svg>';
const CHECK='<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 8.5l3 3 7-7"/></svg>';
const DOTS='<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12.5" cy="8" r="1.4"/></svg>';
const CHEV='<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3.5 4.5L6 2l2.5 2.5M3.5 7.5L6 10l2.5-2.5"/></svg>';
const DOWN='<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg>';
const plural=(n,s,p)=>`${n} ${n>1?p:s}`;

function sheetHTML(art,i){
  const st=STEPS[i], v=art.v[i], prev=i?art.v[i-1]:null;
  const keys=[...new Set([...Object.keys(prev||{}),...Object.keys(v)])].map(Number).sort((a,b)=>a-b);
  const als=keys.map(k=>{
    const a=prev?prev[k]:undefined,b=v[k],same=prev&&a===b;
    return `<div class="al${same?" same":""}" data-al="${k}"><span class="n">${k}</span><p style="margin:0">${prev?diff(a??null,b??null):esc(b)}</p></div>`;
  }).join("");
  const chip=st.now?"en cours":(art.chips[i]||st.chip);
  return `<article class="sheet${st.now?" now":""}" data-i="${i}">
    <div class="row"><span class="av">${st.now?DOTS:CHECK}</span><span><span class="who">${st.stage}</span> <span class="meta">· ${st.date}</span></span></div>
    <div class="sub">${st.h} · <span class="chip">${chip}</span></div>
    <div class="txt">${als}</div>
    <span class="note">${i?(st.now?"Texte en discussion · corrections par rapport à l'étape précédente":"Corrections apparentes par rapport à l'étape précédente"):"Projet de loi n° 412"}</span>
    <button class="toggle" type="button" aria-label="Ouvrir l'article">${DOWN}</button>
  </article>`;
}
function evHTML(a,prevV){
  const mode=a.mode||(a.text==null?"supprimer":"rediger"), g=GROUPS[a.g];
  const what=`${VERB[mode]} l'alinéa ${a.al}`;
  const amd=mode==="ajouter"?`<ins>${esc(a.text)}</ins>`:diff(prevV[a.al]??null,a.text);
  return `<div class="ev" data-al="${a.al}" data-sort="${a.sort}">
    <button class="ev-row" type="button"><span class="ico">${PLUS}</span>
      <span><span class="lg" style="--g:${g.color}">${g.name[0]}</span><b>${g.name}</b> ${what} <span class="t">· ${a.num} · ${a.who} · ${a.sort}</span></span></button>
    <div class="slide"><div class="inner"><div class="fiche">
      <div class="head"><span class="lg" style="--g:${g.color}">${g.name[0]}</span><b>${g.name}</b><span>${a.num} · ${a.who} · ${a.sort}</span></div>
      <div class="amd">${amd}</div>
      <p class="expo">${esc(a.expo)}</p>
      <dl><dt>Avis</dt><dd>${a.avis}</dd><dt>Vote</dt><dd>${a.vote}</dd></dl>
    </div></div></div>
  </div>`;
}
function foldHTML(list,label,cls,prevV){
  if(!list.length) return `<div class="fold-none"><span class="pin">${CHEV}</span><span>${label}</span></div>`;
  return `<div class="fold ${cls}"><button class="fold-head" type="button"><span class="pin">${CHEV}</span><span class="lbl">${label}</span></button>
    <div class="slide"><div class="inner">${list.map(a=>evHTML(a,prevV)).join("")}</div></div></div>`;
}
function pageHTML(art){
  return `<div class="page"><div class="col">`+STEPS.map((_,i)=>{
    let h=sheetHTML(art,i);
    const nx=art.amds[i+1];
    if(nx){
      const ad=nx.filter(a=>a.sort==="adopté"), rr=nx.filter(a=>a.sort!=="adopté");
      h+=`<div class="between">`+
        foldHTML(ad,ad.length?plural(ad.length,"amendement adopté","amendements adoptés"):"Aucun amendement adopté","adp",art.v[i])+
        foldHTML(rr,rr.length?plural(rr.length,"amendement rejeté ou retiré","amendements rejetés ou retirés"):"Aucun amendement rejeté ou retiré","rej",art.v[i])+`</div>`;
    }
    return h;
  }).join("")+`</div></div>`;
}
const track=document.getElementById("track");
track.innerHTML=ARTICLES.map(pageHTML).join("");
const pages=[...track.children];
document.getElementById("dots").innerHTML=ARTICLES.map(()=>"<i></i>").join("");

// --- changer d'article : flèches, glisser, clavier, pavé tactile ---
let cur=1;
function go(k){
  cur=Math.max(0,Math.min(ARTICLES.length-1,k));
  track.style.transform=`translateX(${-cur*100}%)`;
  const a=ARTICLES[cur];
  document.getElementById("title").textContent=`Article ${a.n} — ${a.t}`;
  document.querySelectorAll("#dots i").forEach((d,i)=>d.classList.toggle("on",i===cur));
  document.getElementById("prev").disabled=cur===0;
  document.getElementById("next").disabled=cur===ARTICLES.length-1;
}
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
go(1);
let drag=null, swallow=false;
const stage=document.getElementById("stage");
stage.addEventListener("pointerdown",e=>{ if(e.button!==0) return; drag={x:e.clientX,y:e.clientY,dx:0,on:false,id:e.pointerId}; });
stage.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.id) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.on){ if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.3){ drag.on=true; track.classList.add("drag"); stage.setPointerCapture(e.pointerId); } else if(Math.abs(dy)>12){ drag=null; return; } else return; }
  drag.dx=dx; const edge=(cur===0&&dx>0)||(cur===ARTICLES.length-1&&dx<0)?.3:1;
  track.style.transform=`translateX(calc(${-cur*100}% + ${dx*edge}px))`;
});
const endDrag=()=>{
  if(!drag) return; const d=drag; drag=null;
  if(!d.on) return; swallow=true; setTimeout(()=>swallow=false,0);
  track.classList.remove("drag");
  if(Math.abs(d.dx)>Math.min(110,innerWidth*.18)) go(cur+(d.dx<0?1:-1)); else go(cur);
};
stage.addEventListener("pointerup",endDrag); stage.addEventListener("pointercancel",endDrag);
let wx=0, wt=0, wlock=0;
stage.addEventListener("wheel",e=>{
  if(e.ctrlKey||Math.abs(e.deltaX)<=Math.abs(e.deltaY)) return;
  e.preventDefault(); const now=Date.now();
  if(now<wlock) return; if(now-wt>250) wx=0; wt=now; wx+=e.deltaX;
  if(Math.abs(wx)>90){ go(cur+(wx>0?1:-1)); wx=0; wlock=now+600; }
},{passive:false});

// --- ouvrir l'article (flèche en bas à droite de la carte) ---
const PEEK=34; // arête de la carte suivante, toujours visible sous les plis
function openSheet(sheet){
  const page=sheet.closest(".page");
  page.querySelectorAll(".sheet.open").forEach(s=>{ if(s!==sheet) closeSheet(s); });
  const b=sheet.nextElementSibling;
  if(b&&b.classList.contains("between")) b.querySelectorAll(".open").forEach(o=>o.classList.remove("open"));
  const txt=sheet.querySelector(".txt");
  sheet.classList.add("open");
  const chrome=sheet.offsetHeight-txt.offsetHeight+44;
  let below=0;
  if(b&&b.classList.contains("between")){
    const cs=getComputedStyle(b);
    below=[...b.querySelectorAll(".fold-head,.fold-none")].reduce((s,h)=>s+h.offsetHeight,0)+parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom)+PEEK;
  }
  const top=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--bar"))+8;
  const avail=page.clientHeight-top-chrome-below-8;
  const full=txt.scrollHeight, h=Math.max(120,Math.min(full,b?avail:full));
  sheet.classList.toggle("fits",full<=h);
  txt.style.setProperty("--h",h+"px");
  sheet.querySelector(".toggle").setAttribute("aria-label","Refermer l'article");
  setTimeout(()=>{ if(sheet.classList.contains("open")) sheet.classList.add("scrolling"); },420);
  page.scrollTo({top:sheet.offsetTop-top,behavior:"smooth"});
}
function closeSheet(sheet){
  const txt=sheet.querySelector(".txt");
  sheet.classList.remove("open","scrolling","fits"); txt.scrollTop=0; txt.style.removeProperty("--h");
  sheet.querySelector(".toggle").setAttribute("aria-label","Ouvrir l'article");
}
document.addEventListener("click",e=>{
  if(swallow){ e.stopPropagation(); e.preventDefault(); return; }
  const tg=e.target.closest(".toggle");
  if(tg){ const s=tg.closest(".sheet"); s.classList.contains("open")?closeSheet(s):openSheet(s); return; }
  const fh=e.target.closest(".fold-head");
  if(fh){ const f=fh.parentElement; if(f.classList.contains("open")) f.querySelectorAll(".ev.open").forEach(x=>x.classList.remove("open")); f.classList.toggle("open"); clearLit(); return; }
  const row=e.target.closest(".ev-row");
  if(row){
    const ev=row.parentElement, was=ev.classList.contains("open");
    ev.parentElement.querySelectorAll(".ev.open").forEach(x=>x.classList.remove("open")); clearLit();
    if(!was){ ev.classList.add("open"); light(ev); }
  }
},true);
// le passage produit par un amendement adopté s'allume dans la version suivante
function clearLit(){ document.querySelectorAll(".al.lit").forEach(x=>x.classList.remove("lit")); document.querySelectorAll(".sheet.pulse").forEach(x=>x.classList.remove("pulse")); }
function light(ev){
  if(ev.dataset.sort!=="adopté") return;
  const next=ev.closest(".between").nextElementSibling; if(!next) return;
  const p=next.querySelector(`.al[data-al="${ev.dataset.al}"]`); if(p) p.classList.add("lit");
  next.classList.add("pulse"); setTimeout(()=>next.classList.remove("pulse"),900);
}
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"){ go(cur+1); return; }
  if(e.key==="ArrowLeft"){ go(cur-1); return; }
  if(e.key!=="Escape") return;
  const ev=document.querySelector(".ev.open"); if(ev){ ev.classList.remove("open"); clearLit(); return; }
  const s=document.querySelector(".sheet.open"); if(s){ closeSheet(s); return; }
  const f=document.querySelector(".fold.open"); if(f) f.classList.remove("open");
});
</script>
</body>

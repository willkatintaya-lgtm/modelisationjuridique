<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boussole · inspiration Figma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Jetons : système de conception de l'inspiration (FPL v2, UI3), thème clair | sombre. Les cadres gardent un fond blanc dans les deux thèmes. */
:root,[data-theme="light"]{
  --bg:#fff; --bg2:#f1f1f1; --bg3:#fafafa; --border:#e4e4e4; --text:#161616; --text2:#00000096; --text3:#0000005e;
  --brand:#0090f3; --brandbtn:#0d99ff; --selbg:#eaf4ff; --brandtx:#005ea2; --comp:#a064fd; --compbg:#f4ecff;
  --menu:#1b1b1b; --menutx:#fff; --danger:#f24822; --ok:#14ae5c; --warn:#ffcd29; --canvas:#f5f5f5; --field:#f5f5f5; --dots:#d9d9d9;
  --e100:0 1px 3px #00000026,0 0 .5px #0000004d; --e500:0 2px 5px #00000026,0 10px 24px #0000002e,0 0 .5px #00000014;
}
[data-theme="dark"]{
  --bg:#212121; --bg2:#292929; --bg3:#1b1b1b; --border:#353535; --text:#f5f5f5; --text2:#ffffff78; --text3:#ffffff47;
  --brand:#4579ab; --brandbtn:#0c8ce9; --selbg:#2c3c4d; --brandtx:#82c0ff; --comp:#7c68a6; --compbg:#2e2a3a;
  --menu:#353535; --menutx:#f5f5f5; --canvas:#1b1b1b; --field:#292929; --dots:#333;
  --e100:0 1px 3px #00000066,0 0 .5px #000000cc; --e500:0 2px 5px #00000066,0 10px 24px #00000080,0 0 .5px #ffffff26;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--canvas);color:var(--text);
  font:450 12px/16px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.049px;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:"Roboto Mono",ui-monospace,monospace}
b,strong{font-weight:600}

/* ---------- squelette : panneaux ancrés de 240 px, canevas sans barre du haut ---------- */
#app{display:grid;height:100%;grid-template-columns:var(--lw,240px) minmax(0,1fr) var(--rw,240px)}
#app.ui-min{grid-template-columns:0 minmax(0,1fr) 0}
#app.ui-min.has-sel{grid-template-columns:0 minmax(0,1fr) var(--rw,240px)}
#app.ui-hidden{grid-template-columns:0 minmax(0,1fr) 0}
#left,#right{background:var(--bg);display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;z-index:5}
#left{border-right:1px solid var(--border);grid-column:1;grid-row:1}
#canvas{grid-column:2;grid-row:1}
#right{border-left:1px solid var(--border);grid-column:3;grid-row:1}
#app.ui-min #left,#app.ui-hidden #left,#app.ui-hidden #right,#app.ui-min:not(.has-sel) #right{display:none}
.resizer{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:6}
#left .resizer{right:-3px}#right .resizer{left:-3px}
.resizer:hover,.resizer.on{background:linear-gradient(90deg,transparent 2px,var(--brand) 2px,var(--brand) 4px,transparent 4px)}

/* panneau gauche */
.l-head{padding:8px 8px 8px 8px;display:flex;flex-direction:column;gap:2px;flex:none}
.l-top{display:flex;align-items:center;justify-content:space-between;height:32px}
.ibtn{height:24px;min-width:24px;border-radius:5px;display:inline-grid;place-items:center;color:var(--text);position:relative}
.ibtn:hover{background:var(--bg2)}
.ibtn.on{background:var(--selbg);color:var(--brandtx)}
.ibtn svg{width:24px;height:24px}
.ibtn.sm svg{width:16px;height:16px}
.menu-btn{display:flex;align-items:center;gap:0;height:32px;padding:0 4px;border-radius:5px}
.menu-btn:hover{background:var(--bg2)}
.file{padding:4px 8px 6px}
.file .n{font-size:13px;font-weight:600;line-height:20px;display:flex;align-items:center;gap:2px}
.file .n svg{width:16px;height:16px;color:var(--text2)}
.file .s{color:var(--text2)}
.l-tabs{display:flex;align-items:center;gap:4px;padding:4px 8px 8px;border-bottom:1px solid var(--border);flex:none}
.tabb{height:24px;padding:0 8px;border-radius:5px;color:var(--text2);font-weight:550}
.tabb:hover{color:var(--text)}
.tabb.on{background:var(--bg2);color:var(--text)}
.l-tabs .sp{flex:1}
.l-body{flex:1;overflow:auto;scrollbar-width:none;min-height:0;padding-bottom:16px}
.l-body::-webkit-scrollbar{display:none}
.l-sec{border-bottom:1px solid var(--border);padding:4px 0 8px}
.l-sec:last-child{border-bottom:0}
.sec-h{height:32px;display:flex;align-items:center;gap:2px;padding:0 8px 0 4px;font-weight:550;user-select:none}
.sec-h .chev{width:16px;height:16px;display:grid;place-items:center;color:var(--text2);cursor:pointer}
.sec-h .chev svg{width:16px;height:16px}
.sec-h .t{flex:1;cursor:pointer}
.closed .chev svg{transform:rotate(-90deg)}
.closed .sec-b{display:none}
.lrow{height:32px;margin:0 8px;padding:0 8px 0 calc(8px + var(--d,0) * 16px);display:flex;align-items:center;gap:6px;border-radius:5px;cursor:pointer;white-space:nowrap;color:var(--text)}
.lrow:hover{background:var(--bg2)}
.lrow.on{background:var(--selbg)}
.lrow.on-p{background:var(--bg2);font-weight:550}
.lrow.child-on{background:color-mix(in srgb,var(--selbg) 55%,transparent)}
.lrow .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.lrow .lbl small{color:var(--text2);font-size:11px;margin-left:4px}
.lrow .ic{width:16px;height:16px;display:grid;place-items:center;color:var(--text2);flex:none}
.lrow .ic svg{width:16px;height:16px}
.lrow .tw{width:12px;flex:none;color:var(--text3);display:grid;place-items:center}
.lrow .tw svg{width:12px;height:12px}
.lrow.comp,.lrow.comp .ic{color:var(--comp)}
.lrow .num{color:var(--text2);font-variant-numeric:tabular-nums;font-size:11px}
.lrow .dot{width:10px;height:10px;border-radius:50%;flex:none}
.lrow.pg .emo{width:16px;text-align:center;flex:none}
.lrow.hid{opacity:.45}

/* ---------- canevas ---------- */
#canvas{position:relative;overflow:hidden;min-width:0;background:var(--canvas);touch-action:none;cursor:default}
#canvas.figjam{background-color:var(--canvas);background-image:radial-gradient(var(--dots) 1.1px,transparent 1.2px);background-size:var(--dg,24px) var(--dg,24px);background-position:var(--dx,0) var(--dy,0)}
#canvas.hand,#canvas.hand *{cursor:grab!important}
#canvas.panning,#canvas.panning *{cursor:grabbing!important}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.col{position:absolute;top:0;display:flex;flex-direction:column;gap:80px}
.frame{position:relative;background:#fff;color:#161616;box-shadow:0 0 0 .5px #0000001f;width:var(--w)}
.frame .flab{position:absolute;left:0;bottom:100%;margin-bottom:4px;display:flex;align-items:center;gap:6px;font-size:11px;line-height:14px;color:var(--text2);white-space:nowrap;max-width:100%;cursor:default}
.frame .flab .fn{overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.frame .flab .fn:hover{color:var(--text)}
.frame.sel .flab .fn{color:var(--brand)}
.frame .flab .ml{margin-left:auto}
.frame.sel,.sticky.sel,.gcell.sel{outline:1px solid var(--brand);outline-offset:0}
.frame.msel{outline:1px solid var(--brand)}
.frame.hover:not(.sel){outline:1px solid var(--brand)}
.hd{position:absolute;width:7px;height:7px;background:#fff;border:1px solid var(--brand);display:none;z-index:3}
.sel>.hd{display:block}
.hd.a{left:-4px;top:-4px}.hd.b{right:-4px;top:-4px}.hd.c{left:-4px;bottom:-4px}.hd.d{right:-4px;bottom:-4px}
.dim{position:absolute;left:50%;top:100%;transform:translate(-50%,6px);background:var(--brand);color:#fff;font-size:11px;line-height:16px;padding:0 4px;border-radius:2px;white-space:nowrap;display:none;font-variant-numeric:tabular-nums}
.sel>.dim{display:block}
.dev .frame.sel,.dev .sticky.sel{outline-color:var(--ok)}.dev .sel>.hd{border-color:var(--ok)}.dev .sel>.dim{background:var(--ok)}
.section{position:relative;background:color-mix(in srgb,#fff 70%,var(--canvas));border:1px solid #0000001a;border-radius:2px;padding:76px 24px 28px;width:var(--w)}
[data-theme="dark"] .section{background:#2a2a2a;border-color:#ffffff1a}
.section>.slab{position:absolute;left:12px;top:12px;height:26px;padding:0 10px;border-radius:6px;background:#fff;color:#161616;font-weight:550;display:flex;align-items:center;gap:6px;box-shadow:var(--e100);max-width:calc(100% - 24px);overflow:hidden;white-space:nowrap}
.section>.slab .n{color:#0000008a;font-weight:450}
.section.sel{outline:1px solid var(--brand)}
.sgrid{display:grid;grid-template-columns:repeat(var(--c,2),minmax(0,1fr));gap:48px 24px;align-items:start}
.sgrid .frame{width:auto}

/* contenu des cadres : du texte de loi, lisible */
.fb{padding:20px 24px 22px}
.fh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.fh .t{font:600 14px/20px Inter,sans-serif}
.kicker{font-size:11px;line-height:16px;color:#00000096}
.law{font:400 14px/23px Inter,sans-serif;color:#161616;max-width:68ch;overflow-wrap:break-word}
.law.sm{font-size:13px;line-height:21px}
.law.ref{color:#161616}
.reflab{display:flex;align-items:center;gap:6px;margin:0 0 4px;font-size:11px;color:#00000096}
.reflab .sw{width:10px;height:10px;border-radius:2px;border:1px solid #0000002e;background:#fafafa}
.refbox{background:#fafafa;border:1px solid #e4e4e4;border-radius:8px;padding:10px 12px;margin-bottom:16px}
.law ins{text-decoration:underline;text-decoration-color:#14ae5c;text-decoration-thickness:1.5px;text-underline-offset:3px;background:#14ae5c1f;color:#0b5f33;font-weight:600;border-radius:2px}
.law del{text-decoration:line-through;text-decoration-color:#f24822;text-decoration-thickness:1.5px;color:#00000080}
.law mark.pt{background:none;color:inherit;text-decoration:underline;text-decoration-color:#a064fd;text-decoration-thickness:2px;text-underline-offset:5px;cursor:pointer;border-radius:2px}
.law mark.pt.w1{text-decoration-style:dashed}
.law mark.pt.w3{text-decoration-thickness:3px}
.law mark.pt:hover,.law mark.pt.on{background:#a064fd22}
.law .ctx{color:#0000005e}
.law .live ins{font-weight:450;background:none;text-decoration-color:#14ae5c;color:inherit}
.delpt{display:inline-block;width:2px;height:14px;background:#f24822;vertical-align:-2px;margin:0 1px}
.mine-badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:5px;background:var(--selbg);color:var(--brandtx);font-size:11px;font-weight:550}
[data-theme="dark"] .frame .mine-badge{background:#eaf4ff;color:#005ea2}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:5px;background:#f1f1f1;color:#161616;font-size:11px;font-weight:550;white-space:nowrap}
.chip.adopte{background:#cff7d3;color:#065f2a}.chip.rejete{background:#ffe2e0;color:#a72811}.chip.tombe{background:#eee;color:#555}
.chip.retire,.chip.ns{background:#fff1c2;color:#7a5a00}.chip.ecarte{background:#f1f1f1;color:#888;text-decoration:line-through}.chip.attente{background:#eaf4ff;color:#005ea2}
.chip.comp{background:#f4ecff;color:#7a3ee0}
/* étiquette multijoueur : flèche + étiquette pleine */
.mp{display:inline-flex;align-items:flex-start;gap:0;pointer-events:none}
.mp svg{width:14px;height:14px;fill:var(--g);stroke:#fff;stroke-width:1.2;margin-top:-4px}
.mp span{background:var(--g);color:#fff;font-size:11px;line-height:16px;font-weight:550;padding:1px 6px;border-radius:4px 10px 10px 10px;margin-left:-2px;margin-top:6px;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
/* bulles de commentaire épinglées */
.fcur{position:absolute;top:calc(100% + 10px);pointer-events:none;z-index:5;animation:drift 7s ease-in-out infinite}
.fcur .mp svg{width:18px;height:18px}
.fcur .mp span{font-size:12px;line-height:18px;padding:1px 7px;margin-top:10px}
@keyframes drift{0%,100%{transform:translate(0,0)}30%{transform:translate(18px,6px)}60%{transform:translate(-10px,12px)}}
.car-b{min-width:16px!important;width:16px}.car-b svg{width:16px!important;height:16px!important;color:var(--text2)}
.pin{position:absolute;left:calc(100% + 14px);width:30px;height:30px;border-radius:15px 15px 15px 2px;background:#fff;box-shadow:var(--e500);display:grid;place-items:center;cursor:pointer;z-index:4;padding:3px}
.pin i{width:24px;height:24px;border-radius:12px;background:#a064fd;color:#fff;font:600 11px/24px Inter,sans-serif;font-style:normal;text-align:center}
.pin:hover,.pin.on{transform:scale(1.08)}
.pin.on i{background:#7a3ee0}
.f-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{height:24px;padding:0 10px;border-radius:5px;font-weight:550;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;background:#fff;color:#161616;box-shadow:inset 0 0 0 1px #e4e4e4}
.btn:hover{background:#f5f5f5}
.btn.pri{background:var(--brandbtn);color:#fff;box-shadow:none}.btn.pri:hover{filter:brightness(.95)}
.btn.ghost{box-shadow:none;color:var(--brandtx)}
#right .btn,#left .btn,.dlg .btn{background:var(--bg);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
#right .btn:hover{background:var(--bg2)}
#right .btn.pri,.dlg .btn.pri{background:var(--brandbtn);color:#fff;box-shadow:none}
.edit-wrap textarea{width:100%;min-height:170px;border:0;outline:1.5px solid var(--brand);border-radius:2px;padding:6px 8px;font:400 14px/23px Inter,sans-serif;color:#161616;background:#fff;resize:vertical}
.edit-wrap .live{margin-top:10px;padding:8px 10px;border-radius:6px;background:#fafafa;border:1px dashed #d0d0d0}
.edit-hint{font-size:11px;color:#00000096;margin-top:6px}
.kbd{font:500 10px/14px "Roboto Mono",monospace;padding:1px 4px;border-radius:3px;background:#0000000f;color:inherit;opacity:.9}

/* tableaux dans les cadres */
table.ft{border-collapse:collapse;width:100%;font-size:12px}
table.ft th{font-weight:550;text-align:left;color:#00000096;padding:6px 8px;border-bottom:1px solid #e4e4e4;white-space:nowrap;font-size:11px}
table.ft td{padding:6px 8px;border-bottom:1px solid #f0f0f0;vertical-align:top}
table.ft tr[data-k]{cursor:pointer}
table.ft tr[data-k]:hover td{background:#f7f9fc}
table.ft tr.sel td{background:#eaf4ff}
table.ft td.n{text-align:right;font-variant-numeric:tabular-nums;color:#00000096}
.cellst{width:18px;height:18px;border-radius:4px;display:inline-block;vertical-align:middle}
.cellst.mod{background:#0090f3}.cellst.same{background:#e4e4e4;width:8px;height:8px;border-radius:50%}.cellst.origine{border:1.5px solid #161616;width:11px;height:11px;border-radius:50%}.cellst.absent{background:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#00000096;margin:2px 0 12px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.eh{padding:0 16px 10px;border-bottom:1px solid #e4e4e4;height:58px}
.eh .t{font:600 13px/18px Inter,sans-serif}
.erow{height:62px;display:grid;grid-template-columns:26px minmax(0,1fr);grid-template-rows:auto auto;column-gap:6px;padding:7px 12px 0 8px;border-bottom:1px solid #f0f0f0;cursor:pointer;position:relative;overflow:hidden}
.erow:hover{background:#f7f9fc}.erow.sel{background:#eaf4ff}
.erow .eo{font:500 11px/17px "Roboto Mono",monospace;color:#0000005e;text-align:right;grid-row:span 2}
.erow .et{font-size:12px;line-height:17px;color:#161616;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.erow.absent .et{color:#0000004d}.erow.same .et{color:#00000080}
.erow.mod{box-shadow:inset 3px 0 0 #0090f3}
.erow .em,.erow .en{position:absolute;right:8px;bottom:4px;font-size:10px;font-weight:550;color:#005ea2;background:#eaf4ff;border-radius:4px;padding:0 4px;line-height:15px}
.erow .en{right:auto;left:34px;color:#7a3ee0;background:#f4ecff}
.hstep{border-left:2px solid #e4e4e4;padding:0 0 18px 16px;position:relative}
.hstep::before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #c4c4c4}
.hstep.mod::before{border-color:#0090f3;background:#0090f3}
.hstep:last-of-type{border-left-color:transparent}
.hstep .kicker{margin-bottom:4px;display:flex;gap:8px;align-items:center}
.cmp3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid #e4e4e4;border-radius:8px;overflow:hidden}
.cmp3>div{padding:12px 14px;min-width:0}
.cmp3>div+div{border-left:1px solid #e4e4e4}
.cmp3 .h{font-size:11px;font-weight:550;color:#00000096;padding-bottom:8px;border-bottom:1px solid #f0f0f0;display:flex;gap:6px;align-items:center}
.cmp3 .mid{background:#fafafa}
.cmp3 .row{display:contents}
.fold{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;margin:4px 0;border-radius:6px;background:#f5f5f5;color:#00000096;font-size:11px;cursor:pointer}
.fold:hover{background:#eaf4ff;color:#005ea2}
.vline{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:5px 0}
.vline .o{font:500 11px/23px "Roboto Mono",monospace;color:#0000005e;text-align:right}
.vline.mod .o{color:#0090f3}.vline.del .o{color:#f24822}.vline.ins .o{color:#14ae5c}
/* thèmes, matrice */
.tcard{cursor:pointer}
.tcard .big{font:600 20px/27px Inter,sans-serif}
.mx td.n{text-align:center;cursor:pointer;color:#161616}
.mx td.n:hover{outline:1px solid #0090f3;outline-offset:-1px}
.mx th.g{text-align:center;padding:4px 2px}
.gdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.stratum{margin:0 0 18px}
.stratum h3{font:600 13px/20px Inter,sans-serif;margin:0 0 6px;display:flex;gap:6px;align-items:center}
.stratum h3 .nb{font-weight:450;color:#00000096}
.quote{border-left:3px solid #e4e4e4;padding:2px 0 2px 12px;color:#333;font-size:13px;line-height:20px;margin:6px 0}
.lnk{color:#005ea2;cursor:pointer;text-decoration:none;font-weight:550}
.lnk:hover{text-decoration:underline}
/* réunion : grammaire de tableau blanc (post-its, sections, tampons) */
.sticky{position:relative;border-radius:2px;padding:14px 14px 30px;box-shadow:0 1px 2px #0000001f,0 2px 8px #0000000f;font-size:13px;line-height:19px;color:#161616;break-inside:avoid;margin:0 0 18px;cursor:pointer;background:var(--sc)}
.sticky .au{position:absolute;left:14px;bottom:8px;font-size:11px;color:#00000080;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;right:14px}
.sticky .sp{font-weight:600;font-size:12px;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.stickies{column-count:3;column-gap:18px}
.stamp{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;font-size:20px;color:#fff;flex:none;box-shadow:0 1px 3px #00000033}
.stamp.ok{background:#14ae5c}.stamp.ko{background:#f24822}.stamp.mid{background:#9747ff}
.decision{display:flex;gap:12px;align-items:center;background:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 1px 2px #0000001f;margin-bottom:10px;font-size:13px;line-height:19px}
.strip{display:flex;gap:3px;align-items:flex-end;height:120px;padding-top:24px}
.strip .pl{flex:var(--m) 1 0;min-width:6px;background:#d9d9d9;border-radius:3px 3px 0 0;cursor:pointer;position:relative;height:var(--h)}
.strip .pl.ad{background:#14ae5c}
.strip .pl.on{outline:2px solid #0090f3;outline-offset:1px}
.strip .pl:hover{filter:brightness(.92)}
.strip .pl b{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);font-size:10px;font-weight:550;color:#00000096}
.vote td{font-size:12px}

/* ---------- barre d'outils flottante en bas ---------- */
#toolbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);height:48px;padding:0 8px;border-radius:13px;background:var(--bg);box-shadow:var(--e500);display:flex;align-items:center;gap:2px;z-index:20}
#toolbar .tb{height:32px;min-width:32px;padding:0 4px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--text);position:relative}
#toolbar .tb:hover{background:var(--bg2)}
#toolbar .tb.on{background:var(--brandbtn);color:#fff}
#toolbar .tb .car{width:8px;height:8px;margin-left:1px;opacity:.7}
#toolbar .sepv{width:1px;height:24px;background:var(--border);margin:0 6px}
#toolbar .dev{border-radius:7px;padding:0 6px;gap:6px;background:var(--bg2)}
#toolbar .dev .sw{width:24px;height:14px;border-radius:7px;background:var(--text3);position:relative;transition:background .15s}
#toolbar .dev .sw::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:left .15s}
#toolbar .dev.on{background:var(--bg2);color:var(--text)}
#toolbar .dev.on .sw{background:var(--ok)}
#toolbar .dev.on .sw::after{left:12px}
#app.ui-hidden #toolbar{display:none}
#help{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:16px;background:var(--bg);box-shadow:var(--e100);font-weight:600;color:var(--text);z-index:20;font-size:14px}
#help:hover{background:var(--bg2)}
#app.ui-hidden #help{display:none}
#minichip{position:absolute;left:12px;top:12px;height:40px;padding:0 6px 0 12px;border-radius:13px;background:var(--bg);box-shadow:var(--e500);display:none;align-items:center;gap:8px;z-index:20;font-weight:550}
#app.ui-min #minichip{display:flex}
#minichip .pg{color:var(--text2);font-weight:450}
#mobilebar,#scrim{display:none}
#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--menu);color:var(--menutx);padding:6px 10px;border-radius:6px;font-size:11px;z-index:30;display:none;white-space:nowrap}

/* ---------- panneau droit (propriétés) ---------- */
.r-head{height:48px;display:flex;align-items:center;gap:4px;padding:0 8px 0 12px;flex:none}
.avs{display:flex;align-items:center}
.av{width:24px;height:24px;border-radius:50%;background:var(--g);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg);margin-left:-5px;cursor:pointer}
.av:first-child{margin-left:0}
.av.more{background:var(--bg2);color:var(--text)}
.r-head .sp{flex:1}
.share{height:32px;padding:0 12px;border-radius:7px;background:var(--brandbtn);color:#fff;font-weight:550}
.share:hover{filter:brightness(.95)}
.r-tabs{display:flex;align-items:center;gap:4px;padding:0 8px 8px;border-bottom:1px solid var(--border);flex:none}
.r-tabs .sp{flex:1}
.zoomb{height:24px;white-space:nowrap;flex:none;padding:0 4px 0 8px;border-radius:5px;display:flex;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
.zoomb:hover{background:var(--bg2)}
.zoomb svg,.menu-btn svg.car{width:16px;height:16px;color:var(--text2)}
.r-body{flex:1;overflow:auto;scrollbar-width:none;min-height:0}
.r-body::-webkit-scrollbar{display:none}
.p-sec{border-bottom:1px solid var(--border);padding:8px 0 12px}
.p-sec:last-child{border-bottom:0}
.p-h{height:32px;display:flex;align-items:center;gap:4px;padding:0 8px 0 16px;font-weight:550}
.p-h .t{flex:1;display:flex;align-items:center;gap:4px;min-width:0}
.p-h.big{height:40px;font-size:13px;font-weight:600}
.p-row{display:flex;align-items:center;gap:8px;padding:4px 16px;min-height:32px}
.p-row>*{min-width:0}
.fld{flex:1;height:24px;border-radius:5px;background:var(--field);display:flex;align-items:center;gap:6px;padding:0 8px;white-space:nowrap;overflow:hidden;min-width:0;border:1px solid transparent}
.fld:hover{border-color:var(--border)}
.fld .pre{color:var(--text3);flex:none;min-width:12px}
.fld .v{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.fld select,.fld input{border:0;background:transparent;outline:0;width:100%;min-width:0;height:22px;padding:0;color:var(--text)}
.fld:focus-within{border-color:var(--brand)}
.fld.click{cursor:pointer}
.seg{flex:1;display:flex;height:24px;border-radius:5px;background:var(--field);padding:1px;gap:1px}
.seg button{flex:1;border-radius:4px;color:var(--text2);font-weight:450;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 0 0 .5px #0000002e,0 1px 2px #0000001a}
[data-theme="dark"] .seg button.on{background:#383838}
[data-theme="dark"] .lrow.comp,[data-theme="dark"] .lrow.comp .ic{color:#b8a6e6}
.p-txt{padding:2px 16px;color:var(--text2);line-height:18px}
.p-txt.law-s{font-size:12px;color:var(--text);line-height:18px}
.p-list .lrow{margin:0 8px}
.cl{margin:4px 8px;padding:8px;border-radius:8px;border:1px solid var(--border);cursor:default}
.cl .who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.cl .who .nm{font-weight:550}
.cl .tx{font-size:12px;line-height:18px}
.cl .tx ins{text-decoration:underline;text-decoration-color:#14ae5c;background:#14ae5c1f;font-weight:600;color:inherit}
.cl .tx del{text-decoration:line-through;text-decoration-color:#f24822;opacity:.7}
.cl.ref{background:var(--bg3)}
.cl .ams{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.cl .ams button{font:500 11px/18px "Roboto Mono",monospace;padding:0 5px;border-radius:4px;background:var(--bg2);color:var(--brandtx)}
.vh-list{padding:0 8px 12px;position:relative}
.vh-it{display:flex;gap:10px;padding:8px;border-radius:8px;cursor:pointer;position:relative}
.vh-it:hover{background:var(--bg2)}.vh-it.on{background:var(--selbg)}
.vh-dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--text3);background:var(--bg);margin-top:4px;flex:none;position:relative;z-index:1}
.vh-it:first-child .vh-dot{background:var(--brandbtn);border-color:var(--brandbtn)}
.vh-it:not(:last-child)::after{content:"";position:absolute;left:12px;top:20px;bottom:-12px;width:1px;background:var(--border)}
.vh-t{font-weight:550}.vh-w{color:var(--text2);font-size:11px}
#thread .msg.ref{background:var(--bg3)}
.code{font:400 11px/17px "Roboto Mono",monospace;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin:4px 16px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.code .k{color:#9747ff}.code .s{color:#14ae5c}.code .c{color:var(--text3)}
[data-theme="dark"] .code .k{color:#c9a7ff}
.dev-banner{display:flex;align-items:center;gap:8px;margin:8px 8px 0;padding:8px;border-radius:8px;background:color-mix(in srgb,var(--ok) 14%,var(--bg));color:var(--text)}
.empty{padding:16px;color:var(--text2);line-height:18px}
.filter{margin:8px 8px 4px;height:28px;border-radius:5px;background:var(--field);display:flex;align-items:center;gap:6px;padding:0 8px}
.filter input{border:0;background:transparent;outline:0;flex:1;min-width:0;color:var(--text)}
.filter svg{width:16px;height:16px;color:var(--text2)}
.chips{display:flex;gap:4px;flex-wrap:wrap;padding:4px 8px 8px}
.chips button{height:22px;padding:0 8px;border-radius:11px;background:var(--bg2);color:var(--text2);font-size:11px;font-weight:550}
.chips button.on{background:var(--selbg);color:var(--brandtx)}
.grp-h{display:flex;align-items:center;gap:6px;height:28px;padding:0 16px;font-weight:550;color:var(--text2);font-size:11px}

/* ---------- menus, actions, dialogues, fil de commentaire ---------- */
.menu{position:fixed;z-index:80;background:var(--menu);color:var(--menutx);border-radius:13px;padding:8px;box-shadow:var(--e500);min-width:220px;display:none}
.menu .mi{height:24px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:5px;cursor:pointer;white-space:nowrap}
.menu .mi:hover,.menu .mi.on{background:var(--brandbtn)}
.menu .mi .k{margin-left:auto;opacity:.6;font-size:11px}
.menu .mi .ck{width:12px}
.menu .sepm{height:1px;background:#ffffff1f;margin:6px -8px}
#actions{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);width:min(440px,calc(100% - 24px));max-height:min(520px,calc(100% - 100px));background:var(--bg);border-radius:13px;box-shadow:var(--e500);z-index:40;display:none;flex-direction:column;overflow:hidden}
#actions.on{display:flex}
#actions .srch{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-bottom:1px solid var(--border)}
#actions .srch input{flex:1;border:0;outline:0;background:transparent;font-size:13px;color:var(--text)}
#actions .srch svg{width:16px;height:16px;color:var(--text2)}
#actions .atabs{display:flex;gap:4px;padding:8px 8px 4px}
#actions .alist{overflow:auto;scrollbar-width:none;padding:0 8px 8px;flex:1}
#actions .ah{font-size:11px;color:var(--text2);font-weight:550;padding:10px 8px 4px}
#actions .ai{display:flex;align-items:center;gap:8px;min-height:32px;padding:4px 8px;border-radius:7px;cursor:pointer}
#actions .ai .ic{width:24px;height:24px;border-radius:6px;background:var(--bg2);display:grid;place-items:center;flex:none;font-size:12px;color:var(--text2)}
#actions .ai .ic svg{width:16px;height:16px}
#actions .ai .tt{flex:1;min-width:0}
#actions .ai .tt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#actions .ai .tt small{display:block;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
#actions .ai .k{color:var(--text3);font-size:11px;flex:none}
#actions .ai.on{background:var(--selbg)}
#actions .ai b{color:var(--brandtx)}
#thread{position:absolute;z-index:35;width:340px;max-height:min(480px,calc(100% - 24px));background:var(--bg);border-radius:13px;box-shadow:var(--e500);display:none;flex-direction:column;overflow:hidden}
#thread.on{display:flex}
#thread .th-h{display:flex;align-items:center;gap:6px;height:44px;padding:0 8px 0 14px;border-bottom:1px solid var(--border);font-weight:600;flex:none}
#thread .th-h .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#thread .th-b{overflow:auto;scrollbar-width:none;padding:6px 6px 10px}
#thread .msg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:8px;border-radius:8px}
#thread .msg:hover{background:var(--bg3)}
#thread .msg .avs{grid-row:span 2;align-self:start;padding-top:1px}
#thread .msg .nm{font-weight:600;line-height:18px}
#thread .msg .nm small{font-weight:450;color:var(--text2);margin-left:4px}
#thread .msg .tx{font-size:13px;line-height:20px}
#thread .msg .tx ins{text-decoration:underline;text-decoration-color:#14ae5c;background:#14ae5c1f;font-weight:600;color:inherit}
#thread .msg .tx del{text-decoration:line-through;text-decoration-color:#f24822;opacity:.75}
#thread .msg .ams{grid-column:2;display:flex;gap:4px;flex-wrap:wrap}
#thread .msg .ams button{font:500 11px/18px "Roboto Mono",monospace;padding:0 5px;border-radius:4px;background:var(--bg2);color:var(--brandtx)}
#thread .ctxl{font-size:12px;color:var(--text2);padding:8px 10px 4px;line-height:18px}
.dlg-back{position:fixed;inset:0;background:#0000004d;z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
.dlg-back.on{display:flex}
.dlg{background:var(--bg);color:var(--text);border-radius:13px;box-shadow:var(--e500);width:min(620px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;overflow:hidden}
.dlg-h{height:48px;display:flex;align-items:center;padding:0 8px 0 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px;flex:none}
.dlg-h .t{flex:1}
.dlg-b{overflow:auto;padding:12px 16px 18px;line-height:18px;scrollbar-width:none}
.dlg-b h4{font-size:13px;font-weight:600;margin:16px 0 6px}
.dlg-b ul{margin:4px 0;padding-left:18px}.dlg-b li{margin:3px 0}
.dlg-b a{color:var(--brandtx)}
.vis-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer}
.vis-row:hover{background:var(--bg2)}.vis-row.on{background:var(--selbg)}
.vis-row .ic{width:32px;height:32px;border-radius:16px;background:var(--bg2);display:grid;place-items:center}
.vis-row .ic svg{width:18px;height:18px}
#tip{position:fixed;z-index:100;background:var(--menu);color:#fff;font-size:11px;line-height:16px;padding:4px 8px;border-radius:5px;pointer-events:none;display:none;white-space:nowrap}
#tip .k{opacity:.6;margin-left:6px}
#toast{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);background:var(--menu);color:#fff;border-radius:8px;padding:8px 12px;z-index:45;display:none;align-items:center;gap:10px;max-width:calc(100% - 24px);box-shadow:var(--e500)}
#toast.on{display:flex}
#toast button{color:#7cc4fa;font-weight:550}

/* ---------- écran étroit : panneaux en tiroirs, barre d'outils en bas, canevas en défilement ---------- */
@media (max-width:720px){
  #app,#app.ui-min,#app.ui-min.has-sel{grid-template-columns:minmax(0,1fr)}
  #left,#right{position:fixed;top:0;bottom:0;width:min(320px,88vw);z-index:60;box-shadow:var(--e500);transition:transform .2s;display:flex!important}
  #left{left:0;transform:translateX(-105%)}#right{right:0;transform:translateX(105%)}
  #app.dl #left{transform:none}#app.dr #right{transform:none}
  .resizer{display:none}
  #scrim{position:fixed;inset:0;background:#00000040;z-index:55;display:none}
  #app.dl #scrim,#app.dr #scrim{display:block}
  #canvas{grid-column:1;overflow:auto;touch-action:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #canvas::-webkit-scrollbar{display:none}
  #world{position:static;transform:none!important;display:flex;flex-direction:column;gap:56px;padding:84px 12px 110px}
  .col{position:static;gap:56px;width:auto!important;order:var(--mo,0)}
  .frame,.section{width:auto!important;max-width:100%}
  .section{padding:72px 10px 18px}
  .frame .fb{overflow-x:auto;scrollbar-width:none}
  .hide-m{display:none}
  .erow.absent{display:none}.erow{height:auto;min-height:44px;padding-bottom:18px}
  .eh{height:auto}
  .sgrid{grid-template-columns:minmax(0,1fr)!important;gap:44px}
  .fb{padding:16px 14px 18px}
  .law{font-size:14px;line-height:22px}
  .pin{display:none}
  .cmp3{grid-template-columns:repeat(3,minmax(78vw,1fr));overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .cmp3>div{scroll-snap-align:start}
  .stickies{column-count:1}
  #mobilebar{display:flex;position:fixed;left:8px;right:8px;top:8px;height:44px;border-radius:13px;background:var(--bg);box-shadow:var(--e500);z-index:30;align-items:center;gap:4px;padding:0 6px}
  #mobilebar .t{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:600;white-space:nowrap;overflow:hidden}
  #mobilebar .t small{color:var(--text2);font-weight:450;overflow:hidden;text-overflow:ellipsis}
  #toolbar{position:fixed;bottom:10px;max-width:calc(100vw - 16px);padding:0 4px;overflow-x:auto;scrollbar-width:none}
  #toolbar .hide-s{display:none}
  #help{position:fixed;bottom:66px;right:10px}
  #minichip{display:none!important}
  #actions{position:fixed;bottom:66px}
  #thread{position:fixed;left:8px!important;right:8px;top:auto!important;bottom:66px;width:auto;max-height:60vh}
  #toast{position:fixed;bottom:66px}
  .strip{height:90px}
  table.ft{font-size:11px}
  .mx-wrap{overflow-x:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="left" aria-label="Pages et calques"></aside>
  <main id="canvas" aria-label="Canevas">
    <div id="world"></div>
    <div id="minichip"></div>
    <div id="thread" role="dialog" aria-label="Passage disputé"></div>
    <div id="actions" role="dialog" aria-label="Actions"></div>
    <div id="toolbar" role="toolbar" aria-label="Outils"></div>
    <button id="help" aria-label="Lisez-moi" data-cmd="help">?</button>
    <div id="hint"></div>
    <div id="toast"></div>
  </main>
  <aside id="right" aria-label="Propriétés"></aside>
  <div id="mobilebar"></div>
  <div id="scrim"></div>
</div>
<div class="menu" id="menu"></div>
<div class="dlg-back" id="dlg"><div class="dlg" role="dialog"></div></div>
<div id="tip"></div>
<script>window.MAQ = "figma";</script>
<!--NOYAU-->
<!--APP-->
</body>
</html>

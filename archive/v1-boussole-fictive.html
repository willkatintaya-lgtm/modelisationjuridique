<title>Amendement en scène</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Scène 2D : des feuilles dans un espace sombre. Trois gestes, même sens partout :
   haut/bas = parcourir ; gauche/droite = volet voisin (comparer des articles ← les articles ← le mien → les autres → comparer) ;
   clic/pincer = changer d'échelle. */
:root{
  --bg:#0b0d12; --bg-2:#11141b; --fg:#e8e6df; --muted:#8a8f9b; --accent:#d9b56a; --accent-soft:rgba(217,181,106,.28); --line:#232733; --line-2:#2f3443;
  --paper:#f4f1e9; --paper-2:#e9e4d8; --paper-ink:#1d1a16; --paper-muted:#6b6457; --paper-line:#c9bfa6; --paper-frame:#ece7db;
  --f-ui:"IBM Plex Sans",system-ui,sans-serif; --f-legal:"Source Serif 4",Georgia,serif;
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
  --ease:cubic-bezier(.2,.8,.2,1);
  --ins:#1d4f91; --del:#a8452f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden;font-size:14px}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 40%, #151924 0%, var(--bg) 60%),var(--bg)}
#stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;opacity:.25;
  mask-image:radial-gradient(ellipse at 50% 55%, #000 20%, transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 55%, #000 20%, transparent 75%)}

/* --- matière papier, partagée par toutes les feuilles --- */
.paper{background:linear-gradient(135deg,var(--paper),var(--paper-2));color:var(--paper-ink);border:1px solid var(--paper-line);outline:14px solid var(--paper-frame);outline-offset:-14px;
  box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(217,181,106,.25)}
.paper .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-muted);border-bottom:1px solid var(--paper-line);padding-bottom:8px}
.paper .lead{font:italic 400 15px var(--f-legal);color:var(--paper-muted);margin:4px 0 0}
.paper .body{font:400 clamp(17px,2.2vw,23px)/1.5 var(--f-legal);max-width:68ch}
.paper .body p{margin:0}
.paper .none{font-style:italic;color:var(--paper-muted)}
.group-badge{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.group-badge i{width:8px;height:8px;border-radius:50%;background:var(--g);display:inline-block;flex:none}
.group-badge .name{font:600 clamp(17px,1.9vw,21px)/1.2 var(--f-legal);color:var(--paper-ink);letter-spacing:0;text-transform:none;white-space:normal}

/* unités de sens : un simple filet doré, cliquable (le fond n'apparaît qu'au survol) */
.paper mark.pt{color:inherit;background:none;box-shadow:inset 0 -1.5px 0 rgba(217,181,106,.95);cursor:pointer;transition:background .2s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.paper mark.pt:hover{background:rgba(217,181,106,.24)}
/* écart avec la commission, toujours porté sur la rédaction du groupe (la commission reste vierge) : ajout = souligné, gras, encre bleue ; suppression = barré, encore lisible */
.paper ins{color:var(--ins);font-weight:600;text-decoration:underline 1.5px;text-underline-offset:3px;background:none}
.paper del{color:#7d7466;text-decoration:line-through 1.5px var(--del);background:none}
.paper ins[data-h],.paper del[data-h]{cursor:zoom-in;border-radius:2px;transition:background .2s}
.paper ins[data-h]:hover,.paper del[data-h]:hover{background:rgba(29,79,145,.09)}

/* --- cinq volets côte à côte --- */
.center{position:absolute;inset:0}
.pane{position:absolute;inset:0;transform:translateX(calc(var(--rel,0) * 55%));opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .5s var(--ease),opacity .4s,visibility 0s linear .5s}
.pane.on{opacity:1;visibility:visible;pointer-events:auto;transition:transform .5s var(--ease),opacity .4s,visibility 0s}
.pane-others{padding:84px var(--gutter-r) 56px var(--gutter-l);display:flex;flex-direction:column;align-items:center;justify-content:center}
.pane-cmp{padding:76px var(--gutter-r) 60px var(--gutter-l);display:flex;flex-direction:column;align-items:center}
.pile-title{position:absolute;top:44px;left:var(--gutter-l);right:var(--gutter-r);z-index:2;margin:0;text-align:center;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;line-height:1.6;pointer-events:none}
.pile-title b{color:var(--fg);font-weight:500}

/* --- échelles empilées dans un volet --- */
.layer{position:absolute;inset:0;padding:72px var(--gutter-r) 56px var(--gutter-l);display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;pointer-events:none;transform:scale(.86);transition:opacity .4s,transform .5s var(--ease),visibility 0s linear .5s}
.layer.shallow{transform:scale(1.18)}
.layer.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .4s,transform .5s var(--ease),visibility 0s}
.layer-pt,.layer-duo{padding-top:84px}
.pane:not(.on) .layer.on{visibility:inherit;pointer-events:none} /* un volet masqué ne doit rien capter, même par sa couche active */

/* --- la pile : un tambour de feuilles --- */
.drum{position:relative;width:100%;flex:none;perspective:1600px}
.sheet{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px;padding:34px 40px 26px;transition:box-shadow .35s}
.face{position:absolute;top:0;left:0;right:0;margin:0 auto;width:min(880px,100%);max-height:calc(100vh - 160px);max-height:calc(100dvh - 160px);
  touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform,opacity}
.face.passage{width:min(680px,100%);grid-template-rows:auto minmax(0,1fr) auto}
.face.artf{grid-template-rows:auto minmax(0,1fr) auto;padding:28px 34px 20px}
.face:not(.cur){cursor:pointer}
.face.editing{user-select:text;-webkit-user-select:text}
.sheet.editing{box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 0 2px var(--accent)}
.sheet .body{overflow:auto;min-height:0}
.face.al.cur .body{cursor:text}
.ptxt{font:400 clamp(26px,3.6vw,38px)/1.3 var(--f-legal);margin:8px 0 6px;max-width:none}
.sheet .foot{display:flex;justify-content:flex-end;gap:12px;align-items:center;min-height:30px}
.sheet .foot span{margin-right:auto;font-size:11.5px;color:#8a8070}
.sheet .foot .count{margin-right:0;font-size:11px;letter-spacing:.08em;color:var(--paper-muted);white-space:nowrap}
.sheet .foot .tag{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-muted)}
.sheet .foot .tag b{color:var(--paper-ink);font-weight:600}
.sheet .foot .tag i{width:8px;height:8px;border-radius:2px;background:var(--accent);flex:none}
.sheet button{font:500 13px var(--f-ui);border-radius:4px;padding:6px 14px;cursor:pointer;border:1px solid #a89c80;background:transparent;color:#4a4336}
.sheet button.primary{background:#2a2620;color:var(--paper);border-color:#2a2620}
.sheet button:focus-visible{outline:2px solid #2a2620;outline-offset:2px}
/* une proposition et les groupes qui la portent */
.cluster .body{max-width:none}
.who{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:14px}
.who-i{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--f-ui);color:var(--paper-ink);background:rgba(255,255,255,.45);border:1px solid var(--paper-line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.who-i i{width:7px;height:7px;border-radius:50%;background:var(--g)}
.who-i small{color:var(--paper-muted);font-size:10.5px}
button.who-i{cursor:pointer}
button.who-i:hover,button.who-i:focus-visible{border-color:#8a7a55;outline:none;background:rgba(255,255,255,.75)}
/* éditeur : une zone de saisie transparente posée sur un calque qui porte les marques */
.ed{position:relative}
.ed .mirror,.sheet textarea{font:inherit;letter-spacing:inherit;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;margin:0;padding:0;border:0}
.ed .mirror{position:absolute;inset:0;color:transparent;pointer-events:none;overflow:hidden}
.ed .mirror mark,.ed .mirror ins{color:transparent}
.ed .mirror ins{font-weight:inherit;text-decoration:underline 2px var(--ins);text-underline-offset:3px}
.delpt{position:relative}
.delpt::after{content:"";position:absolute;left:-1px;top:.2em;height:1.1em;width:2px;border-radius:1px;background:var(--del)}
.sheet textarea{position:relative;color:inherit;background:transparent;resize:none;width:100%;min-height:3em;display:block;overflow:hidden;caret-color:var(--paper-ink)}
.sheet textarea:focus{outline:none}

/* --- dézoom sur un alinéa (le mien ou celui d'un autre) : le texte d'origine au-dessus --- */
.zoomer{width:100%;display:flex;flex-direction:column;align-items:center;transform-origin:50% 50%;transition:transform .45s var(--ease)}
#stage[data-mode=origin] .zoomer{transform:scale(.9)}
.orig-wrap{width:100%;flex:none;display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
#stage[data-mode=origin] .orig-wrap{grid-template-rows:1fr}
.orig-clip{min-height:0;overflow:hidden;margin:0 -40px;padding:0 40px 24px}
.orig{width:min(880px,100%);margin:0 auto;display:grid;gap:10px;padding:24px 32px 18px;opacity:0;transform:translateY(-28px);transition:opacity .35s,transform .45s var(--ease);
  box-shadow:0 14px 34px rgba(0,0,0,.55), 0 0 0 1px rgba(217,181,106,.25)}
#stage[data-mode=origin] .orig{opacity:1;transform:none}
.orig .body{font:400 clamp(16px,1.9vw,20px)/1.5 var(--f-legal);max-width:none;max-height:28vh;overflow:auto;touch-action:pan-y}
.orig .legend{font:400 12px/1.45 var(--f-ui);color:var(--paper-muted);margin:0}
.orig .legend ins,.orig .legend del{padding:0 3px}

/* --- index des unités de sens de l'alinéa --- */
.units{position:absolute;z-index:6;left:46px;top:50%;transform:translateY(-50%);width:150px;display:grid;gap:6px;transition:opacity .3s}
.units.hide{opacity:0;pointer-events:none}
.units-t{margin:0 0 4px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.units button{display:grid;gap:1px;text-align:left;font:500 13px var(--f-ui);color:var(--fg);background:rgba(11,13,18,.6);border:1px solid var(--line-2);border-left:2px solid var(--accent);border-radius:4px;padding:7px 10px;cursor:pointer;backdrop-filter:blur(6px)}
.units button small{font:400 11px var(--f-ui);color:var(--muted)}
.units button:hover,.units button:focus-visible{border-color:var(--accent);outline:none;background:rgba(217,181,106,.1)}
@media (max-width:1199px){
  .units{left:var(--gutter-l);right:var(--gutter-r);top:40px;transform:none;width:auto;display:flex;align-items:center;gap:6px;overflow-x:auto;touch-action:pan-x;scrollbar-width:none}
  .units::-webkit-scrollbar{display:none}
  .units-t{margin:0 4px 0 0;flex:none}
  .units button{flex:none;display:flex;gap:6px;align-items:baseline;padding:5px 9px;font-size:12px}
}

/* --- les articles en entier --- */
.art-ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.art-ol li{display:grid;grid-template-columns:24px 1fr;gap:2px 12px;padding:8px 8px 8px 10px;border-radius:3px;font:400 clamp(15px,1.6vw,17px)/1.55 var(--f-legal)}
.art-ol li .n{font:400 12px var(--f-ui);color:var(--paper-muted);padding-top:4px}
.art-ol li .meta{grid-column:2;font:400 11.5px var(--f-ui);color:#8a8070}
.art-ol li.mod{box-shadow:inset 3px 0 0 var(--accent)}
.art-ol li[data-i]{cursor:pointer;transition:background .2s}
.art-ol li[data-i]:hover{background:rgba(217,181,106,.1)}
.art-body{max-width:none!important;padding-right:4px}
.art-h{font:600 22px var(--f-legal);margin:4px 0 10px}

/* --- face à face et comparaison éclatée : colonnes papier dont les lignes s'alignent --- */
.burst-scroll{width:min(1180px,100%);flex:1;min-height:0;overflow:auto;padding:22px 10px 40px}
.burst-grid{display:grid;grid-template-columns:repeat(var(--k),minmax(0,1fr));gap:0 18px;align-items:start}
.bcol{display:grid;grid-template-rows:subgrid;padding:22px 24px 14px;outline-width:10px;outline-offset:-10px;box-shadow:0 16px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(217,181,106,.2)}
.bcol .head{align-self:end;margin-bottom:4px;flex-wrap:wrap}
.bcol.ref{box-shadow:0 16px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(217,181,106,.45)}
.cell{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 0;border-top:1px solid rgba(201,191,166,.55);font:400 clamp(14.5px,1.35vw,16.5px)/1.55 var(--f-legal)}
.cell:nth-child(2){border-top:0}
.cell .n{font:400 11.5px var(--f-ui);color:var(--paper-muted);padding-top:3px}
.cell.one{grid-template-columns:1fr;font-size:clamp(17px,1.9vw,22px)}
.cell .meta{display:block;margin-top:4px;font:400 11px var(--f-ui);color:#8a8070}
.layer-duo .burst-scroll{touch-action:none}

/* --- comparer : une bibliothèque qui défile, un coffre, puis l'éclatement --- */
.cmp-wrap{width:100%;max-width:1160px;flex:1;min-height:0;display:flex;justify-content:center;gap:26px}
.lib-col{width:min(620px,100%);min-height:0;display:flex;flex-direction:column}
.pane-cmpL .lib-col{width:min(420px,40%)}
.lib-list{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:grid;align-content:start;gap:14px;padding:24px 12px 44px}
.lib-item{display:grid;gap:8px;padding:20px 24px 16px;cursor:pointer;outline-width:10px;outline-offset:-10px;box-shadow:0 14px 34px rgba(0,0,0,.5), 0 0 0 1px rgba(217,181,106,.2);transition:box-shadow .2s,transform .2s,opacity .2s}
.lib-item:hover{transform:translateX(3px)}
.lib-item.on{box-shadow:0 14px 34px rgba(0,0,0,.5), 0 0 0 2px var(--accent)}
.lib-item.full:not(.on){opacity:.55}
.lib-item:focus-visible{box-shadow:0 0 0 3px var(--fg)}
.lib-item .head .in{color:#8a6a28;font-weight:600}
.lib-text{font:400 clamp(16px,1.6vw,18px)/1.5 var(--f-legal);margin:0}
.lib-objet{font:italic 400 13.5px var(--f-legal);color:var(--paper-muted);margin:0}
.lib-objets{margin:0;padding:0;list-style:none;display:grid;gap:3px;font:400 13px/1.4 var(--f-legal);color:var(--paper-muted)}
.lib-objets b{font:500 11px var(--f-ui);color:var(--paper-ink);margin-right:6px}
.coffre-col{width:min(260px,30%);display:flex;flex-direction:column;justify-content:center}
.coffre{display:grid;gap:12px;padding:16px;border:1px dashed #3d4354;border-radius:10px;background:rgba(11,13,18,.55);backdrop-filter:blur(6px);transition:border-color .2s}
.coffre.flash{animation:flash .5s}
@keyframes flash{0%,100%{border-color:#3d4354}40%{border-color:var(--del)}}
.coffre-t{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.coffre-t b{color:var(--fg);font-weight:500}
.pastilles{display:flex;flex-wrap:wrap;gap:8px}
.pastille{display:inline-flex;align-items:center;gap:7px;font:500 12px var(--f-ui);color:var(--fg);background:#1a1e28;border:1px solid var(--line-2);border-radius:999px;padding:5px 6px 5px 10px;animation:drop .35s var(--ease)}
@keyframes drop{from{transform:translateY(-8px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.pastille i{width:8px;height:8px;border-radius:50%;background:var(--g)}
.pastille button{border:0;background:none;color:var(--muted);font:400 15px/1 var(--f-ui);cursor:pointer;padding:0 3px}
.pastille button:hover{color:var(--fg)}
.coffre-vide{font-size:12px;color:var(--muted);line-height:1.45}
.pane-cmpL .coffre{margin:22px 12px 0}
.main-art{width:min(640px,60%);min-height:0;overflow-y:auto;padding:24px 8px 44px}
.main-art .art{padding:26px 32px 24px}
.burst{display:none;width:100%;flex:1;min-height:0;flex-direction:column;align-items:center;gap:12px}
.pane-cmp.bursting .cmp-wrap{display:none}
.pane-cmp.bursting .burst{display:flex}
.burst .btn{flex:none}
.btn{font:500 13px var(--f-ui);letter-spacing:.04em;color:var(--fg);background:rgba(11,13,18,.75);border:1px solid var(--accent);border-radius:999px;padding:9px 20px;cursor:pointer;backdrop-filter:blur(6px)}
.btn:hover,.btn:focus-visible{background:rgba(217,181,106,.16);outline:none}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line-2);background:rgba(11,13,18,.75)}

/* --- listes : défilement natif, sans barre, bords fondus --- */
.lib-list,.main-art,.burst-scroll,.sheet .body,.orig .body{scrollbar-width:none;-ms-overflow-style:none}
.lib-list::-webkit-scrollbar,.main-art::-webkit-scrollbar,.burst-scroll::-webkit-scrollbar,.sheet .body::-webkit-scrollbar,.orig .body::-webkit-scrollbar{display:none}
.lib-list,.main-art,.burst-scroll{scroll-behavior:smooth;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 18px,#000 calc(100% - 40px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 18px,#000 calc(100% - 40px),transparent 100%)}

/* --- loupe : une modification et la commission, côte à côte --- */
.loupe{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:24px var(--gutter-r) 24px var(--gutter-l);background:rgba(6,8,12,.74);backdrop-filter:blur(3px);
  opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s linear .25s}
.loupe.on{opacity:1;visibility:visible;transition:opacity .25s,visibility 0s}
.loupe-in{width:min(1000px,100%);display:grid;gap:18px;justify-items:center;transform:scale(.94);transition:transform .35s var(--ease)}
.loupe.on .loupe-in{transform:none}
.loupe-title{margin:0;text-align:center;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.loupe-title b{color:var(--fg);font-weight:500}
.loupe-cols{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.lc{display:grid;align-content:start;gap:12px;padding:24px 26px 22px}
.lc .head{flex-wrap:wrap}
.lc .group-badge{white-space:normal}
.lc p{font:400 clamp(17px,2.4vw,27px)/1.45 var(--f-legal);margin:0}
.lc .ctx{color:var(--paper-muted)}

/* --- repères de la pile, à gauche --- */
.rail{position:absolute;left:max(5px,env(safe-area-inset-left,0px));top:68%;transform:translateY(-50%);z-index:9;display:grid;gap:12px;transition:opacity .3s}
.rail button{position:relative;width:8px;height:8px;padding:0;border-radius:50%;border:1px solid #4a5062;background:transparent;cursor:pointer}
.rail button::after{content:"";position:absolute;inset:-7px}
.rail button.on{background:var(--accent);border-color:var(--accent)}
.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.rail:empty,#stage.editing .rail{opacity:0;pointer-events:none}

/* --- poignées : en haut l'échelle, sur les côtés les volets voisins --- */
.handle{position:absolute;z-index:10;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  background:rgba(11,13,18,.7);border:1px solid var(--line-2);backdrop-filter:blur(6px);cursor:pointer;user-select:none;transition:color .2s,border-color .2s,opacity .3s}
.handle:hover,.handle:focus-visible{color:var(--fg);border-color:var(--accent);outline:none}
.handle b{color:var(--accent);font-weight:600}
.handle.hide{opacity:0;pointer-events:none}
.handle.top{top:env(safe-area-inset-top,0px);left:50%;transform:translateX(-50%);border-top:0;border-radius:0 0 10px 10px;padding:9px 16px 8px}
.handle.right{right:max(0px,env(safe-area-inset-right,0px));top:38%;transform:rotate(-90deg) translate(50%,-100%);transform-origin:right top;border-right:0;border-radius:10px 10px 0 0;padding:9px 16px 8px}
.handle.left{left:max(0px,env(safe-area-inset-left,0px));top:38%;transform:rotate(90deg) translate(-50%,-100%);transform-origin:left top;border-bottom:0;border-radius:10px 10px 0 0;padding:9px 16px 8px}
.handle .chev{font-size:10px}
.handle .zg{font-size:14px;line-height:1}

.hint{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;font-size:12.5px;color:var(--muted);background:rgba(11,13,18,.6);border:1px solid var(--line);border-radius:999px;padding:6px 14px;backdrop-filter:blur(6px);white-space:nowrap;pointer-events:none}
.hint b{color:var(--fg);font-weight:500}
@media (max-width:760px){

  ],

    {g:"SOL", num:"215", titre:"Limiter l'exemption à trois ans et exiger un avis conforme", texte:"« Le préfet peut, après avis conforme du comité régional de l'habitat, exempter pour trois ans au plus les communes dont plus de la moitié du territoire urbanisé est inconstructible. »"}
  ],
  6:[

    {g:"SOL", num:"216", mode:"supprimer", titre:"Ne pas décompter les logements intermédiaires"},

const AMEND = ARTICLE.alineas.filter(a=>!a.chapeau);
const MINE = AMEND.map((a,i)=>({numero:`N° ${i+1} (brouillon)`, texte:`« ${a.texte} »`}));

const $=s=>document.querySelector(s);
const stage=$("#stage");
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const plural=(n,s,p)=>n>1?(p||s+"s"):s;

/* ---------- Écart mot à mot entre deux rédactions ---------- */
// Les guillemets « » qui encadrent une rédaction proposée ne comptent pas comme un écart.
const isWs=t=>/^\s+$/.test(t), isQuote=t=>t==="«"||t==="»";
const norm=t=>t.replace(/’/g,"'").toLowerCase();
function tokenize(s){ return s.match(/\s+|[\p{L}\p{N}'’%]+|[^\s\p{L}\p{N}'’%]/gu)||[]; }
function lcsKeep(a,b){ // pour chaque mot, true s'il appartient à la plus longue sous-suite commune
  const n=a.length, m=b.length, ka=new Array(n).fill(false), kb=new Array(m).fill(false);
  if(n*m>4e6) return [ka,kb];
  const L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j]= a[i]===b[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  let i=0, j=0;
  while(i<n&&j<m){ if(a[i]===b[j]){ ka[i]=kb[j]=true; i++; j++; } else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
  return [ka,kb];
}
function marked(tokens,keep,tag){ // regroupe les mots modifiés contigus dans une seule balise
  let out="", open=false;
  const nextWord=k=>{ for(let x=k+1;x<tokens.length;x++) if(!isWs(tokens[x])) return x; return -1; };
  tokens.forEach((t,k)=>{
    if(isWs(t)){ if(open){ const nx=nextWord(k); if(nx<0||keep[nx]!==false){ out+=`</${tag}>`; open=false; } } out+=esc(t); return; }
    const changed=keep[k]===false;
    if(changed&&!open){ out+=`<${tag}>`; open=true; } else if(!changed&&open){ out+=`</${tag}>`; open=false; }
    out+=esc(t);
  });
  return open? out+`</${tag}>` : out;
}
function compare(orig,mine){
  const ta=tokenize(orig), tb=tokenize(mine), ia=[], ib=[];
  ta.forEach((t,k)=>{ if(!isWs(t)&&!isQuote(t)) ia.push(k); });
  tb.forEach((t,k)=>{ if(!isWs(t)&&!isQuote(t)) ib.push(k); });
  const [ka,kb]=lcsKeep(ia.map(k=>norm(ta[k])), ib.map(k=>norm(tb[k])));
  const keepA=[], keepB=[]; ia.forEach((k,x)=>keepA[k]=ka[x]); ib.forEach((k,x)=>keepB[k]=kb[x]);
  return { origHTML:marked(ta,keepA,"del"), mineHTML:marked(tb,keepB,"ins"), same:ka.every(Boolean)&&kb.every(Boolean), del:ka.some(v=>!v), ins:kb.some(v=>!v) };
}

/* ---------- Passages ---------- */
function findPoints(a,text){
  const out=[];
  for(const P of a.points){ const m=P.re.exec(text); if(m) out.push({k:P.k,label:P.label,start:m.index,end:m.index+m[0].length,text:m[0]}); }
  out.sort((x,y)=>x.start-y.start);
  return out.filter((x,i,arr)=>!i||x.start>=arr[i-1].end);
}
const passageOf=(a,k,text)=>{ const p=findPoints(a,text).find(x=>x.k===k); return p?p.text:null; };
const labelOf=(a,k)=>(a.points.find(P=>P.k===k)||{label:""}).label;
const pnorm=s=>s.replace(/’/g,"'").replace(/\s+/g," ").trim().toLowerCase();
function effText(a,o){ if(o.mode==="supprimer") return ""; if(o.mode==="completer") return a.texte+" "+o.texte.replace(/^«\s*|\s*»$/g,""); return o.texte; }
function pointMarks(a,text){
  let out="", i=0;
  for(const p of findPoints(a,text)){ out+=esc(text.slice(i,p.start))+`<mark class="pt" data-k="${p.k}" title="${esc(p.label)} : cliquer pour isoler">${esc(p.text)}</mark>`; i=p.end; }
  return out+esc(text.slice(i));
}
const othersOf=i=>OTHERS[AMEND[i].n]||[];
function versions(i,k){ // les rédactions des autres pour ce passage ; celles identiques à la mienne sont mises à part
  const a=AMEND[i], mine=passageOf(a,k,MINE[i].texte)||"", list=[], same=[];
  for(const o of othersOf(i)){ const p=o.mode==="supprimer"?null:passageOf(a,k,effText(a,o)); if(p!=null&&pnorm(p)===pnorm(mine)) same.push(o); else list.push({o,p}); }
  return {mine,list,same};
}

const strip=t=>t.replace(/^«\s*|\s*»$/g,"");
// corrections apparentes, portées sur la rédaction du groupe : ce que la référence a et pas elle (barré), ce qu'elle ajoute (souligné, gras).
// Avec meta, chaque zone de modification devient cliquable et ouvre la loupe.
const HUNKS=new Map(); let hunkSeq=0;
function ctxWords(op,dir){ // quelques mots de contexte autour d'une modification, sans franchir la fin de phrase
  if(!op||op.type!=="eq") return "";
  const parts=op.text.split(/(\s+)/);
  if(dir<0){ let t=parts.slice(-11).join(""); const m=t.match(/[\s\S]*[.;:]\s+/); if(m) return t.slice(m[0].length); return (parts.length>11?"… ":"")+t; }
  let t=parts.slice(0,11).join(""); const m=t.match(/^[\s\S]*?[.;:]/); if(m) return m[0]; return t+(parts.length>11?" …":"");

function inlineDiff(ref,mine,meta){
  const units=s=>{ const u=[]; let lead=""; for(const t of tokenize(s)){ if(isWs(t)){ if(u.length) u[u.length-1].ws+=t; else lead+=t; } else if(!isQuote(t)) u.push({w:t,ws:""}); } return u; };
  const A=units(ref), B=units(mine);
  const [ka,kb]=lcsKeep(A.map(x=>norm(x.w)), B.map(x=>norm(x.w)));
  const ops=[]; const push=(type,text)=>{ const l=ops[ops.length-1]; if(l&&l.type===type) l.text+=text; else ops.push({type,text}); };
  let i=0, j=0;
  while(i<A.length||j<B.length){
    if(i<A.length&&!ka[i]){ push("del",A[i].w+A[i].ws); i++; }
    else if(j<B.length&&!kb[j]){ push("ins",B[j].w+B[j].ws); j++; }
    else if(i<A.length&&j<B.length){ push("eq",B[j].w+B[j].ws); i++; j++; }
    else break;
  }
  const hid=[];
  if(meta) for(let k=0;k<ops.length;){
    if(ops[k].type==="eq"){ k++; continue; }
    let e=k; while(e+1<ops.length&&ops[e+1].type!=="eq") e++;
    const id=++hunkSeq; HUNKS.set(id,{meta,before:ctxWords(ops[k-1],-1),after:ctxWords(ops[e+1],1),seg:ops.slice(k,e+1)});
    if(HUNKS.size>800) HUNKS.delete(HUNKS.keys().next().value);
    for(let x=k;x<=e;x++) hid[x]=id; k=e+1;
  }
  return renderOps(ops,hid);
}
function renderOps(ops,hid){
  return ops.map((o,k)=>{
    if(o.type==="eq") return esc(o.text);
    const m=o.text.match(/^([\s\S]*?)(\s*)$/), glue=o.type==="del"&&!m[2]&&ops[k+1]&&ops[k+1].type==="ins"?"\u2009":""; // « 2028 2030 » plutôt que « 20282030 »
    return `<${o.type}${hid&&hid[k]?` data-h="${hid[k]}" title="Comparer avec ${esc(HUNKS.get(hid[k]).meta.refLabel.toLowerCase())}"`:""}>${esc(m[1])}</${o.type}>${m[2]}${glue}`;

// sur une feuille entre guillemets, on garde les guillemets autour des corrections
function diffSheet(ref,text,meta){ const q=/^\s*«/.test(text), html=inlineDiff(ref,strip(text),meta); return q?`« ${html} »`:html; }
// pendant la frappe, le calque miroir doit garder exactement le texte saisi : ajouts soulignés seulement, suppressions en repère fin
function liveHTML(ref,mine){
  const A=tokenize(ref).filter(t=>!isWs(t)&&!isQuote(t)), tb=tokenize(mine), ib=[];
  tb.forEach((t,k)=>{ if(!isWs(t)&&!isQuote(t)) ib.push(k); });

  let i=0, out="";
  const flush=()=>{ const d=[]; while(i<A.length&&!ka[i]){ d.push(A[i]); i++; } return d.length?`<span class="delpt" title="supprimé : ${esc(d.join(" "))}"></span>`:""; };
  tb.forEach((t,k)=>{ if(keepB[k]===undefined){ out+=esc(t); return; } out+=flush(); if(keepB[k]){ i++; out+=esc(t); } else out+=`<ins>${esc(t)}</ins>`; });

}

/* ---------- La pile : un tambour de feuilles ---------- */
// pos est continu : on fait défiler petit à petit, puis ça se cale. La feuille du dessus bascule en arrière (pivot sur son bord bas),
// celle du dessous attend, inclinée (pivot sur son bord haut). dim < 1 estompe les voisines (édition, texte d'origine).
const GAP=24, TILT=62;
class Drum{
  constructor(el,onMove){ this.el=el; this.faces=[]; this.pos=0; this.raw=0; this.raf=0; this.fraf=0; this.dim=1; this.last=-1; this.onMove=onMove||(()=>{}); this.ro=new ResizeObserver(()=>this.layout()); }
  get n(){ return this.faces.length; }
  get cur(){ return clamp(Math.round(this.pos),0,Math.max(0,this.n-1)); }
  set(html,idx){
    cancelAnimationFrame(this.raf);
    this.el.innerHTML=html.join(""); this.faces=[...this.el.children]; this.faces.forEach((f,i)=>f.dataset.i=i);
    this.pos=this.raw=clamp(idx||0,0,Math.max(0,this.n-1)); this.last=-1;
    this.ro.disconnect(); this.faces.forEach(f=>this.ro.observe(f));
    this.layout();
  }
  step(){ const f=this.faces[this.cur]; return (f?f.offsetHeight:300)+GAP; }
  layout(){
    if(!this.n){ this.el.style.height="0px"; return; }
    const c=this.cur, H=this.faces[c].offsetHeight;
    this.el.style.height=H+"px";
    this.faces.forEach((f,i)=>{
      const d=i-this.pos, ad=Math.abs(d);
      f.style.transformOrigin= d<0 ? "50% 100%" : "50% 0%";
      f.style.transform=`translateY(${(d*(H+GAP)).toFixed(1)}px) rotateX(${(-clamp(d,-1,1)*TILT).toFixed(2)}deg)`;
      let op= ad<=1 ? 1-.55*ad : Math.max(0,.45*(2-ad));
      op*= this.dim+(1-this.dim)*clamp(1-ad,0,1);
      f.style.opacity=op.toFixed(3);
      f.style.visibility= op<.02 ? "hidden" : "";
      f.style.zIndex=String(100-Math.round(ad*10));
      f.classList.toggle("cur",i===c); f.setAttribute("aria-hidden",String(i!==c));
    });
    if(c!==this.last){ this.last=c; this.onMove(c); }
  }
  to(t){
    t=clamp(t,0,Math.max(0,this.n-1)); cancelAnimationFrame(this.raf); this.raw=t;
    if(reduced){ this.pos=t; this.layout(); return; }
    const tick=()=>{ this.pos+=(t-this.pos)*.2; if(Math.abs(t-this.pos)<.002){ this.pos=t; this.layout(); return; } this.layout(); this.raf=requestAnimationFrame(tick); };
    this.raf=requestAnimationFrame(tick);
  }
  fade(t){
    cancelAnimationFrame(this.fraf);
    if(reduced||this.dim===t){ this.dim=t; this.layout(); return; }
    const tick=()=>{ this.dim+=(t-this.dim)*.22; if(Math.abs(t-this.dim)<.01){ this.dim=t; this.layout(); return; } this.layout(); this.fraf=requestAnimationFrame(tick); };
    this.fraf=requestAnimationFrame(tick);
  }
  jump(t){ cancelAnimationFrame(this.raf); this.pos=this.raw=clamp(t,0,Math.max(0,this.n-1)); this.layout(); }
  begin(){ cancelAnimationFrame(this.raf); this.raw=this.pos; return this.cur; }
  rubber(v){ const m=this.n-1; return v<0 ? v*.3 : v>m ? m+(v-m)*.3 : v; }
  move(px){ this.raw+=px/this.step(); this.pos=this.rubber(this.raw); this.layout(); }
  dragTo(from,px){ this.raw=from+px/this.step(); this.pos=this.rubber(this.raw); this.layout(); }
  snap(start,v){ // un petit mouvement suffit à passer à la feuille suivante ; un geste ample peut en sauter plusieurs
    v=v||0; const moved=this.pos-start; let t=start;
    if(Math.abs(moved)>.12||Math.abs(v)>1.2){ const proj=Math.round(this.pos+v*.12); t= moved+v*.1>0 ? Math.max(start+1,proj) : Math.min(start-1,proj); }
    this.to(t);
  }
}

function clusters(i,k){

const COMMISSION_COL=cells=>({label:"Texte de la commission",color:"#6b6457",sub:"référence",ref:true,cells});
function artCells(id){ // une version de l'article, alinéa par alinéa, en corrections apparentes face à la commission
  return ARTICLE.alineas.map(a=>{
    if(a.chapeau) return esc(a.texte);
    const i=AMEND.indexOf(a), v=artVersion(id,a,i), meta={...COMMISSION,label:artLabel(id),color:artColor(id),where:`alinéa ${a.n}`};
    const html= v.o&&v.o.mode==="supprimer" ? inlineDiff(a.texte,"",meta) : inlineDiff(a.texte,v.text,meta);
    const note= v.o ? `<span class="meta">n° ${v.o.num}${v.o.mode==="supprimer"?" · supprime l'alinéa":""}</span>` : "";
    return html+note;
  });
}
function renderDuo(){
  const id=ARTS[dAr.cur], rows=ARTICLE.alineas.map(a=>a.n);
  $("#duo").innerHTML=burstHTML([COMMISSION_COL(ARTICLE.alineas.map(a=>esc(a.texte))),{label:artLabel(id),color:artColor(id),sub:`${dAr.cur+1} / ${ARTS.length}`,cells:artCells(id)}],rows);
  $("#duo").scrollTop=0;
  $("#arTitle").innerHTML=`${ARTICLE.num} · <b>${esc(artLabel(id))}</b> face à la commission`;
}

/* ---------- Comparer : bibliothèque, coffre, éclatement ---------- */
// Les deux côtés ont la même mécanique : un clic dépose une rédaction dans le coffre (deux au plus),
// « Comparer » les éclate en colonnes autour du texte de la commission.
function rEntries(){
  const i=curAl(), a=AMEND[i], p=S.mode==="passage"?curPt():null, at=t=>p?passageOf(a,p.k,t):t;
  return [{id:"mine",color:GROUPS[ME].color,label:GROUPS[ME].name,short:"Vous",sub:"vous",text:at(strip(MINE[i].texte))},
    ...othersOf(i).map(o=>({id:o.num,color:GROUPS[o.g].color,label:GROUPS[o.g].name,short:GROUPS[o.g].name,sub:`N° ${o.num}`,objet:o.titre,
      text:o.mode==="supprimer"?null:p?passageOf(a,p.k,effText(a,o)):o.mode==="completer"?a.texte+" "+strip(o.texte):strip(o.texte)}))];
}
const lEntries=()=>ARTS.map(id=>({id,color:artColor(id),label:artLabel(id),short:artShort(id),sub:`${artMods(id).length} ${plural(artMods(id).length,"alinéa modifié","alinéas modifiés")}`,mods:artMods(id)}));
function coffreHTML(sel,E){
  return `<p class="coffre-t">À comparer avec la commission · <b>${sel.length}</b>/2</p><div class="pastilles">${sel.length?sel.map(id=>{ const e=E.find(x=>x.id===id); return e?`<span class="pastille" style="--g:${e.color}"><i></i>${esc(e.short)}<button type="button" data-x="${esc(id)}" aria-label="Retirer ${esc(e.short)}">×</button></span>`:""; }).join(""):`<span class="coffre-vide">Cliquez une rédaction pour la déposer ici (deux au plus).</span>`}</div><button type="button" class="btn" data-cmp ${sel.length?"":"disabled"}>Comparer</button>`;
}
function renderCmp(side){
  const L=side==="L";
  if(!L&&S.selRAl!==curAl()){ S.selRAl=curAl(); S.selR=[]; S.burstR=false; }
  const sel=L?S.selL:S.selR, E=L?lEntries():rEntries(), full=sel.length>=2, pane=L?$("#pCmpL"):$("#pLib");
  const i=curAl(), a=AMEND[i], p=!L&&S.mode==="passage"?curPt():null;
  if(L){
    $("#cmpLTitle").innerHTML=`${ARTICLE.num} en entier · <b>comparer</b> jusqu'à deux versions avec la commission`;
    $("#libL").innerHTML=E.map(e=>{ const on=sel.includes(e.id); return `<article class="lib-item paper${on?" on":""}${full?" full":""}" data-id="${esc(e.id)}" tabindex="0" role="checkbox" aria-checked="${on}"><div class="head"><span class="group-badge" style="--g:${e.color}"><i></i><span class="name">${esc(e.label)}</span></span><span>${esc(e.sub)}${on?` · <b class="in">✓ dans le coffre</b>`:""}</span></div><ul class="lib-objets">${e.mods.map(m=>`<li><b>al. ${m.a.n}</b>${esc(m.v.o?m.v.o.titre:"votre rédaction")}</li>`).join("")||`<li>reprend le texte de la commission</li>`}</ul></article>`; }).join("");
    $("#mainArt").innerHTML=`<div class="head"><span>Texte de la commission</span><span>référence</span></div><h2 class="art-h">${ARTICLE.num}</h2><ol class="art-ol">${ARTICLE.alineas.map(x=>`<li><span class="n">${x.n}</span><div>${esc(x.texte)}</div></li>`).join("")}</ol>`;
  } else {
    const gone=p?"supprime ce point":"supprime l'alinéa";
    $("#libTitle").innerHTML=`${p?`<b>${esc(p.label)}</b> · `:""}alinéa ${a.n} · <b>${E.length}</b> rédactions · déposez-en deux au plus dans le coffre`;
    $("#libR").innerHTML=E.map(e=>{ const on=sel.includes(e.id); return `<article class="lib-item paper${on?" on":""}${full?" full":""}" data-id="${esc(e.id)}" tabindex="0" role="checkbox" aria-checked="${on}"><div class="head"><span class="group-badge" style="--g:${e.color}"><i></i><span class="name">${esc(e.label)}</span></span><span>${esc(e.sub)}${on?` · <b class="in">✓ dans le coffre</b>`:""}</span></div><p class="lib-text${e.text==null?" none":""}">${e.text==null?gone[0].toUpperCase()+gone.slice(1):esc(e.text)}</p>${e.objet&&!p?`<p class="lib-objet">Objet : ${esc(e.objet)}</p>`:""}</article>`; }).join("");
  }
  $(L?"#coffreL":"#coffreR").innerHTML=coffreHTML(sel,E);
  pane.classList.toggle("bursting",L?S.burstL:S.burstR);
  if(L?S.burstL:S.burstR) renderBurst(side);
}
function renderBurst(side){
  const L=side==="L", sel=L?S.selL:S.selR, E=L?lEntries():rEntries(), picked=sel.map(id=>E.find(e=>e.id===id)).filter(Boolean);
  let rows, refCells, cellsOf, title;
  if(L){
    rows=ARTICLE.alineas.map(a=>a.n); refCells=ARTICLE.alineas.map(a=>esc(a.texte)); cellsOf=e=>artCells(e.id);
    title=`${ARTICLE.num} · `;
  } else {
    const a=AMEND[curAl()], p=S.mode==="passage"?curPt():null, ref=(p?passageOf(a,p.k,a.texte):a.texte)||"", where=p?`${p.label.toLowerCase()}, alinéa ${a.n}`:`alinéa ${a.n}`;
    rows=[null]; refCells=[esc(ref)];
    cellsOf=e=>{ const meta={...COMMISSION,label:e.label,color:e.color,where}; return [e.text==null?`${inlineDiff(ref,"",meta)} <span class="none">(${p?"supprime ce point":"supprime l'alinéa"})</span>`:inlineDiff(ref,e.text,meta)]; };
    title=`${p?`<b>${esc(p.label)}</b> · `:""}alinéa ${a.n} · `;
  }
  // la commission au centre, une rédaction de chaque côté
  const col=e=>({label:e.label,color:e.color,sub:e.sub,cells:cellsOf(e)}), cols=[COMMISSION_COL(refCells)];
  if(picked[0]) cols.unshift(col(picked[0]));
  if(picked[1]) cols.push(col(picked[1]));
  $(L?"#burstL":"#burstR").innerHTML=`<div class="burst-scroll">${burstHTML(cols,rows)}</div><button type="button" class="btn" data-back>← Revenir à la bibliothèque</button>`;
  $(L?"#cmpLTitle":"#libTitle").innerHTML=title+`<b>${picked.map(e=>esc(e.short)).join("</b> et <b>")}</b> face à la commission`;
}
function toggleSel(side,id){
  const arr=side==="L"?S.selL:S.selR, k=arr.indexOf(id);
  if(k>=0) arr.splice(k,1);
  else if(arr.length>=2){ const c=$(side==="L"?"#coffreL":"#coffreR"); c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash"); return; }
  else arr.push(id);
  if(!arr.length){ if(side==="L") S.burstL=false; else S.burstR=false; }
  renderCmp(side); chrome();
}
function setBurst(side,on){
  if(side==="L") S.burstL=on; else S.burstR=on;
  renderCmp(side); if(on) pop($(side==="L"?"#burstL":"#burstR"),-1);
  chrome();
}

/* ---------- Échelles et volets ---------- */
const LAYERS=[[$("#lAl"),0,["alinea","origin"]],[$("#lPt"),1,["passage"]]], AR_LAYERS=[[$("#lDuo"),-1,["origin"]],[$("#lAr"),0,["alinea","passage"]]];
function toggleLayers(list,m){
  const depth=list.find(L=>L[2].includes(m))[1];
  for(const [el,dp,modes] of list){ const on=modes.includes(m); el.classList.toggle("on",on); el.classList.toggle("shallow",!on&&dp<depth); el.setAttribute("aria-hidden",String(!on)); }
}
function setMode(m,o){
  o=o||{};
  if(S.edit>=0&&m==="passage") closeEditor(false);
  const prev=S.mode; S.mode=m; stage.dataset.mode=m;
  toggleLayers(LAYERS,m); toggleLayers(AR_LAYERS,m);
  document.querySelectorAll(".orig-wrap").forEach(w=>w.setAttribute("aria-hidden",String(m!=="origin")));
  dAl.fade(m==="origin"||S.edit>=0?0:1);
  AMEND.forEach((_,i)=>paintAl(i));
  if(m==="origin"&&S.edit<0) paintOrig(MINE[curAl()].texte);
  if(S.edit>=0) onEdit();
  const scaleJump=(m==="passage")!==(prev==="passage"), dir=DEPTH[m]-DEPTH[prev];
  if(S.pane===1){ buildOt(o.focus); if(scaleJump) pop($("#otZoomer"),dir); }
  if(S.pane===2){ renderCmp("R"); if(scaleJump) pop($(S.burstR?"#burstR":"#pLib .cmp-wrap"),dir); }
  if(S.pane===-1){ if(m==="origin") renderDuo(); else $("#arTitle").innerHTML=`${ARTICLE.num} en entier · <b>${ARTS.length}</b> versions`; }
  chrome();
}
function setPane(p,focus){
  p=clamp(p,-2,2);
  if(p===S.pane||(p===2&&S.pane!==1)||(p===-2&&S.pane!==-1)) return;
  if(S.edit>=0) closeEditor(false);
  S.pane=p; stage.dataset.pane=PANE_NAME[p];
  for(const [k,el] of Object.entries(PANE_EL)){ const rel=+k-p; el.style.setProperty("--rel",rel); el.classList.toggle("on",rel===0); el.setAttribute("aria-hidden",String(rel!==0)); }
  if(p===-2) renderCmp("L");
  if(p===-1) buildAr();
  if(p===1) buildOt(focus);
  if(p===2){ if(S.mode==="origin"){ setMode("alinea"); return; } renderCmp("R"); }
  chrome();
}
function enterPassage(k,focus){
  const i=curAl(); if(!findPoints(AMEND[i],MINE[i].texte).length) return;
  if(S.edit>=0) closeEditor(false);
  buildPt(k); setMode("passage",{focus});
}
function openRegroup(k){ if(S.edit>=0) return; buildPt(k); setMode("passage"); setPane(1); }
// zoomer descend d'un cran (origine → alinéa → unité), dézoomer remonte d'un cran (unité → alinéa → origine)
function zoomStep(dir,k){
  if(S.pane===-2) return;
  const m=S.mode;
  if(S.pane===-1){ if(dir<0&&m!=="origin") setMode("origin"); else if(dir>0&&m==="origin") setMode("alinea"); return; }
  if(dir<0){ if(m==="passage") setMode("alinea"); else if(m==="alinea"&&S.pane!==2) setMode("origin"); }
  else { if(m==="origin") setMode("alinea"); else if(m==="alinea"&&S.edit<0) enterPassage(k||S.lastPt[curAl()]); }
}
// Échap revient d'un cran : l'éclatement vers le coffre, la bibliothèque vers sa pile, puis l'échelle, puis le volet
function back(){
  if(S.pane===-2){ if(S.burstL) setBurst("L",false); else setPane(-1); return; }
  if(S.pane===2){ if(S.burstR) setBurst("R",false); else setPane(1); return; }
  if(S.mode!=="alinea"){ setMode("alinea"); return; }
  if(S.pane!==0) setPane(0);
}
function onAlMove(){ if(S.mode==="origin"){ AMEND.forEach((_,i)=>paintAl(i)); paintOrig(MINE[curAl()].texte); } chrome(); }
function onPtMove(){ const p=curPt(); if(p) S.lastPt[curAl()]=p.k; chrome(); }
function onArMove(){ if(S.mode==="origin"&&S.pane===-1){ renderDuo(); pop($("#duo"),1); } chrome(); }

/* ---------- Poignées, aide, repères ---------- */
function setHandle(h,html){ h.classList.toggle("hide",html==null); h.setAttribute("aria-hidden",String(html==null)); h.tabIndex=html==null?-1:0; if(html!=null) h.innerHTML=html; }
function chrome(){
  const P=S.pane, i=curAl(), a=AMEND[i], m=S.mode, p=curPt(), atP=m==="passage"&&!!p, chev=` <span class="chev">▲</span>`;
  setHandle(hTop, P===-2 ? null
    : P===-1 ? (m==="origin"?`<b>${ARTICLE.num}</b> revenir à la pile <span class="zg">⊕</span>`:`<b>${ARTICLE.num}</b> face à la commission <span class="zg">⊖</span>`)
    : P===2 ? (atP?`<b>${esc(p.label)}</b> revenir à l'alinéa <span class="zg">⊖</span>`:`<b>Alinéa ${a.n}</b> unité par unité <span class="zg">⊕</span>`)

  const nOt= atP ? clusters(i,p.k).length : othersOf(i).length;
  setHandle(hLeft, P===-2 ? null : (P===-1?`<b>Comparer</b> des articles`:P===0?`<b>Les</b> articles`:P===1?(atP?`<b>Ma</b> rédaction`:`<b>Mon</b> amendement`):(atP?`<b>Les</b> propositions`:`<b>La</b> pile`))+chev);
  setHandle(hRight, P===2 ? null : (P===-2?`<b>Les</b> articles`:P===-1?`<b>Mon</b> amendement`:P===0?(atP?`<b>${nOt}</b> ${plural(nOt,"proposition","propositions")}`:`<b>${nOt}</b> ${plural(nOt,"autre amendement","autres amendements")}`):`<b>Comparer</b> côte à côte`)+chev);
  $("#hint").innerHTML=
      P===-2 ? (S.burstL?"<b>Défiler</b> : l'article · <b>clic sur une modification</b> : la comparer · <b>Échap</b> : revenir à la bibliothèque":"<b>Clic</b> : déposer une version dans le coffre (deux au plus) · <b>Comparer</b> : les mettre côte à côte · <b>vers la gauche</b> : les articles")
    : P===-1 ? (m==="origin"?"<b>Défiler</b> : l'article, puis la version suivante · <b>clic sur une modification</b> : la comparer · <b>écarter les doigts</b> : revenir":"<b>Défiler</b> : l'article, puis la version suivante · <b>pincer</b> : face à la commission · <b>droite</b> : comparer · <b>gauche</b> : votre amendement")
    : P===2 ? (S.burstR?"<b>Clic sur une modification</b> : la comparer · <b>Échap</b> : revenir à la bibliothèque":`<b>Clic</b> : déposer dans le coffre (deux au plus) · <b>Comparer</b> : côte à côte · <b>${atP?"pincer":"écarter"}</b> : ${atP?"l'alinéa":"une unité"} · <b>droite</b> : la pile`)
    : P===1 ? (m==="origin" ? "<b>Haut / bas</b> : les amendements · <b>clic sur une modification</b> : la comparer · <b>écarter les doigts</b> ou <b>Échap</b> : revenir"
             : atP ? "<b>Haut / bas</b> : les propositions · <b>clic sur un groupe</b> : son amendement · <b>pincer</b> : l'alinéa · <b>gauche</b> : comparer"
             : "<b>Haut / bas</b> : les amendements · <b>pincer</b> : face à la commission · <b>gauche</b> : comparer · <b>droite</b> : le vôtre")
    : m==="origin" ? "<b>Haut / bas</b> : les alinéas · <b>clic sur une modification</b> : la comparer · <b>ailleurs</b> : modifier · <b>Échap</b> : revenir"
    : atP ? "<b>Haut / bas</b> : les autres unités · <b>gauche</b> : toutes les propositions · <b>pincer</b> : l'alinéa"
    : "<b>Haut / bas</b> : les alinéas · <b>clic sur une unité</b> : l'isoler · <b>pincer</b> : le texte d'origine · <b>gauche</b> : les autres · <b>droite</b> : les articles";
  renderUnits();
  const d=verticalDrum();
  if(!d||d.n<2){ rail.innerHTML=""; return; }
  const labels= d===dAl ? AMEND.map(x=>`Alinéa ${x.n}`) : d===dPt ? S.pts.map(x=>x.label) : d===dAr ? ARTS.map(artLabel)
    : d.faces.map((f,j)=>{ if(f.dataset.ids) return `Proposition ${j+1}`; const o=othersOf(i).find(o=>o.num===f.dataset.num); return o?`${GROUPS[o.g].name}, n° ${o.num}`:""; });
  rail.innerHTML=labels.map((l,j)=>`<button type="button" data-i="${j}" class="${j===d.cur?"on":""}" aria-label="${esc(l)}" title="${esc(l)}"${j===d.cur?' aria-current="true"':""}></button>`).join("");
}

/* ---------- Édition en place ---------- */
// position du curseur dans le texte affiché, à l'endroit du clic
function caretOffset(e,root){
  let r=null;
  if(document.caretPositionFromPoint){ const p=document.caretPositionFromPoint(e.clientX,e.clientY); if(p){ r=document.createRange(); r.setStart(p.offsetNode,p.offset); } }
  else if(document.caretRangeFromPoint){ r=document.caretRangeFromPoint(e.clientX,e.clientY); }
  if(!r||!root||!root.contains(r.startContainer)) return null;
  const pre=document.createRange(); pre.selectNodeContents(root); pre.setEnd(r.startContainer,r.startOffset);
  return pre.toString().length;
}
function fit(){ const ta=$("#edText"); if(!ta) return; ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px"; }
function onEdit(){
  const ta=$("#edText"); if(!ta) return;
  const a=AMEND[S.edit], text=ta.value;
  $("#edMirror").innerHTML=(S.mode==="origin"?liveHTML(a.texte,text):pointMarks(a,text))+(text.endsWith("\n")?" ":"");
  paintOrig(text); fit(); dAl.layout();
}
function openEditor(e){
  if(S.edit>=0||S.pane!==0||(S.mode!=="alinea"&&S.mode!=="origin")) return;
  const c=curAl(); if(Math.abs(dAl.pos-c)>.05) return;
  const f=dAl.faces[c], off=e?caretOffset(e,f.querySelector(".txt")):null;
  S.edit=c; stage.classList.add("editing"); f.classList.add("editing"); dAl.fade(0);
  f.querySelector(".body").innerHTML=`<div class="ed"><div class="mirror" id="edMirror" aria-hidden="true"></div><textarea id="edText" aria-label="Texte de l'amendement" spellcheck="false" rows="1"></textarea></div>`;
  f.querySelector(".foot").innerHTML=`<span>Échap pour annuler · Ctrl+Entrée pour valider</span><button type="button" data-act="cancel">Annuler</button><button type="button" class="primary" data-act="ok">Valider</button>`;
  const ta=$("#edText"); ta.value=MINE[c].texte;
  ta.addEventListener("keydown", e=>{ if(e.key==="Escape"){e.preventDefault();e.stopPropagation();closeEditor(false);} if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();e.stopPropagation();closeEditor(true);} });
  ta.addEventListener("input", onEdit);
  onEdit(); chrome();
  ta.focus({preventScroll:true}); const p=off==null?ta.value.length:off; ta.setSelectionRange(p,p);
}
function closeEditor(commit){
  if(S.edit<0) return;
  const i=S.edit, f=dAl.faces[i], v=$("#edText").value.trim();
  if(commit&&v) MINE[i].texte=v;
  S.edit=-1; stage.classList.remove("editing"); f.classList.remove("editing");
  f.querySelector(".body").innerHTML=`<p class="txt"></p>`;
  paintAl(i); paintOrig(MINE[i].texte); dAl.fade(S.mode==="origin"?0:1); chrome();
}

/* ---------- Loupe : une zone de modification et la commission, côte à côte ---------- */
const loupe=$("#loupe");
function openLoupe(id){
  const h=HUNKS.get(+id); if(!h) return;
  const ctx=t=>t?`<span class="ctx">${esc(t)}</span>`:"";
  const refPart=h.seg.filter(o=>o.type==="del").map(o=>o.text).join("");
  const left=ctx(h.before)+esc(refPart)+ctx(h.after), right=ctx(h.before)+renderOps(h.seg)+ctx(h.after);
  const card=(color,label,body,empty)=>`<section class="lc paper"><div class="head"><span class="group-badge" style="--g:${color}"><i></i>${esc(label)}</span></div><p${empty?' class="none"':""}>${body}</p></section>`;
  $("#loupeTitle").innerHTML=`Modification · <b>${esc(h.meta.where||"")}</b>`;
  $("#loupeCols").innerHTML=card(h.meta.refColor,h.meta.refLabel,left.trim()?left:"(rien à cet endroit)",!left.trim())+card(h.meta.color,h.meta.label,right);
  loupe.classList.add("on"); loupe.setAttribute("aria-hidden","false"); $("#loupeClose").focus({preventScroll:true});
}
function closeLoupe(){ loupe.classList.remove("on"); loupe.setAttribute("aria-hidden","true"); }
const loupeOpen=()=>loupe.classList.contains("on");
$("#loupeClose").addEventListener("click", closeLoupe);
loupe.addEventListener("click", e=>{ if(e.target===loupe) closeLoupe(); });

/* ---------- Clics ---------- */
let clickTimer=0;
const hunkClick=e=>{ const h=e.target.closest("[data-h]"); if(h){ openLoupe(h.dataset.h); return true; } return false; };
$("#drumAl").addEventListener("click", e=>{
  const f=e.target.closest(".face"); if(!f) return;
  const act=e.target.closest("button[data-act]"); if(act){ closeEditor(act.dataset.act==="ok"); return; }
  const i=+f.dataset.i;
  if(i!==dAl.cur){ if(S.edit<0) dAl.to(i); return; }
  if(S.edit>=0) return;
  if(S.mode==="origin"){ if(!hunkClick(e)&&e.target.closest(".body")) openEditor(e); return; }
  const mk=e.target.closest("mark.pt");
  if(mk){ clearTimeout(clickTimer); const k=mk.dataset.k; clickTimer=setTimeout(()=>enterPassage(k),260); } // laisse la place au double-clic
});
$("#drumAl").addEventListener("dblclick", e=>{ clearTimeout(clickTimer); const f=e.target.closest(".face"); if(f&&+f.dataset.i===dAl.cur&&e.target.closest(".body")) openEditor(e); });
$("#drumPt").addEventListener("click", e=>{ const f=e.target.closest(".face"); if(f&&+f.dataset.i!==dPt.cur) dPt.to(+f.dataset.i); });
$("#drumOt").addEventListener("click", e=>{
  const f=e.target.closest(".face"); if(!f) return;
  if(+f.dataset.i!==dOt.cur){ dOt.to(+f.dataset.i); return; }
  const go=e.target.closest("[data-goto]");
  if(go){ const id=go.dataset.goto; if(id==="mine") setPane(0); else setMode("alinea",{focus:id}); return; }
  if(hunkClick(e)) return;
  const mk=e.target.closest("mark.pt"); if(mk&&S.mode==="alinea") enterPassage(mk.dataset.k,f.dataset.num);
});
$("#drumAr").addEventListener("click", e=>{
  const f=e.target.closest(".face"); if(!f) return;
  if(+f.dataset.i!==dAr.cur){ dAr.to(+f.dataset.i); return; }
  const li=e.target.closest("li[data-i]"); if(!li) return;
  const i=+li.dataset.i, id=f.dataset.id, v=artVersion(id,AMEND[i],i);
  if(S.mode==="passage") setMode("alinea");
  dAl.jump(i);
  if(id!=="mine"&&v.o) setPane(1,v.o.num); else setPane(0);
});
$("#duo").addEventListener("click", hunkClick);
$("#units").addEventListener("click", e=>{ const b=e.target.closest("button[data-k]"); if(b) openRegroup(b.dataset.k); });
for(const side of ["L","R"]){
  const pane=side==="L"?$("#pCmpL"):$("#pLib");
  pane.addEventListener("click", e=>{
    if(hunkClick(e)) return;
    const x=e.target.closest("[data-x]"); if(x){ toggleSel(side,x.dataset.x); return; }
    if(e.target.closest("[data-cmp]")){ setBurst(side,true); return; }
    if(e.target.closest("[data-back]")){ setBurst(side,false); return; }
    const it=e.target.closest(".lib-item"); if(it) toggleSel(side,it.dataset.id);
  });
  pane.addEventListener("keydown", e=>{ const it=e.target.closest(".lib-item"); if(it&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); e.stopPropagation(); toggleSel(side,it.dataset.id); } });
}
rail.addEventListener("click", e=>{ const b=e.target.closest("button"), d=verticalDrum(); if(b&&d) d.to(+b.dataset.i); });
hTop.addEventListener("click", ()=>zoomStep(S.pane===2 ? (S.mode==="passage"?-1:1) : (S.mode==="origin"?1:-1)));
hLeft.addEventListener("click", ()=>setPane(S.pane-1));
hRight.addEventListener("click", ()=>setPane(S.pane+1));
window.addEventListener("resize", ()=>{ fit(); dAl.layout(); dPt.layout(); dOt.layout(); dAr.layout(); });
window.addEventListener("keydown", e=>{
  if(loupeOpen()){ if(e.key==="Escape"){ e.preventDefault(); closeLoupe(); } return; }
  if(S.edit>=0||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==="Escape"){ back(); return; }
  if(e.target.closest&&e.target.closest("button,.lib-item")&&(e.key===" "||e.key==="Enter")) return;
  const d=verticalDrum();
  if((e.key==="ArrowDown"||e.key==="PageDown")&&d){ e.preventDefault(); d.to(Math.round(d.raw)+1); } // depuis la cible : deux appuis rapides = deux crans
  else if((e.key==="ArrowUp"||e.key==="PageUp")&&d){ e.preventDefault(); d.to(Math.round(d.raw)-1); }
  else if(e.key==="ArrowRight") setPane(S.pane+1);
  else if(e.key==="ArrowLeft") setPane(S.pane-1);
  else if(e.key==="Enter"&&S.pane>=0) zoomStep(1);
  else if(e.key==="-") zoomStep(-1);
  else if(e.key==="+"||e.key==="=") zoomStep(1);
});

/* ---------- Gestes : doigt ou souris ---------- */
// un doigt : vertical = la pile en cours (dans un article, le texte d'abord), horizontal = volet voisin ;
// deux doigts qui se rapprochent = dézoomer, qui s'écartent = zoomer
const touches=new Map(); let g=null, pinch=null, suppressClick=false;
const dist=()=>{ const [a,b]=[...touches.values()]; return Math.hypot(a.x-b.x,a.y-b.y); };
stage.addEventListener("pointerdown", e=>{
  suppressClick=false;
  touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size===2){ if(g&&g.axis==="v"&&g.drum) g.drum.snap(g.start,0); g=null; const mk=e.target.closest("mark.pt"); pinch={d0:dist()||1,done:false,k:mk?mk.dataset.k:null}; return; }
  if(touches.size>1) return;
  if(e.target.closest(".handle,.rail,button,textarea,.units,.loupe")) return;
  if(S.edit>=0&&e.target.closest(".face.editing")) return;
  g={id:e.pointerId,x:e.clientX,y:e.clientY,axis:null,ly:e.clientY,lt:performance.now(),v:0};
});
stage.addEventListener("pointermove", e=>{
  const t=touches.get(e.pointerId); if(t){ t.x=e.clientX; t.y=e.clientY; }
  if(pinch){ if(touches.size>=2&&!pinch.done){ const r=dist()/pinch.d0; if(r<.78){ pinch.done=true; zoomStep(-1); } else if(r>1.28){ pinch.done=true; zoomStep(1,pinch.k); } } return; }
  if(!g||e.pointerId!==g.id) return;
  const dx=e.clientX-g.x, dy=e.clientY-g.y;
  if(!g.axis){
    if(Math.abs(dx)+Math.abs(dy)<8) return;
    g.axis=Math.abs(dy)>Math.abs(dx)?"v":"h";
    if(g.axis==="v"){
      const el=nestedEl();
      if(el&&canScroll(el,-dy)){ g.scrollEl=el; g.scroll0=el.scrollTop+dy; }
      else { g.drum=verticalDrum(); if(!g.drum){ g=null; return; } g.start=g.drum.begin(); g.from=g.drum.pos; }
    }
    suppressClick=true;
    try{ stage.setPointerCapture(e.pointerId); }catch(_){}
  }
  if(g.axis==="h"){ if(dx<-50){ setPane(S.pane+1); g=null; } else if(dx>50){ setPane(S.pane-1); g=null; } return; }
  if(g.scrollEl){ g.scrollEl.style.scrollBehavior="auto"; g.scrollEl.scrollTop=g.scroll0-dy; return; }
  const now=performance.now(), sp=g.drum.step();
  g.drum.dragTo(g.from,-dy);
  const dt=Math.max(1,now-g.lt); g.v=.7*g.v+.3*(-(e.clientY-g.ly)/sp)/(dt/1000); g.ly=e.clientY; g.lt=now;
});
function pointerEnd(e){
  touches.delete(e.pointerId);
  if(pinch){ if(touches.size<2) pinch=null; return; }
  if(g&&e.pointerId===g.id){ if(g.scrollEl) g.scrollEl.style.scrollBehavior=""; else if(g.axis==="v") g.drum.snap(g.start,g.v); g=null; }
}
stage.addEventListener("pointerup",pointerEnd); stage.addEventListener("pointercancel",pointerEnd);
stage.addEventListener("click", e=>{ if(suppressClick){ suppressClick=false; e.stopPropagation(); e.preventDefault(); } }, true);

/* ---------- Gestes : pavé tactile ---------- */
// Pincer arrive en « wheel » avec ctrlKey (Chrome, Edge, Firefox) ou en gesture* (Safari) : un cran par geste.
// Deux doigts : le sens est verrouillé au début du geste ; une liste qui défile garde son défilement ;
// dans un article, un geste commencé dans le texte reste dans le texte, le suivant passe à la version voisine.
let zw=null, zwT=0, wg=null, wgT=0;
const scrollsY=el=>el&&el.scrollHeight>el.clientHeight+1, scrollsX=el=>el&&el.scrollWidth>el.clientWidth+1;
stage.addEventListener("wheel", e=>{
  const kf=e.deltaMode===1?16:e.deltaMode===2?innerHeight:1, dx=e.deltaX*kf, dy=e.deltaY*kf;
  if(loupeOpen()){ e.preventDefault(); return; }
  if(e.ctrlKey){
    e.preventDefault();
    if(!zw){ const mk=e.target.closest("mark.pt"); zw={acc:0,done:false,k:mk?mk.dataset.k:null}; }
    zw.acc+=dy;
    if(!zw.done){ if(zw.acc>24){ zw.done=true; zoomStep(-1); } else if(zw.acc<-24){ zw.done=true; zoomStep(1,zw.k); } }
    clearTimeout(zwT); zwT=setTimeout(()=>{ zw=null; },220);
    return;
  }
  if(e.target.closest("textarea")) return;
  const vertical=Math.abs(dy)>=Math.abs(dx);
  if(vertical&&!(wg&&wg.axis==="h")&&scrollsY(e.target.closest(".orig .body,.lib-list,.main-art,.pane-cmp .burst-scroll"))) return;
  if(!vertical&&!(wg&&wg.axis==="v")&&scrollsX(e.target.closest(".units,.burst-scroll"))) return;
  if(vertical&&(!wg||wg.native)){ // le texte d'un article défile avant que la pile ne tourne
    const el=nestedEl();
    if(el&&(wg&&wg.native||canScroll(el,dy))){
      if(!wg) wg={axis:"v",native:true};
      clearTimeout(wgT); wgT=setTimeout(endWheel,150);
      if(!canScroll(el,dy)) e.preventDefault();
      return;
    }
  }
  e.preventDefault();
  if(!wg) wg={ax:0,ay:0,axis:null,done:false,h:0};
  clearTimeout(wgT); wgT=setTimeout(endWheel,150);
  let ddx=dx, ddy=dy;
  if(!wg.axis){
    wg.ax+=dx; wg.ay+=dy;
    if(Math.abs(wg.ax)+Math.abs(wg.ay)<6) return;
    wg.axis=Math.abs(wg.ax)>Math.abs(wg.ay)?"h":"v"; ddx=wg.ax; ddy=wg.ay;
    if(wg.axis==="v"){ wg.drum=verticalDrum(); if(wg.drum) wg.start=wg.drum.begin(); }
  }
  if(wg.axis==="h"){
    if(wg.done) return; wg.h+=ddx;
    if(wg.h>90){ setPane(S.pane+1); wg.done=true; } else if(wg.h<-90){ setPane(S.pane-1); wg.done=true; }
    return;
  }
  if(wg.drum) wg.drum.move(ddy);
}, {passive:false});
function endWheel(){ if(wg&&!wg.native&&wg.axis==="v"&&wg.drum) wg.drum.snap(wg.start,0); wg=null; }
let sg=null;
stage.addEventListener("gesturestart", e=>{ e.preventDefault(); sg=pinch?null:{done:false}; });
stage.addEventListener("gesturechange", e=>{ e.preventDefault(); if(!sg||sg.done) return; if(e.scale<.85){ sg.done=true; zoomStep(-1); } else if(e.scale>1.18){ sg.done=true; zoomStep(1); } });
stage.addEventListener("gestureend", e=>{ e.preventDefault(); sg=null; });

/* ---------- Départ ---------- */
for(const [k,el] of Object.entries(PANE_EL)) el.style.setProperty("--rel",+k);
dAl.set(AMEND.map((_,i)=>alFace(i)),0);
setMode("alinea");
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ dAl.layout(); dPt.layout(); dOt.layout(); dAr.layout(); });
})();
</script>

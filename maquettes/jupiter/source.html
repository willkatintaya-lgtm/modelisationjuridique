<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boussole · inspiration Jupiter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Jetons relevés sur jup.ag (Tailwind/shadcn, oklch convertis) : surfaces en niveaux, accent unique vert citron */
:root{
  --bg:#090d10; --card:#0d151e; --big:#151e28; --bd:#19242e; --bd2:#212a36;
  --elev:rgba(226,232,240,.04); --elev2:rgba(226,232,240,.06);
  --t:#e2e8f0; --t2:#cad5e2; --t3:#90a1b9; --t4:#67778e;
  --acc:#acf47d; --acc-ink:#090d10; --acc10:rgba(172,244,125,.10); --acc5:rgba(172,244,125,.05); --acc20:rgba(172,244,125,.20);
  --a1:#a1c56e; --a2:#698453; --a3:#415337; --a4:#2e3c2c; --a5:#1b2621;
  --up:#3ce3ab; --down:#f23674; --ok:#35d399; --err:#fb7185; --warn:#fbbf25; --info:#38bdf8;
  --ease:cubic-bezier(.22,1,.36,1); --navw:224px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:400 14px/20px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sm svg,svg.sm{width:16px;height:16px}
kbd{font:500 11px/1 Inter,sans-serif;color:var(--t3);background:var(--bd2);border-radius:4px;padding:3px 5px;display:inline-block}

/* ---------- squelette : nav 224 | barre du haut 56 + bandeau 31 + contenu ---------- */
#app{display:grid;height:100%;grid-template-columns:var(--navw) minmax(0,1fr);grid-template-rows:56px 31px minmax(0,1fr);
  grid-template-areas:"nav top" "nav tick" "nav main";transition:grid-template-columns .28s var(--ease)}
#app.rail{--navw:56px}
#nav{grid-area:nav;border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;background:var(--bg);z-index:30}
#nav .brand{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;flex:none}
#nav .brand .mk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--acc);flex:none}
#nav .brand .mk svg{width:24px;height:24px}
#nav .brand b{font-weight:600;font-size:16px;white-space:nowrap}
#nav .brand .tg{margin-left:auto;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--t3)}
#nav .brand .tg:hover{background:var(--elev);color:var(--t)}
#nav .scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 8px 12px;scrollbar-width:none}
#nav .scroll::-webkit-scrollbar{display:none}
.nsec{font:500 12px/16px Inter;color:var(--t4);padding:14px 10px 6px;white-space:nowrap;height:36px}
.nit{display:flex;align-items:center;gap:12px;height:36px;padding:0 10px;border-radius:6px;color:var(--t3);font:500 14px/20px Inter;white-space:nowrap;width:100%;text-align:left}
.nit:hover{background:var(--elev);color:var(--t)}
.nit.on{background:var(--elev2);color:var(--t)}
.nit .bd{font:500 10px/14px Inter;padding:1px 6px;border-radius:99px;background:var(--bd2);color:var(--t3)}
.nit .bd.g{background:var(--acc10);color:var(--acc)}
#app.rail .nsec{font-size:0;padding:0 10px;height:17px;position:relative}
#app.rail .nsec::after{content:"";position:absolute;left:10px;right:10px;top:8px;border-top:1px solid var(--bd2)}
#app.rail .nit span,#app.rail .brand b{opacity:0}
#app.rail .brand .tg{position:absolute;left:14px;top:60px;display:none}
#nav .foot{border-top:1px solid var(--bd);padding:8px}

#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--bd);min-width:0}
#top .burger{display:none;width:36px;height:36px;border-radius:50%;place-items:center;color:var(--t2)}
#search{width:448px;max-width:100%;height:36px;border-radius:99px;background:rgba(25,36,46,.4);border:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;color:var(--t3);font-size:13px;flex:0 1 auto;min-width:0}
#search:hover{border-color:var(--bd2);color:var(--t2)}
#search span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#search svg{width:16px;height:16px}
#top .sp{flex:1}
.round{width:36px;height:36px;border-radius:50%;background:var(--bd2);display:grid;place-items:center;color:var(--t2);flex:none}
.round:hover{background:#2a3442;color:var(--t)}
.round svg{width:18px;height:18px}
.pill-g{height:36px;border-radius:99px;background:var(--acc10);color:var(--acc);font:600 13px/1 Inter;padding:0 14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.pill-g:hover{background:var(--acc20)}

#tick{grid-area:tick;border-bottom:1px solid var(--bd);display:flex;align-items:center;font-size:12px;min-width:0;overflow:hidden}
#tick .lbl{flex:none;padding:0 12px 0 16px;color:var(--t4);font-weight:500;border-right:1px solid var(--bd);height:100%;display:flex;align-items:center;gap:6px}
#tick .track{flex:1;overflow:hidden;position:relative;height:100%;-webkit-mask:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
#tick .run{display:flex;gap:22px;align-items:center;height:100%;white-space:nowrap;animation:tick 120s linear infinite;width:max-content;padding-left:16px}
#tick .track:hover .run{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){#tick .run{animation:none}}
.ti{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--t)}
.ti b{font-weight:600}
.ti .v{color:var(--t3)}
.ti .up{color:var(--up)} .ti .dn{color:var(--down)} .ti .fl{color:var(--t4)}
#tick .plus{flex:none;width:31px;height:31px;display:grid;place-items:center;color:var(--t3);border-left:1px solid var(--bd)}

#main{grid-area:main;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:thin;scrollbar-color:var(--bd2) transparent}
#main::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 40% at 55% 0%,rgba(172,244,125,.05),transparent 70%),radial-gradient(circle,rgba(241,245,249,.15) 1px,transparent 1px) 0 0/22px 22px;
  -webkit-mask:linear-gradient(180deg,#000,transparent 500px);mask:linear-gradient(180deg,#000,transparent 500px);opacity:.55}
#view{position:relative;z-index:1;padding:32px 24px 96px}
#tabbar{display:none}

/* ---------- composants ---------- */
.card{background:var(--card);border-radius:16px;box-shadow:inset 0 0 0 1px var(--bd)}
.card-h{display:flex;align-items:center;gap:8px;padding:16px 16px 8px}
.card-h h3{margin:0;font:600 16px/22px Inter}
.card-h .sp{flex:1}
.muted{color:var(--t3)} .faint{color:var(--t4)}
.g{color:var(--acc)}
.tp{display:flex;gap:4px;flex-wrap:wrap}
.tp button{height:32px;padding:0 14px;border-radius:99px;color:var(--t3);font-weight:500;white-space:nowrap}
.tp button:hover{color:var(--t);background:var(--elev)}
.tp button.on{background:var(--acc5);color:var(--acc)}
.tl{display:flex;gap:22px;border-bottom:1px solid var(--bd);padding:0 16px;overflow-x:auto;scrollbar-width:none}
.tl::-webkit-scrollbar{display:none}
.tl button{height:42px;color:var(--t3);font-weight:500;position:relative;white-space:nowrap}
.tl button:hover{color:var(--t)}
.tl button.on{color:var(--t)}
.tl button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--acc);border-radius:2px}
.chip{height:28px;padding:0 10px;border-radius:99px;background:var(--elev);color:var(--t2);font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{background:var(--elev2);color:var(--t)}
.chip.g{color:var(--acc)}
.chip svg{width:14px;height:14px}
.btn-main{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border-radius:16px;background:var(--acc);color:var(--acc-ink);font:600 18px/1 Inter}
.btn-main:hover{filter:brightness(1.06)}
.btn-main kbd{background:rgba(9,13,16,.14);color:var(--acc-ink)}
.btn-sec{height:40px;border-radius:99px;background:var(--acc10);color:var(--acc);font-weight:600;padding:0 16px;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}
.btn-sec:hover{background:var(--acc20)}
.btn-ghost{height:40px;border-radius:99px;background:var(--bd2);color:var(--t2);font-weight:500;padding:0 16px;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}
.btn-ghost:hover{color:var(--t);background:#2a3442}
.bdg{font:500 10px/14px Inter;padding:1px 6px;border-radius:99px;background:var(--bd2);color:var(--t3);white-space:nowrap;display:inline-block}
.bdg.g{background:var(--acc10);color:var(--acc)}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 11px/1 Inter;color:#0b0f14;background:var(--c,#556);letter-spacing:-.2px}
.av.lg{width:40px;height:40px;font-size:13px}
.av.sm{width:22px;height:22px;font-size:9px}
.av.me{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--acc)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.s-adopte{color:var(--up)} .s-rejete{color:var(--down)} .s-tombe,.s-ns,.s-ecarte{color:var(--t4)} .s-retire{color:var(--warn)} .s-attente{color:var(--info)}
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(172,244,125,.07) 45%,transparent 60%);background-size:250% 100%;animation:shine 5s linear infinite}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.shine::after{animation:none}}
.toggle{width:40px;height:24px;border-radius:99px;background:var(--bd2);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--t3);transition:transform .2s var(--ease),background .2s}
.toggle.on{background:var(--a4)}
.toggle.on::after{transform:translateX(16px);background:var(--acc)}
.search-in{height:40px;border-radius:99px;background:var(--big);box-shadow:inset 0 0 0 1px var(--bd);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--t3)}
.search-in input{background:none;border:0;outline:0;flex:1;min-width:0;color:var(--t);font-size:14px}
.search-in svg{width:16px;height:16px}
.row{display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 14px;border-radius:12px;background:var(--big);cursor:pointer;text-align:left;width:100%}
.row:hover{background:#1a2430}
.row.on{box-shadow:inset 0 0 0 1px var(--a3);background:#18232b}
.row .tx{flex:1;min-width:0}
.row .t1{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .t2{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-size:12px;flex:none}
.rows{display:flex;flex-direction:column;gap:6px}
.ib{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--t3);flex:none}
.ib:hover{background:var(--elev2);color:var(--t)}
.ib.on{color:var(--acc);background:var(--acc10)}
.ib svg{width:16px;height:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px}
.kv dt{color:var(--t3)} .kv dd{margin:0;text-align:right;color:var(--t)}
.empty{color:var(--t4);padding:18px;text-align:center;font-size:13px}
.hl2{color:var(--acc)}

/* ---------- textes juridiques : corrections apparentes ---------- */
.legal{font:400 15px/26px Inter;color:var(--t2);max-width:68ch;overflow-wrap:break-word}
.legal.lg{font-size:16px;line-height:27px}
ins{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;color:var(--acc);background:var(--acc5);font-weight:600;border-radius:2px}
del{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--err);opacity:.85}
ins[data-h],del[data-h]{cursor:zoom-in}
mark.pt{background:rgba(251,191,37,.07);color:inherit;border-bottom:1.5px dashed rgba(251,191,37,.55);cursor:pointer;border-radius:2px}
mark.pt.w2{background:rgba(251,191,37,.12)} mark.pt.w3{background:rgba(251,191,37,.18);border-bottom-style:solid}
mark.pt:hover{background:rgba(251,191,37,.24)}
.nomarks mark.pt{background:none;border-bottom:0;cursor:inherit}
.delpt{display:inline-block;width:0;height:1.1em;box-shadow:-1px 0 0 1px var(--err);vertical-align:-3px}

/* ---------- l'atelier : trois colonnes, carte de swap au centre ---------- */
.cols3{display:grid;grid-template-columns:minmax(200px,256px) minmax(0,516px) minmax(210px,259px);gap:24px;justify-content:center;align-items:start}
.cols3>aside{position:sticky;top:0;display:flex;flex-direction:column;gap:16px}
.mid{display:flex;flex-direction:column;gap:16px;min-width:0}
.annonce{height:88px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1px var(--bd);display:flex;align-items:center;gap:14px;padding:0 44px 0 14px;position:relative;cursor:pointer}
.annonce .ic{width:56px;height:56px;border-radius:12px;background:linear-gradient(145deg,var(--a4),var(--a5));display:grid;place-items:center;color:var(--acc);flex:none;font:700 18px/1 Inter}
.annonce b{display:block;font-weight:600;font-size:15px;line-height:20px}
.annonce small{color:var(--t3);font-size:12px;line-height:16px;display:block;margin-top:2px}
.annonce .x{position:absolute;right:10px;top:10px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:-6px}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--bd2);cursor:pointer;transition:width .2s}
.dots i.on{width:16px;background:var(--t2)}
.swap{border-radius:32px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--bd2);padding:16px}
.swap-h{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.swap-h .sp{flex:1}
.blk{border-radius:16px;padding:16px;position:relative}
.blk.full{background:var(--big)}
.blk.hollow{box-shadow:inset 0 0 0 1px var(--bd2);min-height:120px}
.blk-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;min-height:40px;flex-wrap:wrap}
.blk-h .lab{font-weight:500;color:var(--t2)}
.blk-h .lab small{display:block;color:var(--t4);font-size:12px;font-weight:400;line-height:16px}
.blk-h .sp{flex:1}
.tok{height:40px;border-radius:99px;background:var(--bd2);display:inline-flex;align-items:center;gap:8px;padding:0 10px 0 5px;font:600 14px/1 Inter;color:var(--t);white-space:nowrap;max-width:100%}
.tok:hover{background:#2a3442}
.tok .av{width:30px;height:30px}
.tok .chev{color:var(--t3);width:16px;height:16px}
.tok.noav{padding-left:14px}
.seam{height:4px;position:relative;z-index:2}
.flip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;background:var(--big);border:3px solid var(--bg);display:grid;place-items:center;color:var(--t2)}
.flip:hover{color:var(--acc)}
.flip svg{width:16px;height:16px}
.units{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.units .chip{max-width:100%}
.units .chip span{overflow:hidden;text-overflow:ellipsis}
.units .chip b{color:var(--warn);font-weight:600}
.opt{display:flex;align-items:center;gap:10px;padding:14px 2px;color:var(--t2);font-size:14px;cursor:pointer}
.opt u{text-decoration-style:dashed;text-decoration-color:var(--t4);text-underline-offset:4px}
.opt .sp{flex:1}
.btn-row{display:flex;gap:8px}
.btn-row .btn-main{flex:1}
.btn-row .btn-ghost{height:58px;border-radius:16px;padding:0 18px}
.refclamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.refclamp.open{display:block}
.m-show{display:none}
.edit{position:relative}
.edit .mirror,.edit textarea{font:400 15px/26px Inter;padding:0;margin:0;border:0;width:100%;white-space:pre-wrap;overflow-wrap:break-word;letter-spacing:normal}
.edit .mirror{position:absolute;inset:0;color:transparent;pointer-events:none}
.edit .mirror ins{color:transparent;background:var(--acc5);text-decoration-color:var(--acc);font-weight:400}
.edit textarea{position:relative;background:transparent;color:var(--t);outline:0;resize:none;display:block;min-height:120px;caret-color:var(--acc)}
.edit-wrap{border-radius:12px;box-shadow:inset 0 0 0 1px var(--a3);padding:12px;background:rgba(172,244,125,.02)}
.hint{font-size:12px;color:var(--t4);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{height:68px;border-radius:16px;padding:0 14px;display:flex;align-items:center;gap:12px;background:linear-gradient(145deg,#111b25,#0b1219);box-shadow:inset 0 0 0 1px var(--bd);cursor:pointer;min-width:0}
.tcard:hover{box-shadow:inset 0 0 0 1px var(--bd2)}
.tcard .tx{flex:1;min-width:0}
.tcard b{font-weight:600;display:block}
.tcard small{color:var(--t3);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .n{font:600 16px/20px Inter;text-align:right}
.chev2{display:grid;place-items:center;color:var(--acc);height:24px}
.sect-h{display:flex;align-items:center;gap:10px;margin:8px 2px 10px}
.sect-h h2{margin:0;font:600 16px/22px Inter}
.sect-h .sp{flex:1}
.filters{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.filters .search-in{flex:1;min-width:180px}
.promo{padding:16px;display:flex;flex-direction:column;gap:10px}
.promo h3{margin:0;font:600 15px/20px Inter;text-align:center}
.promo .lead{text-align:center;color:var(--t3);font-size:13px;margin-top:-4px}
.drow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer}
.drow:hover{background:var(--elev)}
.drow.on{background:var(--elev2)}
.drow .tx{flex:1;min-width:0}
.drow b{font-weight:600;display:block;font-size:13px}
.drow small{color:var(--t3);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--a5);color:var(--acc);font:700 12px/1 Inter}
.mode-ic.d{background:rgba(251,113,133,.12);color:var(--err)}
.mode-ic.i{background:rgba(56,189,248,.12);color:var(--info)}
.coffre{display:flex;flex-direction:column;gap:8px;padding:0 16px 16px}
.slot{height:44px;border-radius:12px;border:1px dashed var(--bd2);display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;color:var(--t4);font-size:13px}
.slot.full{border:0;background:var(--big);color:var(--t)}
.slot .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glance{padding:0 16px 16px;display:flex;flex-direction:column;gap:2px}
.glance .ln{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:13px;color:var(--t3)}
.glance .ln b{color:var(--t);font-weight:600}
.links{display:flex;flex-direction:column;gap:6px;padding:0 16px 16px}
.links .btn-ghost{justify-content:flex-start;width:100%;height:38px}

/* ---------- comparer : une | la référence | l'autre ---------- */
.cmp-wrap{max-width:1180px;margin:0 auto}
.cmp-slots{display:flex;align-items:center;gap:10px;justify-content:center;margin:18px 0 22px;flex-wrap:wrap}
.cmp-slots .flip{position:static;transform:none;background:var(--bd2);border:0;width:36px;height:36px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto auto auto;gap:0 14px}
.col{display:grid;grid-row:span 3;grid-template-rows:subgrid;border-radius:16px;padding:16px;gap:12px}
.col.full{background:var(--big)}
.col.hollow{box-shadow:inset 0 0 0 1px var(--bd2)}
.col .ch{display:flex;align-items:center;gap:10px}
.col .ch b{display:block;font-weight:600}
.col .ch small{display:block;color:var(--t3);font-size:12px}
.col .foot{font-size:12px;color:var(--t3);border-top:1px solid var(--bd);padding-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---------- pages « portfolio » : héros deux tons, grande recherche, chiffres ---------- */
.hero{text-align:center;max-width:860px;margin:12px auto 0}
.hero h1{font:700 48px/52px Inter;letter-spacing:-1.4px;margin:0}
.hero p{color:var(--t3);margin:14px 0 0;font-size:16px;line-height:24px}
.bigsearch{max-width:760px;height:60px;margin:28px auto 0;border-radius:99px;background:var(--card);box-shadow:inset 0 0 0 1px var(--bd2);display:flex;align-items:center;gap:12px;padding:0 6px 0 22px;color:var(--t3);cursor:text}
.bigsearch span{flex:1;text-align:left;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bigsearch .go{height:48px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font:600 15px/1 Inter;padding:0 22px;display:flex;align-items:center;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:980px;margin:40px auto 0;text-align:center}
.stats .n{font:700 36px/40px Inter;color:var(--acc);letter-spacing:-.8px}
.stats .l{font-weight:500;margin-top:6px}
.stats .s{font-size:12px;color:var(--t4);margin-top:2px}
.wrap{max-width:1152px;margin:0 auto}
.h2row{display:flex;align-items:flex-end;gap:12px;margin:48px 0 14px;flex-wrap:wrap}
.h2row h2{margin:0;font:600 24px/30px Inter;letter-spacing:-.4px}

.h2row .sp{flex:1}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.acard{min-height:88px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1px var(--bd);padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left}
.acard:hover{background:#101a24}
.acard.on{box-shadow:inset 0 0 0 1px var(--a2)}
.acard .num{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,var(--bd2),var(--big));display:grid;place-items:center;font:700 15px/1 Inter;flex:none}
.acard.on .num{background:var(--acc);color:var(--acc-ink)}
.acard .tx{flex:1;min-width:0}
.acard b{display:block;font-weight:600}
.acard small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--t3);font-size:12px;line-height:16px}
.acard .n{font:600 16px/1 Inter;text-align:right}
.acard .n small{display:block;font-weight:400;color:var(--t4);margin-top:4px;font-size:11px}
.grid-et{border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1px var(--bd);overflow:hidden}
.ge-h,.ge-r{display:grid;grid-template-columns:48px repeat(4,92px) minmax(0,1fr) 64px;align-items:center;gap:8px;padding:0 16px}
.ge-h{height:40px;font:500 12px/16px Inter;color:var(--t4);border-bottom:1px solid var(--bd)}
.ge-r{min-height:52px;cursor:pointer;border-bottom:1px solid var(--bd)}
.ge-r:last-child{border-bottom:0}
.ge-r:hover{background:var(--elev)}
.ge-r.on{background:var(--elev2)}
.ge-r .o{font-weight:600}
.ge-r .tx{font-size:13px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{height:22px;border-radius:99px;font:500 11px/22px Inter;text-align:center;color:var(--t4)}
.cell.mod{background:var(--acc10);color:var(--acc)}
.cell.origine{box-shadow:inset 0 0 0 1px var(--bd2);color:var(--t3)}
.cell.absent{color:var(--bd2)}
.ge-r .n{text-align:right}

/* ---------- enjeux ---------- */
.thpills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:32px 0 18px;-webkit-mask:linear-gradient(90deg,#000 calc(100% - 30px),transparent)}
.thpills::-webkit-scrollbar{display:none}
.thpills button{height:36px;border-radius:99px;padding:0 14px;background:var(--elev);color:var(--t3);white-space:nowrap;font-weight:500;display:flex;gap:8px;align-items:center}
.thpills button:hover{color:var(--t)}
.thpills button.on{background:var(--acc10);color:var(--acc)}
.en-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,500px);gap:16px;align-items:start}
.strate{padding:4px 16px 16px}
.strate h4{margin:0 0 8px;font:500 12px/16px Inter;color:var(--t4);letter-spacing:.2px}
.strate+.strate{border-top:1px solid var(--bd);padding-top:16px}
.quote{border-left:2px solid var(--a3);padding:2px 0 2px 12px;color:var(--t2)}
.parole{padding:10px 12px;border-radius:12px;background:var(--big);margin-top:6px;font-size:13px;line-height:20px;color:var(--t2)}
.parole .w{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--t3);margin-bottom:4px}
.mx{width:100%;border-collapse:separate;border-spacing:3px;font-size:12px}
.mx th{font-weight:500;color:var(--t4);padding:4px;text-align:center}
.mx th.l{text-align:left}
.mx td{height:30px;text-align:center;border-radius:6px;font-weight:600;cursor:pointer;background:rgba(172,244,125,var(--v,0));color:var(--t)}
.mx td.l{text-align:left;background:none;font-weight:500;color:var(--t2);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.mx tr.on td.l{color:var(--acc)}
.mx td:empty{background:var(--elev)}

/* ---------- réunion : terminal trois colonnes ---------- */
.term{display:grid;grid-template-columns:280px minmax(0,1fr) 384px;height:100%;border-top:0}
#view.full{padding:0;height:100%}
.tcol{min-height:0;overflow-y:auto;scrollbar-width:none}
.tcol::-webkit-scrollbar{display:none}
.tl-left{border-right:1px solid var(--bd);display:flex;flex-direction:column}
.tl-left .hd{padding:12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:2}
.tl-left .lh{display:flex;justify-content:space-between;padding:8px 12px;font-size:11px;color:var(--t4)}
.prow{display:flex;gap:12px;align-items:center;min-height:72px;padding:10px 12px;cursor:pointer;border-left:2px solid transparent}
.prow:hover{background:var(--elev)}
.prow.on{background:var(--elev2);border-left-color:var(--acc)}
.prow .pn{width:32px;height:32px;border-radius:50%;background:var(--bd2);display:grid;place-items:center;font:600 12px/1 Inter;flex:none}
.prow.ad .pn{background:var(--acc);color:var(--acc-ink)}
.prow .tx{flex:1;min-width:0}
.prow .t1{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .t2{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.prow .r{text-align:right;font-size:12px}
.prow .r b{display:block;font-weight:600;font-size:13px;color:var(--t)}
.tc-center{display:flex;flex-direction:column;min-width:0}
.tc-center>*,.tl-left>*,.tc-right>*{flex:none}
.mkt{display:flex;align-items:center;gap:22px;padding:10px 16px;border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none;min-height:56px}
.mkt::-webkit-scrollbar{display:none}
.mkt .sym{display:flex;align-items:center;gap:10px;font:600 16px/1 Inter;white-space:nowrap}
.mkt .st{font-size:12px;color:var(--t3);white-space:nowrap}
.mkt .st b{display:block;font:500 14px/18px Inter;color:var(--t)}
.bande{padding:14px 16px 8px;border-bottom:1px solid var(--bd)}
.bande .bh{display:flex;justify-content:space-between;font-size:12px;color:var(--t4);margin-bottom:8px}
.bars{display:flex;gap:2px;height:64px;align-items:flex-end}
.bars i{display:block;height:100%;background:var(--bd2);border-radius:3px 3px 0 0;cursor:pointer;position:relative;min-width:3px}
.bars i.ad{background:var(--a2)}
.bars i:hover{background:var(--t4)}
.bars i.ad:hover{background:var(--a1)}
.bars i.on{background:var(--acc)}
.bars i.on:not(.ad){background:var(--t2)}
.bnums{display:flex;gap:2px;font-size:10px;color:var(--t4);margin-top:4px}
.bnums span{text-align:center;overflow:hidden;min-width:3px}
.vote{width:100%;border-collapse:collapse;font-size:13px}
.vote th{font:500 12px/16px Inter;color:var(--t4);text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
.vote td{padding:12px;border-bottom:1px solid var(--bd);vertical-align:top}
.vote tr{cursor:pointer}
.vote tbody tr:hover{background:var(--elev)}
.vote tr.on{background:var(--elev2)}
.vote .who{display:flex;gap:8px;align-items:center;white-space:nowrap}
.vote .ob{color:var(--t3);max-width:420px;min-width:200px}
.feed{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.tc-right{border-left:1px solid var(--bd);padding:12px;display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:10px;padding:4px;gap:4px;box-shadow:inset 0 0 0 1px var(--bd)}
.seg button{height:36px;border-radius:7px;color:var(--t3);font-weight:500;font-size:13px}
.seg button.on{background:var(--a4);color:var(--acc)}
.amfield{border-radius:16px;box-shadow:inset 0 0 0 1px var(--bd2);padding:14px}
.amfield .lab{font-size:12px;color:var(--t3);margin-bottom:8px;display:flex;justify-content:space-between}

/* ---------- modale (sélecteur) ---------- */
#scrim{position:fixed;inset:0;background:rgba(9,13,16,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:80;display:none}
#modal{position:fixed;left:50%;top:16px;transform:translateX(-50%);width:448px;max-width:calc(100vw - 24px);max-height:min(720px,calc(100vh - 32px));z-index:90;display:none;flex-direction:column;
  background:var(--card);border-radius:12px;box-shadow:inset 0 0 0 1px var(--bd2),0 10px 15px -3px rgba(0,0,0,.4),0 4px 6px -4px rgba(0,0,0,.4);overflow:hidden}
#modal.wide{width:620px}
#modal.on,#scrim.on{display:flex}
.m-in{display:flex;align-items:center;gap:10px;height:52px;padding:0 10px 0 16px;border-bottom:1px solid var(--bd);color:var(--t3);flex:none}
.m-in input{flex:1;background:none;border:0;outline:0;color:var(--t);font-size:14px;min-width:0}
.m-in svg{width:16px;height:16px}
.m-sc{display:flex;gap:8px;padding:12px 10px 4px;overflow-x:auto;scrollbar-width:none;flex:none}
.m-sc::-webkit-scrollbar{display:none}
.m-sc button{height:36px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--bd2);padding:0 12px 0 4px;display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:12px;font-weight:600}
.m-sc button .av{width:28px;height:28px}
.m-sc button:hover{background:var(--elev)}
.m-tabs{padding:8px 10px;flex:none}
.m-list{overflow-y:auto;scrollbar-width:none;flex:1;min-height:0}
.m-list::-webkit-scrollbar{display:none}
.mrow{display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 16px;cursor:pointer}
.mrow:hover,.mrow.on{background:var(--elev2)}
.mrow .tx{flex:1;min-width:0}
.mrow .t1{font-weight:600;display:flex;align-items:center;gap:6px}
.mrow .t1 .ck{color:var(--acc);width:14px;height:14px}
.mrow .t2{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .r{font-size:12px;color:var(--t3);text-align:right;flex:none}
.m-body{overflow-y:auto;padding:0 16px 16px;scrollbar-width:none;flex:1;min-height:0}
.m-body::-webkit-scrollbar{display:none}
.m-head{display:flex;align-items:center;gap:12px;padding:16px;flex:none;border-bottom:1px solid var(--bd)}
.m-head .tx{flex:1;min-width:0}
.m-head b{display:block;font:600 16px/22px Inter}
.m-head small{display:block;color:var(--t3);font-size:12px}
.m-act{display:flex;gap:8px;padding:12px 16px 16px;flex:none;flex-wrap:wrap;border-top:1px solid var(--bd)}
.m-act .btn-main{height:48px;font-size:16px;flex:1 1 200px;border-radius:14px}
.clu{padding:12px;border-radius:12px;background:var(--big);margin-top:8px}
.clu.ref{background:none;box-shadow:inset 0 0 0 1px var(--bd2)}
.clu .legal{font-size:14px;line-height:23px}
.clu .who{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.etape{padding:12px 0;border-bottom:1px solid var(--bd)}
.etape:last-child{border-bottom:0}
.etape .eh{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;font-weight:600}

/* ---------- loupe ---------- */
#loupe{position:fixed;z-index:95;display:none;width:min(560px,calc(100vw - 24px));background:var(--card);border-radius:12px;box-shadow:inset 0 0 0 1px var(--bd2),0 10px 15px -3px rgba(0,0,0,.5);padding:12px}
#loupe.on{display:block}
#loupe .lh{font-size:12px;color:var(--t4);margin-bottom:8px;display:flex;justify-content:space-between}
#loupe .lc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#loupe .lc>div{border-radius:10px;padding:10px;font-size:14px;line-height:22px}
#loupe .lc>div:first-child{background:var(--big)}
#loupe .lc>div:last-child{box-shadow:inset 0 0 0 1px var(--bd2)}
#loupe .lc small{display:block;font-size:11px;color:var(--t4);margin-bottom:4px}
#loupe .cx{color:var(--t4)}

/* ---------- notifications ---------- */
#toasts{position:fixed;right:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--card);box-shadow:inset 0 0 0 1px var(--bd2),0 10px 15px -3px rgba(0,0,0,.4);border-radius:12px;padding:12px 14px;max-width:360px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.toast .i{color:var(--acc)}

/* ---------- lisez-moi ---------- */
.readme{max-width:760px;margin:0 auto}
.readme h3{font:600 16px/22px Inter;margin:26px 0 8px}
.readme li{margin:6px 0;color:var(--t2);line-height:22px}
.readme p{color:var(--t2);line-height:22px}

/* ---------- adaptations ---------- */
.c-left-alt{display:none!important}
.m-only{display:none!important}
@media (max-width:1360px){ .cols3{grid-template-columns:minmax(0,516px) minmax(220px,259px)} .cols3>.c-left{display:none} .c-left-alt{display:flex!important} }
@media (max-width:1180px){ .term{grid-template-columns:240px minmax(0,1fr) 320px} .en-grid{grid-template-columns:minmax(0,1fr)} }
@media (max-width:1000px){
  .cols3{grid-template-columns:minmax(0,560px)} .cols3>aside{position:static} .c-right{order:2}
  .term{grid-template-columns:1fr;height:auto} #view.full{height:auto} .tl-left{display:none} .tc-right{border-left:0;border-top:1px solid var(--bd)} .tcol{overflow:visible}
  .m-only{display:flex!important}
}
@media (max-width:720px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:56px 31px minmax(0,1fr) 60px;grid-template-areas:"top" "tick" "main" "tabs"}
  #nav{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-100%);transition:transform .28s var(--ease);box-shadow:0 0 0 100vmax rgba(0,0,0,0);z-index:70}
  #app.drawer #nav{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
  #app.rail{--navw:0px} #app.rail .nit span,#app.rail .brand b{opacity:1} #app.rail .nsec{font-size:12px;height:36px;padding:14px 10px 6px}#app.rail .nsec::after{display:none}
  #nav .brand .tg{display:none}
  #top{padding:0 10px;gap:8px} #top .burger{display:grid}
  #search{width:auto;flex:1} #search kbd{display:none} #top .sp{display:none}
  .hide-m{display:none!important} .m-show{display:inline}
  #tabbar{grid-area:tabs;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--bd);background:var(--bg)}
  #tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--t3)}
  #tabbar button.on{color:var(--acc)}
  #view{padding:16px 12px 32px}
  .swap{border-radius:24px;padding:12px}
  .blk{padding:14px}
  .hero h1{font-size:32px;line-height:36px;letter-spacing:-.8px}
  .hero p{font-size:14px}
  .bigsearch{height:52px;padding-left:16px} .bigsearch .go{height:40px;padding:0 14px;font-size:13px}
  .stats{gap:8px;margin-top:24px} .stats .n{font-size:26px;line-height:30px} .stats .l{font-size:12px;line-height:16px} .stats .s{display:none}
  .h2row{margin-top:32px} .h2row h2{font-size:20px}
  .ge-h{display:none}
  .ge-r{grid-template-columns:32px repeat(4,1fr) 36px;padding:8px 12px;row-gap:6px}
  .ge-r .tx{grid-column:1/-1;grid-row:2;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .cell{font-size:0}
  .cell.mod::before{content:"mod.";font-size:10px}
  .cell.origine::before{content:"orig.";font-size:10px}
  .cell.same::before{content:"·";font-size:12px}
  .cols{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -12px;padding:0 12px;scrollbar-width:none}
  .cols::-webkit-scrollbar{display:none}
  .col{flex:0 0 84%;scroll-snap-align:center;display:flex;flex-direction:column}
  .tcards{grid-template-columns:1fr}
  .vote .ob{display:none}
  #modal{top:8px}
  #loupe .lc{grid-template-columns:1fr 1fr}
  #toasts{bottom:72px;left:12px;right:12px;align-items:stretch}
}
</style>
</head>

<div id="app">
  <nav id="nav" aria-label="Navigation"></nav>

    <button class="burger" id="burger" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

</div>

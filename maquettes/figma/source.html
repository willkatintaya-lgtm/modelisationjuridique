<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boussole · inspiration Figma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<!--DA-->
<style>
/* Forme : direction « Le bordereau » (direction-artistique/DA.md, jetons --da-* de da.css).
   La structure reste celle de l'inspiration (Figma UI3) : seules les valeurs ont changé.
   Thème unique, clair : l'interrupteur Clair | Sombre est gardé, ses deux positions affichent le même papier. */
:root,[data-theme="light"],[data-theme="dark"]{
  --bg:var(--da-papier); --bg2:var(--da-papier-2); --bg3:var(--da-papier-ref); --border:var(--da-filet-fort); --text:var(--da-encre); --text2:var(--da-encre-2); --text3:var(--da-encre-3);
  --brand:var(--da-encre); --brandbtn:var(--da-encre); --selbg:var(--da-papier-2); --brandtx:var(--da-encre); --comp:var(--da-dispute); --compbg:var(--da-papier-2);
  --menu:var(--da-papier); --menutx:var(--da-encre); --danger:var(--da-del); --ok:var(--da-encre-2); --warn:var(--da-encre-3); --canvas:var(--da-bureau); --field:var(--da-papier); --dots:#cdc8bc;
  --e100:none; --e500:var(--da-ombre-flottant);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--canvas);color:var(--text);
  font:400 var(--da-t-ui)/var(--da-l-ui) var(--da-f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer;border-radius:0}
:focus-visible{outline:var(--da-focus);outline-offset:2px}
svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter}
svg rect{rx:0}
.mono{font-family:var(--da-f-num);font-weight:700}
b,strong{font-weight:600}
.caps{font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase}

/* ---------- squelette : panneaux ancrés de 240 px, canevas sans barre du haut ---------- */
#app{display:grid;height:100%;grid-template-columns:var(--lw,240px) minmax(0,1fr) var(--rw,240px)}
#app.ui-min{grid-template-columns:0 minmax(0,1fr) 0}
#app.ui-min.has-sel{grid-template-columns:0 minmax(0,1fr) var(--rw,240px)}
#app.ui-hidden{grid-template-columns:0 minmax(0,1fr) 0}
#left,#right{background:var(--bg);display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;z-index:5}
#left{border-right:var(--da-trait) solid var(--da-filet-fort);grid-column:1;grid-row:1}
#canvas{grid-column:2;grid-row:1}
#right{border-left:var(--da-trait) solid var(--da-filet-fort);grid-column:3;grid-row:1}
#app.ui-min #left,#app.ui-hidden #left,#app.ui-hidden #right,#app.ui-min:not(.has-sel) #right{display:none}
.resizer{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:6}
#left .resizer{right:-3px}#right .resizer{left:-3px}
.resizer:hover::after,.resizer.on::after{content:"";position:absolute;left:2px;top:0;bottom:0;width:2px;background:var(--da-encre)}

/* panneau gauche */
.l-head{padding:8px 8px 8px 8px;display:flex;flex-direction:column;gap:2px;flex:none}
.l-top{display:flex;align-items:center;justify-content:space-between;height:32px}
.ibtn{height:24px;min-width:24px;border-radius:0;display:inline-grid;place-items:center;color:var(--da-encre-2);position:relative}
.ibtn:hover{background:var(--bg2);color:var(--da-encre)}
.ibtn.on{background:var(--bg2);color:var(--da-encre);outline:1.5px solid var(--da-encre);outline-offset:-1.5px}
.ibtn svg{width:24px;height:24px}
.ibtn.sm svg{width:16px;height:16px}
.menu-btn{display:flex;align-items:center;gap:0;height:32px;padding:0 4px;border-radius:0;color:var(--da-encre-2)}
.menu-btn:hover{background:var(--bg2)}
.file{padding:4px 8px 6px}
.file .n{font:600 var(--da-t-h)/var(--da-l-h) var(--da-f-loi);display:flex;align-items:center;gap:2px}
.file .n svg{width:16px;height:16px;color:var(--text2)}
.file .s{color:var(--text2);font-size:var(--da-t-s);line-height:var(--da-l-s)}
.l-tabs{display:flex;align-items:center;gap:4px;padding:4px 8px 8px;border-bottom:var(--da-trait-fort) solid var(--da-filet-encre);flex:none}
.tabb{height:24px;padding:0 6px;border-radius:0;color:var(--text3);font:600 10.5px/24px var(--da-f-ui);letter-spacing:.08em;text-transform:uppercase}
.r-tabs .tabb{padding:0 5px;font-size:10px;letter-spacing:.05em}
.tabb:hover{color:var(--text)}
.tabb.on{background:none;color:var(--text);box-shadow:inset 0 -2px 0 var(--da-encre)}
.l-tabs .sp{flex:1}
.l-body{flex:1;overflow:auto;scrollbar-width:none;min-height:0;padding-bottom:16px}
.l-body::-webkit-scrollbar{display:none}
.l-sec{border-bottom:var(--da-trait) solid var(--da-filet-fort);padding:4px 0 8px}
.l-sec:last-child{border-bottom:0}
.sec-h{height:32px;display:flex;align-items:center;gap:2px;padding:0 8px 0 4px;user-select:none;font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3)}
.sec-h .chev{width:16px;height:16px;display:grid;place-items:center;color:var(--text2);cursor:pointer}
.sec-h .chev svg{width:16px;height:16px}
.sec-h .t{flex:1;cursor:pointer}
.closed .chev svg{transform:rotate(-90deg)}
.closed .sec-b{display:none}
.lrow{height:32px;margin:0 8px;padding:0 8px 0 calc(8px + var(--d,0) * 16px);display:flex;align-items:center;gap:6px;border-radius:0;cursor:pointer;white-space:nowrap;color:var(--text)}
.lrow:hover{background:var(--bg2)}
.lrow.on{background:var(--bg2);outline:2px solid var(--da-encre);outline-offset:-2px}
.lrow.on-p{background:var(--bg2);font-weight:600}
.lrow.child-on{background:var(--bg2)}
.lrow .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.lrow .lbl small{color:var(--text3);font-size:var(--da-t-s);margin-left:4px}
.lrow .ic{width:16px;height:16px;display:grid;place-items:center;color:var(--text2);flex:none}
.lrow .ic svg{width:16px;height:16px}
.lrow .tw{width:12px;flex:none;color:var(--text3);display:grid;place-items:center}
.lrow .tw svg{width:12px;height:12px}
.lrow.comp,.lrow.comp .ic{color:var(--da-encre-2)}
.lrow .num{color:var(--text3);font:700 var(--da-t-s)/1 var(--da-f-num)}
.lrow .dot{width:8px;height:8px;border-radius:0;flex:none}
.lrow.pg .emo{width:16px;text-align:center;flex:none}
.lrow.hid{opacity:.45}

/* ---------- canevas : le bureau ---------- */
#canvas{position:relative;overflow:hidden;min-width:0;background:var(--canvas);touch-action:none;cursor:default}
#canvas.figjam{background-color:var(--canvas);background-image:radial-gradient(var(--dots) 1px,transparent 1.1px);background-size:var(--dg,24px) var(--dg,24px);background-position:var(--dx,0) var(--dy,0)}
#canvas.hand,#canvas.hand *{cursor:grab!important}
#canvas.panning,#canvas.panning *{cursor:grabbing!important}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.col{position:absolute;top:0;display:flex;flex-direction:column;gap:80px}
/* cadre = une feuille de papier à filet */
.frame{position:relative;background:var(--da-papier);color:var(--da-encre);box-shadow:0 0 0 var(--da-trait) var(--da-filet-fort);width:var(--w)}
.frame[data-k^="ref:"],.frame[data-k="cmp:ref"]{background:var(--da-papier-ref);box-shadow:0 0 0 var(--da-trait) var(--da-filet-fort),inset 2px 0 0 var(--da-filet-fort)}
.frame[data-k^="draft:"]{box-shadow:0 0 0 var(--da-trait) var(--da-filet-fort),inset 0 2px 0 var(--da-or)}
.frame .flab{position:absolute;left:0;bottom:100%;margin-bottom:6px;display:flex;align-items:center;gap:6px;font:600 10.5px/14px var(--da-f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--da-encre-3);white-space:nowrap;max-width:100%;cursor:default}
.frame .flab .fn{overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.frame .flab .fn:hover{color:var(--da-encre)}
.frame.sel .flab .fn{color:var(--da-encre)}
.frame[data-k^="draft:"] .flab .fn{color:var(--da-bordeaux)}
.frame .flab .ml{margin-left:auto}
.frame.sel,.sticky.sel,.gcell.sel{outline:2px solid var(--da-encre);outline-offset:0}
.frame.msel{outline:2px solid var(--da-encre)}
.frame.hover:not(.sel){outline:1px solid var(--da-encre-3)}
.hd{position:absolute;width:7px;height:7px;background:var(--da-papier);border:1px solid var(--da-encre);display:none;z-index:3}
.sel>.hd{display:block}
.hd.a{left:-4px;top:-4px}.hd.b{right:-4px;top:-4px}.hd.c{left:-4px;bottom:-4px}.hd.d{right:-4px;bottom:-4px}
.dim{position:absolute;left:50%;top:100%;transform:translate(-50%,6px);background:var(--da-papier);color:var(--da-encre);border:var(--da-trait) solid var(--da-encre);font:700 11px/16px var(--da-f-num);padding:0 5px;border-radius:0;white-space:nowrap;display:none}
.sel>.dim{display:block}
.dev .frame.sel,.dev .sticky.sel{outline-style:dashed;outline-color:var(--da-encre)}.dev .sel>.hd{border-style:dashed}.dev .sel>.dim{border-style:dashed}
.section{position:relative;background:transparent;border:var(--da-trait) solid var(--da-filet-fort);border-radius:0;padding:76px 24px 28px;width:var(--w)}
.section>.slab{position:absolute;left:12px;top:12px;height:26px;padding:0 10px;border-radius:0;background:var(--da-papier);color:var(--da-encre);border:var(--da-trait) solid var(--da-encre);font:600 var(--da-t-caps)/24px var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;display:flex;align-items:center;gap:6px;box-shadow:none;max-width:calc(100% - 24px);overflow:hidden;white-space:nowrap}
.section>.slab .n{color:var(--da-encre-3);font:700 var(--da-t-s)/1 var(--da-f-num);letter-spacing:0;text-transform:none}
.section.sel{outline:2px solid var(--da-encre)}
.sgrid{display:grid;grid-template-columns:repeat(var(--c,2),minmax(0,1fr));gap:48px 24px;align-items:start}
.sgrid .frame{width:auto}

/* contenu des cadres : du texte de loi, lisible */
.fb{padding:20px 24px 22px}
.fh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.fh .t{font:600 var(--da-t-titre)/var(--da-l-titre) var(--da-f-loi);color:var(--da-encre)}
.kicker{font-size:var(--da-t-s);line-height:var(--da-l-s);color:var(--da-encre-3)}
.law{font:400 var(--da-t-loi)/var(--da-l-loi) var(--da-f-loi);color:var(--da-encre);max-width:var(--da-mesure);overflow-wrap:break-word}
.law.sm{font-size:var(--da-t-loi-c);line-height:var(--da-l-loi-c)}
.law.ref{color:var(--da-encre)}
.reflab{display:flex;align-items:center;gap:6px;margin:0 0 4px;font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3)}
.reflab .sw{width:8px;height:8px;border-radius:0;border:1px solid var(--da-filet-fort);background:var(--da-papier-ref)}
.refbox{background:var(--da-papier-ref);border:0;border-left:2px solid var(--da-filet-fort);border-radius:0;padding:10px 12px;margin-bottom:16px}
.law ins,.cl .tx ins,#thread .msg .tx ins{color:var(--da-ins);font-weight:600;text-decoration:underline;text-decoration-color:var(--da-ins);text-decoration-thickness:1px;text-underline-offset:3px;background:none;border-radius:0}
.law del,.cl .tx del,#thread .msg .tx del{color:var(--da-del);text-decoration:line-through;text-decoration-color:var(--da-del);text-decoration-thickness:1px;opacity:1}
.law mark.pt{background:none;color:inherit;text-decoration:underline dotted var(--da-dispute);text-decoration-thickness:var(--da-dispute-2);text-underline-offset:5px;cursor:pointer;border-radius:0}
.law mark.pt.w1{text-decoration-thickness:var(--da-dispute-1)}
.law mark.pt.w2{text-decoration-thickness:var(--da-dispute-2)}
.law mark.pt.w3{text-decoration-thickness:var(--da-dispute-3)}
.law mark.pt:hover,.law mark.pt.on{background:var(--da-papier-2)}
.law .ctx{color:var(--da-encre-3)}
.law .live ins,.live.law ins{font-weight:400;background:none;text-decoration:underline var(--da-ins) 1px;color:inherit}
.delpt{display:inline-block;width:2px;height:1em;background:var(--da-del);vertical-align:-2px;margin:0 1px}
.mine-badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0;border-radius:0;background:none;color:var(--da-bordeaux);font:600 var(--da-t-caps)/20px var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase}
/* mentions (ex-pastilles) : capitales espacées, sans couleur */
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:0;background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);color:var(--da-encre-2);font:600 10.5px/16px var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;white-space:nowrap}
.chip.adopte,.chip.rejete,.chip.tombe,.chip.retire,.chip.ns,.chip.ecarte,.chip.attente{background:none;border-color:transparent;padding:0;color:var(--da-encre-3)}
.chip.adopte{color:var(--da-encre)}
.chip.comp{color:var(--da-encre-2)}
/* sorts : filet de marge sur la carte ou la ligne (adopté 4 px plein, rejeté 1 px, tombé pointillé, retiré tireté) */
.frame:has(>.fb>.fh>.chip.adopte:first-child){border-left:var(--da-sort-adopte)}
.frame:has(>.fb>.fh>.chip.rejete:first-child){border-left:var(--da-sort-rejete)}
.frame:has(>.fb>.fh>.chip.tombe:first-child){border-left:var(--da-sort-tombe)}
.frame:has(>.fb>.fh>.chip.retire:first-child){border-left:var(--da-sort-retire)}
.frame:has(>.fb>.fh>.chip.ecarte:first-child) .law{color:var(--da-encre-3)}
table.ft tr:has(.chip.adopte)>td:first-child{border-left:var(--da-sort-adopte)}
table.ft tr:has(.chip.rejete)>td:first-child{border-left:var(--da-sort-rejete)}
table.ft tr:has(.chip.tombe)>td:first-child{border-left:var(--da-sort-tombe)}
table.ft tr:has(.chip.retire)>td:first-child{border-left:var(--da-sort-retire)}
table.ft tr:has(.chip.ecarte)>td{color:var(--da-encre-3)}
/* étiquette multijoueur : flèche d'encre, carré de 8 px du groupe, nom en capitales ; pas d'aplat */
.mp{display:inline-flex;align-items:flex-start;gap:0;pointer-events:none}
.mp svg{width:14px;height:14px;fill:var(--da-encre);stroke:var(--da-papier);stroke-width:1.2;margin-top:-4px}
.mp>span{display:inline-flex;align-items:center;gap:6px;background:var(--da-papier);color:var(--da-encre);border:var(--da-trait) solid var(--da-filet-fort);font:600 10px/14px var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;padding:1px 6px;border-radius:0;margin-left:-2px;margin-top:6px;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.mp>span::before{content:"";width:8px;height:8px;flex:none;background:var(--g)}
.frame[data-k^="draft:"] .flab .mp>span,.frame[data-k="frame:version"] .flab .mp>span{color:var(--da-bordeaux)}
/* curseurs flottants des groupes présents */
.fcur{position:absolute;top:calc(100% + 10px);pointer-events:none;z-index:5;animation:drift 7s ease-in-out infinite}
.fcur .mp svg{width:18px;height:18px}
.fcur .mp>span{font-size:10.5px;line-height:16px;padding:1px 7px;margin-top:10px;border-color:var(--da-encre)}
@keyframes drift{0%,100%{transform:translate(0,0)}30%{transform:translate(18px,6px)}60%{transform:translate(-10px,12px)}}
.car-b{min-width:16px!important;width:16px}.car-b svg{width:16px!important;height:16px!important;color:var(--text2)}
/* bulles de commentaire épinglées : une fiche carrée à filet d'encre, le nombre à la machine */
.pin{position:absolute;left:calc(100% + 14px);width:30px;height:30px;border-radius:0;background:var(--da-papier);border:var(--da-trait) solid var(--da-encre);box-shadow:none;display:grid;place-items:center;cursor:pointer;z-index:4;padding:2px}
.pin::after{content:"";position:absolute;left:-1px;bottom:-6px;width:0;height:0;border-left:6px solid var(--da-encre);border-bottom:6px solid transparent}
.pin i{width:100%;height:100%;border-radius:0;background:none;color:var(--da-encre);font:700 12px/24px var(--da-f-num);font-style:normal;text-align:center}
.pin:hover{background:var(--da-papier-2)}
.pin.on{outline:2px solid var(--da-encre);outline-offset:1px}
.pin.on i{background:none}
.f-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
/* boutons : secondaire = cadre d'encre ; primaire bordeaux réservé à la validation */
.btn{height:24px;padding:0 10px;border-radius:0;font:600 11px/1 var(--da-f-ui);letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:var(--da-papier);color:var(--da-encre);box-shadow:inset 0 0 0 var(--da-trait-fort) var(--da-encre)}
.btn:hover{background:var(--da-papier-2)}
.btn.pri{background:var(--da-papier);color:var(--da-encre);box-shadow:inset 0 0 0 2px var(--da-encre)}.btn.pri:hover{background:var(--da-papier-2);filter:none}
.btn.pri[data-cmd="valider"]{background:var(--da-bordeaux);color:var(--da-papier);box-shadow:inset 0 0 0 var(--da-trait-fort) var(--da-bordeaux)}
.btn.pri[data-cmd="valider"] .kbd{color:var(--da-papier);border-color:#ffffff55}
.btn.ghost{box-shadow:none;text-decoration:underline;text-underline-offset:3px;text-transform:none;letter-spacing:0;font-weight:500}
#right .btn,#left .btn,.dlg .btn{background:var(--da-papier);color:var(--da-encre);box-shadow:inset 0 0 0 var(--da-trait-fort) var(--da-encre)}
#right .btn:hover{background:var(--bg2)}
#right .btn.pri,.dlg .btn.pri{background:var(--da-papier);color:var(--da-encre);box-shadow:inset 0 0 0 2px var(--da-encre)}
.edit-wrap textarea{width:100%;min-height:170px;border:0;outline:var(--da-trait-fort) solid var(--da-encre);border-radius:0;padding:6px 8px;font:400 var(--da-t-loi)/var(--da-l-loi) var(--da-f-loi);color:var(--da-encre);background:var(--da-papier-2);resize:vertical}
.edit-wrap .live{margin-top:10px;padding:8px 10px;border-radius:0;background:var(--da-papier-2);border:var(--da-trait) dashed var(--da-filet-fort)}
.edit-hint{font-size:var(--da-t-s);line-height:var(--da-l-s);color:var(--da-encre-3);margin-top:6px}
.kbd{font:700 10px/14px var(--da-f-num);letter-spacing:0;text-transform:none;padding:0 4px;border-radius:0;background:none;border:var(--da-trait) solid var(--da-filet-fort);color:inherit;opacity:1}

/* tableaux dans les cadres : le bordereau, à cadre complet */
table.ft{border-collapse:collapse;width:100%;font-size:var(--da-t-s);line-height:var(--da-l-s);border:var(--da-trait-fort) solid var(--da-filet-encre)}
table.ft th{font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;text-align:left;color:var(--da-encre-3);padding:6px 8px;border:var(--da-trait) solid var(--da-filet-encre);border-bottom-width:var(--da-trait-fort);white-space:nowrap}
table.ft td{padding:6px 8px;border:var(--da-trait) solid var(--da-filet-encre);vertical-align:top;height:var(--da-ligne)}
table.ft td.mono,table.ft td.mono .lnk{font:700 var(--da-t-ui)/var(--da-l-ui) var(--da-f-num)}
table.ft tr[data-k]{cursor:pointer}
table.ft tr[data-k]:hover td,table.ft tr[data-nav]:hover td{background:var(--da-papier-2)}
table.ft tr.sel td{background:var(--da-papier-2)}
table.ft tr.sel{outline:2px solid var(--da-encre);outline-offset:-2px}
table.ft td.n{text-align:right;font:700 var(--da-t-ui)/var(--da-l-ui) var(--da-f-num);color:var(--da-encre-2)}
.cellst{width:8px;height:8px;border-radius:0;display:inline-block;vertical-align:middle}
.cellst.mod{background:var(--da-encre)}.cellst.same{background:var(--da-filet-fort);width:8px;height:8px;border-radius:0}.cellst.origine{border:1.5px solid var(--da-encre);width:8px;height:8px;border-radius:0}.cellst.absent{background:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--da-t-s);color:var(--da-encre-3);margin:2px 0 12px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.eh{padding:0 16px 10px;border-bottom:var(--da-trait-fort) solid var(--da-filet-encre);height:58px}
.eh .t{font:600 var(--da-t-h)/var(--da-l-h) var(--da-f-loi)}
.erow{height:62px;display:grid;grid-template-columns:26px minmax(0,1fr);grid-template-rows:auto auto;column-gap:6px;padding:7px 12px 0 8px;border-bottom:var(--da-trait) solid var(--da-filet-encre);cursor:pointer;position:relative;overflow:hidden}
.erow:hover{background:var(--da-papier-2)}.erow.sel{background:var(--da-papier-2);outline:2px solid var(--da-encre);outline-offset:-2px}
.erow .eo{font:700 12px/17px var(--da-f-num);color:var(--da-encre-2);text-align:right;grid-row:span 2}
.erow .et{font:400 13px/17px var(--da-f-loi);color:var(--da-encre);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.erow.absent .et{color:var(--da-encre-3)}.erow.same .et{color:var(--da-encre-2)}
.erow.mod{box-shadow:inset 3px 0 0 var(--da-encre)}
.erow .em,.erow .en{position:absolute;right:8px;bottom:4px;font:600 9.5px/15px var(--da-f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--da-encre-2);background:var(--da-papier);border-radius:0;padding:0 4px}
.erow .en{right:auto;left:34px;color:var(--da-encre-2);text-decoration:underline dotted var(--da-dispute);text-underline-offset:3px}
.hstep{border-left:var(--da-trait) solid var(--da-filet-encre);padding:0 0 18px 16px;position:relative}
.hstep::before{content:"";position:absolute;left:-5px;top:4px;width:9px;height:9px;border-radius:0;background:var(--da-papier);border:1.5px solid var(--da-encre)}
.hstep.mod::before{border-color:var(--da-encre);background:var(--da-encre)}
.hstep:last-of-type{border-left-color:transparent}
.hstep .kicker{margin-bottom:4px;display:flex;gap:8px;align-items:center}
.cmp3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:var(--da-trait-fort) solid var(--da-filet-encre);border-radius:0;overflow:hidden}
.cmp3>div{padding:12px 14px;min-width:0}
.cmp3>div+div{border-left:var(--da-trait) solid var(--da-filet-encre)}
.cmp3 .h{font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3);padding-bottom:8px;border-bottom:var(--da-trait-fort) solid var(--da-filet-encre);display:flex;gap:6px;align-items:center}
.cmp3 .mid{background:var(--da-papier-ref)}
.cmp3 .row{display:contents}
.fold{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;margin:4px 0;border-radius:0;background:var(--da-papier-2);border:var(--da-trait) dashed var(--da-filet-fort);color:var(--da-encre-3);font:600 10.5px/1 var(--da-f-ui);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.fold:hover{border-color:var(--da-encre);color:var(--da-encre)}
.vline{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:var(--da-trait) solid var(--da-filet)}
.vline .o{font:700 12px/var(--da-l-loi) var(--da-f-num);color:var(--da-encre-3);text-align:right}
.vline.mod .o{color:var(--da-encre)}.vline.del .o{color:var(--da-del)}.vline.ins .o{color:var(--da-ins)}
/* thèmes, matrice */
.tcard{cursor:pointer}
.tcard .fh .t{line-height:20px}
.tcard .big{font:700 24px/28px var(--da-f-num)}
.mx td.n{text-align:center;cursor:pointer;color:var(--da-encre)}
.mx td.n:hover{outline:2px solid var(--da-encre);outline-offset:-2px}
.mx th.g{text-align:center;padding:4px 2px;letter-spacing:.06em}
.gdot{width:8px;height:8px;border-radius:0;display:inline-block;flex:none;vertical-align:1px}
.stratum{margin:0 0 18px}
.stratum h3{font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre);margin:0 0 8px;padding-bottom:4px;border-bottom:var(--da-trait-fort) solid var(--da-filet-encre);display:flex;gap:6px;align-items:center}
.stratum h3 .nb{font:700 var(--da-t-s)/1 var(--da-f-num);letter-spacing:0;text-transform:none;color:var(--da-encre-3)}
.quote{border-left:2px solid var(--da-filet-fort);padding:2px 0 2px 12px;color:var(--da-encre-2);font-size:var(--da-t-ui);line-height:var(--da-l-ui);margin:6px 0}
.lnk{color:var(--da-encre);cursor:pointer;text-decoration:underline;text-decoration-color:var(--da-filet-fort);text-underline-offset:3px;font-weight:600}
.lnk:hover{text-decoration-color:var(--da-encre)}
/* réunion : la grammaire du tableau blanc, en fiches de papier à filet */
.stickies{column-count:3;column-gap:18px;counter-reset:fiche}
.sticky{position:relative;border-radius:0;padding:14px 14px 30px;box-shadow:none;border:var(--da-trait) solid var(--da-encre);font-size:var(--da-t-ui);line-height:var(--da-l-ui);color:var(--da-encre);break-inside:avoid;margin:0 0 18px;cursor:pointer;background:var(--da-papier);counter-increment:fiche}
.sticky:hover{background:var(--da-papier-2)}
.sticky::before{content:counter(fiche,decimal-leading-zero);position:absolute;right:10px;top:12px;font:700 12px/16px var(--da-f-num);color:var(--da-encre-3)}
.sticky .au{position:absolute;left:14px;bottom:8px;font:700 11px/14px var(--da-f-num);color:var(--da-encre-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;right:14px}
.sticky .sp{font:600 11px/16px var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;margin:0 26px 8px 0;padding-bottom:6px;border-bottom:var(--da-trait) solid var(--da-filet);display:flex;gap:6px;align-items:baseline}
.sticky .sp::before{content:"";width:8px;height:8px;flex:none;background:var(--sc);align-self:flex-start;margin-top:4px}
.stamp{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:0;font:700 15px/1 var(--da-f-ui);color:var(--da-encre);background:none;border:var(--da-trait) solid var(--da-encre);flex:none;box-shadow:none}
.stamp.ok,.stamp.ko,.stamp.mid{background:none;color:var(--da-encre)}
.stamp.ko,.stamp.mid{color:var(--da-encre-3);border-color:var(--da-encre-3)}
.decision{display:flex;gap:12px;align-items:center;background:var(--da-papier);border-radius:0;padding:10px 14px;box-shadow:none;border:var(--da-trait) solid var(--da-encre);margin-bottom:10px;font-size:var(--da-t-ui);line-height:var(--da-l-ui)}
.decision:has(.stamp.ok){border-left:var(--da-sort-adopte)}
.strip{display:flex;gap:3px;align-items:flex-end;height:120px;padding-top:24px;border-bottom:var(--da-trait-fort) solid var(--da-filet-encre)}
.strip .pl{flex:var(--m) 1 0;min-width:6px;background:var(--da-filet-fort);border-radius:0;cursor:pointer;position:relative;height:var(--h)}
.strip .pl.ad{background:var(--da-encre)}
.strip .pl.on{outline:2px solid var(--da-encre);outline-offset:2px}
.strip .pl:hover{background:var(--da-encre-3)}.strip .pl.ad:hover{background:var(--da-encre-2)}
.strip .pl b{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);font:700 10px/1 var(--da-f-num);color:var(--da-encre-3)}
.vote td{font-size:var(--da-t-s)}

/* ---------- barre d'outils flottante en bas : la couche qui flotte, la seule ombre ---------- */
#toolbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);height:48px;padding:0 8px;border-radius:0;background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);box-shadow:var(--da-ombre-flottant);display:flex;align-items:center;gap:2px;z-index:20}
#toolbar .tb{height:32px;min-width:32px;padding:0 4px;border-radius:0;display:inline-flex;align-items:center;justify-content:center;color:var(--da-encre-2);position:relative}
#toolbar .tb:hover{background:var(--da-papier-2);color:var(--da-encre)}
#toolbar .tb.on{background:var(--da-papier-2);color:var(--da-encre);outline:var(--da-trait-fort) solid var(--da-encre);outline-offset:-1.5px}
#toolbar .tb .car{width:8px;height:8px;margin-left:1px;opacity:.7}
#toolbar .sepv{width:1px;height:24px;background:var(--da-filet-fort);margin:0 6px}
#toolbar .dev{border-radius:0;padding:0 6px;gap:6px;background:none}
#toolbar .dev .sw{width:24px;height:12px;border-radius:0;background:var(--da-papier);border:var(--da-trait) solid var(--da-encre-2);position:relative;transition:background .15s}
#toolbar .dev .sw::after{content:"";position:absolute;left:1px;top:1px;width:8px;height:8px;border-radius:0;background:var(--da-encre-2);transition:left .15s}
#toolbar .dev.on{background:var(--da-papier-2);color:var(--da-encre);outline:var(--da-trait-fort) solid var(--da-encre);outline-offset:-1.5px}
#toolbar .dev.on .sw{background:var(--da-encre);border-color:var(--da-encre)}
#toolbar .dev.on .sw::after{left:13px;background:var(--da-papier)}
#app.ui-hidden #toolbar{display:none}
#help{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:0;background:var(--da-papier);border:var(--da-trait) solid var(--da-encre);box-shadow:none;font:700 15px/1 var(--da-f-loi);color:var(--da-encre);z-index:20}
#help:hover{background:var(--bg2)}
#app.ui-hidden #help{display:none}
#minichip{position:absolute;left:12px;top:12px;height:40px;padding:0 6px 0 12px;border-radius:0;background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);box-shadow:none;display:none;align-items:center;gap:8px;z-index:20;font-weight:600}
#app.ui-min #minichip{display:flex}
#minichip .pg{color:var(--text2);font-weight:400}
#mobilebar,#scrim{display:none}
#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--da-papier);color:var(--da-encre);border:var(--da-trait) solid var(--da-encre);padding:6px 10px;border-radius:0;font-size:var(--da-t-s);z-index:30;display:none;white-space:nowrap}

/* ---------- panneau droit (propriétés) ---------- */
.r-head{height:48px;display:flex;align-items:center;gap:4px;padding:0 8px 0 12px;flex:none}
.avs{display:flex;align-items:center}
/* avatar : initiales d'encre sur papier, la couleur du groupe en carré de 8 px */
.av{width:24px;height:24px;border-radius:0;background:var(--da-papier);color:var(--da-encre);border:var(--da-trait) solid var(--da-encre);font:700 9.5px/1 var(--da-f-num);display:grid;place-items:center;box-shadow:none;margin-left:-5px;cursor:pointer;position:relative;padding-bottom:3px}
.av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;background:var(--g)}
.av:first-child{margin-left:0}
.av.more{background:var(--bg2);color:var(--text)}.av.more::after{display:none}
.r-head .sp{flex:1}
.share{height:32px;padding:0 8px;border-radius:0;background:var(--da-papier);color:var(--da-encre);box-shadow:inset 0 0 0 var(--da-trait-fort) var(--da-encre);font:600 10.5px/1 var(--da-f-ui);letter-spacing:.06em;text-transform:uppercase}
.share:hover{background:var(--da-papier-2);filter:none}
.r-tabs{display:flex;align-items:center;gap:2px;padding:0 8px 8px;border-bottom:var(--da-trait-fort) solid var(--da-filet-encre);flex:none}
.r-tabs .sp{flex:1}
.zoomb{height:24px;white-space:nowrap;flex:none;padding:0 2px 0 6px;border-radius:0;display:flex;align-items:center;gap:0;font:700 11px/1 var(--da-f-num);letter-spacing:-.02em}
.zoomb:hover{background:var(--bg2)}
.zoomb svg,.menu-btn svg.car{width:16px;height:16px;color:var(--text2)}
.r-body{flex:1;overflow:auto;scrollbar-width:none;min-height:0}
.r-body::-webkit-scrollbar{display:none}
.p-sec{border-bottom:var(--da-trait) solid var(--da-filet-fort);padding:8px 0 12px}
.p-sec:last-child{border-bottom:0}
.p-h{height:32px;display:flex;align-items:center;gap:4px;padding:0 8px 0 16px;font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3)}
.p-h .t{flex:1;display:flex;align-items:center;gap:4px;min-width:0}
.p-h.big{height:40px;font:600 var(--da-t-h)/var(--da-l-h) var(--da-f-ui);letter-spacing:0;text-transform:none;color:var(--da-encre)}
.p-row{display:flex;align-items:center;gap:8px;padding:4px 16px;min-height:32px}
.p-row>*{min-width:0}
.fld{flex:1;height:24px;border-radius:0;background:var(--da-papier);display:flex;align-items:center;gap:6px;padding:0 8px;white-space:nowrap;overflow:hidden;min-width:0;border:var(--da-trait) solid var(--da-filet-fort)}
.fld:hover{border-color:var(--da-encre-3)}
.fld .pre{color:var(--text3);flex:none;min-width:12px;font-family:var(--da-f-num);font-weight:700}
.fld .v{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.fld select,.fld input{border:0;background:transparent;outline:0;width:100%;min-width:0;height:22px;padding:0;color:var(--text);border-radius:0}
.fld:focus-within{border-color:var(--da-encre);outline:1px solid var(--da-encre)}
.fld.click{cursor:pointer}
.seg{flex:1;display:flex;height:24px;border-radius:0;background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);padding:0;gap:0}
.seg button{flex:1;border-radius:0;color:var(--text3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.seg button+button{border-left:var(--da-trait) solid var(--da-filet-fort)}
.seg button.on{background:var(--da-papier-2);color:var(--da-encre);font-weight:600;box-shadow:inset 0 0 0 var(--da-trait-fort) var(--da-encre)}
.p-txt{padding:2px 16px;color:var(--text2);font-size:var(--da-t-s);line-height:var(--da-l-s)}
.p-txt.law-s{font:400 13px/20px var(--da-f-loi);color:var(--text)}
.p-list .lrow{margin:0 8px}
.cl{margin:4px 8px;padding:8px;border-radius:0;border:var(--da-trait) solid var(--da-encre);cursor:default;background:var(--da-papier)}
.cl .who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.cl .who .nm{font-weight:600}
.cl .tx{font:400 13px/20px var(--da-f-loi)}
.cl.ref{background:var(--da-papier-ref);border-color:var(--da-filet-fort);border-left:2px solid var(--da-filet-fort)}
.cl .ams{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.cl .ams button{font:700 11px/18px var(--da-f-num);padding:0 5px;border-radius:0;background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);color:var(--da-encre)}
.cl .ams button:hover{border-color:var(--da-encre)}
.vh-list{padding:0 8px 12px;position:relative}
.vh-it{display:flex;gap:10px;padding:8px;border-radius:0;cursor:pointer;position:relative}
.vh-it:hover{background:var(--bg2)}.vh-it.on{background:var(--bg2);outline:2px solid var(--da-encre);outline-offset:-2px}
.vh-dot{width:9px;height:9px;border-radius:0;border:1.5px solid var(--da-encre-2);background:var(--da-papier);margin-top:5px;flex:none;position:relative;z-index:1}
.vh-it:first-child .vh-dot{background:var(--da-encre);border-color:var(--da-encre)}
.vh-it:not(:last-child)::after{content:"";position:absolute;left:12px;top:20px;bottom:-12px;width:1px;background:var(--da-encre-3)}
.vh-t{font-weight:600}.vh-w{color:var(--text3);font:700 11px/16px var(--da-f-num)}
#thread .msg.ref{background:var(--da-papier-ref)}
.code{font:400 12px/18px var(--da-f-num);background:var(--da-papier-2);border:var(--da-trait) solid var(--da-filet-fort);border-radius:0;padding:8px 10px;margin:4px 16px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--da-encre)}
.code .k{color:var(--da-encre);font-weight:700}.code .s{color:var(--da-encre-2)}.code .c{color:var(--da-encre-3);font-style:italic}
.dev-banner{display:flex;align-items:center;gap:8px;margin:8px 8px 0;padding:8px;border-radius:0;background:var(--da-papier-2);border:var(--da-trait) dashed var(--da-encre);color:var(--text)}
.empty{padding:16px;color:var(--text2);line-height:18px}
.filter{margin:8px 8px 4px;height:28px;border-radius:0;background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);display:flex;align-items:center;gap:6px;padding:0 8px}
.filter:focus-within{border-color:var(--da-encre)}
.filter input{border:0;background:transparent;outline:0;flex:1;min-width:0;color:var(--text)}
.filter svg{width:16px;height:16px;color:var(--text2)}
.chips{display:flex;gap:4px;flex-wrap:wrap;padding:4px 8px 8px}
.chips button{height:22px;padding:0 8px;border-radius:0;background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);color:var(--da-encre-3);font:600 10px/20px var(--da-f-ui);letter-spacing:.1em;text-transform:uppercase}
.chips button.on{background:var(--da-papier-2);color:var(--da-encre);border-color:var(--da-encre);box-shadow:inset 0 0 0 .5px var(--da-encre)}
.grp-h{display:flex;align-items:center;gap:6px;height:28px;padding:0 16px;font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3)}

/* ---------- couches flottantes : menus, palette d'actions, dialogues, fil de commentaire ---------- */
.menu{position:fixed;z-index:80;background:var(--da-papier);color:var(--da-encre);border:var(--da-trait) solid var(--da-filet-fort);border-radius:0;padding:8px;box-shadow:var(--da-ombre-flottant);min-width:220px;display:none}
.menu .mi{height:24px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:0;cursor:pointer;white-space:nowrap}
.menu .mi:hover,.menu .mi.on{background:var(--da-papier-2);outline:var(--da-trait) solid var(--da-encre);outline-offset:-1px}
.menu .mi .k{margin-left:auto;color:var(--da-encre-3);font:700 11px/1 var(--da-f-num)}
.menu .mi .ck{width:12px}
.menu .sepm{height:1px;background:var(--da-filet-fort);margin:6px -8px}
#actions{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);width:min(440px,calc(100% - 24px));max-height:min(520px,calc(100% - 100px));background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);border-radius:0;box-shadow:var(--da-ombre-flottant);z-index:40;display:none;flex-direction:column;overflow:hidden}
#actions.on{display:flex}
#actions .srch{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-bottom:var(--da-trait-fort) solid var(--da-filet-encre)}
#actions .srch input{flex:1;border:0;outline:0;background:transparent;font-size:var(--da-t-h);color:var(--text)}
#actions .srch svg{width:16px;height:16px;color:var(--text2)}
#actions .atabs{display:flex;gap:4px;padding:8px 8px 4px}
#actions .alist{overflow:auto;scrollbar-width:none;padding:0 8px 8px;flex:1}
#actions .ah{font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3);padding:10px 8px 4px}
#actions .ai{display:flex;align-items:center;gap:8px;min-height:32px;padding:4px 8px;border-radius:0;cursor:pointer}
#actions .ai:hover{background:var(--da-papier-2)}
#actions .ai .ic{width:24px;height:24px;border-radius:0;background:none;border:var(--da-trait) solid var(--da-filet-fort);display:grid;place-items:center;flex:none;font-size:12px;color:var(--text2)}
#actions .ai .ic svg{width:16px;height:16px}
#actions .ai .tt{flex:1;min-width:0}
#actions .ai .tt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#actions .ai .tt small{display:block;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--da-t-s)}
#actions .ai .k{color:var(--text3);font:700 11px/1 var(--da-f-num);flex:none}
#actions .ai.on{background:var(--da-papier-2);outline:2px solid var(--da-encre);outline-offset:-2px}
#actions .ai b{color:var(--da-encre);text-decoration:underline;text-underline-offset:2px}
#thread{position:absolute;z-index:35;width:340px;max-height:min(480px,calc(100% - 24px));background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);border-radius:0;box-shadow:var(--da-ombre-flottant);display:none;flex-direction:column;overflow:hidden}
#thread.on{display:flex}
#thread .th-h{display:flex;align-items:center;gap:6px;height:44px;padding:0 8px 0 14px;border-bottom:var(--da-trait-fort) solid var(--da-filet-encre);font:600 var(--da-t-h)/var(--da-l-h) var(--da-f-loi);flex:none}
#thread .th-h .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#thread .th-b{overflow:auto;scrollbar-width:none;padding:6px 6px 10px}
#thread .msg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:8px;border-radius:0;border-bottom:var(--da-trait) solid var(--da-filet)}
#thread .msg:hover{background:var(--da-papier-2)}
#thread .msg .avs{grid-row:span 2;align-self:start;padding-top:1px}
#thread .msg .nm{font-weight:600;line-height:18px}
#thread .msg .nm small{font-weight:400;color:var(--text3);margin-left:4px}
#thread .msg .tx{font:400 14px/22px var(--da-f-loi)}
#thread .msg .ams{grid-column:2;display:flex;gap:4px;flex-wrap:wrap}
#thread .msg .ams button{font:700 11px/18px var(--da-f-num);padding:0 5px;border-radius:0;background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);color:var(--da-encre)}
#thread .msg .ams button:hover{border-color:var(--da-encre)}
#thread .ctxl{font-size:var(--da-t-s);color:var(--text2);padding:8px 10px 4px;line-height:var(--da-l-s)}
.dlg-back{position:fixed;inset:0;background:rgba(26,26,26,.28);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
.dlg-back.on{display:flex}
.dlg{background:var(--da-papier);color:var(--text);border:var(--da-trait) solid var(--da-filet-fort);border-radius:0;box-shadow:var(--da-ombre-flottant);width:min(620px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;overflow:hidden}
.dlg-h{height:48px;display:flex;align-items:center;padding:0 8px 0 16px;border-bottom:var(--da-trait-fort) solid var(--da-filet-encre);font:600 var(--da-t-h)/var(--da-l-h) var(--da-f-ui);flex:none}
.dlg-h .t{flex:1}
.dlg-b{overflow:auto;padding:12px 16px 18px;line-height:var(--da-l-ui);scrollbar-width:none}
.dlg-b h4{font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3);margin:18px 0 6px}
.dlg-b ul{margin:4px 0;padding-left:18px}.dlg-b li{margin:3px 0}
.dlg-b a{color:var(--da-encre);text-decoration:underline}
.vis-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:0;cursor:pointer;border:var(--da-trait) solid transparent}
.vis-row:hover{background:var(--bg2)}.vis-row.on{background:var(--bg2);border:2px solid var(--da-encre)}
.vis-row .ic{width:32px;height:32px;border-radius:0;background:none;border:var(--da-trait) solid var(--da-filet-fort);display:grid;place-items:center}
.vis-row .ic svg{width:18px;height:18px}
#tip{position:fixed;z-index:100;background:var(--da-papier);color:var(--da-encre);border:var(--da-trait) solid var(--da-encre);font-size:var(--da-t-s);line-height:16px;padding:4px 8px;border-radius:0;pointer-events:none;display:none;white-space:nowrap}
#tip .k{color:var(--da-encre-3);font:700 11px/1 var(--da-f-num);margin-left:6px}
#toast{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);background:var(--da-papier);color:var(--da-encre);border:var(--da-trait) solid var(--da-encre);border-radius:0;padding:8px 12px;z-index:45;display:none;align-items:center;gap:10px;max-width:calc(100% - 24px);box-shadow:var(--da-ombre-flottant)}
#toast.on{display:flex}
#toast button{color:var(--da-encre);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ---------- écran étroit : panneaux en tiroirs, barre d'outils en bas, canevas en défilement ---------- */
@media (max-width:720px){
  #app,#app.ui-min,#app.ui-min.has-sel{grid-template-columns:minmax(0,1fr)}
  #left,#right{position:fixed;top:0;bottom:0;width:min(320px,88vw);z-index:60;box-shadow:var(--da-ombre-flottant);transition:transform .2s;display:flex!important}
  #left{left:0;transform:translateX(-105%)}#right{right:0;transform:translateX(105%)}
  #app.dl #left{transform:none}#app.dr #right{transform:none}
  .resizer{display:none}
  #scrim{position:fixed;inset:0;background:rgba(26,26,26,.25);z-index:55;display:none}
  #app.dl #scrim,#app.dr #scrim{display:block}
  #canvas{grid-column:1;overflow:auto;touch-action:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #canvas::-webkit-scrollbar{display:none}
  #world{position:static;transform:none!important;display:flex;flex-direction:column;gap:56px;padding:84px 12px 110px}
  .col{position:static;gap:56px;width:auto!important;order:var(--mo,0)}
  .frame,.section{width:auto!important;max-width:100%}
  .section{padding:72px 10px 18px}
  .frame .fb{overflow-x:auto;scrollbar-width:none}
  .hide-m{display:none}
  .erow.absent{display:none}.erow{height:auto;min-height:44px;padding-bottom:18px}
  .eh{height:auto}
  .sgrid{grid-template-columns:minmax(0,1fr)!important;gap:44px}
  .fb{padding:16px 14px 18px}
  .law{font-size:var(--da-t-loi-c);line-height:var(--da-l-loi-c)}
  .fh .t{font-size:17px;line-height:24px}
  .pin{display:none}
  .cmp3{grid-template-columns:repeat(3,minmax(78vw,1fr));overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .cmp3>div{scroll-snap-align:start}
  .stickies{column-count:1}
  #mobilebar{display:flex;position:fixed;left:8px;right:8px;top:8px;height:44px;border-radius:0;background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);box-shadow:var(--da-ombre-flottant);z-index:30;align-items:center;gap:4px;padding:0 6px}
  #mobilebar .t{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:600;white-space:nowrap;overflow:hidden}
  #mobilebar .t small{color:var(--text2);font-weight:400;overflow:hidden;text-overflow:ellipsis}
  #toolbar{position:fixed;bottom:10px;max-width:calc(100vw - 16px);padding:0 4px;overflow-x:auto;scrollbar-width:none}
  #toolbar .hide-s{display:none}
  #help{position:fixed;bottom:66px;right:10px}
  #minichip{display:none!important}
  #actions{position:fixed;bottom:66px}
  #thread{position:fixed;left:8px!important;right:8px;top:auto!important;bottom:66px;width:auto;max-height:60vh}
  #toast{position:fixed;bottom:66px}
  .strip{height:90px}
  table.ft{font-size:11px}
  .mx-wrap{overflow-x:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="left" aria-label="Pages et calques"></aside>
  <main id="canvas" aria-label="Canevas">
    <div id="world"></div>
    <div id="minichip"></div>
    <div id="thread" role="dialog" aria-label="Passage disputé"></div>
    <div id="actions" role="dialog" aria-label="Actions"></div>
    <div id="toolbar" role="toolbar" aria-label="Outils"></div>
    <button id="help" aria-label="Lisez-moi" data-cmd="help">?</button>
    <div id="hint"></div>
    <div id="toast"></div>
  </main>
  <aside id="right" aria-label="Propriétés"></aside>
  <div id="mobilebar"></div>
  <div id="scrim"></div>
</div>
<div class="menu" id="menu"></div>
<div class="dlg-back" id="dlg"><div class="dlg" role="dialog"></div></div>
<div id="tip"></div>
<script>window.MAQ = "figma";</script>
<!--NOYAU-->
<!--APP-->
</body>
</html>

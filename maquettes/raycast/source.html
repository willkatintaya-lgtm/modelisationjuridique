<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boussole · inspiration Raycast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap">
<!--DA-->
<style>
/* Forme : direction artistique « Le bordereau » (direction-artistique/DA.md, jetons --da-* de da.css).
   La structure Raycast (fenêtre flottante, barre de recherche, liste à sections, liste + détail, grille, barre d'actions, panneau ⌘K) ne change pas.
   Thème unique, clair : les deux positions de l'interrupteur affichent le même papier. */
:root,[data-theme="dark"],[data-theme="light"]{
  --desk:var(--da-bureau); --tx:26,26,26;
  --text:var(--da-encre); --text2:var(--da-encre-2); --text3:var(--da-encre-3); --line:var(--da-filet); --sel:var(--da-papier-2); --hov:var(--da-papier-2);
  --kbd:var(--da-papier-2); --outline:var(--da-filet-fort); --panel:var(--da-papier); --pill:transparent;
  --red:var(--da-del); --orange:var(--da-encre-2); --yellow:var(--da-encre-2); --green:var(--da-encre); --blue:var(--da-encre-2); --purple:var(--da-encre-2); --magenta:var(--da-encre-2);
  --shadow:var(--da-ombre-flottant);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--da-bureau);color:var(--da-encre);font:var(--da-t-ui)/var(--da-l-ui) var(--da-f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;border-radius:0}
input,textarea,select{font:inherit;color:inherit;border-radius:0}
.mono{font-family:var(--da-f-num);font-weight:700}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- le bureau : un aplat, rien de dessiné ---------- */
#desk{position:fixed;inset:0;overflow:hidden;background:var(--da-bureau)}
#desk .hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:var(--da-t-s);color:var(--da-encre-3)}
#desk .hint .kc{margin:0 2px}

/* ---------- la fenêtre flottante : 750 × 475, une feuille posée sur le bureau (couche flottante : seule ombre admise) ---------- */
#win{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:750px;height:475px;border-radius:0;display:flex;flex-direction:column;overflow:hidden;
  background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);
  box-shadow:var(--da-ombre-flottant);transition:width .22s cubic-bezier(.2,.8,.2,1),height .22s cubic-bezier(.2,.8,.2,1)}
#win.large{width:min(1120px,calc(100vw - 48px));height:min(720px,calc(100vh - 56px))}
#win.compact{height:56px}
#win.compact #body,#win.compact #foot,#win.compact #hr{display:none}

/* barre de recherche : 56 px, champ 16 px */
#head{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px 0 14px}
#back{width:28px;height:28px;border-radius:0;display:grid;place-items:center;color:var(--da-encre-2);flex:none}
#back:hover{background:var(--da-papier-2);color:var(--da-encre)}
#back[hidden]{display:none}
#head .glyph{width:22px;height:22px;display:grid;place-items:center;color:var(--da-encre-3);flex:none}
#q{flex:1;min-width:0;height:40px;background:none;border:0;outline:0;font:400 16px/24px var(--da-f-ui);color:var(--da-encre);caret-color:var(--da-encre)}
#q::placeholder{color:var(--da-encre-3)}
#htitle{flex:1;min-width:0;font:600 var(--da-t-h)/var(--da-l-h) var(--da-f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#htitle small{font-size:var(--da-t-s);color:var(--da-encre-3);font-weight:400;margin-left:8px}
#dd{height:28px;display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;border-radius:0;border:var(--da-trait) solid var(--da-filet-fort);color:var(--da-encre-2);font-size:var(--da-t-ui);white-space:nowrap;flex:none}
#dd:hover,#dd.open{background:var(--da-papier-2);color:var(--da-encre);border-color:var(--da-encre)}
#dd[hidden]{display:none}
#hr{height:var(--da-trait-fort);background:var(--da-filet-encre);flex:none}

#body{flex:1;min-height:0;display:flex;position:relative}

/* ---------- liste à sections, en bordereau à cadre complet ---------- */
.list{flex:1;min-width:0;overflow:auto;padding:4px 0 10px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.sec-t{font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3);padding:14px 18px 6px;display:flex;gap:6px;align-items:center}
.sec-t .n{color:var(--da-encre-3);font-weight:400}
.row{height:40px;margin:0 8px;padding:0 10px;border-radius:0;display:flex;align-items:center;gap:12px;cursor:default;white-space:nowrap;user-select:none;
  border:var(--da-trait) solid var(--da-filet-encre);border-left-width:var(--da-trait-fort);border-right-width:var(--da-trait-fort);margin-top:-1px;background:var(--da-papier)}
.sec-t+.row,.list>.row:first-child{border-top-width:var(--da-trait-fort);margin-top:0}
.row:has(+.sec-t),.row:last-child{border-bottom-width:var(--da-trait-fort)}
.row>:is(.ai,.li,.dot,.num):first-child{align-self:stretch;height:auto;width:30px;margin-left:-10px;padding-left:5px;border-right:var(--da-trait) solid var(--da-filet-encre);box-sizing:content-box}
.row.on{background:var(--da-papier-2);outline:var(--da-focus);outline-offset:-2px;position:relative;z-index:1}
.row:not(.on):hover{background:var(--da-papier-2)}
.row .tt{font-size:var(--da-t-ui);font-weight:500;color:var(--da-encre);overflow:hidden;text-overflow:ellipsis;flex:none;max-width:70%}
.row .st{font-size:var(--da-t-ui);color:var(--da-encre-3);overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.row .acc{display:flex;align-items:center;gap:10px;flex:none;margin-left:auto;font-size:var(--da-t-s);color:var(--da-encre-2);align-self:stretch;padding-left:10px;border-left:var(--da-trait) solid var(--da-filet-encre)}
.split .row .tt{max-width:62%}

/* icônes 20 px : trait d'encre, aucune icône colorée */
.ai{width:20px;height:20px;border-radius:0;display:grid;place-items:center;flex:none;color:var(--da-encre-2);background:none}
.ai svg{width:15px;height:15px;stroke-width:1.5}
.li{width:20px;height:20px;display:grid;place-items:center;flex:none;color:var(--da-encre-2)}
.li svg{width:16px;height:16px}
/* couleur de groupe : un carré de 8 px */
.dot{width:20px;height:20px;display:grid;place-items:center;flex:none}
.dot::before{content:"";width:8px;height:8px;border-radius:0;background:var(--c)}
.num{width:20px;height:20px;border-radius:0;display:grid;place-items:center;flex:none;font:700 var(--da-t-ui)/1 var(--da-f-num);background:none;color:var(--da-encre)}

/* accessoires : mentions sobres (aucun aplat, aucun texte coloré) ; groupe = carré de 8 px ; sort = capitales et filet de marge */
.tag{height:20px;display:inline-flex;align-items:center;gap:6px;padding:0 6px;border-radius:0;font:500 var(--da-t-s)/1 var(--da-f-ui);color:var(--da-encre-2);background:none;border:var(--da-trait) solid var(--da-filet-fort);white-space:nowrap}
.tag.g::before{content:"";width:8px;height:8px;flex:none;background:var(--c)}
.tag[data-sort]{border:0;border-left:var(--da-sort-aucun);padding:0 0 0 6px;font:600 10.5px/16px var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3)}
.tag[data-sort="adopte"]{border-left:var(--da-sort-adopte);color:var(--da-encre)}
.tag[data-sort="rejete"]{border-left:var(--da-sort-rejete)}
.tag[data-sort="tombe"]{border-left:var(--da-sort-tombe)}
.tag[data-sort="retire"]{border-left:var(--da-sort-retire)}
.tag[data-sort="ns"],.tag[data-sort="attente"],.tag[data-sort="ecarte"]{padding-left:0}
.ax{white-space:nowrap}
.cells{display:inline-flex;gap:3px}
.cells i{width:9px;height:9px;border-radius:0;background:var(--da-filet-fort)}
.cells i.mod{background:var(--da-encre)}.cells i.origine{background:none;box-shadow:inset 0 0 0 1.5px var(--da-encre)}.cells i.absent{background:none;box-shadow:none;outline:1px dashed var(--da-filet-fort);outline-offset:-1px}
.bar{display:inline-block;height:6px;border-radius:0;background:var(--da-filet-fort);vertical-align:middle}
.bar.ad{background:var(--da-encre)}

/* ---------- liste + détail : 38 % / 62 % ---------- */
.split{display:grid;grid-template-columns:38% 62%;flex:1;min-width:0}
.split>.list{border-right:var(--da-trait) solid var(--da-filet-fort)}
.det{min-width:0;display:flex;flex-direction:column;min-height:0}
.det .md{flex:1;overflow:auto;scrollbar-width:none}
.det .md::-webkit-scrollbar{display:none}
.det .meta{flex:none;max-height:34%;overflow:auto;border-top:var(--da-trait) solid var(--da-filet-fort);background:var(--da-papier-2);scrollbar-width:none}

/* Markdown du détail */
.md{padding:18px 22px 26px;font-size:var(--da-t-ui);line-height:var(--da-l-ui);color:var(--da-encre)}
.md h1{font:600 var(--da-t-titre)/var(--da-l-titre) var(--da-f-loi);margin:0 0 6px;letter-spacing:0}
.md h2{font:600 var(--da-t-h)/var(--da-l-h) var(--da-f-ui);margin:22px 0 8px;padding-bottom:4px;border-bottom:var(--da-trait) solid var(--da-filet-fort)}
.md h3{font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;margin:16px 0 6px;color:var(--da-encre-3)}
.md p{margin:6px 0}
.md .sub{color:var(--da-encre-2);font-size:var(--da-t-s);line-height:var(--da-l-s);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.md blockquote{margin:8px 0;padding:2px 0 2px 14px;border-left:2px solid var(--da-filet-fort);color:var(--da-encre-2);font-family:var(--da-f-loi);font-size:var(--da-t-loi-c);line-height:var(--da-l-loi-c);max-width:var(--da-mesure)}
.md a,.lnk{color:var(--da-encre);cursor:pointer;text-decoration:underline;text-decoration-color:var(--da-filet-fort);text-underline-offset:3px}
.md a:hover,.lnk:hover{text-decoration-color:var(--da-encre)}
.md ul{margin:6px 0;padding-left:20px}.md li{margin:3px 0}
.md li::marker{color:var(--da-encre-3)}
.md code{font-family:var(--da-f-num);font-size:12px;background:none;padding:0;border-radius:0}
.md table{border-collapse:collapse;width:100%;font-size:var(--da-t-ui);margin:8px 0;border:var(--da-trait-fort) solid var(--da-filet-encre);background:var(--da-papier)}
.md th{text-align:left;font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3);padding:6px 8px;border:var(--da-trait) solid var(--da-filet-encre);border-bottom-width:var(--da-trait-fort);white-space:nowrap}
.md td{padding:6px 8px;border:var(--da-trait) solid var(--da-filet-encre);vertical-align:top;height:var(--da-ligne)}
.md td.mono{font:700 var(--da-t-ui)/var(--da-l-ui) var(--da-f-num);white-space:nowrap}
.md tr[data-am],.md tr[data-th],.md tr[data-goal]{cursor:pointer}
.md tr[data-am]:hover td,.md tr[data-goal]:hover td,.md tr[data-th]:hover td{background:var(--da-papier-2)}
.md td.c{text-align:center;font-variant-numeric:tabular-nums}
.md .tw{overflow-x:auto;scrollbar-width:none}
.md .tw::-webkit-scrollbar{display:none}
.empty-note{color:var(--da-encre-3)}

/* textes juridiques : feuilles, Source Serif 16/26, 66 caractères ; corrections apparentes sur la rédaction comparée */
.tb{margin:10px 0 14px}
.tb-h{display:flex;align-items:center;gap:8px;font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3);margin-bottom:6px}
.tb-h .tag{height:18px;font-size:11px;letter-spacing:0;text-transform:none}
.tb-h .tag[data-sort]{font-size:10.5px;letter-spacing:var(--da-caps-ls);text-transform:uppercase}
.tb:has(>.lx.mine)>.tb-h{color:var(--da-bordeaux)}
.lx{font-family:var(--da-f-loi);font-size:var(--da-t-loi);line-height:var(--da-l-loi);max-width:var(--da-mesure);color:var(--da-encre);padding:10px 14px;border-radius:0;background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);box-shadow:none;overflow-wrap:anywhere}
.lx.ref{color:var(--da-encre);background:var(--da-papier-ref)}
.lx.mine{cursor:text;border-top:2px solid var(--da-or)}
.lx .ctx{color:var(--da-encre-3)}
ins{color:var(--da-ins);font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;background:none;border-radius:0}
del{color:var(--da-del);text-decoration:line-through;text-decoration-color:var(--da-del);text-decoration-thickness:1px;background:none;border-radius:0}
ins[data-h],del[data-h]{cursor:zoom-in}
mark.pt{color:inherit;background:none;border:0;border-radius:0;text-decoration:underline dotted var(--da-dispute);text-decoration-thickness:var(--da-dispute-1);text-underline-offset:5px;cursor:pointer}
mark.pt.w2{text-decoration-thickness:var(--da-dispute-2)}
mark.pt.w3{text-decoration-thickness:var(--da-dispute-3)}
mark.pt:hover{background:var(--da-papier-2)}
.delpt{display:inline-block;width:2px;height:14px;background:var(--da-del);vertical-align:-2px;margin:0 1px;border-radius:0}

/* métadonnées : libellé en capitales à gauche, valeur à droite */
.meta{padding:8px 22px 12px}
.mrow{display:flex;align-items:flex-start;gap:12px;min-height:30px;padding:5px 0;font-size:var(--da-t-ui)}
.mrow .ml{font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3);flex:none;padding-top:3px}
.mrow .mv{margin-left:auto;text-align:right;display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;min-width:0}
.msep{height:1px;background:var(--da-filet-fort);margin:4px 0}
.mrow .tag[data-am],.mrow .tag[data-al],.mrow [data-place],.mrow [data-th]{cursor:pointer}
.mrow .tag[data-al]:hover,.mrow .tag[data-u]:hover{border-color:var(--da-encre)}

/* vue Détail : Markdown à gauche, métadonnées à droite */
.dview{flex:1;min-width:0;display:flex;min-height:0}
.dview>.md{flex:1;overflow:auto;scrollbar-width:none;min-width:0}
.dview>.md::-webkit-scrollbar{display:none}
.dview>.meta{width:290px;flex:none;border-left:var(--da-trait) solid var(--da-filet-fort);background:var(--da-papier-2);overflow:auto;scrollbar-width:none}

/* ---------- grille : 5 colonnes, fiches à intercalaire (la chemise d'archive) ---------- */
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px 12px;padding:0 18px 8px}
.cell{cursor:default;min-width:0}
.cell .tile{aspect-ratio:1;border-radius:0;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:22px 10px 10px;color:var(--da-encre);
  background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-encre);box-shadow:none}
.cell .tile::before{content:"";position:absolute;left:-1px;top:-1px;width:58%;height:12px;background:var(--c);border:var(--da-trait) solid var(--da-filet-encre)}
.cell .tile .g{font:300 28px/1 var(--da-f-ui);color:var(--da-encre-2)}
.cell .tile .k{font:600 10px/14px var(--da-f-ui);letter-spacing:var(--da-caps-ls);color:var(--da-encre-3)}
.cell .tile .als{font:700 11px/16px var(--da-f-num);color:var(--da-encre);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.on .tile{outline:var(--da-focus);outline-offset:-2px;background:var(--da-papier-2)}
.cell:not(.on):hover .tile{background:var(--da-papier-2)}
.cell .ct{font-size:var(--da-t-ui);font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cs{font-size:var(--da-t-s);color:var(--da-encre-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* EmptyView */
.emptyv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--da-encre-2);text-align:center;padding:20px}
.emptyv .ei{width:44px;height:44px;border-radius:0;display:grid;place-items:center;background:none;border:var(--da-trait) solid var(--da-filet-fort);color:var(--da-encre-2);margin-bottom:6px}
.emptyv .ei svg{width:20px;height:20px}
.emptyv b{color:var(--da-encre);font-size:var(--da-t-h);font-weight:600}

/* ---------- barre d'actions : à gauche le nom ou le toast, à droite les boutons ---------- */
#foot{height:48px;flex:none;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;border-top:var(--da-trait) solid var(--da-filet-fort);background:var(--da-papier-2)}
#foot .left{display:flex;align-items:center;gap:10px;min-width:0;flex:1;font:600 var(--da-t-s)/var(--da-l-s) var(--da-f-ui);color:var(--da-encre-2);white-space:nowrap;overflow:hidden}
#foot .left .nm{overflow:hidden;text-overflow:ellipsis}
#foot .toast{display:flex;align-items:center;gap:8px;min-width:0;color:var(--da-encre)}
#foot .toast .msg{color:var(--da-encre-2);font-weight:400;overflow:hidden;text-overflow:ellipsis}
#foot .toast .ta{color:var(--da-encre);font-weight:600;cursor:pointer;margin-left:4px;text-decoration:underline;text-underline-offset:3px}
.spin{width:12px;height:12px;border-radius:0;border:2px solid var(--da-filet-fort);border-top-color:var(--da-encre);animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.tic{width:16px;height:16px;border-radius:0;display:grid;place-items:center;flex:none;background:var(--c);color:var(--da-papier)}
.tic svg{width:10px;height:10px;stroke-width:2.5}
#pill{display:flex;align-items:center;gap:6px;height:34px;padding:0;border-radius:0;background:none;box-shadow:none;flex:none}
#pill button{height:30px;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;border-radius:0;font:600 12px/1 var(--da-f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--da-encre);white-space:nowrap;border:var(--da-trait-fort) solid var(--da-encre);background:var(--da-papier)}
#pill button:hover{background:var(--da-papier-2)}
#pill .sep{display:none}
#pill .act2{color:var(--da-encre)}
/* bouton primaire = parapheur, réservé à la validation (Enregistrer dans le formulaire) */
#win:has(.form) #pill button[data-primary]{background:var(--da-bordeaux);border-color:var(--da-bordeaux);color:var(--da-papier)}
#win:has(.form) #pill button[data-primary] .kc{background:none;border-color:rgba(253,252,249,.45);color:var(--da-papier)}
/* touches : petit cadre rectangulaire */
.kc{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 4px;border-radius:0;background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);color:var(--da-encre-2);font:500 11px/1 var(--da-f-ui);letter-spacing:0;text-transform:none}
.kcs{display:inline-flex;gap:3px}

/* ---------- Action Panel (⌘K), menu, loupe : couches flottantes (ombre admise) ---------- */
.pop{position:absolute;z-index:30;border-radius:0;background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);
  box-shadow:var(--da-ombre-flottant);display:flex;flex-direction:column;overflow:hidden}
#ap{right:8px;bottom:54px;width:min(360px,calc(100% - 16px));max-height:min(400px,calc(100% - 70px))}
#ap .apt{font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3);padding:12px 16px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ap .apl{overflow:auto;flex:1;padding:2px 0 6px;scrollbar-width:none}
#ap .apl::-webkit-scrollbar{display:none}
#ap .aps{height:1px;background:var(--da-filet-fort);margin:6px 0}
#ap .aph{font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3);padding:6px 16px 4px}
.ait{height:36px;margin:0 6px;padding:0 10px;border-radius:0;display:flex;align-items:center;gap:10px;white-space:nowrap;cursor:default}
.ait.on{background:var(--da-papier-2);outline:var(--da-focus);outline-offset:-2px}
.ait:not(.on):hover{background:var(--da-papier-2)}
.ait .at{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:var(--da-t-ui)}
.ait .li{width:18px;height:18px}.ait .li svg{width:16px;height:16px}
.ait.danger .at,.ait.danger .li{color:var(--da-del)}
#ap .apin{border-top:var(--da-trait) solid var(--da-filet-fort);flex:none;background:var(--da-papier-2)}
#ap .apin input{width:100%;height:40px;background:none;border:0;outline:0;padding:0 16px;font-size:var(--da-t-ui);color:var(--da-encre)}
#ap .apin input::placeholder{color:var(--da-encre-3)}
#ddp{top:50px;right:12px;width:280px;max-height:min(360px,calc(100% - 70px))}
#ddp .apl{overflow:auto;padding:6px 0;scrollbar-width:none}
#ddp .aph{font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3);padding:6px 16px 4px}
#ddp .ait .ck{width:16px;color:var(--da-encre)}

/* loupe : la zone et le passage de la référence côte à côte */
#loupe{width:min(640px,calc(100% - 24px));padding:12px 14px 14px;gap:8px}
#loupe .lh{font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3);display:flex;gap:8px;align-items:center}
#loupe .lh .x{margin-left:auto}
#loupe .lc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#loupe .lc .lx{font-size:var(--da-t-loi-c);line-height:var(--da-l-loi-c);padding:8px 12px}

/* comparer : une | la référence au centre | l'autre */
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:0;padding:0 0 30px}
.cmp>div{padding:10px 16px;border-left:var(--da-trait) solid var(--da-filet-fort);min-width:0}
.cmp>div:nth-child(3n+1){border-left:0}
.cmp .ch{position:sticky;top:0;z-index:2;background:var(--da-papier);border-bottom:var(--da-trait-fort) solid var(--da-filet-encre);display:flex;align-items:center;gap:8px;font:600 var(--da-t-ui)/var(--da-l-ui) var(--da-f-ui);padding-top:12px;padding-bottom:10px}
.cmp .ch small{font-weight:400;color:var(--da-encre-3);font-size:var(--da-t-s)}
.cmp .ca{font:700 var(--da-t-ui)/var(--da-l-ui) var(--da-f-num);color:var(--da-encre-2);padding-bottom:0;padding-top:14px}
.cmp .lx{max-width:none}
.cmpwrap{flex:1;overflow:auto;scrollbar-width:none}
.cmpwrap::-webkit-scrollbar{display:none}

/* Form : libellés à droite d'une colonne, champs à droite */
.form{flex:1;overflow:auto;padding:18px 26px 30px;scrollbar-width:none}
.form::-webkit-scrollbar{display:none}
.frow{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start;margin:0 0 14px}
.frow>label{text-align:right;font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3);padding-top:9px}
.fin{width:100%;background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);box-shadow:none;border-radius:0;padding:7px 10px;font-size:var(--da-t-ui);color:var(--da-encre);outline:0}
.fin:focus{border-color:var(--da-encre);outline:var(--da-focus);outline-offset:2px;box-shadow:none}
textarea.fin{min-height:150px;resize:vertical;font-family:var(--da-f-loi);font-size:var(--da-t-loi);line-height:var(--da-l-loi);background:var(--da-papier-2)}
select.fin{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
select.fin option{background:var(--da-papier);color:var(--da-encre)}
.fdesc{font-size:var(--da-t-s);color:var(--da-encre-3);margin-top:6px}
.fstatic{padding-top:7px;font-size:var(--da-t-ui)}
.fsep{height:1px;background:var(--da-filet-fort);margin:4px 0 16px 166px}
.live{min-height:60px}
.live ins{font-weight:400;background:none;color:inherit;text-decoration:underline var(--da-ins) 1px}

:focus-visible{outline:var(--da-focus);outline-offset:2px}

/* ---------- écran étroit : la fenêtre occupe l'écran ---------- */
@media (max-width:720px){
  #win,#win.large{left:0;top:0;transform:none;width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none;border:0}
  #win.compact{height:56px}
  #desk .hint{display:none}
  .split{grid-template-columns:1fr}.split>.list{border-right:0}.split>.det{display:none}
  .row{height:44px}
  .row .st{display:none}
  .row .tt{max-width:none;flex:1}
  .split .row .tt{max-width:none}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px;padding:0 12px 8px}
  .dview{flex-direction:column;overflow:auto}
  .dview>.md{overflow:visible;flex:none}
  .dview>.meta{width:auto;border-left:0;border-top:var(--da-trait) solid var(--da-filet-fort);overflow:visible}
  .md{padding:14px 16px 20px}
  .frow{grid-template-columns:1fr;gap:4px}.frow>label{text-align:left;padding-top:0}.fsep{margin-left:0}
  .form{padding:14px 16px 24px}
  .cmpwrap{overflow-x:auto;scroll-snap-type:x mandatory}
  .cmp{grid-template-columns:repeat(3,86vw)}
  .cmp>div{scroll-snap-align:start}
  #loupe .lc{grid-template-columns:1fr}
  #pill .act2 .lbl{display:none}
  #pill button[data-primary] .lbl{max-width:150px;overflow:hidden;text-overflow:ellipsis}
  #foot .toast .msg,#foot .toast .ta{display:none}
  #foot .left .nm{max-width:150px}
  .lx{font-size:var(--da-t-loi-c);line-height:var(--da-l-loi-c)}
  .cell .tile{padding:18px 8px 8px}
  .cell .tile::before{height:10px}
}
</style>
</head>
<body>
<div id="desk"><div class="hint"></div></div>
<div id="win" role="application" aria-label="Boussole">
  <div id="head">
    <button id="back" title="Revenir (Échap)" aria-label="Revenir" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="glyph" id="glyph"></span>
    <input id="q" spellcheck="false" autocomplete="off" aria-label="Rechercher">
    <div id="htitle" hidden></div>
    <button id="dd" hidden aria-haspopup="listbox"></button>
  </div>
  <div id="hr"></div>
  <div id="body"></div>
  <div id="foot"><div class="left" id="fl"></div><div id="pill"></div></div>
</div>
<script>window.MAQ = "raycast";</script>

<!--APP-->
</body>
</html>

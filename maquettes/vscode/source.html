<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boussole · inspiration VS Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap">
<!--DA-->
<style>
/* Forme : direction artistique « Le bordereau » (direction-artistique/DA.md, jetons --da-* de da.css).
   Structure inchangée : celle de VS Code (barre de titre 35, barre d'activité 48, onglets 35, fil d'Ariane 22, lignes 22, barre d'état 22).
   Thème clair uniquement : l'interrupteur (data-theme dark / light) reste, ses deux positions affichent ce même thème. */
:root,[data-theme="dark"],[data-theme="light"]{
  color-scheme:light;
  --editor:var(--da-papier); --chrome:var(--da-bureau); --border:var(--da-filet-fort); --fg:var(--da-encre); --fg-strong:var(--da-encre); --muted:var(--da-encre-3); --dim:var(--da-encre-3);
  --accent:var(--da-encre); --link:var(--da-encre); --input:var(--da-papier); --input-b:var(--da-filet-fort); --widget:var(--da-papier); --widget-b:var(--da-filet-fort); --quick:var(--da-papier);
  --sel:var(--da-papier-2); --sel-in:var(--da-papier-2); --hover:var(--da-papier-2); --badge-bg:transparent; --badge-fg:var(--da-encre);
  --ins-bg:transparent; --del-bg:transparent; --ins-fg:var(--da-ins); --del-fg:var(--da-del); --g-add:var(--da-ins); --g-del:var(--da-del); --g-mod:var(--da-encre-2);
  --warn:var(--da-encre-2); --match:var(--da-papier-2); --act-fg:var(--da-encre); --act-in:var(--da-encre-3); --ok:var(--da-encre); --err:var(--da-encre-3);
  --shadow:var(--da-ombre-flottant);
}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;height:100%;background:var(--da-bureau);color:var(--fg);
  font:var(--da-t-ui)/var(--da-l-ui) var(--da-f-ui);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:var(--da-focus);outline-offset:2px}
.mono{font-family:var(--da-f-num);font-weight:700}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter;flex:none}
b{font-weight:600}

/* ---------- squelette : title bar 35, activity bar 48, status bar 22 ---------- */
#app{display:grid;height:100%;grid-template-columns:48px var(--sidew,260px) 1fr;grid-template-rows:35px 1fr 22px;
  grid-template-areas:"title title title" "act side main" "status status status"}
#app.noside{--sidew:0px}
#title{grid-area:title;background:var(--da-bureau);border-bottom:var(--da-trait) solid var(--da-filet-fort);display:flex;align-items:center;justify-content:center;position:relative;padding:0 8px}
#title .app{position:absolute;left:12px;color:var(--da-encre-3);font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase}
#cc{width:min(600px,60vw);height:24px;border:var(--da-trait) solid var(--da-filet-fort);background:var(--da-papier);
  display:flex;align-items:center;justify-content:center;gap:6px;color:var(--da-encre-2);font-size:12px}
#cc:hover{border-color:var(--da-encre)}
#title .right{position:absolute;right:8px;display:flex;gap:2px}
.iconbtn{width:24px;height:22px;display:grid;place-items:center;color:var(--da-encre-2)}
.iconbtn:hover{background:var(--da-papier-2);color:var(--da-encre)}
.iconbtn.on{outline:var(--da-trait) solid var(--da-encre);outline-offset:-1px;color:var(--da-encre)}

#act{grid-area:act;background:var(--da-bureau);border-right:var(--da-trait) solid var(--da-filet-fort);display:flex;flex-direction:column;align-items:center}
#act button{width:48px;height:48px;display:grid;place-items:center;color:var(--act-in);position:relative}
#act button svg{width:24px;height:24px;stroke-width:1.5}
#act button:hover{color:var(--act-fg)}
#act button.on{color:var(--act-fg)}
#act button.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--da-encre)}
#act .badge{position:absolute;right:7px;bottom:8px;min-width:16px;height:16px;background:var(--da-encre);color:var(--da-papier);font:700 10px/1 var(--da-f-num);display:grid;place-items:center;padding:0 3px}
#act .sp{flex:1}

#side{grid-area:side;background:var(--da-papier);border-right:var(--da-trait) solid var(--da-filet-fort);overflow:hidden;display:flex;flex-direction:column;min-width:0}
#app.noside #side{display:none}
.side-title{height:35px;display:flex;align-items:center;padding:0 8px 0 20px;font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);text-transform:uppercase;letter-spacing:var(--da-caps-ls);color:var(--da-encre-3);flex:none}
.side-title .act{margin-left:auto;display:flex;gap:2px}
.side-scroll{overflow:auto;flex:1;scrollbar-width:none}.side-scroll::-webkit-scrollbar{display:none}
.sec{border-top:var(--da-trait) solid var(--da-filet)}
.sec-h{height:22px;display:flex;align-items:center;gap:2px;padding-right:8px;font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);text-transform:uppercase;letter-spacing:var(--da-caps-ls);color:var(--da-encre-3);cursor:pointer;user-select:none}
.sec-h .chev{width:20px;display:grid;place-items:center;transition:transform .1s}
.sec.closed .chev{transform:rotate(-90deg)} .sec.closed .sec-b{display:none}
.sec-h .act{margin-left:auto;display:none}.sec:hover .sec-h .act{display:flex}
/* le bordereau : chaque section de la barre latérale est un bordereau à cadre complet */
.sec-b{margin:0 8px 8px;border:var(--da-trait-fort) solid var(--da-filet-encre);background:var(--da-papier)}
.sec-b>.row{border-bottom:var(--da-trait) solid var(--da-filet-encre)}
.sec-b>.row:last-child{border-bottom:0}
.row{height:22px;display:flex;align-items:center;gap:6px;padding:0 8px 0 calc(var(--ind,1) * 8px);white-space:nowrap;cursor:pointer;color:var(--fg);position:relative}
.row:hover{background:var(--da-papier-2)}
.row.on{background:var(--da-papier-2);outline:var(--da-focus);outline-offset:-2px}
.row .lbl{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.row .desc{color:var(--da-encre-3);font-size:12px;margin-left:2px}
.row .dot,.dot{width:8px;height:8px;flex:none;display:inline-block;vertical-align:1px}
.cnt{min-width:18px;height:16px;border:var(--da-trait) solid var(--da-encre-3);background:transparent;color:var(--da-encre);font:700 11px/1 var(--da-f-num);display:grid;place-items:center;padding:0 4px;flex:none}
.deco{font:700 11px/1 var(--da-f-num);flex:none;width:12px;text-align:center}
.deco.M{color:var(--da-encre-2)}.deco.A{color:var(--da-ins)}.deco.D{color:var(--da-del)}

/* ---------- zone principale : onglets 35, fil d'Ariane 22, éditeur, panneau ---------- */
#main{grid-area:main;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--da-papier)}
#tabs{height:35px;display:flex;background:var(--da-bureau);border-bottom:var(--da-trait) solid var(--da-filet-fort);overflow-x:auto;scrollbar-width:none;flex:none}
.tab{height:35px;display:flex;align-items:center;gap:6px;padding:0 6px 0 12px;border-right:var(--da-trait) solid var(--da-filet-fort);color:var(--da-encre-3);white-space:nowrap;cursor:pointer;background:var(--da-bureau);position:relative;max-width:240px}
.tab .t{overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--da-papier);color:var(--da-encre)}
.tab.on::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--da-encre)}
.tab.on::after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:1px;background:var(--da-papier)}
.tab i{font:normal 700 12px/1 var(--da-f-num);width:16px;text-align:center}
.tab .x{width:20px;height:20px;display:grid;place-items:center;opacity:0}
.tab:hover .x,.tab.on .x{opacity:1}.tab .x:hover{background:var(--da-papier-2)}
.tab.preview .t{font-style:italic}
#crumbs{height:22px;display:flex;align-items:center;gap:2px;padding:0 12px;color:var(--da-encre-3);font-size:12px;flex:none;white-space:nowrap;overflow:hidden;background:var(--da-papier)}
#crumbs b{font-weight:400;cursor:pointer;padding:0 2px}#crumbs b:hover{color:var(--da-encre);background:var(--da-papier-2)}
#crumbs .sep{opacity:.7}
#crumbs .tools{margin-left:auto;display:flex;gap:2px}
#body{flex:1;min-height:0;display:flex;position:relative}
#editor{flex:1;min-width:0;overflow:auto;scrollbar-width:none;position:relative;background:var(--da-papier)}
#editor::-webkit-scrollbar{display:none}
#minimap{width:78px;flex:none;border-left:var(--da-trait) solid var(--da-filet-fort);overflow:hidden;position:relative;display:none;background:var(--da-papier)}
#minimap.on{display:block}
#panel{flex:none;height:var(--panelh,230px);border-top:var(--da-trait) solid var(--da-filet-fort);background:var(--da-papier);display:flex;flex-direction:column;min-height:0}
#panel.off{display:none}
.p-tabs{height:35px;display:flex;align-items:center;gap:18px;padding:0 20px;flex:none}
.p-tab{font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);text-transform:uppercase;letter-spacing:var(--da-caps-ls);color:var(--da-encre-3);height:35px;display:flex;align-items:center;gap:6px;border-bottom:2px solid transparent}
.p-tab.on{color:var(--da-encre);border-bottom-color:var(--da-encre)}
.p-tab .cnt{letter-spacing:0}
.p-tabs .filter{margin-left:auto;display:flex;gap:6px;align-items:center}
.input{height:24px;background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);color:var(--da-encre);padding:0 6px;font:inherit;font-size:12px;min-width:0}
.input::placeholder{color:var(--da-encre-3)}
.input:focus{outline:var(--da-focus);outline-offset:-1px;border-color:var(--da-encre)}
.p-body{flex:1;overflow:auto;scrollbar-width:none;padding:0 0 8px}.p-body::-webkit-scrollbar{display:none}

#status{grid-area:status;background:var(--da-bureau);border-top:var(--da-trait) solid var(--da-filet-fort);display:flex;align-items:center;font-size:12px;color:var(--da-encre-2);padding:0;white-space:nowrap;overflow:hidden}
#status .it{height:22px;display:flex;align-items:center;gap:4px;padding:0 6px;cursor:pointer}
#status .it:hover{background:var(--da-papier-2);color:var(--da-encre)}
#status .rem{color:var(--da-encre);padding:0 10px;border-right:var(--da-trait) solid var(--da-filet-fort);font:700 12px/1 var(--da-f-num);letter-spacing:.06em}
#status .sp{flex:1}
#status svg{width:14px;height:14px}

/* ---------- l'éditeur : gouttière = numéros d'alinéa (Courier Prime), texte de loi en Source Serif 4 ---------- */
.doc{padding:6px 0 60px;max-width:1100px}
.ln{display:grid;grid-template-columns:64px 1fr;min-height:19px;position:relative}
.ln .g{font:700 13px/var(--da-l-loi) var(--da-f-num);color:var(--da-encre-3);text-align:right;padding:0 26px 0 0;position:relative;user-select:none}
.ln .g::after{content:"";position:absolute;right:12px;top:4px;bottom:4px;width:2px;background:var(--gc,transparent)}
.ln.cur .g{color:var(--da-encre)}
.ln.cur{background:var(--da-papier-2)}
.ln .c{font-family:var(--da-f-loi);font-size:var(--da-t-loi);line-height:var(--da-l-loi);max-width:calc(var(--da-mesure) + 28px);padding-right:28px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--da-encre)}
.ln.add .g{--gc:var(--g-add)}.ln.mod .g{--gc:var(--g-mod)}.ln.dl .g{--gc:var(--g-del)}
/* ma rédaction : filet d'or dans la gouttière */
.ln.cur .g{--gc:var(--da-or)}
.lens{grid-column:2;font:12px/20px var(--da-f-ui);color:var(--da-encre-3);padding-top:4px}
.lens a{color:var(--da-encre-3);cursor:pointer;text-decoration:none}.lens a:hover{color:var(--da-encre);text-decoration:underline;text-underline-offset:3px}
.lens .s{margin:0 6px;opacity:.6}
/* corrections apparentes */
.c ins,.peek ins,.md .al ins{color:var(--da-ins);font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;background:none}
.c del,.peek del,.md .al del{color:var(--da-del);background:none;text-decoration:line-through;text-decoration-color:var(--da-del);text-decoration-thickness:1px;opacity:1}
/* passage disputé : pointillé d'encre, plus épais selon le nombre de propositions */
.c mark.pt{background:none;color:inherit;text-decoration:underline dotted var(--da-dispute);text-decoration-thickness:var(--da-dispute-1);text-underline-offset:5px;cursor:pointer}
.c mark.pt.w2{text-decoration-thickness:var(--da-dispute-2)}
.c mark.pt.w3{text-decoration-thickness:var(--da-dispute-3)}
.c mark.pt:hover{background:var(--da-papier-2)}
.cmt,.cmt.mono{color:var(--da-encre-3);font-family:var(--da-f-ui);font-weight:400;font-style:italic}
.kw{color:var(--da-encre);font-weight:700}
.str{color:var(--da-encre-2)}
.hdr{padding:14px 28px 4px 64px;font-size:12px;line-height:18px;color:var(--da-encre-3)}
.hdr h1{font:600 var(--da-t-titre)/var(--da-l-titre) var(--da-f-loi);color:var(--da-encre);margin:6px 0 2px}
.hdr h1 .dot{vertical-align:2px}
.hdr h1>span{font-family:var(--da-f-ui);font-weight:400}
.hdr h2{font:600 var(--da-t-h)/var(--da-l-h) var(--da-f-loi);color:var(--da-encre);margin:18px 0 4px}
.hdr [class^="s-"]{font:600 10.5px/16px var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase}

/* édition en place */
.ed-wrap{grid-column:2;padding-right:28px;max-width:calc(var(--da-mesure) + 28px)}
.ed-wrap textarea{width:100%;min-height:150px;background:var(--da-papier-2);color:var(--da-encre);border:var(--da-trait-fort) solid var(--da-encre);font:var(--da-t-loi)/var(--da-l-loi) var(--da-f-loi);padding:0 4px;resize:vertical}
.ed-wrap textarea:focus{outline:0}
.ed-wrap .live{font:var(--da-t-loi)/var(--da-l-loi) var(--da-f-loi);color:var(--da-encre-3);border-left:2px solid var(--da-filet-fort);padding-left:8px;margin-top:6px;white-space:pre-wrap}
.ed-wrap .live ins{font-weight:400;text-decoration:underline;text-decoration-color:var(--da-ins);text-decoration-thickness:1px;text-underline-offset:3px;background:none;color:var(--da-encre)}
.ed-wrap .live .delpt{display:inline-block;width:2px;height:1em;background:var(--da-del);vertical-align:-2px;margin:0 1px}
.btn{height:26px;padding:0 12px;background:var(--da-bordeaux);border:var(--da-trait-fort) solid var(--da-bordeaux);color:var(--da-papier);font:600 12px/1 var(--da-f-ui);letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#4a171d;border-color:#4a171d}
.btn.sec2{background:var(--da-papier);border-color:var(--da-encre);color:var(--da-encre)}
.btn.sec2:hover{background:var(--da-papier-2)}
.btn kbd{letter-spacing:0;text-transform:none}
.btn:not(.sec2) kbd{background:transparent;border-color:color-mix(in srgb,var(--da-papier) 50%,transparent);color:var(--da-papier)}
.btns{display:flex;gap:8px;margin:8px 0}

/* vue incrustée (peek) : un encart dans la feuille, sans ombre */
.peek{grid-column:1/-1;margin:6px 0 10px 64px;border:var(--da-trait-fort) solid var(--da-filet-encre);background:var(--da-papier);display:grid;grid-template-columns:1fr 300px;min-height:200px;max-height:360px}
.peek-h{grid-column:1/-1;display:flex;align-items:center;gap:8px;height:26px;padding:0 8px 0 12px;background:var(--da-papier-2);border-bottom:var(--da-trait-fort) solid var(--da-filet-encre);font-size:12px}
.peek-h b{font-family:var(--da-f-loi)}
.peek-h .x{margin-left:auto}
.peek-l,.peek-l.mono{overflow:auto;scrollbar-width:none;padding:8px 14px;font:400 var(--da-t-loi-c)/var(--da-l-loi-c) var(--da-f-loi);white-space:pre-wrap;border-right:var(--da-trait) solid var(--da-filet-encre)}
.peek-l .ctx{color:var(--da-encre-3)}
.peek-r{overflow:auto;scrollbar-width:none;background:var(--da-papier)}
.peek-r .row{height:auto;min-height:22px;padding:3px 8px;white-space:normal;align-items:flex-start;border-bottom:var(--da-trait) solid var(--da-filet-encre)}
.peek-r .row .lbl{white-space:normal}
.peek mark{background:none;color:inherit;text-decoration:underline dotted var(--da-dispute);text-underline-offset:5px}

/* liste « problèmes » des concurrents : un bordereau, numéro à la machine à gauche */
.prob{display:flex;align-items:center;gap:8px;height:22px;margin:0 20px;padding:0 8px;cursor:pointer;white-space:nowrap;position:relative;border:var(--da-trait) solid var(--da-filet-encre);border-top:0;border-left-width:var(--da-trait-fort);border-right-width:var(--da-trait-fort)}
.p-group+.prob{border-top:var(--da-trait-fort) solid var(--da-filet-encre)}
.prob:has(+.p-group),.prob:last-child{border-bottom-width:var(--da-trait-fort)}
.prob:hover{background:var(--da-papier-2)}.prob.on{outline:var(--da-focus);outline-offset:-2px}
.prob .n{font:700 13px/20px var(--da-f-num);color:var(--da-encre);width:56px;align-self:stretch;display:flex;align-items:center;border-right:var(--da-trait) solid var(--da-filet-encre)}
.prob .o{color:var(--da-encre);overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.prob .s{color:var(--da-encre-3);font:600 10.5px/16px var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;align-self:stretch;display:flex;align-items:center;padding-left:8px;border-left:var(--da-trait) solid var(--da-filet-encre)}
.prob:has(.s-adopte) .s{color:var(--da-encre)}
.prob .grp{color:var(--da-encre-3);font-size:12px;width:150px;overflow:hidden;text-overflow:ellipsis}
.ico-s{width:16px;text-align:center;font-size:12px;flex:none;color:var(--da-encre-2)}
/* sorts : mention en capitales et filet de marge, sans couleur */
.s-adopte,.s-rejete,.s-tombe,.s-ecarte,.s-attente,.s-retire,.s-ns{color:var(--da-encre-3)}
.s-adopte{color:var(--da-encre)}
.prob::before,.sec-b>.row::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:var(--rule,0 solid transparent)}
.prob:has(.ico-s.s-adopte),.row:has(.ico-s.s-adopte){--rule:var(--da-sort-adopte)}
.prob:has(.ico-s.s-rejete){--rule:var(--da-sort-rejete)}
.prob:has(.ico-s.s-tombe){--rule:var(--da-sort-tombe)}
.prob:has(.ico-s.s-retire){--rule:var(--da-sort-retire)}
.prob:has(.ico-s.s-ecarte) .o,.prob:has(.ico-s.s-ecarte) .n{color:var(--da-encre-3)}
.p-group{height:22px;display:flex;align-items:center;gap:6px;padding:0 20px;font:600 var(--da-t-ui)/1.3 var(--da-f-ui);letter-spacing:var(--da-chev-ls);text-transform:uppercase;color:var(--da-encre)}
.p-group .cnt{letter-spacing:0}

/* diff côte à côte, groupes d'éditeurs */
.split{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));min-height:100%}
.split>.pane{border-left:var(--da-trait) solid var(--da-filet-fort);min-width:0;background:var(--da-papier)}
.split>.pane:first-child{border-left:0}
.split>.pane.ref{background:var(--da-papier-ref)}
.pane-h{height:26px;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:12px;color:var(--da-encre-3);border-bottom:var(--da-trait-fort) solid var(--da-filet-encre);position:sticky;top:0;background:inherit;z-index:1;white-space:nowrap;overflow:hidden}
.pane-h b{color:var(--da-encre);font-weight:600;letter-spacing:var(--da-caps-ls);text-transform:uppercase;font-size:var(--da-t-caps)}
.pane.mine .pane-h{box-shadow:inset 0 2px 0 var(--da-or)}
.pane.mine .pane-h b{color:var(--da-bordeaux)}
.pane .ln{grid-template-columns:44px 1fr}.pane .ln .g{padding-right:14px}.pane .ln .g::after{right:4px}
.pane .ln .c{font-size:var(--da-t-loi-c);line-height:var(--da-l-loi-c)}.pane .ln .g{line-height:var(--da-l-loi-c)}
.fold{grid-column:1/-1;margin:2px 0 2px 44px;height:22px;display:flex;align-items:center;gap:6px;color:var(--da-encre-3);font-size:12px;background:var(--da-papier-2);border:var(--da-trait) dashed var(--da-filet-fort);padding:0 10px;cursor:pointer}
.fold:hover{color:var(--da-encre)}

/* survol (hover card) : couche flottante */
#hover{position:fixed;z-index:50;max-width:440px;background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);box-shadow:var(--da-ombre-flottant);font-size:13px;display:none}
#hover .hb{padding:6px 10px}
#hover .hf{border-top:var(--da-trait) solid var(--da-filet);padding:4px 10px;display:flex;gap:12px}
#hover .hf a{color:var(--da-encre);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* palette de commandes (quick pick) : couche flottante, largeur 600 */
#qp{position:fixed;top:44px;left:50%;transform:translateX(-50%);width:min(600px,calc(100vw - 24px));background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);box-shadow:var(--da-ombre-flottant);z-index:60;display:none;padding:6px}
#qp input{width:100%;height:28px;background:var(--da-papier);border:var(--da-trait-fort) solid var(--da-encre);color:var(--da-encre);padding:0 8px;font:inherit;outline:0}
#qp .list{max-height:min(420px,60vh);overflow:auto;margin-top:6px;scrollbar-width:none}#qp .list::-webkit-scrollbar{display:none}
#qp .it{display:flex;align-items:center;gap:8px;height:24px;padding:0 8px;cursor:pointer;white-space:nowrap}
#qp .it:hover{background:var(--da-papier-2)}
#qp .it .d{color:var(--da-encre-3);font-size:12px;overflow:hidden;text-overflow:ellipsis}
#qp .it .k{margin-left:auto;display:flex;gap:3px}
#qp .it.on{background:var(--da-papier-2);outline:var(--da-focus);outline-offset:-2px}
#qp .it b{color:var(--da-encre);font-weight:700;text-decoration:underline;text-underline-offset:3px}
#qp .sepr{display:flex;justify-content:flex-end;font:600 10px/16px var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3);border-top:var(--da-trait) solid var(--da-filet);margin-top:4px;padding:2px 8px 0}
kbd{font:700 11px/1 var(--da-f-num);border:var(--da-trait) solid var(--da-encre-3);padding:2px 4px;background:var(--da-papier);color:var(--da-encre-2)}

/* notifications : couche flottante, largeur 450, coin bas droit */
#toasts{position:fixed;right:12px;bottom:32px;z-index:70;display:flex;flex-direction:column;gap:8px;width:min(450px,calc(100vw - 24px))}
.toast{background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);box-shadow:var(--da-ombre-flottant);padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.toast .i{color:var(--da-encre-2)}
.toast .a{margin-left:auto;display:flex;gap:6px;flex:none}.toast .btn{white-space:nowrap}

/* aperçu Markdown (enjeux), tableaux, notebook (réunion) */
.md{max-width:880px;padding:18px 40px 80px;font-size:var(--da-t-ui);line-height:var(--da-l-ui)}
.md h1{font:600 var(--da-t-titre)/var(--da-l-titre) var(--da-f-loi);border-bottom:var(--da-trait-fort) solid var(--da-filet-encre);padding-bottom:6px;margin:6px 0 12px;color:var(--da-encre)}
.md h2{font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;border-bottom:var(--da-trait) solid var(--da-filet-encre);padding-bottom:4px;margin:26px 0 10px;color:var(--da-encre-3)}
.md blockquote{margin:8px 0;padding:2px 14px;border-left:2px solid var(--da-filet-fort);background:var(--da-papier-ref);color:var(--da-encre-2)}
.md code,.welcome code{font:700 12px var(--da-f-num);background:var(--da-papier-2);padding:1px 4px}
.md a,.welcome a{color:var(--da-encre);cursor:pointer;text-decoration:underline;text-decoration-color:var(--da-filet-fort);text-underline-offset:3px}
.md a:hover,.welcome a:hover{text-decoration-color:var(--da-encre)}
.md .al{font:var(--da-t-loi)/var(--da-l-loi) var(--da-f-loi);max-width:var(--da-mesure);white-space:pre-wrap;border-left:2px solid var(--da-or);padding:2px 0 2px 12px;margin:6px 0}
table.t{border-collapse:collapse;font-size:13px;width:100%;border:var(--da-trait-fort) solid var(--da-filet-encre);background:var(--da-papier)}
table.t th,table.t td{border:var(--da-trait) solid var(--da-filet-encre);padding:4px 8px;text-align:left;vertical-align:top}
table.t th{font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3);background:var(--da-papier);border-bottom-width:var(--da-trait-fort)}
table.t tr:hover td{background:var(--da-papier-2)}
table.t td.num{text-align:center;font:700 13px var(--da-f-num);cursor:pointer}
table.t td.num:hover{outline:var(--da-focus);outline-offset:-2px}
table.t td[class^="s-"]{font:600 10.5px/20px var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;white-space:nowrap}
table.t tr:has(>td.s-adopte)>td:first-child{border-left:var(--da-sort-adopte)}
table.t tr:has(>td.s-rejete)>td:first-child{border-left:var(--da-sort-rejete)}
table.t tr:has(>td.s-tombe)>td:first-child{border-left:var(--da-sort-tombe)}
table.t tr:has(>td.s-retire)>td:first-child{border-left:var(--da-sort-retire)}
.cellnb table.t td:first-child{font:700 13px var(--da-f-num)}
.heat{background:color-mix(in srgb,var(--da-encre-3) calc(var(--v) * .6%),var(--da-papier))}
.grid-et td{font:13px/20px var(--da-f-loi);height:22px;padding:0 8px;white-space:nowrap}
.grid-et td:first-child{font:700 13px/20px var(--da-f-num)}
.grid-et td.cell{width:110px;text-align:center;font:12px/20px var(--da-f-ui)}
.grid-et tr{cursor:pointer}.grid-et tr.cur td{background:var(--da-papier-2)}.grid-et tr.cur{outline:var(--da-focus);outline-offset:-2px}
.c-mod{color:var(--da-encre)}.c-same{color:var(--da-encre-3)}.c-absent{color:transparent}.c-origine{color:var(--da-encre)}
.cellnb{display:grid;grid-template-columns:62px 1fr;border:var(--da-trait) solid var(--da-filet-encre);margin:0 20px 8px 0;background:var(--da-papier)}
.cellnb:hover{background:var(--da-papier-2)}.cellnb.on{outline:var(--da-focus);outline-offset:-2px}
.cellnb .ex{font:700 13px/20px var(--da-f-num);color:var(--da-encre);text-align:right;padding:8px 10px 0 0}
.cellnb .src{padding:8px 12px;border-left:var(--da-trait) solid var(--da-filet-encre);font-size:var(--da-t-ui);line-height:var(--da-l-ui)}
.cellnb .src .who{font-size:12px;color:var(--da-encre-3);margin-bottom:2px;display:flex;gap:6px;align-items:center}
.cellnb .src .who b{font-weight:600;letter-spacing:var(--da-chev-ls);text-transform:uppercase;color:var(--da-encre);font-size:12px}
.cellnb .out{grid-column:2;border-left:var(--da-trait) solid var(--da-filet-encre);border-top:var(--da-trait) solid var(--da-filet);padding:6px 12px;font:12px/18px var(--da-f-ui);background:var(--da-papier-2)}
.mm-place{position:absolute;left:8px;right:8px;background:var(--da-filet-fort);cursor:pointer}
.mm-place.ad{background:var(--da-encre-2)}.mm-place.on{outline:var(--da-focus);outline-offset:0}
.mm-slider{position:absolute;left:0;right:0;background:color-mix(in srgb,var(--da-encre) 8%,transparent);pointer-events:none}
.welcome{padding:30px 48px 80px;max-width:900px}
.welcome h1{font:600 var(--da-t-titre)/var(--da-l-titre) var(--da-f-loi);margin:0;color:var(--da-encre)}
.welcome .sub{color:var(--da-encre-3);font-size:var(--da-t-h);line-height:var(--da-l-h);margin:2px 0 22px;border-bottom:var(--da-trait) solid var(--da-filet-encre);padding-bottom:8px}
.welcome h3{font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;margin:20px 0 6px;color:var(--da-encre-3)}
.welcome li{margin:3px 0;color:var(--da-encre)}
.empty{padding:24px;color:var(--da-encre-3)}

/* écran étroit : la barre d'activité passe en bas ; la barre latérale devient un tiroir */
@media (max-width:720px){
  #app{grid-template-columns:1fr;grid-template-rows:35px 1fr 48px 22px;grid-template-areas:"title" "main" "act" "status"}
  #act{flex-direction:row;justify-content:space-around;border-right:0;border-top:var(--da-trait) solid var(--da-filet-fort)}
  #act .sp,#act .bottom{display:none}
  #act button.on::before{left:0;right:0;top:0;bottom:auto;width:auto;height:2px}
  #side{position:fixed;left:0;right:0;top:35px;bottom:70px;z-index:40;border-right:0}
  #app.noside #side{display:none}
  #title .app{display:none}#cc{width:calc(100vw - 90px)}
  .ln{grid-template-columns:40px 1fr}.ln .g{padding-right:12px}.ln .g::after{right:4px}
  .ln .c{padding-right:10px;font-size:var(--da-t-loi-c);line-height:var(--da-l-loi-c)}.ln .g{line-height:var(--da-l-loi-c)}
  .peek{margin-left:0;grid-template-columns:1fr;max-height:none}.peek-r{max-height:220px}
  .md{padding:12px 14px 60px}.welcome{padding:20px 16px}
  .split{grid-template-columns:1fr}.split>.pane{border-left:0;border-top:var(--da-trait) solid var(--da-filet-fort)}
  #panel{--panelh:200px}.prob .grp{display:none}
  .prob{margin:0 12px}.p-group{padding-left:12px;padding-right:12px}
  .hdr{padding-left:40px}
  #minimap{display:none!important}
  #status .hide-s{display:none}
  #toasts{bottom:80px}
}
</style>
</head>
<body>
<div id="app">
  <div id="title"><span class="app">Boussole — article 4</span>
    <button id="cc" title="Rechercher (Ctrl+P) · Commandes (F1)"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><span>Boussole — projet de loi logement</span></button>
    <div class="right"><button class="iconbtn" id="b-side" title="Barre latérale (Ctrl+B)"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10"/><path d="M6 3v10"/></svg></button><button class="iconbtn" id="b-panel" title="Panneau (Ctrl+J)"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10"/><path d="M2 9.5h12"/></svg></button></div>
  </div>
  <nav id="act"></nav>
  <aside id="side"></aside>
  <section id="main">
    <div id="tabs" role="tablist"></div>
    <div id="crumbs"></div>
    <div id="body"><div id="editor" tabindex="-1"></div><div id="minimap"></div></div>
    <div id="panel"></div>
  </section>
  <footer id="status"></footer>
</div>
<div id="hover"></div>
<div id="qp"><input id="qp-in" spellcheck="false" autocomplete="off"><div class="list" id="qp-list"></div></div>
<div id="toasts"></div>
<script>window.MAQ = "vscode";</script>

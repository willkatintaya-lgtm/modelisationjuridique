<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boussole · inspiration Linear</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<!--DA-->
<style>
/* Forme : direction « Le bordereau » (direction-artistique/DA.md, jetons --da-* de da.css).
   Les noms de variables de l'inspiration restent ; leurs valeurs sont celles de la direction.
   Thème unique, clair : l'interrupteur clair / sombre reste, ses deux positions affichent ce thème. */
:root,[data-theme="dark"],[data-theme="light"]{
  color-scheme:light;
  --app:var(--da-bureau); --content:var(--da-papier); --panel:var(--da-papier); --l1:var(--da-papier); --l2:var(--da-papier-2); --l3:var(--da-papier-ref); --sec:var(--da-papier); --ter:var(--da-papier-ref); --prim:var(--da-papier);
  --b1:var(--da-filet); --b2:var(--da-filet-fort); --b3:var(--da-encre-3);
  --t1:var(--da-encre); --t2:var(--da-encre-2); --t3:var(--da-encre-3); --t4:var(--da-encre-3);
  --sel:var(--da-papier-2); --hover:var(--da-papier-2);
  --accent:var(--da-encre); --accent-h:var(--da-encre); --brand:var(--da-encre);
  --ins:var(--da-ins); --ins-bg:transparent; --del:var(--da-del);
  --green:var(--da-encre); --yellow:var(--da-encre-2); --orange:var(--da-encre-2); --red:var(--da-encre); --blue:var(--da-encre);
  --sh1:none; --sh2:var(--da-ombre-flottant); --sh3:var(--da-ombre-flottant);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--app);color:var(--t2);
  font:400 var(--da-t-ui)/var(--da-l-ui) var(--da-f-ui);letter-spacing:0;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit;border-radius:0}
input,textarea{font:inherit;color:inherit;letter-spacing:inherit;border-radius:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:var(--da-focus);outline-offset:2px;border-radius:0}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font:700 var(--da-t-ui)/1 var(--da-f-num);letter-spacing:0;color:var(--t1)}
.w5{font-weight:500}.w6{font-weight:600}
.t1{color:var(--t1)}.t3{color:var(--t3)}.t4{color:var(--t4)}
*{scrollbar-width:none}::-webkit-scrollbar{display:none}
/* en-têtes en capitales espacées */
.gh,.sec-h,.props h4,.pgrp .lab,#cmdk .grp,.pop .ph,table.mx th,.activity h3,#help h3,.cmp .cell .k,.ed .live .lab,.al-block .k,.bcol-h,.cyc .l1{font-weight:600;font-size:var(--da-t-caps);line-height:var(--da-l-caps);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3)}

/* ---------- 01 App : L inversé, la barre latérale sur le bureau ---------- */
#app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
#side{display:flex;flex-direction:column;padding:10px 8px 10px 10px;min-height:0;color:var(--t2)}
.ws{display:flex;align-items:center;gap:8px;height:32px;padding:0 4px}
.ws .logo{width:20px;height:20px;border-radius:0;background:var(--da-papier);border:var(--da-trait) solid var(--da-encre);display:grid;place-items:center;color:var(--da-encre);font:700 10px/1 var(--da-f-num)}
.ws b{font-weight:600;color:var(--t1);font-size:12px;letter-spacing:var(--da-chev-ls);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws .sp{flex:1}
.ib{width:28px;height:28px;border-radius:0;display:grid;place-items:center;color:var(--t2);flex:none;border:var(--da-trait) solid transparent}
.ib:hover{background:var(--da-papier-2);color:var(--t1);border-color:var(--da-filet-fort)}
.ib.on{color:var(--t1);background:var(--da-papier);border-color:var(--da-encre)}
.ib.round{border-radius:0;border:var(--da-trait) solid var(--da-filet-fort);width:28px;height:28px}
.ib.round:hover{border-color:var(--da-encre)}
.nav{margin-top:10px;overflow:auto;flex:1;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.ni{display:flex;align-items:center;gap:9px;height:28px;padding:0 8px;border-radius:0;color:var(--t2);cursor:pointer;white-space:nowrap;font-weight:500;border:var(--da-trait) solid transparent}
.ni svg{color:var(--t2);width:15px;height:15px}
.ni:hover{background:var(--da-papier-2)}
.ni.on{background:var(--da-papier);color:var(--t1);border-color:var(--da-encre)}
.ni.on svg{color:var(--t1)}
.ni .n{margin-left:auto;font:700 12px/1 var(--da-f-num);color:var(--t3)}
.ni .lbl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ni.sub{padding-left:28px;font-weight:400}
.nh{display:flex;align-items:center;gap:4px;height:28px;padding:0 8px;margin-top:14px;font-weight:600;font-size:var(--da-t-caps);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3);cursor:pointer;border-radius:0}
.nh:hover{color:var(--t1)}
.nh .car{width:10px;height:10px}
.nh.closed .car{transform:rotate(-90deg)}
.side-foot{display:flex;gap:4px;align-items:center;padding-top:6px}
.side-foot .ib{width:26px;height:26px}
.dotc{width:8px;height:8px;border-radius:0!important;flex:none;box-sizing:border-box;border:1px solid rgba(26,26,26,.3)}

/* ---------- 02-04 : le panneau incrusté = une feuille de papier ---------- */
#main{margin:8px 8px 8px 0;background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);border-radius:0;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;box-shadow:none}
#loc{height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 16px;border-bottom:var(--da-trait) solid var(--da-filet-fort)}
#loc .crumb{display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden;white-space:nowrap;flex:1}
#loc .crumb a{color:var(--t2);font-weight:500;padding:2px 6px;border-radius:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis}
#loc .crumb a:hover{background:var(--da-papier-2);color:var(--t1);text-decoration:underline;text-underline-offset:3px}
#loc .crumb a.last{color:var(--t1);font-weight:600}
#loc .crumb .chev{color:var(--t3);width:12px;height:12px}
#loc .right{display:flex;gap:6px;align-items:center;flex:none}
#menu-btn{display:none}
#viewbar{height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;border-bottom:var(--da-trait-fort) solid var(--da-encre);overflow-x:auto;scrollbar-width:none}
#viewbar::-webkit-scrollbar{display:none}
.vt{height:28px;padding:0 10px;border-radius:0;border:var(--da-trait) solid transparent;color:var(--t2);font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.vt:hover{color:var(--t1);background:var(--da-papier-2);border-color:var(--da-filet-fort)}
.vt.on{color:var(--t1);background:var(--da-papier);border-color:var(--da-encre);font-weight:600}
.vt svg{width:14px;height:14px}
.vt .n{font:700 12px/1 var(--da-f-num);color:var(--t3)}
.vb-sp{flex:1;min-width:8px}
/* boutons : secondaire = cadre d'encre ; primaire = parapheur (valider) ; tertiaire = texte souligné */
.btn{height:28px;padding:0 10px;border-radius:0;border:var(--da-trait-fort) solid var(--da-encre);background:var(--da-papier);color:var(--da-encre);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:none;flex:none}
.btn:hover{background:var(--da-papier-2)}
.btn svg{width:14px;height:14px;color:currentColor}
/* DA § 8 : le bordeaux plein est réservé à la validation ; un « primary » qui ne valide pas reste secondaire */
.btn.primary[data-cmd="valider"]{background:var(--da-bordeaux);border-color:var(--da-bordeaux);color:var(--da-papier)}
.btn.primary[data-cmd="valider"]:hover{background:var(--da-bordeaux)}
.btn.primary svg,.btn.primary kbd{color:var(--da-papier)}
.btn.primary kbd{background:transparent;border-color:var(--da-papier)}
.btn.ghost{background:none;border-color:transparent;box-shadow:none;color:var(--da-encre);text-transform:none;letter-spacing:0;font-weight:500;font-size:13px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.btn.ghost:hover{background:var(--da-papier-2)}
.btn.dashed{border-style:dashed;box-shadow:none;background:none;color:var(--t2)}
.filter{height:28px;border-radius:0;border:var(--da-trait) solid var(--da-encre);background:var(--da-papier);display:flex;align-items:center;gap:6px;padding:0 8px;width:170px;flex:none}
.filter svg{width:14px;height:14px;color:var(--t2)}
.filter input{border:0;background:none;outline:0;min-width:0;flex:1;font-size:12px;color:var(--t1)}
.filter input::placeholder{color:var(--t3)}
.pin{height:24px;border-radius:0;background:var(--da-papier);border:var(--da-trait) solid var(--da-encre);display:flex;align-items:center;gap:5px;padding:0 4px 0 8px;font:700 12px/1 var(--da-f-num);color:var(--t1);flex:none;white-space:nowrap}
.pin button{width:16px;height:16px;border-radius:0;display:grid;place-items:center;color:var(--t2)}
.pin button:hover{background:var(--da-papier-2);color:var(--t1)}
.pin button svg{width:10px;height:10px}

#content{flex:1;min-height:0;display:flex;position:relative}
.split{display:grid;grid-template-columns:var(--listw,320px) minmax(0,1fr) var(--propw,248px);flex:1;min-width:0;min-height:0}
.split.noprops{grid-template-columns:var(--listw,340px) minmax(0,1fr)}
.pane{min-height:0;overflow:auto;min-width:0;scrollbar-width:none}
.pane::-webkit-scrollbar{display:none}
.pane.list{border-right:var(--da-trait-fort) solid var(--da-encre)}
.pane.props{background:var(--da-papier);border-left:var(--da-trait) solid var(--da-filet-fort);padding:14px 16px 40px}
.full{flex:1;min-height:0;overflow:auto;min-width:0;scrollbar-width:none}
.full::-webkit-scrollbar{display:none}

/* ---------- le bordereau : lignes de liste, cadre complet, numéro à la machine à gauche ---------- */
.gh{position:sticky;top:0;z-index:2;height:36px;display:flex;align-items:center;gap:8px;padding:0 14px 0 16px;background:var(--da-papier);cursor:pointer;user-select:none;border-bottom:var(--da-trait-fort) solid var(--da-encre);border-top:var(--da-trait) solid var(--da-encre);margin-top:-1px}
.gh .n{font:700 12px/1 var(--da-f-num);letter-spacing:0;color:var(--t3)}
.gh .car{width:10px;height:10px;color:var(--t3)}
.gh.closed .car{transform:rotate(-90deg)}
.gh .act{margin-left:auto;display:flex;gap:2px}
.row{display:flex;align-items:center;gap:9px;height:38px;padding:0 14px 0 16px;cursor:pointer;white-space:nowrap;color:var(--t2);position:relative;border-bottom:var(--da-trait) solid var(--da-encre);background:var(--da-papier)}
.row:hover{background:var(--da-papier-2)}
.row.on{background:var(--da-papier);outline:var(--da-focus);outline-offset:-2px}
.row.focus{outline:var(--da-focus);outline-offset:-2px}
.row > .id{order:-1;align-self:stretch;display:flex;align-items:center;margin:0 3px 0 0;padding-right:8px;border-right:var(--da-trait) solid var(--da-encre)}
.subs .row > .t4:first-child{order:-2}
.proj .row .id{width:88px}
.row .id{color:var(--t1);font:700 var(--da-t-ui)/1 var(--da-f-num);width:56px;flex:none}
.row .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--t1);font-weight:500}
.row .ti .sub{color:var(--t3);font-weight:400}
.row .dt{color:var(--t3);font:400 12px/1 var(--da-f-num);flex:none;width:44px;text-align:right}
.row .mul{font:700 11px/1 var(--da-f-num);color:var(--t2);border:var(--da-trait) solid var(--da-encre);border-radius:0;padding:2px 5px;flex:none}
.row.read .ti{color:var(--t3);font-weight:400}
.row.two{height:auto;min-height:56px;padding-top:9px;padding-bottom:9px;align-items:flex-start}
.row.two .body{flex:1;min-width:0}
.row.two .ti{display:block}
.row.two .sl{color:var(--t3);font-size:12px;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row.two .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.row .unread{width:6px;height:6px;border-radius:0;background:var(--da-encre);position:absolute;left:6px;top:50%;margin-top:-3px}
.row.two .unread{top:22px}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:0;border:var(--da-trait) solid var(--da-filet-fort);color:var(--t2);font-size:12px;white-space:nowrap;flex:none;background:var(--da-papier);font-weight:400}
button.chip:hover,a.chip:hover{border-color:var(--da-encre);color:var(--t1);background:var(--da-papier-2)}
.chip .lb{width:8px;height:8px;border-radius:0;flex:none;border:var(--da-trait) solid rgba(26,26,26,.3)}
/* groupes (chevalet) : le nom en capitales, un carré de 8 px de la couleur du groupe ; jamais d'aplat */
.av{height:18px;display:inline-flex;align-items:center;gap:4px;background:none;color:var(--da-encre);font:600 10px/1 var(--da-f-ui);letter-spacing:.1em;text-transform:uppercase;flex:none;white-space:nowrap}
.av::before{content:"";width:8px;height:8px;background:var(--g,var(--da-encre-3));flex:none}
.av.lg{height:22px;font-size:10.5px}
.av-badge{position:relative;display:inline-flex;flex:none}
.av-badge .bd{display:none}
/* sorts : mention en capitales espacées, sans couleur ; le filet de marge est porté par la ligne ou la carte */
.si{flex:none;display:inline-flex;align-items:center;width:14px;height:14px;color:var(--t2)}
.si svg{width:14px;height:14px;stroke-width:1.5}
.si.sort{width:auto;height:auto;font:600 10px/16px var(--da-f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--da-encre-3);white-space:nowrap}
.si.sort.s-adopte{color:var(--da-encre)}
.row:has(> .si.sort)::before,.card:has(.top > .si.sort)::before,.pr:has(> .si.sort)::before,.gh:has(> .si.sort)::before,.ev:has(> .si.sort)::before,.row.two:has(.rt > .si.sort)::before,#peek .ph:has(> .si.sort)::before,#cmdk .it:has(> .si.sort)::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:var(--da-sort-aucun)}
.row:has(> .si.s-adopte)::before,.card:has(.top > .si.s-adopte)::before,.pr:has(> .si.s-adopte)::before,.gh:has(> .si.s-adopte)::before,.ev:has(> .si.s-adopte)::before,.row.two:has(.rt > .si.s-adopte)::before,#peek .ph:has(> .si.s-adopte)::before,#cmdk .it:has(> .si.s-adopte)::before{border-left:var(--da-sort-adopte)}
.row:has(> .si.s-rejete)::before,.card:has(.top > .si.s-rejete)::before,.pr:has(> .si.s-rejete)::before,.gh:has(> .si.s-rejete)::before,.ev:has(> .si.s-rejete)::before,.row.two:has(.rt > .si.s-rejete)::before,#peek .ph:has(> .si.s-rejete)::before,#cmdk .it:has(> .si.s-rejete)::before{border-left:var(--da-sort-rejete)}
.row:has(> .si.s-tombe)::before,.card:has(.top > .si.s-tombe)::before,.pr:has(> .si.s-tombe)::before,.gh:has(> .si.s-tombe)::before,.ev:has(> .si.s-tombe)::before,.row.two:has(.rt > .si.s-tombe)::before,#peek .ph:has(> .si.s-tombe)::before,#cmdk .it:has(> .si.s-tombe)::before{border-left:var(--da-sort-tombe)}
.row:has(> .si.s-retire)::before,.card:has(.top > .si.s-retire)::before,.pr:has(> .si.s-retire)::before,.gh:has(> .si.s-retire)::before,.ev:has(> .si.s-retire)::before,.row.two:has(.rt > .si.s-retire)::before,#peek .ph:has(> .si.s-retire)::before,#cmdk .it:has(> .si.s-retire)::before{border-left:var(--da-sort-retire)}
.row:has(> .si.s-ecarte) .ti,.card:has(.top > .si.s-ecarte) .ti{color:var(--da-encre-3)}
/* là où le mot du sort suit déjà la mention (propriété, en-tête de groupe, résumé), seul le filet le dit */
.pr > .si.sort,.gh > .si.sort,.props-inline summary > .si.sort{display:none}
.pr,.ev,#cmdk .it,#peek .ph{position:relative}
.pr:has(> .si.sort),.ev:has(> .si.sort){padding-left:12px}
.bars{display:inline-flex;align-items:flex-end;gap:1.5px;height:12px;flex:none}
.bars i{width:3px;border-radius:0;background:var(--da-filet-fort)}
.bars i.on{background:var(--da-encre)}
.empty{padding:28px 20px;color:var(--t3);text-align:center}

/* ---------- vue issue : la feuille de détail ---------- */
.issue{max-width:760px;margin:0 auto;padding:26px 32px 80px}
.issue.mienne{border-top:2px solid var(--da-or)}
.issue.mienne > .kicker{color:var(--da-bordeaux)}
.issue .kicker{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:var(--da-t-caps);line-height:var(--da-l-caps);font-weight:600;letter-spacing:var(--da-caps-ls);text-transform:uppercase;margin-bottom:8px;flex-wrap:wrap}
.issue .kicker .mono{letter-spacing:0}
.issue h1{font:600 var(--da-t-titre)/var(--da-l-titre) var(--da-f-loi);letter-spacing:0;color:var(--t1);margin:0 0 6px}
.issue .subof{color:var(--t3);font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.issue .subof b{color:var(--t1);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.desc{position:relative;border-radius:0;padding:2px 0}
.al-block{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:8px 0}
.al-block .k{white-space:nowrap}
.al-block.left{grid-template-columns:44px minmax(0,1fr);gap:10px;border-bottom:var(--da-trait) solid var(--da-filet)}
.al-block.left .k{padding-top:5px;font:700 var(--da-t-ui)/1 var(--da-f-num);letter-spacing:0;text-transform:none;color:var(--t1)}
.legal{font:400 var(--da-t-loi)/var(--da-l-loi) var(--da-f-loi);color:var(--t1);max-width:var(--da-mesure);letter-spacing:0;overflow-wrap:anywhere}
.legal.dim{color:var(--t3)}
.legal ins,.al ins,.cl-t ins,.cmp ins,.peek ins,.hist ins{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;color:var(--da-ins);background:none;font-weight:600;border-radius:0;padding:0}
.legal del,.al del,.cl-t del,.cmp del,.peek del,.hist del{text-decoration:line-through;text-decoration-color:var(--da-del);text-decoration-thickness:1px;color:var(--da-del)}
.legal ins[data-h],.legal del[data-h]{cursor:pointer}
/* passage disputé : pointillé d'encre, plus épais selon le nombre de propositions */
mark.pt{background:none;color:inherit;border:0;text-decoration:underline dotted var(--da-dispute);text-decoration-thickness:var(--da-dispute-1);text-underline-offset:5px;text-decoration-skip-ink:none;cursor:pointer;border-radius:0}
mark.pt.w2{text-decoration-thickness:var(--da-dispute-2)}
mark.pt.w3{text-decoration-thickness:var(--da-dispute-3)}
mark.pt:hover,mark.pt.on{background:var(--da-papier-2)}
.lead{color:var(--t3);font-size:13px;margin:0 0 4px}
.editbar{display:flex;gap:6px;margin-top:6px;align-items:center;opacity:0;transition:opacity .1s}
.desc:hover .editbar,.editbar.show{opacity:1}
.ed textarea{width:100%;min-height:170px;resize:vertical;border:var(--da-trait-fort) solid var(--da-encre);border-radius:0;background:var(--da-papier-2);padding:10px 12px;font:400 var(--da-t-loi)/var(--da-l-loi) var(--da-f-loi);color:var(--t1);outline:0;box-shadow:none}
.ed .live{margin-top:8px;padding:8px 12px;border-radius:0;background:var(--da-papier-ref);border-left:2px solid var(--da-filet-fort);font:400 var(--da-t-loi-c)/var(--da-l-loi-c) var(--da-f-loi);color:var(--t2)}
.ed .live .lab{display:block;margin-bottom:2px;font-family:var(--da-f-ui)}
.ed .live ins{text-decoration:underline;text-decoration-color:var(--da-ins);text-decoration-thickness:1px;text-underline-offset:3px;color:inherit;background:none;font-weight:400}
.ed .live .delpt{display:inline-block;width:2px;height:13px;background:var(--da-del);vertical-align:-2px;margin:0 1px;border-radius:0}
.ed .btns{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}

.sec-h{display:flex;align-items:center;gap:8px;margin:30px 0 6px}
.sec-h .n{font:700 12px/1 var(--da-f-num);letter-spacing:0;color:var(--t3)}
.sec-h .act{margin-left:auto;display:flex;gap:4px;text-transform:none;letter-spacing:0;font-weight:400}
.subs{border:var(--da-trait-fort) solid var(--da-encre)}
.subs .row{padding:0 6px;height:36px;border-bottom:var(--da-trait) solid var(--da-encre)}
.subs .row:last-child{border-bottom:0}
.activity{margin-top:34px;border-top:var(--da-trait-fort) solid var(--da-encre);padding-top:18px}
.activity h3{margin:0 0 12px}
.ev{display:flex;gap:10px;align-items:flex-start;color:var(--t3);font-size:12.5px;padding:5px 0 5px 3px}
.ev .av,.ev .si{margin-top:1px}
.ev b{color:var(--t2);font-weight:600}
.ev a{color:var(--t1);cursor:pointer;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.cmt{border:var(--da-trait) solid var(--da-encre);background:var(--da-papier);border-radius:0;padding:10px 14px 12px;margin:10px 0;box-shadow:none}
.cmt .h{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:12px;margin-bottom:4px}
.cmt .h b{color:var(--t1);font-weight:600}
.cmt .tx{color:var(--t2);font-size:13.5px;line-height:1.6}
.cmt.sys{background:var(--da-papier-ref);box-shadow:none;border:var(--da-trait) solid var(--da-filet-fort);border-left:2px solid var(--da-filet-fort)}
.cmt.sys .tx{font-family:var(--da-f-loi)}

/* propriétés */
.props h4{margin:0 0 8px;display:flex;align-items:center}
.props h4 .act{margin-left:auto;display:flex;gap:2px}
.props h4 .act .ib{width:26px;height:26px}
.pr{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 8px;margin:0 -8px;border-radius:0;color:var(--t1);cursor:default}
.pr svg{color:var(--t2)!important}
.pr.click{cursor:pointer}.pr.click:hover{background:var(--da-papier-2)}
.pr .v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .v.t3{color:var(--t3)}
.pgrp{margin-top:18px}
.pgrp .lab{margin-bottom:4px}
.pgrp .chips{display:flex;flex-wrap:wrap;gap:5px}
.props .note{color:var(--t3);font-size:12px;line-height:18px;margin-top:22px}

/* passage disputé : propositions regroupées */
.ctxline{font:400 var(--da-t-loi-c)/var(--da-l-loi-c) var(--da-f-loi);color:var(--t3);background:var(--da-papier-ref);border-left:2px solid var(--da-filet-fort);border-radius:0;padding:10px 14px;margin:6px 0 18px}
.ctxline mark{background:none;color:var(--t1);border-radius:0;text-decoration:underline dotted var(--da-dispute);text-decoration-thickness:var(--da-dispute-2);text-underline-offset:5px}
.cl{border:var(--da-trait) solid var(--da-encre);border-radius:0;margin:10px 0;background:var(--da-papier);overflow:hidden}
.cl.ref{background:var(--da-papier-ref);border:var(--da-trait) solid var(--da-filet-fort);border-left:2px solid var(--da-filet-fort)}
.cl-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:var(--da-trait) solid var(--da-encre);font-size:12px;color:var(--t3)}
.cl.ref .cl-h{border-bottom-color:var(--da-filet-fort)}
.cl-h .cnt{margin-left:auto;color:var(--t3)}
.cl-t{padding:10px 14px 12px;font:400 var(--da-t-loi)/var(--da-l-loi) var(--da-f-loi);color:var(--t1);max-width:calc(var(--da-mesure) + 28px)}

/* comparer : une | la référence | l'autre (sous-grille) */
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px;padding:18px 20px 60px;min-width:0}
.cmp .col{display:grid;grid-template-rows:subgrid;grid-row:span var(--rows);min-width:0;border:var(--da-trait) solid var(--da-filet-fort);border-radius:0;background:var(--da-papier);overflow:hidden}
.cmp .col.ref{background:var(--da-papier-ref);border-left:2px solid var(--da-filet-fort)}
.cmp .col.mienne{border-top:2px solid var(--da-or)}
.cmp .col.mienne .ch span{color:var(--da-bordeaux)}
.cmp .ch{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:var(--da-trait-fort) solid var(--da-encre);color:var(--t1);font-weight:600;min-width:0}
.cmp .ch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--da-t-caps);letter-spacing:var(--da-caps-ls);text-transform:uppercase}
.cmp .ch small{color:var(--t3);font-weight:400;margin-left:auto;white-space:nowrap}
.cmp .cell{padding:10px 14px;border-bottom:var(--da-trait) solid var(--da-filet);font:400 var(--da-t-loi-c)/var(--da-l-loi-c) var(--da-f-loi);color:var(--t1);overflow-wrap:anywhere}
.cmp .cell .k{display:block;margin-bottom:2px;font-family:var(--da-f-ui)}
.cmp .cell.none{color:var(--t3);font:400 12.5px/18px var(--da-f-ui)}

/* vue tableau (board) : des cartes à filet d'encre */
.board{display:flex;gap:10px;padding:12px 14px 30px;min-height:100%;align-items:flex-start;width:max-content}
.bcol{width:280px;flex:none;background:none;border-radius:0;padding:0 6px 6px}
.bcol-h{display:flex;align-items:center;gap:8px;height:40px;padding:0 6px;cursor:pointer;position:sticky;top:0;background:var(--da-papier);border-bottom:var(--da-trait-fort) solid var(--da-encre);margin-bottom:6px;z-index:1}
.bcol-h .n{font:700 12px/1 var(--da-f-num);letter-spacing:0;color:var(--t3)}
.bcol-h .src{margin-left:auto;font-size:10px;color:var(--t3);font-weight:500}
.card{background:var(--da-papier);border:var(--da-trait) solid var(--da-encre);border-radius:0;padding:9px 11px 10px;margin-bottom:6px;cursor:pointer;box-shadow:none;position:relative}
.card:hover{background:var(--da-papier-2)}
.card .top{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t3)}
.card .top .mono{order:-1}
.card .top .av{margin-left:auto}
.card .ti{color:var(--t1);font-weight:500;margin:4px 0 7px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ft{display:flex;gap:5px;flex-wrap:wrap}

/* matrice, grille des étapes : bordereau à cadre complet */
table.mx{border-collapse:collapse;border-spacing:0;font-size:12.5px;min-width:100%;border:var(--da-trait-fort) solid var(--da-encre)}
table.mx th,table.mx td{padding:0 10px;height:36px;text-align:left;white-space:nowrap;border:var(--da-trait) solid var(--da-encre)}
table.mx th{position:sticky;top:0;background:var(--da-papier);z-index:1;border-bottom-width:var(--da-trait-fort)}
table.mx td:first-child{font:700 var(--da-t-ui)/1 var(--da-f-num);color:var(--t1)}
table.mx td:first-child a{font:500 12.5px/1 var(--da-f-ui)}
table.mx td.num{text-align:center;font:700 var(--da-t-ui)/1 var(--da-f-num);color:var(--t1);cursor:pointer;min-width:44px}
table.mx td.num span{display:inline-grid;place-items:center;min-width:26px;height:22px;border-radius:0;background:none}
table.mx td.num:hover span{outline:var(--da-trait) solid var(--da-encre)}
table.mx tr.hov:hover td{background:var(--da-papier-2);cursor:pointer}
table.mx tr.on td{background:var(--da-papier-2)}
table.mx tr.on{outline:var(--da-focus);outline-offset:-2px}
.cellst{display:inline-flex;align-items:center;gap:6px;color:var(--t2);font-size:12px}
.wrap-pad{padding:6px 16px 60px}

/* projet (dossier) */
.proj{max-width:900px;margin:0 auto;padding:28px 36px 80px}
.proj .kicker{font-weight:600;letter-spacing:var(--da-caps-ls);text-transform:uppercase;font-size:var(--da-t-caps)!important}
.proj h1{font:600 var(--da-t-titre)/var(--da-l-titre) var(--da-f-loi);letter-spacing:0;color:var(--t1);margin:6px 0 6px}
.proj .meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px}
.miles{display:flex;gap:0;margin:16px 0 8px;position:relative}
.mile{flex:1;min-width:0;position:relative;padding-top:20px;color:var(--t3);font-size:12px;cursor:pointer}
.mile::before{content:"";position:absolute;top:6px;left:0;right:0;height:0;border-top:var(--da-trait) dashed var(--da-encre-3)}
.mile.done::before{border-top:2px solid var(--da-encre)}
.mile .dm{position:absolute;top:1px;left:0;width:12px;height:12px;border:var(--da-trait-fort) solid var(--da-encre);background:var(--da-papier);border-radius:0}
.mile.done .dm{background:var(--da-encre)}
.mile b{display:block;color:var(--t1);font-weight:600}
.mile:hover b{text-decoration:underline;text-underline-offset:3px}
.hist .st{display:flex;gap:12px;padding:12px 0;border-bottom:var(--da-trait) solid var(--da-encre)}
.hist .st .dm{width:8px;height:8px;border-radius:0;background:none;border:var(--da-trait) solid var(--da-encre-3);margin-top:6px;flex:none}
.hist .st.mod .dm{background:var(--da-encre-2);border-color:var(--da-encre-2)}
.hist .st.org .dm{background:var(--da-encre);border-color:var(--da-encre)}
.hist .st .b{flex:1;min-width:0}
.hist .st .lab{color:var(--t1);font-weight:600;font-size:var(--da-t-caps);letter-spacing:var(--da-caps-ls);text-transform:uppercase}
.hist .st .lab span{color:var(--t3);font-weight:500;margin-left:6px}

/* réunion : le cycle */
.cyc{padding:14px 16px 12px;border-bottom:var(--da-trait-fort) solid var(--da-encre)}
.cyc .l1{display:flex;align-items:center;gap:8px}
.cyc .l2{color:var(--t3);font-size:12px;margin:2px 0 10px}
.strip{display:flex;gap:2px;height:18px;align-items:stretch}
.strip i{display:block;border-radius:0;background:var(--da-filet-fort);cursor:pointer;min-width:3px}
.strip i.ad{background:var(--da-encre)}
.strip i:hover{background:var(--da-encre-3)}
.strip i.on{outline:var(--da-focus);outline-offset:1px}
.bigstrip{padding:22px 24px 60px;max-width:980px}
.bs-row{display:grid;grid-template-columns:44px minmax(0,1fr) 70px;align-items:center;gap:10px;height:30px;cursor:pointer;border-radius:0;padding:0 6px;border-bottom:var(--da-trait) solid var(--da-filet)}
.bs-row:hover{background:var(--da-papier-2)}
.bs-row .bar{height:12px;border-radius:0;background:var(--da-filet-fort)}
.bs-row.ad .bar{background:var(--da-encre)}
.bs-row .lbl{font-size:12px;color:var(--t3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bs-row .barw{display:flex;align-items:center;gap:8px;min-width:0}

/* ---------- couches flottantes : ⌘K, aide, aperçu, menus, bulle, toast (seules ombres admises) ---------- */
.scrim{position:fixed;inset:0;background:rgba(26,26,26,.18);z-index:80;display:none}
.scrim.on{display:block}
#cmdk{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(640px,calc(100vw - 24px));background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);border-radius:0;box-shadow:var(--da-ombre-flottant);z-index:90;display:none;overflow:hidden}
#cmdk .ctx{display:inline-flex;margin:12px 0 0 16px;font:600 var(--da-t-caps)/var(--da-l-caps) var(--da-f-ui);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--t3);background:none;border:var(--da-trait) solid var(--da-encre);border-radius:0;padding:2px 8px}
#cmdk input{width:100%;height:52px;border:0;background:none;outline:0;padding:0 18px;font-size:16px;color:var(--t1)}
#cmdk input::placeholder{color:var(--t3)}
#cmdk .list{max-height:min(420px,56vh);overflow:auto;border-top:var(--da-trait-fort) solid var(--da-encre);padding:6px}
#cmdk .grp{padding:10px 10px 4px}
#cmdk .it{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:0;cursor:pointer;color:var(--t1);white-space:nowrap;border-bottom:var(--da-trait) solid var(--da-filet)}
#cmdk .it svg{color:var(--t2)}
#cmdk .it .d{color:var(--t3);overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:12.5px}
#cmdk .it .k{margin-left:auto;display:flex;gap:4px;flex:none}
#cmdk .it.on{background:var(--da-papier-2);outline:var(--da-focus);outline-offset:-2px}
kbd{font:700 11px/1 var(--da-f-num);letter-spacing:0;background:var(--da-papier);box-shadow:none;border:var(--da-trait) solid var(--da-encre-3);border-radius:0;padding:3px 6px;min-width:20px;display:inline-grid;place-items:center;color:var(--t1);height:20px}
#help{position:fixed;right:12px;top:12px;bottom:12px;width:min(420px,calc(100vw - 24px));background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);border-radius:0;box-shadow:var(--da-ombre-flottant);z-index:90;display:none;flex-direction:column;overflow:hidden}
#help.on{display:flex}
#help .hh{display:flex;align-items:center;padding:16px 16px 8px 20px;border-bottom:var(--da-trait-fort) solid var(--da-encre)}
#help .hh h2{margin:0;font:600 var(--da-t-h)/var(--da-l-h) var(--da-f-ui);color:var(--t1);flex:1}
#help .srch{margin:10px 16px 6px 20px;height:34px;border:var(--da-trait) solid var(--da-encre);border-radius:0;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--da-papier)}
#help .srch input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--t1)}
#help .hb{overflow:auto;padding:4px 16px 30px 20px}
#help h3{margin:18px 0 6px}
#help .hk{display:flex;align-items:center;gap:6px;min-height:34px;color:var(--t2);border-bottom:var(--da-trait) solid var(--da-filet)}
#help .hk span:first-child{flex:1}
#help .hk .or{font-size:12px;color:var(--t3)}
#peek{position:fixed;top:8vh;left:50%;transform:translateX(-50%);width:min(720px,calc(100vw - 24px));max-height:84vh;overflow:auto;background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);border-radius:0;box-shadow:var(--da-ombre-flottant);z-index:90;display:none}
#peek.on{display:block}
#peek .ph{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:var(--da-trait-fort) solid var(--da-encre);color:var(--t3);font-size:12px;position:sticky;top:0;background:var(--da-papier);z-index:1}
#peek .ph b{color:var(--t1);font-weight:600}
#peek .pb{padding:16px 22px 22px}
#peek h2{font:600 var(--da-t-titre)/var(--da-l-titre) var(--da-f-loi);color:var(--t1);margin:0 0 10px;letter-spacing:0}
.pop{position:fixed;z-index:95;min-width:220px;max-width:min(360px,calc(100vw - 16px));max-height:60vh;overflow:auto;background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);border-radius:0;box-shadow:var(--da-ombre-flottant);padding:4px;display:none}
.pop.on{display:block}
.pop .pi{display:flex;align-items:center;gap:8px;min-height:32px;padding:4px 8px;border-radius:0;cursor:pointer;color:var(--t1);border-bottom:var(--da-trait) solid var(--da-filet)}
.pop .pi:hover,.pop .pi.on{background:var(--da-papier-2)}
.pop .pi .d{color:var(--t3);font-size:12px;margin-left:auto;padding-left:10px;white-space:nowrap}
.pop .pi .ck{width:14px;color:var(--da-encre)}
.pop .ph{padding:6px 8px 4px}
.pop .peek{font-family:var(--da-f-loi)}
#tip{position:fixed;left:50%;bottom:22px;transform:translate(-50%,8px);background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);border-radius:0;box-shadow:var(--da-ombre-flottant);padding:6px 8px 6px 14px;display:flex;align-items:center;gap:8px;color:var(--t2);font-size:12.5px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;max-width:calc(100vw - 24px)}
#tip.on{opacity:1;transform:translate(-50%,0)}
#tip .k{display:flex;gap:4px;align-items:center}
#toast{position:fixed;right:18px;bottom:18px;background:var(--da-papier);border:var(--da-trait) solid var(--da-filet-fort);border-radius:0;box-shadow:var(--da-ombre-flottant);padding:10px 14px;z-index:99;color:var(--t1);display:none;max-width:min(380px,calc(100vw - 24px));font-size:12.5px}
#toast.on{display:block}
#toast a{text-decoration:underline;text-underline-offset:3px;color:var(--da-encre)!important}
.readme{max-width:760px;margin:0 auto;padding:28px 36px 80px;font-size:14px;line-height:1.65;color:var(--t2)}
.readme h1{font:600 var(--da-t-titre)/var(--da-l-titre) var(--da-f-loi);color:var(--t1);letter-spacing:0;margin:0 0 4px}
.readme h2{font-weight:600;font-size:var(--da-t-caps);line-height:var(--da-l-caps);letter-spacing:var(--da-caps-ls);text-transform:uppercase;color:var(--da-encre-3);margin:26px 0 6px;padding-bottom:4px;border-bottom:var(--da-trait-fort) solid var(--da-encre)}
.readme li{margin:3px 0}
.readme a{color:var(--da-encre);text-decoration:underline;text-underline-offset:3px}
.readme .src{color:var(--t3);font-size:12.5px}
[style*="--accent-h"]{text-decoration:underline;text-underline-offset:3px}
.mback{display:none}
#scrim-side{display:none}

/* ---------- largeurs intermédiaires : les propriétés passent sous le détail ---------- */
@media (max-width:1180px){
  .split{grid-template-columns:var(--listw,320px) minmax(0,1fr)}
  .pane.props{display:none}
  .props-inline{display:block!important}
}
.props-inline{display:none;border:var(--da-trait) solid var(--da-encre);border-radius:0;padding:0 12px;margin:0 0 16px;background:var(--da-papier)}
.props-inline summary{list-style:none;display:flex;align-items:center;gap:7px;min-height:38px;cursor:pointer;color:var(--t1);flex-wrap:wrap;padding:4px 0}
.props-inline summary::-webkit-details-marker{display:none}
.props-inline summary .t4{margin-left:auto;font-size:var(--da-t-caps);font-weight:600;letter-spacing:var(--da-caps-ls);text-transform:uppercase}
.props-inline[open]{padding-bottom:12px}
.props-inline[open] summary{border-bottom:var(--da-trait) solid var(--da-filet);margin-bottom:6px}
.props-inline .pgrp:first-child{margin-top:0}
.props-inline .prow{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- mobile : barre latérale en tiroir, une colonne ---------- */
@media (max-width:760px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:85;background:var(--app);transform:translateX(-100%);transition:transform .25s;box-shadow:var(--da-ombre-flottant)}
  #side.open{transform:none}
  #scrim-side.on{display:block;position:fixed;inset:0;z-index:84;background:rgba(26,26,26,.3)}
  #main{margin:0;border-radius:0;border:0}
  #menu-btn{display:grid}
  #loc{padding-left:6px}
  .split,.split.noprops{grid-template-columns:1fr}
  .split.m-detail .pane.list{display:none}
  .split.m-list .pane.detail{display:none}
  .pane.list{border-right:0}
  .mback{display:inline-flex}
  .issue,.proj,.readme{padding:18px 16px 70px}
  .issue h1{font-size:var(--da-t-titre)}
  .al-block{grid-template-columns:1fr;gap:2px}
  .legal{font-size:var(--da-t-loi-c);line-height:var(--da-l-loi-c)}
  .filter{width:130px}
  .cmp{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding:14px 16px 60px}
  .cmp .col{flex:0 0 86%;display:block;scroll-snap-align:center}
  .bcol{width:250px}
  .hide-m{display:none!important}
  .mile{font-size:11px}.mile .sub2{display:none}
  .row .dt{display:none}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <section id="main">

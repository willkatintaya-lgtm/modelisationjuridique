<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boussole · inspiration Linear</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Jetons relevés sur le site et l'application (clair | sombre) ; refonte 2026 : gris plus chauds, bordures adoucies */
:root,[data-theme="dark"]{
  --app:#0b0b0c; --content:#101112; --panel:#151619; --l1:#0f1011; --l2:#141516; --l3:#191a1b; --sec:#1c1c1f; --ter:#232326; --prim:#08090a;
  --b1:#222428; --b2:#2e2f34; --b3:#3a3b41;
  --t1:#f7f8f8; --t2:#d0d6e0; --t3:#8a8f98; --t4:#62666d;
  --sel:#1b1d21; --hover:color-mix(in lch,#fff 4%,transparent);
  --accent:#7170ff; --accent-h:#828fff; --brand:#5e6ad2;
  --ins:#a3a3ff; --ins-bg:color-mix(in lch,#7170ff 17%,transparent); --del:#eb5757;
  --green:#27a644; --yellow:#f0bf00; --orange:#fc7840; --red:#eb5757; --blue:#4ea7fc;
  --sh1:0 1px 4px -1px #0000004d; --sh2:0 3px 12px #00000059; --sh3:0 7px 32px #00000080;
}
[data-theme="light"]{
  --app:#ebebea; --content:#fbfbfb; --panel:#f8f8f7; --l1:#f8f8f8; --l2:#f4f4f4; --l3:#f0f0f0; --sec:#f9f8f9; --ter:#f1f0f1; --prim:#fff;
  --b1:#e9e8ea; --b2:#e0dee1; --b3:#d3d1d5;
  --t1:#282a30; --t2:#3c4149; --t3:#6f6e77; --t4:#86848d;
  --sel:#ecedf1; --hover:color-mix(in lch,#000 3.5%,transparent);
  --ins:#4746c9; --ins-bg:color-mix(in lch,#7170ff 12%,transparent); --del:#d43c3c;
  --sh1:0 1px 4px -1px #00000017; --sh2:0 3px 12px #00000017; --sh3:0 7px 24px #0000001f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--app);color:var(--t2);
  font:400 13px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em;font-feature-settings:"cv01","ss03";-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid color-mix(in lch,var(--accent) 60%,transparent);outline-offset:1px;border-radius:6px}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;letter-spacing:0}
.w5{font-weight:500}.w6{font-weight:600}
.t1{color:var(--t1)}.t3{color:var(--t3)}.t4{color:var(--t4)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:color-mix(in lch,var(--t3) 25%,transparent);border-radius:10px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}

/* ---------- 01 App : L inversé, la barre latérale sur le fond de l'application ---------- */
#app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
#side{display:flex;flex-direction:column;padding:10px 8px 10px 10px;min-height:0;color:var(--t2)}
.ws{display:flex;align-items:center;gap:8px;height:32px;padding:0 4px}
.ws .logo{width:20px;height:20px;border-radius:5px;background:var(--brand);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:600}
.ws b{font-weight:600;color:var(--t1);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws .sp{flex:1}
.ib{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--t3);transition:background .1s,color .1s;flex:none}
.ib:hover{background:var(--hover);color:var(--t1)}
.ib.on{color:var(--t1);background:var(--ter)}
.ib.round{border-radius:999px;border:1px solid var(--b2);width:28px;height:28px}
.ib.round:hover{border-color:var(--b3)}
.nav{margin-top:10px;overflow:auto;flex:1;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.ni{display:flex;align-items:center;gap:9px;height:28px;padding:0 8px;border-radius:6px;color:var(--t2);cursor:pointer;white-space:nowrap;font-weight:500;transition:background .1s}
.ni svg{color:var(--t3);width:15px;height:15px}
.ni:hover{background:var(--hover)}
.ni.on{background:var(--ter);color:var(--t1)}
.ni.on svg{color:var(--t1)}
.ni .n{margin-left:auto;font-size:12px;color:var(--t3);font-weight:400}
.ni .lbl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ni.sub{padding-left:28px;font-weight:400}
.nh{display:flex;align-items:center;gap:4px;height:28px;padding:0 8px;margin-top:14px;font-size:12px;color:var(--t3);font-weight:500;cursor:pointer;border-radius:6px}
.nh:hover{color:var(--t2)}
.nh .car{width:10px;height:10px;transition:transform .1s}
.nh.closed .car{transform:rotate(-90deg)}
.side-foot{display:flex;gap:4px;align-items:center;padding-top:6px}
.side-foot .ib{width:26px;height:26px}
.dotc{width:9px;height:9px;border-radius:3px;flex:none}

/* ---------- 02-04 : le panneau incrusté, plus clair, à coins arrondis ---------- */
#main{margin:8px 8px 8px 0;background:var(--content);border:1px solid var(--b1);border-radius:12px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;box-shadow:var(--sh1)}
#loc{height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 16px;border-bottom:1px solid color-mix(in lch,var(--b1) 70%,transparent)}
#loc .crumb{display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden;white-space:nowrap;flex:1}
#loc .crumb a{color:var(--t2);font-weight:500;padding:2px 6px;border-radius:5px;cursor:pointer;overflow:hidden;text-overflow:ellipsis}
#loc .crumb a:hover{background:var(--hover);color:var(--t1)}
#loc .crumb a.last{color:var(--t1)}
#loc .crumb .chev{color:var(--t4);width:12px;height:12px}
#loc .right{display:flex;gap:6px;align-items:center;flex:none}
#menu-btn{display:none}
#viewbar{height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;border-bottom:1px solid color-mix(in lch,var(--b1) 70%,transparent);overflow-x:auto;scrollbar-width:none}
#viewbar::-webkit-scrollbar{display:none}
.vt{height:28px;padding:0 10px;border-radius:999px;border:1px solid transparent;color:var(--t3);font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none;transition:color .1s,background .1s}
.vt:hover{color:var(--t1);background:var(--hover)}
.vt.on{color:var(--t1);background:var(--ter);border-color:var(--b2)}
.vt svg{width:14px;height:14px}
.vt .n{color:var(--t3);font-weight:400}
.vb-sp{flex:1;min-width:8px}
.btn{height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--b2);background:var(--sec);color:var(--t1);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:var(--sh1);transition:background .1s,border-color .1s;flex:none}
.btn:hover{border-color:var(--b3);background:var(--ter)}
.btn svg{width:14px;height:14px;color:var(--t3)}
.btn.primary{background:var(--brand);border-color:color-mix(in lch,var(--brand) 80%,#fff);color:#fff}
.btn.primary:hover{background:color-mix(in lch,var(--brand) 88%,#fff)}
.btn.primary svg{color:#fff}
.btn.ghost{background:none;border-color:transparent;box-shadow:none;color:var(--t2)}
.btn.ghost:hover{background:var(--hover)}
.btn.dashed{border-style:dashed;box-shadow:none;background:none;color:var(--t3)}
.filter{height:28px;border-radius:6px;border:1px solid var(--b2);background:var(--l2);display:flex;align-items:center;gap:6px;padding:0 8px;width:170px;flex:none}
.filter svg{width:14px;height:14px;color:var(--t4)}
.filter input{border:0;background:none;outline:0;min-width:0;flex:1;font-size:12px;color:var(--t1)}
.pin{height:24px;border-radius:999px;background:var(--ter);border:1px solid var(--b2);display:flex;align-items:center;gap:5px;padding:0 4px 0 8px;font-size:12px;color:var(--t1);flex:none;white-space:nowrap}
.pin button{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:var(--t3)}
.pin button:hover{background:var(--hover);color:var(--t1)}
.pin button svg{width:10px;height:10px}

#content{flex:1;min-height:0;display:flex;position:relative}
.split{display:grid;grid-template-columns:var(--listw,320px) minmax(0,1fr) var(--propw,248px);flex:1;min-width:0;min-height:0}
.split.noprops{grid-template-columns:var(--listw,340px) minmax(0,1fr)}
.pane{min-height:0;overflow:auto;min-width:0}
.pane.list{border-right:1px solid color-mix(in lch,var(--b1) 70%,transparent)}
.pane.props{background:var(--panel);border-left:1px solid color-mix(in lch,var(--b1) 70%,transparent);padding:14px 16px 40px}
.full{flex:1;min-height:0;overflow:auto;min-width:0}

/* ---------- lignes de liste ---------- */
.gh{position:sticky;top:0;z-index:2;height:36px;display:flex;align-items:center;gap:8px;padding:0 14px 0 16px;background:var(--l2);color:var(--t2);font-weight:500;cursor:pointer;user-select:none;border-bottom:1px solid color-mix(in lch,var(--b1) 50%,transparent)}
[data-theme="dark"] .gh{background:color-mix(in lch,var(--content) 60%,var(--l3))}
.gh .n{color:var(--t3);font-weight:400}
.gh .car{width:10px;height:10px;color:var(--t4);transition:transform .1s}
.gh.closed .car{transform:rotate(-90deg)}
.gh .act{margin-left:auto;display:flex;gap:2px}
.row{display:flex;align-items:center;gap:9px;height:38px;padding:0 14px 0 16px;cursor:pointer;white-space:nowrap;color:var(--t2);position:relative;transition:background .1s}
.row:hover{background:var(--hover)}
.row.on{background:var(--sel)}
.row.focus{box-shadow:inset 2px 0 0 var(--accent)}
.row .id{color:var(--t3);font-size:12px;width:52px;flex:none;font-variant-numeric:tabular-nums}
.row .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--t1);font-weight:500}
.row .ti .sub{color:var(--t3);font-weight:400}
.row .dt{color:var(--t4);font-size:12px;flex:none;width:44px;text-align:right}
.row .mul{font-size:11px;color:var(--t3);border:1px solid var(--b2);border-radius:999px;padding:0 6px;flex:none}
.row.read .ti{color:var(--t3);font-weight:400}
.row.two{height:auto;min-height:56px;padding-top:9px;padding-bottom:9px;align-items:flex-start}
.row.two .body{flex:1;min-width:0}
.row.two .ti{display:block}
.row.two .sl{color:var(--t3);font-size:12px;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row.two .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.row .unread{width:6px;height:6px;border-radius:50%;background:var(--accent);position:absolute;left:6px;top:50%;margin-top:-3px}
.row.two .unread{top:22px}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--b2);color:var(--t2);font-size:12px;white-space:nowrap;flex:none;background:transparent;font-weight:400}
button.chip:hover,a.chip:hover{border-color:var(--b3);color:var(--t1);background:var(--hover)}
.chip .lb{width:7px;height:7px;border-radius:50%;flex:none}
.av{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:8.5px;font-weight:600;letter-spacing:0;flex:none;line-height:1}
.av.lg{width:22px;height:22px;font-size:10px}
.av.inst{border-radius:5px}
.av-badge{position:relative;display:inline-flex;flex:none}
.av-badge .bd{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:var(--content);display:grid;place-items:center}
.av-badge .bd svg{width:10px;height:10px}
.si{width:14px;height:14px;flex:none;display:inline-block}
.si svg{width:14px;height:14px;stroke-width:1.6}
.bars{display:inline-flex;align-items:flex-end;gap:1.5px;height:12px;flex:none}
.bars i{width:3px;border-radius:1px;background:var(--t4)}
.bars i.on{background:var(--t2)}
.empty{padding:28px 20px;color:var(--t3);text-align:center}

/* ---------- vue issue : détail ---------- */
.issue{max-width:760px;margin:0 auto;padding:26px 32px 80px}
.issue .kicker{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:12px;margin-bottom:8px;flex-wrap:wrap}
.issue h1{font-size:22px;line-height:1.3;font-weight:600;letter-spacing:-.018em;color:var(--t1);margin:0 0 6px}
.issue .subof{color:var(--t3);font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.issue .subof b{color:var(--t1);font-weight:500}
.desc{position:relative;border-radius:8px;padding:2px 0}
.al-block{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:8px 0}
.al-block .k{color:var(--t3);font-size:12px;white-space:nowrap}
.al-block.left{grid-template-columns:44px minmax(0,1fr);gap:10px}
.al-block.left .k{padding-top:4px}
.legal{font-size:15px;line-height:1.7;color:var(--t1);max-width:68ch;letter-spacing:-.005em;overflow-wrap:anywhere}
.legal.dim{color:var(--t3)}
.legal ins,.al ins,.cl-t ins,.cmp ins,.peek ins,.hist ins{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;color:var(--ins);background:var(--ins-bg);font-weight:600;border-radius:3px;padding:0 1px}
.legal del,.al del,.cl-t del,.cmp del,.peek del,.hist del{text-decoration:line-through;text-decoration-color:var(--del);text-decoration-thickness:1.5px;color:var(--t3)}
.legal ins[data-h],.legal del[data-h]{cursor:pointer}
mark.pt{background:color-mix(in lch,var(--orange) 9%,transparent);color:inherit;border-bottom:1.5px dashed color-mix(in lch,var(--orange) 70%,transparent);cursor:pointer;border-radius:2px;transition:background .1s}
mark.pt.w2{background:color-mix(in lch,var(--orange) 14%,transparent)}
mark.pt.w3{background:color-mix(in lch,var(--orange) 20%,transparent);border-bottom-style:solid}
mark.pt:hover{background:color-mix(in lch,var(--orange) 30%,transparent)}
.lead{color:var(--t3);font-size:13px;margin:0 0 4px}
.editbar{display:flex;gap:6px;margin-top:6px;align-items:center;opacity:0;transition:opacity .1s}
.desc:hover .editbar,.editbar.show{opacity:1}
.ed textarea{width:100%;min-height:170px;resize:vertical;border:1px solid color-mix(in lch,var(--accent) 60%,var(--b2));border-radius:8px;background:var(--l2);padding:10px 12px;font-size:15px;line-height:1.7;color:var(--t1);outline:0;box-shadow:0 0 0 3px color-mix(in lch,var(--accent) 16%,transparent)}
.ed .live{margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--l2);font-size:14px;line-height:1.65;color:var(--t3)}
.ed .live .lab{font-size:11px;color:var(--t4);display:block;margin-bottom:2px}
.ed .live ins{text-decoration:underline;text-decoration-color:var(--ins);text-underline-offset:3px;color:var(--t1);background:none}
.ed .live .delpt{display:inline-block;width:2px;height:13px;background:var(--del);vertical-align:-2px;margin:0 1px;border-radius:1px}
.ed .btns{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}

.sec-h{display:flex;align-items:center;gap:8px;margin:30px 0 6px;color:var(--t1);font-weight:500;font-size:13px}
.sec-h .n{color:var(--t3);font-weight:400}
.sec-h .act{margin-left:auto;display:flex;gap:4px}
.subs{border-top:1px solid color-mix(in lch,var(--b1) 70%,transparent)}
.subs .row{padding:0 6px;height:36px;border-bottom:1px solid color-mix(in lch,var(--b1) 50%,transparent)}
.activity{margin-top:34px;border-top:1px solid color-mix(in lch,var(--b1) 70%,transparent);padding-top:18px}
.activity h3{font-size:14px;font-weight:600;color:var(--t1);margin:0 0 12px}
.ev{display:flex;gap:10px;align-items:flex-start;color:var(--t3);font-size:12.5px;padding:5px 0 5px 3px}
.ev .av,.ev .si{margin-top:1px}
.ev b{color:var(--t2);font-weight:500}
.ev a{color:var(--t2);cursor:pointer;font-weight:500}.ev a:hover{color:var(--accent-h)}
.cmt{border:1px solid var(--b1);background:var(--l2);border-radius:10px;padding:10px 14px 12px;margin:10px 0;box-shadow:var(--sh1)}
[data-theme="light"] .cmt{background:var(--prim)}
.cmt .h{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:12px;margin-bottom:4px}
.cmt .h b{color:var(--t1);font-weight:500}
.cmt .tx{color:var(--t2);font-size:13.5px;line-height:1.6}
.cmt.sys{background:none;box-shadow:none;border-style:dashed}

/* propriétés */
.props h4{margin:0 0 8px;color:var(--t3);font-size:12px;font-weight:500;display:flex;align-items:center}
.props h4 .act{margin-left:auto;display:flex;gap:2px}
.props h4 .act .ib{width:26px;height:26px}
.pr{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 8px;margin:0 -8px;border-radius:6px;color:var(--t1);cursor:default}
.pr.click{cursor:pointer}.pr.click:hover{background:var(--hover)}
.pr .v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .v.t3{color:var(--t3)}
.pgrp{margin-top:18px}
.pgrp .lab{color:var(--t3);font-size:12px;margin-bottom:4px;font-weight:500}
.pgrp .chips{display:flex;flex-wrap:wrap;gap:5px}
.props .note{color:var(--t4);font-size:12px;line-height:1.5;margin-top:22px}

/* passage disputé : propositions regroupées */
.ctxline{font-size:14px;line-height:1.7;color:var(--t3);background:var(--l2);border-radius:8px;padding:10px 14px;margin:6px 0 18px}
.ctxline mark{background:color-mix(in lch,var(--orange) 22%,transparent);color:var(--t1);border-radius:2px}
.cl{border:1px solid var(--b1);border-radius:10px;margin:10px 0;background:var(--l1);overflow:hidden}
[data-theme="light"] .cl{background:var(--prim)}
.cl.ref{background:none;border-style:dashed}
.cl-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid color-mix(in lch,var(--b1) 60%,transparent);font-size:12px;color:var(--t3)}
.cl-h .cnt{margin-left:auto;color:var(--t3)}
.cl-t{padding:10px 14px 12px;font-size:15px;line-height:1.7;color:var(--t1)}

/* comparer : une | la référence | l'autre (sous-grille) */
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px;padding:18px 20px 60px;min-width:0}
.cmp .col{display:grid;grid-template-rows:subgrid;grid-row:span var(--rows);min-width:0;border:1px solid var(--b1);border-radius:12px;background:var(--l1);overflow:hidden}
[data-theme="light"] .cmp .col{background:var(--prim)}
.cmp .col.ref{background:none;border-style:dashed}
.cmp .ch{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid color-mix(in lch,var(--b1) 60%,transparent);color:var(--t1);font-weight:500;min-width:0}
.cmp .ch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp .ch small{color:var(--t3);font-weight:400;margin-left:auto;white-space:nowrap}
.cmp .cell{padding:10px 14px;border-bottom:1px solid color-mix(in lch,var(--b1) 40%,transparent);font-size:14px;line-height:1.7;color:var(--t1);overflow-wrap:anywhere}
.cmp .cell .k{display:block;font-size:11px;color:var(--t4);margin-bottom:2px}
.cmp .cell.none{color:var(--t4);font-size:12.5px}

/* vue tableau (board) */
.board{display:flex;gap:10px;padding:12px 14px 30px;min-height:100%;align-items:flex-start;width:max-content}
.bcol{width:280px;flex:none;background:color-mix(in lch,var(--l2) 70%,transparent);border-radius:10px;padding:0 6px 6px}
[data-theme="dark"] .bcol{background:color-mix(in lch,var(--l3) 55%,transparent)}
.bcol-h{display:flex;align-items:center;gap:8px;height:40px;padding:0 6px;color:var(--t1);font-weight:500;cursor:pointer;position:sticky;top:0}
.bcol-h .n{color:var(--t3);font-weight:400}
.bcol-h .src{margin-left:auto;font-size:11px;color:var(--t4);font-weight:400}
.card{background:var(--content);border:1px solid var(--b1);border-radius:8px;padding:9px 11px 10px;margin-bottom:6px;cursor:pointer;box-shadow:var(--sh1);transition:border-color .1s}
[data-theme="light"] .card{background:var(--prim)}
.card:hover{border-color:var(--b3)}
.card .top{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t3)}
.card .top .av{margin-left:auto}
.card .ti{color:var(--t1);font-weight:500;margin:4px 0 7px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ft{display:flex;gap:5px;flex-wrap:wrap}

/* matrice, grille des étapes */
table.mx{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
table.mx th,table.mx td{padding:0 10px;height:36px;text-align:left;white-space:nowrap;border-bottom:1px solid color-mix(in lch,var(--b1) 60%,transparent)}
table.mx th{color:var(--t3);font-weight:500;position:sticky;top:0;background:var(--content);z-index:1}
table.mx td.num{text-align:center;font-variant-numeric:tabular-nums;color:var(--t1);cursor:pointer;min-width:44px}
table.mx td.num span{display:inline-grid;place-items:center;min-width:26px;height:22px;border-radius:6px;background:color-mix(in lch,var(--accent) calc(var(--v) * 1%),transparent)}
table.mx td.num:hover span{outline:1px solid var(--accent)}
table.mx tr.hov:hover td{background:var(--hover);cursor:pointer}
table.mx tr.on td{background:var(--sel)}
.cellst{display:inline-flex;align-items:center;gap:6px;color:var(--t3);font-size:12px}
.wrap-pad{padding:6px 16px 60px}

/* projet (dossier) */
.proj{max-width:900px;margin:0 auto;padding:28px 36px 80px}
.proj h1{font-size:24px;font-weight:600;letter-spacing:-.02em;color:var(--t1);margin:6px 0 6px;line-height:1.25}
.proj .meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px}
.miles{display:flex;gap:0;margin:16px 0 8px;position:relative}
.mile{flex:1;min-width:0;position:relative;padding-top:20px;color:var(--t3);font-size:12px;cursor:pointer}
.mile::before{content:"";position:absolute;top:6px;left:0;right:0;height:2px;background:var(--b2)}
.mile.done::before{background:var(--brand)}
.mile .dm{position:absolute;top:0;left:0;width:14px;height:14px;transform:rotate(45deg) scale(.78);border:2px solid var(--b3);background:var(--content);border-radius:3px}
.mile.done .dm{border-color:var(--brand);background:var(--brand)}
.mile b{display:block;color:var(--t1);font-weight:500}
.mile:hover b{color:var(--accent-h)}
.hist .st{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid color-mix(in lch,var(--b1) 50%,transparent)}
.hist .st .dm{width:10px;height:10px;transform:rotate(45deg);border-radius:2px;background:var(--b3);margin-top:6px;flex:none}
.hist .st.mod .dm{background:var(--orange)}
.hist .st.org .dm{background:var(--brand)}
.hist .st .b{flex:1;min-width:0}
.hist .st .lab{color:var(--t1);font-weight:500}
.hist .st .lab span{color:var(--t3);font-weight:400;margin-left:6px}

/* réunion : le cycle */
.cyc{padding:14px 16px 12px;border-bottom:1px solid color-mix(in lch,var(--b1) 60%,transparent)}
.cyc .l1{display:flex;align-items:center;gap:8px;color:var(--t1);font-weight:500}
.cyc .l2{color:var(--t3);font-size:12px;margin:2px 0 10px}
.strip{display:flex;gap:2px;height:18px;align-items:stretch}
.strip i{display:block;border-radius:3px;background:var(--b2);cursor:pointer;min-width:3px;transition:background .1s}
.strip i.ad{background:var(--brand)}
.strip i:hover{background:var(--t3)}
.strip i.on{outline:2px solid var(--t1);outline-offset:1px}
.bigstrip{padding:22px 24px 60px;max-width:980px}
.bs-row{display:grid;grid-template-columns:44px minmax(0,1fr) 70px;align-items:center;gap:10px;height:30px;cursor:pointer;border-radius:6px;padding:0 6px}
.bs-row:hover{background:var(--hover)}
.bs-row .bar{height:12px;border-radius:3px;background:var(--b3)}
.bs-row.ad .bar{background:var(--brand)}
.bs-row .lbl{font-size:12px;color:var(--t3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bs-row .barw{display:flex;align-items:center;gap:8px;min-width:0}

/* ---------- surcouches : ⌘K, aide, aperçu (peek), menus, bulle d'astuce ---------- */
.scrim{position:fixed;inset:0;background:color-mix(in lch,#000 32%,transparent);z-index:80;display:none}
[data-theme="light"] .scrim{background:color-mix(in lch,#000 12%,transparent)}
.scrim.on{display:block}
#cmdk{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(640px,calc(100vw - 24px));background:color-mix(in lch,var(--sec) 92%,transparent);backdrop-filter:blur(14px);border:1px solid var(--b2);border-radius:12px;box-shadow:var(--sh3);z-index:90;display:none;overflow:hidden}
#cmdk .ctx{display:inline-flex;margin:12px 0 0 16px;font-size:12px;color:var(--t3);background:var(--ter);border-radius:5px;padding:2px 8px}
#cmdk input{width:100%;height:52px;border:0;background:none;outline:0;padding:0 18px;font-size:16px;color:var(--t1)}
#cmdk input::placeholder{color:var(--t4)}
#cmdk .list{max-height:min(420px,56vh);overflow:auto;border-top:1px solid var(--b1);padding:6px}
#cmdk .grp{font-size:11.5px;color:var(--t3);padding:10px 10px 4px;font-weight:500}
#cmdk .it{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:7px;cursor:pointer;color:var(--t1);white-space:nowrap}
#cmdk .it svg{color:var(--t3)}
#cmdk .it .d{color:var(--t3);overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:12.5px}
#cmdk .it .k{margin-left:auto;display:flex;gap:4px;flex:none}
#cmdk .it.on{background:var(--ter)}
#cmdk .it.on::before{content:"";position:absolute}
kbd{font:500 .8em/1 "Inter",system-ui,sans-serif;letter-spacing:0;background:var(--prim);box-shadow:0 0 0 1px var(--b3);border-radius:5px;padding:3px 6px;min-width:20px;display:inline-grid;place-items:center;color:var(--t2);height:20px}
#help{position:fixed;right:12px;top:12px;bottom:12px;width:min(420px,calc(100vw - 24px));background:var(--sec);border:1px solid var(--b2);border-radius:12px;box-shadow:var(--sh3);z-index:90;display:none;flex-direction:column;overflow:hidden}
#help.on{display:flex}
#help .hh{display:flex;align-items:center;padding:16px 16px 8px 20px}
#help .hh h2{margin:0;font-size:17px;font-weight:600;color:var(--t1);flex:1}
#help .srch{margin:6px 16px 6px 20px;height:34px;border:1px solid var(--b2);border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--l2)}
#help .srch input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--t1)}
#help .hb{overflow:auto;padding:4px 16px 30px 20px}
#help h3{font-size:13px;font-weight:600;color:var(--t1);margin:18px 0 6px}
#help .hk{display:flex;align-items:center;gap:6px;min-height:34px;color:var(--t3)}
#help .hk span:first-child{flex:1}
#help .hk .or{font-size:12px;color:var(--t4)}
#peek{position:fixed;top:8vh;left:50%;transform:translateX(-50%);width:min(720px,calc(100vw - 24px));max-height:84vh;overflow:auto;background:var(--content);border:1px solid var(--b2);border-radius:12px;box-shadow:var(--sh3);z-index:90;display:none}
#peek.on{display:block}
#peek .ph{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--b1);color:var(--t3);font-size:12px;position:sticky;top:0;background:var(--content)}
#peek .ph b{color:var(--t1);font-weight:500}
#peek .pb{padding:16px 22px 22px}
#peek h2{font-size:18px;color:var(--t1);margin:0 0 10px;font-weight:600;letter-spacing:-.015em;line-height:1.35}
.pop{position:fixed;z-index:95;min-width:220px;max-width:min(360px,calc(100vw - 16px));max-height:60vh;overflow:auto;background:var(--sec);border:1px solid var(--b2);border-radius:8px;box-shadow:var(--sh3);padding:4px;display:none}
.pop.on{display:block}
.pop .pi{display:flex;align-items:center;gap:8px;min-height:32px;padding:4px 8px;border-radius:5px;cursor:pointer;color:var(--t1)}
.pop .pi:hover,.pop .pi.on{background:var(--ter)}
.pop .pi .d{color:var(--t3);font-size:12px;margin-left:auto;padding-left:10px;white-space:nowrap}
.pop .pi .ck{width:14px;color:var(--accent)}
.pop .ph{font-size:11.5px;color:var(--t3);padding:6px 8px 4px;font-weight:500}
#tip{position:fixed;left:50%;bottom:22px;transform:translate(-50%,8px);background:var(--sec);border:1px solid var(--b2);border-radius:999px;box-shadow:var(--sh2);padding:6px 8px 6px 14px;display:flex;align-items:center;gap:8px;color:var(--t2);font-size:12.5px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;max-width:calc(100vw - 24px)}
#tip.on{opacity:1;transform:translate(-50%,0)}
#tip .k{display:flex;gap:4px;align-items:center}
#toast{position:fixed;right:18px;bottom:18px;background:var(--sec);border:1px solid var(--b2);border-radius:10px;box-shadow:var(--sh3);padding:10px 14px;z-index:99;color:var(--t1);display:none;max-width:min(380px,calc(100vw - 24px));font-size:12.5px}
#toast.on{display:block}
.readme{max-width:760px;margin:0 auto;padding:28px 36px 80px;font-size:14px;line-height:1.65;color:var(--t2)}
.readme h1{font-size:24px;color:var(--t1);font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
.readme h2{font-size:15px;color:var(--t1);font-weight:600;margin:26px 0 6px}
.readme li{margin:3px 0}
.readme a{color:var(--accent-h)}
.readme .src{color:var(--t3);font-size:12.5px}
.mback{display:none}
#scrim-side{display:none}

/* ---------- largeurs intermédiaires : les propriétés passent sous le détail ---------- */
@media (max-width:1180px){
  .split{grid-template-columns:var(--listw,320px) minmax(0,1fr)}
  .pane.props{display:none}
  .props-inline{display:block!important}
}
.props-inline{display:none;border:1px solid var(--b1);border-radius:10px;padding:0 12px;margin:0 0 16px;background:var(--panel)}
.props-inline summary{list-style:none;display:flex;align-items:center;gap:7px;min-height:38px;cursor:pointer;color:var(--t1);flex-wrap:wrap;padding:4px 0}
.props-inline summary::-webkit-details-marker{display:none}
.props-inline summary .t4{margin-left:auto;font-size:12px}
.props-inline[open]{padding-bottom:12px}
.props-inline .pgrp:first-child{margin-top:0}
.props-inline .prow{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- mobile : barre latérale en tiroir, une colonne ---------- */
@media (max-width:760px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:85;background:var(--app);transform:translateX(-100%);transition:transform .25s;box-shadow:var(--sh3)}
  #side.open{transform:none}
  #scrim-side.on{display:block;position:fixed;inset:0;z-index:84;background:color-mix(in lch,#000 55%,transparent)}
  #main{margin:0;border-radius:0;border:0}
  #menu-btn{display:grid}
  #loc{padding-left:6px}
  .split,.split.noprops{grid-template-columns:1fr}
  .split.m-detail .pane.list{display:none}
  .split.m-list .pane.detail{display:none}
  .mback{display:inline-flex}
  .issue,.proj,.readme{padding:18px 16px 70px}
  .issue h1{font-size:19px}
  .al-block{grid-template-columns:1fr;gap:2px}
  .legal{font-size:14.5px}
  .filter{width:130px}
  .cmp{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding:14px 16px 60px}
  .cmp .col{flex:0 0 86%;display:block;scroll-snap-align:center}
  .bcol{width:250px}
  .hide-m{display:none!important}
  .mile{font-size:11px}.mile .sub2{display:none}
  .row .dt{display:none}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <section id="main">
    <div id="loc"></div>
    <div id="viewbar"></div>
    <div id="content"></div>
  </section>
</div>
<div id="scrim-side"></div>
<div class="scrim" id="scrim"></div>
<div id="cmdk"><span class="ctx" id="cmdk-ctx"></span><input id="cmdk-in" spellcheck="false" autocomplete="off" placeholder="Tapez une commande ou cherchez…"><div class="list" id="cmdk-list"></div></div>
<div id="help"></div>
<div id="peek"></div>
<div class="pop" id="pop"></div>
<div id="tip"></div>
<div id="toast"></div>
<script>window.MAQ = "linear";</script>
<!--NOYAU-->
<!--APP-->
</body>
</html>

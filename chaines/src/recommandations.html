<title>Registre des recommandations</title>
<!--BASE-->
<style>
/* À gauche, le registre : ce que deviennent les recommandations de vos rapports, rapport par rapport.
   À droite, l'écriture d'une nouvelle recommandation, vérifiée à la frappe : suivable, et pas déjà faite. */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.rep{margin-bottom:14px}
.rep-h{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:14px;align-items:center;padding:12px 14px 10px}
.rep-h b{color:var(--fg);font-weight:500;font-size:13.5px}
.rep-h small{display:block;color:var(--dim);font-size:12px}
.stack{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--s2)}
.stack i{display:block;height:100%}
.stack-l{font-size:11.5px;color:var(--dim);margin-top:4px;text-align:right}
.rc{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 14px;border-top:1px solid var(--line)}
.rc .dot{margin-top:6px}
.rc p{margin:0;font-size:13px;line-height:1.55;color:var(--text)}
.rc small{display:block;margin-top:3px;font-size:12px;color:var(--dim)}
.rc small b{color:var(--muted);font-weight:500}
.rc .s{font-size:12px;color:var(--muted);white-space:nowrap}
.rc.hl{background:var(--lit)}
.new{padding:16px;position:sticky;top:16px;display:grid;gap:10px}
.new label{font-size:11.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.new textarea{width:100%;min-height:110px;resize:vertical;line-height:1.6;font-size:13.5px}
.crit{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.crit li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:9px;font-size:12.5px;color:var(--text);line-height:1.5}
.crit li .dot{margin-top:6px}
.crit small{display:block;color:var(--muted)}
.crit mark{background:var(--lit)}
.sim{display:grid;gap:6px}
.sm{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--muted);background:none;text-align:left;cursor:pointer;transition:border-color .2s}
.sm:hover{border-color:var(--line2)}
.sm b{color:var(--text);font-weight:500}
@media (max-width:940px){ .grid{grid-template-columns:minmax(0,1fr)} .new{position:static} .rep-h{grid-template-columns:minmax(0,1fr)} .stack-l{text-align:left} }
</style>

<div class="wrap">
  <div class="ctx">Rapports dont la députée a été rapporteure, et rapports externes sur les mêmes sujets</div>
  <h1>Registre des recommandations</h1>
  <p class="lead" id="lead"></p>
  <div class="grid">
    <div><div class="filters" id="filters"></div><div id="reg"></div></div>
    <section class="panel new" aria-label="Nouvelle recommandation">
      <label for="t">Nouvelle recommandation</label>
      <textarea id="t">Réfléchir à une meilleure information des propriétaires de logements vacants sur les aides existantes.</textarea>
      <ul class="crit" id="crit"></ul>
      <div class="sec" style="margin:6px 0 0">Déjà formulé ailleurs</div>
      <div class="sim" id="sim"></div>
    </section>
  </div>
</div>

<script>
const NOW=new Date(2026,10,10);
const S={done:{l:"Mise en œuvre",c:"ok",col:"var(--ok)"},part:{l:"En partie",c:"warn",col:"var(--warn)"},no:{l:"Sans suite",c:"err",col:"var(--err)"},wait:{l:"Pas encore échue",c:"",col:"var(--dim)"}};
const R=[
 {id:"1402",t:"Mission flash sur la vacance des logements",d:"Rapport d'information n° 1402, juin 2026",own:true,recos:[
  {n:1,t:"Ouvrir à toutes les communes l'accès aux données fiscales sur la vacance, avant le 1er janvier 2027.",to:"Ministre de l'économie",due:"2027-01-01",s:"wait"},
  {n:2,t:"Porter le plafond de l'aide à la remise sur le marché à 20 000 euros dans le projet de loi de finances pour 2027.",to:"Gouvernement",due:"2026-10-01",s:"no",proof:"PLF 2027 : plafond maintenu à 15 000 €"},
  {n:3,t:"Publier, avant la fin de l'année 2026, une instruction aux préfets sur la réquisition des logements vacants.",to:"Ministre du logement",due:"2026-12-31",s:"wait"},
  {n:4,t:"Créer un guichet unique départemental pour les propriétaires de logements vacants.",to:"Ministre du logement",due:"2026-12-31",s:"part",proof:"Expérimenté dans 6 départements (circulaire du 3 sept. 2026)"},
  {n:5,t:"Intégrer au PLF pour 2027 une évaluation de la taxe sur les logements vacants.",to:"Ministre de l'économie",due:"2026-10-01",s:"done",proof:"PLF 2027, Évaluation des voies et moyens, tome II"}]},
 {id:"987",t:"Évaluation de la loi relative au logement décent",d:"Rapport d'information n° 987, mars 2025",own:true,recos:[
  {n:1,t:"Publier le décret sur la décence énergétique avant le 30 juin 2025.",to:"Ministre du logement",due:"2025-06-30",s:"no",proof:"Non publié au 10 nov. 2026"},
  {n:2,t:"Doubler les effectifs du service d'hygiène dans les communes de plus de 50 000 habitants d'ici 2027.",to:"Gouvernement",due:"2027-01-01",s:"wait"},
  {n:3,t:"Rendre obligatoire le diagnostic de performance énergétique dans les annonces de location.",to:"Parlement",due:"2025-12-31",s:"done",proof:"Loi n° 2025-650, article 11"},
  {n:4,t:"Informer chaque locataire de ses droits par un document type annexé au bail.",to:"Ministre du logement",due:"2025-12-31",s:"part",proof:"Arrêté du 28 janv. 2026 (bail type modifié, sans document annexé)"},
  {n:5,t:"Mieux informer les propriétaires bailleurs sur les aides à la rénovation.",to:"—",due:null,s:"no",proof:"Recommandation sans destinataire ni échéance : impossible à suivre"}]},
 {id:"ccomptes",t:"Cour des comptes · Les aides à la rénovation énergétique",d:"Rapport public thématique, octobre 2024",own:false,recos:[
  {n:2,t:"Simplifier l'information des propriétaires sur les aides existantes par un point d'entrée unique.",to:"Ministre du logement",due:"2025-12-31",s:"part"},
  {n:4,t:"Réduire à 60 jours le délai de paiement des primes de rénovation.",to:"Agence nationale de l'habitat",due:"2025-12-31",s:"no"}]},
];
const ALL=R.flatMap(r=>r.recos.map(x=>({...x,rep:r})));
let f=null;
function render(){
  const own=ALL.filter(x=>x.rep.own), c=k=>own.filter(x=>x.s===k).length;
  $("#lead").innerHTML=`Sur ${own.length} recommandations de vos rapports, ${c("done")} sont mises en œuvre et ${c("part")} en partie. <span>${c("no")} restent sans suite, ${c("wait")} ne sont pas encore échues.</span>`;
  $("#filters").innerHTML=`<button class="chip ${f==null?"on":""}" data-f="">Toutes</button>`+Object.entries(S).map(([k,v])=>`<button class="chip ${f===k?"on":""}" data-f="${k}"><span class="dot ${v.c}"></span>${v.l}</button>`).join("");
  $("#reg").innerHTML=R.map(r=>{
    const L=r.recos.filter(x=>f==null||x.s===f); if(!L.length) return "";
    const tot=r.recos.length;
    return `<section class="panel rep"><div class="rep-h"><div><b>${r.t}</b><small>${r.d}${r.own?"":" · rapport externe"}</small></div>
      <div><div class="stack">${Object.keys(S).map(k=>{const n=r.recos.filter(x=>x.s===k).length;return n?`<i style="width:${100*n/tot}%;background:${S[k].col}"></i>`:""}).join("")}</div><div class="stack-l">${r.recos.filter(x=>x.s==="done").length} sur ${tot} mises en œuvre</div></div></div>
      ${L.map(x=>`<div class="rc" data-key="${r.id}-${x.n}"><span class="dot ${S[x.s].c}"></span><div><p>${x.n}. ${esc(x.t)}</p><small><b>${x.to}</b>${x.due?` · échéance ${new Date(x.due).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"})}`:""}${x.proof?` · ${esc(x.proof)}`:""}</small></div><span class="s">${S[x.s].l}</span></div>`).join("")}</section>`}).join("");
}
// --- vérification d'une recommandation en cours d'écriture ---
const STOP=new Set("le la les de des du d l un une et en au aux a à sur pour par plus dans avec leur leurs ce ces cette qui que meilleure mieux".split(" "));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ");
const toks=s=>new Set(norm(s).split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)).map(w=>w.slice(0,6)));
const sim=(a,b)=>{let n=0;a.forEach(w=>{if(b.has(w))n++});return n/Math.sqrt((a.size||1)*(b.size||1))};
function check(){
  const t=$("#t").value, T=t.toLowerCase();
  const vague=T.match(/^\s*(réfléchir|étudier|envisager|engager une réflexion|mieux|veiller|favoriser|encourager|poursuivre)/);
  const verb=T.match(/^\s*(publier|créer|porter|réduire|rendre|ouvrir|supprimer|doubler|fixer|intégrer|instaurer|abaisser|relever|transmettre|remettre|modifier|inscrire)/);
  const to=T.match(/(ministre[^,.;]*|gouvernement|préfets?|agence[^,.;]*|anah|collectivités|communes|départements?|parlement)/);
  const due=T.match(/(avant (le |la fin )?[^,.;]*\d{4}|d'ici (à )?(fin )?\d{4}|dans (un|le) délai[^,.;]*|en \d{4}|au \d{1,2}(er)? \w+ \d{4}|dans le projet de loi de finances pour \d{4}|plf (pour )?\d{4})/);
  const vec=T.match(/(décret|arrêté|instruction|circulaire|loi|projet de loi de finances|plf|amendement|convention)/);
  const crit=[
    vague?["err","Formulation vague",`« ${vague[1]} » ne permet pas de dire un jour si c'est fait. Commencez par l'acte attendu : publier, créer, fixer…`]:verb?["ok","Acte vérifiable",`« ${verb[1]} »`]:["warn","Acte à préciser","Quel geste précis attend-on ?"],
    to?["ok","Destinataire",`« ${to[1]} »`]:["warn","Destinataire absent","Qui doit agir : un ministre, le Gouvernement, une agence ?"],
    due?["ok","Échéance",`« ${due[1]} »`]:["warn","Échéance absente","Sans date, le suivi à six mois n'a pas de repère."],
    vec?["ok","Vecteur",`« ${vec[1]} »`]:["","Vecteur non précisé","Facultatif : décret, instruction, loi de finances…"]];
  $("#crit").innerHTML=crit.map(([c,l,s])=>`<li><span class="dot ${c}"></span><span>${l}<small>${esc(s)}</small></span></li>`).join("");
  const mine=toks(t), M=ALL.map(x=>({x,s:sim(mine,toks(x.t))})).filter(m=>m.s>=.25).sort((a,b)=>b.s-a.s).slice(0,3);
  $("#sim").innerHTML=M.length?M.map(({x})=>`<button class="sm" data-go="${x.rep.id}-${x.n}"><b>${x.rep.own?"Vos rapports":"Cour des comptes"} · n° ${x.n}</b> — ${esc(x.t)}<br><span>${S[x.s].l}${x.proof?" · "+esc(x.proof):""}</span></button>`).join(""):`<span style="font-size:12.5px;color:var(--dim)">Aucune recommandation proche.</span>`;
}
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-f]"); if(c){f=c.dataset.f||null;render();return}
  const g=e.target.closest("[data-go]"); if(g){f=null;render();const el=document.querySelector(`.rc[data-key="${g.dataset.go}"]`);if(el){el.classList.add("hl");el.scrollIntoView({block:"center",behavior:"smooth"});setTimeout(()=>el.classList.remove("hl"),1800)}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&f){f=null;render()}});
let tm; $("#t").addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(check,150)});
render(); check();
</script>

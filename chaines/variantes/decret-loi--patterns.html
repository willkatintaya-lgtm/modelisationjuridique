<title>Décret et loi · patterns</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0a0b0d; --s1:#111316; --s2:#171a1e; --line:#22252a; --line2:#2d3137;
  --fg:#f3f5f7; --text:#cfd5dd; --muted:#8a919b; --dim:#5d636c;
  --ins:#8ab4ff; --del:#e5484d; --accent:#6e7bf2; --lit:rgba(110,123,242,.16);
  --ok:#46b37e; --warn:#e3a33f; --err:#e5484d;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.25,.8,.25,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.narrow{max-width:780px}
.ctx{font-size:12.5px;color:var(--dim)}
h1{margin:3px 0 0;font:600 19px/1.3 var(--f);color:var(--fg);letter-spacing:-.012em;text-wrap:balance}
.lead{margin:14px 0 18px;max-width:780px;color:var(--fg);font-size:15.5px;line-height:1.55;text-wrap:pretty}
.lead span{color:var(--muted)}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:10px}
.sec{margin:18px 2px 8px;font-size:11.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.btn{border:1px solid var(--line2);background:var(--s2);color:var(--fg);border-radius:7px;padding:7px 12px;font-size:13px;cursor:pointer;transition:background .2s,opacity .2s;white-space:nowrap}
.btn:hover:not(:disabled){background:#1f2227}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover:not(:disabled){background:#7b87f5}
.btn:disabled{opacity:.4;cursor:default}
.ghost{border:1px solid var(--line2);background:none;color:var(--muted);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;transition:color .2s,background .2s}
.ghost:hover{color:var(--fg);background:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;color:var(--muted);font-size:12.5px;background:none;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip:hover{color:var(--fg)}
.chip.on{color:var(--fg);border-color:var(--accent);background:var(--lit)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
ins{color:var(--ins);text-decoration:underline 1px;text-underline-offset:3px;font-weight:500;background:none}
del{color:var(--dim);text-decoration:line-through 1px var(--del);background:none}
mark{background:var(--lit);color:var(--fg);border-radius:3px;padding:0 1px}
input[type=text],input[type=number],textarea,select{background:var(--s2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--fg);font-size:13px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--line2)}
.gp{display:inline-grid;place-items:center;min-width:24px;height:16px;padding:0 4px;border-radius:4px;color:#fff;font-size:9.5px;font-weight:600;vertical-align:1px;margin-right:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--s2);border:1px solid var(--line2);color:var(--fg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100vw - 32px);animation:rise .2s var(--ease)}
@keyframes rise{from{opacity:0;transform:translate(-50%,4px)}}
.slide{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.slide>div{min-height:0;overflow:hidden;opacity:0;transition:opacity .15s}
.open>.slide{grid-template-rows:1fr}
.open>.slide>div{opacity:1;transition:opacity .2s .12s}
.scrollx{overflow-x:auto;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const nf=(n,d=0)=>n.toLocaleString("fr-FR",{maximumFractionDigits:d,minimumFractionDigits:d});
function toast(m){$$(".toast").forEach(e=>e.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}
</script>

<style>
/* Angle « patterns » : onglets par gravité (au lieu de filtres + accordéon), tiroir latéral pour le détail
   (au lieu du dépliage en place), divulgation progressive dans le tiroir, squelette pendant la lecture du décret,
   dossier de suivi alimenté par glisser-déposer OU par bouton, toasts empilés avec « Annuler ». */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 14px}
.tab{position:relative;border:0;background:none;color:var(--muted);padding:10px 14px;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:44px;transition:color .2s;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected=true]{color:var(--fg)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.tab .n{font-size:12px;color:var(--dim)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.cards{display:grid;gap:8px}
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 4px;transition:border-color .2s,opacity .2s,transform .2s var(--ease)}
.card:hover{border-color:var(--line2)}
.card.dragging{opacity:.45}
.open-btn{display:grid;gap:4px;border:0;background:none;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;min-height:44px;width:100%}
.open-btn b{display:flex;align-items:center;gap:8px;color:var(--fg);font-weight:500;font-size:14px}
.open-btn .pv{font-size:12.5px;color:var(--muted)}
.open-btn .pv em{font-style:normal;color:var(--text)}
.open-btn .pv .bad{color:#f2a7a9}
.follow{display:inline-flex;align-items:center;gap:6px;min-height:36px}
.follow[aria-pressed=true]{color:var(--fg);border-color:var(--accent);background:var(--lit)}
.grip{color:var(--dim);cursor:grab;padding:0 2px;display:none}
@media (hover:hover) and (pointer:fine){.grip{display:inline}}
@media (pointer:coarse){.follow{min-height:44px;min-width:44px}}
.sk{background:linear-gradient(90deg,var(--s2) 0,#1d2025 50%,var(--s2) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:5px}
@keyframes sh{to{background-position:-200% 0}}
.skc{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:9px}
.tray{position:sticky;top:16px;background:var(--s1);border:1px dashed var(--line2);border-radius:10px;padding:12px;transition:border-color .2s,background .2s}
.tray.over{border-color:var(--accent);background:var(--lit)}
.tray h2{margin:0 0 2px;font:500 13px/1.4 var(--f);color:var(--fg)}
.tray p{margin:0;font-size:12.5px;color:var(--dim)}
.tray ul{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.tray li{min-width:0}
.tray li{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--s2);border-radius:7px;padding:6px 6px 6px 10px;font-size:13px;color:var(--fg);animation:rise2 .2s var(--ease)}
@keyframes rise2{from{opacity:0;transform:translateY(4px)}}
.x{border:0;background:none;color:var(--dim);cursor:pointer;border-radius:6px;min-width:32px;min-height:32px;display:grid;place-items:center;transition:color .2s,background .2s}
.x:hover{color:var(--fg);background:#22252a}
@media (pointer:coarse){.x{min-width:44px;min-height:44px}}
/* Tiroir */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--s1);border-left:1px solid var(--line2);z-index:21;transform:translateX(100%);transition:transform .3s var(--ease),visibility 0s .3s;visibility:hidden;display:flex;flex-direction:column}
.drawer.on{transform:none;visibility:visible;transition:transform .3s var(--ease)}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 16px 12px 20px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font:600 16px/1.35 var(--f);color:var(--fg)}
.dh small{color:var(--dim);font-size:12.5px}
.dnav{display:flex;gap:4px;flex:none}
.db{padding:16px 20px 28px;overflow:auto;flex:1}
.st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--fg);margin-bottom:10px}
.why{margin:0 0 16px;font-size:14px;line-height:1.6}
.why b{color:var(--fg);font-weight:500}
.pt{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px}
.pt th{text-align:left;color:var(--dim);font-weight:400;font-size:12px;padding:0 8px 6px 0}
.pt td{border-top:1px solid var(--line);padding:7px 8px 7px 0}
.pt .bad{color:#f2a7a9}
details.more{border-top:1px solid var(--line)}
details.more summary{list-style:none;cursor:pointer;padding:12px 0;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px;min-height:44px}
details.more summary::-webkit-details-marker{display:none}
details.more summary svg{transition:transform .25s var(--ease)}
details.more[open] summary svg{transform:rotate(90deg)}
details.more summary:hover{color:var(--fg)}
.side{background:var(--s2);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.side h3{margin:0 0 6px;font:500 12px/1.4 var(--f);color:var(--dim)}
.side p{margin:0;font-size:13.5px;line-height:1.7}
.side .none{color:var(--dim);font-style:italic}
.p{border-radius:3px;padding:0 2px;background:var(--lit);color:var(--fg)}
.p.diff{background:rgba(227,163,63,.18)} .p.bad{background:rgba(229,72,77,.2)}
.dfoot{border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-end}
/* Toasts empilés */
.toasts{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:40;max-width:calc(100vw - 32px)}
.tt{display:flex;align-items:center;gap:12px;background:var(--s2);border:1px solid var(--line2);border-radius:8px;padding:8px 8px 8px 14px;font-size:13px;color:var(--fg);animation:rise2 .2s var(--ease);transition:opacity .2s}
.tt.out{opacity:0}
.tt .dot{margin-right:-4px}
.tt button{border:0;background:none;color:var(--ins);cursor:pointer;padding:6px 8px;border-radius:6px;min-height:32px}
.tt button:hover{background:#22252a}
.empty{padding:28px 16px;text-align:center;color:var(--dim);background:var(--s1);border:1px solid var(--line);border-radius:10px}
.foot{margin:14px 2px 0;font-size:12px;color:var(--dim)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:820px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .tray{position:static;order:-1}
  .toasts{top:calc(12px + env(safe-area-inset-top,0px));bottom:auto;flex-direction:column-reverse}
  .tab{padding:10px 9px}
  .tabs{gap:0}
  .drawer{top:auto;left:0;width:100%;max-height:88vh;border-left:0;border-top:1px solid var(--line2);border-radius:14px 14px 0 0;transform:translateY(100%)}
}
</style>

<div class="wrap" style="max-width:1060px">
  <div class="ctx">Loi n° 2026-214 du 2 avril 2026, art. 4 · décret n° 2026-1032 du 27 octobre 2026</div>
  <h1>Le décret face à la loi</h1>
  <p class="lead" id="lead"><span class="sk" style="display:inline-block;width:min(520px,80vw);height:16px"></span></p>
  <div class="tabs scrollx" role="tablist" aria-label="Gravité" id="tabs"></div>
  <div class="grid">
    <section id="panel" role="tabpanel" aria-busy="true"></section>
    <aside class="tray" id="tray" aria-label="Dossier de suivi"></aside>
  </div>
  <p class="foot">Valeurs extraites des deux textes et comparées une à une. L'outil signale ; l'appréciation de la conformité reste juridique.</p>
</div>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dt" tabindex="-1"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<p class="sr" id="live" aria-live="assertive"></p>

<script>
const ST={bad:{l:"Contraire à la loi",c:"err"},miss:{l:"Point non traité",c:"err"},add:{l:"Condition ajoutée",c:"warn"},in:{l:"Dans les limites",c:"ok"},ok:{l:"Conforme",c:"ok"}};
const TABS=[{k:"sig",l:"À signaler",s:["bad","miss"]},{k:"ver",l:"À vérifier",s:["add"]},{k:"rien",l:"Sans difficulté",s:["in","ok"]},{k:"all",l:"Tout",s:["bad","miss","add","in","ok"]}];
const P=[
 {k:"champ",t:"Communes concernées",ref:"Art. L. 332-4, al. 1 → art. R. 332-1",st:"ok",
  loi:`Dans les communes de plus de <span class="p">50 000 habitants</span> appartenant à une <span class="p">zone d'urbanisation continue</span>, le propriétaire d'un logement vacant…`,
  dec:`La liste des communes mentionnées à l'article L. 332-4 est celle des communes de plus de <span class="p">50 000 habitants</span> appartenant à une <span class="p">zone d'urbanisation continue</span>, annexée au décret n° 2013-392 du 10 mai 2013.`,
  pv:[["Seuil","50 000 habitants","50 000 habitants"]],why:"Le décret reprend le seuil et renvoie à une liste existante."},
 {k:"vac",t:"Durée de vacance",ref:"Art. L. 332-4, al. 1 → art. R. 332-2",st:"add",
  loi:`…le propriétaire d'un logement vacant depuis plus de <span class="p">deux ans</span> le déclare au maire.`,
  dec:`Est regardé comme vacant le logement inoccupé de manière continue depuis plus de <span class="p">vingt-quatre mois</span>. <span class="p diff">Une occupation inférieure à quatre-vingt-dix jours par an n'interrompt pas la vacance.</span>`,
  pv:[["Durée","deux ans","vingt-quatre mois"],["Occupation courte","non prévue","ignorée sous 90 jours"]],why:"La durée est la même. Mais le décret ajoute une règle que la loi ne prévoit pas : une courte occupation ne compte pas. Plus de logements devront être déclarés ; <b>à vérifier</b> au regard de l'habilitation."},
 {k:"aide",t:"Montant de l'aide",ref:"Art. L. 332-4, al. 2 → art. R. 332-3",st:"in",
  loi:`…une aide à la remise sur le marché dont le montant ne peut excéder <span class="p">30 %</span> du <span class="p">coût des travaux</span>, dans la limite de <span class="p">15 000 euros</span> par logement.`,
  dec:`Le montant de l'aide est fixé à <span class="p diff">25 %</span> du <span class="p diff">coût hors taxes des travaux</span>, dans la limite de <span class="p diff">12 000 euros</span> par logement.`,
  pv:[["Taux","30 % au plus","25 %"],["Plafond","15 000 € au plus","12 000 €"]],why:"La loi fixe des plafonds ; le décret retient des valeurs plus basses, ce qui lui est permis. L'aide versée sera toutefois inférieure de 20 % au plafond voté, et calculée hors taxes."},
 {k:"info",t:"Délai d'information du propriétaire",ref:"Art. L. 332-4, al. 3 → art. R. 332-4",st:"bad",
  loi:`Le maire informe le propriétaire des aides mobilisables dans un délai d'<span class="p">un mois</span> suivant la déclaration.`,
  dec:`Le maire adresse au propriétaire l'information prévue au troisième alinéa de l'article L. 332-4 dans un délai de <span class="p bad">deux mois</span> à compter de la réception de la déclaration.`,
  pv:[["Délai","un mois","deux mois"]],why:"Le délai est fixé par la loi elle-même ; le décret ne peut pas le doubler. <b>Écart à signaler</b> : question écrite ou recours possible."},
 {k:"forme",t:"Forme du décret",ref:"Art. L. 332-4, dernier alinéa",st:"ok",
  loi:`Les conditions d'application du présent article sont fixées par <span class="p">décret en Conseil d'État</span>.`,
  dec:`Le Premier ministre, […] <span class="p">le Conseil d'État (section de l'intérieur) entendu</span>, décrète :`,
  pv:[["Procédure","Conseil d'État","Conseil d'État entendu"]],why:"La loi exige un décret en Conseil d'État : les visas le confirment."},
 {k:"restit",t:"Restitution de l'aide",ref:"Art. L. 332-5 → aucun article",st:"miss",
  loi:`Un décret précise les conditions dans lesquelles l'aide est <span class="p">restituée</span> lorsque le logement n'est pas remis en location dans un délai d'un an.`,
  dec:null,pv:[["Restitution","prévue","aucune disposition"]],why:"Aucun article du décret ne traite de la restitution. Sans ce texte, l'aide ne peut pas être récupérée. Un second décret est peut-être prévu : l'échéancier n'en mentionne pas."},
];
const S={tab:"sig",loading:true,follow:[],open:null,opener:null};
const byK=k=>P.find(p=>p.k===k), red=p=>p.st==="bad"||p.st==="miss";
const list=()=>{const t=TABS.find(t=>t.k===S.tab);return P.filter(p=>t.s.includes(p.st)).sort((a,b)=>t.s.indexOf(a.st)-t.s.indexOf(b.st))};
const chev=`<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg>`;

function tabs(){
  $("#tabs").innerHTML=TABS.map(t=>{const n=P.filter(p=>t.s.includes(p.st)).length,sel=S.tab===t.k;
    return `<button class="tab" role="tab" id="tab-${t.k}" aria-controls="panel" aria-selected="${sel}" tabindex="${sel?0:-1}" data-tab="${t.k}">${t.l}<span class="n">${S.loading?"…":n}</span></button>`}).join("");
  $("#panel").setAttribute("aria-labelledby","tab-"+S.tab);
}
function panel(){
  const pn=$("#panel");
  if(S.loading){pn.innerHTML=`<div class="cards">${[0,1].map(()=>`<div class="skc"><span class="sk" style="width:46%;height:14px"></span><span class="sk" style="width:30%;height:11px"></span></div>`).join("")}</div>`;return}
  pn.setAttribute("aria-busy","false");
  const L=list();
  pn.innerHTML=L.length?`<div class="cards">${L.map(p=>{const f=S.follow.includes(p.k);return `<div class="card" draggable="true" data-k="${p.k}">
    <button class="open-btn" data-open="${p.k}" aria-haspopup="dialog"><b><span class="dot ${ST[p.st].c}" title="${ST[p.st].l}"></span>${p.t}</b>
    <span class="pv">${p.pv.map(([n,a,b])=>`<em>${a}</em> → <em class="${red(p)?"bad":""}">${b}</em>`).join(" · ")}</span></button>
    <span style="display:flex;align-items:center;gap:6px"><span class="grip" aria-hidden="true" title="Glisser vers le dossier de suivi">⋮⋮</span>
    <button class="btn follow" data-follow="${p.k}" aria-pressed="${f}">${f?"Suivi":"Suivre"}</button></span></div>`}).join("")}</div>`
    :`<div class="empty">Aucun point dans cet onglet.</div>`;
}
function tray(){
  const F=S.follow.map(byK);
  $("#tray").innerHTML=`<h2>Dossier de suivi · ${F.length}</h2><p>${F.length?"Points à reprendre en question écrite ou en note.":"Glissez un point ici, ou utilisez « Suivre »."}</p>
   ${F.length?`<ul>${F.map(p=>`<li><span style="display:flex;align-items:center;gap:8px;min-width:0"><span class="dot ${ST[p.st].c}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.t}</span></span><button class="x" data-unfollow="${p.k}" aria-label="Retirer ${p.t} du suivi">×</button></li>`).join("")}</ul>`:""}`;
}
function lead(){
  if(S.loading)return;
  const n=s=>P.filter(p=>s.includes(p.st)).length;
  $("#lead").innerHTML=`Le décret traite ${P.length-n(["miss"])} des ${P.length} points que la loi lui confie. <span>${n(["bad"])} contraire à la loi, ${n(["miss"])} non traité, ${n(["add"])} condition ajoutée.</span>`;
}
function render(){tabs();panel();tray();lead();}

/* Tiroir : un seul détail à la fois, ‹ › pour parcourir l'onglet, focus piégé, Échap / × / clic sur le voile pour fermer. */
function openDrawer(k,from){
  const p=byK(k),L=list(),i=L.findIndex(q=>q.k===k);S.open=k;if(from)S.opener=from;
  const f=S.follow.includes(k);
  $("#drawer").innerHTML=`<div class="dh"><div><h2 id="dt">${p.t}</h2><small>${p.ref}</small></div>
   <div class="dnav"><button class="x" data-step="-1" aria-label="Point précédent" ${i<=0?"disabled style='opacity:.3'":""}><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3L5 8l5 5"/></svg></button>
   <button class="x" data-step="1" aria-label="Point suivant" ${i>=L.length-1?"disabled style='opacity:.3'":""}>${chev}</button>
   <button class="x" data-close aria-label="Fermer">×</button></div></div>
   <div class="db"><div class="st"><span class="dot ${ST[p.st].c}"></span>${ST[p.st].l}</div>
   <p class="why">${p.why}</p>
   <table class="pt"><thead><tr><th>Valeur</th><th>Loi</th><th>Décret</th></tr></thead><tbody>${p.pv.map(([n,a,b])=>`<tr><td>${n}</td><td>${a}</td><td class="${red(p)?"bad":""}">${b}</td></tr>`).join("")}</tbody></table>
   <details class="more"><summary>${chev}Lire les deux passages</summary>
    <div class="side"><h3>Loi</h3><p>${p.loi}</p></div><div class="side"><h3>Décret</h3><p>${p.dec??'<span class="none">Aucune disposition.</span>'}</p></div></details></div>
   <div class="dfoot"><button class="btn ${f?"":"pri"}" data-follow="${k}" aria-pressed="${f}">${f?"Retirer du suivi":"Ajouter au dossier de suivi"}</button></div>`;
  $("#scrim").classList.add("on");$("#drawer").classList.add("on");
  document.documentElement.style.overflow="hidden";
  setTimeout(()=>($("#drawer [data-close]")||$("#drawer")).focus(),50);
}
function closeDrawer(){
  if(!S.open)return;S.open=null;$("#scrim").classList.remove("on");$("#drawer").classList.remove("on");
  document.documentElement.style.overflow="";
  const o=S.opener&&$(`[data-open="${S.opener}"]`);o&&o.focus();
}

function toastU(msg,undo,cls="ok"){
  const box=$("#toasts");while(box.children.length>=3)box.firstElementChild.remove();
  const t=document.createElement("div");t.className="tt";t.innerHTML=`<span class="dot ${cls}"></span><span>${esc(msg)}</span>${undo?'<button>Annuler</button>':""}`;
  box.append(t);let tm;
  const kill=()=>{t.classList.add("out");setTimeout(()=>t.remove(),200)};
  const arm=()=>{tm=setTimeout(kill,5000)};arm();
  t.onmouseenter=()=>clearTimeout(tm);t.onmouseleave=arm;
  if(undo)t.querySelector("button").onclick=()=>{undo();kill()};
}
function setFollow(k,on,silent){
  const p=byK(k),had=S.follow.includes(k);if(on===had)return;
  S.follow=on?[...S.follow,k]:S.follow.filter(x=>x!==k);render();if(S.open)openDrawer(S.open);
  if(!silent)toastU(on?`« ${p.t} » ajouté au suivi`:`« ${p.t} » retiré du suivi`,()=>setFollow(k,!on,true));
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");if(t){S.tab=t.dataset.tab;render();return}
  const o=e.target.closest("[data-open]");if(o){openDrawer(o.dataset.open,o.dataset.open);return}
  const f=e.target.closest("[data-follow]");if(f){setFollow(f.dataset.follow,!S.follow.includes(f.dataset.follow));return}
  const u=e.target.closest("[data-unfollow]");if(u){setFollow(u.dataset.unfollow,false);return}
  const s=e.target.closest("[data-step]");if(s&&!s.disabled){const L=list(),i=L.findIndex(q=>q.k===S.open),n=L[i+ +s.dataset.step];if(n){openDrawer(n.k,n.k)}return}
  if(e.target.closest("[data-close]")||e.target.id==="scrim")closeDrawer();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.open){closeDrawer();return}
  if(S.open&&e.key==="Tab"){const F=$$("#drawer button:not([disabled]),#drawer summary");if(!F.length)return;const a=F[0],z=F[F.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
  if(S.open&&(e.key==="ArrowRight"||e.key==="ArrowLeft")&&!e.target.matches("summary")){const b=$(`#drawer [data-step="${e.key==="ArrowRight"?1:-1}"]`);b&&!b.disabled&&b.click();return}
  if(e.target.matches("[role=tab]")&&(e.key==="ArrowRight"||e.key==="ArrowLeft"||e.key==="Home"||e.key==="End")){
    e.preventDefault();const i=TABS.findIndex(t=>t.k===S.tab),n=TABS.length;
    const j=e.key==="Home"?0:e.key==="End"?n-1:(i+(e.key==="ArrowRight"?1:-1)+n)%n;S.tab=TABS[j].k;render();$("#tab-"+S.tab).focus()}
});
/* Glisser-déposer (souris) ; l'alternative clavier et tactile est le bouton « Suivre » de chaque carte. */
document.addEventListener("dragstart",e=>{const c=e.target.closest?.(".card");if(!c)return;e.dataTransfer.setData("text/plain",c.dataset.k);e.dataTransfer.effectAllowed="copy";c.classList.add("dragging")});
document.addEventListener("dragend",e=>{$$(".card.dragging").forEach(c=>c.classList.remove("dragging"));$("#tray").classList.remove("over")});
const tr=$("#tray");
tr.addEventListener("dragover",e=>{e.preventDefault();tr.classList.add("over")});
tr.addEventListener("dragleave",e=>{if(!tr.contains(e.relatedTarget))tr.classList.remove("over")});
tr.addEventListener("drop",e=>{e.preventDefault();tr.classList.remove("over");const k=e.dataTransfer.getData("text/plain");if(byK(k)){if(S.follow.includes(k))toastU(`« ${byK(k).t} » est déjà suivi`);else setFollow(k,true)}});

render();
/* La lecture du décret prend plus de 400 ms : squelette à la forme des cartes, puis contenu. */
setTimeout(()=>{S.loading=false;render();$("#live").textContent="Lecture terminée : 2 points à signaler."},700);
</script>

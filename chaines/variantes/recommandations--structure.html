<title>Recommandations · structure</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0a0b0d; --s1:#111316; --s2:#171a1e; --line:#22252a; --line2:#2d3137;
  --fg:#f3f5f7; --text:#cfd5dd; --muted:#8a919b; --dim:#5d636c;
  --ins:#8ab4ff; --del:#e5484d; --accent:#6e7bf2; --lit:rgba(110,123,242,.16);
  --ok:#46b37e; --warn:#e3a33f; --err:#e5484d;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.25,.8,.25,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.narrow{max-width:780px}
.ctx{font-size:12.5px;color:var(--dim)}
h1{margin:3px 0 0;font:600 19px/1.3 var(--f);color:var(--fg);letter-spacing:-.012em;text-wrap:balance}
.lead{margin:14px 0 18px;max-width:780px;color:var(--fg);font-size:15.5px;line-height:1.55;text-wrap:pretty}
.lead span{color:var(--muted)}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:10px}
.sec{margin:18px 2px 8px;font-size:11.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.btn{border:1px solid var(--line2);background:var(--s2);color:var(--fg);border-radius:7px;padding:7px 12px;font-size:13px;cursor:pointer;transition:background .2s,opacity .2s;white-space:nowrap}
.btn:hover:not(:disabled){background:#1f2227}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover:not(:disabled){background:#7b87f5}
.btn:disabled{opacity:.4;cursor:default}
.ghost{border:1px solid var(--line2);background:none;color:var(--muted);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;transition:color .2s,background .2s}
.ghost:hover{color:var(--fg);background:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;color:var(--muted);font-size:12.5px;background:none;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip:hover{color:var(--fg)}
.chip.on{color:var(--fg);border-color:var(--accent);background:var(--lit)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
ins{color:var(--ins);text-decoration:underline 1px;text-underline-offset:3px;font-weight:500;background:none}
del{color:var(--dim);text-decoration:line-through 1px var(--del);background:none}
mark{background:var(--lit);color:var(--fg);border-radius:3px;padding:0 1px}
input[type=text],input[type=number],textarea,select{background:var(--s2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--fg);font-size:13px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--line2)}
.gp{display:inline-grid;place-items:center;min-width:24px;height:16px;padding:0 4px;border-radius:4px;color:#fff;font-size:9.5px;font-weight:600;vertical-align:1px;margin-right:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--s2);border:1px solid var(--line2);color:var(--fg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100vw - 32px);animation:rise .2s var(--ease)}
@keyframes rise{from{opacity:0;transform:translate(-50%,4px)}}
.slide{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.slide>div{min-height:0;overflow:hidden;opacity:0;transition:opacity .15s}
.open>.slide{grid-template-rows:1fr}
.open>.slide>div{opacity:1;transition:opacity .2s .12s}
.scrollx{overflow-x:auto;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const nf=(n,d=0)=>n.toLocaleString("fr-FR",{maximumFractionDigits:d,minimumFractionDigits:d});
function toast(m){$$(".toast").forEach(e=>e.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}
</script>
<script>
/* Données et règles reprises de la maquette d'origine (registre + vérification à la frappe). */
const NOW=new Date(2026,10,10);
const S={done:{l:"Mise en œuvre",c:"ok",col:"var(--ok)"},part:{l:"En partie",c:"warn",col:"var(--warn)"},no:{l:"Sans suite",c:"err",col:"var(--err)"},wait:{l:"Pas encore échue",c:"",col:"var(--dim)"}};
const R=[
 {id:"1402",short:"Vacance des logements",t:"Mission flash sur la vacance des logements",d:"Rapport d'information n° 1402, juin 2026",own:true,recos:[
  {n:1,t:"Ouvrir à toutes les communes l'accès aux données fiscales sur la vacance, avant le 1er janvier 2027.",to:"Ministre de l'économie",due:"2027-01-01",s:"wait"},
  {n:2,t:"Porter le plafond de l'aide à la remise sur le marché à 20 000 euros dans le projet de loi de finances pour 2027.",to:"Gouvernement",due:"2026-10-01",s:"no",proof:"PLF 2027 : plafond maintenu à 15 000 €"},
  {n:3,t:"Publier, avant la fin de l'année 2026, une instruction aux préfets sur la réquisition des logements vacants.",to:"Ministre du logement",due:"2026-12-31",s:"wait"},
  {n:4,t:"Créer un guichet unique départemental pour les propriétaires de logements vacants.",to:"Ministre du logement",due:"2026-12-31",s:"part",proof:"Expérimenté dans 6 départements (circulaire du 3 sept. 2026)"},
  {n:5,t:"Intégrer au PLF pour 2027 une évaluation de la taxe sur les logements vacants.",to:"Ministre de l'économie",due:"2026-10-01",s:"done",proof:"PLF 2027, Évaluation des voies et moyens, tome II"}]},
 {id:"987",short:"Logement décent",t:"Évaluation de la loi relative au logement décent",d:"Rapport d'information n° 987, mars 2025",own:true,recos:[
  {n:1,t:"Publier le décret sur la décence énergétique avant le 30 juin 2025.",to:"Ministre du logement",due:"2025-06-30",s:"no",proof:"Non publié au 10 nov. 2026"},
  {n:2,t:"Doubler les effectifs du service d'hygiène dans les communes de plus de 50 000 habitants d'ici 2027.",to:"Gouvernement",due:"2027-01-01",s:"wait"},
  {n:3,t:"Rendre obligatoire le diagnostic de performance énergétique dans les annonces de location.",to:"Parlement",due:"2025-12-31",s:"done",proof:"Loi n° 2025-650, article 11"},
  {n:4,t:"Informer chaque locataire de ses droits par un document type annexé au bail.",to:"Ministre du logement",due:"2025-12-31",s:"part",proof:"Arrêté du 28 janv. 2026 (bail type modifié, sans document annexé)"},
  {n:5,t:"Mieux informer les propriétaires bailleurs sur les aides à la rénovation.",to:null,due:null,s:"no",proof:"Recommandation sans destinataire ni échéance : impossible à suivre"}]},
 {id:"ccomptes",short:"Cour des comptes",t:"Cour des comptes · Les aides à la rénovation énergétique",d:"Rapport public thématique, octobre 2024",own:false,recos:[
  {n:2,t:"Simplifier l'information des propriétaires sur les aides existantes par un point d'entrée unique.",to:"Ministre du logement",due:"2025-12-31",s:"part"},
  {n:4,t:"Réduire à 60 jours le délai de paiement des primes de rénovation.",to:"Agence nationale de l'habitat",due:"2025-12-31",s:"no"}]},
];
const ALL=R.flatMap(r=>r.recos.map(x=>({...x,rep:r,key:r.id+"-"+x.n})));
const fdate=d=>new Date(d+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"});
const days=d=>Math.round((new Date(d+"T12:00")-NOW)/864e5);
function dueTxt(x){ if(!x.due) return "sans échéance"; const n=days(x.due);
  if(n<0){const m=Math.round(-n/30.4); return `échue depuis ${m<1?"quelques jours":m+" mois"}`}
  return n<45?`échéance dans ${n} jours`:`échéance ${fdate(x.due)}`; }
const STOP=new Set("le la les de des du d l un une et en au aux a à sur pour par plus dans avec leur leurs ce ces cette qui que meilleure mieux".split(" "));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ");
const toks=s=>new Set(norm(s).split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)).map(w=>w.slice(0,6)));
const simil=(a,b)=>{let n=0;a.forEach(w=>{if(b.has(w))n++});return n/Math.sqrt((a.size||1)*(b.size||1))};
/* Analyse d'une recommandation en cours d'écriture : quatre critères (mêmes règles que l'original) et les plus proches. */
function analyse(t){
  const T=t.toLowerCase();
  const vague=T.match(/^\s*(réfléchir|étudier|envisager|engager une réflexion|mieux|veiller|favoriser|encourager|poursuivre)/);
  const verb=T.match(/^\s*(publier|créer|porter|réduire|rendre|ouvrir|supprimer|doubler|fixer|intégrer|instaurer|abaisser|relever|transmettre|remettre|modifier|inscrire)/);
  const to=T.match(/(ministre[^,.;]*|gouvernement|préfets?|agence[^,.;]*|anah|collectivités|communes|départements?|parlement)/);
  const due=T.match(/(avant (le |la fin )?[^,.;]*\d{4}|d'ici (à )?(fin )?\d{4}|dans (un|le) délai[^,.;]*|en \d{4}|au \d{1,2}(er)? \w+ \d{4}|dans le projet de loi de finances pour \d{4}|plf (pour )?\d{4})/);
  const vec=T.match(/(décret|arrêté|instruction|circulaire|loi|projet de loi de finances|plf|amendement|convention)/);
  const crit={
    acte: vague?{c:"err",l:"Formulation vague",m:vague[1],s:`« ${vague[1]} » ne permet pas de dire un jour si c'est fait. Commencez par l'acte attendu : publier, créer, fixer…`}
         :verb?{c:"ok",l:"Acte vérifiable",m:verb[1]}:{c:"warn",l:"Acte à préciser",s:"Quel geste précis attend-on ?"},
    to: to?{c:"ok",l:"Destinataire",m:to[1].split(/ (?:aux|sur|pour|avant|d'ici|afin|dans) /)[0]}:{c:"warn",l:"Destinataire absent",s:"Qui doit agir : un ministre, le Gouvernement, une agence ?"},
    due: due?{c:"ok",l:"Échéance",m:due[1]}:{c:"warn",l:"Échéance absente",s:"Sans date, le suivi à six mois n'a pas de repère."},
    vec: vec?{c:"ok",l:"Vecteur",m:vec[1]}:{c:"",l:"Vecteur non précisé",s:"Facultatif : décret, instruction, loi de finances…"}};
  const mine=toks(t), near=ALL.map(x=>({x,s:simil(mine,toks(x.t))})).filter(m=>m.s>=.25).sort((a,b)=>b.s-a.s).slice(0,3);
  return {crit,near,ready:crit.acte.c==="ok"&&crit.to.c==="ok"&&crit.due.c==="ok"};
}
const START="Réfléchir à une meilleure information des propriétaires de logements vacants sur les aides existantes.";
</script>
<style>
/* Angle « structure » : l'objet central devient la suite à donner, pas le rapport.
   Le registre répond à « que dois-je relancer ? » ; la rédaction sépare ce qui se vérifie (champs) de ce qui s'écrit (texte). */
.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:end;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);padding:5px 10px;border-radius:6px;font-size:12.5px;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--s2);color:var(--fg)}
.seg-l{font-size:12px;color:var(--dim);margin-right:8px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start;margin-top:14px}
.grp{margin-bottom:12px}
.grp>button.gh{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto 14px;gap:10px;align-items:baseline;width:100%;padding:12px 14px;cursor:pointer;border-radius:10px}
.grp>button.gh:focus-visible{outline:2px solid var(--accent)}
.gh b{color:var(--fg);font-weight:500;font-size:14px}
.gh small{color:var(--dim);font-size:12px;margin-left:8px}
.gh .n{color:var(--muted);font-size:12.5px}
.gh .chev{color:var(--dim);transition:transform .25s var(--ease);font-size:11px}
.grp.open .chev{transform:rotate(90deg)}
.it{display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;padding:10px 14px;border-top:1px solid var(--line);transition:background .4s}
.it .dot{margin-top:7px}
.it p{margin:0;font-size:13px;color:var(--text)}
.it .meta{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:3px;font-size:12px;color:var(--dim)}
.it .meta b{color:var(--muted);font-weight:500}
.it .meta .late{color:var(--warn)}
.it .next{margin-top:5px;font-size:12px;color:var(--muted)}
.it.hl{background:var(--lit)}
.empty{padding:12px 14px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px}
/* rédaction */
.new{padding:16px;position:sticky;top:16px;display:grid;gap:14px}
.new h2{margin:0;font:600 14px/1.3 var(--f);color:var(--fg)}
.f{display:grid;gap:5px}
.f>label,.f>.lb{font-size:12px;color:var(--muted)}
.f>label i,.f>.lb i{font-style:normal;color:var(--dim)}
.new textarea{width:100%;min-height:96px;resize:vertical;line-height:1.6;font-size:13.5px}
.new input,.new select{width:100%;min-height:36px}
.msg{display:grid;grid-template-columns:12px minmax(0,1fr);gap:8px;font-size:12.5px;line-height:1.5;color:var(--text)}
.msg .dot{margin-top:6px}
.msg small{display:block;color:var(--muted);font-size:12px}
.hint{font-size:12px;color:var(--dim)}
.hint mark{font-size:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fixes{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.dup{display:grid;gap:6px}
.dup button{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--muted);transition:border-color .2s}
.dup button:hover{border-color:var(--line2)} .dup button:focus-visible{outline:2px solid var(--accent)}
.dup b{color:var(--text);font-weight:500}
.dup .adv{display:block;margin-top:3px;color:var(--fg)}
.err-sum{border:1px solid rgba(229,72,77,.45);border-radius:8px;padding:9px 11px;font-size:12.5px;color:var(--fg)}
.err-sum ul{margin:4px 0 0;padding-left:18px;color:var(--text)}
.err-sum a{color:var(--ins)}
.bad{border-color:rgba(229,72,77,.6)!important}
.proj{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}
.proj[hidden]{display:none}
.new input[type=date]{background:var(--s2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--fg);font-size:13px}
.proj ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:12.5px}
.proj li small{display:block;color:var(--dim)}
.proj .ghost{margin-left:6px}
@media (max-width:960px){.grid{grid-template-columns:minmax(0,1fr)}.new{position:static}}
@media (max-width:440px){.row2{grid-template-columns:1fr}.gh small{display:block;margin:2px 0 0}}
</style>

<div class="wrap">
  <div class="ctx">Rapports dont la députée a été rapporteure, et rapports externes sur les mêmes sujets</div>
  <h1>Suivi des recommandations</h1>
  <p class="lead" id="lead"></p>
  <div class="top">
    <div role="group" aria-label="Regrouper le registre"><span class="seg-l">Regrouper par</span><span class="seg" id="mode"></span></div>
  </div>
  <div class="grid">
    <div id="reg" aria-live="polite"></div>
    <form class="panel new" id="form" novalidate aria-labelledby="nh">
      <h2 id="nh">Nouvelle recommandation</h2>
      <div class="f">
        <label for="t">Ce qui doit être fait</label>
        <textarea id="t"></textarea>
        <div id="acte"></div>
      </div>
      <div class="row2">
        <div class="f"><label for="to">Destinataire</label><input type="text" id="to" list="tos" autocomplete="off" placeholder="Qui doit agir ?"><datalist id="tos"></datalist><div class="hint" id="toh"></div></div>
        <div class="f"><label for="due">Échéance</label><input type="date" id="due" min="2026-11-11"><div class="hint" id="dueh"></div></div>
      </div>
      <div class="f"><label for="vec">Vecteur <i>· facultatif</i></label>
        <select id="vec"><option value="">Non précisé</option><option>Loi</option><option>Loi de finances</option><option>Décret</option><option>Arrêté</option><option>Instruction</option><option>Circulaire</option><option>Convention</option></select>
        <div class="hint" id="vech"></div></div>
      <div class="f"><span class="lb">Déjà formulé</span><div class="dup" id="dup"></div></div>
      <div id="sum"></div>
      <div><button class="btn pri" type="submit">Ajouter au projet de rapport</button></div>
      <div class="proj" id="proj" hidden></div>
    </form>
  </div>
</div>

<script>
let mode="suite"; const shut=new Set(["acq","ext"]); const touched={to:false,due:false,vec:false}; const proj=[];
const MODES={suite:"Suite à donner",rapport:"Rapport",to:"Destinataire"};
const NEXT={no:"Relance : question écrite ou audition du destinataire.",part:"Relance : demander ce qui manque à la mise en œuvre."};
function groups(){
  const own=ALL.filter(x=>x.rep.own);
  if(mode==="suite") return [
    {id:"rel",t:"À relancer",sub:"échues, sans suite ou en partie",L:own.filter(x=>x.due&&x.to&&days(x.due)<0&&(x.s==="no"||x.s==="part")).sort((a,b)=>a.due.localeCompare(b.due))},
    {id:"sur",t:"À surveiller",sub:"échéance à venir",L:own.filter(x=>x.due&&days(x.due)>=0&&x.s!=="done").sort((a,b)=>a.due.localeCompare(b.due))},
    {id:"inx",t:"Impossibles à suivre",sub:"sans destinataire ou sans échéance",L:own.filter(x=>!x.to||!x.due)},
    {id:"acq",t:"Mises en œuvre",sub:"",L:own.filter(x=>x.s==="done"&&x.to&&x.due)},
    {id:"ext",t:"Rapports externes",sub:"pour mémoire",L:ALL.filter(x=>!x.rep.own)}];
  if(mode==="rapport") return R.map(r=>({id:"r"+r.id,t:r.short,sub:`${r.d}${r.own?"":" · externe"} · ${r.recos.filter(x=>x.s==="done").length} sur ${r.recos.length} mises en œuvre`,L:ALL.filter(x=>x.rep===r)}));
  const by={}; ALL.forEach(x=>{(by[x.to||"Sans destinataire"]??=[]).push(x)});
  return Object.entries(by).sort((a,b)=>b[1].length-a[1].length).map(([k,L])=>({id:"d"+k,t:k,sub:(n=>n?`${n} sans suite`:"")(L.filter(x=>x.s==="no").length),L}));
}
function item(x){
  const late=x.due&&days(x.due)<0&&x.s!=="done";
  return `<div class="it" id="k${x.key}"><span class="dot ${S[x.s].c}" title="${S[x.s].l}"></span><div><p>${esc(x.t)}</p>
  <div class="meta"><span><b>${S[x.s].l}</b></span>${mode!=="rapport"?`<span>${x.rep.own?"n° "+x.rep.id:x.rep.short}, reco. ${x.n}</span>`:""}${mode!=="to"?`<span>${x.to?esc(x.to):"Sans destinataire"}</span>`:""}<span class="${late?"late":""}">${x.s==="done"?"échéance "+(x.due?fdate(x.due):"—"):dueTxt(x)}</span></div>
  ${x.proof?`<div class="meta"><span>${esc(x.proof)}</span></div>`:""}
  ${mode==="suite"&&late&&x.rep.own&&x.to?`<div class="next">${NEXT[x.s]}</div>`:""}</div></div>`;
}
function render(){
  const own=ALL.filter(x=>x.rep.own);
  const sg=(()=>{const m=mode;mode="suite";const r=groups();mode=m;return Object.fromEntries(r.map(x=>[x.id,x.L.length]))})();
  $("#lead").innerHTML=`${sg.rel} recommandations échues attendent une suite, ${sg.sur} arrivent à échéance. <span>Sur ${own.length} recommandations de vos rapports, ${own.filter(x=>x.s==="done").length} sont mises en œuvre ; ${sg.inx} ne peut pas être suivie faute de destinataire et d'échéance.</span>`;
  $("#mode").innerHTML=Object.entries(MODES).map(([k,v])=>`<button type="button" data-mode="${k}" aria-pressed="${mode===k}">${v}</button>`).join("");
  $("#reg").innerHTML=groups().map(G=>`<section class="panel grp ${shut.has(G.id)?"":"open"}" data-g="${G.id}">
    <button class="gh" type="button" aria-expanded="${!shut.has(G.id)}"><span><b>${esc(G.t)}</b>${G.sub?`<small>${esc(G.sub)}</small>`:""}</span><span class="n">${G.L.length}</span><span class="chev" aria-hidden="true">▶</span></button>
    <div class="slide"><div>${G.L.length?G.L.map(item).join(""):`<div class="empty">Rien pour l'instant.</div>`}</div></div></section>`).join("");
}
function go(key){
  if(mode!=="suite"){mode="suite"}
  const gid=groups().find(G=>G.L.some(x=>x.key===key))?.id; shut.delete(gid); render();
  const el=$("#k"+key); if(!el) return;
  el.classList.add("hl"); el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
  setTimeout(()=>el.classList.remove("hl"),1800);
}
/* --- rédaction : le texte porte l'acte ; destinataire, échéance et vecteur sont des champs, pré-remplis depuis le texte --- */
const TOS=[...new Set(ALL.map(x=>x.to).filter(Boolean))];
$("#tos").innerHTML=TOS.map(t=>`<option value="${esc(t)}">`).join("");
const VERBS=["Publier","Créer","Fixer"];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
let A=null, showErr=false;
function deduce(){
  const c=A.crit;
  if(!touched.to){ $("#to").value=c.to.c==="ok"?cap(c.to.m.trim()):""; }
  $("#toh").innerHTML=!touched.to&&c.to.c==="ok"?`Déduit du texte : <mark>${esc(c.to.m.trim())}</mark>`:"";
  if(!touched.due){ const y=c.due.c==="ok"&&c.due.m.match(/\d{4}/); let v="";
    if(y){ const d=c.due.m.match(/(\d{1,2})(?:er)? (janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre) (\d{4})/);
      const M=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
      v=d?`${d[3]}-${String(M.indexOf(d[2])+1).padStart(2,"0")}-${String(d[1]).padStart(2,"0")}`:/finances|plf/.test(c.due.m)?`${+y[0]-1}-10-01`:`${y[0]}-12-31`; }
    $("#due").value=v; }
  $("#dueh").innerHTML=!touched.due&&c.due.c==="ok"?`Déduit du texte : <mark>${esc(c.due.m)}</mark>`:"";
  if(!touched.vec){ const m=c.vec.c==="ok"?c.vec.m:""; $("#vec").value=/finances|plf/.test(m)?"Loi de finances":m?cap(m):""; if($("#vec").selectedIndex<0)$("#vec").value=""; }
  $("#vech").innerHTML=!touched.vec&&c.vec.c==="ok"?`Déduit du texte : <mark>${esc(c.vec.m)}</mark>`:"";
}
function problems(){
  const p=[]; const c=A.crit;
  if(c.acte.c!=="ok") p.push({f:"t",m:c.acte.c==="err"?`Remplacez « ${c.acte.m} » par l'acte attendu (publier, créer, fixer…).`:"Commencez le texte par l'acte attendu : publier, créer, fixer…"});
  if(!$("#to").value.trim()) p.push({f:"to",m:"Indiquez qui doit agir : un ministre, le Gouvernement, une agence."});
  const d=$("#due").value;
  if(!d) p.push({f:"due",m:"Choisissez une date : c'est le repère du suivi à six mois."});
  else if(d<"2026-11-11") p.push({f:"due",m:`Cette date est déjà passée : choisissez une date après le ${fdate("2026-11-10")}.`});
  return p;
}
function check(){
  A=analyse($("#t").value); deduce(); const c=A.crit.acte;
  $("#acte").innerHTML=`<div class="msg"><span class="dot ${c.c}"></span><span>${c.l}${c.c==="ok"?` : <mark>${esc(c.m)}</mark>`:`<small>${esc(c.s)}</small>`}</span></div>`+
    (c.c==="err"?`<div class="fixes">${VERBS.map(v=>`<button type="button" class="ghost" data-verb="${v}">Remplacer par « ${v} »</button>`).join("")}</div>`:"");
  const ADV={done:"Déjà mise en œuvre : inutile de la reformuler.",part:"En partie seulement : précisez ce qui manque plutôt que de répéter.",no:"Restée sans suite : la reprendre, c'est relancer ; citez-la.",wait:"Pas encore échue : renvoyez-y plutôt que de la doubler."};
  $("#dup").innerHTML=A.near.length?A.near.map(({x})=>`<button type="button" data-go="${x.key}"><b>${x.rep.own?"Rapport n° "+x.rep.id:x.rep.short}, reco. ${x.n}</b> — ${esc(x.t)}<span class="adv">${ADV[x.s]}</span></button>`).join(""):`<span class="hint">Rien de proche dans le registre.</span>`;
  const P=problems(); ["t","to","due"].forEach(f=>$("#"+f).classList.toggle("bad",showErr&&P.some(p=>p.f===f)));
  $("#sum").innerHTML=showErr&&P.length?`<div class="err-sum" role="alert">Pour pouvoir être suivie, il manque encore :<ul>${P.map(p=>`<li><a href="#${p.f}" data-focus="${p.f}">${esc(p.m)}</a></li>`).join("")}</ul></div>`:"";
}
function renderProj(){
  $("#proj").hidden=!proj.length;
  $("#proj").innerHTML=`<span class="lb" style="font-size:12px;color:var(--muted)">Projet de rapport · ${proj.length} recommandation${proj.length>1?"s":""}</span><ol>${proj.map((p,i)=>`<li>${esc(p.t)}<small>${esc(p.to)} · avant le ${fdate(p.due)}${p.vec?" · "+p.vec:""}<button type="button" class="ghost" data-rm="${i}">Retirer</button></small></li>`).join("")}</ol>`;
}
$("#form").addEventListener("submit",e=>{e.preventDefault(); showErr=true; check(); const P=problems();
  if(P.length){ $("#"+P[0].f).focus(); return; }
  proj.push({t:$("#t").value.trim(),to:$("#to").value.trim(),due:$("#due").value,vec:$("#vec").value}); renderProj();
  $("#t").value=""; Object.keys(touched).forEach(k=>touched[k]=false); showErr=false; check(); toast("Ajoutée au projet de rapport.");});
["to","due","vec"].forEach(id=>$("#"+id).addEventListener("input",()=>{touched[id]=true;check()}));
let tm; $("#t").addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(check,150)});
document.addEventListener("click",e=>{
  const m=e.target.closest("[data-mode]"); if(m){mode=m.dataset.mode;render();return}
  const h=e.target.closest(".gh"); if(h){const g=h.parentElement.dataset.g; shut.has(g)?shut.delete(g):shut.add(g); h.parentElement.classList.toggle("open"); h.setAttribute("aria-expanded",!shut.has(g)); return}
  const g=e.target.closest("[data-go]"); if(g){go(g.dataset.go);return}
  const v=e.target.closest("[data-verb]"); if(v){const t=$("#t"); t.value=t.value.replace(/^\s*(réfléchir (à|sur)|étudier|envisager|engager une réflexion sur|veiller à|favoriser|encourager|poursuivre|mieux)\s+/i,v.dataset.verb+" "); check(); t.focus(); return}
  const f=e.target.closest("[data-focus]"); if(f){e.preventDefault();$("#"+f.dataset.focus).focus();return}
  const r=e.target.closest("[data-rm]"); if(r){proj.splice(+r.dataset.rm,1);renderProj();return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&showErr){showErr=false;check()}});
$("#t").value=START; render(); check();
</script>

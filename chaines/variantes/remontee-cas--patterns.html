<title>Remontées de permanence · patterns</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0a0b0d; --s1:#111316; --s2:#171a1e; --line:#22252a; --line2:#2d3137;
  --fg:#f3f5f7; --text:#cfd5dd; --muted:#8a919b; --dim:#5d636c;
  --ins:#8ab4ff; --del:#e5484d; --accent:#6e7bf2; --lit:rgba(110,123,242,.16);
  --ok:#46b37e; --warn:#e3a33f; --err:#e5484d;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.25,.8,.25,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.narrow{max-width:780px}
.ctx{font-size:12.5px;color:var(--dim)}
h1{margin:3px 0 0;font:600 19px/1.3 var(--f);color:var(--fg);letter-spacing:-.012em;text-wrap:balance}
.lead{margin:14px 0 18px;max-width:780px;color:var(--fg);font-size:15.5px;line-height:1.55;text-wrap:pretty}
.lead span{color:var(--muted)}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:10px}
.sec{margin:18px 2px 8px;font-size:11.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.btn{border:1px solid var(--line2);background:var(--s2);color:var(--fg);border-radius:7px;padding:7px 12px;font-size:13px;cursor:pointer;transition:background .2s,opacity .2s;white-space:nowrap}
.btn:hover:not(:disabled){background:#1f2227}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover:not(:disabled){background:#7b87f5}
.btn:disabled{opacity:.4;cursor:default}
.ghost{border:1px solid var(--line2);background:none;color:var(--muted);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;transition:color .2s,background .2s}
.ghost:hover{color:var(--fg);background:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;color:var(--muted);font-size:12.5px;background:none;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip:hover{color:var(--fg)}
.chip.on{color:var(--fg);border-color:var(--accent);background:var(--lit)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
ins{color:var(--ins);text-decoration:underline 1px;text-underline-offset:3px;font-weight:500;background:none}
del{color:var(--dim);text-decoration:line-through 1px var(--del);background:none}
mark{background:var(--lit);color:var(--fg);border-radius:3px;padding:0 1px}
input[type=text],input[type=number],textarea,select{background:var(--s2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--fg);font-size:13px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--line2)}
.gp{display:inline-grid;place-items:center;min-width:24px;height:16px;padding:0 4px;border-radius:4px;color:#fff;font-size:9.5px;font-weight:600;vertical-align:1px;margin-right:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--s2);border:1px solid var(--line2);color:var(--fg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100vw - 32px);animation:rise .2s var(--ease)}
@keyframes rise{from{opacity:0;transform:translate(-50%,4px)}}
.slide{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.slide>div{min-height:0;overflow:hidden;opacity:0;transition:opacity .15s}
.open>.slide{grid-template-rows:1fr}
.open>.slide>div{opacity:1;transition:opacity .2s .12s}
.scrollx{overflow-x:auto;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const nf=(n,d=0)=>n.toLocaleString("fr-FR",{maximumFractionDigits:d,minimumFractionDigits:d});
function toast(m){$$(".toast").forEach(e=>e.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}
</script>

<style>
/* Angle « patterns » : liste en accordéon (le détail s'ouvre en place, un sujet à la fois),
   onglets à l'intérieur du détail, squelette pendant l'interrogation des questions écrites,
   tiroir latéral pour rédiger la question, toasts empilés avec « Annuler » au lieu d'une confirmation. */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:var(--muted);padding:10px 12px;min-height:44px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .2s,border-color .2s}
.tab:hover{color:var(--fg)}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.tab span{color:var(--dim);margin-left:4px}
.acc{padding:4px}
.it+.it{border-top:1px solid var(--line)}
.hd{display:grid;grid-template-columns:18px minmax(0,1fr) 132px 112px;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:12px;min-height:56px;border-radius:8px;cursor:pointer;transition:background .2s}
.hd:hover{background:var(--s2)}
.chev{width:8px;height:8px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .25s var(--ease);margin-left:3px}
.it.open .chev{transform:rotate(45deg)}
.hd b{display:block;color:var(--fg);font-weight:500;font-size:13.5px}
.hd small{display:block;color:var(--dim);font-size:12px}
.hd small .sg{color:var(--ok)}
.spark{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;align-items:end;height:28px}
.spark i{display:block;border-radius:2px 2px 0 0;background:var(--line2);min-height:2px}
.spark i.q{background:var(--accent)}
.tr{text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap}
.hd .tr b{display:inline;font-size:13.5px;font-weight:500}
.up b,.up .v{color:#f0c27a} .flat b{color:var(--text)} .down b,.down .v{color:#7fd3a8}
.body{padding:2px 12px 16px 42px}
.sum{margin:0 0 4px;color:var(--fg);font-size:13.5px}
.sum span{color:var(--muted)}
.itabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:6px 0 12px;overflow-x:auto;scrollbar-width:none}
.itabs .tab{min-height:40px;padding:8px 10px;font-size:12.5px}
.pane{min-height:96px;animation:fade .2s var(--ease)}
@keyframes fade{from{opacity:0}}
.cm{display:grid;gap:6px;max-width:520px}
.cr{display:grid;grid-template-columns:118px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:12.5px}
.cr .b{height:6px;border-radius:3px;background:var(--accent)}
.cr .n{text-align:right;color:var(--muted)}
.cr.other{color:var(--dim)} .cr.other .b{background:var(--line2)}
.note{margin:8px 0 0;font-size:12px;color:var(--dim)}
.blk{margin:0;padding-left:16px;font-size:13px;display:grid;gap:4px}
.pq{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--muted);max-width:520px}
.pq+.pq{margin-top:6px}
.pq b{color:var(--text);font-weight:500}
.sk{display:grid;gap:6px;max-width:520px}
.sk div{height:36px;border-radius:8px;border:1px solid var(--line);position:relative;overflow:hidden}
.sk div::before,.sk div::after{content:"";position:absolute;left:10px;top:13px;height:9px;border-radius:4px;background:var(--s2)}
.sk div::before{width:54px}
.sk div::after{left:74px;width:46%}
.sk div{background:linear-gradient(90deg,transparent 0,rgba(255,255,255,.035) 50%,transparent 100%) -200px 0/200px 100% no-repeat;animation:shine 1.1s linear infinite}
@keyframes shine{to{background-position:calc(100% + 200px) 0}}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acts .btn{min-height:44px;padding:0 14px}
.btn.on:disabled{opacity:1}
.btn.on{border-color:rgba(70,179,126,.45);color:var(--ok)}
/* tiroir */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;opacity:0;transition:opacity .25s var(--ease)}
.scrim.show{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--s1);border-left:1px solid var(--line2);z-index:21;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s var(--ease);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.show{transform:none}
.dh{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font:600 16px/1.35 var(--f);color:var(--fg);flex:1}
.dh .ctx{display:block}
.x{width:44px;height:44px;margin:-10px -10px 0 0;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;border-radius:8px;cursor:pointer;flex:none}
.x:hover{color:var(--fg);background:var(--s2)}
.db{flex:1;overflow-y:auto;padding:16px 18px;display:grid;gap:16px;align-content:start}
.f{display:grid;gap:6px}
.f>label,.f legend{font-size:12.5px;color:var(--muted);padding:0}
.f input[type=text],.f select{min-height:44px;font-size:14px;width:100%}
fieldset{border:0;margin:0;padding:0;display:grid;gap:2px}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;font-size:13.5px;color:var(--text);cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.ck span small{color:var(--dim);margin-left:6px;font-size:12px}
.err{font-size:12px;color:#f0a3a5;min-height:0}
.prev{width:100%;min-height:200px;resize:none;line-height:1.6;font-size:13.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--text)}
.df{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.df .btn{min-height:44px;padding:0 16px}
/* toasts */
.toasts{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none;max-width:calc(100vw - 32px)}
.tst{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--line2);border-radius:9px;padding:6px 6px 6px 14px;font-size:13px;color:var(--fg);box-shadow:0 6px 24px rgba(0,0,0,.35);animation:up .22s var(--ease);max-width:420px;transition:opacity .2s}
.tst.err{border-color:rgba(229,72,77,.5)}
.tst .dot{flex:none}
.tst span{flex:1;padding:6px 0}
.tst button{min-height:36px;border:0;background:none;color:var(--ins);font-size:13px;cursor:pointer;border-radius:6px;padding:0 8px}
.tst button.cl{color:var(--muted);font-size:18px;width:36px;padding:0}
.tst button:hover{background:rgba(255,255,255,.05)}
.tst.out{opacity:0}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
@media (max-width:620px){
 .hd{grid-template-columns:14px minmax(0,1fr) auto}.hd .spark{display:none}
 .body{padding-left:12px}.cr{grid-template-columns:96px minmax(0,1fr) 26px}
 .drawer{top:auto;width:100%;max-height:92vh;border-left:0;border-top:1px solid var(--line2);border-radius:14px 14px 0 0;transform:translateY(100%)}
 .toasts{left:16px;right:16px;bottom:auto;top:calc(12px + env(safe-area-inset-top,0px));align-items:stretch}.tst{max-width:none}
}
</style>

<div class="wrap">
  <div class="ctx">Permanence de la 4ᵉ circonscription · dossiers ouverts de décembre 2025 à novembre 2026 · comptes anonymisés</div>
  <h1>Ce qui revient à la permanence</h1>
  <p class="lead" id="lead"></p>
  <div class="tabs" role="tablist" aria-label="Filtrer les sujets" id="filters"></div>
  <section class="panel acc" id="acc" aria-label="Sujets"></section>
  <p class="note">Barres : douze derniers mois, trimestre en cours (septembre à novembre) en couleur.</p>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
const MOIS=["déc.","janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov."];
const M=[
 {k:"anef",t:"Titres de séjour bloqués (ANEF)",court:"titres de séjour bloqués",org:"Préfecture",min:"ministre de l'Intérieur",h:[4,5,3,6,5,7,6,8,9,13,15,17],dur:94,
  com:{"Villeneuve":19,"Saint-Aubin":14,"Les Ormes":9,"Bréval":6,"Montfort":2,"Autres (moins de 3)":2},
  blk:["Rendez-vous introuvable pour un renouvellement","Récépissé expiré pendant l'instruction : perte d'emploi","Dossier marqué « complet » sans suite depuis plus de quatre mois"],
  paris:[{n:"AN 3355",who:"votre bureau",st:"Sans réponse depuis 3 mois"}],q:"les délais d'instruction des demandes de titre de séjour déposées sur l'administration numérique pour les étrangers en France dans le département"},
 {k:"mpr",t:"Aides à la rénovation non versées",court:"aides à la rénovation non versées",org:"Agence nationale de l'habitat",min:"ministre chargé du Logement",h:[6,7,9,8,10,9,8,7,8,9,8,9],dur:142,
  com:{"Villeneuve":22,"Les Ormes":18,"Saint-Aubin":17,"Bréval":11,"Montfort":10,"Autres (moins de 3)":20},
  blk:["Prime attendue plus de six mois après les travaux","Demande de pièces déjà fournies","Artisan non payé, chantier arrêté"],
  paris:[{n:"AN 3187",who:"votre bureau",st:"Sans réponse depuis 6 mois"},{n:"AN 2954",who:"Écologie urbaine",st:"Sans réponse depuis 8 mois"}],q:"les retards de versement des aides à la rénovation énergétique des logements instruites par l'Agence nationale de l'habitat"},
 {k:"caf",t:"Trop-perçus d'aide au logement réclamés",court:"trop-perçus d'aide au logement réclamés",org:"Caisse d'allocations familiales",min:"ministre chargé des Solidarités",h:[3,2,4,3,2,3,9,11,10,8,7,6],dur:61,
  com:{"Villeneuve":16,"Saint-Aubin":15,"Bréval":12,"Les Ormes":9,"Autres (moins de 3)":16},
  blk:["Recalcul rétroactif après la réforme des ressources","Retenue de 100 % sur les prestations"],
  paris:[],q:"les demandes de remboursement d'aides au logement nées du recalcul rétroactif des ressources depuis juin 2026"},
 {k:"mdph",t:"Délais de la maison départementale des personnes handicapées",court:"délais de la maison départementale des personnes handicapées",org:"Département",min:"ministre chargée des Personnes handicapées",h:[5,4,6,5,6,5,6,5,6,5,6,5],dur:188,
  com:{"Villeneuve":18,"Saint-Aubin":14,"Les Ormes":12,"Autres (moins de 3)":20},blk:["Délai de traitement supérieur à six mois","Renouvellement d'allocation interrompu"],paris:[{n:"AN 2190",who:"Solidarité et logement",st:"Répondue en mars 2026"}],q:"les délais de traitement des demandes adressées aux maisons départementales des personnes handicapées"},
 {k:"hlm",t:"Demandes de logement social sans proposition",court:"demandes de logement social sans proposition",org:"Bailleurs, commission d'attribution",min:"ministre chargé du Logement",h:[7,6,8,7,6,7,6,5,7,6,5,6],dur:null,
  com:{"Villeneuve":31,"Saint-Aubin":20,"Les Ormes":11,"Autres (moins de 3)":14},blk:["Ancienneté supérieure à trois ans","Mutation pour handicap non traitée"],paris:[],q:"l'absence de proposition de logement social pour les demandeurs inscrits depuis plus de trois ans"},
 {k:"exp",t:"Menaces d'expulsion locative",court:"menaces d'expulsion locative",org:"Préfecture, commission de prévention",min:"ministre chargé du Logement",h:[2,3,4,3,1,1,1,2,3,4,5,4],dur:35,
  com:{"Villeneuve":9,"Saint-Aubin":8,"Autres (moins de 3)":16},blk:["Commandement de quitter les lieux reçu sans accompagnement social"],paris:[],q:"l'accompagnement social des ménages menacés d'expulsion locative avant la délivrance du commandement de quitter les lieux"},
];
const sum=a=>a.reduce((x,y)=>x+y,0);
const trend=m=>{const q=sum(m.h.slice(9)),p=sum(m.h.slice(6,9));return {q,p,r:p?q/p:9,cls:(p&&q/p<=.8)?"down":(!p||q/p>=1.3)?"up":"flat"}};
/* Règle d'anonymat : une commune comptant moins de 3 dossiers n'est jamais nommée ; elle rejoint « autres communes ». */
function communes(m){const named=[],hidden=[];let autres=0;for(const[c,n]of Object.entries(m.com)){if(c.startsWith("Autres"))autres+=n;else if(n<3){autres+=n;hidden.push(c)}else named.push([c,n])}named.sort((a,b)=>b[1]-a[1]);return{named,autres,hidden}}
const ALLCOM=[...new Set(M.flatMap(m=>Object.keys(m.com).filter(c=>!c.startsWith("Autres"))))];

const FILTERS=[{k:"all",t:"Tous",f:()=>true},{k:"up",t:"En hausse",f:m=>trend(m).cls==="up"},{k:"none",t:"Personne ne le porte à Paris",f:m=>!m.paris.length}];
let filter="all", open=null, itab={}, loaded={}, signaled={};
const lc=s=>s.charAt(0).toLowerCase()+s.slice(1);
const trendWord=t=>t.cls==="up"?`×${nf(t.r,1)}`:t.cls==="down"?"en baisse":"stable";
const byK=k=>M.find(m=>m.k===k);

/* ---------- toasts empilés (3 au plus), avec action facultative ---------- */
function notify(msg,{kind="ok",action,onAction,ms=5000}={}){
  const box=$("#toasts"); while(box.children.length>=3) box.firstChild.remove();
  const t=document.createElement("div"); t.className="tst"+(kind==="err"?" err":""); t.setAttribute("role",kind==="err"?"alert":"status");
  t.innerHTML=`<i class="dot ${kind==="err"?"err":"ok"}"></i><span>${esc(msg)}</span>${action?`<button class="ac">${action}</button>`:""}<button class="cl" aria-label="Fermer">×</button>`;
  const kill=()=>{t.classList.add("out");setTimeout(()=>t.remove(),200)}; let tm=setTimeout(kill,ms);
  t.addEventListener("mouseenter",()=>clearTimeout(tm)); t.addEventListener("mouseleave",()=>{tm=setTimeout(kill,2500)});
  t.querySelector(".cl").onclick=kill; if(action) t.querySelector(".ac").onclick=()=>{onAction();kill()};
  box.append(t)}

/* ---------- rendu ---------- */
function render(){
  const T=M.map(m=>({m,...trend(m)})).sort((a,b)=>(b.q-b.p)-(a.q-a.p));
  const ups=T.filter(t=>t.cls==="up");
  $("#lead").innerHTML=`${ups.length>1?ups.length+" sujets montent":"Un sujet monte"} ce trimestre. <span>${ups.map((t,i)=>`${i?t.m.court:t.m.t} : ${t.q} dossiers, contre ${t.p}`).join(" ; ")}.</span>`;
  $("#filters").innerHTML=FILTERS.map(f=>`<button class="tab" role="tab" id="f-${f.k}" aria-selected="${filter===f.k}" tabindex="${filter===f.k?0:-1}" aria-controls="acc" data-f="${f.k}">${f.t}<span>${M.filter(f.f).length}</span></button>`).join("");
  const L=T.filter(t=>FILTERS.find(f=>f.k===filter).f(t.m));
  if(open&&!L.some(t=>t.m.k===open)) open=null;
  $("#acc").innerHTML=L.map(({m,q,...t})=>{const mx=Math.max(...m.h),o=open===m.k;
    return `<div class="it ${o?"open":""}" data-k="${m.k}"><button class="hd" aria-expanded="${o}" aria-controls="b-${m.k}" id="h-${m.k}"><i class="chev" aria-hidden="true"></i>
      <span><b>${esc(m.t)}</b><small>${esc(m.org)} · ${sum(m.h)} dossiers sur 12 mois${signaled[m.k]?` · <span class="sg">signalé à Paris</span>`:""}</small></span>
      <span class="spark" aria-hidden="true">${m.h.map((v,i)=>`<i class="${i>=9?"q":""}" style="height:${Math.round(2+26*v/mx)}px"></i>`).join("")}</span>
      <span class="tr ${t.cls}"><b>${q}</b> ce trimestre<br><span class="v">${trendWord(t)}</span></span></button>
      <div class="slide" id="b-${m.k}" role="region" aria-labelledby="h-${m.k}"><div>${o?detail(m):""}</div></div></div>`}).join("");
  if(open) paneFill(byK(open));
}
const ITABS=m=>[["com","Communes"],["blk",`Blocages <span>${m.blk.length}</span>`],["paris","À Paris"]];
function detail(m){const t=trend(m), cur=itab[m.k]||"com";
  return `<div class="body"><p class="sum">${t.q} dossiers ce trimestre, contre ${t.p}. <span>${m.dur?`Résolution en ${Math.round(m.dur/30.4)} mois (médiane).`:"Aucun dossier résolu à ce jour."}</span></p>
   <div class="itabs" role="tablist" aria-label="Détail">${ITABS(m).map(([k,l])=>`<button class="tab" role="tab" data-it="${k}" aria-selected="${cur===k}" tabindex="${cur===k?0:-1}" aria-controls="p-${m.k}">${l}</button>`).join("")}</div>
   <div class="pane" id="p-${m.k}" role="tabpanel"></div>
   <div class="acts"><button class="btn pri" data-q="${m.k}">Préparer une question écrite</button>
    <button class="btn ${signaled[m.k]?"on":""}" data-s="${m.k}" ${signaled[m.k]?"disabled":""}>${signaled[m.k]?"Signalé à l'équipe de Paris":"Signaler à l'équipe de Paris"}</button></div></div>`}
function paneFill(m){const p=$(`#p-${m.k}`); if(!p) return; const cur=itab[m.k]||"com";
  if(cur==="com"){const c=communes(m),mx=Math.max(...c.named.map(x=>x[1]),c.autres);
    p.innerHTML=`<div class="cm">${c.named.map(([n,v])=>`<div class="cr"><span>${n}</span><span class="b" style="width:${Math.round(100*v/mx)}%"></span><span class="n">${v}</span></div>`).join("")}${c.autres?`<div class="cr other"><span>Autres communes</span><span class="b" style="width:${Math.round(100*c.autres/mx)}%"></span><span class="n">${c.autres}</span></div>`:""}</div><p class="note">Sur 12 mois. Une commune comptant moins de trois dossiers n'est pas nommée.</p>`}
  else if(cur==="blk") p.innerHTML=`<ul class="blk">${m.blk.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`;
  else{ const show=()=>{p.innerHTML=m.paris.length?m.paris.map(x=>`<div class="pq"><b>${x.n}</b> · ${x.who} · ${x.st}</div>`).join(""):`<div class="pq">Aucune question écrite sur ce sujet : <b>personne ne le porte</b>.</div>`};
    if(loaded[m.k]) return show();
    /* La base des questions écrites est distante : au-delà de 400 ms, on montre la forme de ce qui vient. */
    p.innerHTML=`<div class="sk" aria-label="Chargement des questions écrites" aria-busy="true">${"<div></div>".repeat(Math.max(1,m.paris.length))}</div>`;
    setTimeout(()=>{loaded[m.k]=1; if((itab[m.k]||"com")==="paris"&&open===m.k) show()},750)}}

function toggle(k){const prev=open; open=open===k?null:k; const it=x=>document.querySelector(`.it[data-k="${x}"]`);
  if(prev&&it(prev)){const p=it(prev),inner=p.querySelector(".slide>div");p.classList.remove("open");p.querySelector(".hd").setAttribute("aria-expanded","false");setTimeout(()=>{if(open!==prev)inner.innerHTML=""},320)}
  if(open){const n=it(open),m=byK(open);n.querySelector(".slide>div").innerHTML=detail(m);paneFill(m);n.querySelector(".hd").setAttribute("aria-expanded","true");void n.offsetWidth;n.classList.add("open");
    setTimeout(()=>{const r=n.getBoundingClientRect();if(r.bottom>innerHeight)n.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})},330)}
  it(k)?.querySelector(".hd").focus({preventScroll:true})}

/* ---------- tiroir de rédaction ---------- */
const SIGN="Mme Hélène Marchal"; let D=null, lastFocus=null;
const MINS=[...new Set(M.map(m=>m.min))];
function qText(m,o){const t=trend(m), parts=[`${o.sign||"[signataire]"} attire l'attention de M. le ${o.min} sur ${m.q}.`];
  if(o.evo) parts.push(`Sa permanence a reçu ${t.q} sollicitations à ce sujet ces trois derniers mois, contre ${t.p} le trimestre précédent.`);
  if(o.blk) parts.push(`Les difficultés les plus fréquentes sont : ${m.blk.map(lc).join(" ; ")}.`);
  if(o.dur&&m.dur) parts.push(`Il faut le plus souvent ${Math.round(m.dur/30.4)} mois pour qu'une situation soit résolue.`);
  parts.push(`Elle lui demande quelles mesures il entend prendre.`); return parts.join(" ")}
function openDrawer(m){lastFocus=document.activeElement;
  const o={sign:SIGN,min:m.min,evo:true,blk:true,dur:!!m.dur};
  const mine=m.paris.find(p=>p.who==="votre bureau");
  const sc=document.createElement("div");sc.className="scrim";const d=document.createElement("aside");d.className="drawer";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");d.setAttribute("aria-labelledby","dt");
  d.innerHTML=`<div class="dh"><div style="flex:1"><span class="ctx">${esc(m.t)}</span><h2 id="dt">Question écrite</h2></div><button class="x" aria-label="Fermer">×</button></div>
   <div class="db">${mine?`<div class="pq">Votre bureau a déjà déposé <b>${mine.n}</b> (${lc(mine.st)}). Celle-ci peut servir de relance.</div>`:""}
    <div class="f"><label for="d-sign">Signataire</label><input type="text" id="d-sign" value="${esc(o.sign)}" autocomplete="off"><div class="err" id="e-sign"></div></div>
    <div class="f"><label for="d-min">Ministre interrogé</label><select id="d-min">${MINS.map(x=>`<option ${x===o.min?"selected":""}>${x}</option>`).join("")}</select></div>
    <fieldset class="f"><legend>Chiffres agrégés à citer</legend>
     <label class="ck"><input type="checkbox" id="d-evo" checked><span>Évolution sur le trimestre<small>${trend(m).q} contre ${trend(m).p}</small></span></label>
     <label class="ck"><input type="checkbox" id="d-blk" checked><span>Blocages fréquents<small>${m.blk.length}</small></span></label>
     ${m.dur?`<label class="ck"><input type="checkbox" id="d-dur" checked><span>Délai de résolution<small>${Math.round(m.dur/30.4)} mois</small></span></label>`:""}</fieldset>
    <div class="f"><label for="d-prev">Aperçu</label><textarea class="prev" id="d-prev" readonly></textarea></div>
   </div>
   <div class="df"><button class="btn pri" id="d-copy">Copier la question</button><button class="btn" id="d-close">Fermer</button></div>`;
  document.body.append(sc,d); D={m,o,d,sc};
  const upd=()=>{o.sign=$("#d-sign").value.trim();o.min=$("#d-min").value;o.evo=$("#d-evo").checked;o.blk=$("#d-blk").checked;o.dur=!!($("#d-dur")?.checked);
    $("#d-prev").value=qText(m,o);const bad=o.sign.length<4;$("#e-sign").textContent=bad?"Indiquez le nom de la députée : il ouvre la question.":"";$("#d-copy").disabled=bad};
  d.addEventListener("input",upd);d.addEventListener("change",upd);upd();
  d.querySelector(".x").onclick=closeDrawer;$("#d-close").onclick=closeDrawer;sc.onclick=closeDrawer;
  $("#d-copy").onclick=()=>{const txt=$("#d-prev").value;
    const fail=()=>{const p=$("#d-prev");p.focus();p.select();notify("Copie bloquée par le navigateur : le texte est sélectionné dans l'aperçu, faites Ctrl+C.",{kind:"err",ms:8000})};
    if(!navigator.clipboard) return fail();
    navigator.clipboard.writeText(txt).then(()=>{closeDrawer();notify("Question copiée : chiffres agrégés seulement.")},fail)};
  requestAnimationFrame(()=>{sc.classList.add("show");d.classList.add("show");$("#d-sign").focus()})}
function closeDrawer(){if(!D)return;const{d,sc}=D;D=null;d.classList.remove("show");sc.classList.remove("show");setTimeout(()=>{d.remove();sc.remove()},300);lastFocus&&lastFocus.focus()}

/* ---------- gestes ---------- */
document.addEventListener("click",e=>{
  const f=e.target.closest("[data-f]"); if(f){filter=f.dataset.f;render();$(`#f-${filter}`).focus();return}
  const h=e.target.closest(".hd"); if(h){toggle(h.closest(".it").dataset.k);return}
  const it=e.target.closest("[data-it]"); if(it){const k=it.closest(".it").dataset.k;itab[k]=it.dataset.it;$$(`.it[data-k="${k}"] [data-it]`).forEach(b=>{const on=b===it;b.setAttribute("aria-selected",on);b.tabIndex=on?0:-1});paneFill(byK(k));return}
  const q=e.target.closest("[data-q]"); if(q){openDrawer(byK(q.dataset.q));return}
  const s=e.target.closest("[data-s]"); if(s){const k=s.dataset.s;signaled[k]=1;render();$(`.it[data-k="${k}"] [data-q]`)?.focus();
    notify(`Signalé à l'équipe de Paris : ${byK(k).court}.`,{action:"Annuler",ms:6000,onAction:()=>{delete signaled[k];render();notify("Signalement annulé.")}})}
});
document.addEventListener("keydown",e=>{
  if(D){ if(e.key==="Escape"){e.preventDefault();closeDrawer();return}
    if(e.key==="Tab"){const F=[...D.d.querySelectorAll("button,input,select,textarea")].filter(x=>!x.disabled);const a=F[0],z=F[F.length-1];
      if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}return}
  const a=document.activeElement;
  if(a?.classList.contains("hd")&&["ArrowDown","ArrowUp","Home","End"].includes(e.key)){e.preventDefault();const L=$$(".hd"),i=L.indexOf(a);
    const n=e.key==="Home"?0:e.key==="End"?L.length-1:Math.max(0,Math.min(L.length-1,i+(e.key==="ArrowDown"?1:-1)));L[n].focus();return}
  if(a?.getAttribute("role")==="tab"&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){e.preventDefault();const L=[...a.parentElement.children],i=L.indexOf(a);
    L[(i+(e.key==="ArrowRight"?1:-1)+L.length)%L.length].click();return}
  if(e.key==="Escape"&&open){const k=open;toggle(k)}
});
open=M.map(m=>({m,...trend(m)})).sort((a,b)=>(b.q-b.p)-(a.q-a.p))[0].m.k;
render();
</script>

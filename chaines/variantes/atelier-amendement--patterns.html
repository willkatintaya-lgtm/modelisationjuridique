<title>Atelier d'amendement · patterns</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Variante « patterns », refaite d'après la skill interaction-patterns (10 règles).
   Menu contextuel (role=menu) au lieu du menu flottant libre ; formulaire en place sous l'alinéa (libellés au-dessus,
   validation à la sortie du champ) ; pastilles de contrôle + tiroir non modal ; <dialog> natif pour les seules
   suppressions qui écrasent du travail ; toasts empilés (haut-droite / bas-centre) avec « Annuler » ;
   tableau de séance à glisser-déposer au pointeur ET au clavier (saisir, flèches, déposer, Échap). */
:root{
  --bg:#0a0b0d; --s1:#111316; --s2:#171a1e; --line:#22252a; --line2:#2d3137;
  --fg:#f3f5f7; --text:#cfd5dd; --muted:#8a919b; --dim:#5d636c;
  --ins:#8ab4ff; --del:#e5484d; --accent:#6e7bf2; --lit:rgba(110,123,242,.16);
  --ok:#46b37e; --warn:#e3a33f; --err:#e5484d;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.25,.8,.25,1);
  --hit:32px; /* cible minimale au pointeur fin (≥ 24 px) ; 44 px au tactile */
  color-scheme:dark;
}
@media (pointer:coarse){:root{--hit:44px}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:16px;top:-60px;z-index:60;background:var(--accent);color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;font-size:13px}
.skip:focus{top:12px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctx{font-size:12.5px;color:var(--dim)}
h1{margin:3px 0 0;font:600 19px/1.3 var(--f);color:var(--fg);letter-spacing:-.012em;text-wrap:balance}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--hit);border:1px solid var(--line2);background:var(--s2);color:var(--fg);border-radius:7px;padding:0 14px;font-size:13px;cursor:pointer;transition:background .2s,opacity .2s;white-space:nowrap}
.btn:hover:not(:disabled){background:#1f2227}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover:not(:disabled){background:#7b87f5}
.btn.danger{background:rgba(229,72,77,.14);border-color:rgba(229,72,77,.5);color:#ffb4b6}
.btn.danger:hover{background:rgba(229,72,77,.24)}
.btn:disabled{opacity:.4;cursor:default}
.ghost{display:inline-flex;align-items:center;min-height:var(--hit);border:1px solid transparent;background:none;color:var(--muted);border-radius:7px;padding:0 10px;font-size:12.5px;cursor:pointer;transition:color .2s,background .2s}
.ghost:hover{color:var(--fg);background:var(--s2)}
.ico{width:var(--hit);height:var(--hit);flex:none;border:0;background:none;color:var(--dim);border-radius:7px;cursor:pointer;display:grid;place-items:center;transition:color .2s,background .2s}
.ico:hover{color:var(--fg);background:var(--line)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
ins{color:var(--ins);text-decoration:underline 1px;text-underline-offset:3px;font-weight:500;background:none}
del{color:var(--dim);text-decoration:line-through 1px var(--del);background:none}
del+ins{margin-left:.3em}
.gp{display:inline-grid;place-items:center;min-width:24px;height:16px;padding:0 4px;border-radius:4px;color:#fff;font-size:9.5px;font-weight:600;vertical-align:1px;margin-right:4px}
.chev{transition:transform .3s var(--ease);color:var(--dim);flex:none}

/* en-tête et onglets (role=tablist, tabindex itinérant) */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;margin-bottom:18px}
.tabs{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--s1);gap:2px}
.tab{border:0;background:none;padding:0 16px;min-height:var(--hit);border-radius:7px;color:var(--muted);font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{background:var(--s2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.tab .cnt{font-size:11.5px;color:var(--dim)}
[role=tabpanel]:focus-visible{outline-offset:6px;border-radius:10px}
.view{animation:vin .26s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(4px)}}

/* rédiger */
.desk{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.art{padding:18px 22px 22px}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hd b{color:var(--fg);font-weight:600;font-size:15px}
.hd span{color:var(--dim);font-size:12.5px}
.hd .sp{flex:1}
.how{margin:0 0 10px;font-size:12.5px;color:var(--dim)}
.al{display:grid;grid-template-columns:var(--hit) minmax(0,1fr);gap:0 8px;padding:3px 0}
.al .n{border:0;background:none;height:var(--hit);width:var(--hit);border-radius:7px;color:var(--dim);font-size:12px;cursor:pointer;transition:color .2s,background .2s}
.al .n:hover,.al .n[aria-expanded="true"]{color:var(--fg);background:var(--s2)}
.al .n.new{color:var(--ins);font-weight:600;cursor:default;display:grid;place-items:center}
.t{margin:0;padding-top:calc((var(--hit) - 25px)/2);font-size:14.5px;line-height:1.72;color:var(--text);user-select:text;-webkit-user-select:text}
mark.pend{background:var(--lit);color:var(--fg);border-radius:3px;box-shadow:0 0 0 1px rgba(110,123,242,.5)}
.lit{background:var(--lit);border-radius:3px;transition:background .2s}
.gone .t{color:var(--dim)}
.banner{margin:0 0 10px;padding:8px 12px;border-radius:7px;background:rgba(229,72,77,.08);color:#f2a7a9;font-size:12.5px}

/* formulaire en place sous l'alinéa */
.edit{margin:6px 0 10px calc(var(--hit) + 8px);padding:14px;border:1px solid var(--line2);border-radius:10px;background:var(--s2);animation:vin .22s var(--ease)}
.edit fieldset{border:0;margin:0;padding:0;min-width:0}
.edit legend{padding:0;margin:0 0 10px;color:var(--fg);font-weight:500;font-size:13.5px}
.fld{display:grid;gap:4px;margin-bottom:12px}
.fld label{font-size:12.5px;font-weight:500;color:var(--text)}
.fld .hint{font-size:12px;color:var(--dim)}
.fld input,.fld select{width:100%;min-height:var(--hit);background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:0 10px;color:var(--fg);font-size:14px}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--accent)}
.fld input[aria-invalid="true"]{border-color:var(--err)}
.fld .er{margin:0;font-size:12.5px;color:#f2a7a9}
.fld .er:empty{display:none}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px}
.row2.one{grid-template-columns:minmax(0,1fr)}
.acts{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap}
.acts .ghost{margin-right:auto}

/* menu contextuel */
.menu{position:absolute;z-index:35;min-width:230px;max-width:calc(100vw - 32px);background:var(--s2);border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.5);padding:4px;animation:vin .16s var(--ease)}
.menu .k{display:block;padding:6px 10px 4px;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu [role=menuitem]{display:flex;align-items:center;width:100%;min-height:var(--hit);border:0;background:none;color:var(--text);padding:0 10px;border-radius:7px;font-size:13.5px;cursor:pointer;text-align:left}
.menu [role=menuitem]:hover,.menu [role=menuitem]:focus{background:var(--line);color:var(--fg);outline:none}
.menu [role=menuitem][aria-disabled="true"]{opacity:.4;cursor:default}
.menu hr{border:0;border-top:1px solid var(--line2);margin:4px 6px}
.menu .dz{color:#f2a7a9}
.out{animation:fade .18s ease forwards!important}
@keyframes fade{to{opacity:0}}

/* colonne de droite */
.side{display:grid;gap:14px;position:sticky;top:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:var(--hit);border:1px solid var(--line2);border-radius:999px;padding:0 12px;color:var(--text);font-size:12.5px;background:var(--s1);cursor:pointer;transition:background .2s,border-color .2s}
.chip:hover{background:var(--s2)}
.chip[aria-expanded="true"]{border-color:var(--accent);background:var(--lit)}
.amd{padding:16px 18px}
.from{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.from b{color:var(--text);font-weight:500}
.disp{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.disp li{display:grid;grid-template-columns:minmax(0,1fr) var(--hit);gap:6px;align-items:start;padding:6px 4px 6px 10px;border-radius:7px;background:var(--s2);font-size:13.5px;line-height:1.6;color:var(--fg);animation:vin .25s var(--ease);transition:box-shadow .2s}
.disp li span{padding-top:calc((var(--hit) - 22px)/2)}
.disp li.hl{box-shadow:inset 0 0 0 1px var(--accent)}
.empty{margin:12px 0 0;padding:14px;border:1px dashed var(--line2);border-radius:7px;color:var(--muted);font-size:13px}
details.disc{margin-top:12px;border-top:1px solid var(--line)}
details.disc>summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) 14px;gap:10px;align-items:center;min-height:44px;padding:8px 0;cursor:pointer;color:var(--fg)}
details.disc>summary::-webkit-details-marker{display:none}
details.disc>summary small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.disc[open]>summary .chev{transform:rotate(90deg)}
#expoD[open]>summary small{display:none}
details.disc textarea{width:100%;min-height:110px;resize:vertical;margin:2px 0 4px;background:var(--s2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--text);font-size:13px;line-height:1.55}
details.disc textarea:focus{outline:none;border-color:var(--accent)}
details.disc .hint{margin:0;font-size:12px;color:var(--dim)}
.amd .acts{margin-top:14px}
.why{margin:8px 0 0;font-size:12.5px;color:#f2a7a9}
.why button{border:0;background:none;color:var(--fg);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;font-size:12.5px}

/* tiroir non modal */
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(420px,100%);background:var(--s1);border-left:1px solid var(--line2);box-shadow:-16px 0 40px rgba(0,0,0,.45);display:flex;flex-direction:column;animation:slin .26s var(--ease)}
.drawer.out{animation:slout .2s ease forwards!important}
@keyframes slin{from{transform:translateX(30px);opacity:0}}
@keyframes slout{to{transform:translateX(30px);opacity:0}}
.drawer-h{display:flex;align-items:center;gap:10px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px 18px;border-bottom:1px solid var(--line)}
.drawer-h h2{flex:1;margin:0;color:var(--fg);font-weight:600;font-size:15px}
.drawer-b{overflow:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 32px 18px;scrollbar-width:thin}
.ck{padding:14px 10px;margin:0 -10px;border-radius:8px;border-top:1px solid var(--line);display:grid;grid-template-columns:12px minmax(0,1fr);gap:4px 12px}
.ck:first-child{border-top:0}
.ck .dot{margin-top:7px}
.ck h3{margin:0;font:500 14px/1.45 var(--f);color:var(--fg)}
.ck .bd{grid-column:2;font-size:13px;color:var(--muted);line-height:1.6}
.ck .bd p{margin:0 0 6px}
.ck .bd b{color:var(--text);font-weight:500}
.ck .acts{grid-column:2;justify-content:flex-start;margin-top:4px}
.ck.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{background:var(--lit)}}

/* boîte de dialogue native (confirmation destructive) */
dialog{border:1px solid var(--line2);border-radius:12px;background:var(--s1);color:var(--text);padding:20px;width:min(440px,calc(100vw - 32px));box-shadow:0 24px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog[open]{animation:vin .2s var(--ease)}
dialog h2{margin:0 0 8px;font:600 16px/1.35 var(--f);color:var(--fg)}
dialog p{margin:0 0 8px;font-size:13.5px;line-height:1.6}
dialog .acts{margin-top:16px}

/* toasts : haut-droite au bureau, bas-centre sur mobile ; 3 au plus */
.toasts{position:fixed;top:16px;right:max(16px,env(safe-area-inset-right,0px));z-index:50;display:flex;flex-direction:column-reverse;gap:8px;width:min(380px,calc(100vw - 32px));pointer-events:none}
.tst{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--line2);border-radius:10px;padding:6px 6px 6px 12px;font-size:13px;color:var(--fg);box-shadow:0 10px 28px rgba(0,0,0,.45);animation:tin .22s var(--ease)}
.tst.error{border-color:rgba(229,72,77,.55)}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}
.tst span{flex:1;min-width:0;padding:4px 0}
.tst .btn{min-height:var(--hit);padding:0 10px;font-size:12.5px}

/* séance : tableau */
.answer{padding:16px 18px;margin-bottom:14px}
.answer p{margin:0;color:var(--fg);font-size:15px;line-height:1.55;text-wrap:pretty}
.answer .sub{margin-top:6px;color:var(--muted);font-size:13px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin:0 2px 8px;font-size:12.5px;color:var(--dim)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.colm{border:1px solid var(--line);border-radius:12px;background:var(--s1);padding:8px;min-height:120px;transition:border-color .2s,background .2s,opacity .2s}
.colm.over{border-color:var(--accent);background:rgba(110,123,242,.07)}
.dragging .colm.nodrop{opacity:.5}
.colm-h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:var(--hit);padding:0 6px 4px;font-size:11.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.colm-h .ghost{text-transform:none;letter-spacing:0}
.zone{display:grid;gap:8px}
.gh{padding:4px 6px 0;font-size:11px;color:var(--dim)}
.grp{display:grid;gap:6px}
.hint0{padding:16px 10px;border:1px dashed var(--line2);border-radius:8px;color:var(--dim);font-size:12.5px;text-align:center}
.zone .card~.hint0,.zone .grp~.hint0{display:none}
.card{display:grid;grid-template-columns:var(--hit) minmax(0,1fr) auto;gap:0 6px;align-items:start;padding:4px 4px 6px 2px;border-radius:9px;background:var(--s2);border:1px solid transparent;font-size:13px;transition:border-color .2s,opacity .2s,transform .2s,box-shadow .2s}
.card:hover{border-color:var(--line2)}
.card.mine{border-color:rgba(110,123,242,.45)}
.card.fell{background:none;border-color:var(--line)}
.card.fell .what{color:var(--dim);text-decoration:line-through 1px var(--del)}
.card.lifted{transform:scale(1.02);box-shadow:0 14px 30px rgba(0,0,0,.5),0 0 0 2px var(--accent);border-color:transparent}
.card.ghosted{opacity:.4}
.card .grip{width:var(--hit);height:var(--hit);border:0;background:none;color:var(--dim);border-radius:7px;cursor:grab;display:grid;place-items:center;touch-action:none}
.card .grip:hover{color:var(--fg);background:var(--line)}
.card .grip:active{cursor:grabbing}
.card .nograb{width:var(--hit)}
.card .bd{padding-top:calc((var(--hit) - 20px)/2);min-width:0}
.card .num{color:var(--fg);font-weight:500}
.card.mine .num{color:#b4bcff}
.card .pos{color:var(--dim);font-size:11.5px;margin-right:6px}
.card .what{display:block;color:var(--text);line-height:1.45;margin-top:2px}
.card .fellby{display:block;font-size:12px;color:#f2a7a9;margin-top:2px}
.card .mv{white-space:nowrap}
.float{position:fixed;z-index:45;pointer-events:none;margin:0;opacity:.95}
.res{margin-top:16px}
.res details.disc{border:0;margin:0}
.res details.disc>summary{padding:8px 18px;min-height:52px}
.res .body{padding:0 18px 18px}
.res .al{grid-template-columns:40px minmax(0,1fr)}
.res .al .n{width:36px;cursor:default;display:block;text-align:right;padding-right:6px;height:auto;padding-top:4px}
.res .t{padding-top:0}
.ex{display:block;white-space:nowrap;font-size:10.5px;color:var(--dim);line-height:1}
sup.by{font-size:10px;color:var(--muted);margin-left:2px}
.note{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

@media (max-width:960px){.desk{grid-template-columns:minmax(0,1fr)}.side{position:static;order:-1}.board{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .toasts{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:auto;left:50%;transform:translateX(-50%)}
  @keyframes tin{from{transform:translateY(6px);opacity:0}}
}
@media (max-width:560px){
  .top{align-items:flex-start}.tabs{width:100%}.tab{flex:1}
  .art{padding:12px 10px 16px}.t{font-size:14px}
  .edit{margin-left:0}
  .row2{grid-template-columns:minmax(0,1fr)}
  .acts .btn.pri{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="ctx">Projet de loi pour l'accès au logement · séance publique du jeudi 19 novembre</div>
      <h1>Article 4 · logements vacants</h1>
    </div>
    <div class="tabs" role="tablist" aria-label="Vues">
      <button class="tab" role="tab" id="tab-ecrire" data-v="ecrire" aria-controls="panel">Rédiger</button>
      <button class="tab" role="tab" id="tab-seance" data-v="seance" aria-controls="panel">Séance <span class="cnt" id="cnt"></span></button>
    </div>
  </header>
  <main id="panel" role="tabpanel" tabindex="0"></main>
</div>
<div class="toasts" id="toasts"></div>
<div class="sr" id="live" aria-live="polite"></div>
<div class="sr" id="live-dnd" aria-live="assertive"></div>
<p class="sr" id="dnd-help">Entrée ou Espace pour saisir. Flèches pour changer de colonne. Entrée ou Espace pour déposer, Échap pour annuler.</p>
<dialog id="confirm" aria-labelledby="cf-t" aria-describedby="cf-d">
  <h2 id="cf-t"></h2>
  <div id="cf-d"></div>
  <div class="acts"><button class="btn" id="cf-no" value="cancel">Annuler</button><button class="btn danger" id="cf-yes"></button></div>
</dialog>

<script>
/* ---------- Données fictives ---------- */
const GROUPS={PR:{name:"Progrès républicain",c:"#c07a00"},SOL:{name:"Solidarité et logement",c:"#d13a30"},ECO:{name:"Écologie urbaine",c:"#2a9d63"},
 UT:{name:"Union des territoires",c:"#3b82d6"},LL:{name:"Libertés locales",c:"#e0671d"},RC:{name:"Rassemblement des communes",c:"#7c5cd6"},
 GOUV:{name:"Gouvernement",c:"#7d8696"},DC:{name:"Démocratie communale",c:"#2bb3b1"},AR:{name:"Avenir rural",c:"#8fae3a"},CP:{name:"Centre et progrès",c:"#d8699a"}};
const ME="PR";
const ART=[null,
 "I. – Le chapitre II du titre III du livre III du code de la construction et de l'habitation est complété par un article L. 332-4 ainsi rédigé :",
 "« Art. L. 332-4. – Dans les communes de plus de 50 000 habitants appartenant à une zone d'urbanisation continue, le propriétaire d'un logement vacant depuis plus de deux ans le déclare au maire.",
 "« Le logement déclaré peut faire l'objet, à la demande du propriétaire, d'une aide à la remise sur le marché dont le montant ne peut excéder 30 % du coût des travaux, dans la limite de 15 000 euros par logement.",
 "« Le maire informe le propriétaire des aides mobilisables dans un délai d'un mois suivant la déclaration.",
 "« Les conditions d'application du présent article sont fixées par décret en Conseil d'État. »",
 "II. – Au premier alinéa du I de l'article 232 du code général des impôts, le taux : « 17 % » est remplacé par le taux : « 20 % ».",

/* ---------- Toasts : role status/alert, 5 s sauf erreurs, 3 au plus, bouton Fermer toujours visible ---------- */
function toast(text,{type="success",act,fn}={}){
  const box=$("#toasts"), err=type==="error";
  while(box.children.length>=3) box.firstElementChild.remove();
  const t=document.createElement("div"); t.className="tst "+type;
  t.setAttribute("role",err?"alert":"status"); t.setAttribute("aria-live",err?"assertive":"polite");
  t.innerHTML=`<i class="dot ${err?"err":type==="warning"?"warn":type==="info"?"":"ok"}" aria-hidden="true"></i><span></span>${act?`<button class="btn" data-act>${act}</button>`:""}<button class="ico" data-x aria-label="Fermer la notification">${X}</button>`;
  t.querySelector("span").textContent=text;
  let tm=null; const arm=()=>{clearTimeout(tm); if(!err) tm=setTimeout(()=>leave(t),5000)};
  arm();
  t.addEventListener("mouseenter",()=>clearTimeout(tm)); t.addEventListener("mouseleave",arm);
  t.addEventListener("focusin",()=>clearTimeout(tm)); t.addEventListener("focusout",e=>{if(!t.contains(e.relatedTarget))arm()});
  t.onclick=e=>{const b=e.target.closest("button"); if(!b)return; if(b.dataset.act!=null&&fn) fn(); leave(t)};
  t.onkeydown=e=>{if(e.key==="Escape"){e.stopPropagation();leave(t)}};
  box.append(t);
}

  const disp=ps.length?`<ol class="disp">${ps.map((p,i)=>`<li ${p.m?`data-mid="${p.m.id}"`:""}><span id="dl-${i}">${esc(p.t)}</span><button class="ico" data-rm="${p.gage?"gage":p.m.id}" aria-label="Retirer ${p.gage?"le gage":"cette modification"}" aria-describedby="dl-${i}" title="Retirer">${X}</button></li>`).join("")}</ol>`
    :`<div class="empty">Sélectionnez des mots dans le texte, ou touchez un numéro d'alinéa. Le dispositif s'écrit ici, avec les formules d'usage.</div>`;
  const first=mine.expo.length>60?mine.expo.slice(0,60).replace(/\s+\S*$/,"")+"…":mine.expo;
  return `<div class="desk view">
   <section class="panel art${delArt?" gone":""}" aria-labelledby="art-t">
     <div class="hd"><b id="art-t">Article 4</b><span>texte de la commission</span><span class="sp"></span><button class="ghost" id="delArt">${delArt?"Rétablir l'article":"Supprimer l'article"}</button></div>
     ${delArt?`<div class="banner">Votre amendement supprime l'article entier.</div>`:""}
     ${rows}
   </section>
   <aside class="side" aria-label="Mon amendement et contrôles">
     <div class="chips" role="group" aria-label="Contrôles">${C.map(c=>`<button class="chip" data-ck="${c.k}" aria-controls="drawer" aria-expanded="${drawerKey===c.k}"><i class="dot ${c.cls}" aria-hidden="true"></i>${c.chip}</button>`).join("")}</div>
     <section class="panel amd" aria-labelledby="amd-t">
       <div class="hd" style="margin:0"><b id="amd-t">Mon amendement</b><span>${GROUPS[ME].name}</span></div>
       ${ce45?`<p class="from">Repris de <b>CE 45</b>, rejeté en commission ; le passage visé est désormais à l'<b>alinéa 6</b>.</p>`:""}
       ${disp}
       <details class="disc" id="expoD"${expoOpen?" open":""}><summary><span id="expo-l">Exposé sommaire<small id="expo-p">${esc(first)}</small></span>${CHEV}</summary>
         <textarea id="expo" aria-labelledby="expo-l" aria-describedby="expo-h">${esc(mine.expo)}</textarea><p class="hint" id="expo-h">Repris sous le dispositif lors de la copie.</p></details>
       <div class="acts"><button class="btn${form?"":" pri"}" id="copy" ${!ps.length||blocking?"disabled":""}>Copier pour le dépôt</button></div>
       ${blocking?`<p class="why">Copie bloquée : l'article 40 rend l'amendement irrecevable. <button data-ck="a40">Voir pourquoi</button></p>`:""}
     </section>
   </aside></div>`;
}

/* ---------- Vue Séance : tableau, glisser-déposer au pointeur et au clavier ---------- */
const COLS=["open","adopt","fell"], CNAME={open:"En discussion",adopt:"Supposés adoptés",fell:"Tombés"};
const nameOf=id=>id==="mine"?"votre amendement":`le n° ${id}`;
function vSeance(){
  const sim=simulate(), me=sim.flat.find(a=>a.id==="mine");
  let lead="",sub="";
  if(!me) lead=`Vous n'avez pas d'amendement sur cet article : ${sim.flat.length} amendements sont déposés.`;
  else{const pos=sim.flat.indexOf(me)+1, killers=sim.flat.slice(0,pos-1).filter(a=>hits(a,me)), s=sim.st.get("mine");
    lead=s.s==="fell"?`Avec ces hypothèses, votre amendement tombe : ${lab(s.by)} est adopté avant lui.`:`Votre amendement est appelé en ${nth(pos)} position sur ${sim.flat.length}.`;
    sub=killers.length?`Il tombe si ${orList(killers)} est adopté avant lui.`:"Aucun amendement appelé avant lui ne peut le faire tomber.";}
  const idx=new Map(sim.flat.map((a,i)=>[a.id,i+1]));
  const card=a=>{const s=sim.st.get(a.id), id=a.id, nm=nameOf(id);
    const grip=s.s==="fell"?`<span class="nograb"></span>`:`<button class="grip" data-grip="${id}" aria-label="Déplacer ${nm}" aria-describedby="dnd-help" title="Glisser vers une autre colonne">${GRIP}</button>`;
    const mv=s.s==="fell"?"":`<button class="ghost mv" data-mv="${id}" aria-label="${s.s==="adopt"?"Remettre en discussion":"Supposer adopté"} ${nm}">${s.s==="adopt"?"Retirer":"Adopter"}</button>`;
    return `<article class="card ${s.s}${a.mine?" mine":""}" data-id="${id}" aria-label="${idx.get(id)}${idx.get(id)===1?"er":"e"} appelé, ${nm}">${grip}<div class="bd"><span class="pos">${idx.get(id)}</span><span class="num">${a.mine?"Le vôtre":"n° "+id}</span> ${gp(a.g)}<span class="what">${esc(describe(a))}</span>${s.s==="fell"?`<span class="fellby">Tombe : ${lab(s.by)} adopté</span>`:""}</div>${mv}</article>`};
  const col=k=>{
    const items=sim.flat.filter(a=>sim.st.get(a.id).s===k);
    const groups=sim.groups.map(g=>{const it=g.items.filter(a=>sim.st.get(a.id).s===k); if(!it.length) return "";
      return `<div class="grp" role="group" aria-label="${g.head?"Article entier":"Alinéa "+g.al}"><div class="gh" aria-hidden="true">${g.head?"Article entier":"Alinéa "+g.al}${g.items.length>1?" · discussion commune":""}</div>${it.map(card).join("")}</div>`}).join("");
    const empty={open:"Tout est tranché.",adopt:"Glissez un amendement ici, ou touchez « Adopter ».",fell:"Calculé : ce qui tombe du fait des adoptions."}[k];
    return `<section class="colm${k==="fell"?" nodrop":""}" data-col="${k}" aria-labelledby="h-${k}"><div class="colm-h"><span id="h-${k}">${CNAME[k]} · ${items.length}</span>${k==="adopt"&&items.length?`<button class="ghost" id="clearHyp">Tout retirer</button>`:""}</div><div class="zone">${groups}<div class="hint0">${empty}</div></div></section>`;
  };
  const fellN=sim.flat.filter(a=>sim.st.get(a.id).s==="fell").length;
  return `<div class="view">
   <section class="panel answer"><p>${lead}</p>${sub?`<p class="sub">${sub}</p>`:""}</section>
   <div class="board">${COLS.map(col).join("")}</div>
   <section class="panel res"><details class="disc" id="resD"${resOpen?" open":""}><summary><span>Texte qui en résulte<small>${sim.adopted.length?`${sim.adopted.length} adopté${sim.adopted.length>1?"s":""}, ${fellN} tombé${fellN>1?"s":""}`:"Texte de la commission, sans hypothèse"}</small></span>${CHEV}</summary>
     <div class="body">${resultText(sim)}</div></details></section>
  </div>`;
}
function resultText(sim){
  const A=sim.adopted;
  const opsFor=al=>{const ops=[];
    for(const a of A){ if(a.mine){for(const o of myOps(al)) ops.push({...o,by:"mine"}); continue;}
      if(a.op==="delArt"||(a.op==="delAl"&&a.al===al)) ops.push({s:0,e:ART[al].length,by:a.id});
      else if(a.al===al){const s=findSpan(al,a.w,a.occ); ops.push({s:s[0],e:s[1],ins:a.x,by:a.id});}}
    const whole=ops.find(o=>o.s===0&&o.e===ART[al].length&&!o.ins); return whole?[whole]:ops;};
  let rows="",k=0,moved=0;
  for(let al=1;al<=NAL;al++){
    const ops=opsFor(al), gone=ops.some(o=>o.s===0&&o.e===ART[al].length&&!o.ins); if(!gone)k++;
    const ex=!gone&&k!==al?`<span class="ex">ex-${al}</span>`:""; if(ex)moved++;
    rows+=`<div class="al"><span class="n">${gone?"":k}${ex}</span><p class="t">${renderAl(al,ops)}</p></div>`;
    if(A.some(a=>a.mine)) for(const m of mine.mods.filter(m=>m.kind==="insAl"&&m.al===al)){k++;rows+=`<div class="al"><span class="n">${k}</span><p class="t"><ins>${esc(m.text.replace(/\.?$/,"."))}</ins><sup class="by">vous</sup></p></div>`;}
  }
  return rows+(A.length?`<p class="note">Les marques renvoient à l'amendement qui a produit le changement.${moved?" « ex- » : ancien numéro, décalé par une suppression.":""}</p>`:"");
}
function toggleHyp(id,how){
  const was=hyp.has(id); was?hyp.delete(id):hyp.add(id); render();
  const sim=simulate(), fell=[...sim.st].filter(([,s])=>s.by===id).map(([k])=>lab(k));
  const msg=was?`${cap(lab(id))} remis en discussion.`:`${cap(lab(id))} supposé adopté${fell.length?` : ${andList(fell)} ${fell.length>1?"tombent":"tombe"}`:""}.`;
  if(how==="button") toast(msg,{act:"Annuler",fn:()=>{was?hyp.add(id):hyp.delete(id);render()}});
  else say(`Déposé dans « ${CNAME[was?"open":"adopt"]} ». ${msg}`,true);
  requestAnimationFrame(()=>$(`[data-${how==="button"?"mv":"grip"}="${id}"]`)?.focus({preventScroll:true}));
}
// clavier : Entrée/Espace saisit, flèches changent de colonne, Entrée/Espace dépose, Échap annule
let grab=null;
function startGrab(btn){
  const card=btn.closest(".card"), from=card.closest("[data-col]").dataset.col;
  grab={id:idOf(btn.dataset.grip),from,to:from,card,home:card.parentElement,next:card.nextSibling};
  card.classList.add("lifted"); btn.setAttribute("aria-pressed","true"); $("#panel").classList.add("dragging");
  say(`${cap(nameOf(grab.id))} saisi, dans « ${CNAME[from]} ». Flèche ${from==="open"?"droite":"gauche"} vers « ${CNAME[from==="open"?"adopt":"open"]} », Entrée pour déposer, Échap pour annuler.`,true);
}
function moveGrab(dir){
  const i=COLS.indexOf(grab.to)+dir;
  if(i<0||i>=COLS.length){say("Pas d'autre colonne de ce côté.",true);return}
  if(COLS[i]==="fell"){say("« Tombés » se calcule à partir des adoptions : on n'y dépose rien.",true);return}
  grab.to=COLS[i];
  $$(".colm.over").forEach(c=>c.classList.remove("over"));
  const col=$(`[data-col="${grab.to}"]`);
  if(grab.to===grab.from) grab.home.insertBefore(grab.card,grab.next); else {col.classList.add("over"); col.querySelector(".zone").prepend(grab.card)}
  const g=grab.card.querySelector(".grip"); g.focus({preventScroll:true}); grab.card.scrollIntoView({block:"nearest",behavior:RM.matches?"auto":"smooth"});
  say(`Au-dessus de « ${CNAME[grab.to]} »${grab.to===grab.from?", position d'origine":""}. Entrée pour déposer.`,true);
}
function endGrab(){ if(!grab)return; grab.card.classList.remove("lifted"); grab.card.querySelector(".grip")?.removeAttribute("aria-pressed"); $$(".colm.over").forEach(c=>c.classList.remove("over")); $("#panel").classList.remove("dragging"); grab=null; }
function dropGrab(){ const g=grab; endGrab(); if(g.to!==g.from) toggleHyp(g.id,"dnd"); else {say(`${cap(nameOf(g.id))} reposé dans « ${CNAME[g.from]} » : rien ne change.`,true)} }
function cancelGrab(){ const g=grab; if(!g)return; g.home.insertBefore(g.card,g.next); endGrab(); g.card.querySelector(".grip")?.focus({preventScroll:true}); say(`Déplacement annulé : ${nameOf(g.id)} revient dans « ${CNAME[g.from]} ».`,true); }
// pointeur (souris, stylet, doigt) : événements pointer, pas l'API HTML5 (sans clavier)
let pd=null;
function pointerCleanup(){ if(!pd)return; pd.fl?.remove(); pd.card?.classList.remove("ghosted"); $$(".colm.over").forEach(c=>c.classList.remove("over")); $("#panel").classList.remove("dragging"); pd=null; }
function cancelPointer(){ const p=pd; pointerCleanup(); if(p?.on) say(`Déplacement annulé : ${nameOf(p.id)} revient dans « ${CNAME[p.from]} ».`,true); }

/* ---------- Rendu ---------- */
function setTabs(){
  $$(".tab").forEach(t=>{const on=t.dataset.v===view; t.setAttribute("aria-selected",String(on)); t.tabIndex=on?0:-1});
  $("#panel").setAttribute("aria-labelledby","tab-"+view);
  $("#cnt").textContent=hyp.size?`· ${hyp.size} adopté${hyp.size>1?"s":""}`:"";
}
function render(){
  const y=scrollY; grab=null;
  setTabs();
  $("#panel").innerHTML=view==="ecrire"?vEcrire():vSeance();
  const d=$("#drawer"); if(d&&view==="ecrire") d.innerHTML=drawerHTML();
  scrollTo(0,y);
}
function go(v){ if(v===view)return; closeMenu(); form=null; pending=null; if($("#drawer")){drawerBack=null;closeDrawer()} view=v; ss.set("atl-vue",v); render(); scrollTo(0,0); }
$$(".tab").forEach(t=>t.onclick=()=>go(t.dataset.v));
$(".tabs").addEventListener("keydown",e=>{
  const V=["ecrire","seance"], i=V.indexOf(view); let n=null;
  if(e.key==="ArrowRight") n=(i+1)%V.length; else if(e.key==="ArrowLeft") n=(i-1+V.length)%V.length; else if(e.key==="Home") n=0; else if(e.key==="End") n=V.length-1;
  if(n==null) return; e.preventDefault(); go(V[n]); $("#tab-"+view).focus();
});

/* ---------- Sélection à la souris ou au doigt → menu contextuel ---------- */
function onSelect(){
  if(view!=="ecrire"||menuEl||grab||$("#confirm").open) return;
  if(document.activeElement?.closest?.("#edit,#drawer")) return;
  const R=readSelection(); if(!R) return;
  if(R.err==="multi"){toast("Une modification porte sur un seul alinéa : resserrez la sélection.",{type:"warning"});return}
  if(R.err==="ins"){toast("Ce passage est un ajout de votre amendement : retirez-le dans le dispositif pour le réécrire.",{type:"warning"});return}
  if(R.err==="busy"){const m=R.mod; getSelection().removeAllRanges(); toast(m.kind==="delArt"?"L'article entier est supprimé par votre amendement.":"Ce passage est déjà modifié par votre amendement.",{type:"warning",act:"Retirer la modification",fn:()=>commit(()=>{mine.mods=mine.mods.filter(x=>x.id!==m.id)},"Modification retirée.")});return}
  const occ=occInfo(R.al,R.s,R.e).idx+1, rect=R.rect;
  form=null; pending={al:R.al,start:R.s,end:R.e}; getSelection().removeAllRanges(); render();
  openMenu({rect,label:`« ${R.w} » · alinéa ${R.al}`,onCancel:unmark,items:[
    {label:"Supprimer ces mots",run:()=>{pending=null;commit(()=>addMod({al:R.al,kind:"del",start:R.s,end:R.e}),`« ${R.w} » supprimé.`)}},
    {label:"Remplacer…",run:()=>openForm({al:R.al,mode:"rep",w:R.w,occ})},
    {label:"Ajouter après…",run:()=>openForm({al:R.al,mode:"ins",w:R.w,occ})}]});
}
document.addEventListener("mouseup",e=>{if(!e.target.closest?.(".menu,.drawer,.tst,#edit,dialog,.al .n"))setTimeout(onSelect,10)});
document.addEventListener("keyup",e=>{if(e.shiftKey&&!e.target.closest?.("input,textarea"))onSelect()});
let selT; document.addEventListener("selectionchange",()=>{if(!matchMedia("(pointer:coarse)").matches)return;clearTimeout(selT);selT=setTimeout(onSelect,450)});
document.addEventListener("pointerdown",e=>{
  if(menuEl&&!e.target.closest(".menu")&&!e.target.closest(".al .n")) closeMenu();
  if(grab&&!e.target.closest("[data-grip]")) cancelGrab();
},true);

/* ---------- Échap : un cran à la fois ---------- */
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape"||$("#confirm").open) return;
  if(pd?.on){cancelPointer();return}
  if(grab){cancelGrab();return}
  if(menuEl){closeMenu({refocus:true});return}
  if(form){cancelForm();return}
  if($("#drawer")){closeDrawer();return}
  if(view!=="ecrire"){go("ecrire");$("#tab-ecrire").focus()}
});

/* ---------- Événements de la page ---------- */
const P=$("#panel");
P.addEventListener("click",e=>{
  const t=e.target;
  const n=t.closest(".al .n[data-al]"); if(n){alMenu(n);return}
  const ck=t.closest("[data-ck]"); if(ck){ if(drawerKey===ck.dataset.ck&&ck.classList.contains("chip")) closeDrawer(); else openDrawer(ck.dataset.ck,`.chip[data-ck="${ck.dataset.ck}"]`); return}
  const rm=t.closest("[data-rm]"); if(rm){const v=rm.dataset.rm; commit(()=>{ if(v==="gage") mine.gage=false; else mine.mods=mine.mods.filter(m=>m.id!==+v); if(!mine.mods.length) mine.gage=false;}, v==="gage"?"Gage retiré.":"Modification retirée."); requestAnimationFrame(()=>refocus($("[data-rm]")||"#delArt")); return;}
  if(t.closest("#delArt")){
    const on=mine.mods.some(m=>m.kind==="delArt");
    if(on) return commit(()=>{mine.mods=[]},"Article rétabli.");
    const run=()=>commit(()=>addMod({kind:"delArt"}),"Suppression de l'article ajoutée.");
    if(!mine.mods.length) return run();
    const k=mine.mods.length;
    return confirmDlg({title:"Supprimer l'article 4 ?",body:`<p>Un amendement de suppression ne peut rien contenir d'autre : ${k>1?`vos ${k} modifications seront remplacées`:"votre modification sera remplacée"} par la seule phrase « Supprimer cet article. »</p><p>Vous pourrez l'annuler juste après.</p>`,yes:"Supprimer l'article",run,back:"#delArt"});
  }
  if(t.closest("[data-cancel]")){cancelForm();return}
  if(t.closest("#copy")){copyAll(t.closest("#copy"));return}
  if(t.closest("#clearHyp")){const before=[...hyp]; hyp.clear(); render(); toast("Hypothèses retirées.",{act:"Annuler",fn:()=>{before.forEach(h=>hyp.add(h));render()}}); return}
  const mv=t.closest("[data-mv]"); if(mv){toggleHyp(idOf(mv.dataset.mv),"button");return}
  const g=t.closest("[data-go]"); if(g){go(g.dataset.go);return}
});
P.addEventListener("submit",e=>{e.preventDefault();submitForm()});
P.addEventListener("focusout",e=>{ // validation à la sortie du champ, jamais à la frappe
  if(!form||!["f-w","f-x"].includes(e.target.id)) return;
  if(e.relatedTarget?.closest?.("[data-cancel]")) return;
  e.target.id==="f-w"?checkW(true):checkX(true);
});
P.addEventListener("change",e=>{if(e.target.id==="f-o"&&form) checkW(false)});
P.addEventListener("input",e=>{
  if(e.target.id==="expo"){mine.expo=e.target.value; const p=$("#expo-p"); if(p) p.textContent=mine.expo.length>60?mine.expo.slice(0,60).replace(/\s+\S*$/,"")+"…":mine.expo; return}
  if(e.target.getAttribute?.("aria-invalid")==="true") setErr(e.target.id,""); // on efface l'erreur, on n'en crée pas pendant la frappe
});
P.addEventListener("toggle",e=>{ if(e.target.id==="expoD"){expoOpen=e.target.open;ss.set("atl-expo",expoOpen?"1":"0")} if(e.target.id==="resD"){resOpen=e.target.open;ss.set("atl-res",resOpen?"1":"0")} },true);
// survol ou focus : passage et ligne du dispositif s'allument ensemble
function lite(mid){$$(".lit").forEach(x=>x.classList.remove("lit"));$$(".disp li.hl").forEach(x=>x.classList.remove("hl"));if(mid!=null)$$(`[data-mid="${mid}"]`).forEach(x=>x.classList.add(x.tagName==="LI"?"hl":"lit"))}
P.addEventListener("mouseover",e=>lite(e.target.closest?.("[data-mid]")?.dataset.mid));
P.addEventListener("focusin",e=>lite(e.target.closest?.("[data-mid]")?.dataset.mid));
// clavier sur la poignée
P.addEventListener("keydown",e=>{
  const gb=e.target.closest?.("[data-grip]"); if(!gb) return;
  if(e.key==="Enter"||e.key===" "){e.preventDefault(); grab?dropGrab():startGrab(gb); return}
  if(!grab) return;
  if(["ArrowRight","ArrowDown"].includes(e.key)){e.preventDefault();moveGrab(1)}
  else if(["ArrowLeft","ArrowUp"].includes(e.key)){e.preventDefault();moveGrab(-1)}
  else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();cancelGrab()}
  else if(e.key==="Tab"){cancelGrab()}
});
// pointeur sur la poignée
P.addEventListener("pointerdown",e=>{
  const gb=e.target.closest?.("[data-grip]"); if(!gb||e.button!==0) return;
  e.preventDefault(); if(grab) cancelGrab();
  pd={gb,id:idOf(gb.dataset.grip),x:e.clientX,y:e.clientY,on:false,pid:e.pointerId};
  try{gb.setPointerCapture(e.pointerId)}catch(_){}
});
P.addEventListener("pointermove",e=>{
  if(!pd||e.pointerId!==pd.pid) return;
  if(!pd.on){
    if(Math.hypot(e.clientX-pd.x,e.clientY-pd.y)<5) return;
    const card=pd.gb.closest(".card"), r=card.getBoundingClientRect();
    const fl=card.cloneNode(true); fl.classList.add("float","lifted"); fl.setAttribute("aria-hidden","true"); fl.querySelectorAll("[id]").forEach(x=>x.removeAttribute("id"));
    fl.style.width=r.width+"px"; fl.style.left=r.left+"px"; fl.style.top=r.top+"px"; document.body.append(fl);
    card.classList.add("ghosted"); P.classList.add("dragging");
    Object.assign(pd,{on:true,card,fl,dx:pd.x-r.left,dy:pd.y-r.top,from:card.closest("[data-col]").dataset.col,over:null});
    say(`${cap(nameOf(pd.id))} saisi.`,true);
  }
  pd.fl.style.left=(e.clientX-pd.dx)+"px"; pd.fl.style.top=(e.clientY-pd.dy)+"px";
  if(e.clientY<60) scrollBy(0,-14); else if(e.clientY>innerHeight-60) scrollBy(0,14);
  const c=document.elementFromPoint(e.clientX,e.clientY)?.closest?.("[data-col]");
  const k=c&&!c.classList.contains("nodrop")?c.dataset.col:null;
  if(k!==pd.over){ $$(".colm.over").forEach(x=>x.classList.remove("over")); if(k&&k!==pd.from) c.classList.add("over"); pd.over=k; if(k) say(`Au-dessus de « ${CNAME[k]} ».`,true); }
});
P.addEventListener("pointerup",e=>{
  if(!pd||e.pointerId!==pd.pid) return;
  const p=pd; if(!p.on){pd=null;return}
  pointerCleanup();
  if(p.over&&p.over!==p.from) toggleHyp(p.id,"dnd"); else say(`Déplacement annulé : ${nameOf(p.id)} reste dans « ${CNAME[p.from]} ».`,true);
});
P.addEventListener("pointercancel",()=>cancelPointer());

/* ---------- Copie : retour immédiat, indicateur seulement au-delà de 400 ms ---------- */
async function copyAll(btn){
  const txt=paragraphs().map(p=>p.t).join("\n")+"\n\nEXPOSÉ SOMMAIRE\n"+mine.expo;
  const label=btn.textContent;
  const slow=setTimeout(()=>{btn.setAttribute("aria-busy","true");btn.disabled=true;btn.textContent="Copie…"},400);
  const done=ok=>{clearTimeout(slow);btn.removeAttribute("aria-busy");btn.disabled=false;btn.textContent=label;
    ok?toast("Dispositif et exposé copiés. Le dépôt se fait ensuite dans Eloi."):toast("Copie refusée par le navigateur. Sélectionnez le dispositif et copiez-le à la main.",{type:"error"})};
  try{ if(!navigator.clipboard) throw 0; await navigator.clipboard.writeText(txt); done(true) }catch(_){ done(false) }
}

{const v=ss.get("atl-vue"); if(v==="ecrire"||v==="seance") view=v;}
render();
</script>

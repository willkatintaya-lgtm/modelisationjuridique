<title>Recommandations · parcours</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0a0b0d; --s1:#111316; --s2:#171a1e; --line:#22252a; --line2:#2d3137;
  --fg:#f3f5f7; --text:#cfd5dd; --muted:#8a919b; --dim:#5d636c;
  --ins:#8ab4ff; --del:#e5484d; --accent:#6e7bf2; --lit:rgba(110,123,242,.16);
  --ok:#46b37e; --warn:#e3a33f; --err:#e5484d;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.25,.8,.25,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.narrow{max-width:780px}
.ctx{font-size:12.5px;color:var(--dim)}
h1{margin:3px 0 0;font:600 19px/1.3 var(--f);color:var(--fg);letter-spacing:-.012em;text-wrap:balance}
.lead{margin:14px 0 18px;max-width:780px;color:var(--fg);font-size:15.5px;line-height:1.55;text-wrap:pretty}
.lead span{color:var(--muted)}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:10px}
.sec{margin:18px 2px 8px;font-size:11.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.btn{border:1px solid var(--line2);background:var(--s2);color:var(--fg);border-radius:7px;padding:7px 12px;font-size:13px;cursor:pointer;transition:background .2s,opacity .2s;white-space:nowrap}
.btn:hover:not(:disabled){background:#1f2227}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover:not(:disabled){background:#7b87f5}
.btn:disabled{opacity:.4;cursor:default}
.ghost{border:1px solid var(--line2);background:none;color:var(--muted);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;transition:color .2s,background .2s}
.ghost:hover{color:var(--fg);background:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;color:var(--muted);font-size:12.5px;background:none;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip:hover{color:var(--fg)}
.chip.on{color:var(--fg);border-color:var(--accent);background:var(--lit)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
ins{color:var(--ins);text-decoration:underline 1px;text-underline-offset:3px;font-weight:500;background:none}
del{color:var(--dim);text-decoration:line-through 1px var(--del);background:none}
mark{background:var(--lit);color:var(--fg);border-radius:3px;padding:0 1px}
input[type=text],input[type=number],textarea,select{background:var(--s2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--fg);font-size:13px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--line2)}
.gp{display:inline-grid;place-items:center;min-width:24px;height:16px;padding:0 4px;border-radius:4px;color:#fff;font-size:9.5px;font-weight:600;vertical-align:1px;margin-right:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--s2);border:1px solid var(--line2);color:var(--fg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100vw - 32px);animation:rise .2s var(--ease)}
@keyframes rise{from{opacity:0;transform:translate(-50%,4px)}}
.slide{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.slide>div{min-height:0;overflow:hidden;opacity:0;transition:opacity .15s}
.open>.slide{grid-template-rows:1fr}
.open>.slide>div{opacity:1;transition:opacity .2s .12s}
.scrollx{overflow-x:auto;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
<script>

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const nf=(n,d=0)=>n.toLocaleString("fr-FR",{maximumFractionDigits:d,minimumFractionDigits:d});

<script>
/* Données et règles reprises de la maquette d'origine (registre + vérification à la frappe). */
const NOW=new Date(2026,10,10);
const S={done:{l:"Mise en œuvre",c:"ok",col:"var(--ok)"},part:{l:"En partie",c:"warn",col:"var(--warn)"},no:{l:"Sans suite",c:"err",col:"var(--err)"},wait:{l:"Pas encore échue",c:"",col:"var(--dim)"}};
const R=[
 {id:"1402",short:"Vacance des logements",t:"Mission flash sur la vacance des logements",d:"Rapport d'information n° 1402, juin 2026",own:true,recos:[
  {n:1,t:"Ouvrir à toutes les communes l'accès aux données fiscales sur la vacance, avant le 1er janvier 2027.",to:"Ministre de l'économie",due:"2027-01-01",s:"wait"},
  {n:2,t:"Porter le plafond de l'aide à la remise sur le marché à 20 000 euros dans le projet de loi de finances pour 2027.",to:"Gouvernement",due:"2026-10-01",s:"no",proof:"PLF 2027 : plafond maintenu à 15 000 €"},
  {n:3,t:"Publier, avant la fin de l'année 2026, une instruction aux préfets sur la réquisition des logements vacants.",to:"Ministre du logement",due:"2026-12-31",s:"wait"},
  {n:4,t:"Créer un guichet unique départemental pour les propriétaires de logements vacants.",to:"Ministre du logement",due:"2026-12-31",s:"part",proof:"Expérimenté dans 6 départements (circulaire du 3 sept. 2026)"},
  {n:5,t:"Intégrer au PLF pour 2027 une évaluation de la taxe sur les logements vacants.",to:"Ministre de l'économie",due:"2026-10-01",s:"done",proof:"PLF 2027, Évaluation des voies et moyens, tome II"}]},
 {id:"987",short:"Logement décent",t:"Évaluation de la loi relative au logement décent",d:"Rapport d'information n° 987, mars 2025",own:true,recos:[
  {n:1,t:"Publier le décret sur la décence énergétique avant le 30 juin 2025.",to:"Ministre du logement",due:"2025-06-30",s:"no",proof:"Non publié au 10 nov. 2026"},
  {n:2,t:"Doubler les effectifs du service d'hygiène dans les communes de plus de 50 000 habitants d'ici 2027.",to:"Gouvernement",due:"2027-01-01",s:"wait"},
  {n:3,t:"Rendre obligatoire le diagnostic de performance énergétique dans les annonces de location.",to:"Parlement",due:"2025-12-31",s:"done",proof:"Loi n° 2025-650, article 11"},
  {n:4,t:"Informer chaque locataire de ses droits par un document type annexé au bail.",to:"Ministre du logement",due:"2025-12-31",s:"part",proof:"Arrêté du 28 janv. 2026 (bail type modifié, sans document annexé)"},
  {n:5,t:"Mieux informer les propriétaires bailleurs sur les aides à la rénovation.",to:null,due:null,s:"no",proof:"Recommandation sans destinataire ni échéance : impossible à suivre"}]},
 {id:"ccomptes",short:"Cour des comptes",t:"Cour des comptes · Les aides à la rénovation énergétique",d:"Rapport public thématique, octobre 2024",own:false,recos:[
  {n:2,t:"Simplifier l'information des propriétaires sur les aides existantes par un point d'entrée unique.",to:"Ministre du logement",due:"2025-12-31",s:"part"},
  {n:4,t:"Réduire à 60 jours le délai de paiement des primes de rénovation.",to:"Agence nationale de l'habitat",due:"2025-12-31",s:"no"}]},
];
const ALL=R.flatMap(r=>r.recos.map(x=>({...x,rep:r,key:r.id+"-"+x.n})));
const fdate=d=>new Date(d+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"});
const days=d=>Math.round((new Date(d+"T12:00")-NOW)/864e5);
function dueTxt(x){ if(!x.due) return "sans échéance"; const n=days(x.due);
  if(n<0){const m=Math.round(-n/30.4); return `échue depuis ${m<1?"quelques jours":m+" mois"}`}
  return n<45?`échéance dans ${n} jours`:`échéance ${fdate(x.due)}`; }
const STOP=new Set("le la les de des du d l un une et en au aux a à sur pour par plus dans avec leur leurs ce ces cette qui que meilleure mieux".split(" "));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ");
const toks=s=>new Set(norm(s).split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)).map(w=>w.slice(0,6)));
const simil=(a,b)=>{let n=0;a.forEach(w=>{if(b.has(w))n++});return n/Math.sqrt((a.size||1)*(b.size||1))};
/* Analyse d'une recommandation en cours d'écriture : quatre critères (mêmes règles que l'original) et les plus proches. */
function analyse(t){
  const T=t.toLowerCase();
  const vague=T.match(/^\s*(réfléchir|étudier|envisager|engager une réflexion|mieux|veiller|favoriser|encourager|poursuivre)/);
  const verb=T.match(/^\s*(publier|créer|porter|réduire|rendre|ouvrir|supprimer|doubler|fixer|intégrer|instaurer|abaisser|relever|transmettre|remettre|modifier|inscrire)/);
  const to=T.match(/(ministre[^,.;]*|gouvernement|préfets?|agence[^,.;]*|anah|collectivités|communes|départements?|parlement)/);
  const due=T.match(/(avant (le |la fin )?[^,.;]*\d{4}|d'ici (à )?(fin )?\d{4}|dans (un|le) délai[^,.;]*|en \d{4}|au \d{1,2}(er)? \w+ \d{4}|dans le projet de loi de finances pour \d{4}|plf (pour )?\d{4})/);
  const vec=T.match(/(décret|arrêté|instruction|circulaire|loi|projet de loi de finances|plf|amendement|convention)/);
  const crit={
    acte: vague?{c:"err",l:"Formulation vague",m:vague[1],s:`« ${vague[1]} » ne permet pas de dire un jour si c'est fait. Commencez par l'acte attendu : publier, créer, fixer…`}
         :verb?{c:"ok",l:"Acte vérifiable",m:verb[1]}:{c:"warn",l:"Acte à préciser",s:"Quel geste précis attend-on ?"},
    to: to?{c:"ok",l:"Destinataire",m:to[1].split(/ (?:aux|sur|pour|avant|d'ici|afin|dans) /)[0]}:{c:"warn",l:"Destinataire absent",s:"Qui doit agir : un ministre, le Gouvernement, une agence ?"},
    due: due?{c:"ok",l:"Échéance",m:due[1]}:{c:"warn",l:"Échéance absente",s:"Sans date, le suivi à six mois n'a pas de repère."},
    vec: vec?{c:"ok",l:"Vecteur",m:vec[1]}:{c:"",l:"Vecteur non précisé",s:"Facultatif : décret, instruction, loi de finances…"}};
  const mine=toks(t), near=ALL.map(x=>({x,s:simil(mine,toks(x.t))})).filter(m=>m.s>=.25).sort((a,b)=>b.s-a.s).slice(0,3);
  return {crit,near,ready:crit.acte.c==="ok"&&crit.to.c==="ok"&&crit.due.c==="ok"};
}
const START="Réfléchir à une meilleure information des propriétaires de logements vacants sur les aides existantes.";

<style>
/* Angle « parcours » : écrire une recommandation est une suite d'étapes observables (écrire → vérifier → confronter → inscrire),
   avec brouillon conservé (interruption, reprise), abandon annulable, inscription irréversible confirmée dans la page,
   et effets de bord visibles dans le registre. Le registre montre ses propres états : périmé, en cours, partiel, à jour. */
.zones{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;margin-top:6px}
.atelier{flex:1 1 520px;min-width:0;display:grid;gap:12px}
.suivi{flex:1 1 360px;min-width:0}
.rail{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--dim)}
.rail li{display:flex;align-items:center;gap:7px}
.rail .num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--line2);font-size:11px;color:var(--muted);transition:background .25s,border-color .25s,color .25s}
.rail .cur{color:var(--fg)} .rail .cur .num{border-color:var(--accent);color:var(--fg)}
.rail .ok .num{background:var(--ok);border-color:var(--ok);color:#06110b}
.rail .ok{color:var(--muted)}
.step{padding:14px 16px;transition:opacity .25s}
.step.locked{opacity:.45}
.step h2{margin:0 0 10px;font:600 13.5px/1.3 var(--f);color:var(--fg);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.step h2 small{font-weight:400;color:var(--dim);font-size:12px}
.save{font-size:12px;color:var(--dim);margin-left:auto}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:1px solid var(--line2);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--text);margin-bottom:10px}
.banner.err{border-color:rgba(229,72,77,.5)}
.banner.warn{border-color:rgba(227,163,63,.45)}
.banner span{flex:1 1 200px}
textarea{width:100%;min-height:100px;resize:vertical;line-height:1.6;font-size:13.5px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.crit{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.crit li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:9px;font-size:12.5px;line-height:1.5}
.crit li .dot{margin-top:6px}
.crit small{display:block;color:var(--muted)}
.dec{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--muted);display:grid;gap:8px}
.dec b{color:var(--text);font-weight:500}
.dec .opts{display:flex;flex-wrap:wrap;gap:6px}
.dec .chip{min-height:32px}
.decs{display:grid;gap:8px}
.confirm{border:1px solid rgba(110,123,242,.5);background:var(--lit);border-radius:8px;padding:12px;font-size:13px;color:var(--fg);display:grid;gap:8px}
.confirm ul{margin:0;padding-left:18px;color:var(--text);font-size:12.5px}
.done{border:1px solid rgba(70,179,126,.45);border-radius:8px;padding:12px;font-size:13px;color:var(--fg);display:grid;gap:6px}
.done ul{margin:0;padding-left:18px;color:var(--text);font-size:12.5px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.demo{font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center;margin-top:4px}
/* suivi */
.sh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin:0 2px 10px}
.sh h2{margin:0;font:600 14px/1.3 var(--f);color:var(--fg)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.rep{margin-bottom:12px}
.rep-h{padding:11px 14px 9px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.rep-h b{color:var(--fg);font-weight:500;font-size:13px}
.rep-h small{color:var(--dim);font-size:12px}
.rep-h .st{margin-left:auto;font-size:12px;color:var(--dim)}
.rep-h .st.stale{color:var(--warn)} .rep-h .st.bad{color:var(--err)} .rep-h .st.fresh{color:var(--ok)}
.rc{display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;padding:9px 14px;border-top:1px solid var(--line);transition:background .6s}
.rc .dot{margin-top:6px}
.rc p{margin:0;font-size:12.5px;color:var(--text)}
.rc small{display:block;margin-top:2px;font-size:11.5px;color:var(--dim)}
.rc small b{color:var(--muted);font-weight:500}
.rc.hl,.rc.new{background:var(--lit)}
.empty{padding:12px 14px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px}
.vis{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<div class="wrap">
  <div class="ctx">Rapports dont la députée a été rapporteure, et rapports externes sur les mêmes sujets</div>
  <h1>Recommandations</h1>
  <p class="lead" id="lead"></p>
  <div class="zones">
    <div class="atelier">
      <ol class="rail" id="rail" aria-label="Étapes"></ol>
      <section class="panel step" id="s1" aria-labelledby="h1x">
        <h2 id="h1x">1 · Écrire <small>pour le rapport n° 1530, en préparation</small><span class="save" id="save" aria-live="polite"></span></h2>
        <div id="resume"></div>
        <label class="vis" for="t">Texte de la recommandation</label>
        <textarea id="t"></textarea>
        <div class="acts" id="a1"></div>
      </section>
      <section class="panel step" id="s2" aria-labelledby="h2x"><h2 id="h2x">2 · Vérifier <small>suivable dans six mois ?</small></h2><ul class="crit" id="crit"></ul></section>
      <section class="panel step" id="s3" aria-labelledby="h3x"><h2 id="h3x">3 · Confronter au registre <small>déjà demandé ?</small></h2><div class="decs" id="decs"></div></section>
      <section class="panel step" id="s4" aria-labelledby="h4x"><h2 id="h4x">4 · Inscrire au rapport</h2><div id="ins" aria-live="polite"></div></section>
    </div>
    <aside class="suivi" aria-labelledby="sh">
      <div class="sh"><h2 id="sh">Suivi</h2><span id="fresh" style="font-size:12px;color:var(--dim)"></span></div>
      <div id="sync"></div>
      <div class="filters" id="filters"></div>
      <div id="reg"></div>
    </aside>
  </div>
</div>

<script>
/* ---------- état du flux ---------- */
const KEY="reco-parcours-brouillon";
const store={get(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},set(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}},del(){try{localStorage.removeItem(KEY)}catch(e){}}};
let A=null, decisions={}, phase="edit"; // edit | confirm | sending | error | done
let fail=false, lastIns=null, undoBuf=null, f=null;
const PROJ={id:"1530",short:"Projet n° 1530",t:"Projet de rapport n° 1530 · Logements vacants, deux ans après",d:"En préparation, remise prévue le 15 déc. 2026",own:true,draft:true,recos:[
  {n:1,t:"Publier avant le 30 juin 2027 le décret fixant les critères de la vacance structurelle.",to:"Ministre du logement",due:"2027-06-30",s:"wait"},
  {n:2,t:"Réduire à 45 jours, d'ici fin 2027, le délai d'instruction des dossiers de l'Agence nationale de l'habitat.",to:"Agence nationale de l'habitat",due:"2027-12-31",s:"wait"}]};
/* fraîcheur des statuts par rapport (données périmées au départ) */
const sync={"1402":{at:"2026-05-12",st:"stale"},"987":{at:"2026-05-12",st:"stale"},"ccomptes":{at:"2026-03-02",st:"stale"},"1530":{at:null,st:"draft"}};
let syncing=false;

function stepState(){
  const t=$("#t").value.trim(), c=A.crit;
  const s1=t.length>=20, s2=s1&&A.ready, s3=s2&&A.near.every(({x})=>decisions[x.key]);
  return {s1,s2,s3,cur:phase==="done"?5:!s1?1:!s2?2:!s3?3:4};
}
function renderRail(){
  const st=stepState(), L=["Écrire","Vérifier","Confronter","Inscrire"];
  $("#rail").innerHTML=L.map((l,i)=>{const n=i+1, ok=n<st.cur||phase==="done";return `<li class="${ok?"ok":n===st.cur?"cur":""}" ${n===st.cur?'aria-current="step"':""}><span class="num">${ok?"✓":n}</span>${l}</li>`}).join("");
  ["s2","s3","s4"].forEach((id,i)=>$("#"+id).classList.toggle("locked",phase!=="done"&&st.cur<i+2));
}
function check(){
  A=analyse($("#t").value);
  const C=A.crit;
  $("#crit").innerHTML=$("#t").value.trim().length<20?`<li><span class="dot"></span><span style="color:var(--dim)">La vérification commence dès quelques mots.</span></li>`:
    Object.values(C).map(v=>`<li><span class="dot ${v.c}"></span><span>${v.l}${v.m?` : <mark>${esc(v.m.trim())}</mark>`:""}${v.s&&v.c!=="ok"?`<small>${esc(v.s)}</small>`:""}</span></li>`).join("");
  // décisions : on garde celles qui concernent encore une recommandation proche
  const keys=A.near.map(({x})=>x.key); Object.keys(decisions).forEach(k=>{if(!keys.includes(k))delete decisions[k]});
  const OPT={keep:"Elle est distincte : je maintiens",cite:"Je la reprends en relance (citée en note)"};
  $("#decs").innerHTML=!A.ready?`<span style="font-size:12.5px;color:var(--dim)">Après la vérification.</span>`:A.near.length?A.near.map(({x})=>`<div class="dec"><span><span class="dot ${S[x.s].c}"></span> <b>${x.rep.own?"Rapport n° "+x.rep.id:x.rep.short}, reco. ${x.n}</b> · ${S[x.s].l}<br>${esc(x.t)} <button class="ghost" data-go="${x.key}">Voir dans le suivi</button></span>
     <div class="opts" role="radiogroup" aria-label="Décision">${Object.entries(OPT).map(([k,l])=>`<button class="chip ${decisions[x.key]===k?"on":""}" role="radio" aria-checked="${decisions[x.key]===k}" data-dec="${x.key}" data-v="${k}">${l}</button>`).join("")}</div></div>`).join("")
     :`<span style="font-size:12.5px;color:var(--muted)">Rien de proche dans le registre : rien à trancher.</span>`;
  renderRail(); renderIns(); renderA1();
}
function renderA1(){
  const has=$("#t").value.trim().length>0;
  $("#a1").innerHTML=phase==="done"?"":has?`<button class="ghost" id="drop">Abandonner ce brouillon</button>`:"";
  $("#t").readOnly=phase==="sending"||phase==="confirm";
}
function renderIns(){
  const st=stepState(), n=PROJ.recos.length+1, el=$("#ins");
  if(phase==="done"){ const x=lastIns; el.innerHTML=`<div class="done"><b>Inscrite comme recommandation n° ${x.n} du projet n° 1530.</b><ul>
     <li>Elle apparaît dans le suivi, en tête du projet n° 1530.</li><li>Transmise au secrétariat de la commission : la modifier passe désormais par lui.</li>
     <li>Premier point de suivi : ${x.due?fdate(x.due):"à fixer"}.</li>${Object.values(decisions).includes("cite")?"<li>Les recommandations reprises sont citées en note.</li>":""}</ul>
     <div class="acts"><button class="btn" id="again">Écrire une autre recommandation</button></div></div>`; return; }
  if(!st.s3){ el.innerHTML=`<span style="font-size:12.5px;color:var(--dim)">${!st.s2?"Après la vérification.":"Tranchez d'abord chaque recommandation proche."}</span>`; return; }
  if(phase==="confirm"){ el.innerHTML=`<div class="confirm" role="group" aria-label="Confirmer l'inscription"><b>Inscrire comme recommandation n° ${n} ?</b><ul><li>Elle sera transmise au secrétariat de la commission.</li><li>Elle ne pourra plus être modifiée ni retirée ici.</li></ul>
     <div class="acts"><button class="btn pri" id="go">Confirmer l'inscription</button><button class="btn" id="back">Revenir au texte</button></div></div>`; $("#go").focus(); return; }
  if(phase==="sending"){ el.innerHTML=`<span style="font-size:13px"><span class="spin"></span>Transmission au secrétariat…</span>`; return; }
  el.innerHTML=(phase==="error"?`<div class="banner err" role="alert"><span>Le secrétariat n'a pas répondu. Rien n'a été inscrit ; votre texte est conservé.</span><button class="btn" id="retry">Réessayer</button></div>`:"")+
    `<div class="acts" style="margin-top:0"><button class="btn pri" id="ask">Inscrire comme recommandation n° ${n}</button></div>
     <label class="demo"><input type="checkbox" id="fail" ${fail?"checked":""}> Démonstration : simuler une panne du secrétariat</label>`;
}
function send(){
  phase="sending"; renderIns(); renderA1();
  setTimeout(()=>{ if(fail){phase="error";fail=false;renderIns();renderA1();$("#retry")?.focus();return}
    const x={n:PROJ.recos.length+1,t:$("#t").value.trim(),to:A.crit.to.c==="ok"?A.crit.to.m.trim().replace(/^./,c=>c.toUpperCase()):null,due:guessDue(),s:"wait",fresh:true};
    PROJ.recos.unshift(x); lastIns=x; phase="done"; store.del(); $("#save").textContent=""; $("#t").readOnly=true; renderAll();
    const el=$(`[data-key="1530-${x.n}"]`); el?.scrollIntoView({block:"nearest"}); },900);
}
function guessDue(){const m=A.crit.due.m||"",y=m.match(/\d{4}/);return y?(/finances|plf/.test(m)?`${+y[0]-1}-10-01`:`${y[0]}-12-31`):null}
/* ---------- brouillon : enregistrement automatique, reprise, abandon annulable ---------- */
let sv;
function saveDraft(){ clearTimeout(sv); $("#save").textContent="Modifié…"; sv=setTimeout(()=>{const t=$("#t").value;
  if(t.trim()){store.set({t,at:Date.now(),decisions});$("#save").textContent="Brouillon enregistré à "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}else{store.del();$("#save").textContent=""}},600)}
function dropDraft(){ undoBuf={t:$("#t").value,decisions:{...decisions}}; $("#t").value=""; decisions={}; store.del(); phase="edit"; $("#resume").innerHTML=`<div class="banner"><span>Brouillon abandonné.</span><button class="btn" id="undo">Annuler</button></div>`; check(); $("#t").focus(); }
/* ---------- suivi ---------- */
const reps=()=>[PROJ,...R];
function renderReg(){
  const own=ALL.filter(x=>x.rep.own), c=k=>own.filter(x=>x.s===k).length;
  $("#lead").innerHTML=`Sur ${own.length} recommandations de vos rapports publiés, ${c("done")} sont mises en œuvre et ${c("part")} en partie. <span>${c("no")} restent sans suite, ${c("wait")} ne sont pas encore échues.</span>`;
  const stale=Object.values(sync).some(s=>s.st==="stale"), bad=Object.entries(sync).filter(([,s])=>s.st==="bad");
  $("#fresh").textContent=syncing?"":stale?"":bad.length?"":"Statuts vérifiés aujourd'hui";
  $("#sync").innerHTML=syncing?`<div class="banner"><span><span class="spin"></span>Vérification des statuts auprès des sources (Journal officiel, lois de finances, Cour des comptes)…</span></div>`
    :bad.length?`<div class="banner err" role="alert"><span>${reps().filter(r=>sync[r.id].st==="fresh").length} rapports revérifiés. Le site de la Cour des comptes n'a pas répondu : ses statuts datent du ${fdate(sync.ccomptes.at)}.</span><button class="btn" id="resync">Réessayer</button></div>`
    :stale?`<div class="banner warn"><span>Statuts vérifiés le ${fdate("2026-05-12")}, il y a six mois : certains ont pu changer.</span><button class="btn" id="resync">Revérifier</button></div>`:"";
  $("#filters").innerHTML=`<button class="chip ${f==null?"on":""}" data-f="">Toutes</button>`+Object.entries(S).map(([k,v])=>`<button class="chip ${f===k?"on":""}" data-f="${k}"><span class="dot ${v.c}"></span>${v.l}</button>`).join("");
  $("#reg").innerHTML=reps().map(r=>{ const L=r.recos.filter(x=>f==null||x.s===f), s=sync[r.id];
    const lab=s.st==="draft"?"en préparation":s.st==="fresh"?"vérifié aujourd'hui":s.st==="bad"?`non revérifié · ${fdate(s.at)}`:`vérifié le ${fdate(s.at)}`;
    return `<section class="panel rep"><div class="rep-h"><b>${esc(r.short||r.t)}</b><small>${r.draft?r.d:r.d.replace("Rapport d'information ","")}</small><span class="st ${s.st==="stale"?"stale":s.st==="bad"?"bad":s.st==="fresh"?"fresh":""}">${lab}</span></div>
    ${L.length?L.map(x=>`<div class="rc ${x.fresh?"new":""}" data-key="${r.id}-${x.n}"><span class="dot ${S[x.s].c}"></span><div><p>${x.n}. ${esc(x.t)}</p><small><b>${S[x.s].l}</b> · ${x.to?esc(x.to):"sans destinataire"} · ${dueTxt(x)}${x.proof?" · "+esc(x.proof):""}</small></div></div>`).join(""):`<div class="empty">Aucune avec ce statut.</div>`}</section>`}).join("");
}
function resync(){ syncing=true; renderReg(); const bad=sync.ccomptes.st!=="bad"; // première tentative : la Cour des comptes échoue
  setTimeout(()=>{ syncing=false; ["1402","987"].forEach(k=>sync[k]={at:"2026-11-10",st:"fresh"}); sync.ccomptes=bad?{at:sync.ccomptes.at,st:"bad"}:{at:"2026-11-10",st:"fresh"}; renderReg(); },1200); }
function renderAll(){ renderReg(); check(); }
/* ---------- événements ---------- */
let tm; $("#t").addEventListener("input",()=>{ if(phase==="error")phase="edit"; $("#resume").innerHTML=""; clearTimeout(tm); tm=setTimeout(check,150); saveDraft(); });
document.addEventListener("change",e=>{if(e.target.id==="fail")fail=e.target.checked});
document.addEventListener("click",e=>{
  const id=e.target.closest("button")?.id;
  const d=e.target.closest("[data-dec]"); if(d){decisions[d.dataset.dec]=d.dataset.v;saveDraft();check();return}
  const c=e.target.closest("[data-f]"); if(c){f=c.dataset.f||null;renderReg();return}
  const g=e.target.closest("[data-go]"); if(g){f=null;renderReg();const el=$(`.rc[data-key="${g.dataset.go}"]`);if(el){el.classList.add("hl");el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});setTimeout(()=>el.classList.remove("hl"),1800)}return}
  if(id==="ask"){phase="confirm";check();return}
  if(id==="back"){phase="edit";check();$("#t").focus();return}
  if(id==="go"||id==="retry"){send();return}
  if(id==="drop"){dropDraft();return}
  if(id==="undo"){$("#t").value=undoBuf.t;decisions=undoBuf.decisions;$("#resume").innerHTML="";saveDraft();check();return}
  if(id==="fresh0"){ $("#resume").innerHTML=""; dropDraft(); return}
  if(id==="again"){phase="edit";lastIns.fresh=false;decisions={};$("#t").readOnly=false;$("#t").value="";renderAll();$("#t").focus();return}
  if(id==="resync"){resync();return}
});
document.addEventListener("keydown",e=>{ if(e.key!=="Escape")return; if(phase==="confirm"){phase="edit";check();$("#t").focus()} else if(f){f=null;renderReg()} });
/* ---------- ouverture : reprise d'un brouillon interrompu ---------- */
const saved=store.get();
if(saved&&saved.t){ $("#t").value=saved.t; decisions=saved.decisions||{}; const min=Math.max(1,Math.round((Date.now()-saved.at)/6e4));
  $("#resume").innerHTML=`<div class="banner"><span>Brouillon repris, laissé il y a ${min<60?min+" min":Math.round(min/60)+" h"}.</span><button class="btn" id="fresh0">Repartir de zéro</button></div>`; }
else $("#t").value=START;
renderAll();
</script>

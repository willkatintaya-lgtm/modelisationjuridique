.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;color:var(--muted);font-size:12.5px;background:none;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip:hover{color:var(--fg)}
.chip.on{color:var(--fg);border-color:var(--accent);background:var(--lit)}

.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
ins{color:var(--ins);text-decoration:underline 1px;text-underline-offset:3px;font-weight:500;background:none}
del{color:var(--dim);text-decoration:line-through 1px var(--del);background:none}
mark{background:var(--lit);color:var(--fg);border-radius:3px;padding:0 1px}
input[type=text],input[type=number],textarea,select{background:var(--s2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--fg);font-size:13px}

.gp{display:inline-grid;place-items:center;min-width:24px;height:16px;padding:0 4px;border-radius:4px;color:#fff;font-size:9.5px;font-weight:600;vertical-align:1px;margin-right:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--s2);border:1px solid var(--line2);color:var(--fg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100vw - 32px);animation:rise .2s var(--ease)}

.scrollx::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}

<style>
/* Variante « patterns » : onglets de statut (3) + filtre ministère en puces (6) au lieu du tableau croisé ;
   engagements en accordéon (divulgation progressive, en place) ; rédaction de la question dans un tiroir latéral (overlay) ;
   squelette pour la recherche des questions déjà posées (> 400 ms) ; toasts empilés avec « Annuler ». */
.tabs{display:flex;gap:2px;margin-top:18px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;color:var(--muted);min-height:44px;padding:0 14px;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.tab .c{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--s2);font-size:11.5px;color:var(--muted)}
.tab[aria-selected="true"] .c{background:var(--lit);color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.chips .chip{min-height:36px;padding:0 12px}
.rates{margin:6px 2px 0;font-size:12.5px;color:var(--muted)}
.rates summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;min-height:32px;color:var(--muted)}
.rates summary::-webkit-details-marker{display:none}
.rates summary:hover{color:var(--fg)}
.rates summary svg{transition:transform .2s var(--ease)}
.rates[open] summary svg{transform:rotate(90deg)}
.rt{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) 92px;gap:6px 12px;align-items:center;padding:8px 0 4px;max-width:620px}
.rt .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.rt .bar i{display:block;height:100%;background:var(--muted);border-radius:3px}
.rt small{color:var(--dim)}
.bk{margin:20px 2px 6px;font-size:11.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.acc{padding:4px}
.acc>.e+.e{border-top:1px solid var(--line)}
.e{border-radius:7px}
.eh{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;min-height:56px;border:0;background:none;text-align:left;padding:10px 12px;border-radius:7px;cursor:pointer;transition:background .2s}
.eh:hover{background:var(--s2)}
.eh .chev{grid-row:1/3;color:var(--dim);transition:transform .25s var(--ease)}
.e.open .eh .chev{transform:rotate(90deg);color:var(--fg)}
.eh .tt{color:var(--fg);font-size:13.5px}
.eh .mt{grid-column:2;font-size:12.5px;color:var(--muted)}
.eh .ag{grid-row:1/3;grid-column:3;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.eb{padding:2px 14px 16px 42px}
.due{display:flex;gap:4px 14px;flex-wrap:wrap;align-items:baseline;font-size:13px;padding:10px 12px;border-radius:8px;background:var(--s2)}
.due b{color:var(--fg);font-weight:500}
.due small{flex-basis:100%;color:var(--dim);font-size:12px}
.trail{list-style:none;margin:0;padding:0}
.trail li{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;padding:7px 0;font-size:13px}
.trail li+li{border-top:1px solid var(--line)}
.trail .d{font-size:12px;color:var(--dim);padding-top:1px}
.trail q{display:block;margin-top:4px;color:var(--muted);quotes:"« " " »";font-size:12.5px;line-height:1.6}
.trail .miss{color:#f2a7a9}
.more{border:0;background:none;color:#b4bcff;padding:6px 0;font-size:12.5px;cursor:pointer;min-height:32px}
.more:hover{text-decoration:underline}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acts .btn{min-height:40px;padding:0 14px}
.hint{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.form{margin-top:14px;padding:14px;border:1px solid var(--line2);border-radius:9px;display:grid;gap:12px;animation:fin .25s var(--ease)}

.drawer.show{transform:none;visibility:visible;transition:transform .3s var(--ease)}

.db{flex:1;overflow-y:auto;padding:4px 18px 18px}
.df{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

@keyframes sh{to{background-position:-200% 0}}
textarea{width:100%;min-height:220px;resize:vertical;line-height:1.6;padding:10px 12px}
/* toasts empilés */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column-reverse;gap:8px;width:min(380px,calc(100vw - 32px))}
.ts{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 14px;border-radius:9px;background:var(--s2);border:1px solid var(--line2);font-size:13px;color:var(--fg);box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .25s var(--ease)}
.ts.out{opacity:0;transition:opacity .2s}
.ts.err{border-color:rgba(229,72,77,.45)}
.ts .dot{margin-right:-2px}
.ts span{flex:1}

.ts button:hover{background:var(--line)}
.ts .tx{color:var(--dim);width:36px;padding:0;display:grid;place-items:center}

  .drawer{top:auto;height:92vh;width:100vw;border-left:0;border-top:1px solid var(--line2);border-radius:14px 14px 0 0;transform:translateY(100%)}
}

  trail:[{d:"3 mars 2025",t:"Article 12 de la loi n° 2025-187.",q:"Un <mark>arrêté du ministre chargé du logement fixe</mark> le modèle de déclaration."},{d:"30 janv. 2026",t:"Arrêté publié au Journal officiel, quatre mois après l’échéance."}]},
 {id:"d112",type:"decret",min:"ECO",title:"Décret sur la déclaration des logements vacants aux impôts",due:"2026-06-30",calc:"Promulgation le 30 décembre 2025 + 6 mois",done:"2026-04-02",proof:"Décret n° 2026-311 du 2 avril 2026",
  trail:[{d:"30 déc. 2025",t:"Article 112 de la loi de finances pour 2026."},{d:"2 avr. 2026",t:"Décret publié, dans les délais."}]},
 {id:"reco5",type:"reco",min:"ECO",title:"Recommandation 5 : évaluer la taxe sur les logements vacants dans le PLF",due:"2026-10-01",calc:"Échéance : dépôt du projet de loi de finances pour 2027",done:"2026-10-01",proof:"PLF 2027, annexe « Évaluation des voies et moyens », tome II",
  trail:[{d:"24 juin 2026",t:"Rapport d'information n° 1402, recommandation n° 5."},{d:"1er oct. 2026",t:"L'évaluation figure dans le projet de loi de finances pour 2027."}]},
];
const BUCKETS=[{k:0,l:"À venir",s:"À venir"},{k:1,l:"Moins de 3 mois",s:"< 3 mois"},{k:2,l:"3 à 12 mois",s:"3–12 mois"},{k:3,l:"Plus d'un an",s:"> 1 an"},{k:4,l:"Tenus",s:"Tenus"}];
function months(a,b){return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())-(b.getDate()<a.getDate()?1:0)}
function bucket(e){ if(e.done) return 4; const due=D(e.due); if(due>=NOW) return 0; const m=months(due,NOW); return m<3?1:m<12?2:3; }
function age(e){
  const due=D(e.due);
  if(e.done){const late=months(due,D(e.done)); return late>0?`Tenu, ${late} mois après l'échéance`:"Tenu dans les délais"}
  const days=Math.round((due-NOW)/864e5);
  if(days>=0) return days<=31?`Échéance dans ${days} jour${days>1?"s":""}`:`Échéance le ${fmt(due).replace(/ \d{4}$/,"")}`;
  const m=months(due,NOW); if(m<1){const d=-days;return `${d} jour${d>1?"s":""} de retard`}
  return m>=12?`${Math.floor(m/12)} an${m>=24?"s":""}${m%12?` et ${m%12} mois`:""} de retard`:`${m} mois de retard`;
}
// ——— Variante patterns ———
const TABS=[{k:"late",l:"En retard"},{k:"soon",l:"À venir"},{k:"done",l:"Tenus"}];
const P={tab:"late",min:null,open:null,form:null,full:{},drawer:null,signaled:{}};
const status=e=>e.done?"done":D(e.due)<NOW?"late":"soon";
const byDue=(a,b)=>D(a.due)-D(b.due);
const lc=s=>s.charAt(0).toLowerCase()+s.slice(1);
const dotCls=e=>({0:"",1:"warn",2:"err",3:"err",4:"ok"})[bucket(e)];
const chev=`<svg class="chev" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3l5 5-5 5"/></svg>`;
const xIcon=`<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4l8 8M12 4l-8 8"/></svg>`;
const reduce=()=>matchMedia("(prefers-reduced-motion:reduce)").matches;

// ——— toasts empilés (3 au plus), pause au survol, « Annuler » quand l'action se défait ———
function notify(msg,{kind="ok",undo=null,ms=6000}={}){
  const box=$("#toasts"); while(box.children.length>=3) box.firstElementChild.remove();
  const t=document.createElement("div"); t.className="ts"+(kind==="err"?" err":"");
  t.innerHTML=`<i class="dot ${kind==="err"?"err":"ok"}"></i><span></span>${undo?`<button data-u>Annuler</button>`:""}<button class="tx" aria-label="Fermer la notification">${xIcon}</button>`;
  t.querySelector("span").textContent=msg; box.append(t);
  let left=ms, start=Date.now(), timer;
  const close=()=>{clearTimeout(timer);t.classList.add("out");setTimeout(()=>t.remove(),200)};
  const run=()=>{start=Date.now();timer=setTimeout(close,left)};
  t.addEventListener("mouseenter",()=>{clearTimeout(timer);left-=Date.now()-start});
  t.addEventListener("mouseleave",run);
  t.querySelector(".tx").onclick=close;
  if(undo) t.querySelector("[data-u]").onclick=()=>{undo();close()};
  run();
}

function lead(){
  const open=E.filter(e=>!e.done), late=open.filter(e=>status(e)==="late").sort(byDue), o=late[0];
  $("#lead").innerHTML=`${open.length} engagements restent ouverts, dont ${late.length} en retard. <span>${o?`Le plus ancien : ${lc(o.title)}, ${age(o)}.`:""}</span>`;
}
function tabs(){
  $("#tabs").innerHTML=TABS.map(t=>{const n=E.filter(e=>status(e)===t.k&&(P.min==null||e.min===P.min)).length;
    return `<button class="tab" role="tab" id="tab-${t.k}" aria-controls="panel" aria-selected="${P.tab===t.k}" tabindex="${P.tab===t.k?0:-1}" data-tab="${t.k}">${t.l}<span class="c">${n}</span></button>`}).join("");
  $("#panel").setAttribute("aria-labelledby","tab-"+P.tab);
  const pool=E.filter(e=>status(e)===P.tab);
  $("#chips").innerHTML=`<button class="chip${P.min==null?" on":""}" aria-pressed="${P.min==null}" data-min="">Tous</button>`+Object.keys(MIN).map(m=>{const n=pool.filter(e=>e.min===m).length;return (!n&&P.min!==m)?"":`<button class="chip${P.min===m?" on":""}" aria-pressed="${P.min===m}" data-min="${m}">${MIN[m]} <span style="color:var(--dim)">${n}</span></button>`}).join("");
}
function rates(){
  $("#rt").innerHTML=`<div class="rt">${Object.keys(MIN).map(m=>{const[r,t]=QE[m],p=Math.round(100*r/t);return `<span>${MIN[m]}</span><span class="bar"><i style="width:${p}%"></i></span><span>${p} % <small>(${r}/${t})</small></span>`}).join("")}</div><div style="font-size:12px;color:var(--dim);margin:2px 0 6px">Part des questions écrites de la législature (toutes, pas seulement les nôtres) qui ont reçu une réponse dans les deux mois.</div>`;
}
function body(e){
  const st=status(e), steps=e.trail.filter(x=>!(e.done&&x.miss)), full=P.full[e.id]||steps.length<=3;
  const shown=full?steps:[steps[0],steps[steps.length-1]];
  let h=`<div class="due"><b>${age(e)}</b><span>Échéance : ${fmt(D(e.due))}</span><small>${e.calc}</small></div>
  <div class="sec">D'où vient cet engagement</div><ol class="trail">${shown.map((s,i)=>`<li><span class="d">${s.d}</span><span class="${s.miss?"miss":""}">${s.t}${s.q?`<q>${s.q}</q>`:""}</span></li>`).join("")}</ol>
  ${full?"":`<button class="more" data-full="${e.id}">Voir les ${steps.length} étapes</button>`}`;
  let acts=[];
  if(st==="done"){h+=`<p class="hint">Preuve : ${esc(e.proof)}</p>`; acts.push(`<button class="btn" data-reopen="${e.id}">Rouvrir</button>`)}
  else if(e.action==="same"){const r=E.find(x=>x.id===e.rel); h+=`<p class="hint">Même décret que « ${r.title} » : une seule question couvre les deux.</p>`; acts.push(`<button class="btn pri" data-goto="${r.id}">Aller au décret attendu</button>`)}
  else if(e.action==="signal"&&st==="late"){h+=`<p class="hint">Délai de deux mois dépassé. Signalée par le président de groupe, la question doit obtenir une réponse sous dix jours.</p>`; acts.push(P.signaled[e.id]?`<button class="btn" disabled>Proposée au groupe</button>`:`<button class="btn pri" data-signal="${e.id}">Proposer au groupe de la signaler</button>`)}
  else if(e.draft&&st==="late") acts.push(`<button class="btn pri" data-draft="${e.id}">Rédiger une question écrite</button>`);
  if(st!=="done"&&(st==="late"||e.type==="reco")) acts.push(`<button class="btn" data-form="${e.id}" aria-expanded="${P.form===e.id}">Marquer comme tenu</button>`);
  if(acts.length) h+=`<div class="acts">${acts.join("")}</div>`;
  if(P.form===e.id){
    const def=e.type==="rapport"?"depot":e.type==="qe"?"jo-qe":e.type==="reco"?"autre":"jo";
    h+=`<form class="form" data-submit="${e.id}" novalidate>
      <div class="fl"><label for="ptype">Où l'engagement a-t-il été tenu ?</label><select id="ptype">
        <option value="jo" ${def==="jo"?"selected":""}>Journal officiel (décret, arrêté)</option>
        <option value="depot" ${def==="depot"?"selected":""}>Dépôt d'un rapport au Parlement</option>
        <option value="jo-qe" ${def==="jo-qe"?"selected":""}>Réponse publiée au Journal officiel</option>
        <option value="autre" ${def==="autre"?"selected":""}>Autre document public</option></select><span class="help">Choix proposé d'après le type d'engagement.</span></div>
      <div class="fl"><label for="pref">Référence</label><input type="text" id="pref" autocomplete="off" aria-describedby="prefh"><span class="help" id="prefh">Numéro et date, par exemple « Décret n° 2026-412 du 3 novembre 2026 ».</span></div>
      <div class="acts" style="margin-top:0"><button class="btn pri" type="submit">Enregistrer la preuve</button><button class="btn" type="button" data-cancel>Annuler</button></div></form>`;
  }
  return h;
}
function item(e){
  const o=P.open===e.id;
  return `<div class="e${o?" open":""}" id="e-${e.id}"><button class="eh" aria-expanded="${o}" aria-controls="b-${e.id}" data-acc="${e.id}">${chev}<span class="tt">${e.title}</span><span class="mt">${TYPES[e.type]} · ${MIN[e.min]}</span><span class="ag"><i class="dot ${dotCls(e)}"></i>${age(e)}</span></button>
  <div class="slide" id="b-${e.id}"><div>${o?`<div class="eb">${body(e)}</div>`:""}</div></div></div>`;
}
function panel(){
  let L=E.filter(e=>status(e)===P.tab&&(P.min==null||e.min===P.min));
  L=P.tab==="done"?L.sort((a,b)=>D(b.done)-D(a.done)):L.sort(byDue);
  if(!L.length){$("#panel").innerHTML=`<div class="panel empty">Rien dans cet onglet${P.min?" pour ce ministère":""}.</div>`;return}
  if(P.tab!=="late"){$("#panel").innerHTML=`<div class="panel acc" style="margin-top:14px">${L.map(item).join("")}</div>`;return}
  // en retard : regroupé par ancienneté (3 groupes au plus)
  $("#panel").innerHTML=[3,2,1].map(k=>{const G=L.filter(e=>bucket(e)===k);return G.length?`<div class="bk">${BUCKETS[k].l} de retard<span style="letter-spacing:0">· ${G.length}</span></div><div class="panel acc">${G.map(item).join("")}</div>`:""}).join("").replace("Moins de 3 mois de retard","Moins de 3 mois de retard").replace("3 à 12 mois de retard","De 3 à 12 mois de retard");
}
function render(){lead();tabs();panel()}
// ouverture d'un accordéon : le contenu glisse (grille 0fr → 1fr)
function setOpen(id){
  const prev=P.open, closing=prev&&$("#e-"+prev);
  P.open=prev===id?null:id; P.form=null;
  const after=()=>{render(); if(P.open){const el=$("#e-"+P.open); el.classList.remove("open"); el.offsetHeight; el.classList.add("open");}};
  // ce qui se ferme s'efface d'abord (grille 1fr → 0fr), puis la liste est redessinée
  if(closing&&!reduce()){closing.classList.remove("open"); setTimeout(after,280)} else after();
}
// ——— tiroir ———
let lastFocus=null;
function openDrawer(id){
  const e=E.find(x=>x.id===id); P.drawer=id; lastFocus=document.activeElement;
  const dr=$("#drawer");
  dr.innerHTML=`<div class="dh"><div><div class="k">Question écrite · ${MIN[e.min]}</div><h2 id="dtitle">${e.title}</h2></div><span class="sp"></span><button class="x" data-close aria-label="Fermer">${xIcon}</button></div>
  <div class="db"><div class="sec">Questions déjà posées sur ce sujet</div><div class="near" id="near">${[0,1].map(()=>`<div class="nq" aria-hidden="true"><span class="sk" style="width:45%"></span><span class="sk" style="width:80%"></span></div>`).join("")}</div>
  <div class="sec"><label for="draft">Projet de question</label></div><textarea id="draft">Mme [nom de la députée] ${e.draft}</textarea>
  <p class="hint" style="margin-top:6px">Rédigé à partir des faits de l'engagement. Remplacez le nom entre crochets avant le dépôt.</p></div>
  <div class="df"><button class="btn" data-close>Fermer</button><button class="btn pri" data-copy>Copier la question</button></div>`;
  $("#scrim").classList.add("show"); dr.classList.add("show"); document.body.style.overflow="hidden";
  setTimeout(()=>dr.querySelector(".x").focus(),reduce()?0:300);
  // la base des questions répond en ~700 ms : au-delà de 400 ms, on montre la forme du résultat
  setTimeout(()=>{ if(P.drawer!==id) return; const n=$("#near");
    n.innerHTML=e.near.length?e.near.map(q=>`<div class="nq"><span class="gp" style="background:${GROUPS[q.g].c}">${q.g}</span><b>n° ${q.n}</b> · ${q.who}, ${q.date}<br>${q.st}</div>`).join(""):`<p class="hint" style="margin:0">Aucune question écrite ne porte encore sur cet engagement : la vôtre sera la première.</p>`;},700);
}
function closeDrawer(){
  if(!P.drawer) return; P.drawer=null;
  $("#drawer").classList.remove("show"); $("#scrim").classList.remove("show"); document.body.style.overflow="";
  lastFocus?.focus?.();
}
// piège du focus dans le tiroir
document.addEventListener("keydown",ev=>{
  if(ev.key==="Tab"&&P.drawer){const f=[...$("#drawer").querySelectorAll("button,textarea,input,select")].filter(x=>!x.disabled); const a=f[0],z=f[f.length-1];
    if(ev.shiftKey&&document.activeElement===a){ev.preventDefault();z.focus()} else if(!ev.shiftKey&&document.activeElement===z){ev.preventDefault();a.focus()}}
  if(ev.key==="Escape"){
    if(P.drawer){closeDrawer();return}
    if(P.form){const id=P.form;P.form=null;render();$("#e-"+id+" .eh")?.focus();return}
    if(P.open){const id=P.open;P.open=null;render();$("#e-"+id+" .eh")?.focus();return}
  }
  // onglets : flèches gauche/droite
  if(ev.target.matches(".tab")&&(ev.key==="ArrowRight"||ev.key==="ArrowLeft")){
    const i=TABS.findIndex(t=>t.k===P.tab), j=(i+(ev.key==="ArrowRight"?1:-1)+TABS.length)%TABS.length;
    selectTab(TABS[j].k); $("#tab-"+TABS[j].k).focus();
  }
});
function selectTab(k){P.tab=k;P.open=null;P.form=null;if(P.min&&!E.some(e=>status(e)===k&&e.min===P.min))P.min=null;render()}
document.addEventListener("submit",ev=>{
  const f=ev.target.closest("[data-submit]"); if(!f) return; ev.preventDefault();
  const e=E.find(x=>x.id===f.dataset.submit), inp=$("#pref"), v=inp.value.trim();
  f.querySelector(".msg")?.remove();
  if(!v||!/\d/.test(v)){inp.setAttribute("aria-invalid","true");inp.insertAdjacentHTML("afterend",`<span class="msg">${v?"Ajoutez un numéro ou une date pour retrouver la preuve.":"Indiquez la référence : sans elle, l'engagement reste ouvert."}</span>`);inp.focus();return}
  e.done=NOW.toISOString().slice(0,10); e.proof=v; P.open=null; P.form=null; render();
  notify(`« ${e.title} » est passé dans Tenus.`,{undo:()=>{delete e.done;delete e.proof;P.open=e.id;render();$("#e-"+e.id)?.classList.add("open")}});
});
document.addEventListener("click",ev=>{
  const t=ev.target;
  if(t.closest("#scrim")||t.closest("[data-close]")){closeDrawer();return}
  const tb=t.closest("[data-tab]"); if(tb){selectTab(tb.dataset.tab);return}
  const ch=t.closest("[data-min]"); if(ch&&!ch.disabled){P.min=ch.dataset.min||null;P.open=null;render();return}
  const a=t.closest("[data-acc]"); if(a){setOpen(a.dataset.acc);return}
  const fu=t.closest("[data-full]"); if(fu){P.full[fu.dataset.full]=true;render();$("#e-"+P.open).classList.add("open");return}
  const fo=t.closest("[data-form]"); if(fo){P.form=P.form===fo.dataset.form?null:fo.dataset.form;render();$("#e-"+P.open).classList.add("open");if(P.form)$("#pref").focus();return}
  if(t.closest("[data-cancel]")){P.form=null;render();$("#e-"+P.open).classList.add("open");return}
  const dr=t.closest("[data-draft]"); if(dr){openDrawer(dr.dataset.draft);return}
  const go=t.closest("[data-goto]"); if(go){P.tab=status(E.find(x=>x.id===go.dataset.goto));P.min=null;P.open=null;setOpen(go.dataset.goto);$("#e-"+go.dataset.goto).scrollIntoView({block:"center",behavior:reduce()?"auto":"smooth"});return}
  const sg=t.closest("[data-signal]"); if(sg){const id=sg.dataset.signal;P.signaled[id]=true;render();$("#e-"+id).classList.add("open");notify("Proposition transmise au secrétariat du groupe (simulation).",{undo:()=>{delete P.signaled[id];render();$("#e-"+P.open)?.classList.add("open")}});return}
  const ro=t.closest("[data-reopen]"); if(ro){const e=E.find(x=>x.id===ro.dataset.reopen),bak={done:e.done,proof:e.proof};delete e.done;delete e.proof;P.open=null;render();notify(`« ${e.title} » est revenu dans les engagements ouverts.`,{undo:()=>{Object.assign(e,bak);render()}});return}
  if(t.closest("[data-copy]")){const v=$("#draft").value; const fail=()=>{const d=$("#draft");d.focus();d.select();notify("Copie refusée par le navigateur : le texte est sélectionné, faites Ctrl+C.",{kind:"err"})};
    navigator.clipboard?navigator.clipboard.writeText(v).then(()=>notify("Question copiée dans le presse-papiers."),fail):fail();return}
});
document.addEventListener("input",ev=>{if(ev.target.id==="pref"){ev.target.removeAttribute("aria-invalid");ev.target.parentElement.querySelector(".msg")?.remove()}});
rates();
// À l'ouverture, l'engagement le plus en retard est déplié
P.open=E.filter(e=>status(e)==="late").sort(byDue)[0].id; render(); $("#e-"+P.open).classList.add("open");
</script>

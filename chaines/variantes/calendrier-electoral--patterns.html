<title>Avant le scrutin · patterns</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0a0b0d; --s1:#111316; --s2:#171a1e; --line:#22252a; --line2:#2d3137;
  --fg:#f3f5f7; --text:#cfd5dd; --muted:#8a919b; --dim:#5d636c;
  --ins:#8ab4ff; --del:#e5484d; --accent:#6e7bf2; --lit:rgba(110,123,242,.16);
  --ok:#46b37e; --warn:#e3a33f; --err:#e5484d;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.25,.8,.25,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.narrow{max-width:780px}
.ctx{font-size:12.5px;color:var(--dim)}
h1{margin:3px 0 0;font:600 19px/1.3 var(--f);color:var(--fg);letter-spacing:-.012em;text-wrap:balance}
.lead{margin:14px 0 18px;max-width:780px;color:var(--fg);font-size:15.5px;line-height:1.55;text-wrap:pretty}
.lead span{color:var(--muted)}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:10px}
.sec{margin:18px 2px 8px;font-size:11.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.btn{border:1px solid var(--line2);background:var(--s2);color:var(--fg);border-radius:7px;padding:7px 12px;font-size:13px;cursor:pointer;transition:background .2s,opacity .2s;white-space:nowrap}
.btn:hover:not(:disabled){background:#1f2227}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover:not(:disabled){background:#7b87f5}
.btn:disabled{opacity:.4;cursor:default}
.ghost{border:1px solid var(--line2);background:none;color:var(--muted);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;transition:color .2s,background .2s}
.ghost:hover{color:var(--fg);background:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;color:var(--muted);font-size:12.5px;background:none;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip:hover{color:var(--fg)}
.chip.on{color:var(--fg);border-color:var(--accent);background:var(--lit)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
ins{color:var(--ins);text-decoration:underline 1px;text-underline-offset:3px;font-weight:500;background:none}
del{color:var(--dim);text-decoration:line-through 1px var(--del);background:none}
mark{background:var(--lit);color:var(--fg);border-radius:3px;padding:0 1px}
input[type=text],input[type=number],textarea,select{background:var(--s2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--fg);font-size:13px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--line2)}
.gp{display:inline-grid;place-items:center;min-width:24px;height:16px;padding:0 4px;border-radius:4px;color:#fff;font-size:9.5px;font-weight:600;vertical-align:1px;margin-right:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--s2);border:1px solid var(--line2);color:var(--fg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100vw - 32px);animation:rise .2s var(--ease)}
@keyframes rise{from{opacity:0;transform:translate(-50%,4px)}}
.slide{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.slide>div{min-height:0;overflow:hidden;opacity:0;transition:opacity .15s}
.open>.slide{grid-template-rows:1fr}
.open>.slide>div{opacity:1;transition:opacity .2s .12s}
.scrollx{overflow-x:auto;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const nf=(n,d=0)=>n.toLocaleString("fr-FR",{maximumFractionDigits:d,minimumFractionDigits:d});
function toast(m){$$(".toast").forEach(e=>e.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}
</script>
<style>
/* Angle « patterns » (skill interaction-patterns appliquée règle par règle) :
   onglets de moments (5 au plus, défilants avec flèches s'ils débordent), groupes par régime en dépliage natif
   (Permis replié : divulgation progressive), lignes dépliables en place pour le détail (pas de tiroir : trois champs courts),
   formulaire de date validé à la sortie du champ, toast d'annulation après changement de scrutin. */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.setup{padding:14px 16px;display:grid;gap:6px;margin-bottom:16px}
.f label{display:block;font-size:13px;font-weight:500;color:var(--fg);margin-bottom:5px}
.f input[type=date]{min-height:36px;padding:7px 11px;font-size:14px;width:min(100%,220px);background:var(--s2);border:1px solid var(--line);border-radius:7px;color:var(--fg)}
.f input[aria-invalid=true]{border-color:var(--err)}
.f .hint{margin:5px 0 0;font-size:12.5px;color:var(--muted)}
.f .error{margin:5px 0 0;font-size:12.5px;color:#f08a8d}
.f .error:empty{display:none}
/* onglets */
.tabsbar{position:relative;margin-bottom:12px}
.tablist{position:relative;display:flex;gap:4px;padding:4px;background:var(--s2);border:1px solid var(--line);border-radius:10px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.tablist::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-height:36px;border:0;border-radius:7px;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:6px 12px;line-height:1.25;white-space:nowrap;transition:background .2s,color .2s}
.tab small{display:block;font-size:11.5px;color:var(--dim)}
.tab:hover{color:var(--fg)}
.tab[aria-selected=true]{background:var(--s1);color:var(--fg);box-shadow:0 0 0 1px var(--line2)}
.tab[aria-selected=true] small{color:var(--muted)}
.arr{position:absolute;top:1px;bottom:1px;width:40px;border:0;color:var(--fg);font-size:16px;cursor:pointer;display:none;z-index:2}
.arr.on{display:block}
.arr.l{left:1px;border-radius:10px 0 0 10px;background:linear-gradient(90deg,var(--s2) 55%,transparent)}
.arr.r{right:1px;border-radius:0 10px 10px 0;background:linear-gradient(270deg,var(--s2) 55%,transparent)}
/* panneau */
.sum{margin:2px 2px 12px;font-size:14px;color:var(--fg);line-height:1.5}
.sum span{color:var(--muted)}
.other{padding:12px 14px;margin-bottom:12px}
.grp{margin-bottom:10px;overflow:hidden}
.grp>summary{list-style:none;display:flex;align-items:center;gap:9px;padding:0 14px;min-height:44px;cursor:pointer;font-weight:500;font-size:13.5px;color:var(--fg);border-radius:10px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .n{color:var(--dim);font-weight:400}
.grp>summary::after{content:"";margin-left:auto;width:6px;height:6px;border-right:1.5px solid var(--dim);border-bottom:1.5px solid var(--dim);transform:rotate(45deg);transition:transform .25s var(--ease)}
.grp[open]>summary::after{transform:rotate(-135deg)}
.grp>summary:hover{background:var(--s2)}
.rows{border-top:1px solid var(--line)}
.row+.row{border-top:1px solid var(--line)}
.sub{padding:10px 14px 4px;font-size:11.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.row+.sub{border-top:1px solid var(--line);margin-top:0}
.rh{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;width:100%;padding:11px 14px;min-height:44px;cursor:pointer;transition:background .2s}
.rh:hover{background:var(--s2)}
.rh:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rh b{color:var(--fg);font-weight:500;font-size:13.5px;line-height:1.4}
.rh i{grid-column:1;font-style:normal;font-size:12px;color:var(--dim)}
.rh .tag{color:var(--ins)}
.rh .chev{grid-row:1/span 2;grid-column:2;width:6px;height:6px;border-right:1.5px solid var(--dim);border-bottom:1.5px solid var(--dim);transform:rotate(45deg);transition:transform .25s var(--ease);margin-right:4px}
.row.open .rh .chev{transform:rotate(-135deg)}
.det{padding:0 14px 0 14px;display:grid;gap:10px}
.det>div:last-child{padding-bottom:14px}
.det .k{font-size:11.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.det p{margin:0;line-height:1.55;font-size:13px}
.det .todo{color:var(--fg)}
.how{margin:14px 2px 0;font-size:12.5px;color:var(--muted)}
.how summary{cursor:pointer;width:max-content;max-width:100%;min-height:24px}
.how summary:hover{color:var(--fg)}
.how ol{margin:8px 0 0;padding-left:20px;color:var(--text);display:grid;gap:3px}
.foot{margin:12px 2px 0;font-size:12px;color:var(--dim)}
/* toasts : en haut à droite sur grand écran, en bas au centre sur petit */
.toasts{position:fixed;top:16px;right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:8px;z-index:30;width:min(360px,calc(100vw - 32px))}
.ts{display:flex;gap:8px;align-items:center;background:var(--s2);border:1px solid var(--line2);border-radius:9px;padding:6px 6px 6px 12px;font-size:13px;color:var(--fg);box-shadow:0 8px 24px rgba(0,0,0,.35);animation:tin .25s var(--ease)}
.ts p{margin:0;flex:1;line-height:1.45;padding:4px 0}
.ts .act{border:1px solid var(--line2);background:none;color:var(--fg);border-radius:6px;min-height:28px;padding:0 10px;cursor:pointer;font-size:12.5px}
.ts .act:hover{background:#20242a}
.ts .x{border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:6px;cursor:pointer;flex:none;font-size:17px}
.ts .x:hover{color:var(--fg);background:#20242a}
.ts.out{opacity:0;transition:opacity .2s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
@media (max-width:640px){
  .toasts{top:auto;right:16px;left:16px;width:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  @keyframes tin{from{opacity:0;transform:translateY(6px)}}
  /* cibles tactiles : 44 px au moins */
  .f input[type=date],.tab{min-height:44px}
  .f input[type=date]{width:100%}
  .ts .act{min-height:44px} .ts .x{width:44px;height:44px}
  .how summary{min-height:44px;display:flex;align-items:center}
  .tab{flex:0 0 auto}
}
</style>

<div class="wrap narrow">
  <div class="ctx">Déontologie et droit électoral · moyens du mandat et moyens de campagne</div>
  <h1>Avant l'élection</h1>
  <p class="lead" id="lead"></p>

  <section class="panel setup" aria-label="Scrutin">
    <div class="f">
      <label for="el">Date du scrutin</label>
      <input type="date" id="el" value="2027-06-13" aria-describedby="elh ele">
      <p class="hint" id="elh"></p>
      <p class="error" id="ele" role="alert"></p>
    </div>
  </section>

  <div class="tabsbar">
    <button class="arr l" id="al" aria-label="Faire défiler les moments vers la gauche" tabindex="-1">‹</button>
    <div class="tablist" role="tablist" aria-label="Moment examiné" id="tabs"></div>
    <button class="arr r" id="ar" aria-label="Faire défiler les moments vers la droite" tabindex="-1">›</button>
  </div>

  <div role="tabpanel" id="panel" aria-labelledby="">
    <div class="panel other f" id="other" hidden>
      <label for="dx">Date à examiner</label>
      <input type="date" id="dx" aria-describedby="dxh dxe">
      <p class="hint" id="dxh"></p>
      <p class="error" id="dxe" role="alert"></p>
    </div>
    <p class="sum" id="sum"></p>
    <div id="groups"></div>
  </div>

  <details class="how"><summary>Comment la période des six mois est-elle calculée ?</summary><ol id="how"></ol></details>
  <p class="foot">Repères simplifiés tirés du code électoral et des avis du déontologue. Ils ne remplacent ni le guide du candidat ni une saisine du déontologue.</p>
</div>
<div class="sr" aria-live="polite" id="live"></div>
<div class="toasts" id="toasts"></div>

<script>
const TODAY=new Date(2026,10,10), DAY=864e5;
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fs=d=>d.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}).replace(/^1 /,"1er ");
const fsh=d=>d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"}).replace(/^1 /,"1er ");
const MONTHS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const LAB={ok:"Permis",warn:"À encadrer",err:"Interdit"};
const PL={ok:"permises",warn:"à encadrer",err:"interdites"};
// moteur de la maquette d'origine : chaque règle donne la date à laquelle le régime change
function rules(E){
  const six=new Date(E.getFullYear(),E.getMonth()-6,1), veille=new Date(E-DAY);
  return {six,veille,list:[
   {t:"Publications sponsorisées et encarts publicitaires",s:"Toute publicité commerciale à des fins de propagande électorale.",todo:`Arrêtez les campagnes payantes avant le ${fs(six)}. Les publications non sponsorisées restent possibles jusqu'à la veille.`,ref:"Code électoral, art. L. 52-1",at:[[six,"err"]]},
   {t:"Lettre d'information payée par l'avance de frais de mandat",s:"Elle peut être requalifiée en dépense électorale si elle promeut le candidat.",todo:"Contenu informatif sur le travail parlementaire, sans appel au vote. En cas de doute, faites-la payer par le mandataire.",ref:"Avis du déontologue",at:[[six,"warn"]]},
   {t:"Bilan de mandat imprimé et diffusé",s:"Même risque ; un bilan neutre, déjà habituel, reste possible.",todo:"Gardez le format et le rythme des années précédentes.",ref:"Code électoral, art. L. 52-1, al. 2 ; avis du déontologue",at:[[six,"warn"]]},
   {t:"Numéro d'appel gratuit",s:"Interdit au profit d'un candidat pendant la même période.",todo:"Suspendez-le, ou réservez-le aux demandes adressées à la permanence.",ref:"Code électoral, art. L. 50-1",at:[[six,"err"]]},
   {t:"Dépenses servant la campagne",s:"Elles entrent dans le compte de campagne, à payer par le mandataire.",todo:"Faites-les régler par le mandataire et gardez les justificatifs.",ref:"Code électoral, art. L. 52-4",at:[[six,"warn"]]},
   {t:"Messages et publications de propagande",s:"Plus aucun message de propagande, y compris sur les réseaux sociaux.",todo:`Programmez la dernière publication avant le ${fs(veille)} à zéro heure.`,ref:"Code électoral, art. L. 49",at:[[veille,"err"]]},
   {t:"Publication de sondages",s:"Interdite la veille et le jour du scrutin.",todo:"Ne relayez aucun sondage à partir de la veille, même publié ailleurs.",ref:"Loi du 19 juillet 1977, art. 11",at:[[veille,"err"]]},
   {t:"Activité parlementaire courante",s:"Questions, amendements, interventions : rien ne change.",todo:"Rien à changer.",ref:"",at:[]},
  ]};
}
const regime=(r,d)=>{let s="ok";for(const [dt,st] of r.at) if(d>=dt) s=st; return s};
const parse=v=>{if(!v) return null;const d=new Date(v+"T00:00");return isNaN(d)?null:d};
const store={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};

let E=parse(store.get("ce-el"))||new Date(2027,5,13); if(E<=TODAY) E=new Date(2027,5,13);
let R=rules(E), tab=store.get("ce-tab")||"today", custom=parse(store.get("ce-dx"));
const opened=new Set(); // lignes dépliées (par index)
const userOpen={};     // groupes ouverts ou fermés par l'utilisateur
$("#el").value=iso(E);

// moments : aujourd'hui, ouverture des six mois (si à venir), veille, jour du scrutin, autre date — 5 onglets au plus
function moments(){
  const m=[{k:"today",l:"Aujourd'hui",d:TODAY,ref:null}];
  if(R.six>TODAY) m.push({k:"six",l:"Six mois",d:R.six,ref:"today"});
  m.push({k:"veille",l:"Veille",d:R.veille,ref:R.six>TODAY?"six":"today"});
  m.push({k:"jour",l:"Scrutin",d:E,ref:"veille"});
  m.push({k:"other",l:"Autre date",d:null,ref:"today"});
  return m;
}
const mom=k=>moments().find(m=>m.k===k);
function dateOf(k){const m=mom(k);if(!m) return TODAY;if(k==="other") return custom&&custom>=TODAY&&custom<=E?custom:TODAY;return m.d}

function renderTabs(){
  if(!mom(tab)) tab="today";
  $("#tabs").innerHTML=moments().map(m=>`<button class="tab" role="tab" id="tab-${m.k}" data-k="${m.k}" aria-selected="${tab===m.k}" aria-controls="panel" tabindex="${tab===m.k?0:-1}">${m.l}<small>${m.d?fsh(m.d):(custom?fsh(dateOf("other")):"choisir")}</small></button>`).join("");
  $("#panel").setAttribute("aria-labelledby","tab-"+tab);
  updateArrows();
}
function renderPanel(){
  const m=mom(tab), X=dateOf(tab), refD=m.ref?dateOf(m.ref):null;
  $("#other").hidden=tab!=="other";
  if(tab==="other"){const dx=$("#dx");dx.min=iso(TODAY);dx.max=iso(E);if(!dx.value) dx.value=iso(X);
    $("#dxh").textContent=`Entre le ${fs(TODAY)} et le ${fs(E)}.`}
  const groups={err:[],warn:[],ok:[]};
  R.list.forEach((r,i)=>groups[regime(r,X)].push(i));
  const changed=refD?R.list.filter(r=>regime(r,refD)!==regime(r,X)).length:0;
  const refLab=m.ref==="today"?"aujourd'hui":m.ref==="six"?"l'ouverture des six mois":"la veille";
  $("#sum").innerHTML=`Au ${fs(X)}. <span>${refD&&+refD!==+X?(changed?`${changed} activité${changed>1?"s changent":" change"} de régime par rapport à ${refLab}.`:`Rien ne change par rapport à ${refLab}.`):"Point de départ."}</span>`;
  // Permis replié par défaut (divulgation progressive) ; l'utilisateur garde ses choix d'ouverture
  // groupes vides omis ; Permis replié sauf s'il est seul
  const shown=["err","warn","ok"].filter(s=>groups[s].length);
  $("#groups").innerHTML=shown.map(s=>{const ids=groups[s], isOpen=shown.length===1||(s in userOpen?userOpen[s]:s!=="ok");
    return `<details class="panel grp" data-s="${s}" ${isOpen?"open":""}><summary><span class="dot ${s}"></span>${LAB[s]} <span class="n">${ids.length}</span></summary>
      <div class="rows">${chunks(ids,X).map(([lab,is],_,all)=>(all.length>1||lab!==UNTIL?`<div class="sub">${lab}</div>`:"")+is.map(i=>row(i,X,refD)).join("")).join("")}</div></details>`}).join("");
  $("#how").innerHTML=`<li>Le scrutin a lieu en ${MONTHS[E.getMonth()]} ${E.getFullYear()}.</li><li>On remonte de six mois : ${MONTHS[R.six.getMonth()]} ${R.six.getFullYear()}.</li><li>La période s'ouvre le premier jour de ce mois, le ${fs(R.six)}, quel que soit le jour du scrutin.</li>`;
  $("#live").textContent=`${fs(X)} : ${groups.err.length} ${PL.err}, ${groups.warn.length} ${PL.warn}, ${groups.ok.length} ${PL.ok}.`;
}
// loi de Miller : au plus 7 lignes d'affilée ; on sous-groupe par date du prochain changement
const UNTIL="Jusqu'au scrutin";
const nextAt=(r,X)=>r.at.find(([dt])=>dt>X);
function chunks(ids,X){const m=new Map();
  ids.forEach(i=>{const nx=nextAt(R.list[i],X), k=nx?+nx[0]:Infinity;(m.get(k)||m.set(k,[]).get(k)).push(i)});
  return [...m.entries()].sort((a,b)=>a[0]-b[0]).map(([k,is])=>[k===Infinity?UNTIL:`Change le ${fs(new Date(k))}`,is]);
}
function row(i,X,refD){
  const r=R.list[i], s=regime(r,X), nx=r.at.find(([dt])=>dt>X), was=refD?regime(r,refD):s, op=opened.has(i);
  const parts=[];if(refD&&was!==s) parts.push(`<span class="tag">Nouveau</span> · était ${LAB[was].toLowerCase()}`);
  if(nx) parts.push(`devient ${LAB[nx[1]].toLowerCase()}`);
  const line=parts.join(" · ");
  return `<div class="row ${op?"open":""}" data-i="${i}">
    <button class="rh" aria-expanded="${op}" aria-controls="d${i}"><b>${r.t}</b><span class="chev" aria-hidden="true"></span>${line?`<i>${line}</i>`:""}</button>
    <div class="slide" id="d${i}"><div><div class="det">
      <div><div class="k">Pourquoi</div><p>${r.s}</p></div>
      <div><div class="k">Que faire</div><p class="todo">${r.todo}</p></div>
      ${r.ref?`<div><div class="k">Référence</div><p style="color:var(--muted)">${r.ref}</p></div>`:""}
    </div></div></div></div>`;
}
function renderLead(){
  const toSix=Math.round((R.six-TODAY)/DAY);
  $("#lead").innerHTML=toSix>0?`Dans ${toSix} jours, le ${fs(R.six)}, la période des six mois s'ouvre. <span>Choisissez un moment pour voir ce qui reste permis.</span>`
    :`La période des six mois est ouverte depuis le ${fs(R.six)}. <span>Choisissez un moment pour voir ce qui reste permis.</span>`;
  $("#elh").textContent=E.getDay()?`Le ${fs(E)} n'est pas un dimanche : vérifiez le décret de convocation.`:`Dimanche ${fs(E)}.`;
}
function renderAll(){renderLead();renderTabs();renderPanel();revealTab($("#tab-"+tab))}

// onglets : flèches gauche/droite, Début/Fin, activation automatique, tabindex itinérant
function selectTab(k,focus){
  tab=k;store.set("ce-tab",k);renderTabs();renderPanel();
  const b=$(`#tab-${k}`);if(focus) b.focus({preventScroll:true});revealTab(b);
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b) selectTab(b.dataset.k)});
$("#tabs").addEventListener("keydown",e=>{
  if(!["ArrowLeft","ArrowRight","Home","End"].includes(e.key)) return;
  e.preventDefault();const ks=moments().map(m=>m.k),i=ks.indexOf(tab);
  const j=e.key==="Home"?0:e.key==="End"?ks.length-1:(i+(e.key==="ArrowRight"?1:-1)+ks.length)%ks.length;
  selectTab(ks[j],true);
});
// garde l'onglet actif entièrement visible, hors des flèches (40 px)
function revealTab(b){const el=$("#tabs"),pad=44,l=b.offsetLeft,r=l+b.offsetWidth;
  if(l<el.scrollLeft+pad) el.scrollLeft=Math.max(0,l-pad); else if(r>el.scrollLeft+el.clientWidth-pad) el.scrollLeft=r-el.clientWidth+pad}
function updateArrows(){const el=$("#tabs");$("#al").classList.toggle("on",el.scrollLeft>0);$("#ar").classList.toggle("on",el.scrollLeft+el.clientWidth<el.scrollWidth-1)}
$("#tabs").addEventListener("scroll",updateArrows,{passive:true});
addEventListener("resize",updateArrows);
$("#al").onclick=()=>$("#tabs").scrollBy({left:-200,behavior:"smooth"});
$("#ar").onclick=()=>$("#tabs").scrollBy({left:200,behavior:"smooth"});

// lignes dépliables en place : Entrée/Espace (bouton natif), flèches haut/bas entre les en-têtes, Échap replie
function heads(){return $$("#groups summary, #groups .rh").filter(h=>h.offsetParent)}
$("#groups").addEventListener("click",e=>{const sm=e.target.closest("summary");if(sm){const g=sm.parentElement;userOpen[g.dataset.s]=!g.open;return}
  const h=e.target.closest(".rh");if(!h) return;
  const rw=h.closest(".row"),i=+rw.dataset.i,op=!rw.classList.contains("open");
  rw.classList.toggle("open",op);h.setAttribute("aria-expanded",op);op?opened.add(i):opened.delete(i)});
$("#groups").addEventListener("keydown",e=>{
  const h=e.target.closest("summary,.rh");
  if(h&&(e.key==="ArrowDown"||e.key==="ArrowUp")){e.preventDefault();const hs=heads(),i=hs.indexOf(h);const n=hs[i+(e.key==="ArrowDown"?1:-1)];n&&n.focus()}
  if(e.key==="Escape"){const rw=e.target.closest(".row.open");if(rw){e.stopPropagation();rw.querySelector(".rh").click();rw.querySelector(".rh").focus()}}
});

// formulaires : validation à la sortie du champ (jamais à la frappe), message « champ — cause — correction »
function fieldError(inp,errEl,msg){inp.toggleAttribute("aria-invalid",!!msg);if(msg) inp.setAttribute("aria-invalid","true");errEl.textContent=msg||""}
function commitScrutin(){
  const inp=$("#el"),v=parse(inp.value);
  if(!v){fieldError(inp,$("#ele"),"Date du scrutin incomplète : saisissez le jour, le mois et l'année.");return}
  if(v<=TODAY){fieldError(inp,$("#ele"),`Date du scrutin déjà passée : choisissez une date après le ${fs(TODAY)}.`);return}
  fieldError(inp,$("#ele"),"");
  if(+v===+E) return;
  const before=E;setScrutin(v);
  pushToast(`Scrutin du ${fs(E)} : période ouverte le ${fs(R.six)}.`,{label:"Annuler",run:()=>{setScrutin(before);$("#el").value=iso(before);fieldError($("#el"),$("#ele"),"");$("#el").focus()}});
}
function setScrutin(v){E=v;R=rules(E);store.set("ce-el",iso(E));$("#dx").value="";renderAll()}
$("#el").addEventListener("blur",commitScrutin);
$("#el").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();commitScrutin()}});
$("#el").addEventListener("input",()=>{if($("#ele").textContent&&parse($("#el").value)>TODAY) fieldError($("#el"),$("#ele"),"")});
function commitOther(){
  const inp=$("#dx"),v=parse(inp.value);
  if(!v){fieldError(inp,$("#dxe"),"Date à examiner incomplète : saisissez le jour, le mois et l'année.");return}
  if(v<TODAY||v>E){fieldError(inp,$("#dxe"),`Date à examiner hors période : choisissez entre le ${fs(TODAY)} et le ${fs(E)}.`);return}
  fieldError(inp,$("#dxe"),"");custom=v;store.set("ce-dx",iso(v));renderTabs();renderPanel();
}
$("#dx").addEventListener("blur",commitOther);
$("#dx").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();commitOther()}});

// toasts : role=status (succès), 5 s puis disparition, 3 au plus, bouton de fermeture visible, Échap ferme le toast focalisé
function pushToast(msg,action){
  const box=$("#toasts");while(box.children.length>=3) box.firstElementChild.remove();
  const t=document.createElement("div");t.className="ts";t.setAttribute("role","status");t.setAttribute("aria-live","polite");
  t.innerHTML=`<p>${esc(msg)}</p>${action?`<button class="act">${action.label}</button>`:""}<button class="x" aria-label="Fermer la notification">×</button>`;
  const kill=()=>{t.classList.add("out");setTimeout(()=>t.remove(),200)};
  t.querySelector(".x").onclick=kill;
  if(action) t.querySelector(".act").onclick=()=>{action.run();kill()};
  t.addEventListener("keydown",e=>{if(e.key==="Escape"){e.stopPropagation();kill();$("#el").focus()}});
  let tm=setTimeout(kill,5000);
  const hold=()=>clearTimeout(tm), go=()=>{clearTimeout(tm);tm=setTimeout(kill,5000)};
  t.addEventListener("mouseenter",hold);t.addEventListener("mouseleave",go);t.addEventListener("focusin",hold);t.addEventListener("focusout",go);
  box.append(t);
}

renderAll();
</script>

<title>Programme 135 · onglets</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0a0b0d; --s1:#111316; --s2:#171a1e; --line:#22252a; --line2:#2d3137;
  --fg:#f3f5f7; --text:#cfd5dd; --muted:#8a919b; --dim:#5d636c;
  --ins:#8ab4ff; --del:#e5484d; --accent:#6e7bf2; --lit:rgba(110,123,242,.16);
  --ok:#46b37e; --warn:#e3a33f; --err:#e5484d;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.25,.8,.25,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.narrow{max-width:780px}
.ctx{font-size:12.5px;color:var(--dim)}
h1{margin:3px 0 0;font:600 19px/1.3 var(--f);color:var(--fg);letter-spacing:-.012em;text-wrap:balance}
.lead{margin:14px 0 18px;max-width:780px;color:var(--fg);font-size:15.5px;line-height:1.55;text-wrap:pretty}
.lead span{color:var(--muted)}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:10px}
.sec{margin:18px 2px 8px;font-size:11.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.btn{border:1px solid var(--line2);background:var(--s2);color:var(--fg);border-radius:7px;padding:7px 12px;font-size:13px;cursor:pointer;transition:background .2s,opacity .2s;white-space:nowrap}
.btn:hover:not(:disabled){background:#1f2227}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover:not(:disabled){background:#7b87f5}
.btn:disabled{opacity:.4;cursor:default}
.ghost{border:1px solid var(--line2);background:none;color:var(--muted);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;transition:color .2s,background .2s}
.ghost:hover{color:var(--fg);background:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;color:var(--muted);font-size:12.5px;background:none;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip:hover{color:var(--fg)}
.chip.on{color:var(--fg);border-color:var(--accent);background:var(--lit)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
ins{color:var(--ins);text-decoration:underline 1px;text-underline-offset:3px;font-weight:500;background:none}
del{color:var(--dim);text-decoration:line-through 1px var(--del);background:none}
mark{background:var(--lit);color:var(--fg);border-radius:3px;padding:0 1px}
input[type=text],input[type=number],textarea,select{background:var(--s2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--fg);font-size:13px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--line2)}
.gp{display:inline-grid;place-items:center;min-width:24px;height:16px;padding:0 4px;border-radius:4px;color:#fff;font-size:9.5px;font-weight:600;vertical-align:1px;margin-right:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--s2);border:1px solid var(--line2);color:var(--fg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100vw - 32px);animation:rise .2s var(--ease)}
@keyframes rise{from{opacity:0;transform:translate(-50%,4px)}}
.slide{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.slide>div{min-height:0;overflow:hidden;opacity:0;transition:opacity .15s}
.open>.slide{grid-template-rows:1fr}
.open>.slide>div{opacity:1;transition:opacity .2s .12s}
.scrollx{overflow-x:auto;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const nf=(n,d=0)=>n.toLocaleString("fr-FR",{maximumFractionDigits:d,minimumFractionDigits:d});
function toast(m){$$(".toast").forEach(e=>e.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}
</script>

<style>
/* Variante « patterns » : onglets (3 volets, loi de Hick), cartes en petits multiples, tiroir latéral pour le détail,
   squelette au changement d'exercice, note de séance à réordonner (glisser-déposer + clavier), toasts empilés avec Annuler. */
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 20px;margin:16px 0 14px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;padding:3px;gap:2px;background:var(--s1)}
.seg button{border:0;background:none;color:var(--muted);border-radius:6px;padding:0 12px;min-height:36px;font-size:13px;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--s2);color:var(--fg)}
.seglb{display:block;font-size:11.5px;color:var(--dim);margin-bottom:4px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;color:var(--muted);padding:0 14px;min-height:44px;font-size:13.5px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .2s,border-color .2s}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .n{display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--s2);color:var(--muted);font-size:11px}
[role=tabpanel]{animation:fade .2s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(3px)}}
/* cartes */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{position:relative;background:var(--s1);border:1px solid var(--line);border-radius:10px;transition:border-color .2s,background .2s}
.card:hover{border-color:var(--line2)}
.card.drag{opacity:.45}
.card>button.open{display:grid;gap:10px;width:100%;height:100%;text-align:left;border:0;background:none;padding:14px 14px 12px;border-radius:10px;cursor:pointer;align-content:start}
.card .k{font-size:11.5px;color:var(--dim)}
.card b{display:block;color:var(--fg);font-weight:500;font-size:13.5px;line-height:1.4;padding-right:40px}
.card .val{display:flex;justify-content:space-between;align-items:end;gap:10px;font-size:12.5px;color:var(--muted)}
.card .val strong{color:var(--fg);font-size:17px;font-weight:500;display:block;line-height:1.2}
.card .val strong.miss{color:#f2a7a9}
.card .fl{display:flex;flex-wrap:wrap;gap:5px}
.add{position:absolute;top:6px;right:6px;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.add:hover{background:var(--s2);color:var(--fg)}
.add[aria-pressed="true"]{color:var(--ins)}
/* squelette : même forme que les cartes */
.sk{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.sk i{display:block;height:11px;border-radius:4px;background:linear-gradient(90deg,var(--s2),#1d2025,var(--s2));background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
/* note de séance */
.tray{position:sticky;top:16px;padding:14px;transition:border-color .2s,background .2s}
.tray.over{border-color:var(--accent);background:#14161c}
.tray h2{margin:0;font:500 13.5px/1.4 var(--f);color:var(--fg)}
.tray .sub{margin:2px 0 10px;font-size:12px;color:var(--dim)}
.tray ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tray li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:4px;background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:4px 4px 4px 2px;font-size:12.5px;color:var(--text);animation:fade .2s var(--ease)}
.tray li.drag{opacity:.4}
.tray li.tgt{border-color:var(--accent)}
.hdl{width:28px;height:36px;border:0;background:none;color:var(--dim);cursor:grab;border-radius:6px;display:grid;place-items:center}
.hdl:focus-visible{color:var(--fg)}
.tray li .t{line-height:1.4;padding:4px 2px}
.tray li .t span{color:var(--dim)}
.ib{width:32px;height:32px;border:0;background:none;color:var(--muted);border-radius:6px;cursor:pointer;display:inline-grid;place-items:center}
.ib:hover:not(:disabled){background:#22252b;color:var(--fg)}
.ib:disabled{opacity:.3;cursor:default}
.empty{border:1px dashed var(--line2);border-radius:8px;padding:16px 12px;font-size:12.5px;color:var(--dim);text-align:center;line-height:1.5}
.tray .hint{margin:10px 0 0;font-size:11.5px;color:var(--dim)}
/* crédits */
.panel.pad{padding:16px}
.panel.pad p{margin:0 0 12px;font-size:13px}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
details.more summary,.chgl summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:44px;color:var(--muted);font-size:13px}
details summary::-webkit-details-marker{display:none}
details summary svg{transition:transform .25s var(--ease);flex:none;color:var(--dim)}
details[open]>summary svg{transform:rotate(90deg)}
table.cp{border-collapse:collapse;width:100%;font-size:12.5px}
.cp th,.cp td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}
.cp th:first-child,.cp td:first-child{text-align:left}
.cp thead th{color:var(--dim);font-weight:400}
/* changements de maquette */
.chgl{display:grid;gap:8px}
.chgl details{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:0 14px}
.chgl summary{color:var(--text)}
.chgl summary b{color:var(--fg);font-weight:500}
.chgl .ba{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:0 0 14px 26px;font-size:13px}
.chgl .ba dt{color:var(--dim)}
.chgl .ba dd{margin:0}
/* tiroir */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--s1);border-left:1px solid var(--line2);z-index:41;transform:translateX(100%);transition:transform .3s var(--ease),opacity .2s;display:flex;flex-direction:column;opacity:0}
.drawer.on{transform:none;opacity:1}
.drawer header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.drawer header .k{font-size:12px;color:var(--dim)}
.drawer h2{margin:2px 0 0;font:600 16px/1.35 var(--f);color:var(--fg)}
.drawer .body{flex:1 1 auto;min-height:0;grid-auto-rows:max-content;overflow:auto;padding:14px 16px 20px;display:grid;gap:14px;align-content:start;scrollbar-width:thin}
.drawer footer{display:flex;gap:8px;justify-content:space-between;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.drawer footer .btn{min-height:44px}
.x{width:44px;height:44px;border:0;background:none;color:var(--muted);border-radius:8px;cursor:pointer;display:grid;place-items:center}
.x:hover{background:var(--s2);color:var(--fg)}
.def{font-size:13px;line-height:1.65;padding:10px 12px;background:var(--s2);border-radius:7px}
.def .lb{display:block;color:var(--dim);font-size:12px;margin-bottom:3px}
.note{margin:0;font-size:13px;line-height:1.6}
/* toasts empilés */
.toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;z-index:60;width:min(420px,calc(100vw - 32px))}
.tst{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--s2);border:1px solid var(--line2);border-radius:9px;padding:6px 6px 6px 14px;font-size:13px;color:var(--fg);box-shadow:0 8px 24px rgba(0,0,0,.4);animation:fade .2s var(--ease);transition:opacity .25s}
.tst.out{opacity:0}
.tst.ok{border-left:3px solid var(--ok)}
.tst button{border:0;background:none;color:var(--ins);font-weight:500;min-height:36px;padding:0 10px;border-radius:6px;cursor:pointer}
.tst button:hover{background:#22252b}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}.tray{position:static}}
@media (max-width:640px){
  .drawer{top:auto;left:0;width:100%;max-height:92vh;border-left:0;border-top:1px solid var(--line2);border-radius:14px 14px 0 0;transform:translateY(100%)}
}
</style>

<script>
/* ---------- Données (reprises de la maquette d'origine, fictives) ---------- */
const Y=[2021,2022,2023,2024,2025,2026,2027];
const NOW=2025; /* dernier rapport annuel de performances publié */
const OBJ={"1":"Accélérer la rénovation des logements privés","2":"Remettre sur le marché les logements vacants","3":"Mieux connaître le parc vacant"};
const IND=[
 {k:"1.1",t:"Délai moyen de paiement des aides à la rénovation",u:"jours",better:"low",
  r:[74,68,95,102,88,null,null],c:[60,60,60,75,75,80,80],
  flags:[["warn","Cible relâchée deux fois"],["err","Cible manquée 5 années sur 5"]],pap:["","Maintenu, cible inchangée (80 jours)"],
  note:"La cible est passée de 60 à 75 jours en 2024, puis à 80 jours en 2026, sans explication dans le PAP. Le réalisé n'a jamais atteint la cible initiale."},
 {k:"1.2",t:"Logements rénovés avec l'aide de l'Agence",u:"logements",better:"high",cut:2024,
  r:[640000,670000,569000,88000,96000,null,null],c:[600000,650000,700000,80000,100000,120000,110000],
  flags:[["warn","Série rompue en 2024"],["warn","Cible 2027 abaissée"]],pap:["warn","Cible abaissée de 120 000 à 110 000"],
  def:{old:"Nombre de logements ayant bénéficié d'une aide à la rénovation énergétique.",neu:"Nombre de logements ayant bénéficié d'une aide à la rénovation énergétique <ins>d'ampleur (gain d'au moins deux classes du diagnostic de performance énergétique)</ins>."},
  note:"Depuis 2024, seules les rénovations d'ampleur sont comptées : les valeurs avant et après ne se comparent pas. La cible 2027 (110 000) est inférieure à celle de 2026 (120 000)."},
 {k:"2.1",t:"Logements vacants remis sur le marché après aide",u:"%",better:"high",
  r:[null,null,31,34,36,null,null],c:[null,null,40,40,40,42,42],
  flags:[["err","Cible manquée 3 années sur 3"]],pap:["","Maintenu, cible inchangée (42 %)"],note:"Progression régulière, mais l'écart à la cible reste de 4 à 9 points."},
 {k:"2.2",t:"Coût moyen de l'aide par logement remis sur le marché",u:"€",better:"low",
  r:[null,8900,9400,10100,10800,null,null],c:[null,9000,9000,9500,10000,10500,null],
  flags:[["err","Supprimé dans le PAP 2027"]],pap:["err","Supprimé, sans remplaçant"],note:"L'indicateur disparaît alors que le coût a augmenté de 21 % depuis 2022. Aucun indicateur ne le remplace."},
 {k:"3.1",t:"Communes couvertes par un repérage des logements vacants",u:"%",better:"high",
  r:[null,null,null,null,null,null,null],c:[null,null,null,null,null,35,50],flags:[["","Nouveau en 2026, sans historique"]],pap:["","Maintenu, cible relevée de 35 à 50 %"],note:"Premier réalisé attendu dans le RAP 2026."},
];
/* crédits de paiement, M€ : [année, voté en loi de finances, exécuté] */
const CP=[[2021,650,640],[2022,700,690],[2023,760,702],[2024,820,755],[2025,880,801],[2026,910,null],[2027,845,null]];
const CHG=[
 {k:"2.2",sev:"err",kind:"Indicateur supprimé",t:"Plus aucun suivi du coût par logement remis sur le marché.",before:"2.2 · Coût moyen de l'aide par logement (cible 2026 : 10 500 €)",after:null},
 {k:"1.2",sev:"warn",kind:"Cible abaissée",t:"Logements rénovés : de 120 000 à 110 000.",before:"Cible : 120 000 logements (2026)",after:"Cible : 110 000 logements (2027)"},
 {k:"CP",sev:"warn",kind:"Crédits en baisse",t:"Crédits de paiement : −65 M€ (−7 %).",before:"910 M€ (LFI 2026)",after:"845 M€ (PLF 2027)"},
 {k:"3.1",sev:"",kind:"Cible relevée",t:"Repérage des logements vacants : de 35 à 50 %.",before:"Cible : 35 % (2026)",after:"Cible : 50 % (2027)"},
];
const IX=k=>IND.find(d=>d.k===k);

/* ---------- Mise en forme ---------- */
const fmtv=(v,u)=>v==null?"—":u==="%"?nf(v)+" %":u==="€"?nf(v)+" €":nf(v);
const unitTxt=(v,u)=>v==null?"—":u==="jours"?nf(v)+" jours":u==="logements"?nf(v)+" logements":fmtv(v,u);
function lastR(d,upto=9999){let o=null;d.r.forEach((v,i)=>{if(v!=null&&Y[i]<=upto)o=[v,i]});return o}
function hit(d,i){const r=d.r[i],c=d.c[i];if(r==null||c==null)return "";return (d.better==="low"?r<=c:r>=c)?"hit":"miss"}
function niceMax(v){if(v<=0)return 1;const p=10**Math.floor(Math.log10(v)),m=v/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p}
function fmtAxis(v,u){const s=v>=1e6?nf(v/1e6,1)+" M":v>=1e4?nf(v/1000)+" k":v>=1000?nf(v/1000,1)+" k":nf(v);return u==="%"?s+" %":u==="€"?s+" €":s}
function segs(d){if(!d.cut)return [[0,Y.length-1]];const c=Y.indexOf(d.cut);return [[0,c-1],[c,Y.length-1]]}

/* Graphique d'une série, toujours à partir de zéro.
   Une rupture de série donne deux panneaux, chacun avec son axe gradué : on ne relie jamais les deux définitions.
   o.W largeur réelle en px (pour que le texte reste lisible), o.H hauteur, o.upto dernière année de réalisé connue. */
function chart(d,o={}){
  const W=Math.max(240,Math.round(o.W||560)),H=o.H||190,upto=o.upto||9999;
  const padL=44,padT=d.cut?28:16,padB=24,gap=d.cut?18:0,S=segs(d);
  const band=(W-S.length*padL-gap*(S.length-1)-4)/Y.length;
  let x0=0,out="";
  const fut=Y.findIndex(y=>y>Math.min(upto,NOW));
  S.forEach(([a,b],si)=>{
    const vals=[];for(let i=a;i<=b;i++){if(d.c[i]!=null)vals.push(d.c[i]);if(d.r[i]!=null&&Y[i]<=upto)vals.push(d.r[i])}
    const mx=niceMax(Math.max(1,...vals)),px=x0+padL,pw=(b-a+1)*band;
    const X=i=>px+(i-a+.5)*band, Yv=v=>padT+(1-v/mx)*(H-padT-padB);
    /* zone des années sans réalisé (prévision) */
    if(fut>=0&&fut<=b){const f0=Math.max(fut,a);out+=`<rect x="${px+(f0-a)*band}" y="${padT-6}" width="${(b-f0+1)*band}" height="${H-padT-padB+6}" fill="rgba(255,255,255,.025)"/>`;
      if(si===S.length-1)out+=`<text x="${px+(f0-a)*band+4}" y="${padT-1}" class="cx">prévu</text>`}
    [0,.5,1].forEach(t=>{const yy=Yv(mx*t);out+=`<line x1="${px}" x2="${px+pw}" y1="${yy}" y2="${yy}" stroke="var(--line)" ${t?'stroke-dasharray="2 3"':""}/><text x="${px-6}" y="${yy+3.5}" text-anchor="end" class="cx">${fmtAxis(mx*t,d.u)}</text>`});
    for(let i=a;i<=b;i++)out+=`<text x="${X(i)}" y="${H-7}" text-anchor="middle" class="cx">${band<38?"’"+String(Y[i]).slice(2):Y[i]}</text>`;
    /* cible : pointillé + cercles vides */
    let p="";for(let i=a;i<=b;i++){if(d.c[i]==null)continue;p+=(i>a&&d.c[i-1]!=null?"L":"M")+X(i)+","+Yv(d.c[i])}
    out+=`<path d="${p}" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>`;
    for(let i=a;i<=b;i++)if(d.c[i]!=null)out+=`<circle cx="${X(i)}" cy="${Yv(d.c[i])}" r="3.4" fill="var(--s1)" stroke="var(--muted)" stroke-width="1.3"><title>Cible ${Y[i]} : ${fmtv(d.c[i],d.u)}</title></circle>`;
    /* réalisé : trait plein, point rouge si la cible est manquée */
    p="";for(let i=a;i<=b;i++){const v=d.r[i];if(v==null||Y[i]>upto)continue;p+=(i>a&&d.r[i-1]!=null&&Y[i-1]<=upto?"L":"M")+X(i)+","+Yv(v)}
    out+=`<path d="${p}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
    for(let i=a;i<=b;i++){const v=d.r[i];if(v==null||Y[i]>upto)continue;const h=hit(d,i);
      out+=`<circle cx="${X(i)}" cy="${Yv(v)}" r="3.6" fill="${h==="miss"?"var(--err)":"var(--accent)"}" stroke="var(--s1)" stroke-width="1.2"><title>Réalisé ${Y[i]} : ${fmtv(v,d.u)}${h==="miss"?" (cible manquée)":""}</title></circle>`}
    const L=lastR(d,upto);if(L&&L[1]>=a&&L[1]<=b)out+=`<text x="${X(L[1])}" y="${Yv(L[0])-9}" text-anchor="middle" class="cv">${fmtAxis(L[0],d.u)}</text>`;
    x0=px+pw+gap;
    if(si===0&&S.length>1){const cx=x0-gap/2;out+=`<line x1="${cx}" x2="${cx}" y1="0" y2="${H-padB}" stroke="var(--warn)" stroke-dasharray="3 3"/><text x="${cx+6}" y="10" class="cx" style="fill:#f0c27a">nouvelle définition en ${d.cut}</text>`}
  });
  return `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.t)} : réalisé et cibles de ${Y[0]} à ${Y[Y.length-1]}${d.cut?", série rompue en "+d.cut:""}">${out}</svg>`;
}
/* Mini-courbe : même règle (zéro en bas), sans texte. Une rupture coupe le trait et change d'échelle. */
function spark(d,W=150,H=36,upto=9999){
  const P=4,S=segs(d),band=(W-2*P)/(Y.length-1);let out="";
  S.forEach(([a,b])=>{const vals=[];for(let i=a;i<=b;i++){if(d.c[i]!=null)vals.push(d.c[i]);if(d.r[i]!=null&&Y[i]<=upto)vals.push(d.r[i])}
    const mx=niceMax(Math.max(1,...vals)),X=i=>P+i*band,Yv=v=>H-P-(v/mx)*(H-2*P);
    out+=`<line x1="${X(a)}" x2="${X(b)}" y1="${H-P}" y2="${H-P}" stroke="var(--line2)"/>`;
    for(let i=a;i<=b;i++)if(d.c[i]!=null)out+=`<circle cx="${X(i)}" cy="${Yv(d.c[i])}" r="2.2" fill="none" stroke="var(--muted)" stroke-width="1"/>`;
    let p="";for(let i=a;i<=b;i++){const v=d.r[i];if(v==null||Y[i]>upto)continue;p+=(i>a&&d.r[i-1]!=null?"L":"M")+X(i)+","+Yv(v)}
    out+=`<path d="${p}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/>`;
    const L=lastR(d,upto);if(L&&L[1]>=a&&L[1]<=b)out+=`<circle cx="${X(L[1])}" cy="${Yv(L[0])}" r="2.8" fill="var(--accent)"/>`});
  if(d.cut){const cx=P+(Y.indexOf(d.cut)-.5)*band;out+=`<line x1="${cx}" x2="${cx}" y1="0" y2="${H}" stroke="var(--warn)" stroke-dasharray="2 3"/>`}
  return `<svg class="sp" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${out}</svg>`;
}
/* Tableau des valeurs d'une série */
function table(d,upto=9999){
  return `<div class="scrollx"><table class="vt"><thead><tr><th></th>${Y.map(y=>`<th${d.cut===y?' class="cutc"':""}>${y}</th>`).join("")}</tr></thead><tbody>
   <tr><td>Cible</td>${d.c.map((v,i)=>`<td${d.cut===Y[i]?' class="cutc"':""}>${fmtv(v,d.u)}</td>`).join("")}</tr>
   <tr><td>Réalisé</td>${d.r.map((v,i)=>{const vv=Y[i]<=upto?v:null;return `<td class="${vv!=null?hit(d,i):""}${d.cut===Y[i]?" cutc":""}">${fmtv(vv,d.u)}</td>`}).join("")}</tr></tbody></table></div>`;
}
/* Barres crédits votés / exécutés, à l'échelle (zéro à gauche) */
function bars(mode="me"){

    return `<div class="bar"><span>${y}</span><span class="tr" title="${y} : voté ${v} M€${e!=null?", exécuté "+e+" M€":""}"><span class="v" style="width:${100*v/mx}%"></span>${e!=null?`<span class="e" style="width:${100*e/mx}%"></span>`:""}</span><span class="gap">${lab}</span></div>`}).join("")}</div>
   <div class="legend"><span><i style="background:var(--line2)"></i>Voté en loi de finances</span><span><i style="background:var(--accent)"></i>Exécuté</span><span class="dimv">Écart à droite</span></div>`;
}

/* --- toasts : trois au plus, le plus ancien part --- */
function say(msg,undo){const box=$("#toasts");while(box.children.length>=3)box.firstElementChild.remove();
  const t=document.createElement("div");t.className="tst ok";t.innerHTML=`<span>${esc(msg)}</span>${undo?"<button>Annuler</button>":""}`;box.append(t);
  const kill=()=>{t.classList.add("out");setTimeout(()=>t.remove(),250)};const tm=setTimeout(kill,5000);
  if(undo)t.querySelector("button").onclick=()=>{clearTimeout(tm);undo();kill()}}

/* --- note de séance --- */
function inNote(k){return S.note.includes(k)}
function addNote(k){if(inNote(k)){const i=S.note.indexOf(k);S.note.splice(i,1);renderNote();sync();say("Retiré de la note",()=>{S.note.splice(i,0,k);renderNote();sync()});return}
  S.note.push(k);renderNote();sync();say(`Ajouté à la note (${S.note.length})`,()=>{S.note=S.note.filter(x=>x!==k);renderNote();sync()})}
function renderNote(focusK){
  $("#tl").innerHTML=S.note.length?S.note.map((k,i)=>`<li draggable="true" data-n="${k}"><button class="hdl" aria-label="Déplacer « ${esc(LABEL[k])} », position ${i+1} sur ${S.note.length}" data-hdl="${k}"><svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="3" cy="3" r="1.3"/><circle cx="7" cy="3" r="1.3"/><circle cx="3" cy="7" r="1.3"/><circle cx="7" cy="7" r="1.3"/><circle cx="3" cy="11" r="1.3"/><circle cx="7" cy="11" r="1.3"/></svg></button>
   <span class="t"><span>${i+1}.</span> ${esc(LABEL[k])}</span>
   <span><button class="ib" data-mv="-1" data-k="${k}" ${i?"":"disabled"} aria-label="Monter">↑</button><button class="ib" data-mv="1" data-k="${k}" ${i<S.note.length-1?"":"disabled"} aria-label="Descendre">↓</button><button class="ib" data-rm="${k}" aria-label="Retirer">✕</button></span></li>`).join("")
   :`<li class="empty" style="display:block">Glissez une carte ici, ou utilisez le bouton + d'une carte.</li>`;
  $("#thint").hidden=S.note.length<2;
  if(focusK)$(`[data-hdl="${focusK}"]`)?.focus();
}
function move(k,dir){const i=S.note.indexOf(k),j=i+dir;if(j<0||j>=S.note.length)return;S.note.splice(i,1);S.note.splice(j,0,k);renderNote(k)}
function sync(){$$(".add").forEach(b=>{const on=inNote(b.dataset.add);b.setAttribute("aria-pressed",on);b.innerHTML=on?CHECK:PLUS;b.setAttribute("aria-label",(on?"Retirer de":"Ajouter à")+" la note : "+LABEL[b.dataset.add])});
  if(S.cur)$("#drAdd").textContent=inNote(S.cur)?"Retirer de la note":"Ajouter à la note"}

/* --- volets --- */
function renderTabs(){$("#tabs").innerHTML=TABS.map(([id,l,n])=>`<button role="tab" id="t-${id}" aria-controls="panel" aria-selected="${S.tab===id}" tabindex="${S.tab===id?0:-1}" data-tab="${id}">${l}${n?`<span class="n">${n}</span>`:""}</button>`).join("");$("#panel").setAttribute("aria-labelledby","t-"+S.tab)}
function card(d){const L=lastR(d,S.ex),h=L?hit(d,L[1]):"";
  return `<div class="card" draggable="true" data-card="${d.k}"><button class="open" data-open="${d.k}" aria-haspopup="dialog"><span class="k">Indicateur ${d.k}</span><b>${d.t}</b>${spark(d,210,40,S.ex)}
   <span class="val"><span>${L?`<strong class="${h}">${fmtv(L[0],d.u)}</strong>en ${Y[L[1]]}`:`<strong style="color:var(--muted);font-size:14px">Pas de réalisé</strong>avant le RAP 2026`}</span><span>${L&&d.c[L[1]]!=null?"cible "+fmtv(d.c[L[1]],d.u):""}</span></span>
   <span class="fl">${S.ex===2025?d.flags.map(([c,l])=>`<span class="flag ${c}">${l}</span>`).join(""):`<span class="flag">Vue du RAP ${S.ex}</span>`}</span></button>

function renderPanel(){

/* --- événements --- */

    say("Retiré de la note",()=>{S.note.splice(i,0,k);renderNote();sync();if(S.tab==="cp")renderPanel()});return}

document.addEventListener("keydown",e=>{
  if(!$("#dr").hidden&&S.cur){

    if(e.key==="Tab"){const f=[...$("#dr").querySelectorAll("button:not(:disabled),[tabindex='0'],summary")].filter(x=>x.offsetParent);const a=f[0],z=f[f.length-1];
      if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
    return}
  const tab=e.target.closest?.("[role=tab]");
  if(tab&&["ArrowLeft","ArrowRight","Home","End"].includes(e.key)){e.preventDefault();const i=TABS.findIndex(x=>x[0]===S.tab);
    const j=e.key==="Home"?0:e.key==="End"?TABS.length-1:(i+(e.key==="ArrowRight"?1:-1)+TABS.length)%TABS.length;S.tab=TABS[j][0];renderTabs();renderPanel();$("#t-"+S.tab).focus();return}

/* glisser-déposer : carte -> note (ajout), élément de note -> autre position (réordonner) */
let dragK=null,dragFrom=null;
document.addEventListener("dragstart",e=>{const c=e.target.closest?.("[data-card],[data-n]");if(!c)return;dragK=c.dataset.card||c.dataset.n;dragFrom=c.dataset.card?"card":"note";c.classList.add("drag");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",dragK)});
document.addEventListener("dragend",()=>{$$(".drag,.tgt").forEach(x=>x.classList.remove("drag","tgt"));$("#tray").classList.remove("over");dragK=null});
document.addEventListener("dragover",e=>{if(!dragK)return;const tr=e.target.closest?.("#tray");if(!tr)return;e.preventDefault();tr.classList.add("over");
  $$(".tgt").forEach(x=>x.classList.remove("tgt"));const li=e.target.closest("[data-n]");if(li&&dragFrom==="note")li.classList.add("tgt")});
document.addEventListener("dragleave",e=>{if(e.target===$("#tray"))$("#tray").classList.remove("over")});
document.addEventListener("drop",e=>{if(!dragK)return;const tr=e.target.closest?.("#tray");if(!tr)return;e.preventDefault();
  if(dragFrom==="card"){if(!inNote(dragK))addNote(dragK)}
  else{const li=e.target.closest("[data-n]");if(li&&li.dataset.n!==dragK){const to=S.note.indexOf(li.dataset.n);S.note=S.note.filter(x=>x!==dragK);S.note.splice(to,0,dragK);renderNote(dragK)}}});

$("#lead").innerHTML=`Quatre points à signaler. <span>Une série rompue, une cible relâchée deux fois, un indicateur supprimé, et 79 M€ votés mais non dépensés en 2025.</span>`;
renderEx();renderTabs();renderPanel();renderNote();sync();
</script>

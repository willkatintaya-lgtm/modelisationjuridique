<title>Frais de mandat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0a0b0d; --s1:#111316; --s2:#171a1e; --line:#22252a; --line2:#2d3137;
  --fg:#f3f5f7; --text:#cfd5dd; --muted:#8a919b; --dim:#5d636c;
  --ins:#8ab4ff; --del:#e5484d; --accent:#6e7bf2; --lit:rgba(110,123,242,.16);
  --ok:#46b37e; --warn:#e3a33f; --err:#e5484d;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.25,.8,.25,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.narrow{max-width:780px}
.ctx{font-size:12.5px;color:var(--dim)}
h1{margin:3px 0 0;font:600 19px/1.3 var(--f);color:var(--fg);letter-spacing:-.012em;text-wrap:balance}
.lead{margin:14px 0 18px;max-width:780px;color:var(--fg);font-size:15.5px;line-height:1.55;text-wrap:pretty}
.lead span{color:var(--muted)}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:10px}
.sec{margin:18px 2px 8px;font-size:11.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.btn{border:1px solid var(--line2);background:var(--s2);color:var(--fg);border-radius:7px;padding:7px 12px;font-size:13px;cursor:pointer;transition:background .2s,opacity .2s;white-space:nowrap}
.btn:hover:not(:disabled){background:#1f2227}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover:not(:disabled){background:#7b87f5}
.btn:disabled{opacity:.4;cursor:default}
.ghost{border:1px solid var(--line2);background:none;color:var(--muted);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;transition:color .2s,background .2s}
.ghost:hover{color:var(--fg);background:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;color:var(--muted);font-size:12.5px;background:none;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip:hover{color:var(--fg)}
.chip.on{color:var(--fg);border-color:var(--accent);background:var(--lit)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
ins{color:var(--ins);text-decoration:underline 1px;text-underline-offset:3px;font-weight:500;background:none}
del{color:var(--dim);text-decoration:line-through 1px var(--del);background:none}
mark{background:var(--lit);color:var(--fg);border-radius:3px;padding:0 1px}
input[type=text],input[type=number],textarea,select{background:var(--s2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--fg);font-size:13px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--line2)}
.gp{display:inline-grid;place-items:center;min-width:24px;height:16px;padding:0 4px;border-radius:4px;color:#fff;font-size:9.5px;font-weight:600;vertical-align:1px;margin-right:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--s2);border:1px solid var(--line2);color:var(--fg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100vw - 32px);animation:rise .2s var(--ease)}
@keyframes rise{from{opacity:0;transform:translate(-50%,4px)}}
.slide{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.slide>div{min-height:0;overflow:hidden;opacity:0;transition:opacity .15s}
.open>.slide{grid-template-rows:1fr}
.open>.slide>div{opacity:1;transition:opacity .2s .12s}
.scrollx{overflow-x:auto;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const nf=(n,d=0)=>n.toLocaleString("fr-FR",{maximumFractionDigits:d,minimumFractionDigits:d});
function toast(m){$$(".toast").forEach(e=>e.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}
</script>

<style>
/* Le relevé du compte dédié, ligne par ligne, rapproché des justificatifs : ce qui manque, ce qui pose question,
   et ce qu'il restera au 31 décembre. Une vérification avant de dépenser complète l'ensemble. */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tbl{padding:4px}
.ln{border-radius:8px}
.ln+.ln{border-top:1px solid var(--line)}
.lh{display:grid;grid-template-columns:62px minmax(0,1fr) 150px 96px;gap:12px;align-items:center;padding:10px 12px}
.lh .d{font-size:12px;color:var(--dim)}
.lh b{display:block;color:var(--fg);font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lh small{display:block;color:var(--dim);font-size:12px}
.lh .amt{text-align:right;color:var(--fg);font-size:13.5px}
.just{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);min-width:0}
.just span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.just .ghost{white-space:nowrap}
.pick{padding:0 12px 12px 86px;display:grid;gap:6px}
.pick button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;text-align:left;border:1px solid var(--line);background:none;border-radius:7px;padding:7px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;transition:border-color .2s,background .2s}
.pick button:hover{border-color:var(--line2);background:var(--s2)}
.pick b{color:var(--text);font-weight:500}
.pick .m{color:#7fd3a8}
.risk{padding:0 12px 12px 86px;font-size:12.5px;color:#f0c27a;line-height:1.55}
.side{display:grid;gap:14px;position:sticky;top:16px}
.card{padding:14px 16px}
.card h2{margin:0 0 2px;font:500 13.5px/1.4 var(--f);color:var(--fg)}
.card p{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.big{font-size:22px;font-weight:600;color:var(--fg);letter-spacing:-.01em}
svg.cv{display:block;width:100%;height:120px}
.ready{height:6px;border-radius:3px;background:var(--s2);overflow:hidden;margin:6px 0}
.ready i{display:block;height:100%;background:var(--ok);transition:width .4s var(--ease)}
.chk textarea{width:100%;min-height:62px;resize:vertical}
.ans{margin-top:8px;font-size:12.5px;line-height:1.55;color:var(--text);display:grid;grid-template-columns:12px minmax(0,1fr);gap:8px}
.ans .dot{margin-top:6px}
.ans small{display:block;color:var(--muted)}
@media (max-width:980px){ .grid{grid-template-columns:minmax(0,1fr)} .side{position:static} }
@media (max-width:560px){ .lh{grid-template-columns:minmax(0,1fr) 80px} .lh .d{grid-column:1} .lh .just{grid-column:1/-1} .lh>div:nth-child(2){grid-column:1} .pick,.risk{padding-left:12px} }
</style>

<div class="wrap">
  <div class="ctx">Avance de frais de mandat · exercice 2026 · relevé du compte dédié au 10 novembre (montants fictifs)</div>
  <h1>Frais de mandat</h1>
  <p class="lead" id="lead"></p>
  <div class="grid">
    <div><div class="filters" id="filters"></div><section class="panel tbl" id="tbl" aria-label="Relevé"></section></div>
    <aside class="side">
      <section class="panel card"><h2>Solde prévu au 31 décembre</h2><p id="solp"></p><div class="big" id="sol"></div><svg class="cv" id="cv" viewBox="0 0 320 120" preserveAspectRatio="none" aria-label="Dépenses cumulées et prévues"></svg></section>
      <section class="panel card"><h2>Dossier en cas de contrôle</h2><p id="readyp"></p><div class="ready"><i id="ready"></i></div></section>
      <section class="panel card chk"><h2>Avant de dépenser</h2><p>Décrivez la dépense envisagée.</p><textarea id="dep" aria-label="Dépense envisagée">Mise à jour de ma page Wikipédia par un prestataire</textarea><div id="ans"></div></section>
    </aside>
  </div>
</div>

<script>
const AN=70800, SPENT_BEFORE=48210; // dotation annuelle et dépenses de janvier à septembre
const L=[
 {d:"03/10",t:"Loyer de la permanence",r:"Permanence",a:1150,j:"bail-oct.pdf"},
 {d:"05/10",t:"SNCF · Paris – Villeneuve",r:"Déplacements",a:86.4,j:"sncf-0510.pdf"},
 {d:"08/10",t:"Imprimerie du Centre",r:"Communication",a:612,j:null},
 {d:"12/10",t:"Orange Pro",r:"Télécommunications",a:74.99,j:"orange-oct.pdf"},
 {d:"15/10",t:"Restaurant Le Relais",r:"Réception",a:148,j:null},
 {d:"21/10",t:"Meta Platforms · publicité",r:"Communication",a:300,j:"meta-oct.pdf",risk:"Contenu sponsorisé : éligible hors période pré-électorale. Les prochaines élections sont dans plus de six mois : rien à signaler aujourd'hui, mais à surveiller."},
 {d:"28/10",t:"Cotisation association des élus",r:"Divers",a:250,j:"asso.pdf",risk:"Cotisation à une association d'élus : éligible si l'association n'est pas un parti politique. Joindre ses statuts."},
 {d:"03/11",t:"Loyer de la permanence",r:"Permanence",a:1150,j:null},
 {d:"04/11",t:"Fnac · ordinateur portable",r:"Équipement",a:1299,j:"fnac-1104.pdf",diff:1249},
 {d:"06/11",t:"SNCF · Villeneuve – Paris",r:"Déplacements",a:86.4,j:null},
 {d:"07/11",t:"Cagnotte · soutien aux sinistrés",r:"Divers",a:200,j:null,risk:"Un don par le compte de l'avance n'est pas une dépense de mandat : à rembourser sur vos deniers personnels."},
];
const FILES=[{f:"imprimerie-1008.pdf",a:612,d:"08/10"},{f:"facture-relais-1510.pdf",a:148,d:"15/10"},{f:"bail-nov.pdf",a:1150,d:"03/11"},{f:"sncf-0611.pdf",a:86.4,d:"06/11"},{f:"scan-0947.jpg",a:null,d:"—"}];
const RECUR=[["Loyer de la permanence",1150],["Télécommunications",75],["Déplacements (moyenne)",480]];
let f=null, openPick=null;
const eur=v=>nf(v,v%1?2:0)+" €";
const status=l=>l.risk&&/rembourser/.test(l.risk)?"err":!l.j?"miss":l.diff?"diff":l.risk?"warn":"ok";
const SL={miss:"Sans justificatif",diff:"Montant différent",warn:"À vérifier",err:"Non éligible",ok:"Justifié"};
function render(){
  const st=L.map(status), c=k=>st.filter(s=>s===k).length;
  const spent=SPENT_BEFORE+L.reduce((s,l)=>s+l.a,0), rec=RECUR.reduce((s,r)=>s+r[1],0), months=1.7, proj=spent+rec*months, sol=AN-proj;
  $("#lead").innerHTML=`${c("miss")} ligne${c("miss")>1?"s":""} sans justificatif, ${c("err")} dépense non éligible, ${c("diff")} montant à corriger. <span>Solde prévu au 31 décembre : ${eur(Math.round(sol))}.</span>`;
  $("#filters").innerHTML=`<button class="chip ${f==null?"on":""}" data-f="">Tout · ${L.length}</button>`+["err","miss","diff","warn","ok"].filter(k=>c(k)).map(k=>`<button class="chip ${f===k?"on":""}" data-f="${k}"><span class="dot ${k==="ok"?"ok":k==="warn"||k==="diff"?"warn":"err"}"></span>${SL[k]} · ${c(k)}</button>`).join("");
  $("#tbl").innerHTML=L.map((l,i)=>({l,i,s:st[i]})).filter(x=>f==null||x.s===f).map(({l,i,s})=>{
    const cand=FILES.filter(F=>!L.some(x=>x.j===F.f)).map(F=>({F,score:(F.a===l.a?2:0)+(F.d===l.d?1:0)})).sort((a,b)=>b.score-a.score);
    return `<div class="ln"><div class="lh"><span class="d">${l.d}</span><div><b>${l.t}</b><small>${l.r}</small></div>
      <span class="just"><span class="dot ${s==="ok"?"ok":s==="warn"||s==="diff"?"warn":"err"}"></span>${s==="err"?`<span style="color:#f2a7a9">À rembourser</span>`:l.j?`<span title="${l.j}">${s==="diff"?`Facture : ${eur(l.diff)}`:l.j}</span>`:`<button class="ghost" data-pick="${i}">Rattacher</button>`}</span>
      <span class="amt">${eur(l.a)}</span></div>
      ${openPick===i?`<div class="pick">${cand.map(({F,score})=>`<button data-att="${i}" data-file="${F.f}"><span><b>${F.f}</b> · ${F.d}</span><span class="${score>=2?"m":""}">${F.a?eur(F.a):"montant illisible"}${score>=3?" · même date et montant":score>=2?" · même montant":""}</span></button>`).join("")}</div>`:""}
      ${l.risk&&s!=="ok"?`<div class="risk" ${s==="err"?'style="color:#f2a7a9"':""}>${l.risk}</div>`:""}
      ${s==="diff"?`<div class="risk">Le relevé indique ${eur(l.a)}, la facture ${eur(l.diff)} : un écart de ${eur(l.a-l.diff)} (frais de livraison ?). Joignez le bon de commande.</div>`:""}</div>`}).join("")||`<div style="padding:16px;color:var(--dim);font-size:13px">Rien dans cette catégorie.</div>`;
  $("#solp").textContent=`Dépenses récurrentes projetées : ${RECUR.map(r=>r[0].toLowerCase()).join(", ")}.`;
  $("#sol").textContent=eur(Math.round(sol));
  // courbe : cumul réel jusqu'à début novembre, projection pointillée, plafond annuel
  const X=m=>10+m*(300/12), Yv=v=>110-100*v/AN;
  const pts=[[0,0],[3,15600],[6,32100],[9,SPENT_BEFORE],[10.3,spent]], pj=[[10.3,spent],[12,proj]];
  const path=a=>a.map(([m,v],k)=>`${k?"L":"M"}${X(m)},${Yv(v)}`).join("");
  $("#cv").innerHTML=`<line x1="10" x2="310" y1="${Yv(AN)}" y2="${Yv(AN)}" stroke="var(--line2)" stroke-dasharray="3 3"/><text x="310" y="${Yv(AN)-4}" text-anchor="end" font-size="9" fill="var(--dim)">dotation ${eur(AN)}</text>
   <path d="${path(pts)}" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="${path(pj)}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3" opacity=".7"/>
   <circle cx="${X(12)}" cy="${Yv(proj)}" r="3" fill="var(--accent)"/><text x="12" y="118" font-size="9" fill="var(--dim)">janv.</text><text x="308" y="118" text-anchor="end" font-size="9" fill="var(--dim)">déc.</text>`;
  const ok=st.filter(s=>s==="ok"||s==="warn").length;
  $("#readyp").textContent=`${ok} lignes sur ${L.length} ont leur pièce et un montant concordant pour octobre et novembre.`;
  $("#ready").style.width=Math.round(100*ok/L.length)+"%";
}
const RULES=[
 [/wikip|e-réputation|référencement/i,"err","Non éligible","Le déontologue proscrit la rémunération d'une modification de page Wikipédia ou d'une gestion d'e-réputation."],
 [/cagnotte|don |dons|soutien financier/i,"err","Non éligible","Un don n'est pas une dépense liée au mandat."],
 [/sponsoris|publicité|boost/i,"warn","Éligible, sauf en période pré-électorale","Interdit dans les six mois précédant une élection à laquelle vous êtes candidate."],
 [/vêtement|costume|coiffeur/i,"err","Non éligible","Dépense personnelle."],
 [/restaurant|repas|déjeuner|dîner/i,"warn","Éligible si lié au mandat","Conservez la liste des convives et l'objet de la rencontre."],
 [/loyer|permanence|bureau|ordinateur|téléphone|train|sncf|imprim/i,"ok","Éligible","Conservez la facture au nom de la députée."],
];
function check(){const v=$("#dep").value;const r=RULES.find(([re])=>re.test(v));$("#ans").innerHTML=r?`<div class="ans"><span class="dot ${r[1]}"></span><span>${r[2]}<small>${r[3]}</small></span></div>`:v.trim()?`<div class="ans"><span class="dot"></span><span>Pas de règle connue<small>En cas de doute, saisissez le déontologue avant d'engager la dépense.</small></span></div>`:"";}
document.addEventListener("click",e=>{
  const ch=e.target.closest("[data-f]"); if(ch){f=ch.dataset.f||null;render();return}
  const p=e.target.closest("[data-pick]"); if(p){openPick=openPick===+p.dataset.pick?null:+p.dataset.pick;render();return}
  const a=e.target.closest("[data-att]"); if(a){const l=L[+a.dataset.att],F=FILES.find(x=>x.f===a.dataset.file);l.j=F.f;if(F.a&&F.a!==l.a)l.diff=F.a;openPick=null;render();toast(`${F.f} rattaché.`)}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(openPick!=null){openPick=null;render()}else if(f){f=null;render()}}});
$("#dep").addEventListener("input",check);
render(); check();
</script>

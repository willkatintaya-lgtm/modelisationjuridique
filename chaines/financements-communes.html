<title>Subventions des communes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0a0b0d; --s1:#111316; --s2:#171a1e; --line:#22252a; --line2:#2d3137;
  --fg:#f3f5f7; --text:#cfd5dd; --muted:#8a919b; --dim:#5d636c;
  --ins:#8ab4ff; --del:#e5484d; --accent:#6e7bf2; --lit:rgba(110,123,242,.16);
  --ok:#46b37e; --warn:#e3a33f; --err:#e5484d;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.25,.8,.25,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.narrow{max-width:780px}
.ctx{font-size:12.5px;color:var(--dim)}
h1{margin:3px 0 0;font:600 19px/1.3 var(--f);color:var(--fg);letter-spacing:-.012em;text-wrap:balance}
.lead{margin:14px 0 18px;max-width:780px;color:var(--fg);font-size:15.5px;line-height:1.55;text-wrap:pretty}
.lead span{color:var(--muted)}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:10px}
.sec{margin:18px 2px 8px;font-size:11.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.btn{border:1px solid var(--line2);background:var(--s2);color:var(--fg);border-radius:7px;padding:7px 12px;font-size:13px;cursor:pointer;transition:background .2s,opacity .2s;white-space:nowrap}
.btn:hover:not(:disabled){background:#1f2227}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover:not(:disabled){background:#7b87f5}
.btn:disabled{opacity:.4;cursor:default}
.ghost{border:1px solid var(--line2);background:none;color:var(--muted);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;transition:color .2s,background .2s}
.ghost:hover{color:var(--fg);background:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;color:var(--muted);font-size:12.5px;background:none;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip:hover{color:var(--fg)}
.chip.on{color:var(--fg);border-color:var(--accent);background:var(--lit)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
ins{color:var(--ins);text-decoration:underline 1px;text-underline-offset:3px;font-weight:500;background:none}
del{color:var(--dim);text-decoration:line-through 1px var(--del);background:none}
mark{background:var(--lit);color:var(--fg);border-radius:3px;padding:0 1px}
input[type=text],input[type=number],textarea,select{background:var(--s2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--fg);font-size:13px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--line2)}
.gp{display:inline-grid;place-items:center;min-width:24px;height:16px;padding:0 4px;border-radius:4px;color:#fff;font-size:9.5px;font-weight:600;vertical-align:1px;margin-right:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--s2);border:1px solid var(--line2);color:var(--fg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100vw - 32px);animation:rise .2s var(--ease)}
@keyframes rise{from{opacity:0;transform:translate(-50%,4px)}}
.slide{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.slide>div{min-height:0;overflow:hidden;opacity:0;transition:opacity .15s}
.open>.slide{grid-template-rows:1fr}
.open>.slide>div{opacity:1;transition:opacity .2s .12s}
.scrollx{overflow-x:auto;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const nf=(n,d=0)=>n.toLocaleString("fr-FR",{maximumFractionDigits:d,minimumFractionDigits:d});
function toast(m){$$(".toast").forEach(e=>e.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}
</script>

<style>
/* Chaque commune de la circonscription face aux communes de même taille du département :
   un point (ce qu'elle a obtenu par habitant), un repère (la médiane de sa strate). Les plus éloignées d'abord. */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.filters .sp{flex:1}
.filters select{padding:5px 8px;font-size:12.5px}
.tbl{padding:4px}
.hd,.c{display:grid;grid-template-columns:minmax(0,180px) 80px minmax(0,1fr) 110px 14px;gap:14px;align-items:center;padding:9px 12px}
.hd{font-size:11.5px;color:var(--dim);letter-spacing:.03em;text-transform:uppercase;padding-top:10px;padding-bottom:6px}
.c{width:100%;border:0;background:none;text-align:left;border-radius:8px;cursor:pointer;color:var(--text);transition:background .2s}
.cw+.cw{border-top:1px solid var(--line)}
.c:hover{background:var(--s2)}
.c b{display:block;color:var(--fg);font-weight:500;font-size:13.5px}
.c small{display:block;color:var(--dim);font-size:12px}
.c .pop{font-size:12.5px;color:var(--muted);text-align:right}
.strip{position:relative;height:22px}
.strip .ax{position:absolute;left:0;right:0;top:10px;height:2px;background:var(--line);border-radius:1px}
.strip .med{position:absolute;top:3px;width:2px;height:16px;background:var(--muted);border-radius:1px}
.strip .pt{position:absolute;top:5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--s1)}
.strip .pt.zero{background:none;border:2px solid var(--err)}
.strip .gap{position:absolute;top:10px;height:2px;background:rgba(229,72,77,.5)}
.v{text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap}
.v b{display:inline;font-size:13.5px}
.v .lo{color:#f2a7a9} .v .hi{color:#7fd3a8}
.chev{color:var(--dim);transition:transform .3s var(--ease)}
.cw.open .chev{transform:rotate(90deg)}
.det{padding:0 12px 14px 206px;display:grid;gap:6px}
.pj{display:grid;grid-template-columns:44px minmax(0,1fr) 90px 80px;gap:10px;font-size:12.5px;color:var(--text);padding:5px 0;border-top:1px solid var(--line)}
.pj span:first-child{color:var(--dim)}
.pj .f{color:var(--muted)}
.pj .m{text-align:right}
.none{font-size:12.5px;color:#f0c27a}
.legend{display:flex;gap:16px;margin:10px 2px 0;font-size:12px;color:var(--dim);flex-wrap:wrap}
.legend i{display:inline-block;vertical-align:-2px;margin-right:6px}
@media (max-width:760px){ .hd{display:none} .c{grid-template-columns:minmax(0,1fr) 96px 14px} .c .pop{display:none} .c .strip{grid-column:1/-1;grid-row:2} .det{padding-left:12px} .pj{grid-template-columns:40px minmax(0,1fr) 70px} .pj .f{display:none} }
</style>

<div class="wrap" style="max-width:1040px">
  <div class="ctx">DETR, DSIL et Fonds vert · projets financés de 2018 à 2025 · données de la DGCL (communes fictives)</div>
  <h1>Subventions des communes</h1>
  <p class="lead" id="lead"></p>
  <div class="filters" id="filters"></div>
  <section class="panel tbl" aria-label="Communes"><div class="hd"><span>Commune</span><span style="text-align:right">Habitants</span><span>Obtenu par habitant, face à la médiane des communes de même taille</span><span style="text-align:right">€ par habitant</span><span></span></div><div id="rows"></div></section>
  <div class="legend"><span><i class="dot" style="background:var(--accent)"></i>la commune</span><span><i style="display:inline-block;width:2px;height:12px;background:var(--muted)"></i>médiane de sa strate dans le département</span><span><i class="dot" style="background:none;border:2px solid var(--err);width:10px;height:10px"></i>aucun projet financé</span></div>
</div>

<script>
const STRATES=[{k:"<1000",l:"moins de 1 000 hab.",max:999,med:210},{k:"1000-3500",l:"1 000 à 3 500 hab.",max:3499,med:150},{k:"3500-10000",l:"3 500 à 10 000 hab.",max:9999,med:95},{k:">10000",l:"plus de 10 000 hab.",max:1e9,med:60}];
const C=[
 {n:"Villeneuve",p:24300,pj:[[2019,"DSIL","Rénovation thermique du groupe scolaire Jaurès",820000],[2021,"DETR","Voirie du quartier de la gare",410000],[2023,"Fonds vert","Renaturation des cours d'école",360000]]},
 {n:"Saint-Aubin",p:11800,pj:[[2020,"DETR","Extension de la médiathèque",290000]]},
 {n:"Les Ormes",p:6200,pj:[[2018,"DETR","Salle polyvalente",240000],[2022,"DSIL","Chaudière bois de l'école",180000],[2024,"Fonds vert","Éclairage public à LED",95000]]},
 {n:"Bréval",p:4100,pj:[]},
 {n:"Montfort",p:3900,pj:[[2023,"DETR","Accessibilité de la mairie",120000]]},
 {n:"La Chapelle-sur-Vire",p:2650,pj:[[2019,"DETR","Cantine scolaire",310000],[2021,"DETR","Église : toiture",160000],[2024,"Fonds vert","Haies et mares",42000]]},
 {n:"Garennes",p:1900,pj:[]},
 {n:"Saint-Martin-des-Prés",p:1450,pj:[[2022,"DETR","Atelier municipal",95000]]},
 {n:"Vernay",p:1120,pj:[[2020,"DETR","École : mise aux normes",190000],[2025,"DSIL","Maison de santé",260000]]},
 {n:"Le Mesnil",p:780,pj:[]},
 {n:"Ruelles",p:540,pj:[[2021,"DETR","Salle des fêtes",88000],[2024,"DETR","Voirie communale",64000]]},
 {n:"Hautbois",p:390,pj:[]},
 {n:"Foucarville",p:260,pj:[[2023,"Fonds vert","Désimperméabilisation de la place",58000]]},
];
const strate=p=>STRATES.find(s=>p<=s.max);
C.forEach(c=>{c.st=strate(c.p);c.tot=c.pj.reduce((s,x)=>s+x[3],0);c.ph=c.tot/c.p;c.ratio=c.ph/c.st.med});
let f="all", open=new Set(), sort="gap";
function render(){
  const zero=C.filter(c=>!c.pj.length), low=C.filter(c=>c.pj.length&&c.ratio<.5);
  $("#lead").innerHTML=`${zero.length} communes n'ont obtenu aucun financement depuis 2018, ${low.length} moins de la moitié de ce qu'obtiennent les communes de leur taille. <span>Ce sont souvent les plus petites, sans service technique pour monter les dossiers.</span>`;
  $("#filters").innerHTML=[["all","Toutes · "+C.length],["zero","Aucun projet · "+zero.length],["low","Moins de la moitié · "+low.length]].map(([k,l])=>`<button class="chip ${f===k?"on":""}" data-f="${k}">${l}</button>`).join("")+`<span class="sp"></span><select id="sort" aria-label="Trier"><option value="gap" ${sort==="gap"?"selected":""}>Les plus éloignées de leur strate</option><option value="pop" ${sort==="pop"?"selected":""}>Par population</option></select>`;
  let L=C.filter(c=>f==="all"||(f==="zero"?!c.pj.length:c.pj.length&&c.ratio<.5));
  L=[...L].sort(sort==="pop"?(a,b)=>b.p-a.p:(a,b)=>a.ratio-b.ratio||a.p-b.p);
  const MAX=Math.max(...C.map(c=>Math.max(c.ph,c.st.med)))*1.08, x=v=>Math.min(100,100*v/MAX);
  $("#rows").innerHTML=L.map(c=>`<div class="cw ${open.has(c.n)?"open":""}" data-n="${c.n}"><button class="c" aria-expanded="${open.has(c.n)}"><span><b>${c.n}</b><small>${c.st.l}</small></span><span class="pop">${nf(c.p)}</span>
    <span class="strip" aria-hidden="true"><span class="ax"></span>${c.ph<c.st.med?`<span class="gap" style="left:${x(c.ph)}%;width:${x(c.st.med)-x(c.ph)}%"></span>`:""}<span class="med" style="left:${x(c.st.med)}%"></span><span class="pt ${c.pj.length?"":"zero"}" style="left:${x(c.ph)}%"></span></span>
    <span class="v"><b class="${c.ratio<.5?"lo":c.ratio>1.2?"hi":""}">${nf(Math.round(c.ph))} €</b><br>médiane ${c.st.med} €</span>
    <svg class="chev" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg></button>
    <div class="slide"><div><div class="det">${c.pj.length?c.pj.map(p=>`<div class="pj"><span>${p[0]}</span><span>${p[2]}</span><span class="f">${p[1]}</span><span class="m">${nf(p[3])} €</span></div>`).join(""):`<p class="none">Aucun projet financé depuis 2018. La liste ne montre que les projets retenus : la commune a peut-être déposé des dossiers refusés. À vérifier auprès de la préfecture avant de l'appeler.</p>`}</div></div></div></div>`).join("");
}
document.addEventListener("click",e=>{
  const ch=e.target.closest("[data-f]"); if(ch){f=ch.dataset.f;render();return}
  const b=e.target.closest(".c"); if(b){const w=b.parentElement,n=w.dataset.n;open.has(n)?open.delete(n):open.add(n);w.classList.toggle("open");b.setAttribute("aria-expanded",open.has(n))}
});
document.addEventListener("change",e=>{if(e.target.id==="sort"){sort=e.target.value;render()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(open.size){open.clear();render()}else if(f!=="all"){f="all";render()}}});
render();
</script>

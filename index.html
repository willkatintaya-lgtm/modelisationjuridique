<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boussole des amendements</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Scène 2D : des feuilles dans un espace sombre. Plusieurs interfaces dans un même espace : les mêmes feuilles, rangées
   autrement (poignée du bas). Dans chaque rangement, trois gestes : haut/bas = parcourir ; gauche/droite = volet voisin ;
   pincer/clic = échelle, un cran à la fois. */
:root{
  --bg:#0b0d12; --bg-2:#11141b; --fg:#e8e6df; --muted:#8a8f9b; --accent:#d9b56a; --accent-soft:rgba(217,181,106,.28); --line:#232733; --line-2:#2f3443;
  --paper:#f4f1e9; --paper-2:#e9e4d8; --paper-ink:#1d1a16; --paper-muted:#6b6457; --paper-line:#c9bfa6; --paper-frame:#ece7db;
  --f-ui:"IBM Plex Sans",system-ui,sans-serif; --f-legal:"Source Serif 4",Georgia,serif;
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
  --ease:cubic-bezier(.2,.8,.2,1);
  --ins:#1d4f91; --del:#a8452f; --stamp:#8c2f22;
  --top:46px; --bottom:76px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden;font-size:14px}
button{font-family:inherit}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 40%, #151924 0%, var(--bg) 60%),var(--bg)}
#stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;opacity:.25;
  mask-image:radial-gradient(ellipse at 50% 55%, #000 20%, transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 55%, #000 20%, transparent 75%)}

/* --- barre du haut : le dossier, la référence, le coffre, les directions --- */
#topbar{position:absolute;z-index:20;top:0;left:0;right:0;height:var(--top);display:flex;align-items:center;gap:14px;padding:0 var(--gutter-r) 0 var(--gutter-l);
  font-size:12px;color:var(--muted);background:linear-gradient(rgba(11,13,18,.92),rgba(11,13,18,.6));border-bottom:1px solid var(--line)}
#topbar .dossier{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
#topbar .dossier b{color:var(--fg);font-weight:500}
#refInfo b{color:var(--accent);font-weight:500}
.coffre{display:flex;align-items:center;gap:6px;flex:none;border:1px dashed #3d4354;border-radius:999px;padding:3px 4px 3px 10px;transition:border-color .2s}
.coffre.hide{display:none}
.coffre.flash{animation:flash .5s}
@keyframes flash{0%,100%{border-color:#3d4354}40%{border-color:var(--del)}}
.coffre-t{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.coffre-t b{color:var(--fg);font-weight:500}
.pastille{display:inline-flex;align-items:center;gap:6px;font:500 11.5px var(--f-ui);color:var(--fg);background:#1a1e28;border:1px solid var(--line-2);border-radius:999px;padding:3px 4px 3px 9px;animation:drop .35s var(--ease)}
@keyframes drop{from{transform:translateY(-8px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.pastille i{width:7px;height:7px;border-radius:50%;background:var(--g)}
.pastille button{border:0;background:none;color:var(--muted);font:400 14px/1 var(--f-ui);cursor:pointer;padding:0 3px}
.pastille button:hover{color:var(--fg)}
.tiroir-b,#dirBtn{font:500 11.5px var(--f-ui);color:var(--muted);background:none;border:1px solid var(--line-2);border-radius:999px;padding:4px 10px;cursor:pointer}
.tiroir-b:hover,#dirBtn:hover,.tiroir-b:focus-visible,#dirBtn:focus-visible{color:var(--fg);border-color:var(--accent);outline:none}
.btn{font:500 13px var(--f-ui);letter-spacing:.04em;color:var(--fg);background:rgba(11,13,18,.75);border:1px solid var(--accent);border-radius:999px;padding:9px 20px;cursor:pointer;backdrop-filter:blur(6px)}
.btn.sm{padding:4px 12px;font-size:11.5px}
.btn:hover,.btn:focus-visible{background:rgba(217,181,106,.16);outline:none}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line-2)}

/* --- la poignée du bas : les rangements (plusieurs interfaces, un même espace) --- */
#rangements{position:absolute;z-index:20;left:50%;bottom:env(safe-area-inset-bottom,0px);transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:7px 14px 8px;
  background:rgba(11,13,18,.78);border:1px solid var(--line-2);border-bottom:0;border-radius:12px 12px 0 0;backdrop-filter:blur(6px);max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
#rangements::-webkit-scrollbar{display:none}
#rangements button{flex:none;font:500 12px var(--f-ui);letter-spacing:.06em;color:var(--muted);background:none;border:0;border-radius:6px;padding:5px 9px;cursor:pointer;white-space:nowrap}
#rangements button:hover,#rangements button:focus-visible{color:var(--fg);outline:none;background:rgba(255,255,255,.04)}
#rangements button.on{color:var(--accent);font-weight:600;letter-spacing:.1em}
#rangements .dot{color:#3d4354}

/* --- matière papier, partagée par toutes les feuilles --- */
.paper{background:linear-gradient(135deg,var(--paper),var(--paper-2));color:var(--paper-ink);border:1px solid var(--paper-line);outline:14px solid var(--paper-frame);outline-offset:-14px;
  box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(217,181,106,.25)}
.paper .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-muted);border-bottom:1px solid var(--paper-line);padding-bottom:8px}
.paper .head .hr{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 10px;justify-content:flex-end}
.paper .lead{font:italic 400 15px var(--f-legal);color:var(--paper-muted);margin:4px 0 0}
.paper .lead small{font-style:normal;font-size:12px}
.paper .body{font:400 clamp(16px,1.9vw,21px)/1.5 var(--f-legal);max-width:72ch}
.paper .body p{margin:0}
.paper .none{font-style:italic;color:var(--paper-muted)}
.group-badge{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex-wrap:wrap}
.group-badge i{width:8px;height:8px;border-radius:50%;background:var(--g);display:inline-block;flex:none}
.group-badge .name{font:600 clamp(16px,1.8vw,20px)/1.2 var(--f-legal);color:var(--paper-ink);letter-spacing:0;text-transform:none;white-space:normal}
.group-badge small{font:400 11px var(--f-ui);letter-spacing:.04em;text-transform:none;color:var(--paper-muted)}
.group-badge.inst i{border-radius:1px;width:10px;height:10px}
.lc .group-badge .name,.bcol .group-badge .name,.titem .group-badge .name{font-size:16px}
/* unités de sens nées du débat : un filet doré, plus marqué quand il y a plus de propositions (le gras est réservé aux ajouts) */
.paper mark.pt{color:inherit;background:none;box-shadow:inset 0 -1.5px 0 rgba(217,181,106,.95);cursor:pointer;transition:background .2s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.paper mark.pt.w2{box-shadow:inset 0 -2.5px 0 rgba(217,181,106,.95)}
.paper mark.pt.w3{box-shadow:inset 0 -4px 0 rgba(217,181,106,.95)}
.paper mark.pt:hover{background:rgba(217,181,106,.24)}
/* écart avec la référence, toujours porté sur la rédaction comparée (la référence reste vierge) */
.paper ins{color:var(--ins);font-weight:600;text-decoration:underline 1.5px;text-underline-offset:3px;background:none}
.paper del{color:#7d7466;text-decoration:line-through 1.5px var(--del);background:none}
.paper ins[data-h],.paper del[data-h]{cursor:zoom-in;border-radius:2px;transition:background .2s}
.paper ins[data-h]:hover,.paper del[data-h]:hover{background:rgba(29,79,145,.09)}

/* --- la vue : un calque par rangement / volet / échelle --- */
#view{position:absolute;inset:0}
.layer{position:absolute;inset:0;padding:calc(var(--top) + 48px) var(--gutter-r) calc(var(--bottom) + 34px) var(--gutter-l);display:flex;flex-direction:column;align-items:center;justify-content:center}
.layer.leaving{pointer-events:none}
.layer.has-html{justify-content:flex-start}
.pile-title{position:absolute;top:calc(var(--top) + 30px);left:var(--gutter-l);right:var(--gutter-r);z-index:2;margin:0;text-align:center;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;line-height:1.6}
.pile-title b{color:var(--fg);font-weight:500}
.ordb{font:500 10.5px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:none;border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;cursor:pointer}
.ordb.on{color:var(--accent);border-color:var(--accent)}

/* --- la pile : un tambour de feuilles --- */
.drum{position:relative;width:100%;flex:none;perspective:1600px}
.face{position:absolute;top:0;left:0;right:0;margin:0 auto;width:min(880px,100%);max-height:calc(100dvh - var(--top) - var(--bottom) - 120px);
  touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform,opacity;display:grid;grid-template-rows:minmax(0,1fr)}
.recto,.verso{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px;padding:30px 40px 24px;min-height:0;position:relative}
.verso{grid-template-rows:auto minmax(0,1fr)}
.recto[hidden],.verso[hidden]{display:none}
.face.flipped{background:linear-gradient(135deg,#efebe1,#e3ddcf)}
.face:not(.cur){cursor:pointer}
.face.editing{user-select:text;-webkit-user-select:text;box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 0 2px var(--accent)}
.face .body{overflow:auto;min-height:0;scrollbar-width:none}
.face .body::-webkit-scrollbar{display:none}
.face.al.cur .recto .body{cursor:text}
.sheet .foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px 12px;align-items:center;min-height:30px}
.sheet .foot>span:first-child{margin-right:auto;font-size:11.5px;color:#8a8070;max-width:60ch}
.sheet .foot .count{font-size:11px;letter-spacing:.08em;color:var(--paper-muted);white-space:nowrap}
.sheet button{font:500 12.5px var(--f-ui);border-radius:4px;padding:5px 12px;cursor:pointer;border:1px solid #a89c80;background:transparent;color:#4a4336}
.sheet button.primary{background:#2a2620;color:var(--paper);border-color:#2a2620}
.sheet button:focus-visible{outline:2px solid #2a2620;outline-offset:2px}
.vline{display:grid;grid-template-columns:24px 1fr;gap:10px;margin:0 0 10px}
.vline:last-child{margin-bottom:0}
.vline.one{grid-template-columns:1fr}
.vline .n{font:400 11.5px var(--f-ui);color:var(--paper-muted);padding-top:.45em}
.vline.insl .n{color:var(--ins)}
.vline.same{opacity:.75}
.newal{color:var(--ins)}
.disp{font:400 15px/1.5 var(--f-legal);white-space:pre-line;margin:0}
/* les coins : déposer au coffre (en haut), retourner la feuille (pli, en bas) */
.corner{position:absolute;top:10px;right:10px;z-index:3;width:26px;height:26px;padding:0!important;border-radius:50%!important;border:1px solid #b9ad8f!important;background:rgba(255,255,255,.4)!important;color:#5d5444!important;font:400 15px/1 var(--f-ui)!important;display:grid;place-items:center}
.corner:hover{background:#fff!important;border-color:#8a7a55!important}
.fold{position:absolute;right:0;bottom:0;z-index:3;width:30px;height:30px;padding:0!important;border:0!important;border-radius:0!important;
  background:linear-gradient(135deg,transparent 50%,#d6ceba 50%,#c9bfa6)!important;color:#5d5444!important;font:400 11px/1 var(--f-ui)!important;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 4px 3px 0!important}
.fold:hover{background:linear-gradient(135deg,transparent 50%,#cdbf9c 50%,#b9a983)!important}
/* le verso : la fiche de l'objet */
.vs{margin:0 0 14px}
.vs h4{margin:0 0 4px;font:600 10.5px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--paper-muted)}
.vs p,.vs li{font:400 14.5px/1.5 var(--f-legal);margin:0 0 4px}
.vs ul,.vs ol{margin:0;padding-left:18px}
.vs .jr{list-style:none;padding:0}
.vs small{font:400 11.5px var(--f-ui);color:var(--paper-muted)}
.note{width:100%;font:400 14px var(--f-legal);background:rgba(255,255,255,.5);border:1px solid var(--paper-line);border-radius:4px;padding:6px 8px;color:var(--paper-ink);resize:vertical}
.chk{display:flex;align-items:center;gap:6px;font:400 12.5px var(--f-ui);color:var(--paper-muted);margin-top:4px}
.parole{font:400 14px/1.5 var(--f-legal)!important;margin:0 0 10px!important}
.parole b{font-family:var(--f-ui);font-size:12.5px}
.parole small{font:400 11px var(--f-ui);color:var(--paper-muted);letter-spacing:.04em}
.decision{font:600 11px var(--f-ui)!important;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-muted);margin:6px 0 10px!important}

/* --- sort et état (D2) : une matière par sort, jamais une encre de texte --- */
.stamp{position:absolute;right:46px;top:56px;z-index:2;font:600 13px var(--f-ui);letter-spacing:.24em;text-transform:uppercase;color:var(--stamp);border:2px solid var(--stamp);border-radius:4px;padding:3px 8px 2px 11px;transform:rotate(-7deg);opacity:.62;pointer-events:none}
.stamp.tombe{color:#6b6457;border-color:#6b6457;opacity:.5}
.stamp.conf{color:#2b5a3a;border-color:#2b5a3a}
.face.s-ns{opacity:.92}
.face.s-ns .recto{opacity:.7}
.face.s-retire::after{content:"";position:absolute;left:0;top:0;width:34px;height:34px;background:linear-gradient(135deg,#0b0d12 50%,#d3cab4 50%);pointer-events:none}
.face.s-irr{background:linear-gradient(135deg,rgba(244,241,233,.86),rgba(233,228,216,.8));outline-style:dashed;outline-color:#cfc6b0}
.face.s-irr .recto .body{text-decoration:line-through 1px rgba(168,69,47,.55)}
.face.tilt .recto{transform:rotate(-.6deg)}
.avis{display:inline-flex;gap:3px;align-items:center;font:500 11px var(--f-ui);letter-spacing:.04em;text-transform:none}
.avis i{font-style:normal;width:18px;height:18px;display:inline-grid;place-items:center;border:1px solid var(--paper-line);border-radius:50%;color:var(--paper-ink)}
.avis b{font-weight:600;color:var(--paper-ink);margin-left:3px}
.dcb,.gage{font:500 10px var(--f-ui);letter-spacing:.08em;border:1px solid var(--paper-line);border-radius:3px;padding:1px 5px;color:var(--paper-muted)}
.fil{font:normal 400 12px var(--f-ui);color:var(--paper-muted);margin-left:4px}
.qmark{font:600 11px var(--f-ui);background:#2a2620;color:var(--paper);border-radius:50%;width:16px;height:16px;display:inline-grid;place-items:center}
.lnk{border:0!important;padding:0!important;background:none!important;color:#5a4a26!important;text-decoration:underline 1px;text-underline-offset:2px;font:inherit!important;cursor:pointer}
.serie{font:400 12.5px var(--f-ui)!important;color:var(--paper-muted);margin-top:8px!important}
/* le banc (D8) : la rapporteure, le rapporteur pour avis */
.face.banc .recto::before{content:"";position:absolute;left:14px;right:14px;top:14px;height:4px;background:#3d3a33;opacity:.75}
.vis{font:500 11px var(--f-ui)!important;letter-spacing:.04em;padding:2px 8px!important;border-radius:999px!important;text-transform:none}
.face.confirmed{box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 0 2px rgba(43,90,58,.55)}

/* --- face à : la référence vierge --- */
.facea{display:inline-flex;align-items:center;gap:0;text-transform:none;letter-spacing:.02em}
.facea button{font:500 11px var(--f-ui)!important;padding:2px 8px!important;border-radius:999px 0 0 999px!important;border:1px solid var(--paper-line)!important;color:var(--paper-muted)!important}
.facea button.refpick{border-radius:0 999px 999px 0!important;border-left:0!important;padding:2px 6px!important}
.facea.static{font:500 11px var(--f-ui);color:var(--paper-muted)}
.facea.static button.refpick{border-radius:999px!important;border-left:1px solid var(--paper-line)!important;margin-left:6px}
.facea b{color:var(--paper-ink);font-weight:600}
.above{width:100%;flex:none;display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.above.on{grid-template-rows:1fr;margin-bottom:22px}
.above>*{min-height:0;overflow:hidden}
.orig{width:min(880px,100%);margin:0 auto;display:grid;gap:8px;padding:20px 30px 16px;box-shadow:0 14px 34px rgba(0,0,0,.55), 0 0 0 1px rgba(217,181,106,.25)}
.orig .body{font:400 clamp(15px,1.7vw,18px)/1.5 var(--f-legal);max-width:none;max-height:22vh;overflow:auto;touch-action:pan-y;scrollbar-width:none}
.orig .legend{font:400 12px/1.45 var(--f-ui);color:var(--paper-muted);margin:0}
.orig .legend ins,.orig .legend del{padding:0 3px}
.layer:has(.above.on){justify-content:flex-start}
.layer:has(.above.on) .face{max-height:calc(100dvh - var(--top) - var(--bottom) - 150px - 27vh)}
.above.on .orig .body{max-height:15vh}

/* --- index des passages disputés / des thèmes (à gauche ; en ligne au-dessus sur écran étroit) --- */
.units{position:absolute;z-index:6;left:42px;top:50%;transform:translateY(-50%);width:176px;display:grid;gap:6px;transition:opacity .3s;max-height:62vh;overflow-y:auto;scrollbar-width:none}
.units::-webkit-scrollbar{display:none}
.units.hide{opacity:0;pointer-events:none}
.units-t{margin:0 0 4px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.units button{display:grid;gap:1px;text-align:left;font:500 12.5px var(--f-ui);color:var(--fg);background:rgba(11,13,18,.6);border:1px solid var(--line-2);border-left:2px solid var(--accent);border-radius:4px;padding:7px 10px;cursor:pointer;backdrop-filter:blur(6px)}
.units button i{display:inline-block;width:14px;height:2px;background:var(--accent);vertical-align:middle;margin-right:6px}
.units button i.w2{height:3px}.units button i.w3{height:5px}
.units button small{font:400 11px var(--f-ui);color:var(--muted)}
.units button.on,.units button:hover,.units button:focus-visible{border-color:var(--accent);outline:none;background:rgba(217,181,106,.1)}
.units-none{font-size:12px;color:var(--muted);line-height:1.45}
#refmenu{position:absolute;z-index:40;width:290px;display:none;gap:6px;padding:12px;border:1px solid var(--line-2);border-radius:8px;background:rgba(11,13,18,.95);backdrop-filter:blur(6px)}
#refmenu.on{display:grid}
#refmenu button{display:grid;gap:2px;text-align:left;font:500 12.5px var(--f-ui);color:var(--fg);background:none;border:1px solid var(--line-2);border-radius:4px;padding:7px 10px;cursor:pointer}
#refmenu button small{font:400 11px var(--f-ui);color:var(--muted)}
#refmenu button.on,#refmenu button:hover{border-color:var(--accent)}

/* --- versions d'article --- */
.art-ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.art-ol li{display:grid;grid-template-columns:24px 1fr;gap:2px 12px;padding:7px 8px 7px 10px;border-radius:3px;font:400 clamp(14.5px,1.5vw,16.5px)/1.55 var(--f-legal)}
.art-ol li .n{font:400 12px var(--f-ui);color:var(--paper-muted);padding-top:4px}
.art-ol li.mod{box-shadow:inset 3px 0 0 var(--accent)}
.art-ol li[data-o],.art-ol li[data-line]{cursor:pointer;transition:background .2s}
.art-ol li[data-o]:hover,.art-ol li[data-line]:hover{background:rgba(217,181,106,.1)}
.face.artf .body,.face.codef .body,.face.verbf .body,.face.synf .body,.face.placef .body{max-width:none}

/* --- unité de sens : la référence et ma rédaction, côte à côte (loupe et vue isolée fusionnées) --- */
.duo2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:6px}
.lc{display:grid;align-content:start;gap:10px;padding:20px 22px 18px;outline-width:10px;outline-offset:-10px;box-shadow:0 10px 26px rgba(0,0,0,.25), 0 0 0 1px rgba(217,181,106,.2)}
.lc p{font:400 clamp(16px,2vw,23px)/1.45 var(--f-legal);margin:0}
.lc .ctx{color:var(--paper-muted)}
.tagu{display:inline-flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0}
.tagu i{display:inline-block;width:18px;height:2px;background:var(--accent)}
.tagu i.w2{height:3px}.tagu i.w3{height:5px}
.tagu b{font:600 16px var(--f-legal);color:var(--paper-ink)}
.ptxt{font:400 clamp(22px,3vw,32px)/1.3 var(--f-legal)!important;margin:6px 0!important}
.who{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:14px}
.who-i{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--f-ui)!important;color:var(--paper-ink)!important;background:rgba(255,255,255,.45)!important;border:1px solid var(--paper-line)!important;border-radius:999px!important;padding:4px 10px!important;white-space:nowrap}
.who-i i{width:7px;height:7px;border-radius:50%;background:var(--g)}
.who-i small{color:var(--paper-muted);font-size:10.5px}
.who-i.on{border-color:#8a7a55!important;background:rgba(255,255,255,.85)!important}
button.who-i{cursor:pointer}
.face.divider{width:min(620px,100%)}
.face.divider .recto{background:repeating-linear-gradient(-45deg,transparent 0 10px,rgba(201,191,166,.18) 10px 11px)}

/* --- colonnes alignées : référence au centre, une rédaction de chaque côté --- */
.burst-scroll{width:min(1220px,100%);flex:1;min-height:0;overflow:auto;padding:12px 10px 40px;touch-action:pan-y;scrollbar-width:none;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14px,#000 calc(100% - 36px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 14px,#000 calc(100% - 36px),transparent 100%)}
.burst-scroll::-webkit-scrollbar{display:none}
.burst-grid{display:grid;grid-template-columns:repeat(var(--k),minmax(0,1fr));gap:0 18px;align-items:start}
.bcol{display:grid;grid-template-rows:subgrid;padding:22px 24px 14px;outline-width:10px;outline-offset:-10px;box-shadow:0 16px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(217,181,106,.2)}
.bcol .head{align-self:end;margin-bottom:4px}
.bcol.ref{box-shadow:0 16px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(217,181,106,.45)}
.cell{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 0;border-top:1px solid rgba(201,191,166,.55);font:400 clamp(14px,1.3vw,16px)/1.55 var(--f-legal)}
.cell:nth-child(2){border-top:0}
.cell .n{font:400 11.5px var(--f-ui);color:var(--paper-muted);padding-top:3px}

/* --- le code (D4) --- */
.code{display:grid;gap:14px}
.code-l h5{margin:0 0 4px;font:600 12px var(--f-ui);letter-spacing:.08em;color:var(--paper-muted)}
.code-l h5 small{font-weight:400;letter-spacing:0}
.code-l:not(.chg){opacity:.6}
.code-p{display:grid;grid-template-columns:24px 1fr;gap:10px;font:400 14.5px/1.55 var(--f-legal)!important;margin:0 0 8px!important}
.code-p .n{font:400 11px var(--f-ui);color:var(--paper-muted);padding-top:3px}
.code-same{font:400 11.5px var(--f-ui)!important;color:var(--paper-muted);margin:0 0 8px 34px!important}
.instr summary{cursor:pointer;font:500 12px var(--f-ui);color:var(--paper-muted);margin:12px 0 6px}
.instr ol{margin:0;padding-left:20px;font:400 13.5px/1.5 var(--f-legal)}
.instr li small{font:400 11px var(--f-ui);color:var(--paper-muted)}
.instr li.st-ko small b,.ko{color:var(--del)}
.instr li.st-ok small b{color:#2b5a3a}

/* --- le dérouleur (D5) : la liste de vote, les paroles, la partition --- */
table.vote{width:100%;border-collapse:collapse;font:400 13.5px/1.4 var(--f-legal)}
table.vote th{font:600 10px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--paper-muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--paper-line)}
table.vote td{padding:7px 6px;border-bottom:1px solid rgba(201,191,166,.5);vertical-align:top}
table.vote td.n{font:400 11px var(--f-ui);color:var(--paper-muted);width:20px}
table.vote td .group-badge .name{font-size:13.5px}
table.vote td.obj{color:#3c362d}
table.vote td.av{text-align:center;width:36px}
table.vote td.so{font:500 11.5px var(--f-ui);white-space:nowrap}
table.vote tr{cursor:pointer}
table.vote tr:hover td{background:rgba(217,181,106,.12)}
table.vote tr.s-adopte td.so{color:var(--stamp)}
table.vote tr.s-tombe,table.vote tr.s-ns,table.vote tr.s-irr{opacity:.62}
.bande{width:min(1100px,100%);display:grid;gap:12px;padding:24px 28px 20px}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.seg{flex:0 0 auto;width:calc(var(--w) * 1.6px + 30px);min-height:56px;display:grid;align-content:space-between;text-align:left;font:500 12px var(--f-ui);color:var(--paper-ink);background:rgba(255,255,255,.35);border:1px solid var(--paper-line);border-radius:3px;padding:6px 7px;cursor:pointer}
.seg small{font:400 10px var(--f-ui);color:var(--paper-muted)}
.seg.ad{background:rgba(217,181,106,.4);border-color:#b99a55}
.seg.nv{background:repeating-linear-gradient(-45deg,transparent 0 6px,rgba(201,191,166,.35) 6px 7px)}
.seg.on{box-shadow:0 0 0 2px var(--paper-ink)}
.bande .legend,.planf .legend{font:400 12px/1.45 var(--f-ui);color:var(--paper-muted);margin:0}

/* --- l'histoire (D7) : étapes, tampons de provenance, grille --- */
.etb{font:600 10.5px var(--f-ui);letter-spacing:.14em}
.tampon{display:inline-block;font:600 9.5px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:#5a4a26;border:1.5px solid #9c8650;border-radius:3px;padding:2px 6px;transform:rotate(-2deg);opacity:.85;margin-left:6px;white-space:normal}
.face.absent .recto{opacity:.6}
.grille{padding:20px 20px 16px;width:max-content;max-width:none;margin:0 auto}
.grille table{border-collapse:collapse;font:400 12.5px/1.35 var(--f-legal)}
.grille th{font:600 10px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--paper-muted);text-align:left;padding:5px 8px;border-bottom:1px solid var(--paper-line);white-space:nowrap}
.grille td{padding:5px 8px;border-bottom:1px solid rgba(201,191,166,.5);min-width:150px;max-width:220px;cursor:pointer;vertical-align:top}
.grille td.n{min-width:0;font:400 11px var(--f-ui);color:var(--paper-muted);cursor:default}
.grille td small{font:500 10px var(--f-ui);color:var(--ins)}
.grille td.eq{color:var(--paper-muted)}
.grille td.ab{color:#b9ad8f;cursor:default}
.grille td.chg{box-shadow:inset 3px 0 0 var(--accent)}
.grille tr.on td{background:rgba(217,181,106,.12)}
.grille td:hover{background:rgba(217,181,106,.18)}
.matrice td{min-width:90px}
.matrice th button{font:600 12.5px var(--f-legal)!important;text-transform:none;letter-spacing:0}
.matrice td .lnk{font:500 11.5px var(--f-ui)!important;margin-right:3px}

/* --- le plan (D12) --- */
.planf{width:min(1000px,100%);margin:0 auto;display:grid;gap:12px;padding:26px 32px 22px}
.bandeau{display:flex;flex-wrap:wrap;gap:6px 18px;font:400 12.5px var(--f-ui);color:var(--paper-muted);padding:4px 0 8px;border-bottom:1px solid var(--paper-line)}
.plan-ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.plan-ol li{display:grid;grid-template-columns:70px 1fr 150px;gap:4px 14px;align-items:start;padding:9px 8px;border-radius:3px}
.plan-ol li .n{font:600 12px var(--f-ui);color:var(--paper-muted);padding-top:3px}
.plan-ol li b{font:600 15.5px/1.35 var(--f-legal)}
.plan-ol li .meta{display:block;font:400 11.5px var(--f-ui);color:#8a8070;margin-top:2px}
.plan-ol li .me{color:#8a5a00;font-weight:600}
.plan-ol li.dim{opacity:.62}
.plan-ol li.live{cursor:pointer;box-shadow:inset 3px 0 0 var(--accent)}
.plan-ol li.live:hover{background:rgba(217,181,106,.12)}
.strokes{display:flex;flex-wrap:wrap;gap:1px;justify-content:flex-end;padding-top:4px}
.strokes i{width:1px;height:12px;background:#9c8f74}

/* --- synthèse --- */
.synf .vs ul{padding-left:16px}

/* --- surcouches : loupe, éclatement, calque, sas, directions, tiroir --- */
.overlay{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:56px var(--gutter-r) 24px var(--gutter-l);background:rgba(6,8,12,.76);backdrop-filter:blur(3px);
  opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s linear .25s}
.overlay.on{opacity:1;visibility:visible;transition:opacity .25s,visibility 0s}
.overlay-in{width:min(1000px,100%);max-height:100%;display:grid;gap:16px;justify-items:center;transform:scale(.95);transition:transform .35s var(--ease);min-height:0}
.overlay.on .overlay-in{transform:none}
.loupe-title{margin:0;text-align:center;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.loupe-title b{color:var(--fg);font-weight:500}
.loupe-cols{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
#burst .overlay-in{width:min(1260px,100%);height:100%;grid-template-rows:auto minmax(0,1fr) auto}
#burst .burst-scroll{width:100%}
.panel{width:min(760px,100%);max-height:calc(100dvh - 80px);overflow:auto;display:grid;gap:10px;padding:26px 30px 20px;scrollbar-width:none}
.panel::-webkit-scrollbar{display:none}
.panel .vs p,.panel .vs li{font-size:15px}
.panel .foot{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:flex-end;align-items:center;border-top:1px solid var(--paper-line);padding-top:12px}
.panel .foot>span{margin-right:auto;font-size:11.5px;color:#8a8070}
.panel button{font:500 12.5px var(--f-ui);border-radius:4px;padding:6px 14px;cursor:pointer;border:1px solid #a89c80;background:transparent;color:#4a4336}
.panel button.primary{background:#2a2620;color:var(--paper);border-color:#2a2620}
.panel.calque{background:linear-gradient(135deg,rgba(244,241,233,.9),rgba(233,228,216,.86));outline-style:dashed;outline-color:#cfc6b0}
.sas-h{margin:4px 0 0;font:600 26px var(--f-legal)}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.checks li{font:400 14.5px/1.45 var(--f-legal);padding:8px 10px;border-left:3px solid var(--paper-line);background:rgba(255,255,255,.3)}
.checks li b{font:600 12.5px var(--f-ui);display:block;margin-bottom:2px}
.checks li.lv-ok{border-left-color:#5d8a68}.checks li.lv-warn{border-left-color:var(--del)}.checks li.lv-info{border-left-color:var(--accent)}
.checks li button{margin-top:6px}
.dlist{display:grid;gap:6px}
.drow{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;padding:8px 10px;border:1px solid var(--paper-line);border-radius:4px;cursor:pointer;background:rgba(255,255,255,.3)}
.drow b{font:600 13px var(--f-ui)}
.drow small{display:block;font:400 12.5px/1.4 var(--f-legal);color:var(--paper-muted);margin-top:2px}
.drow.off{opacity:.55;cursor:default}
.drow input{margin-top:3px;accent-color:#2a2620}
.tlist{width:min(620px,100%);display:grid;gap:8px;max-height:60vh;overflow:auto;scrollbar-width:none}
.titem{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;text-align:left;cursor:pointer;padding:12px 18px;outline-width:8px;outline-offset:-8px;font:inherit}
.titem small{font:400 11.5px var(--f-ui);color:var(--paper-muted)}
.titem.on{box-shadow:0 0 0 2px var(--accent)}

/* --- repères de la pile, poignées, aide --- */
.rail{position:absolute;left:max(5px,env(safe-area-inset-left,0px));top:62%;transform:translateY(-50%);z-index:9;display:grid;gap:9px;transition:opacity .3s;max-height:60vh;overflow:hidden}
.rail button{position:relative;width:8px;height:8px;padding:0;border-radius:50%;border:1px solid #4a5062;background:transparent;cursor:pointer}
.rail button::after{content:"";position:absolute;inset:-5px}
.rail button.on{background:var(--accent);border-color:var(--accent)}
.rail:empty{opacity:0;pointer-events:none}
.handle{position:absolute;z-index:10;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  background:rgba(11,13,18,.7);border:1px solid var(--line-2);backdrop-filter:blur(6px);cursor:pointer;user-select:none;transition:color .2s,border-color .2s,opacity .3s}
.handle:hover,.handle:focus-visible{color:var(--fg);border-color:var(--accent);outline:none}
.handle b{color:var(--accent);font-weight:600}
.handle.hide{opacity:0;pointer-events:none}
.handle.top{top:var(--top);left:50%;transform:translateX(-50%);border-top:0;border-radius:0 0 10px 10px;padding:6px 16px 6px}
.handle.right{right:max(0px,env(safe-area-inset-right,0px));top:42%;transform:rotate(-90deg) translate(50%,-100%);transform-origin:right top;border-right:0;border-radius:10px 10px 0 0;padding:8px 16px 7px}
.handle.left{left:max(0px,env(safe-area-inset-left,0px));top:42%;transform:rotate(90deg) translate(-50%,-100%);transform-origin:left top;border-bottom:0;border-radius:10px 10px 0 0;padding:8px 16px 7px}
.handle .chev{font-size:10px}
.handle .zg{font-size:14px;line-height:1}
.hint{position:absolute;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;font-size:12px;color:var(--muted);background:rgba(11,13,18,.6);border:1px solid var(--line);border-radius:999px;padding:5px 14px;backdrop-filter:blur(6px);white-space:nowrap;pointer-events:none;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.hint b{color:var(--fg);font-weight:500}
#stage.editing .rail,#stage.editing .units{opacity:0;pointer-events:none}
/* éditeur : une zone de saisie transparente posée sur un calque qui porte les marques */
.ed{position:relative}
.ed .mirror,.face textarea{font:inherit;letter-spacing:inherit;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;margin:0;padding:0;border:0}
.ed .mirror{position:absolute;inset:0;color:transparent;pointer-events:none;overflow:hidden}
.ed .mirror ins{color:transparent;font-weight:inherit;text-decoration:underline 2px var(--ins);text-underline-offset:3px}
.delpt{position:relative}
.delpt::after{content:"";position:absolute;left:-1px;top:.2em;height:1.1em;width:2px;border-radius:1px;background:var(--del)}
.face textarea{position:relative;color:inherit;background:transparent;resize:none;width:100%;min-height:3em;display:block;overflow:hidden;caret-color:var(--paper-ink)}
.face textarea:focus{outline:none}
.ghost{transition:none!important}

@media (max-width:1199px){
  .units{left:var(--gutter-l);right:var(--gutter-r);top:calc(var(--top) + 54px);transform:none;width:auto;display:flex;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;max-height:none}
  .units-t{margin:0 4px 0 0;flex:none}
  .units button{flex:none;display:flex;gap:6px;align-items:baseline;padding:4px 9px;font-size:12px}
  .layer:has(+ .units:not(.hide)),#stage:has(.units:not(.hide)) .layer{padding-top:calc(var(--top) + 96px)}
}
@media (max-width:760px){
  :root{--top:44px;--bottom:66px}
  #topbar{gap:8px}
  #topbar .dossier .long,#refInfo{display:none}
  .coffre .pastille,.tiroir-b{display:none}
  .coffre{padding:3px 4px 3px 9px}
  .hint{font-size:11px;padding:4px 10px;white-space:normal;text-align:center;width:max-content;border-radius:12px;bottom:calc(42px + env(safe-area-inset-bottom,0px))}
  .recto,.verso{padding:22px 18px 16px}
  .paper .head{font-size:10px}
  .stamp{right:16px;top:40px;font-size:11px}
  .orig{padding:16px 18px 12px}
  .duo2,.loupe-cols{grid-template-columns:1fr;gap:10px}
  .lc{padding:14px 14px 12px;outline-width:8px;outline-offset:-8px}
  .burst-scroll{overflow-x:auto;touch-action:pan-x pan-y;padding:10px 4px 30px}
  .burst-grid{grid-template-columns:repeat(var(--k),minmax(250px,82vw))}
  .bcol{scroll-snap-align:center;padding:18px 16px 12px}
  .handle.left,.handle.right{font-size:10.5px;padding:6px 10px 5px}
  .plan-ol li{grid-template-columns:52px 1fr}
  .strokes{display:none}
  .panel{padding:20px 18px 16px}
  table.vote td.obj{display:none}
  table.vote th:nth-child(4){display:none}
  .layer{padding-left:calc(var(--gutter-l) + 14px);padding-right:calc(var(--gutter-r) + 14px)}
}
@media (prefers-reduced-motion:reduce){.layer,.handle,.rail,.pastille,.above,.overlay,.overlay-in{transition:none;animation:none}}
</style>
</head>
<body>
<div id="stage">
  <header id="topbar">
    <span class="dossier"><span class="long">Projet de loi logement · </span><b>Article 4</b> <span class="long">· CGI, art. 31 · </span><span id="refInfo"></span></span>
    <div class="coffre" id="coffre"></div>
    <button type="button" id="dirBtn" title="Les directions du modèle (touche D)">Directions</button>
  </header>
  <div id="view"></div>
  <nav class="units hide" id="side" aria-label="Index"></nav>
  <nav class="rail" id="rail" aria-label="Position dans la pile"></nav>
  <button class="handle top" id="hTop" type="button"></button>
  <button class="handle left" id="hLeft" type="button"></button>
  <button class="handle right" id="hRight" type="button"></button>
  <span class="hint" id="hint"></span>
  <nav id="rangements" aria-label="Rangements"></nav>
  <div id="refmenu" role="menu" aria-hidden="true"></div>

  <div class="overlay" id="loupe" role="dialog" aria-modal="true" aria-hidden="true"><div class="overlay-in"><p class="loupe-title" id="loupeTitle"></p><div class="loupe-cols" id="loupeCols"></div><button class="btn" type="button" data-close="loupe">Fermer</button></div></div>
  <div class="overlay" id="burst" role="dialog" aria-modal="true" aria-hidden="true"><div class="overlay-in"><p class="loupe-title" id="burstTitle"></p><div id="burstIn" style="min-height:0;display:flex;width:100%"></div><button class="btn" type="button" data-close="burst">Refermer (Échap)</button></div></div>
  <div class="overlay" id="calque" role="dialog" aria-modal="true" aria-hidden="true"><section class="panel paper calque" id="calqueIn"></section></div>
  <div class="overlay" id="sas" role="dialog" aria-modal="true" aria-hidden="true"><section class="panel paper" id="sasIn"></section></div>
  <div class="overlay" id="dirs" role="dialog" aria-modal="true" aria-hidden="true"><section class="panel paper" id="dirsIn"></section></div>
  <div class="overlay" id="tiroir" role="dialog" aria-modal="true" aria-hidden="true"><div class="overlay-in" id="tiroirIn"></div></div>
</div>
<script src="data/logement-art4.js"></script>
<script src="app/base.js"></script>
<script src="app/modele.js"></script>
<script src="app/vues.js"></script>
<script src="app/rangements.js"></script>
<script src="app/main.js"></script>
</body>
</html>

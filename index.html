<title>Amendement en scène</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Scène 2D : des feuilles dans un espace sombre. Trois gestes, même sens partout :
   haut/bas = parcourir ; gauche/droite = changer de volet (article ← le mien → les autres → comparer) ; clic/pincer = changer d'échelle. */
:root{
  --bg:#0b0d12; --bg-2:#11141b; --fg:#e8e6df; --muted:#8a8f9b; --accent:#d9b56a; --accent-soft:rgba(217,181,106,.28); --line:#232733; --line-2:#2f3443;
  --paper:#f4f1e9; --paper-2:#e9e4d8; --paper-ink:#1d1a16; --paper-muted:#6b6457; --paper-line:#c9bfa6; --paper-frame:#ece7db;
  --f-ui:"IBM Plex Sans",system-ui,sans-serif; --f-legal:"Source Serif 4",Georgia,serif;
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden;font-size:14px}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 40%, #151924 0%, var(--bg) 60%),var(--bg)}
#stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;opacity:.25;
  mask-image:radial-gradient(ellipse at 50% 55%, #000 20%, transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 55%, #000 20%, transparent 75%)}

/* --- matière papier, partagée par toutes les feuilles --- */
.paper{background:linear-gradient(135deg,var(--paper),var(--paper-2));color:var(--paper-ink);border:1px solid var(--paper-line);outline:14px solid var(--paper-frame);outline-offset:-14px;
  box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(217,181,106,.25)}
.paper .head{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-muted);border-bottom:1px solid var(--paper-line);padding-bottom:8px}
.paper .lead{font:italic 400 15px var(--f-legal);color:var(--paper-muted);margin:4px 0 0}
.paper .body{font:400 clamp(17px,2.2vw,23px)/1.5 var(--f-legal);max-width:68ch}
.paper .body p{margin:0}
.paper .none{font-style:italic;color:var(--paper-muted)}
.group-badge{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;min-width:0}
.group-badge i{width:8px;height:8px;border-radius:50%;background:var(--g);display:inline-block;flex:none}
.group-badge .name{font:600 clamp(17px,1.9vw,21px)/1.2 var(--f-legal);color:var(--paper-ink);letter-spacing:0;text-transform:none;white-space:normal}

/* marques : les passages (surlignage léger, cliquable) ; les écarts (ajouté surligné / supprimé barré) */
.paper mark.pt{color:inherit;background:rgba(217,181,106,.17);box-shadow:inset 0 -2px 0 rgba(217,181,106,.75);border-radius:2px;cursor:pointer;transition:background .2s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.paper mark.pt:hover{background:rgba(217,181,106,.4)}
.paper ins{color:inherit;text-decoration:none;background:rgba(217,181,106,.5);border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.paper del{text-decoration:line-through 2px #a8452f;color:#7d7466;background:rgba(168,69,47,.08);border-radius:2px}

/* --- quatre volets côte à côte : article · le mien · les autres · comparer --- */
.center{position:absolute;inset:0}
.pane{position:absolute;inset:0;transform:translateX(calc(var(--rel,0) * 55%));opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .5s var(--ease),opacity .4s,visibility 0s linear .5s}
.pane.on{opacity:1;visibility:visible;pointer-events:auto;transition:transform .5s var(--ease),opacity .4s,visibility 0s}
.pane-others{padding:84px var(--gutter-r) 56px var(--gutter-l);display:flex;flex-direction:column;align-items:center;justify-content:center}
.pane-article,.pane-lib{padding:76px var(--gutter-r) 64px var(--gutter-l);display:flex;flex-direction:column;align-items:center}
.pile-title{position:absolute;top:44px;left:var(--gutter-l);right:var(--gutter-r);z-index:2;margin:0;text-align:center;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;line-height:1.6;pointer-events:none}
.pile-title b{color:var(--fg);font-weight:500}

/* --- échelles dans mon volet : alinéa (0) · passage (1) --- */
.layer{position:absolute;inset:0;padding:72px var(--gutter-r) 56px var(--gutter-l);display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;pointer-events:none;transform:scale(.86);transition:opacity .4s,transform .5s var(--ease),visibility 0s linear .5s}
.layer.shallow{transform:scale(1.18)}
.layer.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .4s,transform .5s var(--ease),visibility 0s}
.layer-pt{padding-top:84px}

/* --- la pile : un tambour de feuilles --- */
.drum{position:relative;width:100%;flex:none;perspective:1600px}
.sheet{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px;padding:34px 40px 26px;transition:box-shadow .35s}
.face{position:absolute;top:0;left:0;right:0;margin:0 auto;width:min(880px,100%);max-height:calc(100vh - 160px);max-height:calc(100dvh - 160px);
  touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform,opacity}
.face.passage{width:min(680px,100%);grid-template-rows:auto minmax(0,1fr) auto}
.face:not(.cur){cursor:pointer}
.face.editing{user-select:text;-webkit-user-select:text}
.sheet.editing{box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 0 2px var(--accent)}
.sheet .body{overflow:auto;min-height:0}
.face.al.cur .body{cursor:text}
.ptxt{font:400 clamp(26px,3.6vw,38px)/1.3 var(--f-legal);margin:8px 0 6px;max-width:none}
.ptxt ins{background:rgba(217,181,106,.4)}
.sheet .foot{display:flex;justify-content:flex-end;gap:12px;align-items:center;min-height:30px}
.sheet .foot span{margin-right:auto;font-size:11.5px;color:#8a8070}
.sheet .foot .count{margin-right:0;font-size:11px;letter-spacing:.08em;color:var(--paper-muted);white-space:nowrap}
.sheet .foot .tag{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-muted)}
.sheet .foot .tag b{color:var(--paper-ink);font-weight:600}
.sheet .foot .tag i{width:8px;height:8px;border-radius:2px;background:var(--accent);flex:none}
.sheet button{font:500 13px var(--f-ui);border-radius:4px;padding:6px 14px;cursor:pointer;border:1px solid #a89c80;background:transparent;color:#4a4336}
.sheet button.primary{background:#2a2620;color:var(--paper);border-color:#2a2620}
.sheet button:focus-visible{outline:2px solid #2a2620;outline-offset:2px}
/* éditeur : une zone de saisie transparente posée sur un calque qui porte les marques */
.ed{position:relative}
.ed .mirror,.sheet textarea{font:inherit;letter-spacing:inherit;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;margin:0;padding:0;border:0}
.ed .mirror{position:absolute;inset:0;color:transparent;pointer-events:none;overflow:hidden}
.ed .mirror mark,.ed .mirror ins{color:transparent}
.sheet textarea{position:relative;color:inherit;background:transparent;resize:none;width:100%;min-height:3em;display:block;overflow:hidden;caret-color:var(--paper-ink)}
.sheet textarea:focus{outline:none}

/* --- dézoom sur un alinéa (le mien ou celui d'un autre) : le texte d'origine au-dessus --- */
.zoomer{width:100%;display:flex;flex-direction:column;align-items:center;transform-origin:50% 50%;transition:transform .45s var(--ease)}
#stage[data-mode=origin] .zoomer{transform:scale(.9)}
.orig-wrap{width:100%;flex:none;display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
#stage[data-mode=origin] .orig-wrap{grid-template-rows:1fr}
.orig-clip{min-height:0;overflow:hidden;margin:0 -40px;padding:0 40px 24px}
.orig{width:min(880px,100%);margin:0 auto;display:grid;gap:10px;padding:24px 32px 18px;opacity:0;transform:translateY(-28px);transition:opacity .35s,transform .45s var(--ease);
  box-shadow:0 14px 34px rgba(0,0,0,.55), 0 0 0 1px rgba(217,181,106,.25)}
#stage[data-mode=origin] .orig{opacity:1;transform:none}
.orig .body{font:400 clamp(16px,1.9vw,20px)/1.5 var(--f-legal);max-width:none;max-height:28vh;overflow:auto;touch-action:pan-y}
.orig .legend{font:400 12px/1.45 var(--f-ui);color:var(--paper-muted);margin:0}
.orig .legend ins,.orig .legend del{padding:0 3px}

/* --- volet de gauche : tout l'article, en corrections apparentes contre une référence --- */
.refs{width:min(880px,100%);flex:none;display:flex;align-items:center;gap:8px;overflow-x:auto;padding:2px 2px 12px;touch-action:pan-x;scrollbar-width:thin}
.refs-lbl{flex:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;font:500 12px var(--f-ui);color:var(--muted);background:rgba(11,13,18,.7);border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--g)}
.chip:hover,.chip:focus-visible{color:var(--fg);outline:none;border-color:#4a5062}
.chip[aria-pressed=true]{color:var(--fg);border-color:var(--accent);background:rgba(217,181,106,.12)}
.art-scroll{width:min(880px,100%);flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;padding:16px 4px 28px}
.art{padding:30px 40px 28px}
.art h2{font:600 24px var(--f-legal);margin:8px 0 4px}
.art .legend{font:400 12px/1.5 var(--f-ui);color:var(--paper-muted);margin:0 0 14px}
.art .legend ins,.art .legend del{padding:0 3px}
.art ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.art li{display:grid;grid-template-columns:26px 1fr;gap:2px 12px;padding:9px 10px;border-radius:3px;font:400 clamp(16px,1.7vw,18px)/1.55 var(--f-legal)}
.art li .n{font:400 12px var(--f-ui);color:var(--paper-muted);padding-top:5px}
.art li .meta{grid-column:2;font:400 11.5px var(--f-ui);color:#8a8070}
.art li[data-i]{cursor:pointer;transition:background .2s}
.art li[data-i]:hover{background:rgba(217,181,106,.1)}
.art li.here{box-shadow:inset 3px 0 0 var(--accent)}

/* --- volet de droite : la bibliothèque des rédactions, et la sélection en petit à côté --- */
.lib-wrap{width:100%;max-width:1120px;flex:1;min-height:0;display:flex;justify-content:center;gap:28px}
.lib-col{width:min(640px,100%);min-height:0;display:flex;flex-direction:column;transition:width .45s var(--ease)}
.lib-list{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:grid;align-content:start;gap:14px;padding:16px 12px 40px}
.lib-item{display:grid;gap:8px;padding:20px 24px 16px;cursor:pointer;outline-width:10px;outline-offset:-10px;box-shadow:0 14px 34px rgba(0,0,0,.5), 0 0 0 1px rgba(217,181,106,.2);transition:box-shadow .2s,transform .2s}
.lib-item:hover{transform:translateX(3px)}
.lib-item.on{box-shadow:0 14px 34px rgba(0,0,0,.5), 0 0 0 2px var(--accent)}
.lib-item:focus-visible{box-shadow:0 0 0 3px var(--fg)}
.lib-item .head .in{color:#8a6a28;font-weight:600}
.lib-text{font:400 clamp(16px,1.6vw,18px)/1.5 var(--f-legal);margin:0}
.lib-objet{font:italic 400 13.5px var(--f-legal);color:var(--paper-muted);margin:0}
.sel-col{width:0;min-width:0;opacity:0;overflow:hidden;display:flex;flex-direction:column;transition:width .45s var(--ease),opacity .3s}
.pane-lib.has-sel .lib-col{width:min(600px,58%)}
.pane-lib.has-sel .sel-col{width:min(380px,40%);opacity:1}
.sel-title{flex:none;margin:16px 4px 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:baseline;justify-content:space-between;white-space:nowrap}
.sel-title b{color:var(--fg);font-weight:500}
.lnk{background:none;border:0;padding:0;color:var(--muted);font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lnk:hover,.lnk:focus-visible{color:var(--fg);outline:none}
.sel-note{flex:none;margin:0 4px 10px;font-size:11.5px;color:var(--muted)}
.sel-list{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:grid;align-content:start;gap:10px;padding:2px 4px 30px}
.sel-card{display:grid;gap:6px;padding:12px 14px;outline-width:5px;outline-offset:-5px;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.sel-head{display:flex;align-items:center;gap:7px;font:500 10.5px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--paper-muted)}
.sel-head i{width:7px;height:7px;border-radius:50%;background:var(--g);flex:none}
.sel-head b{color:var(--paper-ink);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-head span{margin-left:auto;white-space:nowrap}
.sel-head .x{flex:none;border:0;background:none;color:var(--paper-muted);font:400 17px/1 var(--f-ui);cursor:pointer;padding:0 2px}
.sel-head .x:hover,.sel-head .x:focus-visible{color:var(--paper-ink);outline:none}
.sel-text{font:400 13.5px/1.45 var(--f-legal);margin:0}

/* --- repères de la pile, à gauche --- */
.rail{position:absolute;left:max(5px,env(safe-area-inset-left,0px));top:68%;transform:translateY(-50%);z-index:9;display:grid;gap:12px;transition:opacity .3s}
.rail button{position:relative;width:8px;height:8px;padding:0;border-radius:50%;border:1px solid #4a5062;background:transparent;cursor:pointer}
.rail button::after{content:"";position:absolute;inset:-7px}
.rail button.on{background:var(--accent);border-color:var(--accent)}
.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.rail:empty,#stage.editing .rail{opacity:0;pointer-events:none}

/* --- poignées : en haut l'échelle, sur les côtés les volets voisins --- */
.handle{position:absolute;z-index:10;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  background:rgba(11,13,18,.7);border:1px solid var(--line-2);backdrop-filter:blur(6px);cursor:pointer;user-select:none;transition:color .2s,border-color .2s,opacity .3s}
.handle:hover,.handle:focus-visible{color:var(--fg);border-color:var(--accent);outline:none}
.handle b{color:var(--accent);font-weight:600}
.handle.hide{opacity:0;pointer-events:none}
.handle.top{top:env(safe-area-inset-top,0px);left:50%;transform:translateX(-50%);border-top:0;border-radius:0 0 10px 10px;padding:9px 16px 8px}
.handle.right{right:max(0px,env(safe-area-inset-right,0px));top:38%;transform:rotate(-90deg) translate(50%,-100%);transform-origin:right top;border-right:0;border-radius:10px 10px 0 0;padding:9px 16px 8px}
.handle.left{left:max(0px,env(safe-area-inset-left,0px));top:38%;transform:rotate(90deg) translate(-50%,-100%);transform-origin:left top;border-bottom:0;border-radius:10px 10px 0 0;padding:9px 16px 8px}
.handle .chev{font-size:10px}
.handle .zg{font-size:14px;line-height:1}

.hint{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;font-size:12.5px;color:var(--muted);background:rgba(11,13,18,.6);border:1px solid var(--line);border-radius:999px;padding:6px 14px;backdrop-filter:blur(6px);white-space:nowrap;pointer-events:none}
.hint b{color:var(--fg);font-weight:500}
@media (max-width:760px){
  .hint{font-size:11px;padding:5px 10px;white-space:normal;text-align:center;width:max-content;max-width:calc(100vw - 32px);border-radius:12px}
  .sheet{padding:24px 20px 18px}.orig{padding:18px 20px 14px}.orig-clip{padding-bottom:16px}.art{padding:22px 18px}.art li{padding:8px 4px;grid-template-columns:20px 1fr}
  .lib-wrap{flex-direction:column;gap:6px}
  .lib-col,.pane-lib.has-sel .lib-col{width:100%;flex:1}
  .sel-col{width:100%;height:0;flex:none;transition:height .45s var(--ease),opacity .3s}
  .pane-lib.has-sel .sel-col{width:100%;height:36%}
  .sel-title{margin-top:4px}
  .sel-list{display:flex;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;align-items:stretch;padding-bottom:6px}
  .sel-card{flex:0 0 72%;overflow:auto;align-content:start}
  .lib-item{padding:16px 18px 14px}
}
@media (prefers-reduced-motion:reduce){.pane,.layer,.zoomer,.orig-wrap,.orig,.sheet,.handle,.rail,.lib-col,.sel-col{transition:none}}
</style>

<div id="stage" data-mode="alinea" data-pane="mine">
  <div class="center">
    <div class="pane pane-article" id="pArticle" aria-label="Tout l'article">
      <p class="pile-title" id="artTitle"></p>
      <div class="refs" id="refs" role="group" aria-label="Référence de comparaison"></div>
      <div class="art-scroll"><article class="art paper" id="art"></article></div>
    </div>
    <div class="pane pane-mine on" id="pMine" aria-label="Vos amendements">
      <div class="layer layer-al" id="lAl">
        <div class="zoomer">
          <div class="orig-wrap" aria-hidden="true">
            <div class="orig-clip">
              <section class="orig paper" aria-label="Texte d'origine de l'alinéa">
                <div class="head"><span>Texte de la commission</span><span id="origHead"></span></div>
                <div class="body"><p id="origText"></p></div>
                <p class="legend" id="origLegend"></p>
              </section>
            </div>
          </div>
          <div class="drum" id="drumAl" aria-label="Vos amendements, alinéa par alinéa"></div>
        </div>
      </div>
      <div class="layer layer-pt" id="lPt">
        <p class="pile-title" id="ptTitle"></p>
        <div class="drum" id="drumPt" aria-label="Votre rédaction, passage par passage"></div>
      </div>
    </div>
    <div class="pane pane-others" id="pOthers" aria-label="Les autres groupes">
      <p class="pile-title" id="otTitle"></p>
      <div class="zoomer" id="otZoomer">
        <div class="orig-wrap" aria-hidden="true">
          <div class="orig-clip">
            <section class="orig paper" aria-label="Texte d'origine de l'alinéa">
              <div class="head"><span>Texte de la commission</span><span id="origOtHead"></span></div>
              <div class="body"><p id="origOtText"></p></div>
              <p class="legend" id="origOtLegend"></p>
            </section>
          </div>
        </div>
        <div class="drum" id="drumOt"></div>
      </div>
    </div>
    <div class="pane pane-lib" id="pLib" aria-label="Comparer les rédactions">
      <p class="pile-title" id="libTitle"></p>
      <div class="lib-wrap" id="libWrap">
        <div class="lib-col"><div class="lib-list" id="libList" role="group" aria-label="Bibliothèque des rédactions"></div></div>
        <aside class="sel-col" aria-label="Sélection">
          <p class="sel-title"><span id="selCount"></span><button type="button" class="lnk" id="selClear">tout retirer</button></p>
          <p class="sel-note">surligné : écart avec le texte de la commission</p>
          <div class="sel-list" id="selList"></div>
        </aside>
      </div>
    </div>
  </div>

  <nav class="rail" id="rail" aria-label="Position dans la pile"></nav>

  <button class="handle top" id="hTop" type="button"></button>
  <button class="handle left" id="hLeft" type="button"></button>
  <button class="handle right" id="hRight" type="button"></button>

  <span class="hint" id="hint"></span>
</div>

<script>
(function(){
"use strict";
/* ---------- Données (fictives) ---------- */
const GROUPS = {
  PR:{name:"Progrès républicain", color:"#c07a00"}, SOL:{name:"Solidarité et logement", color:"#d13a30"}, ECO:{name:"Écologie urbaine", color:"#2a9d63"},
  UT:{name:"Union des territoires", color:"#3b82d6"}, LL:{name:"Libertés locales", color:"#e0671d"}, RC:{name:"Rassemblement des communes", color:"#7c5cd6"},
  GOUV:{name:"Gouvernement", color:"#9aa3b2"}, DC:{name:"Démocratie communale", color:"#2bb3b1"}, AR:{name:"Avenir rural", color:"#8fae3a"}, CP:{name:"Centre et progrès", color:"#d8699a"}
};
const ME = "PR";
// Chaque alinéa porte ses passages : une règle qui les retrouve dans n'importe quelle rédaction (la mienne, celle des autres).
const ARTICLE = { titre:"Projet de loi portant diverses mesures pour l'accès au logement", num:"Article 4", alineas:[
  {n:1, chapeau:true, texte:"Le chapitre II du titre préliminaire du livre III du code de la construction et de l'habitation est ainsi modifié :"},
  {n:2, texte:"Les communes de plus de 3 500 habitants doivent compter au moins 25 % de logements sociaux parmi les résidences principales d'ici 2030. En cas de manquement, le préfet peut prononcer un prélèvement sur les ressources fiscales de la commune.",

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- Écart mot à mot entre deux rédactions ---------- */
// Les guillemets « » qui encadrent une rédaction proposée ne comptent pas comme un écart.
const isWs=t=>/^\s+$/.test(t), isQuote=t=>t==="«"||t==="»";
const norm=t=>t.replace(/’/g,"'").toLowerCase();
function tokenize(s){ return s.match(/\s+|[\p{L}\p{N}'’%]+|[^\s\p{L}\p{N}'’%]/gu)||[]; }
function lcsKeep(a,b){ // pour chaque mot, true s'il appartient à la plus longue sous-suite commune
  const n=a.length, m=b.length, ka=new Array(n).fill(false), kb=new Array(m).fill(false);
  if(n*m>4e6) return [ka,kb];
  const L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j]= a[i]===b[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  let i=0, j=0;
  while(i<n&&j<m){ if(a[i]===b[j]){ ka[i]=kb[j]=true; i++; j++; } else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
  return [ka,kb];
}
function marked(tokens,keep,tag){ // regroupe les mots modifiés contigus dans une seule balise
  let out="", open=false;
  const nextWord=k=>{ for(let x=k+1;x<tokens.length;x++) if(!isWs(tokens[x])) return x; return -1; };
  tokens.forEach((t,k)=>{
    if(isWs(t)){ if(open){ const nx=nextWord(k); if(nx<0||keep[nx]!==false){ out+=`</${tag}>`; open=false; } } out+=esc(t); return; }
    const changed=keep[k]===false;
    if(changed&&!open){ out+=`<${tag}>`; open=true; } else if(!changed&&open){ out+=`</${tag}>`; open=false; }
    out+=esc(t);
  });
  return open? out+`</${tag}>` : out;
}
function compare(orig,mine){
  const ta=tokenize(orig), tb=tokenize(mine), ia=[], ib=[];
  ta.forEach((t,k)=>{ if(!isWs(t)&&!isQuote(t)) ia.push(k); });
  tb.forEach((t,k)=>{ if(!isWs(t)&&!isQuote(t)) ib.push(k); });
  const [ka,kb]=lcsKeep(ia.map(k=>norm(ta[k])), ib.map(k=>norm(tb[k])));
  const keepA=[], keepB=[]; ia.forEach((k,x)=>keepA[k]=ka[x]); ib.forEach((k,x)=>keepB[k]=kb[x]);
  return { origHTML:marked(ta,keepA,"del"), mineHTML:marked(tb,keepB,"ins"), same:ka.every(Boolean)&&kb.every(Boolean), del:ka.some(v=>!v), ins:kb.some(v=>!v) };
}

/* ---------- Passages ---------- */
function findPoints(a,text){
  const out=[];
  for(const P of a.points){ const m=P.re.exec(text); if(m) out.push({k:P.k,label:P.label,start:m.index,end:m.index+m[0].length,text:m[0]}); }
  out.sort((x,y)=>x.start-y.start);
  return out.filter((x,i,arr)=>!i||x.start>=arr[i-1].end);
}
const passageOf=(a,k,text)=>{ const p=findPoints(a,text).find(x=>x.k===k); return p?p.text:null; };
const labelOf=(a,k)=>(a.points.find(P=>P.k===k)||{label:""}).label;
const pnorm=s=>s.replace(/’/g,"'").replace(/\s+/g," ").trim().toLowerCase();
function effText(a,o){ if(o.mode==="supprimer") return ""; if(o.mode==="completer") return a.texte+" "+o.texte.replace(/^«\s*|\s*»$/g,""); return o.texte; }
function pointMarks(a,text){
  let out="", i=0;
  for(const p of findPoints(a,text)){ out+=esc(text.slice(i,p.start))+`<mark class="pt" data-k="${p.k}" title="${esc(p.label)} : cliquer pour isoler">${esc(p.text)}</mark>`; i=p.end; }
  return out+esc(text.slice(i));
}
const othersOf=i=>OTHERS[AMEND[i].n]||[];
function versions(i,k){ // les rédactions des autres pour ce passage ; celles identiques à la mienne sont mises à part
  const a=AMEND[i], mine=passageOf(a,k,MINE[i].texte)||"", list=[], same=[];
  for(const o of othersOf(i)){ const p=o.mode==="supprimer"?null:passageOf(a,k,effText(a,o)); if(p!=null&&pnorm(p)===pnorm(mine)) same.push(o); else list.push({o,p}); }
  return {mine,list,same};
}

const strip=t=>t.replace(/^«\s*|\s*»$/g,"");
// corrections apparentes dans un seul texte : ce que la référence a et pas moi (barré), ce que j'ai et pas elle (surligné)
function inlineDiff(ref,mine){
  const units=s=>{ const u=[]; let lead=""; for(const t of tokenize(s)){ if(isWs(t)){ if(u.length) u[u.length-1].ws+=t; else lead+=t; } else if(!isQuote(t)) u.push({w:t,ws:""}); } return u; };
  const A=units(ref), B=units(mine);
  const [ka,kb]=lcsKeep(A.map(x=>norm(x.w)), B.map(x=>norm(x.w)));
  const ops=[]; const push=(type,text)=>{ const l=ops[ops.length-1]; if(l&&l.type===type) l.text+=text; else ops.push({type,text}); };
  let i=0, j=0;
  while(i<A.length||j<B.length){
    if(i<A.length&&!ka[i]){ push("del",A[i].w+A[i].ws); i++; }
    else if(j<B.length&&!kb[j]){ push("ins",B[j].w+B[j].ws); j++; }
    else if(i<A.length&&j<B.length){ push("eq",B[j].w+B[j].ws); i++; j++; }
    else break;
  }
  return ops.map((o,k)=>{
    if(o.type==="eq") return esc(o.text);
    const m=o.text.match(/^([\s\S]*?)(\s*)$/), glue=o.type==="del"&&!m[2]&&ops[k+1]&&ops[k+1].type==="ins"?"\u2009":""; // « 2028 2030 » plutôt que « 20282030 »
    return `<${o.type}>${esc(m[1])}</${o.type}>${m[2]}${glue}`;
  }).join("");
}

/* ---------- La pile : un tambour de feuilles ---------- */
// pos est continu : on fait défiler petit à petit, puis ça se cale. La feuille du dessus bascule en arrière (pivot sur son bord bas),
// celle du dessous attend, inclinée (pivot sur son bord haut). dim < 1 estompe les voisines (édition, texte d'origine).
const GAP=24, TILT=62;
class Drum{
  constructor(el,onMove){ this.el=el; this.faces=[]; this.pos=0; this.raw=0; this.raf=0; this.fraf=0; this.dim=1; this.last=-1; this.onMove=onMove||(()=>{}); this.ro=new ResizeObserver(()=>this.layout()); }
  get n(){ return this.faces.length; }
  get cur(){ return clamp(Math.round(this.pos),0,Math.max(0,this.n-1)); }
  set(html,idx){
    cancelAnimationFrame(this.raf);
    this.el.innerHTML=html.join(""); this.faces=[...this.el.children]; this.faces.forEach((f,i)=>f.dataset.i=i);
    this.pos=this.raw=clamp(idx||0,0,Math.max(0,this.n-1)); this.last=-1;
    this.ro.disconnect(); this.faces.forEach(f=>this.ro.observe(f));
    this.layout();
  }
  step(){ const f=this.faces[this.cur]; return (f?f.offsetHeight:300)+GAP; }
  layout(){
    if(!this.n){ this.el.style.height="0px"; return; }
    const c=this.cur, H=this.faces[c].offsetHeight;
    this.el.style.height=H+"px";
    this.faces.forEach((f,i)=>{
      const d=i-this.pos, ad=Math.abs(d);
      f.style.transformOrigin= d<0 ? "50% 100%" : "50% 0%";
      f.style.transform=`translateY(${(d*(H+GAP)).toFixed(1)}px) rotateX(${(-clamp(d,-1,1)*TILT).toFixed(2)}deg)`;
      let op= ad<=1 ? 1-.55*ad : Math.max(0,.45*(2-ad));
      op*= this.dim+(1-this.dim)*clamp(1-ad,0,1);
      f.style.opacity=op.toFixed(3);
      f.style.visibility= op<.02 ? "hidden" : "";
      f.style.zIndex=String(100-Math.round(ad*10));
      f.classList.toggle("cur",i===c); f.setAttribute("aria-hidden",String(i!==c));
    });
    if(c!==this.last){ this.last=c; this.onMove(c); }
  }
  to(t){
    t=clamp(t,0,Math.max(0,this.n-1)); cancelAnimationFrame(this.raf); this.raw=t;
    if(reduced){ this.pos=t; this.layout(); return; }
    const tick=()=>{ this.pos+=(t-this.pos)*.2; if(Math.abs(t-this.pos)<.002){ this.pos=t; this.layout(); return; } this.layout(); this.raf=requestAnimationFrame(tick); };
    this.raf=requestAnimationFrame(tick);
  }
  fade(t){
    cancelAnimationFrame(this.fraf);
    if(reduced||this.dim===t){ this.dim=t; this.layout(); return; }
    const tick=()=>{ this.dim+=(t-this.dim)*.22; if(Math.abs(t-this.dim)<.01){ this.dim=t; this.layout(); return; } this.layout(); this.fraf=requestAnimationFrame(tick); };
    this.fraf=requestAnimationFrame(tick);
  }
  begin(){ cancelAnimationFrame(this.raf); this.raw=this.pos; return this.cur; }
  rubber(v){ const m=this.n-1; return v<0 ? v*.3 : v>m ? m+(v-m)*.3 : v; }
  move(px){ this.raw+=px/this.step(); this.pos=this.rubber(this.raw); this.layout(); }
  dragTo(from,px){ this.raw=from+px/this.step(); this.pos=this.rubber(this.raw); this.layout(); }
  snap(start,v){ // un petit mouvement suffit à passer à la feuille suivante ; un geste ample peut en sauter plusieurs
    v=v||0; const moved=this.pos-start; let t=start;
    if(Math.abs(moved)>.12||Math.abs(v)>1.2){ const proj=Math.round(this.pos+v*.12); t= moved+v*.1>0 ? Math.max(start+1,proj) : Math.min(start-1,proj); }
    this.to(t);
  }
}

function alFace(i){
  const a=AMEND[i];
  return `<section class="sheet paper face al" aria-label="Votre amendement sur l'alinéa ${a.n}"><div class="head">${myBadge()}<span>${esc(MINE[i].numero)} · ${ARTICLE.num}, alinéa ${a.n}</span></div><p class="lead">Rédiger ainsi l'alinéa ${a.n} :</p><div class="body"><p class="txt"></p></div><div class="foot"></div></section>`;
}
function paintAl(i){
  const f=dAl.faces[i]; if(!f||f.classList.contains("editing")) return;
  const a=AMEND[i], t=MINE[i].texte, origin=S.mode==="origin";
  f.querySelector(".txt").innerHTML= origin ? compare(a.texte,t).mineHTML : pointMarks(a,t);
  f.querySelector(".foot").innerHTML=`<span>${origin?"Cliquer sur le texte pour le modifier : les écarts s'affichent en direct":"Cliquer sur un surlignage pour l'isoler · double-clic pour modifier"}</span>`;
}
function legendFor(d,who){
  return d.same ? `${who} reprend cet alinéa à l'identique.`
    : [d.del?`<del>barré</del> : ce que ${who.toLowerCase()} supprime`:"", d.ins?`<ins>surligné</ins> dans la feuille : ce qu'il ajoute`:""].filter(Boolean).join(" · ");
}
function paintOrig(text){
  const a=AMEND[curAl()], d=compare(a.texte,text);
  $("#origHead").textContent=`${ARTICLE.num} · alinéa ${a.n}`;
  $("#origText").innerHTML=d.origHTML;
  $("#origLegend").innerHTML= d.same ? "Votre amendement reprend cet alinéa à l'identique. Modifiez votre texte : les écarts apparaissent ici en direct." : legendFor(d,"Votre amendement");
}
function buildPt(k){
  const i=curAl(), a=AMEND[i]; S.pts=findPoints(a,MINE[i].texte);
  $("#ptTitle").innerHTML=`${ARTICLE.num}, alinéa ${a.n} · <b>votre rédaction</b>, passage par passage`;
  dPt.set(S.pts.map((p,j)=>`<section class="sheet paper face passage" aria-label="${esc(p.label)}"><div class="head">${myBadge()}<span>Alinéa ${a.n}</span></div><div class="body"><p class="ptxt">${esc(p.text)}</p></div><div class="foot"><span class="tag"><i></i><b>${esc(p.label)}</b> passage ${j+1} sur ${S.pts.length}</span></div></section>`),
    Math.max(0,S.pts.findIndex(p=>p.k===k)));
}

/* ---------- La pile des autres ---------- */
// leurs amendements sur l'alinéa (avec, au dézoom, leur écart à l'origine), ou leurs rédactions du passage
function buildOt(focus){
  if(focus===undefined) focus=curOtNum();
  const i=curAl(), a=AMEND[i];
  if(S.mode==="passage"){
    const p=curPt(), v=versions(i,p.k), n=v.list.length;
    $("#otTitle").innerHTML=`${esc(p.label)} · alinéa ${a.n} · <b>${n}</b> ${plural(n,"autre rédaction","autres rédactions")}`+(v.same.length>2?` · ${v.same.length} groupes gardent la vôtre`:v.same.length?` · ${plural(v.same.length,"garde","gardent")} la vôtre : ${v.same.map(o=>esc(GROUPS[o.g].name)+(o.g===ME?` (n° ${o.num})`:"")).join(", ")}`:"");
    const html=v.list.map(({o,p:t},j)=>`<section class="sheet paper face passage" data-num="${o.num}"><div class="head">${badge(o)}<span>N° ${o.num}</span></div><div class="body"><p class="ptxt${t==null?" none":""}">${t==null?"Supprime ce point":compare(v.mine,t).mineHTML}</p></div><div class="foot"><span class="tag"><i></i><b>${esc(p.label)}</b> rédaction ${j+1} sur ${n}</span></div></section>`);
    dOt.set(html.length?html:[`<section class="sheet paper face passage"><div class="body"><p class="ptxt none">Tous les groupes gardent votre rédaction.</p></div></section>`], Math.max(0,v.list.findIndex(x=>x.o.num===focus)));
  } else {
    const os=othersOf(i), n=os.length, origin=S.mode==="origin";
    $("#otTitle").innerHTML=`${ARTICLE.num}, alinéa ${a.n} · <b>${n}</b> ${plural(n,"amendement","amendements")} d'autres groupes`+(origin?" · écart avec le texte de la commission":"");
    dOt.set(os.map((o,j)=>{
      const lead=o.mode==="supprimer"?"Supprimer cet alinéa.":o.mode==="completer"?`Compléter l'alinéa ${a.n} par la phrase suivante :`:`Rédiger ainsi l'alinéa ${a.n} :`;
      const body= o.mode==="supprimer" ? `<span class="none">L'alinéa ${a.n} serait supprimé.</span>`
        : !origin ? pointMarks(a,o.texte) : o.mode==="completer" ? `<ins>${esc(o.texte)}</ins>` : compare(a.texte,o.texte).mineHTML;
      return `<section class="sheet paper face other" data-num="${o.num}"><div class="head">${badge(o)}<span>N° ${o.num}${o.note?` · ${esc(o.note)}`:""}</span></div><p class="lead">${esc(lead)}</p><div class="body"><p class="txt">${body}</p></div><div class="foot"><span>Objet : ${esc(o.titre)}</span><span class="count">${j+1} / ${n}</span></div></section>`;
    }), Math.max(0,os.findIndex(o=>o.num===focus)));
  }
  dOt.fade(S.mode==="origin"?0:1);
  paintOrigOt();
}
function paintOrigOt(){
  if(S.mode!=="origin"||S.pane!==1) return;
  const a=AMEND[curAl()], o=othersOf(curAl()).find(x=>x.num===curOtNum()); if(!o) return;
  $("#origOtHead").textContent=`${ARTICLE.num} · alinéa ${a.n}`;
  let text, legend;
  if(o.mode==="supprimer"){ text=`<del>${esc(a.texte)}</del>`; legend="Cet amendement supprime l'alinéa."; }
  else if(o.mode==="completer"){ text=esc(a.texte); legend="Cet amendement garde l'alinéa et le complète : la phrase ajoutée est surlignée dans sa feuille."; }
  else { const d=compare(a.texte,o.texte); text=d.origHTML; legend=legendFor(d,"Cet amendement"); }
  $("#origOtText").innerHTML=text; $("#origOtLegend").innerHTML=legend;
}

/* ---------- Tout l'article ---------- */
function refGroups(){ const gs=[]; for(const n of Object.keys(OTHERS)) for(const o of OTHERS[n]) if(!gs.includes(o.g)) gs.push(o.g); return gs; }
function groupAl(a,g){ // la version d'un groupe pour cet alinéa : son amendement s'il en a un, sinon le texte de la commission
  if(g==="orig") return {text:a.texte,o:null};
  const o=(OTHERS[a.n]||[]).find(x=>x.g===g); if(!o) return {text:a.texte,o:null};
  return {text:o.mode==="supprimer"?"":o.mode==="completer"?a.texte+" "+strip(o.texte):strip(o.texte),o};
}
function renderArticle(){
  const ref=S.ref, gname=ref==="orig"?"":GROUPS[ref].name+(ref===ME?" (vos collègues)":"");
  $("#artTitle").innerHTML=`${ARTICLE.num} en entier · <b>votre version</b>`;
  $("#refs").innerHTML=`<span class="refs-lbl">Écarts avec</span>`+[["orig","#6b6457","Texte de la commission"],...refGroups().map(g=>[g,GROUPS[g].color,GROUPS[g].name+(g===ME?" (collègues)":"")])]
    .map(([id,c,l])=>`<button type="button" class="chip" data-ref="${id}" aria-pressed="${id===ref}" style="--g:${c}"><i></i>${esc(l)}</button>`).join("");
  const legend= ref==="orig" ? "<del>barré</del> : texte de la commission que vous retirez · <ins>surligné</ins> : ce que vous ajoutez · cliquer un alinéa pour y aller"
    : `<del>barré</del> : rédaction de ${esc(gname)} absente de la vôtre · <ins>surligné</ins> : propre à votre texte · sans amendement de ce groupe, la référence reste le texte de la commission`;
  const rows=ARTICLE.alineas.map(a=>{
    if(a.chapeau) return `<li><span class="n">${a.n}</span><div>${esc(a.texte)}</div></li>`;
    const i=AMEND.indexOf(a), mine=strip(MINE[i].texte), G=groupAl(a,ref), n=othersOf(i).length;
    const body= G.o&&G.o.mode==="supprimer" ? esc(mine) : inlineDiff(G.text,mine);
    const meta= ref==="orig" ? `${n} ${plural(n,"amendement","amendements")} d'autres groupes`
      : !G.o ? `pas d'amendement de ce groupe : comparé au texte de la commission`
      : G.o.mode==="supprimer" ? `ce groupe supprime l'alinéa (n° ${G.o.num})` : `amendement n° ${G.o.num} · ${esc(G.o.titre)}`;
    return `<li data-i="${i}" class="${i===curAl()?"here":""}" title="Aller à l'alinéa ${a.n}"><span class="n">${a.n}</span><div>${body}</div><span class="meta">${meta}</span></li>`;
  }).join("");
  $("#art").innerHTML=`<div class="head"><span>${esc(ARTICLE.titre)}</span><span>Votre version</span></div><h2>${ARTICLE.num}</h2><p class="legend">${legend}</p><ol>${rows}</ol>`;
}

/* ---------- Comparer : bibliothèque et sélection ---------- */
// La bibliothèque défile au centre ; ce qu'on y choisit s'affiche à droite, en petit. La sélection survit au changement d'échelle.
function libEntries(){
  const i=curAl(), a=AMEND[i], p=S.mode==="passage"?curPt():null, at=t=>p?passageOf(a,p.k,t):t;
  return [
    {id:"orig",color:"#6b6457",label:"Texte de la commission",sub:"origine",text:at(a.texte)},
    {id:"mine",color:GROUPS[ME].color,label:GROUPS[ME].name,sub:"vous",text:at(strip(MINE[i].texte))},
    ...othersOf(i).map(o=>({id:o.num,color:GROUPS[o.g].color,label:GROUPS[o.g].name,sub:`N° ${o.num}`,objet:o.titre,
      text:o.mode==="supprimer"?null:p?passageOf(a,p.k,effText(a,o)):o.mode==="completer"?a.texte+" "+strip(o.texte):strip(o.texte)}))
  ];
}
function renderLib(){
  if(S.libAl!==curAl()){ S.libAl=curAl(); S.libSel=new Set(); }
  const a=AMEND[curAl()], p=S.mode==="passage"?curPt():null, E=S.libE=libEntries(), gone=p?"Supprime ce point":"Supprime l'alinéa";
  $("#libTitle").innerHTML=`${p?`<b>${esc(p.label)}</b> · `:""}alinéa ${a.n} · <b>${E.length}</b> rédactions · cliquez pour comparer`;
  $("#libList").innerHTML=E.map(e=>{ const on=S.libSel.has(e.id); return `<article class="lib-item paper${on?" on":""}" data-id="${esc(e.id)}" tabindex="0" role="checkbox" aria-checked="${on}"><div class="head"><span class="group-badge" style="--g:${e.color}"><i></i><span class="name">${esc(e.label)}</span></span><span>${esc(e.sub)}${on?` · <b class="in">✓ comparé</b>`:""}</span></div><p class="lib-text${e.text==null?" none":""}">${e.text==null?gone:esc(e.text)}</p>${e.objet&&!p?`<p class="lib-objet">Objet : ${esc(e.objet)}</p>`:""}</article>`; }).join("");
  renderSel();
}
function renderSel(){
  const E=S.libE, sel=[...S.libSel].map(id=>E.find(e=>e.id===id)).filter(Boolean), ref=E[0].text||"", gone=S.mode==="passage"?"Supprime ce point":"Supprime l'alinéa";
  $("#pLib").classList.toggle("has-sel",sel.length>0);
  $("#selCount").innerHTML=`<b>${sel.length}</b> ${plural(sel.length,"rédaction comparée","rédactions comparées")}`;
  $("#selList").innerHTML=sel.map(e=>`<div class="sel-card paper"><div class="sel-head"><i style="--g:${e.color}"></i><b>${esc(e.label)}</b><span>${esc(e.sub)}</span><button type="button" class="x" data-x="${esc(e.id)}" aria-label="Retirer ${esc(e.label)} de la comparaison">×</button></div><p class="sel-text${e.text==null?" none":""}">${e.text==null?gone:e.id==="orig"?esc(e.text):compare(ref,e.text).mineHTML}</p></div>`).join("");
}
function toggleLib(id){
  S.libSel.has(id)?S.libSel.delete(id):S.libSel.add(id);
  const it=$(`#libList .lib-item[data-id="${CSS.escape(id)}"]`), on=S.libSel.has(id), e=S.libE.find(x=>x.id===id);
  if(it){ it.classList.toggle("on",on); it.setAttribute("aria-checked",String(on)); it.querySelector(".head > span:last-child").innerHTML=esc(e.sub)+(on?` · <b class="in">✓ comparé</b>`:""); }
  renderSel(); chrome();
}

/* ---------- Échelles et volets ---------- */
const LAYERS=[[$("#lAl"),0,["alinea","origin"]],[$("#lPt"),1,["passage"]]];
function setMode(m,o){
  o=o||{};
  if(S.edit>=0&&m==="passage") closeEditor(false);
  const prev=S.mode; S.mode=m; stage.dataset.mode=m;
  const depth=LAYERS.find(L=>L[2].includes(m))[1];
  for(const [el,dp,modes] of LAYERS){ const on=modes.includes(m); el.classList.toggle("on",on); el.classList.toggle("shallow",!on&&dp<depth); el.setAttribute("aria-hidden",String(!on)); }
  document.querySelectorAll(".orig-wrap").forEach(w=>w.setAttribute("aria-hidden",String(m!=="origin")));
  dAl.fade(m==="origin"||S.edit>=0?0:1);
  AMEND.forEach((_,i)=>paintAl(i));
  if(m==="origin"&&S.edit<0) paintOrig(MINE[curAl()].texte);
  if(S.edit>=0) onEdit();
  const scaleJump=(m==="passage")!==(prev==="passage"), dir=DEPTH[m]-DEPTH[prev];
  if(S.pane===1){ buildOt(o.focus); if(scaleJump) pop($("#otZoomer"),dir); }
  if(S.pane===2){ renderLib(); if(scaleJump) pop($("#libWrap"),dir); }
  chrome();
}
function setPane(p){
  p=clamp(p,-1,2);
  if(p===S.pane||(p===2&&S.pane!==1)) return;
  if(S.edit>=0) closeEditor(false);
  S.pane=p; stage.dataset.pane=PANE_NAME[p];
  for(const [k,el] of Object.entries(PANE_EL)){ const rel=+k-p; el.style.setProperty("--rel",rel); el.classList.toggle("on",rel===0); el.setAttribute("aria-hidden",String(rel!==0)); }
  if(p===-1) renderArticle();
  if(p===1) buildOt();
  if(p===2){ if(S.mode==="origin"){ setMode("alinea"); return; } renderLib(); }
  chrome();
}
function enterPassage(k,focus){
  const i=curAl(); if(!findPoints(AMEND[i],MINE[i].texte).length) return;
  if(S.edit>=0) closeEditor(false);
  buildPt(k); setMode("passage",{focus});
}
// zoomer descend d'un cran (origine → alinéa → passage), dézoomer remonte d'un cran (passage → alinéa → origine)
function zoomStep(dir,k){
  if(S.pane===-1) return;
  const m=S.mode;
  if(dir<0){ if(m==="passage") setMode("alinea"); else if(m==="alinea"&&S.pane!==2) setMode("origin"); }
  else { if(m==="origin") setMode("alinea"); else if(m==="alinea"&&S.edit<0) enterPassage(k||S.lastPt[curAl()]); }
}
// Échap revient d'un cran : la bibliothèque ou l'article vers leur voisin, puis l'échelle, puis le volet
function back(){
  if(S.pane===2){ setPane(1); return; }
  if(S.pane===-1){ setPane(0); return; }
  if(S.mode!=="alinea"){ setMode("alinea"); return; }
  if(S.pane===1) setPane(0);
}
function onAlMove(){ if(S.mode==="origin"){ AMEND.forEach((_,i)=>paintAl(i)); paintOrig(MINE[curAl()].texte); } chrome(); }
function onPtMove(){ const p=curPt(); if(p) S.lastPt[curAl()]=p.k; chrome(); }

/* ---------- Poignées, aide, repères ---------- */
function setHandle(h,html){ h.classList.toggle("hide",html==null); h.setAttribute("aria-hidden",String(html==null)); h.tabIndex=html==null?-1:0; if(html!=null) h.innerHTML=html; }
function chrome(){
  const P=S.pane, i=curAl(), a=AMEND[i], m=S.mode, p=curPt(), atP=m==="passage"&&!!p;
  setHandle(hTop, P===-1 ? null
    : P===2 ? (atP?`<b>${esc(p.label)}</b> revenir à l'alinéa <span class="zg">⊖</span>`:`<b>Alinéa ${a.n}</b> passage par passage <span class="zg">⊕</span>`)
    : m==="alinea" ? `<b>Alinéa ${a.n}</b> texte d'origine <span class="zg">⊖</span>`
    : m==="origin" ? `<b>Alinéa ${a.n}</b> revenir <span class="zg">⊕</span>`
    : `<b>${esc(p?p.label:"")}</b> revenir à l'alinéa <span class="zg">⊖</span>`);
  const nOt= atP ? versions(i,p.k).list.length : othersOf(i).length, chev=` <span class="chev">▲</span>`;
  setHandle(hLeft, P===-1 ? null : (P===0?`<b>Tout</b> l'article`:P===1?(atP?`<b>Ma</b> rédaction`:`<b>Mon</b> amendement`):`<b>La</b> pile`)+chev);
  setHandle(hRight, P===2 ? null : (P===-1?`<b>Mon</b> amendement`:P===0?`<b>${nOt}</b> ${atP?plural(nOt,"autre rédaction","autres rédactions"):plural(nOt,"autre amendement","autres amendements")}`:`<b>Comparer</b> côte à côte`)+chev);
  $("#hint").innerHTML=
      P===-1 ? "<b>Défiler</b> : tout l'article · <b>clic sur un alinéa</b> : y aller · <b>vers la gauche</b> : votre amendement"
    : P===2 ? `<b>Défiler</b> : les rédactions · <b>clic</b> : comparer · <b>${atP?"pincer":"écarter"}</b> : ${atP?"l'alinéa":"un passage"} · <b>vers la droite</b> : la pile`
    : P===1 ? (m==="origin" ? "<b>Haut / bas</b> : les amendements · <b>écarter les doigts</b> ou <b>Échap</b> : revenir"
             : atP ? "<b>Haut / bas</b> : les autres rédactions · <b>pincer</b> : l'alinéa · <b>gauche</b> : comparer · <b>droite</b> : la vôtre"
             : "<b>Haut / bas</b> : les amendements · <b>pincer</b> : leur écart à l'origine · <b>gauche</b> : comparer · <b>droite</b> : le vôtre")
    : m==="origin" ? "<b>Haut / bas</b> : les alinéas · <b>clic sur votre texte</b> : modifier · <b>écarter les doigts</b> ou <b>Échap</b> : revenir"
    : atP ? "<b>Haut / bas</b> : les autres passages · <b>gauche</b> : ce passage chez les autres · <b>pincer</b> : l'alinéa"
    : "<b>Haut / bas</b> : les alinéas · <b>clic sur un surlignage</b> : l'isoler · <b>pincer</b> : le texte d'origine · <b>gauche</b> : les autres · <b>droite</b> : tout l'article";
  const d=verticalDrum();
  if(!d||d.n<2){ rail.innerHTML=""; return; }
  const labels= d===dAl ? AMEND.map(x=>`Alinéa ${x.n}`) : d===dPt ? S.pts.map(x=>x.label) : d.faces.map(f=>{ const o=othersOf(i).find(o=>o.num===f.dataset.num); return o?`${GROUPS[o.g].name}, n° ${o.num}`:""; });
  rail.innerHTML=labels.map((l,j)=>`<button type="button" data-i="${j}" class="${j===d.cur?"on":""}" aria-label="${esc(l)}" title="${esc(l)}"${j===d.cur?' aria-current="true"':""}></button>`).join("");
}

/* ---------- Édition en place ---------- */
// position du curseur dans le texte affiché, à l'endroit du clic
function caretOffset(e,root){
  let r=null;
  if(document.caretPositionFromPoint){ const p=document.caretPositionFromPoint(e.clientX,e.clientY); if(p){ r=document.createRange(); r.setStart(p.offsetNode,p.offset); } }
  else if(document.caretRangeFromPoint){ r=document.caretRangeFromPoint(e.clientX,e.clientY); }
  if(!r||!root||!root.contains(r.startContainer)) return null;
  const pre=document.createRange(); pre.selectNodeContents(root); pre.setEnd(r.startContainer,r.startOffset);
  return pre.toString().length;
}
function fit(){ const ta=$("#edText"); if(!ta) return; ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px"; }
function onEdit(){
  const ta=$("#edText"); if(!ta) return;
  const a=AMEND[S.edit], text=ta.value;
  $("#edMirror").innerHTML=(S.mode==="origin"?compare(a.texte,text).mineHTML:pointMarks(a,text))+(text.endsWith("\n")?" ":"");
  paintOrig(text); fit(); dAl.layout();
}
function openEditor(e){
  if(S.edit>=0||S.pane!==0||(S.mode!=="alinea"&&S.mode!=="origin")) return;
  const c=curAl(); if(Math.abs(dAl.pos-c)>.05) return;
  const f=dAl.faces[c], off=e?caretOffset(e,f.querySelector(".txt")):null;
  S.edit=c; stage.classList.add("editing"); f.classList.add("editing"); dAl.fade(0);
  f.querySelector(".body").innerHTML=`<div class="ed"><div class="mirror" id="edMirror" aria-hidden="true"></div><textarea id="edText" aria-label="Texte de l'amendement" spellcheck="false" rows="1"></textarea></div>`;
  f.querySelector(".foot").innerHTML=`<span>Échap pour annuler · Ctrl+Entrée pour valider</span><button type="button" data-act="cancel">Annuler</button><button type="button" class="primary" data-act="ok">Valider</button>`;
  const ta=$("#edText"); ta.value=MINE[c].texte;
  ta.addEventListener("keydown", e=>{ if(e.key==="Escape"){e.preventDefault();e.stopPropagation();closeEditor(false);} if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();e.stopPropagation();closeEditor(true);} });
  ta.addEventListener("input", onEdit);
  onEdit(); chrome();
  ta.focus({preventScroll:true}); const p=off==null?ta.value.length:off; ta.setSelectionRange(p,p);
}
function closeEditor(commit){
  if(S.edit<0) return;
  const i=S.edit, f=dAl.faces[i], v=$("#edText").value.trim();
  if(commit&&v) MINE[i].texte=v;
  S.edit=-1; stage.classList.remove("editing"); f.classList.remove("editing");
  f.querySelector(".body").innerHTML=`<p class="txt"></p>`;
  paintAl(i); paintOrig(MINE[i].texte); dAl.fade(S.mode==="origin"?0:1); chrome();
}

/* ---------- Clics ---------- */
let clickTimer=0;
$("#drumAl").addEventListener("click", e=>{
  const f=e.target.closest(".face"); if(!f) return;
  const act=e.target.closest("button[data-act]"); if(act){ closeEditor(act.dataset.act==="ok"); return; }
  const i=+f.dataset.i;
  if(i!==dAl.cur){ if(S.edit<0) dAl.to(i); return; }
  if(S.edit>=0) return;
  if(S.mode==="origin"){ if(e.target.closest(".body")) openEditor(e); return; }
  const mk=e.target.closest("mark.pt");
  if(mk){ clearTimeout(clickTimer); const k=mk.dataset.k; clickTimer=setTimeout(()=>enterPassage(k),260); } // laisse la place au double-clic
});
$("#drumAl").addEventListener("dblclick", e=>{ clearTimeout(clickTimer); const f=e.target.closest(".face"); if(f&&+f.dataset.i===dAl.cur&&e.target.closest(".body")) openEditor(e); });
$("#drumPt").addEventListener("click", e=>{ const f=e.target.closest(".face"); if(f&&+f.dataset.i!==dPt.cur) dPt.to(+f.dataset.i); });
$("#drumOt").addEventListener("click", e=>{
  const f=e.target.closest(".face"); if(!f) return;
  if(+f.dataset.i!==dOt.cur){ dOt.to(+f.dataset.i); return; }
  const mk=e.target.closest("mark.pt"); if(mk&&S.mode==="alinea") enterPassage(mk.dataset.k,f.dataset.num);
});
$("#art").addEventListener("click", e=>{ const li=e.target.closest("li[data-i]"); if(!li) return; if(S.mode==="passage") setMode("alinea"); dAl.to(+li.dataset.i); setPane(0); });
$("#refs").addEventListener("click", e=>{ const c=e.target.closest(".chip"); if(!c) return; S.ref=c.dataset.ref; const sc=$("#refs").scrollLeft; renderArticle(); $("#refs").scrollLeft=sc; });
$("#libList").addEventListener("click", e=>{ const it=e.target.closest(".lib-item"); if(it) toggleLib(it.dataset.id); });
$("#libList").addEventListener("keydown", e=>{ const it=e.target.closest(".lib-item"); if(it&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); e.stopPropagation(); toggleLib(it.dataset.id); } });
$("#selList").addEventListener("click", e=>{ const x=e.target.closest("[data-x]"); if(x) toggleLib(x.dataset.x); });
$("#selClear").addEventListener("click", ()=>{ S.libSel=new Set(); renderLib(); chrome(); });
rail.addEventListener("click", e=>{ const b=e.target.closest("button"), d=verticalDrum(); if(b&&d) d.to(+b.dataset.i); });
hTop.addEventListener("click", ()=>zoomStep(S.pane===2 ? (S.mode==="passage"?-1:1) : (S.mode==="origin"?1:-1)));
hLeft.addEventListener("click", ()=>setPane(S.pane-1));
hRight.addEventListener("click", ()=>setPane(S.pane+1));
window.addEventListener("resize", ()=>{ fit(); dAl.layout(); dPt.layout(); dOt.layout(); });
window.addEventListener("keydown", e=>{
  if(S.edit>=0||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==="Escape"){ back(); return; }
  if(e.target.closest&&e.target.closest("button,.lib-item")&&(e.key===" "||e.key==="Enter")) return;
  const d=verticalDrum();
  if((e.key==="ArrowDown"||e.key==="PageDown")&&d){ e.preventDefault(); d.to(Math.round(d.raw)+1); } // depuis la cible : deux appuis rapides = deux crans
  else if((e.key==="ArrowUp"||e.key==="PageUp")&&d){ e.preventDefault(); d.to(Math.round(d.raw)-1); }
  else if(e.key==="ArrowRight") setPane(S.pane+1);
  else if(e.key==="ArrowLeft") setPane(S.pane-1);
  else if(e.key==="Enter"&&S.pane>=0) zoomStep(1);
  else if(e.key==="-") zoomStep(-1);
  else if(e.key==="+"||e.key==="=") zoomStep(1);
});

/* ---------- Gestes : doigt ou souris ---------- */
// un doigt : vertical = la pile en cours (ailleurs, défilement natif), horizontal = volet voisin ;
// deux doigts qui se rapprochent = dézoomer, qui s'écartent = zoomer
const touches=new Map(); let g=null, pinch=null, suppressClick=false;
const dist=()=>{ const [a,b]=[...touches.values()]; return Math.hypot(a.x-b.x,a.y-b.y); };
stage.addEventListener("pointerdown", e=>{
  suppressClick=false;
  touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size===2){ if(g&&g.axis==="v"&&g.drum) g.drum.snap(g.start,0); g=null; const mk=e.target.closest("mark.pt"); pinch={d0:dist()||1,done:false,k:mk?mk.dataset.k:null}; return; }
  if(touches.size>1) return;
  if(e.target.closest(".handle,.rail,button,textarea,.refs")) return;
  if(S.edit>=0&&e.target.closest(".face.editing")) return;
  g={id:e.pointerId,x:e.clientX,y:e.clientY,axis:null,ly:e.clientY,lt:performance.now(),v:0};
});
stage.addEventListener("pointermove", e=>{
  const t=touches.get(e.pointerId); if(t){ t.x=e.clientX; t.y=e.clientY; }
  if(pinch){ if(touches.size>=2&&!pinch.done){ const r=dist()/pinch.d0; if(r<.78){ pinch.done=true; zoomStep(-1); } else if(r>1.28){ pinch.done=true; zoomStep(1,pinch.k); } } return; }
  if(!g||e.pointerId!==g.id) return;
  const dx=e.clientX-g.x, dy=e.clientY-g.y;
  if(!g.axis){
    if(Math.abs(dx)+Math.abs(dy)<8) return;
    g.axis=Math.abs(dy)>Math.abs(dx)?"v":"h";
    if(g.axis==="v"){ g.drum=verticalDrum(); if(!g.drum){ g=null; return; } g.start=g.drum.begin(); g.from=g.drum.pos; }
    suppressClick=true;
    try{ stage.setPointerCapture(e.pointerId); }catch(_){}
  }
  if(g.axis==="h"){ if(dx<-50){ setPane(S.pane+1); g=null; } else if(dx>50){ setPane(S.pane-1); g=null; } return; }
  const now=performance.now(), sp=g.drum.step();
  g.drum.dragTo(g.from,-dy);
  const dt=Math.max(1,now-g.lt); g.v=.7*g.v+.3*(-(e.clientY-g.ly)/sp)/(dt/1000); g.ly=e.clientY; g.lt=now;
});
function pointerEnd(e){
  touches.delete(e.pointerId);
  if(pinch){ if(touches.size<2) pinch=null; return; }
  if(g&&e.pointerId===g.id){ if(g.axis==="v") g.drum.snap(g.start,g.v); g=null; }
}
stage.addEventListener("pointerup",pointerEnd); stage.addEventListener("pointercancel",pointerEnd);
stage.addEventListener("click", e=>{ if(suppressClick){ suppressClick=false; e.stopPropagation(); e.preventDefault(); } }, true);

/* ---------- Gestes : pavé tactile ---------- */
// Pincer arrive en « wheel » avec ctrlKey (Chrome, Edge, Firefox) ou en gesture* (Safari) : un cran par geste.
// Deux doigts : le sens est verrouillé au début du geste ; dans une liste qui défile, le vertical lui revient.
let zw=null, zwT=0, wg=null, wgT=0;
const scrollsY=el=>el&&el.scrollHeight>el.clientHeight+1, scrollsX=el=>el&&el.scrollWidth>el.clientWidth+1;
stage.addEventListener("wheel", e=>{
  const kf=e.deltaMode===1?16:e.deltaMode===2?innerHeight:1, dx=e.deltaX*kf, dy=e.deltaY*kf;
  if(e.ctrlKey){
    e.preventDefault();
    if(!zw){ const mk=e.target.closest("mark.pt"); zw={acc:0,done:false,k:mk?mk.dataset.k:null}; }
    zw.acc+=dy;
    if(!zw.done){ if(zw.acc>24){ zw.done=true; zoomStep(-1); } else if(zw.acc<-24){ zw.done=true; zoomStep(1,zw.k); } }
    clearTimeout(zwT); zwT=setTimeout(()=>{ zw=null; },220);
    return;
  }
  if(e.target.closest("textarea")) return;
  const vertical=Math.abs(dy)>=Math.abs(dx);
  if(vertical&&!(wg&&wg.axis==="h")&&scrollsY(e.target.closest(".orig .body,.lib-list,.sel-list,.art-scroll"))) return;
  if(!vertical&&!(wg&&wg.axis==="v")&&scrollsX(e.target.closest(".refs,.sel-list"))) return;
  e.preventDefault();
  if(!wg) wg={ax:0,ay:0,axis:null,done:false,h:0};
  clearTimeout(wgT); wgT=setTimeout(endWheel,150);
  let ddx=dx, ddy=dy;
  if(!wg.axis){
    wg.ax+=dx; wg.ay+=dy;
    if(Math.abs(wg.ax)+Math.abs(wg.ay)<6) return;
    wg.axis=Math.abs(wg.ax)>Math.abs(wg.ay)?"h":"v"; ddx=wg.ax; ddy=wg.ay;
    if(wg.axis==="v"){ wg.drum=verticalDrum(); if(wg.drum) wg.start=wg.drum.begin(); }
  }
  if(wg.axis==="h"){
    if(wg.done) return; wg.h+=ddx;
    if(wg.h>90){ setPane(S.pane+1); wg.done=true; } else if(wg.h<-90){ setPane(S.pane-1); wg.done=true; }
    return;
  }
  if(wg.drum) wg.drum.move(ddy);
}, {passive:false});
function endWheel(){ if(wg&&wg.axis==="v"&&wg.drum) wg.drum.snap(wg.start,0); wg=null; }
let sg=null;
stage.addEventListener("gesturestart", e=>{ e.preventDefault(); sg=pinch?null:{done:false}; });
stage.addEventListener("gesturechange", e=>{ e.preventDefault(); if(!sg||sg.done) return; if(e.scale<.85){ sg.done=true; zoomStep(-1); } else if(e.scale>1.18){ sg.done=true; zoomStep(1); } });
stage.addEventListener("gestureend", e=>{ e.preventDefault(); sg=null; });

/* ---------- Départ ---------- */
for(const [k,el] of Object.entries(PANE_EL)) el.style.setProperty("--rel",+k);
dAl.set(AMEND.map((_,i)=>alFace(i)),0);
setMode("alinea");
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ dAl.layout(); dPt.layout(); dOt.layout(); });
})();
</script>

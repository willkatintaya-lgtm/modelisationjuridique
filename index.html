<title>Amendement en scène</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Scène 2D : une feuille au centre dans un espace sombre. Haut/bas fait défiler les idées principales de mon texte ;
   dézoomer fait apparaître l'alinéa d'origine ; les autres amendements remplacent la feuille, dans la même matière papier. */
:root{
  --bg:#0b0d12; --bg-2:#11141b; --fg:#e8e6df; --muted:#8a8f9b; --accent:#d9b56a; --accent-soft:rgba(217,181,106,.28); --line:#232733; --line-2:#2f3443;
  --paper:#f4f1e9; --paper-2:#e9e4d8; --paper-ink:#1d1a16; --paper-muted:#6b6457; --paper-line:#c9bfa6; --paper-frame:#ece7db;
  --f-ui:"IBM Plex Sans",system-ui,sans-serif; --f-legal:"Source Serif 4",Georgia,serif;
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden;font-size:14px}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 40%, #151924 0%, var(--bg) 60%),var(--bg)}
#stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;opacity:.25;
  mask-image:radial-gradient(ellipse at 50% 55%, #000 20%, transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 55%, #000 20%, transparent 75%)}

/* --- matière papier, partagée par toutes les feuilles --- */
.paper{background:linear-gradient(135deg,var(--paper),var(--paper-2));color:var(--paper-ink);border:1px solid var(--paper-line);outline:14px solid var(--paper-frame);outline-offset:-14px;
  box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(217,181,106,.25)}
.paper .head{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-muted);border-bottom:1px solid var(--paper-line);padding-bottom:8px}
.paper .lead{font:italic 400 15px var(--f-legal);color:var(--paper-muted);margin:4px 0 0}
.paper .body{font:400 clamp(17px,2.2vw,23px)/1.5 var(--f-legal);max-width:68ch}
.paper .body p{margin:0}
.group-badge{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.group-badge i{width:8px;height:8px;border-radius:50%;background:var(--g);display:inline-block;flex:none}

/* marques sur le papier : l'idée en cours (surlignée) ; les écarts avec l'origine (ajouté surligné / supprimé barré) */
.paper mark.idea,.paper ins{color:inherit;text-decoration:none;background:rgba(217,181,106,.5);border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.paper mark.idea{box-shadow:0 0 0 2px rgba(217,181,106,.5)}
.paper del{text-decoration:line-through 2px #a8452f;color:#7d7466;background:rgba(168,69,47,.08);border-radius:2px}

/* --- deux volets au centre : ma feuille / les autres --- */
.center{position:absolute;inset:0}
.pane{position:absolute;inset:0;padding:72px var(--gutter-r) 56px var(--gutter-l);transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s}
.pane-mine{display:flex;flex-direction:column;align-items:center;justify-content:center}
.pane-others{transform:translateX(60%);opacity:0;pointer-events:none;display:grid;justify-content:center;grid-template-columns:min(880px,100%)}
#stage.others .pane-mine{transform:translateX(-50%);opacity:0;pointer-events:none}
#stage.others .pane-others{transform:none;opacity:1;pointer-events:auto}
.zoomer{width:100%;display:flex;flex-direction:column;align-items:center;transform-origin:50% 50%}

/* --- ma feuille : un tambour de faces, même texte, une idée surlignée par face --- */
.drum{position:relative;width:100%;flex:none;perspective:1600px}
.sheet{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px;padding:34px 40px 26px;transition:box-shadow .35s}
.face{position:absolute;top:0;left:0;right:0;margin:0 auto;width:min(880px,100%);max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px);
  touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform,opacity}
.face:not(.cur){cursor:pointer}
.face.editing{user-select:text;-webkit-user-select:text}
.sheet.editing{box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 0 2px var(--accent)}
.sheet .body{overflow:auto;min-height:0}
.face.cur .body{cursor:text}
.sheet .foot{display:flex;justify-content:flex-end;gap:8px;align-items:center;min-height:30px}
.sheet .foot span{margin-right:auto;font-size:11.5px;color:#8a8070}
.sheet .foot .tag{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-muted)}
.sheet .foot .tag b{color:var(--paper-ink);font-weight:600}
.sheet .foot .tag i{width:8px;height:8px;border-radius:2px;background:var(--accent);flex:none}
.sheet button{font:500 13px var(--f-ui);border-radius:4px;padding:6px 14px;cursor:pointer;border:1px solid #a89c80;background:transparent;color:#4a4336}
.sheet button.primary{background:#2a2620;color:var(--paper);border-color:#2a2620}
.sheet button:focus-visible{outline:2px solid #2a2620;outline-offset:2px}
/* éditeur : une zone de saisie transparente posée sur un calque qui porte les marques */
.ed{position:relative}
.ed .mirror,.sheet textarea{font:inherit;letter-spacing:inherit;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;margin:0;padding:0;border:0}
.ed .mirror{position:absolute;inset:0;color:transparent;pointer-events:none;overflow:hidden}
.ed .mirror mark,.ed .mirror ins{color:transparent}
.sheet textarea{position:relative;color:inherit;background:transparent;resize:none;width:100%;min-height:3em;display:block;overflow:hidden;caret-color:var(--paper-ink)}
.sheet textarea:focus{outline:none}

/* repères du tambour, à gauche */
.rail{position:absolute;left:max(5px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);z-index:9;display:grid;gap:12px;transition:opacity .3s}
.rail button{position:relative;width:8px;height:8px;padding:0;border-radius:50%;border:1px solid #4a5062;background:transparent;cursor:pointer}
.rail button:first-child{border-radius:1px}
.rail button::after{content:"";position:absolute;inset:-7px}
.rail button.on{background:var(--accent);border-color:var(--accent)}
.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#stage.others .rail,#stage.zoomed .rail,#stage.editing .rail{opacity:0;pointer-events:none}

/* --- dézoom : l'alinéa d'origine, seul, au-dessus de ma feuille --- */
.orig-wrap{width:100%;flex:none;display:grid;grid-template-rows:0fr}
.orig-clip{min-height:0;overflow:hidden;margin:0 -40px;padding:0 40px 24px}
.orig{width:min(880px,100%);margin:0 auto;display:grid;gap:10px;padding:24px 32px 18px;opacity:0;
  box-shadow:0 14px 34px rgba(0,0,0,.55), 0 0 0 1px rgba(217,181,106,.25)}
.orig .body{font:400 clamp(16px,1.9vw,20px)/1.5 var(--f-legal);max-width:none;max-height:28vh;overflow:auto;touch-action:pan-y;padding:4px 10px 4px 14px;background:rgba(217,181,106,.16);box-shadow:inset 4px 0 0 var(--accent);border-radius:2px}
.orig .legend{font:400 12px/1.45 var(--f-ui);color:var(--paper-muted);margin:0}
.orig .legend ins,.orig .legend del{padding:0 3px}

/* --- les autres : colonne de boîtes papier, défilement avec inertie --- */
.scroller{position:relative;overflow:hidden;cursor:grab;touch-action:none;min-width:0}
.scroller.grabbing{cursor:grabbing}
.list{position:absolute;left:0;right:0;top:0;padding:4px 0 40px;display:grid;gap:18px;will-change:transform}
.list .title{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-align:center;margin-bottom:4px}
.box{padding:22px 28px 20px;display:grid;gap:10px;transition:outline-color .25s}
.box .head{padding-bottom:0;border-bottom:0}
.box.open .head{padding-bottom:8px;border-bottom:1px solid var(--paper-line)}
.box .name{font:600 clamp(18px,2vw,22px)/1.2 var(--f-legal);color:var(--paper-ink);letter-spacing:0;text-transform:none}
.box .num{font-size:11px;letter-spacing:.1em;color:var(--paper-muted)}
.box .more{width:34px;height:34px;border-radius:50%;border:1px solid #a89c80;background:transparent;color:#4a4336;font:400 22px/1 var(--f-legal);cursor:pointer;display:grid;place-items:center;flex:none;transition:background .2s,color .2s,transform .3s}
.box .more:hover{background:#2a2620;color:var(--paper)}
.box .more:focus-visible{outline:2px solid #2a2620;outline-offset:2px}
.box.open .more{transform:rotate(45deg)}
.box .detail{display:none;grid-template-rows:auto auto;gap:10px}
.box.open .detail{display:grid}
.box .detail .meta{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-muted);margin-top:6px}
.box .objet{font:italic 400 15px var(--f-legal);color:var(--paper-muted);margin:0}
.box.open .objet{display:none}

/* --- poignées --- */
.handle{position:absolute;z-index:10;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  background:rgba(11,13,18,.7);border:1px solid var(--line-2);backdrop-filter:blur(6px);cursor:pointer;user-select:none;transition:color .2s,border-color .2s,opacity .3s}
.handle:hover,.handle:focus-visible{color:var(--fg);border-color:var(--accent);outline:none}
.handle b{color:var(--accent);font-weight:600}
.handle.top{top:env(safe-area-inset-top,0px);left:50%;transform:translateX(-50%);border-top:0;border-radius:0 0 10px 10px;padding:9px 16px 8px}
.handle.right{right:max(0px,env(safe-area-inset-right,0px));top:50%;transform:rotate(-90deg) translate(50%,-100%);transform-origin:right top;border-right:0;border-radius:10px 10px 0 0;padding:9px 16px 8px}
.handle .chev{font-size:10px;transition:transform .3s}
#stage.others .handle.right .chev{transform:rotate(180deg)}
.handle .alt{display:none} #stage.others .handle .alt{display:inline} #stage.others .handle .def{display:none}
.handle .zg{font-size:14px;line-height:1}
.handle .zg::before{content:"⊖"} #stage.zoomed .handle .zg::before{content:"⊕"}

.hint{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;font-size:12.5px;color:var(--muted);background:rgba(11,13,18,.6);border:1px solid var(--line);border-radius:999px;padding:6px 14px;backdrop-filter:blur(6px);white-space:nowrap;pointer-events:none}
.hint b{color:var(--fg);font-weight:500}
@media (max-width:640px){
  .hint{font-size:11px;padding:5px 10px;white-space:normal;text-align:center;width:max-content;max-width:calc(100vw - 32px);border-radius:12px}
  .sheet{padding:24px 20px 18px}.orig{padding:18px 20px 14px}.orig-clip{padding-bottom:16px}.box{padding:18px 18px 16px}
}
@media (prefers-reduced-motion:reduce){.pane,.sheet,.handle,.rail,.box .more{transition:none}}
</style>

<div id="stage">
  <div class="center">
    <div class="pane pane-mine">
      <div class="zoomer" id="zoomer">
        <div class="orig-wrap" id="origWrap" aria-hidden="true">
          <div class="orig-clip">
            <section class="orig paper" id="orig" aria-label="Texte d'origine : article 4, alinéa 2">
              <div class="head"><span>Texte de la commission</span><span>Article 4 · alinéa 2</span></div>
              <div class="body"><p id="origText"></p></div>
              <p class="legend" id="origLegend"></p>
            </section>
          </div>
        </div>
        <div class="drum" id="drum" aria-label="Votre amendement"></div>
      </div>
    </div>
    <div class="pane pane-others" aria-label="Amendements des autres groupes">
      <div class="scroller" id="scroller"><div class="list" id="list"></div></div>
    </div>
  </div>

  <nav class="rail" id="rail" aria-label="Idées principales de votre amendement"></nav>

  <button class="handle top" id="hTop" type="button" aria-controls="origWrap" aria-pressed="false"><b>Article 4</b> texte d'origine <span class="zg" aria-hidden="true"></span></button>
  <button class="handle right" id="hRight" type="button" aria-pressed="false"><span class="def"><b id="nOthers">10</b> autres amendements</span><span class="alt"><b>Mon</b> amendement</span> <span class="chev">▲</span></button>

  <span class="hint"><b>Deux doigts haut / bas</b> : les idées · <b>pincer</b> : le texte d'origine · <b>vers la gauche</b> : les autres · <b>double-clic</b> : modifier</span>
</div>

<script>
(function(){
"use strict";
/* ---------- Données (fictives) ---------- */
const GROUPS = {
  PR:{name:"Progrès républicain", color:"#c07a00"}, SOL:{name:"Solidarité et logement", color:"#d13a30"}, ECO:{name:"Écologie urbaine", color:"#2a9d63"},
  UT:{name:"Union des territoires", color:"#3b82d6"}, LL:{name:"Libertés locales", color:"#e0671d"}, RC:{name:"Rassemblement des communes", color:"#7c5cd6"},
  GOUV:{name:"Gouvernement", color:"#9aa3b2"}, DC:{name:"Démocratie communale", color:"#2bb3b1"}, AR:{name:"Avenir rural", color:"#8fae3a"}, CP:{name:"Centre et progrès", color:"#d8699a"}
};
const AMENDEMENT = { groupe:"PR", numero:"N° 1 (brouillon)", article:"Article 4, alinéa 2", leadIn:"Rédiger ainsi l'alinéa 2 :",
  texte:"« Les communes de plus de 3 500 habitants doivent compter au moins 25 % de logements sociaux parmi les résidences principales d'ici 2030. En cas de manquement, le préfet peut prononcer un prélèvement sur les ressources fiscales de la commune. »" };
const ARTICLE = { titre:"Projet de loi portant diverses mesures pour l'accès au logement", num:"Article 4", vise:1,
  alineas:[
    "Le chapitre II du titre préliminaire du livre III du code de la construction et de l'habitation est ainsi modifié :",
    "Les communes de plus de 3 500 habitants doivent compter au moins 25 % de logements sociaux parmi les résidences principales d'ici 2030. En cas de manquement, le préfet peut prononcer un prélèvement sur les ressources fiscales de la commune.",
    "Le prélèvement mentionné à l'alinéa précédent est affecté au fonds national des aides à la pierre.",
    "Un décret en Conseil d'État précise les modalités d'application du présent article."
  ] };
// Idées principales repérées dans le texte (règles reprises de l'archive v0). Elles servent à surligner, jamais à noter.
const IDEAS = [
  {k:"seuil",    label:"Seuil",    re:/(?:plus de|au moins|supérieure? à|excédant)\s+\d[\d\s]*?\s*habitants/i},
  {k:"taux",     label:"Taux",     re:/\d{1,2}(?:[,.]\d+)?\s*(?:%|pour cent)(?:\s+de\s+logements(?:\s+(?:très\s+)?sociaux)?)?/i},
  {k:"echeance", label:"Échéance", re:/(?:(?:d['’]ici|avant|au plus tard en|à l['’]horizon)\s+)?\b20[2-9]\d\b/i},
  {k:"sanction", label:"Sanction", re:/prélèvement(?:\s+sur\s+les\s+ressources\s+fiscales(?:\s+de\s+(?:la\s+commune|l['’]établissement))?)?/i}
];
const OTHERS = [
  {g:"SOL", num:"212", titre:"Relever le taux à 30 % et avancer l'échéance à 2028", lead:"Rédiger ainsi l'alinéa 2 :", texte:"« Les communes de plus de 1 500 habitants doivent compter au moins 30 % de logements sociaux parmi les résidences principales d'ici 2028. En cas de manquement, le préfet prononce un prélèvement sur les ressources fiscales de la commune, majoré de 50 %. »"},
  {g:"ECO", num:"87", titre:"Porter le taux à 30 % dont un tiers de logements très sociaux", lead:"Rédiger ainsi l'alinéa 2 :", texte:"« Les communes de plus de 3 500 habitants doivent compter au moins 30 % de logements sociaux parmi les résidences principales d'ici 2030, dont un tiers de logements très sociaux. En cas de manquement, le préfet prononce un prélèvement sur les ressources fiscales de la commune. »"},
  {g:"UT", num:"340", titre:"Ramener le taux à 20 % sous réserve de la disponibilité foncière", lead:"Rédiger ainsi l'alinéa 2 :", texte:"« Les communes de plus de 5 000 habitants doivent compter au moins 20 % de logements sociaux parmi les résidences principales d'ici 2035, sous réserve de la disponibilité foncière constatée par le préfet. En cas de manquement, le préfet peut prononcer un prélèvement sur les ressources fiscales de la commune, après mise en demeure. »"},
  {g:"LL", num:"15", titre:"Transformer l'obligation en objectif indicatif et supprimer le prélèvement", lead:"Rédiger ainsi l'alinéa 2 :", texte:"« Les communes de plus de 3 500 habitants s'efforcent d'atteindre un objectif indicatif de 20 % de logements sociaux parmi les résidences principales d'ici 2035. Aucun prélèvement ne peut être prononcé à ce titre. »"},
  {g:"RC", num:"402", titre:"Exempter les communes rurales et relever le seuil à 10 000 habitants", lead:"Rédiger ainsi l'alinéa 2 :", texte:"« Les communes de plus de 10 000 habitants doivent compter au moins 25 % de logements sociaux parmi les résidences principales d'ici 2030. Les communes rurales en sont exemptées. En cas de manquement, le préfet peut prononcer un prélèvement sur les ressources fiscales de la commune, sauf si celle-ci justifie de l'absence de demande locale. »"},
  {g:"PR", num:"198", titre:"Reporter l'échéance à 2032 et prévoir une mise en demeure préalable", lead:"Rédiger ainsi l'alinéa 2 :", texte:"« Les communes de plus de 3 500 habitants doivent compter au moins 25 % de logements sociaux parmi les résidences principales d'ici 2032. En cas de manquement, le préfet peut prononcer un prélèvement sur les ressources fiscales de la commune, après mise en demeure restée sans effet pendant six mois. »", note:"collègue de votre groupe"},
  {g:"GOUV", num:"455", titre:"Soumettre le prélèvement à l'avis de la commission départementale de l'habitat", lead:"Rédiger ainsi l'alinéa 2 :", texte:"« Les communes de plus de 3 500 habitants doivent compter au moins 25 % de logements sociaux parmi les résidences principales d'ici 2030. En cas de manquement, le préfet peut prononcer un prélèvement sur les ressources fiscales de la commune, après avis de la commission départementale de l'habitat. »"},
  {g:"DC", num:"263", titre:"Apprécier le taux à l'échelle de l'intercommunalité", lead:"Rédiger ainsi l'alinéa 2 :", texte:"« Les établissements publics de coopération intercommunale de plus de 20 000 habitants doivent compter au moins 25 % de logements sociaux parmi les résidences principales d'ici 2030, répartis entre leurs communes membres. En cas de manquement, le préfet peut prononcer un prélèvement sur les ressources fiscales de l'établissement. »"},
  {g:"AR", num:"119", titre:"Relever le seuil à 7 000 habitants et exclure les communes de montagne", lead:"Rédiger ainsi l'alinéa 2 :", texte:"« Les communes de plus de 7 000 habitants doivent compter au moins 25 % de logements sociaux parmi les résidences principales d'ici 2030. Les communes classées en zone de montagne en sont exclues. En cas de manquement, le préfet peut prononcer un prélèvement sur les ressources fiscales de la commune. »"},
  {g:"CP", num:"377", titre:"Moduler le prélèvement selon l'effort de construction constaté", lead:"Compléter l'alinéa 2 par la phrase suivante :", texte:"« Le montant du prélèvement est réduit de moitié lorsque la commune justifie d'un rythme annuel de construction de logements sociaux supérieur à la moyenne départementale. »"}
];

const $=s=>document.querySelector(s);
const stage=$("#stage");
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- Écart mot à mot entre l'alinéa d'origine et mon texte ---------- */
// Les guillemets « » qui encadrent la rédaction proposée ne comptent pas comme un écart.
const ORIG=ARTICLE.alineas[ARTICLE.vise];
const isWs=t=>/^\s+$/.test(t), isQuote=t=>t==="«"||t==="»";
const norm=t=>t.replace(/’/g,"'").toLowerCase();
function tokenize(s){ return s.match(/\s+|[\p{L}\p{N}'’%]+|[^\s\p{L}\p{N}'’%]/gu)||[]; }
function lcsKeep(a,b){ // pour chaque mot, true s'il appartient à la plus longue sous-suite commune
  const n=a.length, m=b.length, ka=new Array(n).fill(false), kb=new Array(m).fill(false);
  if(n*m>4e6) return [ka,kb];
  const L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j]= a[i]===b[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  let i=0, j=0;
  while(i<n&&j<m){ if(a[i]===b[j]){ ka[i]=kb[j]=true; i++; j++; } else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
  return [ka,kb];
}
function marked(tokens,keep,tag){ // regroupe les mots modifiés contigus dans une seule balise
  let out="", open=false;
  const nextWord=k=>{ for(let x=k+1;x<tokens.length;x++) if(!isWs(tokens[x])) return x; return -1; };
  tokens.forEach((t,k)=>{
    if(isWs(t)){ if(open){ const nx=nextWord(k); if(nx<0||keep[nx]!==false){ out+=`</${tag}>`; open=false; } } out+=esc(t); return; }
    const changed=keep[k]===false;
    if(changed&&!open){ out+=`<${tag}>`; open=true; } else if(!changed&&open){ out+=`</${tag}>`; open=false; }
    out+=esc(t);
  });
  return open? out+`</${tag}>` : out;
}
function compare(orig,mine){
  const ta=tokenize(orig), tb=tokenize(mine), ia=[], ib=[];
  ta.forEach((t,k)=>{ if(!isWs(t)) ia.push(k); });
  tb.forEach((t,k)=>{ if(!isWs(t)&&!isQuote(t)) ib.push(k); });
  const [ka,kb]=lcsKeep(ia.map(k=>norm(ta[k])), ib.map(k=>norm(tb[k])));
  const keepA=[], keepB=[]; ia.forEach((k,x)=>keepA[k]=ka[x]); ib.forEach((k,x)=>keepB[k]=kb[x]);
  return { origHTML:marked(ta,keepA,"del"), mineHTML:marked(tb,keepB,"ins"), same:ka.every(Boolean)&&kb.every(Boolean), del:ka.some(v=>!v), ins:kb.some(v=>!v) };
}

/* ---------- Idées principales ---------- */
const labelOf=k=>(IDEAS.find(I=>I.k===k)||{label:""}).label;
function findIdeas(text){
  const out=[];
  for(const I of IDEAS){ const m=I.re.exec(text); if(m) out.push({k:I.k,start:m.index,end:m.index+m[0].length}); }
  out.sort((a,b)=>a.start-b.start);
  return out.filter((x,i,arr)=>!i||x.start>=arr[i-1].end);
}

/* ---------- Ma feuille : un tambour de faces ---------- */
// Face 0 = le texte seul ; face n = le même texte, n-ième idée surlignée. pos est continu : on fait défiler petit à petit, puis ça se cale.
const drum=$("#drum"), zoomer=$("#zoomer"), origWrap=$("#origWrap"), orig=$("#orig"), rail=$("#rail"), hTop=$("#hTop"), hRight=$("#hRight");
const GAP=24, TILT=62;
let faces=[], keys=[], pos=0, raw=0, z=0, editing=false, edIdx=-1;
const cur=()=>clamp(Math.round(pos),0,Math.max(0,faces.length-1));
const zoomed=()=>z>=.5;
const others=()=>stage.classList.contains("others");
const stepPx=()=>(faces[cur()]?faces[cur()].offsetHeight:300)+GAP;
const ro=new ResizeObserver(()=>layout());

function build(keepKey){
  keys=[null,...findIdeas(AMENDEMENT.texte).map(x=>x.k)];
  const G=GROUPS[AMENDEMENT.groupe], n=keys.length-1;
  const head=`<div class="head"><span class="group-badge" style="--g:${G.color}"><i></i>${esc(G.name)}</span><span>${esc(AMENDEMENT.numero+" · "+AMENDEMENT.article)}</span></div><p class="lead">${esc(AMENDEMENT.leadIn)}</p>`;
  drum.innerHTML=keys.map((k,i)=>`<section class="sheet paper face" data-i="${i}" aria-label="${i?`Idée ${i} sur ${n} : ${esc(labelOf(k))}`:"Texte de votre amendement"}">${head}<div class="body"><p class="txt"></p></div><div class="foot"></div></section>`).join("");
  faces=[...drum.children];
  rail.innerHTML=keys.map((k,i)=>{ const t=i?labelOf(k):"Texte entier"; return `<button type="button" data-i="${i}" aria-label="${esc(t)}" title="${esc(t)}"></button>`; }).join("");
  pos=raw=keepKey==null?0:Math.max(0,keys.indexOf(keepKey));
  faces.forEach((_,i)=>paint(i));
  ro.disconnect(); faces.forEach(f=>ro.observe(f));
  layout();
}
function marksFor(i,text){
  if(zoomed()) return compare(ORIG,text).mineHTML;
  const k=keys[i], id=k&&findIdeas(text).find(x=>x.k===k);
  if(!id) return esc(text);
  return esc(text.slice(0,id.start))+`<mark class="idea">${esc(text.slice(id.start,id.end))}</mark>`+esc(text.slice(id.end));
}
function footHTML(i){
  if(zoomed()) return `<span>Cliquer sur le texte pour le modifier : les écarts s'affichent en direct</span>`;
  if(!keys[i]) return `<span>Double-cliquer sur le texte pour le modifier</span>`;
  return `<span class="tag"><i></i><b>${esc(labelOf(keys[i]))}</b> idée ${i} sur ${keys.length-1}</span>`;
}
function paint(i){
  const f=faces[i]; if(!f||f.classList.contains("editing")) return;
  f.querySelector(".txt").innerHTML=marksFor(i,AMENDEMENT.texte);
  f.querySelector(".foot").innerHTML=footHTML(i);
}
function paintOrig(text){
  const d=compare(ORIG,text);
  $("#origText").innerHTML=d.origHTML;
  $("#origLegend").innerHTML= d.same ? "Votre amendement reprend cet alinéa à l'identique. Modifiez votre texte : les écarts apparaissent ici en direct."
    : [d.del?`<del>barré</del> : ce que votre amendement supprime`:"", d.ins?`<ins>surligné</ins> dans votre texte : ce qu'il ajoute`:""].filter(Boolean).join(" · ");
}
// la face du dessus bascule en arrière (pivot sur son bord bas), celle du dessous attend, inclinée (pivot sur son bord haut)
function layout(){
  if(!faces.length) return;
  const c=cur(), H=faces[c].offsetHeight;
  drum.style.height=H+"px";
  faces.forEach((f,i)=>{
    const d=i-pos, ad=Math.abs(d);
    f.style.transformOrigin= d<0 ? "50% 100%" : "50% 0%";
    f.style.transform=`translateY(${(d*(H+GAP)).toFixed(1)}px) rotateX(${(-clamp(d,-1,1)*TILT).toFixed(2)}deg)`;
    let op= ad<=1 ? 1-.55*ad : Math.max(0,.45*(2-ad));
    if(i!==c) op*= editing ? 0 : 1-z;
    f.style.opacity=op.toFixed(3);
    f.style.visibility= op<.02 ? "hidden" : "";
    f.style.zIndex=String(100-Math.round(ad*10));
    f.classList.toggle("cur",i===c); f.setAttribute("aria-hidden",String(i!==c));
  });
  [...rail.children].forEach((b,i)=>{ b.classList.toggle("on",i===c); b.setAttribute("aria-current",i===c?"true":"false"); });
}
let pRaf=0;
function animPos(t){
  cancelAnimationFrame(pRaf); raw=t;
  if(reduced){ pos=t; layout(); return; }
  const tick=()=>{ pos+=(t-pos)*.2; if(Math.abs(t-pos)<.002){ pos=t; layout(); return; } layout(); pRaf=requestAnimationFrame(tick); };
  pRaf=requestAnimationFrame(tick);
}
function rubber(v){ const m=faces.length-1; return v<0 ? v*.3 : v>m ? m+(v-m)*.3 : v; }
function snapPos(start,v){ // un petit mouvement suffit à passer à l'idée suivante ; un geste ample peut en sauter plusieurs
  const moved=pos-start; let t=start;
  if(Math.abs(moved)>.12||Math.abs(v)>1.2){ const proj=Math.round(pos+v*.12); t= moved+v*.1>0 ? Math.max(start+1,proj) : Math.min(start-1,proj); }
  animPos(clamp(t,0,faces.length-1));
}

/* ---------- Dézoom : l'alinéa d'origine ---------- */
function setZ(v){
  const was=zoomed(); z=clamp(v,0,1);
  origWrap.style.gridTemplateRows=z.toFixed(3)+"fr";
  orig.style.opacity=z.toFixed(3);
  orig.style.transform=`translateY(${(-28*(1-z)).toFixed(1)}px)`;
  zoomer.style.transform=`scale(${(1-.1*z).toFixed(4)})`;
  if(zoomed()!==was){
    stage.classList.toggle("zoomed",zoomed()); origWrap.setAttribute("aria-hidden",String(!zoomed())); hTop.setAttribute("aria-pressed",String(zoomed()));
    faces.forEach((_,i)=>paint(i)); if(editing) onEdit();
  }
  layout();
}
let zRaf=0;
function animZ(t){
  cancelAnimationFrame(zRaf);
  if(Math.abs(pos-cur())>.001) animPos(cur());
  if(reduced){ setZ(t); return; }
  const tick=()=>{ const n=z+(t-z)*.2; if(Math.abs(t-n)<.004){ setZ(t); return; } setZ(n); zRaf=requestAnimationFrame(tick); };
  zRaf=requestAnimationFrame(tick);
}
function snapZ(z0){ animZ(z0<.5 ? (z>.2?1:0) : (z<.8?0:1)); }

/* ---------- Édition en place ---------- */
// position du curseur dans le texte affiché, à l'endroit du clic
function caretOffset(e,root){
  let r=null;
  if(document.caretPositionFromPoint){ const p=document.caretPositionFromPoint(e.clientX,e.clientY); if(p){ r=document.createRange(); r.setStart(p.offsetNode,p.offset); } }
  else if(document.caretRangeFromPoint){ r=document.caretRangeFromPoint(e.clientX,e.clientY); }
  if(!r||!root||!root.contains(r.startContainer)) return null;
  const pre=document.createRange(); pre.selectNodeContents(root); pre.setEnd(r.startContainer,r.startOffset);
  return pre.toString().length;
}
function fit(){ const ta=$("#edText"); if(!ta) return; ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px"; }
function onEdit(){
  const ta=$("#edText"); if(!ta) return;
  const text=ta.value;
  $("#edMirror").innerHTML=marksFor(edIdx,text)+(text.endsWith("\n")?" ":"");
  paintOrig(text); fit(); layout();
}
function openEditor(e){
  if(editing||others()) return;
  const c=cur(); if(Math.abs(pos-c)>.05) return;
  const f=faces[c], off=e?caretOffset(e,f.querySelector(".txt")):null;
  editing=true; edIdx=c; stage.classList.add("editing"); f.classList.add("editing");
  f.querySelector(".body").innerHTML=`<div class="ed"><div class="mirror" id="edMirror" aria-hidden="true"></div><textarea id="edText" aria-label="Texte de l'amendement" spellcheck="false" rows="1"></textarea></div>`;
  f.querySelector(".foot").innerHTML=`<span>Échap pour annuler · Ctrl+Entrée pour valider</span><button type="button" data-act="cancel">Annuler</button><button type="button" class="primary" data-act="ok">Valider</button>`;
  const ta=$("#edText"); ta.value=AMENDEMENT.texte;
  ta.addEventListener("keydown", e=>{ if(e.key==="Escape"){e.preventDefault();e.stopPropagation();closeEditor(false);} if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();closeEditor(true);} });
  ta.addEventListener("input", onEdit);
  onEdit();
  ta.focus({preventScroll:true}); const p=off==null?ta.value.length:off; ta.setSelectionRange(p,p);
}
function closeEditor(commit){
  if(!editing) return;
  const v=$("#edText").value.trim(), key=keys[edIdx];
  editing=false; edIdx=-1; stage.classList.remove("editing");
  if(commit&&v) AMENDEMENT.texte=v;
  build(key); paintOrig(AMENDEMENT.texte); // les idées peuvent avoir bougé : on reste sur la même si elle existe encore
}
drum.addEventListener("click", e=>{
  const f=e.target.closest(".face"); if(!f) return;
  const act=e.target.closest("button[data-act]"); if(act){ closeEditor(act.dataset.act==="ok"); return; }
  const i=+f.dataset.i;
  if(i!==cur()){ if(!editing) animPos(i); return; }
  if(zoomed()&&e.target.closest(".body")) openEditor(e); // face au texte d'origine, un simple clic suffit
});
drum.addEventListener("dblclick", e=>{ const f=e.target.closest(".face"); if(f&&+f.dataset.i===cur()&&e.target.closest(".body")) openEditor(e); });
rail.addEventListener("click", e=>{ const b=e.target.closest("button"); if(b&&!editing) animPos(+b.dataset.i); });

/* ---------- Les autres : boîtes papier ---------- */
const list=$("#list"), scroller=$("#scroller");
$("#nOthers").textContent=String(OTHERS.length);
list.innerHTML=`<div class="title">Article 4, alinéa 2 · ${OTHERS.length} autres amendements</div>`+OTHERS.map((o,i)=>{ const G=GROUPS[o.g]; return `<section class="box paper" data-i="${i}" aria-label="${esc(G.name)}, amendement ${o.num}">
  <div class="head"><span class="group-badge" style="--g:${G.color}"><i></i><span class="name">${esc(G.name)}</span></span><span class="num">N° ${o.num}${o.note?` · ${esc(o.note)}`:""}</span><button class="more" type="button" aria-expanded="false" aria-label="Afficher l'amendement">+</button></div>
  <p class="objet">${esc(o.titre)}</p>
  <div class="detail"><p class="lead">${esc(o.lead)}</p><div class="body"><p>${esc(o.texte)}</p></div><div class="meta">${esc(o.titre)}</div></div>
</section>`; }).join("");

let y=0, vy=0, drag=null, raf=null, lastT=0;
function maxY(){ return Math.max(0, list.offsetHeight - scroller.clientHeight); }
function setY(v){ y=Math.max(-40, Math.min(maxY()+40, v)); list.style.transform=`translateY(${-y}px)`; }
function settle(){
  cancelAnimationFrame(raf);
  const step=()=>{
    const m=maxY();
    if(y<0){ vy=0; setY(y+(0-y)*.2); if(Math.abs(y)<.5) setY(0); else raf=requestAnimationFrame(step); return; }
    if(y>m){ vy=0; setY(y+(m-y)*.2); if(Math.abs(y-m)<.5) setY(m); else raf=requestAnimationFrame(step); return; }
    if(Math.abs(vy)>.2){ setY(y+vy); vy*=.94; raf=requestAnimationFrame(step); }
  };
  raf=requestAnimationFrame(step);
}
scroller.addEventListener("pointerdown", e=>{ cancelAnimationFrame(raf); drag={y:e.clientY,x:e.clientX,startY:y,moved:false,box:e.target.closest(".box"),more:!!e.target.closest(".more")}; vy=0; lastT=performance.now(); scroller.setPointerCapture(e.pointerId); });
scroller.addEventListener("pointermove", e=>{
  if(!drag) return;
  const dy=e.clientY-drag.y, dx=e.clientX-drag.x;
  if(!drag.moved && Math.abs(dy)+Math.abs(dx)>5) drag.moved=true;
  if(!drag.moved) return;
  if(Math.abs(dx)>Math.abs(dy)*1.6 && dx>70){ drag=null; scroller.classList.remove("grabbing"); setOthers(false); return; }
  scroller.classList.add("grabbing");
  const now=performance.now(), prev=y; setY(drag.startY-dy);
  vy=(y-prev)/Math.max(1,(now-lastT))*16; lastT=now;
});
function endDrag(){
  if(!drag) return; const d=drag; drag=null; scroller.classList.remove("grabbing");
  if(d.moved){ settle(); return; }
  if(d.box && d.more) toggleBox(d.box);
}
scroller.addEventListener("pointerup", endDrag); scroller.addEventListener("pointercancel", ()=>{ drag=null; scroller.classList.remove("grabbing"); settle(); });
scroller.addEventListener("wheel", e=>{
  if(e.ctrlKey) return; // pincer : laissé à la scène
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY)) return; // horizontal : laissé au geste de la scène
  e.preventDefault(); cancelAnimationFrame(raf); vy=0; setY(y+e.deltaY); settle();
}, {passive:false});
scroller.addEventListener("keydown", e=>{ const b=e.target.closest(".box"); if(b && e.target.classList.contains("more") && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); toggleBox(b); } });
function toggleBox(box){
  const open=!box.classList.contains("open");
  box.classList.toggle("open",open); const m=box.querySelector(".more"); m.setAttribute("aria-expanded",String(open)); m.setAttribute("aria-label", open?"Replier l'amendement":"Afficher l'amendement");
  requestAnimationFrame(()=>{ const top=box.offsetTop, bottom=top+box.offsetHeight, vh=scroller.clientHeight; if(bottom-y>vh) setY(Math.min(bottom-vh+16, top-16)); settle(); });
}
window.addEventListener("resize", ()=>{ setY(y); settle(); fit(); layout(); });

/* ---------- Volets ---------- */
function setOthers(on){ if(on && editing) closeEditor(false); stage.classList.toggle("others",on); hRight.setAttribute("aria-pressed",String(on)); if(on){ animZ(0); setY(y); } }
hTop.addEventListener("click", ()=>animZ(zoomed()?0:1));
hRight.addEventListener("click", ()=>setOthers(!others()));
window.addEventListener("keydown", e=>{
  if(editing) return;
  if(e.key==="Escape"){ if(zoomed()) animZ(0); else setOthers(false); return; }
  if(others()||zoomed()||e.target.closest("button")&&e.key===" ") return;
  const m=faces.length-1;
  if(e.key==="ArrowDown"||e.key==="PageDown"){ e.preventDefault(); animPos(clamp(cur()+1,0,m)); }
  else if(e.key==="ArrowUp"||e.key==="PageUp"){ e.preventDefault(); animPos(clamp(cur()-1,0,m)); }
});

/* ---------- Gestes : doigt ou souris ---------- */
// un doigt : vertical = défiler les idées, horizontal = les autres ; deux doigts qui se rapprochent = dézoomer
const pts=new Map(); let g=null, pinch=null, suppressClick=false;
stage.addEventListener("pointerdown", e=>{
  suppressClick=false;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2&&!others()){
    if(g&&g.axis==="v") snapPos(g.start,0);
    g=null; const [a,b]=[...pts.values()]; pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:z}; cancelAnimationFrame(zRaf); return;
  }
  if(pts.size>1) return;
  if(e.target.closest(".handle,.scroller,.rail,button,textarea,.orig")) return;
  if(editing&&e.target.closest(".face.editing")) return;
  g={id:e.pointerId,x:e.clientX,y:e.clientY,axis:null,start:Math.round(pos),startPos:pos,ly:e.clientY,lt:performance.now(),v:0};
});
stage.addEventListener("pointermove", e=>{
  const p=pts.get(e.pointerId); if(p){ p.x=e.clientX; p.y=e.clientY; }
  if(pinch){ if(pts.size>=2){ const [a,b]=[...pts.values()]; setZ(pinch.z0+(1-Math.hypot(a.x-b.x,a.y-b.y)/pinch.d0)*2.2); } return; }
  if(!g||e.pointerId!==g.id) return;
  const dx=e.clientX-g.x, dy=e.clientY-g.y;
  if(!g.axis){
    if(Math.abs(dx)+Math.abs(dy)<8) return;
    g.axis=Math.abs(dy)>Math.abs(dx)?"v":"h"; suppressClick=true;
    if(g.axis==="v"){ if(others()||zoomed()||editing){ g=null; return; } cancelAnimationFrame(pRaf); g.startPos=pos; g.start=cur(); }
    try{ stage.setPointerCapture(e.pointerId); }catch(_){}
  }
  if(g.axis==="h"){ if(dx<-50){ setOthers(true); g=null; } else if(dx>50){ setOthers(false); g=null; } return; }
  const now=performance.now(), sp=stepPx();
  raw=g.startPos-dy/sp; pos=rubber(raw); layout();
  const dt=Math.max(1,now-g.lt); g.v=.7*g.v+.3*(-(e.clientY-g.ly)/sp)/(dt/1000); g.ly=e.clientY; g.lt=now;
});
function pointerEnd(e){
  pts.delete(e.pointerId);
  if(pinch){ if(pts.size<2){ snapZ(pinch.z0); pinch=null; } return; }
  if(g&&e.pointerId===g.id){ if(g.axis==="v") snapPos(g.start,g.v); g=null; }
}
stage.addEventListener("pointerup",pointerEnd); stage.addEventListener("pointercancel",pointerEnd);
stage.addEventListener("click", e=>{ if(suppressClick){ suppressClick=false; e.stopPropagation(); e.preventDefault(); } }, true);

/* ---------- Gestes : pavé tactile ---------- */
// Pincer arrive en « wheel » avec ctrlKey (Chrome, Edge, Firefox) ou en gesture* (Safari). Deux doigts : le sens est verrouillé au début du geste.
let zw=null, zwT=0, wg=null, wgT=0;
stage.addEventListener("wheel", e=>{
  const k=e.deltaMode===1?16:e.deltaMode===2?innerHeight:1, dx=e.deltaX*k, dy=e.deltaY*k;
  if(e.ctrlKey){
    e.preventDefault(); if(others()) return;
    if(!zw){ zw={z0:z}; cancelAnimationFrame(zRaf); if(Math.abs(pos-cur())>.001) animPos(cur()); }
    setZ(z+dy*.012);
    clearTimeout(zwT); zwT=setTimeout(()=>{ snapZ(zw.z0); zw=null; },160);
    return;
  }
  if(e.target.closest("textarea")) return;
  const vertical=Math.abs(dy)>=Math.abs(dx), inOrig=e.target.closest(".orig .body");
  if(e.target.closest(".scroller")&&vertical) return;
  if(inOrig&&vertical&&inOrig.scrollHeight>inOrig.clientHeight) return;
  e.preventDefault();
  if(!wg) wg={ax:0,ay:0,axis:null,start:cur(),done:false};
  clearTimeout(wgT); wgT=setTimeout(endWheel,150);
  let ddx=dx, ddy=dy;
  if(!wg.axis){
    wg.ax+=dx; wg.ay+=dy;
    if(Math.abs(wg.ax)+Math.abs(wg.ay)<6) return;
    wg.axis=Math.abs(wg.ax)>Math.abs(wg.ay)?"h":"v"; ddx=wg.ax; ddy=wg.ay;
    if(wg.axis==="v"){ cancelAnimationFrame(pRaf); raw=pos; wg.start=cur(); }
  }
  if(wg.axis==="h"){
    if(wg.done) return; wg.ax2=(wg.ax2||0)+ddx;
    if(wg.ax2>90){ setOthers(true); wg.done=true; } else if(wg.ax2<-90){ setOthers(false); wg.done=true; }
    return;
  }
  if(others()||zoomed()||editing) return;
  raw+=ddy/stepPx(); pos=rubber(raw); layout();
}, {passive:false});
function endWheel(){ if(wg&&wg.axis==="v"&&!others()&&!zoomed()&&!editing) snapPos(wg.start,0); wg=null; }
let sg=null;
stage.addEventListener("gesturestart", e=>{ e.preventDefault(); if(pinch||others()) return; sg={z0:z}; cancelAnimationFrame(zRaf); });
stage.addEventListener("gesturechange", e=>{ e.preventDefault(); if(sg&&!pinch) setZ(sg.z0+(1-e.scale)*2.2); });
stage.addEventListener("gestureend", e=>{ e.preventDefault(); if(sg){ snapZ(sg.z0); sg=null; } });

build(null); paintOrig(AMENDEMENT.texte); setZ(0);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layout);
})();
</script>
